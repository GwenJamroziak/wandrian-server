<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wandrian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --hp:#d94a4a; --stamina:#eae6d9; --xp:#9e59d9; --gold:#e0b23d;
  --bg:#12140f; --panel:#1c2018; --panel2:#242a1e; --border:#3a4230;
  --text:#e8e4d8; --muted:#9a9686; --accent:#4a7a3a;
  
  --good:#6fcf6f; --bad:#e0685f;
  
  --poison:#6fbf5a;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:Georgia,'Times New Roman',serif; background:radial-gradient(ellipse at 50% 20%,#2a3322,#0c0e09 75%);
  color:var(--text); min-height:100vh;
}

#app{max-width:1100px;margin:0 auto;padding:28px 24px 60px;transition:opacity .18s ease;}
h1,h2,h3{margin:0 0 6px;}
h1{font-size:2.4em;color:#fff;text-shadow:0 0 12px rgba(255,180,80,.35);}

h2{padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:12px;}
.subtitle{color:#f0d9a0;font-size:1.05em;margin-bottom:10px;}
.lore{color:#d8d4c8;max-width:600px;line-height:1.5em;margin-bottom:14px;}
.muted{color:var(--muted);font-size:.85em;}
.flavor{color:#c0b8a0;font-style:italic;margin:6px 0 14px;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.col{display:flex;flex-direction:column;}
.gap{gap:8px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:16px 0;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 16px;}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
button{
  font-family:inherit;background:#2a3020;color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:10px 14px;cursor:pointer;font-size:.95em;transition:.12s;
}
button:hover:not(:disabled){background:#3a4a2a;border-color:#5a7a3a;}
button:disabled{opacity:.45;cursor:not-allowed;}
button.play:hover:not(:disabled){background:#3a4a2a;border-color:#5a7a3a;}
button.danger:hover:not(:disabled){background:#5a2a24;border-color:#8a4a3a;}
button.wide{width:100%;}
input[type=text],input[type=password],input[type=email],input[type=number],select{
  font-family:inherit;background:#1a1c14;border:1px solid var(--border);color:var(--text);
  border-radius:5px;padding:8px 10px;font-size:.95em;
}
input[type=text]:focus,input[type=password]:focus,input[type=email]:focus,input[type=number]:focus,select:focus{
  outline:none;border-color:#5a7a3a;box-shadow:0 0 0 2px rgba(90,122,58,.3);
}
select{cursor:pointer;}

input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{
  -webkit-text-fill-color:var(--text)!important;
  -webkit-box-shadow:0 0 0px 1000px #1a1c14 inset!important;
  box-shadow:0 0 0px 1000px #1a1c14 inset!important;
  transition:background-color 9999s ease-in-out 0s;
  caret-color:var(--text);
}
input[type=checkbox]{
  appearance:none;-webkit-appearance:none;width:19px;height:19px;border:1px solid var(--border);
  border-radius:4px;background:#1a1c14;cursor:pointer;position:relative;vertical-align:middle;flex:none;
}
input[type=checkbox]:hover{border-color:#5a7a3a;}
input[type=checkbox]:checked{background:var(--accent);border-color:#5a7a3a;}
input[type=checkbox]:checked::after{content:"✓";position:absolute;top:-3px;left:2.5px;color:#eef7e4;font-size:14px;font-weight:bold;}
.modal-backdrop{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px 22px;max-width:420px;box-shadow:0 8px 30px rgba(0,0,0,.6);}
.modal-box .row{justify-content:flex-end;margin-top:16px;}
.social-login-btn{display:flex;align-items:center;justify-content:center;gap:8px;}

.bar-bg{background:#000;border-radius:4px;overflow:hidden;height:16px;border:1px solid rgba(255,255,255,.08);position:relative;}

.bar-fill{position:absolute;top:0;left:0;height:100%;transition:width .25s linear;}

.bar-hp-heal-preview{background:#a85a5a;}

.bar-stamina-heal-preview{background:#4a7a8a;}

.bar-fill-slow-tick{transition:width 1s linear;}

.bar-fill-xp-grow{transition:width 1s ease-out;}
.bar-hp{background:var(--hp);} .bar-stamina{background:var(--stamina);} .bar-xp{background:var(--xp);} .bar-gold{background:var(--gold);} .bar-brew{background:#c9a04a;}

.float-text-layer{position:absolute;top:-6px;left:0;width:100%;height:0;overflow:visible;pointer-events:none;z-index:5;}
.float-text{position:absolute;left:50%;transform:translateX(-50%);font-weight:bold;font-size:1.05em;white-space:nowrap;animation:floatUpFade 2s ease-out forwards;text-shadow:0 1px 3px rgba(0,0,0,.85);}
.float-text-item{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;font-weight:bold;white-space:nowrap;animation:floatUpFade 2s ease-out forwards;text-shadow:0 1px 3px rgba(0,0,0,.85);}
@keyframes floatUpFade{0%{transform:translate(-50%,0);opacity:1;}100%{transform:translate(-50%,-30px);opacity:0;}}
.flee-cooldown-wrap{position:relative;display:inline-flex;}
.flee-cooldown-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-90deg);pointer-events:none;}
.flee-cooldown-ring circle{fill:none;stroke-width:2.5;}
.flee-cooldown-ring .flee-cooldown-track{stroke:rgba(255,255,255,.25);}
.flee-cooldown-ring .flee-cooldown-fill{stroke:#fff;animation:fleeCooldownFill linear forwards;}
@keyframes fleeCooldownFill{from{stroke-dashoffset:50.27;}to{stroke-dashoffset:0;}}
.float-text-dmg{color:#ff5c5c;} .float-text-heal{color:#6cff6c;} .float-text-xp{color:#b46cff;}
.float-text-gold{color:var(--gold);} .float-text-crit{color:#ffb400;font-size:1.2em;} .float-text-block{color:#9fb0c3;}
.hp-text{color:var(--hp);} .stamina-text{color:var(--stamina);} .xp-text{color:var(--xp);} .gold-text{color:var(--gold);}

.bar-hp-poisoned{background:var(--poison);}
.hp-text-poisoned{color:var(--poison);}
.poison-icon{transition:opacity 1.1s ease; display:inline-block;}

.quad-damage-text{color:#7fd8e6;font-weight:bold;}
a.back-link,.linklike{color:#cbd9a0;cursor:pointer;text-decoration:underline;}

.char-sheet-entry-icon{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#cbd9a0;border-radius:50%;padding:3px;}
.char-sheet-entry-icon:hover{color:#e8e4c8;background:rgba(203,217,160,.15);}
.char-sheet-entry-icon.active{color:#9fd0ff;background:rgba(122,176,224,.18);cursor:default;}
.icon-badge{width:56px;height:56px;border-radius:50%;overflow:hidden;flex:none;background:#000;display:flex;align-items:center;justify-content:center;}
.icon-badge svg{width:100%;height:100%;}

.gear-tier-badge{position:absolute;top:-3px;left:-3px;min-width:13px;padding:0 2px;font-size:9px;line-height:13px;text-align:center;font-weight:bold;color:#fff;background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.35);border-radius:3px;pointer-events:none;z-index:2;}
.services{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0;}
.maze-wrap{display:flex;gap:20px;align-items:flex-start;}
.maze-grid{display:grid;gap:1px;background:#000;border:2px solid #333;position:relative;}
.maze-tile{width:34px;height:34px;transition:opacity .5s ease;}

.maze-mover{position:absolute;width:34px;height:34px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:16px;pointer-events:none;transition:left .18s linear,top .18s linear;z-index:5;}
.maze-mover-player{background:#e0c96a;}

.side-panel{min-width:260px;display:flex;flex-direction:column;gap:8px;}

.maze-mobile-arrows{display:none;}
@media (max-width:820px){
  .maze-mobile-arrows{
    display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px;margin-top:6px;
  }
  .maze-mobile-arrows button{width:44px;height:44px;font-size:1.2em;padding:0;}
  
  button{min-height:44px;box-sizing:border-box;}
  .linklike,.chat-toggle{display:inline-block;padding:8px 4px;min-height:44px;box-sizing:border-box;}
  input[type=checkbox]{width:24px;height:24px;}
}
hr{border:none;border-top:1px solid var(--border);margin:14px 0;}
.tooltip{position:relative;cursor:help;border-bottom:1px dotted var(--muted);}

.tooltip:hover::after,.tooltip.tooltip-open::after{
  content:attr(data-tip);position:absolute;bottom:120%;left:0;background:#000;color:#fff;
  padding:6px 8px;border-radius:4px;font-size:.8em;white-space:pre-line;width:220px;z-index:10;
  box-shadow:0 2px 8px rgba(0,0,0,.6);
}

.gear-compare-wrap{position:relative;display:inline-block;}
.gear-compare-wrap .compare-box{
  display:none;position:absolute;bottom:120%;left:225px;background:#000;color:#fff;
  padding:6px 8px;border-radius:4px;font-size:.8em;width:220px;z-index:11;
  box-shadow:0 2px 8px rgba(0,0,0,.6);border:1px solid var(--accent);
}

.gear-compare-wrap:hover .compare-box,.gear-compare-wrap.compare-open .compare-box{display:block;}

.gear-compare-wrap .hover-item-box{
  display:none;position:absolute;bottom:120%;left:0;background:#000;color:#fff;
  padding:6px 8px;border-radius:4px;font-size:.8em;width:220px;z-index:12;
  box-shadow:0 2px 8px rgba(0,0,0,.6);border:1px solid var(--border);
}
.gear-compare-wrap:hover .hover-item-box,.gear-compare-wrap.compare-open .hover-item-box{display:block;}

.compare-box .compare-title,.hover-item-box .compare-title{
  font-weight:bold;text-transform:uppercase;font-size:.82em;
  letter-spacing:.04em;margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid var(--border);
}

.compare-box .compare-title{color:var(--accent);}

.compare-box .stat-delta-good{color:var(--good);font-weight:bold;}
.compare-box .stat-delta-bad{color:var(--bad);font-weight:bold;}
.plank-row{display:flex;gap:8px;margin:6px 0;}
.plank-row button.locked-safe{background:#254a25;color:#9fe89f;border-color:#3a7a3a;}
.plank-row button.locked-fail{background:#4a2020;color:#e89f9f;border-color:#7a3a3a;}
.dim-note{color:#8a8676;font-size:.82em;}
.version-tag{position:fixed;bottom:24px;right:12px;color:rgba(230,225,210,.6);font-size:.8em;}
.changelog-link{position:fixed;bottom:8px;right:12px;color:rgba(180,210,150,.75);font-size:.75em;cursor:pointer;text-decoration:none;}
.changelog-link:hover{color:#cbd9a0;text-decoration:underline;}
::-webkit-scrollbar{width:10px;} ::-webkit-scrollbar-thumb{background:#3a4230;border-radius:5px;}
.top-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap;}
.top-bar-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.chat-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;color:#cbd9a0;}
.chat-toggle:hover{color:#e8e4d8;}

.chat-panel{position:fixed;top:0;right:0;height:100vh;width:50%;min-width:560px;max-width:840px;background:var(--panel);border-left:1px solid var(--border);box-shadow:-6px 0 20px rgba(0,0,0,.55);z-index:80;display:flex;flex-direction:column;padding:14px;}
.chat-private-msg{background:#2a3a20;border:1px solid #4a6a3a;border-radius:6px;padding:4px 8px;margin:2px 0;}

.chat-promotion-msg{background:#3a3220;border:1px solid #a8862f;border-radius:6px;padding:4px 8px;margin:2px 0;color:#f0d78a;}
.trash-btn{flex:0 0 auto;padding:8px 10px;}
.blocked-icon{opacity:.85;}
.dim-icon{opacity:.4;}
.bar-bg.compact{height:8px;}
.town-quadrants{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;}
.town-quadrants .panel{margin-bottom:0;height:100%;min-width:0;}
.town-quadrants > *{min-width:0;}
.gear-row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.gear-row-actions{display:flex;gap:6px;flex:0 0 auto;}
.rarity-Common{color:#9a9686;} .rarity-Uncommon{color:#e8e4d8;} .rarity-Rare{color:#5a9ae0;} .rarity-Epic{color:#e0c94a;} .rarity-Legendary{color:#d9902f;}
.plank-btn{min-width:52px;}
.plank-btn.safe{background:#254a25;color:#9fe89f;border-color:#3a7a3a;}
.plank-btn.unsafe{background:#4a2020;color:#e89f9f;border-color:#7a3a3a;}
.maze-overlay-grid{position:absolute;top:0;left:0;width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;z-index:20;opacity:1;transition:opacity 1.3s ease;text-align:center;}
.maze-overlay-grid.fade{opacity:0;}
.maze-overlay-text{color:#e8d24a;font-size:1.8em;font-weight:bold;letter-spacing:1.5px;text-shadow:0 0 18px rgba(232,210,74,.6);padding:0 10px;}

.venture-card{padding:18px;display:flex;flex-direction:column;gap:12px;min-height:64px;box-sizing:border-box;}
.venture-title{font-size:1.25em;font-weight:bold;}
.venture-row{align-items:stretch;}
.venture-fill{flex:1;}
.venture-clickable{cursor:pointer;transition:.12s;}
.venture-clickable:hover{background:#28331e;}
.venture-chevrons{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 10px;box-sizing:border-box;align-self:stretch;}
.venture-chevrons button{padding:2px 10px;font-size:1em;line-height:1;}
.class-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px;position:relative;}
.class-grid>*{min-width:0;}
.class-path-bg{background:var(--panel2);border:1px solid var(--border);border-radius:10px;}
.plank-btn{min-width:52px;border-radius:4px;}

.equip-doll{display:flex;flex-direction:column;gap:6px;align-items:center;}
.equip-doll-row{display:flex;gap:6px;justify-content:center;}

.equip-doll-row>.tile{flex:0 0 auto;width:76px;min-width:0;box-sizing:border-box;padding:8px 4px;text-align:center;}
.equip-doll-row>.tile button{padding:2px 4px;font-size:.8em;}

.panel-section-title{text-transform:uppercase;letter-spacing:.06em;font-size:.85em;padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid var(--border);}
.character-sheet-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:8px;margin:10px 0;}
.character-sheet-tab{background:none;}
.character-sheet-tab.active{background:var(--panel2);border-color:#7ab0e0;color:#9fd0ff;font-weight:bold;}
.attr-collapse-btn{background:none;border:none;color:var(--text);cursor:pointer;font-size:1.1em;padding:2px 6px;}
.attr-collapse-btn:hover{color:#cbd9a0;}
.stat-point-cta{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:var(--gold);color:#2a2210;font-weight:bold;border-radius:5px;cursor:pointer;font-size:1.1em;line-height:1;}
.stat-point-cta:hover{background:#f0c85a;}


.auth-page{
  position:fixed; inset:0; z-index:1; overflow-y:auto;
  background:#212c1b; color:#e8dfc8;
  font-family:'Merriweather',Georgia,serif;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
}
.auth-card{width:760px; max-width:100%;}
.auth-header{display:flex; align-items:center; margin-bottom:24px;}
.auth-logo{
  width:72px; height:72px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; margin-right:18px; flex:none; overflow:hidden;
}
.auth-logo svg{width:100%;height:100%;}
.auth-title{font-family:'Cinzel',serif; font-size:2.6rem; color:#fff; line-height:1.1; margin:0;}
.auth-subtitle{color:#d8b566; margin-top:6px; font-family:'Merriweather',Georgia,serif; font-size:1.05em;}
.auth-panel{border:1px solid rgba(214,194,133,.22); border-radius:10px; background:rgba(0,0,0,.15); padding:28px;}
.auth-panel h2{font-family:'Cinzel',serif; margin:0 0 14px; color:#fff; font-size:1.5em;}
.auth-panel p{line-height:1.7; margin:0 0 24px; color:#cfc6af;}
.auth-cta{
  display:block; width:100%; text-align:center; padding:16px 18px; background:#2f3a24;
  border:1px solid rgba(214,194,133,.28); border-radius:8px; color:#fff; font-weight:bold;
  font-family:'Merriweather',Georgia,serif; font-size:1em; cursor:pointer; transition:.15s;
}
.auth-cta:hover:not(:disabled){background:#3a492c; border-color:#d6c285;}
.auth-cta.secondary{background:transparent; font-weight:normal;}
.auth-cta.secondary:hover:not(:disabled){background:rgba(214,194,133,.08);}
.auth-input{
  width:100%; background:#1b2417; border:1px solid rgba(214,194,133,.28); color:#e8dfc8;
  border-radius:6px; padding:13px 14px; font-family:'Merriweather',Georgia,serif; font-size:.95em;
}
.auth-input:focus{outline:none; border-color:#cda95d; box-shadow:0 0 0 2px rgba(205,169,93,.25);}
.auth-input:-webkit-autofill,.auth-input:-webkit-autofill:hover,.auth-input:-webkit-autofill:focus{
  -webkit-text-fill-color:#e8dfc8!important;
  -webkit-box-shadow:0 0 0px 1000px #1b2417 inset!important;
  box-shadow:0 0 0px 1000px #1b2417 inset!important;
  transition:background-color 9999s ease-in-out 0s;
  caret-color:#e8dfc8;
}
.auth-divider{flex:1; height:1px; background:rgba(214,194,133,.25);}
.auth-back{color:#d8b566; cursor:pointer; text-decoration:underline; font-size:.9em;}
.auth-back:hover{color:#e8dfc8;}
.auth-footer{text-align:center; color:#8f917d; margin-top:20px; font-size:.9em;}
.auth-footer .auth-back{color:#8f917d;}
.auth-footer .auth-back:hover{color:#d8b566;}
.auth-status{min-height:1.3em; color:#e0a870; font-size:.88em;}
</style>
</head>

function hashHue(str){ let hh=0; for(let i=0;i<str.length;i++) hh=(hh*31+str.charCodeAt(i))>>>0; return hh%360; }
function monsterPortrait(monsterId, opts={}){
  const slain=!!opts.slain;
  if(slain && MONSTER_PORTRAITS_SLAIN[monsterId]) return MONSTER_PORTRAITS_SLAIN[monsterId];
  if(!slain && MONSTER_PORTRAITS[monsterId]) return MONSTER_PORTRAITS[monsterId];
  const hue=hashHue(monsterId||"?");
  const bodyColor=`hsl(${hue},45%,38%)`;
  const bellyColor=`hsl(${hue},35%,58%)`;
  const eyes = slain
    ? `<path d="M55,75 L70,90 M70,75 L55,90" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/><path d="M90,75 L105,90 M105,75 L90,90" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>`
    : `<circle cx="62" cy="80" r="7" fill="#1a1a1a"/><circle cx="98" cy="80" r="7" fill="#1a1a1a"/><circle cx="64" cy="78" r="2" fill="#fff"/><circle cx="100" cy="78" r="2" fill="#fff"/>`;
  const mouth = slain
    ? `<path d="M65,103 Q80,98 95,103" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="80" cy="112" rx="6" ry="9" fill="#c96a6a"/>`
    : `<path d="M65,105 Q80,116 95,105" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const dizzy = slain
    ? `<path d="M58,48 Q68,38 78,48 Q88,58 98,48" stroke="#e0c94a" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85"/><circle cx="58" cy="46" r="2.2" fill="#e0c94a"/><circle cx="98" cy="46" r="2.2" fill="#e0c94a"/>`
    : "";
  return `<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg"><ellipse cx="80" cy="95" rx="55" ry="48" fill="${bodyColor}"${slain?' opacity="0.7"':''}/><ellipse cx="80" cy="107" rx="34" ry="26" fill="${bellyColor}" opacity="0.6"/>${dizzy}${eyes}${mouth}</svg>`;
}

  MERCHANT_STOCK_SIZE:6,

  },
  
  
  
  
  
  
  
  
  MERCHANT_RARITY_PRICE_MULTIPLIER:{Legendary:1.0, Epic:0.75, Rare:0.5, Uncommon:0.25, Common:0.25},
  merchantGearPrice(inst){
    const band=this.MERCHANT_PRICE_BANDS[inst.rarity]||this.MERCHANT_PRICE_BANDS.Common;
    const [lo,hi]=band;
    const quality=IF.gearRollQuality(inst);
    const raw=lo+quality*(hi-lo);
    const mult=this.MERCHANT_RARITY_PRICE_MULTIPLIER[inst.rarity]!=null?this.MERCHANT_RARITY_PRICE_MULTIPLIER[inst.rarity]:1;
    return Math.max(1,Math.round(raw*mult));
  },
};

function clampi(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function clampf(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function randi(n){return Math.floor(Math.random()*n);}
function randRange(a,b){return a+Math.random()*(b-a);}
function randIntRange(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function round2(v){return Math.round(v*100)/100;}
function trimDecimal(v){let s=round2(v).toFixed(2); if(s.indexOf(".")!==-1){ s=s.replace(/0+$/,""); s=s.replace(/\.$/,""); } return s;}
function pick(arr){return arr[randi(arr.length)];}

  pickHerbForNode(areaLevel=1){
    if(Math.random()<Balance.RARE_HERB_CHANCE){
      const pool=DL.rareHerbIdsForAreaLevel(areaLevel);

    }

  },

  pickRandomMonsterForArea(areaLevel){
    // v0.22.1 (Part A2a): spawn gating now follows the new band system (MONSTER_BAND_INFO)

    let pool=MONSTERS.filter(m=>areaLevel>=(MONSTER_BAND_INFO[m.tier]||{minAreaLevel:1}).minAreaLevel);
    if(pool.length===0) pool=MONSTERS;
    return pick(pool);
  },
  
  
  
  
  
  
  
  
  
  
  rollLoot(tableId, mfPct=0){
    const table=LOOT_TABLES[tableId]||[];
    const rollOnce=()=>{
      if(table.length===0) return {type:"nothing"};
      let total=0; for(const e of table) total+=e.weight;
      if(total<=0) return {type:"nothing"};
      let roll=randi(total), cum=0;
      for(const e of table){cum+=e.weight; if(roll<cum) return e;}
      return {type:"nothing"};
    };
    const first=rollOnce();
    if(first.type!=="nothing" || !mfPct) return first;
    if(Math.random()<Math.min(0.9,mfPct/100)){
      const second=rollOnce();
      if(second.type!=="nothing") return second;
    }
    return first;
  },
};

  },
  
  
  classCanUseWeaponType(classId, weaponType){

  },

  GEAR_CATEGORY_LABELS:{weapon:"Weapon",head:"Head",shoulders:"Shoulders",armor:"Armor",pants:"Pants",gloves:"Gloves",boots:"Boots",ring1:"Ring",ring2:"Ring",amulet:"Amulet",belt:"Belt"},
  
  
  
  
  
  categoryLabel(inst){
    if(!inst||!inst.slot) return "";
    const base=this.GEAR_CATEGORY_LABELS[inst.slot]||this.slotLabel(inst.slot);
    if(inst.slot==="weapon"){
      const wt=this.weaponTypeForInstance(inst);
      if(wt) return `${base}, ${this.WEAPON_TYPE_LABELS[wt]}`;
    }
    return base;
  },

  
  
  
  generate(tier, slot="", forcedRarityName=""){
    let chosenSlot=slot;
    if(!chosenSlot||!this.BASE_NAMES[chosenSlot]) chosenSlot=pick(this.GENERATION_SLOTS);
    const baseName=pick(this.BASE_NAMES[chosenSlot]||["Item"]);
    
    
    
    const rarity=forcedRarityName ? (Balance.RARITY_TABLE.find(r=>r.name===forcedRarityName)||Balance.rollRarity()) : Balance.rollRarity(PS.getMagicFind());
    const slotCount=rarity.slots;
    let pool=[...Balance.AFFIX_POOL];
    shuffle(pool);
    
    
    
    
    
    if(chosenSlot==="weapon" && Math.random()<Balance.WEAPON_DAMAGE_GUARANTEE_CHANCE && pool.includes("damage")){
      pool=pool.filter(s=>s!=="damage");
      pool.unshift("damage");
    }
    let element="";
    if(Math.random()<Balance.ELEMENT_ITEM_CHANCE){
      element=pick(Balance.ELEMENT_IDS);
      const biasStat=Balance.ELEMENT_AFFIX_BIAS[element]||"";
      if(biasStat && pool.includes(biasStat)){
        pool=pool.filter(s=>s!==biasStat);
        pool.unshift(biasStat);
      }
    }
    const affixCount=Math.min(slotCount,pool.length);
    const affixes=[];
    for(let i=0;i<affixCount;i++){
      const stat=pool[i];
      let value=Balance.rollAffixValue(stat,tier);
      if(chosenSlot==="weapon" && stat==="damage") value=round2(value*Balance.WEAPON_DAMAGE_AFFIX_MULT);
      affixes.push({stat, value});
    }
    if(Math.random()<Balance.EYESIGHT_AFFIX_CHANCE){
      affixes.push({stat:"eyesight", value:2});
    }
    return {instance_id:`${Date.now()}_${randi(999999)}`, slot:chosenSlot, base_name:baseName, tier, rarity:rarity.name, affixes, element};

  displayName(inst){
    const rarityLabel=Balance.rarityDisplayName(inst.rarity);
    let name=`${rarityLabel?rarityLabel+" ":""}${Balance.itemTierAdjective(inst.tier)} ${inst.base_name}`;
    if(inst.element) name+=` of ${Balance.ELEMENT_DISPLAY_NAMES[inst.element]||inst.element}`;
    
    
    
    
    if(this.affixTotal(inst,"eyesight")>0) name+=" of Vision";
    return name;

  affixTotal(inst,stat){
    if(!inst||!inst.affixes) return 0;
    let total=0; for(const a of inst.affixes) if(a.stat===stat) total+=a.value;
    return total;
  },
  slotCount(inst){return (inst.affixes||[]).length;},
  
  
  
  
  
  gearRollQuality(inst){
    const statAffixes=(inst.affixes||[]).filter(a=>Balance.AFFIX_POOL.includes(a.stat));
    if(statAffixes.length===0) return 0;
    let total=0;
    for(const a of statAffixes){
      const max=Balance.affixMaxForTier(a.stat,inst.tier);
      total+=max>0?Math.min(1,a.value/max):0;
    }
    return total/statAffixes.length;
  },
  
  
  
  
  
  
  
  
  
  
  
  
  isAffixMaxRoll(a, inst){
    if(!inst || a.stat==="eyesight") return false;
    const baseMax=Balance.affixMaxForTier(a.stat, inst.tier);
    if(baseMax<=0) return false;
    const effectiveMax=(inst.slot==="weapon" && a.stat==="damage") ? round2(baseMax*Balance.WEAPON_DAMAGE_AFFIX_MULT) : baseMax;
    return a.value>=effectiveMax;
  },
  
  affixIsPercent(stat){return ["crit","gold_find","xp_find","poison_resist","magic_find","block_chance","flee_chance","attack_speed"].includes(stat);},
  affixLabel(stat){
    switch(stat){
      case "damage": return "Damage"; case "hp": return "Hit Points";
      
      
      
      case "crit": return "Critical Strike Chance";
      case "armor": return "Armor"; case "regen": return "Health Regeneration"; case "stamina_regen": return "Stamina Regeneration"; case "gold_find": return "Gold Found";
      case "xp_find": return "Experience Gained"; case "stamina_max": return "Stamina"; case "eyesight": return "Eyesight";
      case "strength": return "Strength"; case "dexterity": return "Dexterity"; case "vitality": return "Vitality"; case "intelligence": return "Intelligence";
      case "poison_resist": return "Poison Resistance";
      case "magic_find": return "Magic Find";
      
      case "block_chance": return "Block Chance";
      
      case "flee_chance": return "Increased chance to flee";
      
      case "crit_multiplier": return "Critical Strike Multiplier";
      
      case "attack_speed": return "Increased Attack Speed";
      default: return stat;
    }
  },
  
  
  
  
  
  
  formatAffix(a, inst){
    const label=this.affixLabel(a.stat);
    const diamond=this.isAffixMaxRoll(a,inst)?" \u{1F48E}":"";
    if(a.stat==="crit_multiplier") return `+${(a.value/100).toFixed(2)} ${label}${diamond}`;
    if(this.affixIsPercent(a.stat)) return `+${trimDecimal(a.value)}% ${label}${diamond}`;
    return `+${trimDecimal(a.value)} ${label}${diamond}`;
  },
  tooltipText(inst){
    
    
    const lines=[`${this.displayName(inst)} (${tierRomanNumeral(inst.tier)})`];
    
    
    lines.push(`Requires Level ${Balance.tierLevelRequirement(inst.tier)}`);
    
    
    
    const weaponType=this.weaponTypeForInstance(inst);
    const restrictedTo=weaponType?this.WEAPON_TYPE_CLASS_RESTRICTIONS[weaponType]:null;
    if(restrictedTo) lines.push(`Class: ${restrictedTo.map(id=>DL.getClass(id).display_name||id).join(", ")}`);
    
    
    
    
    
    
    
    
    
    if(inst.affixes && inst.affixes.length>0) lines.push("───────────────");
    for(const a of inst.affixes) lines.push(this.formatAffix(a,inst));
    return lines.join("\n");
  },
  affixSummary(inst){
    if(!inst.affixes||inst.affixes.length===0) return "(no bonuses)";
    return inst.affixes.map(a=>this.formatAffix(a,inst)).join(", ");
  },
  reroll(inst){
    const newAffixes=inst.affixes.map(a=>{
      let value=Balance.rollAffixValue(a.stat,inst.tier);
      if(inst.slot==="weapon" && a.stat==="damage") value=round2(value*Balance.WEAPON_DAMAGE_AFFIX_MULT);
      return {stat:a.stat, value};
    });
    return {...inst, affixes:newAffixes};
  },
};

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=randi(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];}}

const Net = {

  // recently CONFIRMED by the server (via login, a save response, or any of the atomic
  // reroll/reforge/refine/auction/trial endpoints). PS.saveGame()'s autosave payload no
  // longer reports its absolute local gold total -- it reports the DELTA between the
  // current local total and this baseline, and the server ADDS that delta to whatever its
  // own current balance actually is (see setAuthoritativeGold() and _sendCharacterSave()
  // below). This is what stops a second, stale browser tab's full-character autosave from
  // ever re-adding gold this tab already knows was spent: an absolute "here's my total"
  // report can silently clobber a fresher server value, but a relative "I spent X since we
  // last agreed" report can only ever be applied on top of the truth, never replace it.

  _sendCharacterSave(slot,data,state){
    // v0.22.1 (Part B2): gold_delta is computed HERE, right before the actual network send,
    // not back when saveGame() first built `data` -- this matters for coalesced saves (see
    // saveCharacter() above): if a second local save gets queued while the first is still
    // in flight, this recompute picks up whatever goldSyncBaseline the FIRST save's response
    // already advanced it to, so the second save's delta only ever covers gold spent SINCE
    // that response, instead of double-reporting gold the first request already applied.
    // Sent alongside (not replacing) the pre-existing `data.gold` field for backward-
    // compatible logging only -- the server now ignores `gold` entirely and applies
    // `gold_delta` atomically against its OWN current balance (see server.js).

        return res;
      })
      .catch(e=>{
        if(useKeepalive){
          
          
          return attempt(false);
        }
        console.warn("save to server failed",e);
      });
    attempt(true).finally(()=>{
      const next=state.latest;

    });

  ensureChat(){
    if(this.chatSocket || !this.online) return;
    const wsProto = location.protocol==="https:" ? "wss://" : "ws://";
    const base = this.apiBase();
    const wsUrl = base ? base.replace(/^http/,"ws")+"/ws/chat?token="+this.token : wsProto+location.host+"/ws/chat?token="+this.token;
    try{
      const ws=new WebSocket(wsUrl);
      ws.onmessage=(ev)=>{
        try{
          const msg=JSON.parse(ev.data);
          if(msg.type==="history") this.chatMessages=msg.messages||[];
          else if(msg.type==="chat"){ this.chatMessages.push(msg); if(this.chatMessages.length>200) this.chatMessages.shift(); }
          else if(msg.type==="private_history"){ this.privateMessages=this.privateMessages.concat(msg.messages||[]); }
          else if(msg.type==="private"){
            this.privateMessages.push(msg);









            if(typeof msg.gold==="number") this.accountGold=msg.gold;
          }
          
          
          
          else if(msg.type==="combat_tick"){ applyCombatTickPush(msg.session_id,msg); return; }
          if(GF.screen==="chat" || GF.chatOpen) render();
        }catch(e){}
      };
      ws.onclose=()=>{ if(this.chatSocket===ws) this.chatSocket=null; };
      this.chatSocket=ws;
    }catch(e){ console.warn("chat connect failed",e); }
  },
  sendChat(message){
    if(this.chatSocket && this.chatSocket.readyState===WebSocket.OPEN) this.chatSocket.send(JSON.stringify({type:"chat",message}));
  },
};

    while(this.xp>=this.xp_to_next && this.level<Balance.LEVEL_CAP){
      this.xp-=this.xp_to_next; this.level++; this.xp_to_next=Balance.xpRequiredForLevel(this.level);
      this.unspent_stat_points+=Balance.STAT_POINTS_PER_LEVEL;
      
      
      
      
      
      
      
      this.current_hp=this.getMaxHp(); leveled=true;
    }
    if(this.level>=Balance.LEVEL_CAP) this.xp=0;
    return leveled;

  applyDeathPenalty(){
    // v0.22.1 (Part B1, credit: Gwen): softcore death is now XP-penalty-only -- no gold loss,
    // no item loss. Balance.DEATH_GOLD_LOSS_MIN_PCT/MAX_PCT and the item-loss constants/helpers
    // below (_rollDeathItemLosses/_loseOneRandomItem) are kept in place but no longer called
    // from here, so existing tests asserting on those constants' VALUES still pass unchanged.
    const targetXpLoss=Math.round((this.xp_to_next||0)*Balance.DEATH_XP_LOSS_PCT);
    const xpLost=Math.min(this.xp,targetXpLoss);
    this.xp=Math.max(0,this.xp-targetXpLoss);
    this.current_hp=Balance.DEATH_WAKE_HP;
    this.resetKillStreak();
    return {goldLost:0,itemsLost:[],xpLost};
  },
  
  
  
  
  
  _rollDeathItemLosses(){
    const lost=[];
    if(Math.random()>=Balance.DEATH_ITEM_LOSS_CHANCE) return lost;
    let count=1;
    while(Math.random()<0.5 && count<Balance.DEATH_ITEM_LOSS_MAX_COUNT) count++;
    for(let i=0;i<count;i++){
      const desc=this._loseOneRandomItem();
      if(!desc) break; 
      lost.push(desc);
    }
    return lost;
  },
  
  
  
  
  _loseOneRandomItem(){
    const equippedSlots=IF.EQUIPPED_SLOT_KEYS.filter(s=>this.equipped[s]);
    const consumableIds=Object.keys(this.consumables).filter(k=>this.consumables[k]>0);
    const nonEquippedCount=this.gear_instances.length+consumableIds.length;
    const pools=[];
    if(equippedSlots.length) pools.push({weight:Balance.DEATH_EQUIPPED_LOSS_WEIGHT,kind:"equipped"});
    if(nonEquippedCount) pools.push({weight:Balance.DEATH_BACKPACK_LOSS_WEIGHT,kind:"backpack"});
    if(pools.length===0) return null;
    const totalWeight=pools.reduce((s,p)=>s+p.weight,0);
    let r=Math.random()*totalWeight, chosen=pools[pools.length-1].kind;
    for(const p of pools){ if(r<p.weight){ chosen=p.kind; break; } r-=p.weight; }
    
    
    
    
    
    if(chosen==="equipped"){
      const slot=equippedSlots[randi(equippedSlots.length)];
      const inst=this.equipped[slot];
      this.equipped[slot]=null;
      return {text:`${IF.displayName(inst)} (equipped)`, rarity:inst.rarity};
    }
    
    
    const backpackChoices=this.gear_instances.map((inst,idx)=>({type:"gear",idx})).concat(consumableIds.map(id=>({type:"consumable",id})));
    if(backpackChoices.length===0) return null;
    const choice=backpackChoices[randi(backpackChoices.length)];
    if(choice.type==="gear"){
      const inst=this.gear_instances[choice.idx];
      this.gear_instances.splice(choice.idx,1);
      return {text:IF.displayName(inst), rarity:inst.rarity};
    }
    const qtyLost=this.consumables[choice.id];
    delete this.consumables[choice.id];
    return {text:`${DL.getItem(choice.id).name} x${qtyLost}`, rarity:null};
  },

  _queueGradualHeal(arr,amount,headroom,totalTicks){
    if(headroom<=0) return;
    if(arr.length>0){
      const existing=arr[0];
      const currentPending=existing.perTick*existing.ticksLeft;
      const newPending=Math.min(headroom,currentPending+amount);
      existing.ticksLeft=existing.perTick>0?newPending/existing.perTick:0;
    } else {
      const rate=amount/totalTicks;
      const pending=Math.min(headroom,amount);
      arr.push({perTick:rate, ticksLeft: rate>0?pending/rate:0});
    }
  },
  useConsumable(itemId){
    if(!this.canUseConsumable(itemId)) return false;
    const item=DL.getItem(itemId); let used=false;
    const totalTicks=Balance.POTION_HEAL_DURATION_MS/Balance.POTION_HEAL_TICK_MS;
    
    
    
    
    
    
    
    
    if((item.heal_amount||0)>0 && (this.current_hp+this.getPendingHealAmount())<this.getMaxHp()){
      this._queueGradualHeal(this.active_heals,item.heal_amount,this.getMaxHp()-this.current_hp,totalTicks);
      used=true;
    }
    
    
    if((item.stamina_amount||0)>0 && (this.current_stamina+this.getPendingStaminaHealAmount())<this.getMaxStamina()){
      this._queueGradualHeal(this.active_stamina_heals,item.stamina_amount,this.getMaxStamina()-this.current_stamina,totalTicks);
      used=true;
    }
    if((item.eyesight_steps||0)>0){ this.eyesight_potion_steps_left=item.eyesight_steps; used=true; }
    
    
    
    if(item.buff_type){ this.applyTempBuff(item.buff_type,item.buff_amount,item.buff_duration_ms||Balance.POTION_BUFF_DURATION_MS); used=true; }
    
    if(item.cures_poison && this.isPoisoned()){ this.curePoison(); used=true; }






    if(item.reveals_maze){
      if(!(GF.screen==="maze" && GF.overworld_snapshot)) return false;
      if(this.clarity_charges_left<=0){
        if((this.consumables[itemId]||0)<1) return false;
        this._removeConsumableOne(itemId);
        this.clarity_charges_left=10;
      }
      const maze=GF.overworld_snapshot;
      for(const c of maze.cells) c.discovered=true;
      this.clarity_charges_left--;
      return true;
    }
    if(used) this._removeConsumableOne(itemId);
    return used;
  },
  canUseConsumable(itemId){
    const item=DL.getItem(itemId);
    if(item.reveals_maze){
      if(GF.screen!=="maze" || !GF.overworld_snapshot) return false;
      if(!GF.overworld_snapshot.cells.some(c=>!c.discovered)) return false;
      return this.clarity_charges_left>0 || (this.consumables[itemId]||0)>=1;
    }
    if((this.consumables[itemId]||0)<=0) return false;
    if((item.heal_amount||0)>0 && (this.current_hp+this.getPendingHealAmount())<this.getMaxHp()) return true;
    if((item.stamina_amount||0)>0 && (this.current_stamina+this.getPendingStaminaHealAmount())<this.getMaxStamina()) return true;
    if((item.eyesight_steps||0)>0) return true;
    if(item.buff_type) return true;



    if(item.cures_poison && this.isPoisoned()) return true;
    return false;
  },
  
  
  
  
  tickActiveHeals(){

      if(this.current_hp<maxHp){ this.current_hp=Math.min(maxHp,this.current_hp+heal.perTick); changed=true; }

    this.active_heals=this.active_heals.filter(heal=>heal.ticksLeft>0);

  bestAvailableConsumable(kind){
    const field=kind==="health"?"heal_amount":"stamina_amount";
    let bestId="", bestAmt=-1;
    for(const itemId in this.consumables){
      if((this.consumables[itemId]||0)<=0) continue;
      const item=DL.getItem(itemId);
      if(item.type!=="consumable") continue;
      const amt=item[field]||0;
      if(amt<=0) continue;
      if(amt>bestAmt){ bestAmt=amt; bestId=itemId; }
    }
    return bestId;
  },
  lowestAvailableConsumable(kind){
    const field=kind==="health"?"heal_amount":"stamina_amount";
    let bestId="", bestAmt=Infinity;
    for(const itemId in this.consumables){
      if((this.consumables[itemId]||0)<=0) continue;
      const item=DL.getItem(itemId);
      if(item.type!=="consumable") continue;
      const amt=item[field]||0;
      if(amt<=0) continue;
      if(amt<bestAmt){ bestAmt=amt; bestId=itemId; }
    }
    return bestId;
  },
  
  
  
  
  buyConsumable(itemId,qty=1){
    const item=DL.getItem(itemId); if(!item.name) return false;
    
    
    
    if(Balance.MERCHANT_EXCLUDED_ITEMS.includes(itemId)) return false;
    if(qty<=0) return false;
    const price=Balance.itemBuyPrice(item)*qty;
    if(this.gold<price) return false;
    this.gold-=price; this.addConsumable(itemId,qty); return true;
  },
  getInventoryCapacity(){
    let cap=Balance.BASE_INVENTORY_SLOTS;
    for(const bagId of this.equipped_bags) cap+=DL.getItem(bagId).capacity||0;
    return cap;
  },
  getInventoryUsed(){return this.gear_instances.length;},
  hasInventorySpace(){return this.getInventoryUsed()<this.getInventoryCapacity();},
  equipBag(itemId){
    if(this.equipped_bags.length>=Balance.MAX_BAG_SLOTS) return {success:false,reason:`Your bag rack is full (${this.equipped_bags.length}/${Balance.MAX_BAG_SLOTS}), unequip a bag first.`};
    this.equipped_bags.push(itemId); return {success:true};
  },
  
  
  
  
  wouldOverflowWithoutBag(itemId){
    if(!this.equipped_bags.includes(itemId)) return false;

  unequipBag(itemId){

    const idx=this.equipped_bags.indexOf(itemId); if(idx!==-1) this.equipped_bags.splice(idx,1); else return false;
    this.bags[itemId]=(this.bags[itemId]||0)+1;
    return true;
  },
  buyBag(itemId){
    const item=DL.getItem(itemId); if(!item.name||item.type!=="bag") return {success:false,reason:"Unknown bag."};
    const price=Balance.bagBuyPrice(item.capacity||0);
    if(this.gold<price) return {success:false,reason:"Not enough gold."};
    const result=this.equipBag(itemId); if(!result.success) return result;
    this.gold-=price; return {success:true};
  },
  craftBag(itemId){
    const item=DL.getItem(itemId); if(!item.name||item.type!=="bag") return {success:false,reason:"Unknown bag."};
    const cost=Balance.bagCraftCost(item.capacity||0);
    if(this.materials<cost) return {success:false,reason:"Not enough materials."};
    const result=this.equipBag(itemId); if(!result.success) return result;
    this.materials-=cost; return {success:true};

  addGear(inst){ if(!this.hasInventorySpace()) return false; this.gear_instances.push(inst); return true; },

    } else if(!IF.EQUIPPED_SLOT_KEYS.includes(genSlot)) return;
    this.gear_instances.splice(idx,1);
    if(this.equipped[target]) this.gear_instances.push(this.equipped[target]);

function h(tag, attrs={}, children=[]){
  const e=document.createElement(tag);
  for(const k in attrs){
    const v=attrs[k];
    if(k==="style") Object.assign(e.style, v);
    else if(k==="html") e.innerHTML=v;
    else if(k==="class") e.className=v;
    else if(k.startsWith("on") && typeof v==="function") e.addEventListener(k.slice(2).toLowerCase(), v);
    else if(v!==false && v!=null) e.setAttribute(k, v===true?"":v);
  }
  const kids=Array.isArray(children)?children:[children];
  for(const c of kids){
    if(c==null) continue;
    e.appendChild((typeof c==="string"||typeof c==="number")?document.createTextNode(String(c)):c);
  }
  return e;
}

  if(healingText){

const BREW_CRAFT_MS=2000;





const MULTI_BREW_CAP_MS=5000;
function startBrew(recipe,qty=1){
  if(GF.brewing || !PS.canAffordRecipe(recipe,qty)) return;
  const durationMs=Math.min(BREW_CRAFT_MS*qty, MULTI_BREW_CAP_MS);
  GF.brewing={recipeId:recipe.result_item, startedAt:Date.now(), recipe, qty, durationMs};
  render();
  GF.brewInterval=setInterval(()=>{
    if(!GF.brewing){ clearInterval(GF.brewInterval); GF.brewInterval=null; return; }
    if(Date.now()-GF.brewing.startedAt>=GF.brewing.durationMs){
      clearInterval(GF.brewInterval); GF.brewInterval=null;
      const rec=GF.brewing.recipe; const q=GF.brewing.qty||1; GF.brewing=null;
      const result=DL.getItem(rec.result_item);
      if(PS.brewRecipe(rec,q)){ autosave(); setToast(q>1?`Brewed ${q}x ${result.name}!`:`Brewed ${result.name}!`); }
      render();
    } else render();
  },100);
}
function startCraftBag(itemId){
  const item=DL.getItem(itemId);
  const cost=Balance.bagCraftCost(item.capacity||0);
  if(GF.crafting || PS.materials<cost || PS.equipped_bags.length>=Balance.MAX_BAG_SLOTS) return;
  GF.crafting={itemId, startedAt:Date.now()};
  render();
  GF.craftInterval=setInterval(()=>{
    if(!GF.crafting){ clearInterval(GF.craftInterval); GF.craftInterval=null; return; }
    if(Date.now()-GF.crafting.startedAt>=BREW_CRAFT_MS){
      clearInterval(GF.craftInterval); GF.craftInterval=null;
      const id=GF.crafting.itemId; GF.crafting=null;
      const r=PS.craftBag(id);
      if(r.success){ autosave(); setToast(`Crafted ${DL.getItem(id).name}!`); } else setToast(r.reason);
      render();
    } else render();
  },100);
}

function authForm(mode){
  const isLogin=mode==="login";
  const root=h("div",{class:"auth-page"});
  const card=h("div",{class:"auth-card"});
  card.appendChild(authHeader());
  const t=toastBox(); if(t) card.appendChild(t);
  const userInput=h("input",{class:"auth-input",type:"text",placeholder:"Username"});
  const passInput=h("input",{class:"auth-input",type:"password",placeholder:"Password"});
  const emailInput=isLogin?null:h("input",{class:"auth-input",type:"email",placeholder:"Email (optional)"});
  const statusDiv=h("div",{class:"auth-status"},[""]);
  const submit=async ()=>{
    const username=userInput.value.trim(), passcode=passInput.value;
    const email=emailInput?emailInput.value.trim():"";
    statusDiv.textContent="Working...";
    try{
      const json = isLogin ? await Net.login(username,passcode) : await Net.register(username,passcode,email);
      await Net.afterAuth(json.username, json.token);
      setToast(`Welcome, ${json.username}!`);
      GF.goto("mainMenuSlots");
    }catch(e){
      statusDiv.textContent = e.message || "Something went wrong. Is the game server reachable?";
    }
  };
  card.appendChild(h("div",{class:"auth-panel col gap"},[
    h("h2",{},[isLogin?"Welcome Back":"Create Your Account"]),
    authSocialRow(),
    userInput, passInput, emailInput,
    isLogin?null:h("div",{class:"muted",style:{marginTop:"-6px"}},["Email is optional, just a nice-to-have. Jump in with only a username and password if you'd rather not share one yet."]),
    h("button",{class:"auth-cta",style:{marginTop:"4px"},onClick:submit},[isLogin?"Log In":"Create Account"]),
    statusDiv,
  ]));
  card.appendChild(h("div",{class:"auth-footer"},[h("span",{class:"auth-back",onClick:()=>GF.goto("authGate")},["← Back"])]));
  root.appendChild(card);
  return root;
}

function formatLastSeen(iso){
  if(!iso) return "Unknown";
  const then=new Date(iso).getTime();
  if(isNaN(then)) return "Unknown";
  const diffMs=Date.now()-then;
  if(diffMs<0) return "Online now";
  const mins=Math.floor(diffMs/60000);
  if(mins<5) return "Online now";
  if(mins<60) return `${mins}m ago`;
  const hours=Math.floor(mins/60);
  if(hours<24) return `${hours}h ago`;
  const days=Math.floor(hours/24);
  if(days<30) return `${days}d ago`;
  return new Date(iso).toLocaleDateString();
}

function computeSkillRankings(){
  const entries=Net.leaderboardSkillsCache||[];
  const result={};
  for(const t of IF.WEAPON_TYPE_LIST){
    const rows=entries.map(e=>{
      const hits=(e.weapon_skills && e.weapon_skills[t] && e.weapon_skills[t].hits)||0;
      const level=Balance.weaponSkillLevelForHits(hits);
      const atStart=Balance.weaponSkillCumulativeHitsForLevel(level);
      const forNext=Balance.weaponSkillCumulativeHitsForLevel(level+1)-atStart;
      const into=hits-atStart;
      return {account_id:e.account_id, character_name:e.character_name, player:e.player, is_dead:e.is_dead, level, into, forNext};
    }).filter(r=>r.level>0||r.into>0);
    rows.sort((a,b)=> b.level-a.level || b.into-a.into);
    result[t]=rows.slice(0,5);
  }
  const herbRows=entries.map(e=>{
    const points=e.herbalism_points||0;
    const level=Balance.herbalismLevelForPoints(points);
    const atStart=Balance.herbalismCumulativePointsForLevel(level);
    const forNext=Balance.herbalismCumulativePointsForLevel(level+1)-atStart;
    const into=points-atStart;
    return {account_id:e.account_id, character_name:e.character_name, player:e.player, is_dead:e.is_dead, level, into, forNext};
  }).filter(r=>r.level>0||r.into>0);
  herbRows.sort((a,b)=> b.level-a.level || b.into-a.into);
  result.herbalism=herbRows.slice(0,5);
  return result;
}

  if(GF.ventureDepth==null || GF.ventureDepth<1){
    GF.ventureDepth=max;
  } else if(max>(GF.lastKnownMaxDepth||1)){
    
    
    
    
    GF.ventureDepth=max;
  } else if(GF.ventureDepth>max){
    GF.ventureDepth=max; 
  }
  GF.lastKnownMaxDepth=max;
  return GF.ventureDepth;
}

const MAZE_W=20, MAZE_H=10;

function generateMaze(depth){
  const size=MAZE_W, sizeH=MAZE_H;
  const idx=(x,y)=>y*size+x;
  const dirs4=[[1,0],[-1,0],[0,1],[0,-1]];

  
  
  
  let cells, dist;
  for(let attempt=0;attempt<40;attempt++){
    cells=[];
    for(let y=0;y<sizeH;y++) for(let x=0;x<size;x++) cells.push({x,y,type:"dirt",baseTerrain:"dirt",discovered:false,cleared:false});

    
    
    for(let p=0;p<Balance.GRASS_PATCH_COUNT;p++){
      let cx=randi(size), cy=randi(sizeH);
      const patchSize=3+randi(4);
      for(let s=0;s<patchSize;s++){
        if(cx>=0&&cx<size&&cy>=0&&cy<sizeH){ cells[idx(cx,cy)].type="grass"; cells[idx(cx,cy)].baseTerrain="grass"; }
        const [ddx,ddy]=pick(dirs4); cx+=ddx; cy+=ddy;
      }
    }

    
    
    for(const c of cells){
      if(c.x===0&&c.y===0) continue; 
      if(Math.random()<Balance.OBSTACLE_DENSITY) c.type="boulder";
    }

    
    dist=new Array(cells.length).fill(-1);
    dist[0]=0; const q=[0];
    while(q.length){
      const cur=q.shift();
      const cx=cur%size, cy=Math.floor(cur/size);
      for(const [dx,dy] of dirs4){
        const nx=cx+dx, ny=cy+dy;
        if(nx<0||nx>=size||ny<0||ny>=sizeH) continue;
        const ni=idx(nx,ny);
        if(cells[ni].type==="boulder") continue;
        if(dist[ni]===-1){ dist[ni]=dist[cur]+1; q.push(ni); }
      }
    }
    const reachableCount=dist.filter(d=>d>=0).length;
    if(reachableCount>=cells.length*0.45) break; 
  }

  cells[0].type="start"; cells[0].baseTerrain="start";
  let exitIdx=0, best=-1;
  for(let i=0;i<cells.length;i++) if(dist[i]>best){ best=dist[i]; exitIdx=i; }
  
  
  
  
  
  
  
  
  
  
  const exitRoll=Math.random();
  if(exitRoll<Balance.MAZE_PREMATURE_EXIT_CHANCE){
    const halfCandidates=[];
    for(let i=1;i<cells.length;i++) if(dist[i]>=best*0.35 && dist[i]<=best*0.55) halfCandidates.push(i);
    if(halfCandidates.length>0) exitIdx=pick(halfCandidates);
  } else if(exitRoll<Balance.MAZE_PREMATURE_EXIT_CHANCE+Balance.MAZE_BOTTOMLEFT_EXIT_CHANCE){
    let blBest=-1, blIdx=-1;
    for(let i=1;i<cells.length;i++){
      const cx=i%size, cy=Math.floor(i/size);
      if(dist[i]>=0 && cx<size*0.4 && cy>=sizeH*0.6 && dist[i]>blBest){ blBest=dist[i]; blIdx=i; }
    }
    if(blIdx>=0) exitIdx=blIdx;
  }
  cells[exitIdx].type="exit";

  
  
  
  
  
  
  
  
  
  
  
  const stronghold=depth>=Balance.STRONGHOLD_MIN_AREA_LEVEL && Math.random()<Balance.STRONGHOLD_SPAWN_CHANCE ? placeStronghold({size,sizeH,cells,depth}, dist, exitIdx) : null;

  
  
  
  
  
  
  
  const candidates=cells.filter((c,i)=>dist[i]>0 && (c.type==="grass"||c.type==="dirt"));
  for(const c of candidates){
    const roll=Math.random();
    if(roll<Balance.MAZE_CHEST_CHANCE_PER_TILE){ c.type="chest"; continue; }
    if(roll<Balance.MAZE_CHEST_CHANCE_PER_TILE+Balance.MAZE_SHRINE_CHANCE_PER_TILE){ c.type="shrine"; continue; }
    if(roll<Balance.MAZE_CHEST_CHANCE_PER_TILE+Balance.MAZE_SHRINE_CHANCE_PER_TILE+Balance.MAZE_HERB_CHANCE_PER_TILE){ c.type="herb"; continue; }
    
    
    if(roll<Balance.MAZE_CHEST_CHANCE_PER_TILE+Balance.MAZE_SHRINE_CHANCE_PER_TILE+Balance.MAZE_HERB_CHANCE_PER_TILE+Balance.MAZE_CRITTER_CHANCE_PER_TILE){ c.type="critter"; continue; }
    
    
    
    
    
    
    
    
    if(roll<Balance.MAZE_CHEST_CHANCE_PER_TILE+Balance.MAZE_SHRINE_CHANCE_PER_TILE+Balance.MAZE_HERB_CHANCE_PER_TILE+Balance.MAZE_CRITTER_CHANCE_PER_TILE+Balance.TRAP_CHANCE_PER_TILE){ c.type="trap"; }
  }

  
  
  
  
  
  
  
  
  const openTiles=cells.filter((c,i)=>dist[i]>0 && (c.type==="grass"||c.type==="dirt"));
  shuffle(openTiles);
  const roamers=[];
  
  
  
  
  
  
  
  
  
  const roamerCount=depth<Balance.ROAMING_MOB_MIN_AREA_LEVEL ? 0 : Balance.ROAMING_MOB_COUNT_PER_MAZE+PS.getForestReputationExtraRoamers();
  for(let r=0;r<Math.min(roamerCount, openTiles.length);r++){
    const tile=openTiles[r];
    const spawnIdx=idx(tile.x,tile.y);
    
    
    
    
    
    const behavior=ROAMING_MOB_BEHAVIORS[randi(ROAMING_MOB_BEHAVIORS.length)];
    roamers.push({roamerId:r, idx:spawnIdx, monsterId:DL.pickRandomMonsterForArea(depth).id, defeated:false, behavior, homeIdx:spawnIdx});
  }

  const maze={size, sizeH, cells, depth, playerIdx:0, stronghold, roamers};
  revealAround(maze,0,PS.getEyesightRadius()); 
  
  
  
  
  maze._justRevealed=[];
  return maze;
}





  



function tickRoamingMobs(maze){
  if(!maze.roamers || !maze.roamers.length) return;
  const dirs4=[[1,0],[-1,0],[0,1],[0,-1]];
  const occupied=new Set(maze.roamers.filter(r=>!r.defeated).map(r=>r.idx));
  const px=maze.playerIdx%maze.size, py=Math.floor(maze.playerIdx/maze.size);
  for(const r of maze.roamers){
    if(r.defeated) continue;
    
    
    
    if(r.behavior==="hoarding" && Math.random()<Balance.ROAMING_MOB_HOARDING_STAY_CHANCE) continue;
    occupied.delete(r.idx);
    const x=r.idx%maze.size, y=Math.floor(r.idx/maze.size);
    
    
    
    
    
    const shuffledDirs=dirs4.slice(); shuffle(shuffledDirs);
    const candidates=[];
    for(const [dx,dy] of shuffledDirs){
      const nx=x+dx, ny=y+dy;
      if(nx<0||nx>=maze.size||ny<0||ny>=maze.sizeH) continue;
      const ni=ny*maze.size+nx;
      const cell=maze.cells[ni];
      if(cell.type!=="grass" && cell.type!=="dirt") continue;
      if(occupied.has(ni)) continue;
      candidates.push({nx,ny,ni});
    }
    if(candidates.length){
      let chosen=candidates[0]; 
      if(r.behavior==="charging"){
        
        
        
        
        const curDist=Math.abs(x-px)+Math.abs(y-py);
        let bestDist=curDist;
        for(const c of candidates){
          const d=Math.abs(c.nx-px)+Math.abs(c.ny-py);
          if(d<bestDist){ bestDist=d; chosen=c; }
        }
      } else if(r.behavior==="hoarding"){
        
        
        
        
        const hx=r.homeIdx%maze.size, hy=Math.floor(r.homeIdx/maze.size);
        const curDist=Math.abs(x-hx)+Math.abs(y-hy);
        let bestDist=curDist;
        for(const c of candidates){
          const d=Math.abs(c.nx-hx)+Math.abs(c.ny-hy);
          if(d<bestDist){ bestDist=d; chosen=c; }
        }
      }
      r.idx=chosen.ni;
    }
    occupied.add(r.idx);
  }
}









function placeStronghold(maze, dist, exitIdx){
  const {size, sizeH, cells}=maze;
  const idx=(x,y)=>y*size+x;
  const dirs4=[[1,0],[-1,0],[0,1],[0,-1]];
  let chosen=null;
  for(let attempt=0;attempt<200;attempt++){
    const cx=1+randi(size-2), cy=1+randi(sizeH-2);
    const coords=[[cx,cy],[cx,cy-1],[cx,cy+1],[cx-1,cy],[cx+1,cy],[cx-1,cy-1],[cx+1,cy-1],[cx-1,cy+1],[cx+1,cy+1]];
    const idxs=coords.map(([x,y])=>idx(x,y));
    if(idxs.includes(0) || idxs.includes(exitIdx)) continue;
    
    
    
    
    
    
    const inBlock=new Set(idxs);
    const vDist=new Array(cells.length).fill(-1);
    vDist[0]=0; const q=[0];
    while(q.length){
      const cur=q.shift();
      const curx=cur%size, cury=Math.floor(cur/size);
      for(const [dx,dy] of dirs4){
        const nx=curx+dx, ny=cury+dy;
        if(nx<0||nx>=size||ny<0||ny>=sizeH) continue;
        const ni=ny*size+nx;
        if(vDist[ni]!==-1) continue;
        if(cells[ni].type==="boulder" && !inBlock.has(ni)) continue;
        vDist[ni]=vDist[cur]+1; q.push(ni);
      }
    }
    if(idxs.some(i=>vDist[i]>=0)){ chosen={cx,cy}; break; }
  }
  if(!chosen) return null;
  const {cx,cy}=chosen;
  const chestIdx=idx(cx,cy);
  const guardianCoords=[[cx,cy-1],[cx,cy+1],[cx-1,cy],[cx+1,cy]]; 
  const cornerCoords=[[cx-1,cy-1],[cx+1,cy-1],[cx-1,cy+1],[cx+1,cy+1]];

  cells[chestIdx].type="stronghold_chest"; cells[chestIdx].cleared=false;
  const guardianIdxs=[];
  guardianCoords.forEach(([gx,gy],slot)=>{
    const gi=idx(gx,gy);
    const base=DL.pickRandomMonsterForArea(maze.depth||1);
    cells[gi].type="stronghold_guardian"; cells[gi].cleared=false;
    cells[gi].guardianMonsterId=base.id; cells[gi].guardianSlot=slot;
    guardianIdxs.push(gi);
  });
  cornerCoords.forEach(([fx,fy])=>{ cells[idx(fx,fy)].type="stronghold_fence"; });

  return {chestIdx, guardianIdxs, guardianDefeated:[false,false,false,false], opened:false};
}
function strongholdChestUnlocked(maze){
  return !!(maze.stronghold && maze.stronghold.guardianDefeated.some(Boolean));
}

function ensureMaze(depth){
  if(!GF.overworld_snapshot || GF.overworld_snapshot.depth!==depth) GF.overworld_snapshot=generateMaze(depth);
  return GF.overworld_snapshot;
}

}

  critter:"🐛"};

function interpolateHexColor(hex1,hex2,t){
  const c1=parseInt(hex1.slice(1),16), c2=parseInt(hex2.slice(1),16);
  const r1=(c1>>16)&255, g1=(c1>>8)&255, b1=c1&255;
  const r2=(c2>>16)&255, g2=(c2>>8)&255, b2=c2&255;
  const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
  return "#"+[r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
}

function isAdjacent4(x1,y1,x2,y2){
  const dx=Math.abs(x1-x2), dy=Math.abs(y1-y2);
  return (dx+dy)===1;
}

      if(overlay.andThen) overlay.andThen();

    },1650);
  }
  return div;
}

      h("div",{class:"muted",style:{fontSize:".9em"}},["Any gear you find will be left behind until you make room -- sell, salvage, or store items in your Vault."]),
    ]));
  }

  
  
  
  
  const gridWidthPx=maze.size*34+(maze.size-1)*1+4;

  if(GF.mazeOverlay){
    gridArea=h("div",{style:{position:"relative",width:gridWidthPx+"px",height:gridHeightPx+"px",flex:"none"}},[mazeOverlayScreen(GF.mazeOverlay)]);
  } else {
    const px=maze.playerIdx%maze.size, py=Math.floor(maze.playerIdx/maze.size);
    const grid=h("div",{class:"maze-grid",style:{gridTemplateColumns:`repeat(${maze.size},34px)`}});
    for(let y=0;y<maze.sizeH;y++){
      for(let x=0;x<maze.size;x++){
        const i=y*maze.size+x; const cell=maze.cells[i];
        const isPlayer=maze.playerIdx===i;
        const chestLocked=cell.type==="stronghold_chest" && !strongholdChestUnlocked(maze);
        const isWalkable=!isPlayer && cell.type!=="boulder" && !chestLocked && isAdjacent4(x,y,px,py);
        
        
        
        
        
        
        
        const isKnown=cell.discovered || cell.type==="start";
        const hidden=!!cell.wasHidden || HIDDEN_TILE_TYPES.includes(cell.type);
        const displayType=HIDDEN_TILE_TYPES.includes(cell.type)?cell.baseTerrain:cell.type;
        let bg="#050505", label="", border="1px solid #222", opacity="1";
        
        
        
        
        
        
        
        
        
        
        if(isKnown){
          bg=TILE_COLOR[displayType]||TILE_COLOR.dirt;
          label=TILE_GLYPH[displayType]||"";
          
          
          
          if(displayType==="grass" && cell.trampleCount){
            bg=interpolateHexColor(TILE_COLOR.grass, TILE_COLOR.dirt, Math.min(3,cell.trampleCount)/3);
          }
          if(cell.cleared && !hidden) opacity="0.4"; 
        }
        const inner=h("span",{style:{opacity}},[label]);
        
        
        const tile=h("div",{id:"maze-tile-"+i,class:"maze-tile",style:{background:bg,display:"flex",alignItems:"center",justifyContent:"center",cursor:isWalkable?"pointer":"default",fontSize:"16px",border}},[inner]);
        if(isWalkable){ tile.addEventListener("click",()=>onStepMaze(maze,i)); }
        grid.appendChild(tile);
      }
    }
    
    
    
    
    
    
    grid.appendChild(h("div",{id:"maze-player-marker",class:"maze-mover maze-mover-player",style:{left:(px*35)+"px",top:(py*35)+"px"}}));
    if(maze.roamers){
      for(const r of maze.roamers){
        if(r.defeated) continue;
        
        
        
        const rCell=maze.cells[r.idx];
        if(!(rCell.discovered || rCell.type==="start")) continue;
        const rx=r.idx%maze.size, ry=Math.floor(r.idx/maze.size);
        
        
        
        
        const roamerColor=ROAMING_MOB_COLOR_BY_BEHAVIOR[r.behavior]||ROAMING_MOB_COLOR_BY_BEHAVIOR.regular;
        grid.appendChild(h("div",{id:"maze-roamer-marker-"+r.roamerId,class:"maze-mover maze-mover-roamer",title:`${r.behavior||"regular"} roamer`,style:{left:(rx*35)+"px",top:(ry*35)+"px",background:roamerColor}},[ROAMING_MOB_GLYPH]));
      }
    }
    gridArea=grid;
  }

  root.appendChild(h("div",{class:"maze-wrap"},[gridArea,
    h("div",{class:"side-panel"},[
      h("div",{class:"col",style:{gap:"2px"}},[
        
        
        
        
        
        h("div",{class:"muted",style:{lineHeight:"1.5em"}},[
          "Arrow keys to move. Fights lurk in tall grass -- find the exit (⬇) before your stamina runs out. Strongholds hide a locked chest (🔒) behind tough guardians (💀); Roaming mobs (👹) hunt on their own turf. ",
          h("span",{class:"linklike",onClick:()=>{ GF._preGameplayScreen="maze"; GF.goto("gameplayGuide"); }},["More information"]),
        ]),
      ]),

          const px=maze.playerIdx%maze.size, py=Math.floor(maze.playerIdx/maze.size);
          const ripple=[];
          for(let i=0;i<maze.cells.length;i++){
            if(!maze.cells[i].discovered){
              const cx=i%maze.size, cy=Math.floor(i/maze.size);
              ripple.push({idx:i, dist:Math.abs(cx-px)+Math.abs(cy-py)});
            }
          }
          PS.useConsumable("elixir_of_clarity");
          maze._clarityReveal=ripple;
          autosave(); render(); animateMazeMovers(null,null);
        }},[`Use Elixir of Clairvoyance (${PS.clarity_charges_left>0?PS.clarity_charges_left:10} left)`]),

}

function revealAround(maze,centerIdx,radius){
  const cx=centerIdx%maze.size, cy=Math.floor(centerIdx/maze.size);
  
  
  
  
  
  const newlyRevealed=[];
  for(let dy=-radius;dy<=radius;dy++){
    for(let dx=-radius;dx<=radius;dx++){
      const nx=cx+dx, ny=cy+dy;
      if(nx<0||nx>=maze.size||ny<0||ny>=maze.sizeH) continue;
      const idx=ny*maze.size+nx;
      const cell=maze.cells[idx];
      if(!cell.discovered) newlyRevealed.push(idx);
      cell.discovered=true;
    }
  }
  maze._justRevealed=(maze._justRevealed||[]).concat(newlyRevealed);
  return newlyRevealed;
}

function animateMazeMovers(prevPlayerIdx, prevRoamerPositions){
  const maze=GF.overworld_snapshot;
  if(!maze) return;
  const cellPx=(idx)=>({x:(idx%maze.size)*35+"px", y:Math.floor(idx/maze.size)*35+"px"});
  const playerEl=document.getElementById("maze-player-marker");
  if(playerEl && playerEl.parentNode && prevPlayerIdx!=null && prevPlayerIdx!==maze.playerIdx){
    const from=cellPx(prevPlayerIdx), to=cellPx(maze.playerIdx);
    playerEl.style.transition="none";
    playerEl.style.left=from.x; playerEl.style.top=from.y;
    setTimeout(()=>{
      playerEl.style.transition="";
      playerEl.style.left=to.x; playerEl.style.top=to.y;
    },20);
  }
  if(maze.roamers && prevRoamerPositions){
    for(const r of maze.roamers){
      if(r.defeated) continue;
      const prevIdx=prevRoamerPositions[r.roamerId];
      if(prevIdx==null || prevIdx===r.idx) continue;
      const el=document.getElementById("maze-roamer-marker-"+r.roamerId);
      if(!el || !el.parentNode) continue;
      const from=cellPx(prevIdx), to=cellPx(r.idx);
      el.style.transition="none";
      el.style.left=from.x; el.style.top=from.y;
      setTimeout(()=>{
        el.style.transition="";
        el.style.left=to.x; el.style.top=to.y;
      },20);
    }
  }
  
  
  
  
  
  
  
  if(maze._justRevealed && maze._justRevealed.length){
    for(const idx of maze._justRevealed){
      const el=document.getElementById("maze-tile-"+idx);
      if(!el || !el.parentNode) continue;
      el.style.transition="none";
      el.style.opacity="0";
      setTimeout(()=>{
        el.style.transition="";
        el.style.opacity="1";
      },20);
    }
    maze._justRevealed=[];
  }
  
  
  
  
  
  
  
  
  if(maze._clarityReveal && maze._clarityReveal.length){
    for(const {idx,dist} of maze._clarityReveal){
      const el=document.getElementById("maze-tile-"+idx);
      if(!el || !el.parentNode) continue;
      el.style.transition="none";
      el.style.opacity="0";
      setTimeout(()=>{
        el.style.transition="";
        el.style.opacity="1";
      },30+dist*35);
    }
    maze._clarityReveal=[];
  }
}

function onStepMaze(maze,targetIdx){
  
  
  
  
  
  
  if(PS.current_stamina<=0){
    mazeLog("You're exhausted and can't go any further. Use a Stamina Potion, or retreat to town to rest.");
    render();
    return;
  }
  
  
  
  const prevPlayerIdx=maze.playerIdx;
  const prevRoamerPositions={};
  if(maze.roamers) for(const r of maze.roamers) prevRoamerPositions[r.roamerId]=r.idx;
  const cell=maze.cells[targetIdx];
  maze.playerIdx=targetIdx; cell.discovered=true; cell.visited=true;
  PS.spendStamina(Balance.STAMINA_COST_PER_STEP);
  
  
  
  
  
  
  
  tickEyesightPotion();
  revealAround(maze,targetIdx,PS.getEyesightRadius());
  if(PS.current_stamina<=0){
    mazeLog("You're exhausted. Use a Stamina Potion, or retreat to town to rest, before you can move again.");
  }

  
  
  
  
  const roamerAlreadyHere=maze.roamers && maze.roamers.find(r=>!r.defeated && r.idx===maze.playerIdx);
  if(roamerAlreadyHere){
    PS.tickXpBuff();
    GF.goto("combat",{maze_depth:maze.depth, pending_monster_id:roamerAlreadyHere.monsterId, pending_roamer_id:roamerAlreadyHere.roamerId, pending_guardian_cell_idx:null});
    return;
  }

  if(cell.type==="exit" && !cell.cleared){
    cell.cleared=true;
    const nextDepth=maze.depth+Balance.EXIT_DEPTH_BONUS_PER_DESCENT;
    PS.max_maze_depth_reached=Math.max(PS.max_maze_depth_reached||1, nextDepth);
    
    
    
    
    
    
    
    
    
    GF.ventureDepth=nextDepth;
    
    
    
    GF.ventureLockDepth=null;
    GF.trapdoorStreak=0;
    autosave();
    GF.mazeOverlay={text:`Advanced to area level ${nextDepth}!`, andThen:()=>{ GF.overworld_snapshot=null; GF.goto("maze",{maze_depth:nextDepth}); }};
    render();
    return;
  }
  if(cell.type==="trap" && !cell.cleared){
    cell.cleared=true; cell.type=cell.baseTerrain;
    PS.spendStamina(Balance.TRAP_STAMINA_LOSS);
    
    
    
    
    
    const outcome=Balance.rollTrapOutcome(maze.depth);
    if(outcome==="fall"){
      
      
      
      
      
      
      
      const dmg=randRange(Balance.TRAP_DAMAGE_MIN,Balance.TRAP_DAMAGE_MAX);
      PS.current_hp=Math.max(1,PS.current_hp-dmg);
      GF.trapdoorStreak=Math.min(Balance.TRAPDOOR_DEPTH_PENALTY_MAX_STACK,(GF.trapdoorStreak||0)+1);
      const penalty=Balance.TRAPDOOR_DEPTH_PENALTY*GF.trapdoorStreak;
      const fallDepth=Math.max(1,maze.depth-penalty);
      
      
      
      GF.ventureDepth=fallDepth;
      GF.ventureLockDepth=fallDepth;
      autosave();
      GF.mazeOverlay={text:"Trapdoor!", andThen:()=>{ GF.overworld_snapshot=null; GF.goto("maze",{maze_depth:fallDepth}); }};
      render();
      return;
    }
    
    
    
    
    
    
    
    if(PS.isInvulnerable()){
      PS.invuln_rounds_left--;
      mazeLog(`Something bites at your ankle, but the Touch of Unicorn shields you! (${PS.invuln_rounds_left} round${PS.invuln_rounds_left===1?"":"s"} left)`);
      autosave(); render(); animateMazeMovers(prevPlayerIdx,prevRoamerPositions); return;
    }
    
    
    
    
    
    if(outcome==="poison"){
      PS.applyPoison(maze.depth);
      mazeLog(`Something bites at your ankle! No wound, but you feel a poison take hold.`);
      autosave(); render(); animateMazeMovers(prevPlayerIdx,prevRoamerPositions); return;
    }
    
    
    
    
    
    
    
    
    
    
    
    const rawDmg=Balance.trapDamage(maze.depth);
    const dmg=Math.max(0,rawDmg-PS.getArmor());
    if(dmg>=PS.current_hp){
      PS.current_hp=0;
      autosave();
      handleTrapDeath();
      return;
    }
    PS.current_hp-=dmg;
    mazeLog(`Something bites at your ankle! You take ${Math.round(dmg)} damage.`);
    
    
    spawnFloat("player",`-${Math.round(dmg)} HP`,"float-text-dmg");
    autosave(); render(); animateMazeMovers(prevPlayerIdx,prevRoamerPositions); return;
  }
  if(cell.type==="shrine" && !cell.cleared){
    cell.cleared=true;
    
    
    const roll=Math.floor(Math.random()*5);
    if(roll===0){ PS.addStaminaShrineBuff(Balance.STAMINA_MAX_BASE*Balance.SHRINE_STAMINA_BUFF_PCT); mazeLog("A quiet shrine restores your stamina and grants a lasting reserve!"); }
    else if(roll===1){ PS.applyXpShrineBuff(); mazeLog("A quiet shrine blesses you, bonus experience for a while!"); }
    else if(roll===2){ PS.applyInvulnShrineBuff(); mazeLog(`A radiant shrine grants you the Touch of Unicorn -- you are immune to damage/poison from combat or traps for ${Balance.SHRINE_INVULN_ROUNDS} rounds!`); }
    else if(roll===3){ PS.applyQuadDamageShrineBuff(); mazeLog(`A furious shrine quadruples your damage output for ${Balance.SHRINE_QUAD_DAMAGE_ROUNDS} combat rounds!`); }
    else { PS.applyMagicFindShrineBuff(); mazeLog(`A glimmering shrine sharpens your eye for treasure -- +${Balance.SHRINE_MAGIC_FIND_PCT}% Magic Find for ${Balance.SHRINE_MAGIC_FIND_ROUNDS} rounds!`); }
    autosave(); render(); animateMazeMovers(prevPlayerIdx,prevRoamerPositions); return;
  }
  if(cell.type==="herb" && !cell.cleared){
    GF.goto("herbEncounter",{maze_depth:maze.depth, herb_cell_idx:targetIdx});
    return;
  }
  if(cell.type==="critter" && !cell.cleared){
    
    
    GF.goto("critterEncounter",{maze_depth:maze.depth, critter_cell_idx:targetIdx});
    return;
  }
  if(cell.type==="chest" && !cell.cleared){
    GF.goto("chestEncounter",{maze_depth:maze.depth, chest_cell_idx:targetIdx});
    return;
  }
  if(cell.type==="stronghold_guardian" && !cell.cleared){
    PS.tickXpBuff();
    GF.goto("combat",{maze_depth:maze.depth, pending_monster_id:cell.guardianMonsterId, pending_guardian_cell_idx:targetIdx, pending_roamer_id:null});
    return;
  }
  if(cell.type==="stronghold_chest" && !cell.cleared){
    
    
    GF.goto("strongholdChest",{maze_depth:maze.depth, stronghold_chest_cell_idx:targetIdx});
    return;
  }

  
  
  
  
  
  
  
  
  
  
  if(cell.type==="grass"){
    cell.trampleCount=Math.min(3,(cell.trampleCount||0)+1);
  }

  
  
  if(cell.type==="grass" && (cell.trampleCount||0)<3 && Math.random()<Balance.ENCOUNTER_CHANCE_PER_STEP){
    PS.tickXpBuff();
    const monster=DL.pickRandomMonsterForArea(maze.depth);
    
    
    
    
    
    
    
    GF.goto("combat",{maze_depth:maze.depth, pending_monster_id:monster.id, pending_guardian_cell_idx:null, pending_roamer_id:null});
    return;
  }
  autosave();
  render();
  animateMazeMovers(prevPlayerIdx,prevRoamerPositions);
}




function attemptMazeMove(dx,dy){
  const maze=GF.overworld_snapshot; if(!maze) return;
  const px=maze.playerIdx%maze.size, py=Math.floor(maze.playerIdx/maze.size);
  const nx=px+dx, ny=py+dy;
  if(nx<0||nx>=maze.size||ny<0||ny>=maze.sizeH) return;
  const ni=ny*maze.size+nx;
  if(maze.cells[ni].type==="boulder") return;
  if(maze.cells[ni].type==="stronghold_chest" && !strongholdChestUnlocked(maze)) return;
  onStepMaze(maze,ni);
}







const MAZE_MOVE_REPEAT_THROTTLE_MS=300;
let lastMazeMoveCommitAt=0;
const KEYBIND_STORAGE_KEY="wandrian_keybind_scheme";
const KEYBIND_SCHEMES={
  arrows:{label:"Arrow Keys only", extraUp:[], extraDown:[], extraLeft:[], extraRight:[]},
  wasd:{label:"WASD", extraUp:["w","W"], extraDown:["s","S"], extraLeft:["a","A"], extraRight:["d","D"]},
  zqsd:{label:"ZQSD (AZERTY)", extraUp:["z","Z"], extraDown:["s","S"], extraLeft:["q","Q"], extraRight:["d","D"]},
};
function getKeybindScheme(){
  const v=Storage_.getItem(KEYBIND_STORAGE_KEY);
  if(v==="custom") return "custom";
  return KEYBIND_SCHEMES[v]?v:"arrows";
}
function setKeybindScheme(v){
  if(v!=="custom" && !KEYBIND_SCHEMES[v]) return;
  Storage_.setItem(KEYBIND_STORAGE_KEY,v);
}
const KEYBIND_CUSTOM_STORAGE_KEY="wandrian_keybind_custom";
function getCustomKeybinds(){
  let parsed=null;
  try{ parsed=JSON.parse(Storage_.getItem(KEYBIND_CUSTOM_STORAGE_KEY)||"null"); }catch(e){ parsed=null; }
  return Object.assign({up:"",down:"",left:"",right:""}, parsed||{});
}
function setCustomKeybinds(v){
  Storage_.setItem(KEYBIND_CUSTOM_STORAGE_KEY, JSON.stringify(v));
}
function customKeybindWarning(c){
  const dirs=["up","down","left","right"];
  const vals=dirs.map(d=>c[d]).filter(v=>v);
  const dupes=vals.filter((v,i)=>vals.indexOf(v)!==i);
  if(dupes.length) return `"${dupes[0].toUpperCase()}" is assigned to more than one direction.`;
  if(vals.some(v=>v==="arrowup"||v==="arrowdown"||v==="arrowleft"||v==="arrowright")) return "That key collides with an Arrow Key.";
  return null;
}
function getActiveKeybindExtras(){
  const schemeId=getKeybindScheme();
  if(schemeId==="custom"){
    const c=getCustomKeybinds();
    const pair=(v)=>v?[v.toLowerCase(),v.toUpperCase()]:[];
    return { extraUp:pair(c.up), extraDown:pair(c.down), extraLeft:pair(c.left), extraRight:pair(c.right) };
  }
  return KEYBIND_SCHEMES[schemeId]||KEYBIND_SCHEMES.arrows;
}








const KEYBOARD_SHORTCUT_STORAGE_KEY="wandrian_keyboard_shortcuts";
const KEYBOARD_SHORTCUT_DEFAULTS={characterSheet:"c", venture:"v"};
function getKeyboardShortcuts(){
  let parsed=null;
  try{ parsed=JSON.parse(Storage_.getItem(KEYBOARD_SHORTCUT_STORAGE_KEY)||"null"); }catch(e){ parsed=null; }
  return Object.assign({}, KEYBOARD_SHORTCUT_DEFAULTS, parsed||{});
}
function setKeyboardShortcut(name,key){
  if(!KEYBOARD_SHORTCUT_DEFAULTS.hasOwnProperty(name)) return;
  const clean=(key||"").trim().toLowerCase().slice(0,1);
  if(!clean) return;
  const current=getKeyboardShortcuts();
  current[name]=clean;
  Storage_.setItem(KEYBOARD_SHORTCUT_STORAGE_KEY, JSON.stringify(current));
}

window.addEventListener("keydown",(e)=>{
  
  
  
  
  
  const activeTag=document.activeElement && document.activeElement.tagName;
  if(activeTag==="INPUT" || activeTag==="TEXTAREA") return;

  
  
  
  
  
  const shortcuts=getKeyboardShortcuts();
  const keyLower=e.key.length===1?e.key.toLowerCase():e.key;
  if(keyLower===shortcuts.characterSheet){
    e.preventDefault();
    characterSheetShortcutAction();
    return;
  }
  if(keyLower===shortcuts.venture){


    e.preventDefault();
    ventureShortcutAction();
    return;
  }

  if(GF.screen==="combat"){
    if(!GF._combatUI) return;
    if(e.key==="1"){ e.preventDefault(); GF._combatUI.useHealth(); return; }
    if(e.key==="2"){ e.preventDefault(); GF._combatUI.useStamina(); return; }
    if(keyLower==="f"){ e.preventDefault(); GF._combatUI.attemptFlee(); return; }
    return;
  }

  if(GF.screen!=="maze") return;
  
  
  
  
  
  if(GF.mazeOverlay) return;
  const arrowMap={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  let d=arrowMap[e.key];
  if(!d){
    const extras=getActiveKeybindExtras();
    if(extras.extraUp.includes(e.key)) d=[0,-1];
    else if(extras.extraDown.includes(e.key)) d=[0,1];
    else if(extras.extraLeft.includes(e.key)) d=[-1,0];
    else if(extras.extraRight.includes(e.key)) d=[1,0];
  }
  if(!d) return;
  e.preventDefault();
  const nowTs=Date.now();
  if(e.repeat){
    if(nowTs-lastMazeMoveCommitAt<MAZE_MOVE_REPEAT_THROTTLE_MS) return;
  }
  lastMazeMoveCommitAt=nowTs;
  attemptMazeMove(d[0],d[1]);
});









function closestWithClass(el,className){
  while(el && el.nodeType===1){
    if(el.classList && el.classList.contains(className)) return el;
    el=el.parentElement;
  }
  return null;
}

function ensureCombat(){
  const guardianCellIdx=GF.pending_guardian_cell_idx!=null?GF.pending_guardian_cell_idx:null;
  
  
  
  
  
  const roamerId=GF.pending_roamer_id!=null?GF.pending_roamer_id:null;
  if(GF.combat && GF.combat.monster_id===GF.pending_monster_id && GF.combat.guardianCellIdx===guardianCellIdx && GF.combat.roamerId===roamerId){
    return GF.combat;
  }
  
  
  
  
  if(!GF.combatStarting){
    GF.combatStarting=true;
    startCombatSession(GF.pending_monster_id, guardianCellIdx, roamerId);
  }
  return null;
}

async function startCombatSession(monsterId, guardianCellIdx, roamerId){
  try{
    const result=await Net.startCombat(PS.current_slot, monsterId, GF.maze_depth, guardianCellIdx!=null, roamerId!=null);
    PS._saveSeqFloor=Math.max(PS._saveSeqFloor||0, result._save_seq);
    PS.current_hp=result.player.current_hp;
    syncCombatRoundBuffs(result.player);
    const base=DL.getMonster(monsterId);
    GF.combat={
      session_id:result.session_id, monster_id:monsterId, guardianCellIdx, roamerId,
      name:result.monster.name, hp:result.monster.hp, maxHp:result.monster.max_hp,
      loot_table:base.loot_table, isGuardian:guardianCellIdx!=null, isRoamer:roamerId!=null,
      
      
      
      
      
      area_level:GF.maze_depth,
      log:[...(result.log||[])], defeated:false, result_text:"",
    };
    autosave();
  }catch(e){
    setToast("Could not start that fight: "+e.message);
    GF.combatStarting=false;
    GF.goto("maze",{maze_depth:GF.maze_depth});
    return;
  }
  GF.combatStarting=false;
  render();
}

function applyDeathAndRedirect(cause, defeatedLine){
  const cd=PS.getClassData();
  const announcePayload={character_name:PS.character_name, level:PS.level, class_name:cd.display_name||PS.class_id, cause:`been ${cause.charAt(0).toLowerCase()}${cause.slice(1)}`};
  const result=PS.handleDeath(cause);
  if(result.dead){
    
    
    
    
    setToast("Your journey ends here. A new entry has been added to the Graveyard.");
    Net.announceDeath(announcePayload);
    GF.goto("graveyard");
  }
  else {
    
    
    
    // v0.22.1 (Part B1, credit: Gwen): softcore death is XP-penalty-only now -- no gold or
    // item loss ever happens here, so the wake-up message no longer mentions either.
    const p=result.penalty;
    const intro=`${defeatedLine} and wake up back at camp with ${Balance.DEATH_WAKE_HP} HP, having lost ${p.xpLost} experience.`;
    setToast(intro);
    resetMazePositionToStart();
    PS.saveGame();
    GF.goto("town");
  }
  return result;
}

function applyCombatTickPush(sessionId,payload){
  if(!GF.combat || GF.combat.session_id!==sessionId) return;
  const cb=GF.combat;
  PS._saveSeqFloor=Math.max(PS._saveSeqFloor||0, payload._save_seq||0);
  const ticks=payload.monster_ticks||[];
  for(const mt of ticks){
    if(mt.invulnerable){
      combatLog(cb,`The ${cb.name}'s attack passes through you harmlessly -- you are untouchable!`);
      spawnFloat("player","Immune!","float-text-block");
    } else if(mt.blocked){
      combatLog(cb,`You block the ${cb.name}'s attack entirely!`);
      spawnFloat("player","Blocked","float-text-block");
    } else if(mt.damage!=null){
      combatLog(cb,`The ${cb.name} hits you for ${mt.damage} damage${mt.crit?` (Critical! x${mt.crit_mult.toFixed(2)})`:""}.`);
      const fontSizeEm=mt.crit?critFloatFontSizeEm(mt.crit_mult,Balance.monsterCritMultiplierMax(cb.area_level)):undefined;
      spawnFloat("player",`-${mt.damage} HP${mt.crit?" CRIT!":""}`,mt.crit?"float-text-crit":"float-text-dmg",fontSizeEm);
    }
  }
  if(ticks.length===0 && !payload.fatal) return;
  if(payload.player) PS.current_hp=payload.player.current_hp;
  if(payload.fatal){ endCombatDeath(); return; }
  autosave();
  render();
}




function handleTrapDeath(){
  applyDeathAndRedirect("Slain by a Trap", "The trap proves fatal");
}














function syncCombatRoundBuffs(playerPayload){
  if(!playerPayload) return;
  if(playerPayload.invuln_rounds_left!=null) PS.invuln_rounds_left=playerPayload.invuln_rounds_left;
  if(playerPayload.quad_dmg_rounds_left!=null) PS.quad_dmg_rounds_left=playerPayload.quad_dmg_rounds_left;
  if(playerPayload.magic_find_rounds_left!=null) PS.magic_find_rounds_left=playerPayload.magic_find_rounds_left;
  // v0.22 (batch2 #5): current_stamina is now also a per-round server-authoritative value
  // (a Stamina Regen gear affix ticks once per combat round, same as HP regen) -- adopt it
  // here alongside the round-based shrine buffs so every attack/flee call site picks it up
  // without needing its own separate assignment.
  if(playerPayload.current_stamina!=null) PS.current_stamina=playerPayload.current_stamina;
}

  function startAutoAttack(){

  function applyCombatLoot(loot){

  }

  
  
  
  
  function renderMonsterHit(mt){
    
    if(mt.invulnerable){
      combatLog(cb,`The ${cb.name}'s attack passes through you harmlessly -- you are untouchable!`);
      spawnFloat("player","Immune!","float-text-block");
    } else if(mt.blocked){
      combatLog(cb,`You block the ${cb.name}'s attack entirely!`);
      spawnFloat("player","Blocked","float-text-block");
    } else if(mt.damage!=null){
      
      
      
      
      
      combatLog(cb,`The ${cb.name} hits you for ${mt.damage} damage${mt.crit?` (Critical! x${mt.crit_mult.toFixed(2)})`:""}.`);
