  root.appendChild(h("div",{class:"panel",style:{marginBottom:"16px"}},[
    h("div",{style:{marginBottom:"8px"}},[`You Venture out from Town into a maze full of grass, obstacles, chests, shrines, and the occasional Stronghold. Fights happen on grass tiles as you explore. Somewhere in the maze is an exit tile -- like every other tile, it's hidden by the fog of war until you actually stumble across it, so finding it is a real discovery, not a beeline. Stepping onto it advances you to the next area level (a tougher, freshly generated maze) and is how you gain levels along the way.`]),
    h("div",{style:{marginBottom:"8px"}},[`Once you reach Level ${Balance.trialLevelRequirement(1)} on your current class, the Broken Bridge Trial opens up back in Town. Cross it, and you're promoted to Level 1 of the next class tier on your path (see the Player Classes page for the full chain). Fall off a plank, and you're instead rerolled back to Level 1 of your CURRENT class tier -- but the bridge remembers every safe (and every broken) plank you've already found, so a retry never has to repeat a mistake, and eventually the last untried plank at a step is guaranteed safe.`]),
    h("div",{style:{marginBottom:"8px"}},[`Failing an attempt isn't pure loss: every failure permanently adds +1 to the starting stat points your next Level 1 begins with (base ${Balance.STARTING_STAT_POINTS}, see the Broken Bridge Trial screen for your current running total), so repeated attempts at a tough tier make each retry a little stronger. That bonus resets back down to the base ${Balance.STARTING_STAT_POINTS} the moment you finally cross.`]),
    // v0.18.1 (#4): the single most common question from Hardcore players about this
    // mechanic -- answered directly here, not just on the trial screen itself, since a
    // player deciding whether to even try Hardcore in the first place may read this guide
    // before ever seeing the trial screen's own reassurance.
    h("div",{style:{color:"#5ac67a"}},[`A failed attempt CANNOT kill your character, even in Hardcore mode -- falling only resets you to Level 1 at your current tier, it never sends you to the Graveyard.`]),
  ]));

  root.appendChild(h("h3",{},["Kill Streak"]));
  root.appendChild(h("div",{class:"panel",style:{marginBottom:"16px"}},[
    h("div",{style:{marginBottom:"8px"}},[`Every monster you defeat without returning to Town extends your Kill Streak by 1, shown right on your Character Sheet stat panel. Its only effect is +${Balance.KILL_STREAK_MAGIC_FIND_PCT_PER_KILL}% Magic Find per kill in the streak -- better odds at higher-rarity gear drops, AND (as of v0.18.2) better odds of getting a drop at all on a kill that would otherwise have come up empty. It does NOT make monsters tougher or change how much gold or XP you get per kill. You'll see the current bonus tick up next to the streak count after every kill, for as long as you keep venturing without heading back to Town.`]),
  ]));

  root.appendChild(h("h3",{},["Community XP Bonus"]));
  root.appendChild(h("div",{class:"panel",style:{marginBottom:"16px"}},[
    h("div",{style:{marginBottom:"8px"}},[`Right under the top bar on every screen, a banner tracks how many Wandrian accounts have been active in the last few minutes -- the same headcount the "Currently playing" line uses. That count is also a shared XP multiplier for everyone currently playing: alone, there's no bonus; with 2 players active, everyone's kill XP is doubled; with 3, tripled; and so on, one whole multiple per additional player online at the same time. There's no way to lose this bonus other than everyone else logging off -- it only ever helps, never hurts, and it applies automatically to every kill without anything you need to do.`]),
  ]));

  root.appendChild(h("h3",{},["Critters & Forest Reputation"]));
  root.appendChild(h("div",{class:"panel"},[
    h("div",{style:{marginBottom:"8px"}},[`Occasionally you'll come across a small, harmless critter in the maze -- it won't fight back. You choose: squash it, or spare its life. Each choice moves your Forest Reputation for your CURRENT class tier by 1 (squashing: -1, sparing: +1) -- it starts at 0 and can go negative, and it's tracked separately per tier, since your class tier determines which forest (and town) you're exploring. Your current tier's reputation is always shown on your Character Sheet.`]),
    h("div",{style:{marginBottom:"8px"}},[`A POSITIVE reputation grants a persistent +${Balance.FOREST_REPUTATION_XP_PCT_PER_POINT}% bonus to all experience gained per point, for as long as you're exploring that tier's forest -- it stacks multiplicatively on top of every other XP bonus (Community XP, shrines, gear) and applies to every kill automatically, no need to re-earn it each fight. A NEGATIVE reputation doesn't touch your XP at all, but adds 1 extra roaming mob to that forest's mazes per point below zero. Play it however you like: rack up roaming mobs to farm kills, or stay peaceful and let the bonus XP add up -- the choice, and its consequences, are entirely yours.`]),
  ]));

  return root;
}

// v0.18.2 (#4): a dedicated guide covering how leveling and area difficulty actually
// interact -- previously the closest existing explanation was scattered across the
// Gameplay Guide (core loop) and Player Classes page (promotion requirements), with
// nothing walking through the actual XP math or explaining WHY farming a trivial area
// eventually stops being worth it. Every number below is pulled live from Balance so this
// page can never drift out of sync with the real formulas.
function screenExperienceGuide(){
  const root=h("div",{});
  root.appendChild(h("h2",{},["Experience Guide"]));
  root.appendChild(h("div",{class:"lore"},["How leveling, monster area levels, and class tier promotion actually work under the hood -- with real numbers, not just vibes."]));
  root.appendChild(h("button",{style:{marginBottom:"10px"},onClick:()=>{ GF.goto(GF._preExperienceScreen||"mainMenuSlots"); }},["← Back"]));

  root.appendChild(h("h3",{},["Area Levels vs. Character Level"]));
  root.appendChild(h("div",{class:"panel",style:{marginBottom:"16px"}},[
    h("div",{style:{marginBottom:"8px"}},[`Every maze has its own "area level," independent of your character's own level. Deeper area levels have tougher, more rewarding monsters (see below) -- reaching an area's exit advances you to the next one. You can Venture into any area level you've already unlocked at any time, including one far below or far above your current character level; nothing stops you, but both extremes come with real tradeoffs (see "Playing outside your level range" below).`]),
    h("div",{},[`From area level ${Balance.LATE_GAME_MONSTER_GROWTH_START_LEVEL} onward, monsters also get an extra flat difficulty bump on top of the normal per-level scaling (+${Math.round(Balance.LATE_GAME_MONSTER_GROWTH_PER_LEVEL*100)} percentage points of HP/damage per area level past ${Balance.LATE_GAME_MONSTER_GROWTH_START_LEVEL-1}) -- by area level 20 that alone is roughly +${Math.round((Balance.lateGameMonsterGrowthMult(20)-1)*100)}% HP/damage on top of everything else, and by area level 60 it's roughly +${Math.round((Balance.lateGameMonsterGrowthMult(60)-1)*100)}%.`]),
  ]));

  root.appendChild(h("h3",{},["Experience: How Much You Need, How Much You Get"]));
  root.appendChild(h("div",{class:"panel",style:{marginBottom:"16px"}},[
    h("div",{style:{marginBottom:"8px"}},[`Leveling up costs more XP at higher character levels: roughly ${Balance.KILLS_PER_LEVEL_TARGET} same-level kills' worth per level, growing steeper as you climb. At Level 1 that's ${Balance.xpRequiredForLevel(1)} XP to hit Level 2; by Level 10 it's ${Balance.xpRequiredForLevel(10)} XP; by Level 30 it's ${Balance.xpRequiredForLevel(30)} XP; by Level ${Balance.LEVEL_CAP} it's ${Balance.xpRequiredForLevel(Balance.LEVEL_CAP)} XP.`]),
    h("div",{style:{marginBottom:"8px"}},[`A monster's XP reward scales with the AREA level it's fought in, not your character level. A monster with a base reward of ${Balance.MONSTER_BASE_XP} XP grants about ${Math.round(Balance.monsterXpReward(Balance.MONSTER_BASE_XP,1))} XP at area level 1, ${Math.round(Balance.monsterXpReward(Balance.MONSTER_BASE_XP,10))} XP at area level 10, ${Math.round(Balance.monsterXpReward(Balance.MONSTER_BASE_XP,30))} XP at area level 30, and ${Math.round(Balance.monsterXpReward(Balance.MONSTER_BASE_XP,60))} XP at area level 60.`]),
    h("div",{},[`These are two DIFFERENT curves on purpose -- what you need to level climbs by your character level, what monsters pay out climbs by the area's level. That's the entire reason farming a low area eventually stops working (next section).`]),
  ]));

  root.appendChild(h("h3",{},["Playing Outside Your Level Range"]));
  root.appendChild(h("div",{class:"panel",style:{marginBottom:"16px"}},[
    h("div",{style:{marginBottom:"8px"}},[`Farming an area well BELOW your character level: the monsters there still pay out XP based on THEIR area level, not yours -- so as your own Level-up cost keeps climbing on its own steeper curve, a trivial area's monsters contribute less and less toward your next level, even though they're still just as easy to kill. There's no explicit "penalty" applied -- it's simply that the two curves above drift apart the further behind the area level falls.`]),
    h("div",{},[`Venturing into an area well ABOVE your character level: monsters there hit much harder and have much more HP (the normal per-area-level growth, plus the level-${Balance.LATE_GAME_MONSTER_GROWTH_START_LEVEL}+ difficulty bump from the section above) -- real risk of a bad fight, not just a wasted trip. The XP and loot on offer scale up to match, so it can be worth it with good gear and healing on hand, but it's genuinely dangerous rather than free extra experience.`]),
  ]));

  root.appendChild(h("h3",{},["Class Tier Promotion Levels"]));
  root.appendChild(h("div",{class:"panel"},[
    h("div",{style:{marginBottom:"8px"}},[`The Broken Bridge Trial (promotion to your path's next class tier) unlocks once you reach a set level on your CURRENT tier:`]),
    h("div",{},[`Tier ${tierRomanNumeral(1)}: reach Level ${Balance.trialLevelRequirement(1)} to attempt promotion to Tier ${tierRomanNumeral(2)}.`]),
    h("div",{},[`Tier ${tierRomanNumeral(2)}: reach Level ${Balance.trialLevelRequirement(2)} to attempt promotion to Tier ${tierRomanNumeral(3)}.`]),
    h("div",{},[`Tier ${tierRomanNumeral(3)}: reach Level ${Balance.trialLevelRequirement(3)} to attempt promotion to Tier ${tierRomanNumeral(4)}.`]),
    h("div",{},[`Tier ${tierRomanNumeral(4)}: reach Level ${Balance.trialLevelRequirement(4)} to attempt promotion to Tier ${tierRomanNumeral(5)}.`]),
    h("div",{style:{marginTop:"8px"}},[`Tier ${tierRomanNumeral(5)} is the final rank on every path -- there's no further promotion trial beyond it. Every class can keep leveling all the way to the level cap (${Balance.LEVEL_CAP}) once there.`]),
  ]));

  return root;
}

// v0.13: town regen tick, reworked -- no more "resting" toggle to click, it's simply
// active on any REGEN_ACTIVE_SCREENS screen (see GF above), and the Bonfire's kindled
// bonus (getActiveBonfireBonus, from spending Dry Logs) stacks on top of the flat
// baseline rate for as long as its 10-minute window lasts.
setInterval(()=>{
  if(PS.current_slot<0) return;
  if(!isRegenActiveNow()) return;
  // v0.14: Potion of Renewal's temporary regen buff stacks additively with the Bonfire's
  // kindled bonus, same flat HP/sec + Stamina/sec addition on top of the baseline rate.
  // v0.16 BUG FIX: PS.getRegen() (class-base regen + gear "Regeneration" affix) was being
  // computed and shown in the Character Sheet's gear-bonus summary line, but was never
  // actually folded into the per-second tick below -- so the "Regeneration" item stat did
  // nothing at all in practice. Added here so it's real again.
  const bonus=PS.getActiveBonfireBonus()+PS.getActiveTempBuff("regen")+PS.getRegen();
  let changed=false;
  if(PS.current_hp<PS.getMaxHp()){ PS.current_hp=Math.min(PS.getMaxHp(),PS.current_hp+Balance.CAMPFIRE_REGEN_PER_SECOND+bonus); changed=true; }
  if(PS.current_stamina<PS.getMaxStamina()){ PS.current_stamina=Math.min(PS.getMaxStamina(),PS.current_stamina+Balance.CAMPFIRE_STAMINA_REGEN_PER_SECOND+bonus); changed=true; }
  if(changed) PS.saveGame();

  // v0.16 (#331): the Kindled Bonfire card needs a full render() on the ONE tick where it
  // actually expires (its title/lore/clickability all change, which no targeted text patch
  // can express) -- detected by: the bonfire's bonus has dropped to 0 but the kindled
  // countdown node from the last render is still sitting on screen. Every OTHER tick while
  // kindled, refreshBonfireCountdownInPlace() below handles it with a cheap text-only patch.
  const bonfireJustExpired = GF.screen==="town" && PS.getActiveBonfireBonus()<=0 && !!document.getElementById("bonfire-countdown-text");
  if(bonfireJustExpired){
    render();
    return;
  }

  if(changed){
    // v0.15 BUG FIX: used to call render() here -- a full app.innerHTML="" + rebuild of
    // the entire screen, every second, on every regen-active screen. That was silently
    // swallowing clicks on buttons elsewhere on the page (reported: the Character Sheet's
    // "<- Back" button "not responding"). Only the live HP/Stamina numbers actually need
    // to change here, so just swap the stat header panel in place instead.
    // v0.18 (#6): pass smooth=true here specifically -- this is the once-a-second campfire
    // regen tick the CSS class above was built for.
    if(!refreshStatHeaderInPlace(true)){ render(); return; }
  }
  if(GF.screen==="town") refreshBonfireCountdownInPlace();
},1000);

// v0.16: Poison effect drain tick (see PS.applyPoison(), inflicted by the ankle-bite
// trap). Deliberately NOT gated to REGEN_ACTIVE_SCREENS like the regen tick above --
// Poison has to keep draining "even outside of combat", i.e. while wandering the maze
// too, not just back in town -- so this runs on every screen. It only ever floors HP at
// 1 (never lethal by itself, see Balance.POISON_DPS/getPoisonResistance()); any OTHER
// damage source (a monster's hit, a fresh trap) can still kill you while it holds you
// there. Uses the same refreshStatHeaderInPlace()-first pattern as the regen tick so it
// doesn't reintroduce the swallowed-click bug on screens (maze, combat) that also render
// a statHeader().
// v0.17 (#8) BUG FIX: this used to `return` immediately once !PS.isPoisoned(), which meant
// the exact tick poison naturally expired never touched the DOM at all -- the status icon
// and the green HP styling just sat there, unchanged, until some UNRELATED action happened
// to trigger a full render() (see statHeader()/refreshStatHeaderInPlace() for the actual
// fade/color-revert logic). `poisonWasActive` remembers last tick's state purely so this
// can detect that one "just expired" tick and still call refreshStatHeaderInPlace() once
// more to kick off the fade -- intentionally a plain closure variable, NOT stored on PS,
// so it's never written into save data.
// v0.18.1 (#28): now sub-ticks at Balance.POISON_TICK_MS (200ms, 5x/sec) instead of a single
// lump once every 1000ms, so the HP bar visibly creeps down in small smooth steps instead of
// snapping -- exact same fix/reasoning as the Health/Stamina Potion heal-over-time ticks
// below. `poisonSaveCounter` throttles PS.saveGame() to roughly once a second (every 5th
// sub-tick) even though the drain itself now happens 5x as often.
let poisonWasActive=false;
let poisonSaveCounter=0;
setInterval(()=>{
  if(PS.current_slot<0) return;
  const poisoned=PS.isPoisoned();
  const applied=PS.tickPoisonDrain();
  if(applied){
    poisonSaveCounter++;
    if(poisonSaveCounter%5===0) PS.saveGame();
  }
  const justExpired=poisonWasActive && !poisoned;
  poisonWasActive=poisoned;
  if(poisoned || justExpired){
    if(!refreshStatHeaderInPlace()) render();
  }
},Balance.POISON_TICK_MS);

// v0.17.3 (#8): Health Potion heal-over-time tick. Deliberately NOT gated to
// REGEN_ACTIVE_SCREENS (unlike the campfire regen tick above) -- a potion drunk mid-combat
// or mid-maze has to keep delivering its heal wherever the player is, same "runs on every
// screen" reasoning as the poison drain tick just above. Runs at Balance.POTION_HEAL_
// TICK_MS (200ms, 5x/sec) rather than once a second purely so the HP bar visibly creeps up
// in small smooth steps instead of jumping in 5 chunky once-a-second increments -- see
// PS.tickActiveHeals()/PS.getHealPerSecond() for the actual math. `healSaveCounter` throttles
// PS.saveGame() to roughly once a second (every 5th sub-tick) even while healing is active,
// same spirit as the regen tick's cadence -- there's no need to hit the network 5x/sec for a
// handful of HP per sub-tick, and Net.saveCharacter's own coalescing (see its declaration)
// means a slightly-stale in-flight save is never actually lost, just superseded.
let healSaveCounter=0;
setInterval(()=>{
  if(PS.current_slot<0) return;
  if(!PS.active_heals || !PS.active_heals.length) return;
  const hadHeals=PS.active_heals.length>0;
  const changed=PS.tickActiveHeals();
  const stillHealing=PS.active_heals.length>0;
  healSaveCounter++;
  if((healSaveCounter%5===0) || (hadHeals && !stillHealing)) PS.saveGame();
  if(changed){
    if(!refreshStatHeaderInPlace()) render();
  }
},Balance.POTION_HEAL_TICK_MS);

// v0.18.1 (#20): Stamina Potion heal-over-time tick -- exact mirror of the Health Potion
// interval immediately above (same cadence, same throttled-save reasoning, own independent
// save counter so the two ticks' throttling schedules don't have to line up).
let staminaHealSaveCounter=0;
setInterval(()=>{
  if(PS.current_slot<0) return;
  if(!PS.active_stamina_heals || !PS.active_stamina_heals.length) return;
  const hadHeals=PS.active_stamina_heals.length>0;
  const changed=PS.tickActiveStaminaHeals();
  const stillHealing=PS.active_stamina_heals.length>0;
  staminaHealSaveCounter++;
  if((staminaHealSaveCounter%5===0) || (hadHeals && !stillHealing)) PS.saveGame();
  if(changed){
    if(!refreshStatHeaderInPlace()) render();
  }
},Balance.POTION_HEAL_TICK_MS);

// v0.18 (#14) / v0.18.1 (#29): refresh "Currently playing" every 30s. Used to also require
// GF.chatOpen (no point polling while the line was hidden inside the closed chat panel), but
// the line is now always visible at the top of the page (see render()/activePlayersLine()),
// so the only real gate left is being logged in at all. 30s is frequent enough to feel live
// against a 5-minute activity window without hammering the server every render like the
// once-a-second regen/poison ticks do.
setInterval(()=>{
  if(!Net.online) return;
  Net.fetchActivePlayers().then(render).catch(()=>{});
},30000);

(async function boot(){
  const resumed = await Net.tryResumeSession();
  if(resumed) GF.screen="mainMenuSlots";
  render();
})();
</script>
