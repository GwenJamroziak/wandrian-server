    this.lifetime_xp+=rounded;
    let leveled=false;
    while(this.xp>=this.xp_to_next && this.level<Balance.LEVEL_CAP){
      this.xp-=this.xp_to_next; this.level++; this.xp_to_next=Balance.xpRequiredForLevel(this.level);
      this.unspent_stat_points+=Balance.STAT_POINTS_PER_LEVEL;

      {
        const c=this.getClassData();
        if(c.chain==="thornguard") this.attributes.str=(this.attributes.str||0)+Balance.LEVEL_UP_PRIMARY_ATTR_BONUS;
        else if(c.chain==="windrider") this.attributes.dex=(this.attributes.dex||0)+Balance.LEVEL_UP_PRIMARY_ATTR_BONUS;
        else if(c.chain==="wizard") this.attributes.int=(this.attributes.int||0)+Balance.LEVEL_UP_PRIMARY_ATTR_BONUS;
      }
      this.current_hp=this.getMaxHp(); leveled=true;
    }
    if(this.level>=Balance.LEVEL_CAP) this.xp=0;
    return leveled;
  },

  addXp(amount){
    return this._applyLeveledXp(amount*(1+getTotalXpBonusPct()/100));
  },

  addXpRaw(amount){
    return this._applyLeveledXp(amount);
  },
  canAttemptTrial(){return this.level>=Balance.trialLevelRequirement(this.getClassData().tier||1);},
  gamblingUnlocked(){return this.highest_tier_reached>=2 || this.season_won;},

  keeperEligible(){return (this.getClassData().tier||1)>=5 && this.level>=Balance.LEVEL_CAP && (this.highest_tier_reached||1)>=5 && !this.emerald_choice;},
  keeperChoiceMade(){return !!this.emerald_choice;},
  getEyesightRadius(){
    let r=1;
    const gearBonus=this.gearBonus("eyesight");
    if(gearBonus>0) r=Math.max(r,gearBonus);
    if(this.eyesight_potion_steps_left>0) r=Math.max(r,2);
    return r;
  },
  resolveMasterTrial(success){
    const currentTier=this.getClassData().tier||1;
    const nextId=DL.getNextClassId(this.class_id);
    const result={success, final_tier:nextId===""};

    this.trial_attempts_count=(this.trial_attempts_count||0)+1;
    if(success){
      this.highest_tier_reached=Math.max(this.highest_tier_reached,currentTier+1);

      if(nextId!=="") this.class_id=nextId;

      this.last_bridge_steps=0;

      this.bridge_fail_streak=0;
    } else {

      this.bridge_fail_streak=(this.bridge_fail_streak||0)+1;
    }

    this.level=1; this.xp=0; this.xp_to_next=Balance.xpRequiredForLevel(this.level);

    this._resetAttributesToClassBase(Balance.STARTING_STAT_POINTS+this.bridge_fail_streak);
    this.current_hp=this.getMaxHp(); this.current_stamina=this.getMaxStamina();

    this.max_maze_depth_reached=1;
    return result;
  },
  getEffectiveAreaLevel(bonus=0){return clampi(this.level+bonus, Balance.AREA_LEVEL_MIN, Balance.AREA_LEVEL_MAX);},
  consumePendingScrollBonus(){const b=this.pending_scroll_bonus; this.pending_scroll_bonus=0; return b;},
  useScroll(itemId){
    const item=DL.getItem(itemId);
    if(item.type!=="scroll") return false;
    if((this.consumables[itemId]||0)<=0) return false;
    this._removeConsumableOne(itemId);
    this.pending_scroll_bonus=item.level_bonus||0;
    return true;
  },
  applyXpShrineBuff(){ this.xp_buff_multiplier=Balance.SHRINE_XP_BUFF_MULT; this.xp_buff_encounters_left+=Balance.SHRINE_XP_BUFF_ENCOUNTERS; },
  tickXpBuff(){ if(this.xp_buff_encounters_left>0){ this.xp_buff_encounters_left--; if(this.xp_buff_encounters_left===0) this.xp_buff_multiplier=1.0; } },
  spendStamina(amount){
    if(this.stamina_shrine_buff>0){ const fromBuff=Math.min(this.stamina_shrine_buff,amount); this.stamina_shrine_buff-=fromBuff; amount-=fromBuff; }
    this.current_stamina=Math.max(0,this.current_stamina-amount);
  },
  restoreStamina(amount){ this.current_stamina=Math.min(this.getMaxStamina(),this.current_stamina+amount); },
  addStaminaShrineBuff(bonus){ this.current_stamina=this.getMaxStamina(); this.stamina_shrine_buff+=bonus; },
  addGold(amount){ this.gold=Math.max(0,Math.round(this.gold+amount*this.getGoldFindMult())); },

  kindleBonfireInstant(){
    const totalTicks=Balance.POTION_HEAL_DURATION_MS/Balance.POTION_HEAL_TICK_MS;
    if(this.current_hp<this.getMaxHp()){
      this._queueGradualHeal(this.active_heals,this.getMaxHp()-this.current_hp,this.getMaxHp()-this.current_hp,totalTicks);
    }
    if(this.current_stamina<this.getMaxStamina()){
      this._queueGradualHeal(this.active_stamina_heals,this.getMaxStamina()-this.current_stamina,this.getMaxStamina()-this.current_stamina,totalTicks);
    }

    if(this.current_mana<this.getMaxMana()){
      this._queueGradualHeal(this.active_mana_heals,this.getMaxMana()-this.current_mana,this.getMaxMana()-this.current_mana,totalTicks);
    }
  },

  applyPoison(areaLevel){
    this.poison_expires_at=Date.now()+Balance.POISON_DURATION_MS;
    this.poison_pct_per_sec=Balance.poisonPctPerSecForAreaLevel(areaLevel||1);
  },
  isPoisoned(){
    return !!(this.poison_expires_at && Date.now()<this.poison_expires_at);
  },

  curePoison(){
    this.poison_expires_at=0; this.poison_pct_per_sec=0;
  },
  getPoisonMsLeft(){
    return this.isPoisoned() ? Math.max(0,this.poison_expires_at-Date.now()) : 0;
  },

  getPoisonHpPerSec(){
    if(!this.isPoisoned()) return 0;
    const pct=this.poison_pct_per_sec||Balance.POISON_PCT_PER_SEC_PER_TIER;
    return this.getMaxHp()*pct*(1-this.getPoisonResistance()/100);
  },

  tickPoisonDrain(){
    if(!this.isPoisoned() || this.current_hp<=1) return false;
    const dpsPerSecond=this.getPoisonHpPerSec();
    if(dpsPerSecond<=0) return false;
    const perTick=dpsPerSecond/(1000/Balance.POISON_TICK_MS);
    this.current_hp=Math.max(1,this.current_hp-perTick);
    return true;
  },

  applyTempBuff(type,amount,durationMs){ this.temp_buffs[type]={amount, expires_at:Date.now()+durationMs}; },
  getActiveTempBuff(type){
    const b=this.temp_buffs && this.temp_buffs[type];
    if(b && Date.now()<b.expires_at) return b.amount;
    return 0;
  },
  getTempBuffMsLeft(type){
    const b=this.temp_buffs && this.temp_buffs[type];
    if(b && Date.now()<b.expires_at) return b.expires_at-Date.now();
    return 0;
  },

  applyDeathPenalty(){

    const targetXpLoss=Math.round((this.xp_to_next||0)*Balance.DEATH_XP_LOSS_PCT);
    const xpLost=Math.min(this.xp,targetXpLoss);
    this.xp=Math.max(0,this.xp-targetXpLoss);
    this.current_hp=Balance.DEATH_WAKE_HP;
    this.resetKillStreak();
    return {goldLost:0,itemsLost:[],xpLost};
  },

  _rollDeathItemLosses(){
    const lost=[];
    if(Math.random()>=Balance.DEATH_ITEM_LOSS_CHANCE) return lost;
    let count=1;
    while(Math.random()<0.5 && count<Balance.DEATH_ITEM_LOSS_MAX_COUNT) count++;
    for(let i=0;i<count;i++){
      const desc=this._loseOneRandomItem();
      if(!desc) break;
      lost.push(desc);
    }
    return lost;
  },

  _loseOneRandomItem(){
    const equippedSlots=IF.EQUIPPED_SLOT_KEYS.filter(s=>this.equipped[s]);
    const consumableIds=Object.keys(this.consumables).filter(k=>this.consumables[k]>0);
    const nonEquippedCount=this.gear_instances.length+consumableIds.length;
    const pools=[];
    if(equippedSlots.length) pools.push({weight:Balance.DEATH_EQUIPPED_LOSS_WEIGHT,kind:"equipped"});
    if(nonEquippedCount) pools.push({weight:Balance.DEATH_BACKPACK_LOSS_WEIGHT,kind:"backpack"});
    if(pools.length===0) return null;
    const totalWeight=pools.reduce((s,p)=>s+p.weight,0);
    let r=Math.random()*totalWeight, chosen=pools[pools.length-1].kind;
    for(const p of pools){ if(r<p.weight){ chosen=p.kind; break; } r-=p.weight; }

    if(chosen==="equipped"){
      const slot=equippedSlots[randi(equippedSlots.length)];
      const inst=this.equipped[slot];
      this.equipped[slot]=null;
      return {text:`${IF.displayName(inst)} (equipped)`, rarity:inst.rarity};
    }

    const backpackChoices=this.gear_instances.map((inst,idx)=>({type:"gear",idx})).concat(consumableIds.map(id=>({type:"consumable",id})));
    if(backpackChoices.length===0) return null;
    const choice=backpackChoices[randi(backpackChoices.length)];
    if(choice.type==="gear"){
      const inst=this.gear_instances[choice.idx];
      this.gear_instances.splice(choice.idx,1);
      return {text:IF.displayName(inst), rarity:inst.rarity};
    }
    const qtyLost=this.consumables[choice.id];
    delete this.consumables[choice.id];
    return {text:`${DL.getItem(choice.id).name} x${qtyLost}`, rarity:null};
  },
  incrementKillStreak(){
    this.kill_streak++;

    if(this.kill_streak>this.max_kill_streak) this.max_kill_streak=this.kill_streak;
  },
  resetKillStreak(){ this.kill_streak=0; },

  getForestReputation(tier){
    const raw=(this.forest_reputation && this.forest_reputation[tier]) || 0;
    return Math.max(Balance.FOREST_REPUTATION_MIN,Math.min(Balance.FOREST_REPUTATION_MAX,raw));
  },

  getCurrentForestReputation(){ return this.getForestReputation(this.getClassData().tier||1); },
  adjustForestReputation(delta){

    const tier=this.getClassData().tier||1;
    if(!this.forest_reputation) this.forest_reputation={};
    const next=(this.forest_reputation[tier]||0)+delta;
    this.forest_reputation[tier]=Math.max(Balance.FOREST_REPUTATION_MIN,Math.min(Balance.FOREST_REPUTATION_MAX,next));
  },

  getForestReputationXpMult(){ return 1+Math.max(0,this.getCurrentForestReputation())*Balance.FOREST_REPUTATION_XP_PCT_PER_POINT/100; },

  getForestReputationExtraRoamers(){ return Math.max(0,-this.getCurrentForestReputation()); },
  handleDeath(cause){
    if(this.hardcore){
      const cd=this.getClassData();
      const entry={name:this.character_name, class_name:cd.display_name||this.class_id, level:this.level, cause, date:new Date().toISOString()};
      appendGraveyard(entry);
      if(this.current_slot>=0) deleteSave(this.current_slot, entry);
      this.current_slot=-1;
      return {dead:true,penalty:null};
    }
    const penalty=this.applyDeathPenalty();
    return {dead:false,penalty};
  },
  addConsumable(itemId,count=1){ this.consumables[itemId]=(this.consumables[itemId]||0)+count; },
  _removeConsumableOne(itemId){ const rem=(this.consumables[itemId]||0)-1; if(rem>0) this.consumables[itemId]=rem; else delete this.consumables[itemId]; },

  _queueGradualHeal(arr,amount,headroom,totalTicks){
    if(headroom<=0) return;
    const currentPending=arr.reduce((sum,heal)=>sum+heal.perTick*heal.ticksLeft,0);
    const newPending=Math.min(Math.max(0,headroom-currentPending),amount);
    if(newPending<=0) return;
    const rate=amount/totalTicks;
    arr.push({perTick:rate, ticksLeft: rate>0?newPending/rate:0});
  },
  useConsumable(itemId){
    if(!this.canUseConsumable(itemId)) return false;
    const item=DL.getItem(itemId); let used=false;
    const totalTicks=Balance.POTION_HEAL_DURATION_MS/Balance.POTION_HEAL_TICK_MS;

    if((item.heal_amount||0)>0 && (this.current_hp+this.getPendingHealAmount())<this.getMaxHp()){
      this._queueGradualHeal(this.active_heals,item.heal_amount,this.getMaxHp()-this.current_hp,totalTicks);
      used=true;
    }

    if((item.stamina_amount||0)>0 && (this.current_stamina+this.getPendingStaminaHealAmount())<this.getMaxStamina()){
      this._queueGradualHeal(this.active_stamina_heals,item.stamina_amount,this.getMaxStamina()-this.current_stamina,totalTicks);
      used=true;
    }

    if((item.mana_amount||0)>0 && (this.current_mana+this.getPendingManaHealAmount())<this.getMaxMana()){
      this._queueGradualHeal(this.active_mana_heals,item.mana_amount,this.getMaxMana()-this.current_mana,totalTicks);
      used=true;
    }
    if((item.eyesight_steps||0)>0){ this.eyesight_potion_steps_left=item.eyesight_steps; used=true; }

    if(item.buff_type){ this.applyTempBuff(item.buff_type,item.buff_amount,item.buff_duration_ms||Balance.POTION_BUFF_DURATION_MS); used=true; }

    if(item.cures_poison && this.isPoisoned()){ this.curePoison(); used=true; }

    if(item.reveals_maze){
      if(!(GF.screen==="maze" && GF.overworld_snapshot)) return false;
      if(this.clarity_charges_left<=0){
        if((this.consumables[itemId]||0)<1) return false;
        this._removeConsumableOne(itemId);
        this.clarity_charges_left=10;
      }
      const maze=GF.overworld_snapshot;
      for(const c of maze.cells) c.discovered=true;
      this.clarity_charges_left--;
      return true;
    }
    if(used) this._removeConsumableOne(itemId);
    return used;
  },

  getTotalClarityChargesRemaining(){ return (this.clarity_charges_left||0) + (this.consumables["elixir_of_clarity"]||0)*10; },
  canUseConsumable(itemId){
    const item=DL.getItem(itemId);

    if(item.reveals_maze){
      if(GF.screen!=="maze" || !GF.overworld_snapshot) return false;
      if(!GF.overworld_snapshot.cells.some(c=>!c.discovered)) return false;
      return this.clarity_charges_left>0 || (this.consumables[itemId]||0)>=1;
    }
    if((this.consumables[itemId]||0)<=0) return false;
    if((item.heal_amount||0)>0 && (this.current_hp+this.getPendingHealAmount())<this.getMaxHp()) return true;
    if((item.stamina_amount||0)>0 && (this.current_stamina+this.getPendingStaminaHealAmount())<this.getMaxStamina()) return true;

    if((item.mana_amount||0)>0 && (this.current_mana+this.getPendingManaHealAmount())<this.getMaxMana()) return true;

    if((item.eyesight_steps||0)>0) return this.eyesight_potion_steps_left<=0;
    if(item.buff_type) return true;

    if(item.cures_poison && this.isPoisoned()) return true;
    return false;
  },

  tickActiveHeals(){
    if(!this.active_heals || !this.active_heals.length) return false;
    let changed=false;
    const maxHp=this.getMaxHp();
    for(const heal of this.active_heals){
      if(this.current_hp<maxHp){ this.current_hp=Math.min(maxHp,this.current_hp+heal.perTick); changed=true; }
      heal.ticksLeft--;
    }
    this.active_heals=this.active_heals.filter(heal=>heal.ticksLeft>0);
    return changed;
  },

  getHealPerSecond(){
    if(!this.active_heals || !this.active_heals.length) return 0;
    const ticksPerSecond=1000/Balance.POTION_HEAL_TICK_MS;
    return this.active_heals.reduce((sum,heal)=>sum+heal.perTick*ticksPerSecond,0);
  },

  getPendingHealAmount(){
    if(!this.active_heals || !this.active_heals.length) return 0;
    const total=this.active_heals.reduce((sum,heal)=>sum+heal.perTick*heal.ticksLeft,0);
    return Math.min(total, Math.max(0,this.getMaxHp()-this.current_hp));
  },

  tickActiveStaminaHeals(){
    if(!this.active_stamina_heals || !this.active_stamina_heals.length) return false;
    let changed=false;
    const maxStamina=this.getMaxStamina();
    for(const heal of this.active_stamina_heals){
      if(this.current_stamina<maxStamina){ this.current_stamina=Math.min(maxStamina,this.current_stamina+heal.perTick); changed=true; }
      heal.ticksLeft--;
    }
    this.active_stamina_heals=this.active_stamina_heals.filter(heal=>heal.ticksLeft>0);
    return changed;
  },
  getStaminaHealPerSecond(){
    if(!this.active_stamina_heals || !this.active_stamina_heals.length) return 0;
    const ticksPerSecond=1000/Balance.POTION_HEAL_TICK_MS;
    return this.active_stamina_heals.reduce((sum,heal)=>sum+heal.perTick*ticksPerSecond,0);
  },
  getPendingStaminaHealAmount(){
    if(!this.active_stamina_heals || !this.active_stamina_heals.length) return 0;
    const total=this.active_stamina_heals.reduce((sum,heal)=>sum+heal.perTick*heal.ticksLeft,0);
    return Math.min(total, Math.max(0,this.getMaxStamina()-this.current_stamina));
  },

  tickActiveManaHeals(){
    if(!this.active_mana_heals || !this.active_mana_heals.length) return false;
    let changed=false;
    const maxMana=this.getMaxMana();
    for(const heal of this.active_mana_heals){
      if(this.current_mana<maxMana){ this.current_mana=Math.min(maxMana,this.current_mana+heal.perTick); changed=true; }
      heal.ticksLeft--;
    }
    this.active_mana_heals=this.active_mana_heals.filter(heal=>heal.ticksLeft>0);
    return changed;
  },
  getManaHealPerSecond(){
    if(!this.active_mana_heals || !this.active_mana_heals.length) return 0;
    const ticksPerSecond=1000/Balance.POTION_HEAL_TICK_MS;
    return this.active_mana_heals.reduce((sum,heal)=>sum+heal.perTick*ticksPerSecond,0);
  },
  getPendingManaHealAmount(){
    if(!this.active_mana_heals || !this.active_mana_heals.length) return 0;
    const total=this.active_mana_heals.reduce((sum,heal)=>sum+heal.perTick*heal.ticksLeft,0);
    return Math.min(total, Math.max(0,this.getMaxMana()-this.current_mana));
  },

  bestAvailableConsumable(kind){
    const field=({health:"heal_amount",stamina:"stamina_amount",mana:"mana_amount"})[kind]||"heal_amount";
    let bestId="", bestAmt=-1;
    for(const itemId in this.consumables){
      if((this.consumables[itemId]||0)<=0) continue;
      const item=DL.getItem(itemId);
      if(item.type!=="consumable") continue;
      const amt=item[field]||0;
      if(amt<=0) continue;
      if(amt>bestAmt){ bestAmt=amt; bestId=itemId; }
    }
    return bestId;
  },

  lowestAvailableConsumable(kind){

    const field=({health:"heal_amount",stamina:"stamina_amount",mana:"mana_amount"})[kind]||"heal_amount";
    let bestId="", bestAmt=Infinity;
    for(const itemId in this.consumables){
      if((this.consumables[itemId]||0)<=0) continue;
      const item=DL.getItem(itemId);
      if(item.type!=="consumable") continue;
      const amt=item[field]||0;
      if(amt<=0) continue;
      if(amt<bestAmt){ bestAmt=amt; bestId=itemId; }
    }
    return bestId;
  },

  buyConsumable(itemId,qty=1){
    const item=DL.getItem(itemId); if(!item.name) return false;

    if(Balance.MERCHANT_EXCLUDED_ITEMS.includes(itemId)) return false;
    if(qty<=0) return false;
    const price=Balance.itemBuyPrice(item)*qty;
    if(this.gold<price) return false;
    this.gold-=price; this.addConsumable(itemId,qty); return true;
  },
  getInventoryCapacity(){
    let cap=Balance.BASE_INVENTORY_SLOTS;
    for(const bagId of this.equipped_bags) cap+=DL.getItem(bagId).capacity||0;
    return cap;
  },

  getInventoryUsed(){return this.gear_instances.length + (this.bags||[]).length;},
  hasInventorySpace(){return this.getInventoryUsed()<this.getInventoryCapacity();},

  addBagToBackpack(itemId){
    if(!this.hasInventorySpace()) return {success:false,reason:"Your backpack is full."};
    this.bags.push(itemId);
    return {success:true};
  },

  equipBag(itemId){
    const idx=this.bags.indexOf(itemId);
    if(idx===-1) return {success:false,reason:"You don't have that bag in your backpack."};
    if(this.equipped_bags.length>=Balance.MAX_BAG_SLOTS) return {success:false,reason:`Your bag slots are full (${this.equipped_bags.length}/${Balance.MAX_BAG_SLOTS}), unequip a bag first.`};
    this.bags.splice(idx,1);
    this.equipped_bags.push(itemId); return {success:true};
  },

  wouldOverflowWithoutBag(itemId){
    if(!this.equipped_bags.includes(itemId)) return false;
    const capacityWithout=this.getInventoryCapacity()-(DL.getItem(itemId).capacity||0);
    return this.getInventoryUsed()>capacityWithout;
  },

  unequipBag(itemId){
    if(this.wouldOverflowWithoutBag(itemId)) return false;
    if(!this.hasInventorySpace()) return false;
    const idx=this.equipped_bags.indexOf(itemId); if(idx!==-1) this.equipped_bags.splice(idx,1); else return false;
    this.bags.push(itemId);
    return true;
  },
  buyBag(itemId){
    const item=DL.getItem(itemId); if(!item.name||item.type!=="bag") return {success:false,reason:"Unknown bag."};
    const price=Balance.bagBuyPrice(item.capacity||0);
    if(this.gold<price) return {success:false,reason:"Not enough gold."};

    const result=this.addBagToBackpack(itemId); if(!result.success) return result;
    this.gold-=price; return {success:true};
  },
  craftBag(itemId){
    const item=DL.getItem(itemId); if(!item.name||item.type!=="bag") return {success:false,reason:"Unknown bag."};
    const cost=Balance.bagCraftCost(item.capacity||0);
    if(this.materials<cost) return {success:false,reason:"Not enough materials."};

    const result=this.addBagToBackpack(itemId); if(!result.success) return result;

    this.materials-=cost; notifyMaterialsChange(-cost); return {success:true};
  },
  addGear(inst){ if(!this.hasInventorySpace()) return false; this.gear_instances.push(inst); return true; },
  findGearIndex(instanceId){ return this.gear_instances.findIndex(g=>g.instance_id===instanceId); },

  canEquipGear(inst){ return this.level>=Balance.tierLevelRequirement(inst.tier) && IF.classCanEquipItem(this.class_id, inst); },

  classInvalidGear(inst){ return !IF.classCanEquipItem(this.class_id, inst); },

  gearInvalidReason(inst){
    const needLevel=Balance.tierLevelRequirement(inst.tier);
    if(this.level<needLevel) return `Requires Level ${needLevel}, you are Lv ${this.level}.`;
    if(!IF.classCanEquipItem(this.class_id, inst)){

      if(inst.slot==="offhand"){
        const offhandType=IF.offhandTypeForInstance(inst);
        const label=IF.OFFHAND_TYPE_LABELS[offhandType]||"off-hand item";
        return `${this.getClassData().display_name||this.class_id} cannot equip a ${label}.`;
      }
      const weaponType=IF.weaponTypeForInstance(inst);
      const label=IF.WEAPON_TYPE_LABELS[weaponType]||"weapon";
      return `${this.getClassData().display_name||this.class_id} cannot equip a ${label}.`;
    }
    return "";
  },

  _autoEquipTargetSlot(inst){
    const genSlot=inst.slot;
    if(genSlot==="ring") return !this.equipped["ring1"] ? "ring1" : (!this.equipped["ring2"] ? "ring2" : null);
    if(!IF.EQUIPPED_SLOT_KEYS.includes(genSlot)) return null;
    return this.equipped[genSlot] ? null : genSlot;
  },
  canAutoEquip(inst){ return this.canEquipGear(inst) && !!this._autoEquipTargetSlot(inst); },

  addGearAutoEquip(inst){
    if(this.canAutoEquip(inst)){
      this.equipped[this._autoEquipTargetSlot(inst)]=inst;
      this.current_hp=Math.min(this.current_hp,this.getMaxHp());
      return true;
    }
    return this.addGear(inst);
  },

  equipGear(instanceId,forcedRingTarget){
    const idx=this.findGearIndex(instanceId); if(idx===-1) return;
    const inst=this.gear_instances[idx];
    if(!this.canEquipGear(inst)) return;
    const genSlot=inst.slot; let target=genSlot;
    if(genSlot==="ring"){
      if(forcedRingTarget==="ring1"||forcedRingTarget==="ring2") target=forcedRingTarget;
      else if(!this.equipped["ring1"]) target="ring1"; else if(!this.equipped["ring2"]) target="ring2"; else target="ring1";
    } else if(!IF.EQUIPPED_SLOT_KEYS.includes(genSlot)) return;
    this.gear_instances.splice(idx,1);
    if(this.equipped[target]) this.gear_instances.push(this.equipped[target]);
    this.equipped[target]=inst;
    this.current_hp=Math.min(this.current_hp,this.getMaxHp());
  },

  unequipSlot(slot){ if(!this.equipped[slot]) return false; if(!this.hasInventorySpace()) return false; this.gear_instances.push(this.equipped[slot]); this.equipped[slot]=null; return true; },
  wouldSwap(inst){
    if(inst.slot==="ring") return !!(this.equipped["ring1"] && this.equipped["ring2"]);
    return !!this.equipped[inst.slot];
  },
  salvageGear(instanceId){
    const idx=this.findGearIndex(instanceId); if(idx===-1) return;
    const inst=this.gear_instances[idx];
    const gained=Balance.salvageValue(inst.tier, IF.slotCount(inst));
    this.materials+=gained;

    notifyMaterialsChange(gained);
    this.gear_instances.splice(idx,1);
  },
  sellGear(instanceId){
    const idx=this.findGearIndex(instanceId); if(idx===-1) return;
    const inst=this.gear_instances[idx];
    this.addGold(Balance.sellValue(inst.tier, IF.slotCount(inst)));
    this.gear_instances.splice(idx,1);
  },

  rerollGear(instanceId){
    const idx=this.findGearIndex(instanceId); if(idx===-1) return null;
    const inst=this.gear_instances[idx];
    const cost=Balance.rerollCost(inst.tier, IF.slotCount(inst));
    if(this.materials<cost) return null;
    this.materials-=cost; const rerolled=IF.reroll(inst); this.gear_instances[idx]=rerolled; return rerolled;
  },
  addHerb(herbId,count=1){ this.herbs[herbId]=(this.herbs[herbId]||0)+count; },

  canAffordRecipe(recipe,qty=1){
    for(const h in recipe.herbs) if((this.herbs[h]||0)<recipe.herbs[h]*qty) return false;
    if((recipe.gold_cost||0)*qty>this.gold) return false;
    return true;
  },
  brewRecipe(recipe,qty=1){
    if(!this.canAffordRecipe(recipe,qty)) return false;
    for(const h in recipe.herbs) this.herbs[h]-=recipe.herbs[h]*qty;
    if(recipe.gold_cost) this.gold-=recipe.gold_cost*qty;
    this.addConsumable(recipe.result_item,qty); return true;
  },

  _applyLoadedData(slot,parsed){

function h(tag, attrs={}, children=[]){
  const e=document.createElement(tag);
  for(const k in attrs){
    const v=attrs[k];
    if(k==="style") Object.assign(e.style, v);
    else if(k==="html") e.innerHTML=v;
    else if(k==="class") e.className=v;
    else if(k.startsWith("on") && typeof v==="function") e.addEventListener(k.slice(2).toLowerCase(), v);
    else if(v!==false && v!=null) e.setAttribute(k, v===true?"":v);
  }
  const kids=Array.isArray(children)?children:[children];
  for(const c of kids){
    if(c==null) continue;
    e.appendChild((typeof c==="string"||typeof c==="number")?document.createTextNode(String(c)):c);
  }
  return e;
}

function spawnFloat(anchor,text,cls,fontSizeEm){
  const durationMs=(cls==="float-text-xp"||cls==="float-text-gold")?FLOAT_LOOT_DURATION_MS:FLOAT_COMBAT_DURATION_MS;
  GF.floatingTexts.push({id:++_floatSeq,anchor,kind:"text",text,cls,t:Date.now(),durationMs,fontSizeEm});
}

function critFloatFontSizeEm(rolledMult, maxMult, floorOverride){
  const floor=floorOverride==null?Balance.CRIT_MULTIPLIER:floorOverride;
  const frac=maxMult>floor ? clampf((rolledMult-floor)/(maxMult-floor),0,1) : 0;
  if(frac<0.15) return 1.2;
  if(frac<0.45) return 1.5;
  if(frac<0.75) return 1.9;
  return 2.4;
}

let _bulkNotifyDepth=0, _bulkGold=0, _bulkMaterials=0;
function beginBulkNotify(){
  if(_bulkNotifyDepth===0){ _bulkGold=0; _bulkMaterials=0; }
  _bulkNotifyDepth++;
}
function endBulkNotify(){
  _bulkNotifyDepth=Math.max(0,_bulkNotifyDepth-1);
  if(_bulkNotifyDepth>0) return;
  const gold=_bulkGold, materials=_bulkMaterials;
  _bulkGold=0; _bulkMaterials=0;
  if(gold) spawnFloat("gold",`${gold>0?"+":""}${Math.round(gold)}g`,"float-text-gold");
  if(materials) spawnFloat("materials",`${materials>0?"+":""}${Math.round(materials)} materials`,materials>0?"float-text-gold":"float-text-dmg");
}
function notifyGoldChange(delta){
  if(!delta) return;
  if(_bulkNotifyDepth>0){ _bulkGold+=delta; return; }
  spawnFloat("gold",`${delta>0?"+":""}${delta}g`,"float-text-gold");
}

function notifyMaterialsChange(delta){
  if(!delta) return;
  if(_bulkNotifyDepth>0){ _bulkMaterials+=delta; return; }
  spawnFloat("materials",`${delta>0?"+":""}${delta} materials`,delta>0?"float-text-gold":"float-text-dmg");
}

function fireflyBurstLayer(){
  const now=Date.now();
  const spanMs=Balance.SPELLS.fireflies.duration_ms;
  GF.fireflyBursts=GF.fireflyBursts.filter(b=>now-b.t<spanMs+FIREFLY_BURST_MOTE_MS+300);
  const nodes=[];
  GF.fireflyBursts.forEach(b=>{
    for(let i=0;i<FIREFLY_BURST_MOTE_COUNT;i++){

      const startAt=b.t+i*(spanMs/FIREFLY_BURST_MOTE_COUNT);
      if(now-startAt>FIREFLY_BURST_MOTE_MS+300) continue;
      const angle=(i/FIREFLY_BURST_MOTE_COUNT)*Math.PI*2;
      const fmx=Math.round(Math.cos(angle)*46-10), fmy=Math.round(46+Math.sin(angle)*18);
      const mote=h("div",{class:"firefly-mote",style:{
        animationDelay:(startAt-now)+"ms", animationDuration:FIREFLY_BURST_MOTE_MS+"ms",
      }});

      mote.style.setProperty("--fmx",fmx+"px");
      mote.style.setProperty("--fmy",fmy+"px");
      nodes.push(mote);
    }
  });
  return h("div",{class:"firefly-burst-layer"},nodes);
}

  const entries=Net.activePlayersCache;

const PROMOTION_CHAT_PATTERN=/has passed the broken bridge trial and is now a /;

const BIRTH_CHAT_PATTERN=/^Nature has given birth to a new /;
function chatLogEntries(){
  const entries=[];

  for(const m of Net.chatMessages){
    const isPromotion=m.username==="System" && PROMOTION_CHAT_PATTERN.test(m.message);

    const isDeath=m.username==="System" && m.kind==="death";
    const isAdmin=m.username==="System" && m.kind==="admin";

    const isBirth=m.username==="System" && BIRTH_CHAT_PATTERN.test(m.message);
    const cls=isDeath?"chat-death-msg":isBirth?"chat-birth-msg":isAdmin?"chat-admin-msg":isPromotion?"chat-promotion-msg":"";
    entries.push({t:new Date(m.created_at).getTime(), node:h("div",{class:cls},[h("span",{class:"muted"},[`[${new Date(m.created_at).toLocaleTimeString()}] `]), m.username!=="System"?h("span",{style:{fontWeight:"bold"}},[m.username+": "]):null, isPromotion?"🎉 ":null, isDeath?"🪦 ":null, isBirth?"➕ ":null, m.message])});
  }
  for(const m of Net.privateMessages) entries.push({t:new Date(m.created_at).getTime(), node:h("div",{class:"chat-private-msg"},[h("span",{class:"muted"},[`[${new Date(m.created_at).toLocaleTimeString()}] `]), m.message])});
  entries.sort((a,b)=>a.t-b.t);
  return entries.map(e=>e.node);
}

function refreshBonfireBlazeInPlace(){
  const kindle=GF.bonfireKindle;
  if(!kindle) return false;
  const btn=document.getElementById("kindle-bonfire-btn");
  const blaze=document.getElementById("kindle-bonfire-blaze");
  const label=document.getElementById("kindle-bonfire-label");
  if(!btn || !btn.parentNode || !blaze || !label) return false;
  const WARM_MS=Balance.POTION_HEAL_DURATION_MS, HOLD_MS=900, FADE_MS=750;
  const elapsed=Date.now()-kindle.startedAt;
  const warming=elapsed<WARM_MS;
  const holding=!warming && elapsed<WARM_MS+HOLD_MS;
  const fading=!warming && !holding;
  const pct=warming?clampf(elapsed/WARM_MS*100,0,100):100;
  blaze.style.width=pct+"%";

  const emberTop=document.getElementById("kindle-bonfire-emberline-top");
  const emberBottom=document.getElementById("kindle-bonfire-emberline-bottom");
  if(emberTop) emberTop.style.width=pct+"%";
  if(emberBottom) emberBottom.style.width=pct+"%";
  btn.classList.toggle("lit",!fading);
  btn.classList.toggle("fading",fading);

  label.textContent=warming?"Warming...":(holding?"You feel fully restored":"Kindle the Bonfire");
  return true;
}

function refreshGambleBarInPlace(){
  const fill=document.getElementById("gamble-bar-fill");

const BREW_CRAFT_MS=2000;

const MULTI_BREW_CAP_MS=5000;
function startBrew(recipe,qty=1){
  if(GF.brewing || !PS.canAffordRecipe(recipe,qty)) return;
  const durationMs=Math.min(BREW_CRAFT_MS*qty, MULTI_BREW_CAP_MS);
  GF.brewing={recipeId:recipe.result_item, startedAt:Date.now(), recipe, qty, durationMs};
  render();
  GF.brewInterval=setInterval(()=>{
    if(!GF.brewing){ clearInterval(GF.brewInterval); GF.brewInterval=null; return; }
    if(Date.now()-GF.brewing.startedAt>=GF.brewing.durationMs){
      clearInterval(GF.brewInterval); GF.brewInterval=null;
      const rec=GF.brewing.recipe; const q=GF.brewing.qty||1; GF.brewing=null;
      const result=DL.getItem(rec.result_item);

      if(PS.brewRecipe(rec,q)){ autosave(); setToast(q>1?`Brewed ${q}x ${result.name}!`:`Brewed ${result.name}!`); reportQuestBrew(rec.result_item); }
      render();
    } else {

      if(!refreshBrewProgressInPlace()) render();
    }
  },100);
}
function startCraftBag(itemId){
  const item=DL.getItem(itemId);
  const cost=Balance.bagCraftCost(item.capacity||0);

  if(GF.crafting || PS.materials<cost || !PS.hasInventorySpace()) return;
  GF.crafting={itemId, startedAt:Date.now()};
  render();
  GF.craftInterval=setInterval(()=>{
    if(!GF.crafting){ clearInterval(GF.craftInterval); GF.craftInterval=null; return; }
    if(Date.now()-GF.crafting.startedAt>=BREW_CRAFT_MS){
      clearInterval(GF.craftInterval); GF.craftInterval=null;
      const id=GF.crafting.itemId; GF.crafting=null;
      const r=PS.craftBag(id);
      if(r.success){ autosave(); setToast(`Crafted ${DL.getItem(id).name}!`); } else setToast(r.reason);
      render();
    } else {

      if(!refreshCraftProgressInPlace()) render();
    }
  },100);
}

  const t=toastBox(); if(t) card.appendChild(t);

  const submit=async ()=>{

    const email=emailInput?emailInput.value.trim():"";
    statusDiv.textContent="Working...";
    try{
      const json = isLogin ? await Net.login(username,passcode) : await Net.register(username,passcode,email);
      await Net.afterAuth(json.username, json.token);

      if(!isLogin && CHANGELOG[0]) Storage_.setItem(WHATS_NEW_STORAGE_KEY, CHANGELOG[0].version);
      setToast(`Welcome, ${json.username}!`);
      GF.goto("mainMenuSlots");

      statusDiv.textContent = e.message || "Something went wrong. Is the game server reachable?";
    }
  };
  card.appendChild(h("div",{class:"auth-panel col gap"},[
    h("h2",{},[isLogin?"Welcome Back":"Create Your Account"]),
    authSocialRow(),
    userInput, passInput, emailInput,
    isLogin?null:h("div",{class:"muted",style:{marginTop:"-6px"}},["Email is optional, just a nice-to-have. Jump in with only a username and password if you'd rather not share one yet."]),
    h("button",{class:"auth-cta",style:{marginTop:"4px"},onClick:submit},[isLogin?"Log In":"Create Account"]),
    statusDiv,
  ]));
  card.appendChild(h("div",{class:"auth-footer"},[h("span",{class:"auth-back",onClick:()=>GF.goto("authGate")},["← Back"])]));
  root.appendChild(card);
  return root;
}

function formatLastSeen(iso){
  if(!iso) return "Unknown";
  const then=new Date(iso).getTime();
  if(isNaN(then)) return "Unknown";
  const diffMs=Date.now()-then;
  if(diffMs<0) return "Online now";
  const mins=Math.floor(diffMs/60000);
  if(mins<5) return "Online now";
  if(mins<60) return `${mins}m ago`;
  const hours=Math.floor(mins/60);
  if(hours<24) return `${hours}h ago`;
  const days=Math.floor(hours/24);
  if(days<30) return `${days}d ago`;
  return new Date(iso).toLocaleDateString();
}

function leaderboardLastSeenLine(iso){
  const label=formatLastSeen(iso);
  if(label==="Online now"){

function leaderboardLadderTab(){
  const root=h("div",{});
  if(Net.leaderboardCache===null||Net.leaderboardCache===undefined){
    root.appendChild(h("div",{class:"muted"},["Loading..."]));
    Net.fetchLeaderboard().then(render).catch(()=>{ setToast("Could not load the leaderboard."); render(); });
    return root;
  }
  const entries=Net.leaderboardCache;
  if(entries.length===0) root.appendChild(h("div",{class:"muted"},["No one has made a mark yet, be the first!"]));

  const totalPages=Math.max(1,Math.ceil(entries.length/LEADERBOARD_PAGE_SIZE));
  if(GF.leaderboardPage==null) GF.leaderboardPage=0;
  if(GF.leaderboardPage>=totalPages) GF.leaderboardPage=totalPages-1;
  if(GF.leaderboardPage<0) GF.leaderboardPage=0;
  const pageStart=GF.leaderboardPage*LEADERBOARD_PAGE_SIZE;

}

function computeSkillRankings(){
  const entries=Net.leaderboardSkillsCache||[];
  const result={};
  for(const t of IF.WEAPON_TYPE_LIST){
    const rows=entries.map(e=>{
      const hits=(e.weapon_skills && e.weapon_skills[t] && e.weapon_skills[t].hits)||0;
      const level=Balance.weaponSkillLevelForHits(hits);
      const atStart=Balance.weaponSkillCumulativeHitsForLevel(level);
      const forNext=Balance.weaponSkillCumulativeHitsForLevel(level+1)-atStart;
      const into=hits-atStart;
      return {account_id:e.account_id, character_name:e.character_name, player:e.player, is_dead:e.is_dead, level, into, forNext};
    }).filter(r=>r.level>0||r.into>0);
    rows.sort((a,b)=> b.level-a.level || b.into-a.into);
    result[t]=rows.slice(0,5);
  }
  const herbRows=entries.map(e=>{
    const points=e.herbalism_points||0;
    const level=Balance.herbalismLevelForPoints(points);
    const atStart=Balance.herbalismCumulativePointsForLevel(level);
    const forNext=Balance.herbalismCumulativePointsForLevel(level+1)-atStart;
    const into=points-atStart;
    return {account_id:e.account_id, character_name:e.character_name, player:e.player, is_dead:e.is_dead, level, into, forNext};
  }).filter(r=>r.level>0||r.into>0);
  herbRows.sort((a,b)=> b.level-a.level || b.into-a.into);
  result.herbalism=herbRows.slice(0,5);

  const spellRows=entries.map(e=>{
    const hits=e.spellcasting_hits||0;
    const level=Balance.weaponSkillLevelForHits(hits);
    const atStart=Balance.weaponSkillCumulativeHitsForLevel(level);
    const forNext=Balance.weaponSkillCumulativeHitsForLevel(level+1)-atStart;
    const into=hits-atStart;
    return {account_id:e.account_id, character_name:e.character_name, player:e.player, is_dead:e.is_dead, level, into, forNext};
  }).filter(r=>r.level>0||r.into>0);
  spellRows.sort((a,b)=> b.level-a.level || b.into-a.into);
  result.spellcasting=spellRows.slice(0,5);
  return result;
}

function kindleBonfirePanel(){
  const WARM_MS=Balance.POTION_HEAL_DURATION_MS, HOLD_MS=900, FADE_MS=750;

  const maxed=PS.current_hp>=PS.getMaxHp() && PS.current_stamina>=PS.getMaxStamina() && PS.current_mana>=PS.getMaxMana();
  let warming=false, holding=false, fading=false, pct=0;

  if(GF.bonfireKindle){
    const elapsed=Date.now()-GF.bonfireKindle.startedAt;
    if(elapsed>=WARM_MS+HOLD_MS+FADE_MS){
      GF.bonfireKindle=null;
    } else {
      warming=elapsed<WARM_MS;
      holding=!warming && elapsed<WARM_MS+HOLD_MS;
      fading=!warming && !holding;
      pct=warming?clampf(elapsed/WARM_MS*100,0,100):100;

      if(!GF.bonfireKindle.timerStarted){
        GF.bonfireKindle.timerStarted=true;
        GF.bonfireInterval=setInterval(()=>{
          if(!GF.bonfireKindle){ clearInterval(GF.bonfireInterval); GF.bonfireInterval=null; return; }
          const e=Date.now()-GF.bonfireKindle.startedAt;
          if(e>=WARM_MS+HOLD_MS+FADE_MS){
            clearInterval(GF.bonfireInterval); GF.bonfireInterval=null;
            GF.bonfireKindle=null;
            render();
          } else if(!refreshBonfireBlazeInPlace()){
            render();
          }
        },100);
      }
    }
  }

  const isActive=warming||holding||fading;

  const label=warming?"Warming...":(holding?"You feel fully restored":"Kindle the Bonfire");

  const subtext=isActive
    ? (warming?"Warming yourself by the flames...":(holding?"Fully healed and rested.":""))
    : (maxed?"You are already fully rested.":"Rest and restore.");

  const lowParts=[];
  if(PS.getMaxHp()>0 && PS.current_hp/PS.getMaxHp()<0.25) lowParts.push("health");
  if(PS.getMaxStamina()>0 && PS.current_stamina/PS.getMaxStamina()<0.25) lowParts.push("stamina");
  if(PS.getMaxMana()>0 && PS.current_mana/PS.getMaxMana()<0.25) lowParts.push("mana");
  const lowAlert=!isActive && !maxed && lowParts.length>0;
  const lowNote=lowParts.length===1?`Your ${lowParts[0]} is running low.`
    :`Your ${lowParts.slice(0,-1).join(", ")} and ${lowParts[lowParts.length-1]} are running low.`;

  return h("div",{class:"row venture-row"},[
    h("div",{id:"kindle-bonfire-btn",
      class:"panel venture-card venture-fill kindle"+(isActive&&!fading?" lit":"")+(fading?" fading":"")+((isActive||maxed)?"":" venture-clickable")+(lowAlert?" bonfire-alert":""),
      style:(isActive||maxed)?{cursor:"default"}:{},
      onClick:(isActive||maxed)?null:()=>{
        PS.kindleBonfireInstant();
        GF.bonfireKindle={startedAt:Date.now(),timerStarted:false};
        autosave();
        render();

const MAZE_W=20, MAZE_H=10;

function generateMaze(depth, isNight){
  const size=MAZE_W, sizeH=MAZE_H;
  const idx=(x,y)=>y*size+x;
  const dirs4=[[1,0],[-1,0],[0,1],[0,-1]];

  let cells, dist;
  for(let attempt=0;attempt<40;attempt++){
    cells=[];
    for(let y=0;y<sizeH;y++) for(let x=0;x<size;x++) cells.push({x,y,type:"dirt",baseTerrain:"dirt",discovered:false,cleared:false});

    for(let p=0;p<Balance.GRASS_PATCH_COUNT;p++){
      let cx=randi(size), cy=randi(sizeH);
      const patchSize=3+randi(4);
      for(let s=0;s<patchSize;s++){
        if(cx>=0&&cx<size&&cy>=0&&cy<sizeH){ cells[idx(cx,cy)].type="grass"; cells[idx(cx,cy)].baseTerrain="grass"; }
        const [ddx,ddy]=pick(dirs4); cx+=ddx; cy+=ddy;
      }
    }

    for(const c of cells){
      if(c.x===0&&c.y===0) continue;
      if(Math.random()<Balance.OBSTACLE_DENSITY) c.type="boulder";
    }

    dist=new Array(cells.length).fill(-1);
    dist[0]=0; const q=[0];
    while(q.length){
      const cur=q.shift();
      const cx=cur%size, cy=Math.floor(cur/size);
      for(const [dx,dy] of dirs4){
        const nx=cx+dx, ny=cy+dy;
        if(nx<0||nx>=size||ny<0||ny>=sizeH) continue;
        const ni=idx(nx,ny);
        if(cells[ni].type==="boulder") continue;
        if(dist[ni]===-1){ dist[ni]=dist[cur]+1; q.push(ni); }
      }
    }
    const reachableCount=dist.filter(d=>d>=0).length;
    if(reachableCount>=cells.length*0.45) break;
  }

  cells[0].type="start"; cells[0].baseTerrain="start";
  let exitIdx=0, best=-1;
  for(let i=0;i<cells.length;i++) if(dist[i]>best){ best=dist[i]; exitIdx=i; }

  const exitRoll=Math.random();
  if(exitRoll<Balance.MAZE_PREMATURE_EXIT_CHANCE){
    const halfCandidates=[];
    for(let i=1;i<cells.length;i++) if(dist[i]>=best*0.35 && dist[i]<=best*0.55) halfCandidates.push(i);
    if(halfCandidates.length>0) exitIdx=pick(halfCandidates);
  } else if(exitRoll<Balance.MAZE_PREMATURE_EXIT_CHANCE+Balance.MAZE_BOTTOMLEFT_EXIT_CHANCE){
    let blBest=-1, blIdx=-1;
    for(let i=1;i<cells.length;i++){
      const cx=i%size, cy=Math.floor(i/size);
      if(dist[i]>=0 && cx<size*0.4 && cy>=sizeH*0.6 && dist[i]>blBest){ blBest=dist[i]; blIdx=i; }
    }
    if(blIdx>=0) exitIdx=blIdx;
  }
  cells[exitIdx].type="exit";

  const stronghold=depth>=Balance.STRONGHOLD_MIN_AREA_LEVEL && Math.random()<Balance.STRONGHOLD_SPAWN_CHANCE ? placeStronghold({size,sizeH,cells,depth}, dist, exitIdx) : null;

  const candidates=cells.filter((c,i)=>dist[i]>0 && (c.type==="grass"||c.type==="dirt"));
  for(const c of candidates){
    const roll=Math.random();
    if(roll<Balance.MAZE_CHEST_CHANCE_PER_TILE){ c.type="chest"; continue; }
    if(roll<Balance.MAZE_CHEST_CHANCE_PER_TILE+Balance.MAZE_SHRINE_CHANCE_PER_TILE){ c.type="shrine"; continue; }
    if(roll<Balance.MAZE_CHEST_CHANCE_PER_TILE+Balance.MAZE_SHRINE_CHANCE_PER_TILE+Balance.MAZE_HERB_CHANCE_PER_TILE){ c.type="herb"; continue; }

    if(roll<Balance.MAZE_CHEST_CHANCE_PER_TILE+Balance.MAZE_SHRINE_CHANCE_PER_TILE+Balance.MAZE_HERB_CHANCE_PER_TILE+Balance.MAZE_CRITTER_CHANCE_PER_TILE){ c.type="critter"; continue; }

    if(roll<Balance.MAZE_CHEST_CHANCE_PER_TILE+Balance.MAZE_SHRINE_CHANCE_PER_TILE+Balance.MAZE_HERB_CHANCE_PER_TILE+Balance.MAZE_CRITTER_CHANCE_PER_TILE+Balance.TRAP_CHANCE_PER_TILE){ c.type="trap"; }
  }

  const openTiles=cells.filter((c,i)=>dist[i]>0 && (c.type==="grass"||c.type==="dirt"));
  shuffle(openTiles);
  const roamers=[];

  const roamerCount=depth<Balance.ROAMING_MOB_MIN_AREA_LEVEL ? 0 : Balance.ROAMING_MOB_COUNT_PER_MAZE+PS.getForestReputationExtraRoamers();
  for(let r=0;r<Math.min(roamerCount, openTiles.length);r++){
    const tile=openTiles[r];
    const spawnIdx=idx(tile.x,tile.y);

    const behavior=(isNight && Math.random()<Balance.NIGHT_ROAMER_CHARGING_BIAS_CHANCE) ? "charging" : ROAMING_MOB_BEHAVIORS[randi(ROAMING_MOB_BEHAVIORS.length)];
    roamers.push({roamerId:r, idx:spawnIdx, monsterId:DL.pickRandomMonsterForArea(depth).id, defeated:false, behavior, homeIdx:spawnIdx});
  }

  const maze={size, sizeH, cells, depth, playerIdx:0, stronghold, roamers, isNight:!!isNight, facingDir:1, facingUp:false};

  revealAround(maze,0,mazeEyesightRadius(maze));
  return maze;
}

function tickRoamingMobs(maze){
  if(!maze.roamers || !maze.roamers.length) return;
  const dirs4=[[1,0],[-1,0],[0,1],[0,-1]];
  const occupied=new Set(maze.roamers.filter(r=>!r.defeated).map(r=>r.idx));
  const px=maze.playerIdx%maze.size, py=Math.floor(maze.playerIdx/maze.size);
  for(const r of maze.roamers){
    if(r.defeated) continue;

    if(r.behavior==="hoarding" && Math.random()<Balance.ROAMING_MOB_HOARDING_STAY_CHANCE) continue;
    occupied.delete(r.idx);
    const x=r.idx%maze.size, y=Math.floor(r.idx/maze.size);

    const shuffledDirs=dirs4.slice(); shuffle(shuffledDirs);
    const candidates=[];
    for(const [dx,dy] of shuffledDirs){
      const nx=x+dx, ny=y+dy;
      if(nx<0||nx>=maze.size||ny<0||ny>=maze.sizeH) continue;
      const ni=ny*maze.size+nx;
      const cell=maze.cells[ni];
      if(cell.type!=="grass" && cell.type!=="dirt") continue;
      if(occupied.has(ni)) continue;
      candidates.push({nx,ny,ni});
    }
    if(candidates.length){
      let chosen=candidates[0];
      if(r.behavior==="charging"){

        const curDist=Math.abs(x-px)+Math.abs(y-py);
        let bestDist=curDist;
        for(const c of candidates){
          const d=Math.abs(c.nx-px)+Math.abs(c.ny-py);
          if(d<bestDist){ bestDist=d; chosen=c; }
        }
      } else if(r.behavior==="hoarding"){

        const hx=r.homeIdx%maze.size, hy=Math.floor(r.homeIdx/maze.size);
        const curDist=Math.abs(x-hx)+Math.abs(y-hy);
        let bestDist=curDist;
        for(const c of candidates){
          const d=Math.abs(c.nx-hx)+Math.abs(c.ny-hy);
          if(d<bestDist){ bestDist=d; chosen=c; }
        }
      }
      r.idx=chosen.ni;
    }
    occupied.add(r.idx);
  }
}

function placeStronghold(maze, dist, exitIdx){
  const tryLine=Math.random()<0.5;
  const first=tryLine?placeStrongholdLine(maze,exitIdx):placeStrongholdCross(maze,exitIdx);
  if(first) return first;
  return tryLine?placeStrongholdCross(maze,exitIdx):placeStrongholdLine(maze,exitIdx);
}

function placeStrongholdCross(maze, exitIdx){
  const {size, sizeH, cells}=maze;
  const idx=(x,y)=>y*size+x;
  const dirs4=[[1,0],[-1,0],[0,1],[0,-1]];
  let chosen=null;
  for(let attempt=0;attempt<200;attempt++){
    const cx=1+randi(size-2), cy=1+randi(sizeH-2);
    const coords=[[cx,cy],[cx,cy-1],[cx,cy+1],[cx-1,cy],[cx+1,cy],[cx-1,cy-1],[cx+1,cy-1],[cx-1,cy+1],[cx+1,cy+1]];
    const idxs=coords.map(([x,y])=>idx(x,y));
    if(idxs.includes(0) || idxs.includes(exitIdx)) continue;

    const inBlock=new Set(idxs);
    const vDist=new Array(cells.length).fill(-1);
    vDist[0]=0; const q=[0];
    while(q.length){
      const cur=q.shift();
      const curx=cur%size, cury=Math.floor(cur/size);
      for(const [dx,dy] of dirs4){
        const nx=curx+dx, ny=cury+dy;
        if(nx<0||nx>=size||ny<0||ny>=sizeH) continue;
        const ni=ny*size+nx;
        if(vDist[ni]!==-1) continue;
        if(cells[ni].type==="boulder" && !inBlock.has(ni)) continue;
        vDist[ni]=vDist[cur]+1; q.push(ni);
      }
    }
    if(idxs.some(i=>vDist[i]>=0)){ chosen={cx,cy}; break; }
  }
  if(!chosen) return null;
  const {cx,cy}=chosen;
  const chestIdx=idx(cx,cy);
  const guardianCoords=[[cx,cy-1],[cx,cy+1],[cx-1,cy],[cx+1,cy]];
  const cornerCoords=[[cx-1,cy-1],[cx+1,cy-1],[cx-1,cy+1],[cx+1,cy+1]];

  cells[chestIdx].type="stronghold_chest"; cells[chestIdx].cleared=false;
  const guardianIdxs=[];
  guardianCoords.forEach(([gx,gy],slot)=>{
    const gi=idx(gx,gy);
    const base=DL.pickRandomMonsterForArea(maze.depth||1);
    cells[gi].type="stronghold_guardian"; cells[gi].cleared=false;
    cells[gi].guardianMonsterId=base.id; cells[gi].guardianSlot=slot;
    guardianIdxs.push(gi);
  });
  cornerCoords.forEach(([fx,fy])=>{ cells[idx(fx,fy)].type="stronghold_fence"; });

  return {chestIdx, guardianIdxs, guardianDefeated:guardianIdxs.map(()=>false), opened:false, layout:"cross"};
}

function placeStrongholdLine(maze, exitIdx){
  const {size, sizeH, cells}=maze;
  const idx=(x,y)=>y*size+x;
  const dirs4=[[1,0],[-1,0],[0,1],[0,-1]];
  const guardianCount=2+randi(2);
  const lineLen=guardianCount+1;
  let chosen=null;
  for(let attempt=0;attempt<200;attempt++){
    const horizontal=Math.random()<0.5;
    let coords;
    if(horizontal){
      const y=1+randi(sizeH-2);
      const x0=1+randi(Math.max(1,size-2-lineLen+1));
      coords=[]; for(let i=0;i<lineLen;i++) coords.push([x0+i,y]);
    } else {
      const x=1+randi(size-2);
      const y0=1+randi(Math.max(1,sizeH-2-lineLen+1));
      coords=[]; for(let i=0;i<lineLen;i++) coords.push([x,y0+i]);
    }
    if(coords.some(([x,y])=>x<0||x>=size||y<0||y>=sizeH)) continue;
    const idxs=coords.map(([x,y])=>idx(x,y));
    if(idxs.includes(0) || idxs.includes(exitIdx)) continue;

    const inBlock=new Set(idxs);
    const vDist=new Array(cells.length).fill(-1);
    vDist[0]=0; const q=[0];
    while(q.length){
      const cur=q.shift();
      const curx=cur%size, cury=Math.floor(cur/size);
      for(const [dx,dy] of dirs4){
        const nx=curx+dx, ny=cury+dy;
        if(nx<0||nx>=size||ny<0||ny>=sizeH) continue;
        const ni=ny*size+nx;
        if(vDist[ni]!==-1) continue;
        if(cells[ni].type==="boulder" && !inBlock.has(ni)) continue;
        vDist[ni]=vDist[cur]+1; q.push(ni);
      }
    }

    if(vDist[idxs[0]]>=0){ chosen={coords, idxs}; break; }
  }
  if(!chosen) return null;
  const {coords, idxs}=chosen;
  const chestCoord=coords[coords.length-1];
  const chestIdx=idx(chestCoord[0],chestCoord[1]);
  cells[chestIdx].type="stronghold_chest"; cells[chestIdx].cleared=false;
  const guardianIdxs=[];
  for(let slot=0;slot<guardianCount;slot++){
    const gi=idxs[slot];
    const base=DL.pickRandomMonsterForArea(maze.depth||1);
    cells[gi].type="stronghold_guardian"; cells[gi].cleared=false;
    cells[gi].guardianMonsterId=base.id; cells[gi].guardianSlot=slot;
    guardianIdxs.push(gi);
  }
  return {chestIdx, guardianIdxs, guardianDefeated:guardianIdxs.map(()=>false), opened:false, layout:"line"};
}

function strongholdChestUnlocked(maze){
  if(!maze.stronghold) return false;
  return maze.stronghold.layout==="line"
    ? maze.stronghold.guardianDefeated.every(Boolean)
    : maze.stronghold.guardianDefeated.some(Boolean);
}

function ensureMaze(depth){

  if(!GF.overworld_snapshot || GF.overworld_snapshot.depth!==depth) GF.overworld_snapshot=generateMaze(depth, GF.isNight);
  return GF.overworld_snapshot;
}

function resetMazePositionToStart(){
  if(GF.overworld_snapshot) GF.overworld_snapshot.playerIdx=0;
}

function mazeGroundForCell(cell, type){
  if(type==="shrine" || type==="exit") return "stone";
  if(type==="stronghold_guardian") return "scorch";
  if(type==="grass") return "grass";
  if(type==="dirt") return "dirt";
  return cell.baseTerrain==="grass" ? "grass" : "dirt";
}

function mazeWalkerFor(classId,facing){
  const cls=CLASSES[classId];
  const cfg=cls?MZW_CLASS_CONFIG[classId]:null;
  const pal=cfg&&cls?MZW_CHAIN_PALETTES[cls.chain]:null;
  if(!cfg||!pal){
    return {html:`<div class="mzw-fallback">${MAZE_PLAYER_SVG}</div>`,isFloat:false};
  }
  const g=cfg.gait;
  const vars=`--mzwb1:${pal.b1};--mzwb2:${pal.b2};--mzwbt:${pal.bt};--mzwwind:${pal.wind||"#8fd0c4"};`+
    `--mzwgait:${g.gait};--mzwbob:${g.bob};--mzwstride:${g.stride};--mzwswing:${g.swing};--mzwlean:${g.lean||0}deg;`;
  const isFloat=!!g.float;
  const headSvg=MZW_HEADS[cfg.head](pal);
  const prop=MZW_PROPS[cfg.prop]?MZW_PROPS[cfg.prop](pal):"";
  const aura=cfg.aura?cfg.aura(pal):"";
  const back=facing==="back";
  const html=`<div class="mzw-walker${isFloat?" mzw-float":""}${back?" mzw-back":""}" style="${vars}">
      <div class="mzw-shadow"></div>
      ${aura}
      <div class="mzw-fig">
        <div class="mzw-limb mzw-arm mzw-back"></div>
        <div class="mzw-limb mzw-leg mzw-back"></div>
        <div class="mzw-limb mzw-leg mzw-front"></div>
        <div class="mzw-robe"></div>
        <div class="mzw-torso"></div>
        <div class="mzw-limb mzw-arm mzw-front"></div>
        <div class="mzw-head"></div>
        <div class="mzw-gear">${headSvg}</div>
        ${back?`<div class="mzw-back-head"></div>`:""}
        ${prop}
      </div>
    </div>`;
  return {html,isFloat};
}

function mazeEyesightRadius(maze){
  const base=PS.getEyesightRadius();
  return (maze && maze.isNight) ? Math.max(1, base-1) : base;
}

function interpolateHexColor(hex1,hex2,t){
  const c1=parseInt(hex1.slice(1),16), c2=parseInt(hex2.slice(1),16);
  const r1=(c1>>16)&255, g1=(c1>>8)&255, b1=c1&255;
  const r2=(c2>>16)&255, g2=(c2>>8)&255, b2=c2&255;
  const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
  return "#"+[r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
}

function isAdjacent4(x1,y1,x2,y2){
  const dx=Math.abs(x1-x2), dy=Math.abs(y1-y2);
  return (dx+dy)===1;
}

function mazeOverlayScreen(overlay){
  const durationMs=overlay.durationMs||1650;
  const div=h("div",{class:"maze-overlay-grid"},[h("div",{class:"maze-overlay-text"+(overlay.shrine?" shrine":"")},[overlay.text])]);
  if(!overlay.timerStarted){
    overlay.timerStarted=true;
    setTimeout(()=>{ div.classList.add("fade"); },durationMs-100);
    setTimeout(()=>{
      GF.mazeOverlay=null;
      if(overlay.andThen) overlay.andThen();
      else render();
    },durationMs);
  }
  return div;
}

function screenMaze(){
  const depth=GF.maze_depth||PS.level;
  const maze=ensureMaze(depth);

  reportQuestExploreIfEligible(maze);
  const root=h("div",{});

  root.appendChild(statHeader());

  if(!PS.hasInventorySpace()){
    root.appendChild(h("div",{class:"panel",style:{marginBottom:"10px",background:"rgba(160,40,40,.28)",borderColor:"#a04a4a"}},[
      h("div",{style:{color:"#e07a7a",fontWeight:"bold"}},["⚠ Your backpack is full."]),
      h("div",{class:"muted",style:{fontSize:".9em"}},["Any gear you find will be left behind until you make room, so sell, salvage, or store items in your Vault."]),
    ]));
  }

  const gridAspectRatio=`${maze.size} / ${maze.sizeH}`;

  const forestName=Balance.TOWN_NAMES[Math.min(Balance.TOWN_NAMES.length-1, (PS.getClassData().tier||1)-1)];
  const plaqueText=`${forestName} · Area Level ${depth}${maze.isNight?" · Nightfall":""}`;

  let gridArea;
  if(GF.mazeOverlay){
    gridArea=h("div",{style:{position:"relative",width:"100%",aspectRatio:gridAspectRatio}},[mazeOverlayScreen(GF.mazeOverlay)]);
  } else {
    const px=maze.playerIdx%maze.size, py=Math.floor(maze.playerIdx/maze.size);

    const grid=h("div",{class:"maze-grid",style:{gridTemplateColumns:`repeat(${maze.size},1fr)`}});
    for(let y=0;y<maze.sizeH;y++){
      for(let x=0;x<maze.size;x++){
        const i=y*maze.size+x; const cell=maze.cells[i];
        const isPlayer=maze.playerIdx===i;
        const chestLocked=cell.type==="stronghold_chest" && !strongholdChestUnlocked(maze);
        const isWalkable=!isPlayer && cell.type!=="boulder" && !chestLocked && isAdjacent4(x,y,px,py);

        const isKnown=cell.discovered || cell.type==="start";
        const hidden=!!cell.wasHidden || HIDDEN_TILE_TYPES.includes(cell.type);
        const displayType=HIDDEN_TILE_TYPES.includes(cell.type)?cell.baseTerrain:cell.type;

        const revealFadeUntil=cell._revealFadeUntil;
        const isRevealing=revealFadeUntil!=null && Date.now()<revealFadeUntil;
        const tileStyle={cursor:isWalkable?"pointer":"default"};
        if(isRevealing) tileStyle.animationDelay=(-(500-(revealFadeUntil-Date.now())))+"ms";
        const tile=h("div",{id:"maze-tile-"+i,class:"maze-tile"+(isRevealing?" mz-revealing":""),style:tileStyle});
        if(!isKnown){

          tile.appendChild(h("div",{class:"mz-fog"}));
        } else {
          const ground=mazeGroundForCell(cell, displayType);
          tile.appendChild(h("div",{class:"mz-ground mz-"+ground}));

          if(displayType==="grass" && cell.trampleCount){
            tile.appendChild(h("div",{class:"mz-ground mz-dirt",style:{opacity:String(Math.min(3,cell.trampleCount)/3)}}));
          }
          if(ground==="grass" && displayType==="grass"){
            for(let k=0;k<2;k++){
              const seed=(i*37+k*53)%23;
              tile.appendChild(h("span",{class:"mz-tuft",style:{left:(6+seed)+"px",top:(14+(seed*3)%16)+"px",animationDelay:((seed%4)*0.4)+"s"}}));
            }
          }
          const propKey=displayType==="stronghold_chest" ? (chestLocked?"stronghold_chest_locked":"chest") : displayType;
          if(MAZE_PROP_SVG[propKey]) tile.appendChild(h("div",{class:"mz-prop", html:MAZE_PROP_SVG[propKey]}));
          if(cell.cleared && !hidden) tile.classList.add("mz-cleared");
        }
        if(isWalkable){ tile.addEventListener("click",()=>onStepMaze(maze,i)); }
        grid.appendChild(tile);
      }
    }

    const walker=mazeWalkerFor(PS.class_id, maze.facingUp?"back":"side");

    const moverPct={width:(100/maze.size)+"%", height:(100/maze.sizeH)+"%"};
    grid.appendChild(h("div",{id:"maze-player-marker",class:"maze-mover maze-mover-player",style:Object.assign({left:(px/maze.size*100)+"%",top:(py/maze.sizeH*100)+"%"},moverPct)},[
      h("div",{class:"mz-player-glow"}),
      h("div",{class:"mzw-scale"},[

        h("div",{class:"mzw-flip",style:{transform:"scaleX("+(maze.facingUp?1:(maze.facingDir||1))+")"},html:walker.html}),
      ]),
    ]));
    if(maze.roamers){
      for(const r of maze.roamers){
        if(r.defeated) continue;

        const rCell=maze.cells[r.idx];
        if(!(rCell.discovered || rCell.type==="start")) continue;
        const rx=r.idx%maze.size, ry=Math.floor(r.idx/maze.size);

        const roamerColor=ROAMING_MOB_COLOR_BY_BEHAVIOR[r.behavior]||ROAMING_MOB_COLOR_BY_BEHAVIOR.regular;

        grid.appendChild(h("div",{id:"maze-roamer-marker-"+r.roamerId,class:"maze-mover maze-mover-roamer",title:`${r.behavior||"regular"} roamer`,style:Object.assign({left:(rx/maze.size*100)+"%",top:(ry/maze.sizeH*100)+"%"},moverPct)},[
          h("div",{class:"mz-roamer-aura",style:{background:`radial-gradient(circle,${roamerColor}66,transparent 65%)`}}),
          h("div",{html:mazeRoamerSVG(roamerColor)}),
        ]));
      }
    }

    const centerX=((px+0.5)/maze.size*100)+"%", centerY=((py+0.5)/maze.sizeH*100)+"%";
    const torchRadiusPct=((mazeEyesightRadius(maze)+0.6)/maze.size*100)+"%";
    const lighting=h("div",{class:"maze-lighting"});
    lighting.style.setProperty("--mz-px",centerX); lighting.style.setProperty("--mz-py",centerY); lighting.style.setProperty("--mz-torch-radius",torchRadiusPct);
    const torchcast=h("div",{class:"maze-torchcast"});
    torchcast.style.setProperty("--mz-px",centerX); torchcast.style.setProperty("--mz-py",centerY); torchcast.style.setProperty("--mz-torch-radius",torchRadiusPct);
    grid.appendChild(lighting);
    grid.appendChild(torchcast);

    gridArea=grid;
  }

  const mazeFrame=h("div",{class:"maze-frame"+(maze.isNight?" maze-night":"")},[
    h("div",{class:"maze-plaque"},[plaqueText]),
    gridArea,

    mazeToastLayer(),
  ]);

  root.appendChild(h("div",{class:"maze-board-row"},[mazeFrame, mazeToolRail(maze)]));
  root.appendChild(h("div",{class:"maze-wrap"},[
    h("div",{class:"side-panel"},[
      h("div",{class:"col",style:{gap:"2px"}},[

        h("div",{class:"muted",style:{lineHeight:"1.5em"}},[
          "Arrow keys to move. Fights lurk in tall grass, find the exit (⬇) before your stamina runs out. Strongholds hide a locked chest (🔒) behind tough guardians (💀); Roaming mobs (👹) hunt on their own turf. ",
          h("span",{class:"linklike",onClick:()=>{ GF._preGameplayScreen="maze"; GF.goto("gameplayGuide"); }},["More information"]),
        ]),
      ]),

      h("div",{class:"maze-mobile-arrows"},[
        h("div",{}), h("button",{disabled:!!GF.mazeOverlay,onClick:()=>attemptMazeMove(0,-1)},["↑"]), h("div",{}),
        h("button",{disabled:!!GF.mazeOverlay,onClick:()=>attemptMazeMove(-1,0)},["←"]), h("div",{}), h("button",{disabled:!!GF.mazeOverlay,onClick:()=>attemptMazeMove(1,0)},["→"]),
        h("div",{}), h("button",{disabled:!!GF.mazeOverlay,onClick:()=>attemptMazeMove(0,1)},["↓"]), h("div",{}),
      ]),

    ]),
  ]));

  return root;
}

function mazeActionButton(icon,label,disabled,tip,onClick){
  return h("button",{class:"mzaction tooltip"+(disabled?" disabled":""),"data-tip":tip,disabled:!!disabled,
    onClick:disabled?null:onClick},[

function mazeToolGrid(maze){
  const keys=getKeyboardShortcuts();
  const busy=!!GF.mazeOverlay;

  const totalOf=(kind)=>{
    let total=0;
    for(const itemId in PS.consumables){
      const item=DL.getItem(itemId);
      if(!item) continue;
      if(kind==="health"&&item.heal_amount) total+=PS.consumables[itemId];
      else if(kind==="stamina"&&item.stamina_amount) total+=PS.consumables[itemId];
      else if(kind==="mana"&&item.mana_amount) total+=PS.consumables[itemId];
    }
    return total;
  };
  const quaff=(kind)=>{

    const itemId=PS.bestAvailableConsumable(kind);
    if(!PS.canUseConsumable(itemId)) return;
    PS.useConsumable(itemId); autosave(); render();
  };
  const tools=[
    mazeTool(keys.healthPotion,"\u2764\ufe0f",totalOf("health"),busy||!PS.canUseConsumable(PS.bestAvailableConsumable("health")),
      "Drink a Health Potion. Uses your strongest one first.",()=>quaff("health")),
    mazeTool(keys.manaPotion,"\ud83d\udd35",totalOf("mana"),busy||!PS.canUseConsumable(PS.bestAvailableConsumable("mana")),
      "Drink a Mana Potion. Uses your strongest one first.",()=>quaff("mana")),
    mazeTool(keys.staminaPotion,"\u26a1",totalOf("stamina"),busy||!PS.canUseConsumable(PS.bestAvailableConsumable("stamina")),
      "Drink a Stamina Potion. Uses your strongest one first.",()=>quaff("stamina")),
    mazeTool(keys.antidote,"\ud83e\uddea",PS.consumables.antidote||0,busy||!PS.canUseConsumable("antidote"),
      "Cure poison with an Antidote.",()=>{ PS.useConsumable("antidote"); autosave(); render(); }),
    mazeTool(null,"\ud83d\udd2e",PS.getTotalClarityChargesRemaining(),busy||!PS.canUseConsumable("elixir_of_clarity"),
      "Elixir of Clairvoyance: reveals the maze around you.",()=>{
        const px=maze.playerIdx%maze.size, py=Math.floor(maze.playerIdx/maze.size);
        const ripple=[];
        for(let i=0;i<maze.cells.length;i++){
          if(!maze.cells[i].discovered){
            const cx=i%maze.size, cy=Math.floor(i/maze.size);
            ripple.push({idx:i, dist:Math.abs(cx-px)+Math.abs(cy-py)});
          }
        }
        PS.useConsumable("elixir_of_clarity");
        maze._clarityReveal=ripple;
        autosave(); render(); animateMazeMovers(null,null);
      }),

    mazeActionButton("\u267b\ufe0f","New route",busy,
      "Try a different route: regenerates this area at the same level. Fog of war, roamers and the stronghold all reset.",
      ()=>{ askConfirm("Try a different route through this area? Your current position and any progress on this maze layout (fog of war, cleared guardians, opened chests) will be lost.",()=>{ GF.overworld_snapshot=null; GF.goto("maze",{maze_depth:GF.maze_depth}); }); }),
    mazeActionButton("\ud83d\udeaa","Retreat",busy,
      "Retreat to town. Your kill streak ends.",
      ()=>{ resetMazePositionToStart(); GF.goto("town"); }),
  ];

  return { consumables: tools.slice(0,5), actions: tools.slice(5) };
}
function mazeToolRail(maze){
  const built=mazeToolGrid(maze);
  return h("div",{class:"maze-toolrail"},[
    h("div",{class:"maze-toolrail-tools"},built.consumables),
    h("div",{class:"maze-toolrail-actions"},built.actions),
  ]);
}

function revealAround(maze,centerIdx,radius){
  const cx=centerIdx%maze.size, cy=Math.floor(centerIdx/maze.size);

  const newlyRevealed=[];
  for(let dy=-radius;dy<=radius;dy++){
    for(let dx=-radius;dx<=radius;dx++){
      const nx=cx+dx, ny=cy+dy;
      if(nx<0||nx>=maze.size||ny<0||ny>=maze.sizeH) continue;
      const idx=ny*maze.size+nx;
      const cell=maze.cells[idx];
      if(!cell.discovered){ newlyRevealed.push(idx); cell._revealFadeUntil=Date.now()+500; }
      cell.discovered=true;
    }
  }
  return newlyRevealed;
}

function tickEyesightPotion(){
  if(PS.eyesight_potion_steps_left>0){
    PS.eyesight_potion_steps_left--;
  }
}

function animateMazeMovers(prevPlayerIdx, prevRoamerPositions){
  const maze=GF.overworld_snapshot;
  if(!maze) return;

  const cellPx=(idx)=>({x:(idx%maze.size)/maze.size*100+"%", y:Math.floor(idx/maze.size)/maze.sizeH*100+"%"});
  const playerEl=document.getElementById("maze-player-marker");
  if(playerEl && playerEl.parentNode && prevPlayerIdx!=null && prevPlayerIdx!==maze.playerIdx){
    const from=cellPx(prevPlayerIdx), to=cellPx(maze.playerIdx);
    playerEl.style.transition="none";
    playerEl.style.left=from.x; playerEl.style.top=from.y;
    setTimeout(()=>{
      playerEl.style.transition="";
      playerEl.style.left=to.x; playerEl.style.top=to.y;
    },20);
  }
  if(maze.roamers && prevRoamerPositions){
    for(const r of maze.roamers){
      if(r.defeated) continue;
      const prevIdx=prevRoamerPositions[r.roamerId];
      if(prevIdx==null || prevIdx===r.idx) continue;
      const el=document.getElementById("maze-roamer-marker-"+r.roamerId);
      if(!el || !el.parentNode) continue;
      const from=cellPx(prevIdx), to=cellPx(r.idx);
      el.style.transition="none";
      el.style.left=from.x; el.style.top=from.y;
      setTimeout(()=>{
        el.style.transition="";
        el.style.left=to.x; el.style.top=to.y;
      },20);
    }
  }

  if(maze._clarityReveal && maze._clarityReveal.length){
    for(const {idx,dist} of maze._clarityReveal){
      const el=document.getElementById("maze-tile-"+idx);
      if(!el || !el.parentNode) continue;
      el.style.transition="none";
      el.style.opacity="0";
      setTimeout(()=>{
        el.style.transition="";
        el.style.opacity="1";
      },30+dist*35);
    }
    maze._clarityReveal=[];
  }
}

function onStepMaze(maze,targetIdx){

  if(PS.current_stamina<=0){
    mazeToast("You're exhausted and can't go any further.\nDrink a Stamina Potion, or retreat to town to rest.","bad");
    render();
    return;
  }

  const prevPlayerIdx=maze.playerIdx;
  const prevRoamerPositions={};
  if(maze.roamers) for(const r of maze.roamers) prevRoamerPositions[r.roamerId]=r.idx;
  const cell=maze.cells[targetIdx];

  const prevPx=prevPlayerIdx%maze.size, newPx=targetIdx%maze.size;

  const prevPy=Math.floor(prevPlayerIdx/maze.size), newPy=Math.floor(targetIdx/maze.size);
  if(newPx>prevPx){ maze.facingDir=1; maze.facingUp=false; }
  else if(newPx<prevPx){ maze.facingDir=-1; maze.facingUp=false; }

  else if(newPy<prevPy) maze.facingUp=true;
  else if(newPy>prevPy) maze.facingUp=false;
  maze.playerIdx=targetIdx; cell.discovered=true; cell.visited=true;

  PS.spendStamina(Balance.staminaCostPerStep(IF.EQUIPPED_SLOT_KEYS.filter(s=>PS.equipped[s]).length));

  tickEyesightPotion();

  revealAround(maze,targetIdx,mazeEyesightRadius(maze));
  if(PS.current_stamina<=0){
    mazeToast("You're exhausted.\nDrink a Stamina Potion, or retreat to town to rest.","bad");
  }

  const roamerAlreadyHere=maze.roamers && maze.roamers.find(r=>!r.defeated && r.idx===maze.playerIdx);
  if(roamerAlreadyHere){
    PS.tickXpBuff();

    triggerMazeEncounter({maze_depth:maze.depth, pending_monster_id:roamerAlreadyHere.monsterId, pending_roamer_id:roamerAlreadyHere.roamerId, pending_guardian_cell_idx:null});
    return;
  }

  if(cell.type==="exit" && !cell.cleared){
    cell.cleared=true;
    const nextDepth=maze.depth+Balance.EXIT_DEPTH_BONUS_PER_DESCENT;
    PS.max_maze_depth_reached=Math.max(PS.max_maze_depth_reached||1, nextDepth);

    GF.ventureDepth=nextDepth;

    GF.ventureLockDepth=null;
    autosave();
    GF.mazeOverlay={text:`Advanced to area level ${nextDepth}!`, andThen:()=>{ GF.overworld_snapshot=null; GF.goto("maze",{maze_depth:nextDepth}); }};
    render();
    return;
  }
  if(cell.type==="trap" && !cell.cleared){
    cell.cleared=true; cell.type=cell.baseTerrain;
    PS.spendStamina(Balance.TRAP_STAMINA_LOSS);

    const trapWardPct=Math.min(100,PS.gearBonus("trap_ward"));
    const outcome=Balance.rollTrapOutcome(maze.depth);
    if(outcome==="fall"){

      if(trapWardPct>0 && Math.random()*100<trapWardPct){
        mazeToast("You avoided a fall through the trapdoor.","good");
        autosave(); render(); animateMazeMovers(prevPlayerIdx,prevRoamerPositions); return;
      }
      const dmg=randRange(Balance.TRAP_DAMAGE_MIN,Balance.TRAP_DAMAGE_MAX);
      PS.current_hp=Math.max(1,PS.current_hp-dmg);
      const fallDepth=Math.max(1,maze.depth-Balance.TRAPDOOR_DEPTH_PENALTY);

      GF.ventureDepth=fallDepth;
      GF.ventureLockDepth=fallDepth;
      autosave();
      GF.mazeOverlay={text:"Trapdoor!", andThen:()=>{ GF.overworld_snapshot=null; GF.goto("maze",{maze_depth:fallDepth}); }};
      render();
      return;
    }

    if(PS.isInvulnerable()){
      PS.invuln_rounds_left--;
      mazeLog(`Something bites at your ankle, but the Touch of Unicorn shields you! (${PS.invuln_rounds_left} round${PS.invuln_rounds_left===1?"":"s"} left)`);
      autosave(); render(); animateMazeMovers(prevPlayerIdx,prevRoamerPositions); return;
    }

    if(outcome==="poison"){
      PS.applyPoison(maze.depth);

      if(trapWardPct>0) PS.poison_pct_per_sec*=(1-trapWardPct/100);
      mazeLog(`Something bites at your ankle! No wound, but you feel a poison take hold.`);
      autosave(); render(); animateMazeMovers(prevPlayerIdx,prevRoamerPositions); return;
    }

    const rawDmg=Balance.trapDamage(maze.depth)*(1-trapWardPct/100);
    const dmg=Math.max(0,rawDmg-PS.getArmor());
    if(dmg>=PS.current_hp){
      PS.current_hp=0;
      autosave();

      handleTrapDeath(maze.depth);
      return;
    }
    PS.current_hp-=dmg;
    mazeLog(`Something bites at your ankle! You take ${Math.round(dmg)} damage.`);

    spawnFloat("player",`-${Math.round(dmg)} HP`,"float-text-dmg");
    autosave(); render(); animateMazeMovers(prevPlayerIdx,prevRoamerPositions); return;
  }
  if(cell.type==="shrine" && !cell.cleared){
    cell.cleared=true;

    const roll=Math.floor(Math.random()*5);
    let shrineOverlayText;
    if(roll===0){ PS.addStaminaShrineBuff(Balance.STAMINA_MAX_BASE*Balance.SHRINE_STAMINA_BUFF_PCT); mazeLog("A quiet shrine restores your stamina and grants a lasting reserve!"); shrineOverlayText="✨ Quiet Shrine\nStamina restored, plus a lasting reserve!"; }
    else if(roll===1){ PS.applyXpShrineBuff(); mazeLog("A quiet shrine blesses you, bonus experience for a while!"); shrineOverlayText=`✨ Quiet Shrine\nBonus Experience for the next ${Balance.SHRINE_XP_BUFF_ENCOUNTERS} battles!`; }
    else if(roll===2){ PS.applyInvulnShrineBuff(); mazeLog(`A radiant shrine grants you the Touch of Unicorn, making you immune to damage/poison from combat or traps for ${Balance.SHRINE_INVULN_ROUNDS} rounds!`); shrineOverlayText=`🦄 Radiant Shrine\nTouch of Unicorn! Immune to damage & poison for ${Balance.SHRINE_INVULN_ROUNDS} rounds.`; }
    else if(roll===3){ PS.applyQuadDamageShrineBuff(); mazeLog(`A furious shrine quadruples your damage output for ${Balance.SHRINE_QUAD_DAMAGE_ROUNDS} combat rounds!`); shrineOverlayText=`⚡ Furious Shrine\nQuad Damage for ${Balance.SHRINE_QUAD_DAMAGE_ROUNDS} combat rounds!`; }
    else { PS.applyMagicFindShrineBuff(); mazeLog(`A glimmering shrine sharpens your eye for treasure, +${Balance.SHRINE_MAGIC_FIND_PCT}% Magic Find for ${Balance.SHRINE_MAGIC_FIND_ROUNDS} rounds!`); shrineOverlayText=`🔍 Glimmering Shrine\n+${Balance.SHRINE_MAGIC_FIND_PCT}% Magic Find for ${Balance.SHRINE_MAGIC_FIND_ROUNDS} rounds!`; }

    autosave();

    mazeToast(shrineOverlayText,"shrine",3600);
    render(); animateMazeMovers(prevPlayerIdx,prevRoamerPositions); return;
  }
  if(cell.type==="herb" && !cell.cleared){
    GF.goto("herbEncounter",{maze_depth:maze.depth, herb_cell_idx:targetIdx});
    return;
  }
  if(cell.type==="critter" && !cell.cleared){

    GF.goto("critterEncounter",{maze_depth:maze.depth, critter_cell_idx:targetIdx});
    return;
  }
  if(cell.type==="chest" && !cell.cleared){
    GF.goto("chestEncounter",{maze_depth:maze.depth, chest_cell_idx:targetIdx});
    return;
  }
  if(cell.type==="stronghold_guardian" && !cell.cleared){
    PS.tickXpBuff();

    triggerMazeEncounter({maze_depth:maze.depth, pending_monster_id:cell.guardianMonsterId, pending_guardian_cell_idx:targetIdx, pending_roamer_id:null});
    return;
  }
  if(cell.type==="stronghold_chest" && !cell.cleared){

    GF.goto("strongholdChest",{maze_depth:maze.depth, stronghold_chest_cell_idx:targetIdx});
    return;
  }

  if(cell.type==="grass"){
    cell.trampleCount=Math.min(3,(cell.trampleCount||0)+1);
  }

  const encounterChance=Balance.ENCOUNTER_CHANCE_PER_STEP*(maze.isNight?Balance.NIGHT_ENCOUNTER_CHANCE_MULT:1);
  if(cell.type==="grass" && (cell.trampleCount||0)<3 && Math.random()<encounterChance){
    PS.tickXpBuff();
    const monster=DL.pickRandomMonsterForArea(maze.depth);

    triggerMazeEncounter({maze_depth:maze.depth, pending_monster_id:monster.id, pending_guardian_cell_idx:null, pending_roamer_id:null});
    return;
  }
  autosave();
  render();
  animateMazeMovers(prevPlayerIdx,prevRoamerPositions);
}

function attemptMazeMove(dx,dy){
  const maze=GF.overworld_snapshot; if(!maze) return;
  const px=maze.playerIdx%maze.size, py=Math.floor(maze.playerIdx/maze.size);
  const nx=px+dx, ny=py+dy;
  if(nx<0||nx>=maze.size||ny<0||ny>=maze.sizeH) return;
  const ni=ny*maze.size+nx;
  if(maze.cells[ni].type==="boulder") return;
  if(maze.cells[ni].type==="stronghold_chest" && !strongholdChestUnlocked(maze)) return;
  onStepMaze(maze,ni);
}

const MAZE_MOVE_REPEAT_THROTTLE_MS=300;
let lastMazeMoveCommitAt=0;

const KEYBIND_STORAGE_KEY="wandrian_keybind_scheme";
const KEYBIND_SCHEMES={
  arrows:{label:"Arrow Keys only", extraUp:[], extraDown:[], extraLeft:[], extraRight:[]},
  wasd:{label:"WASD", extraUp:["w","W"], extraDown:["s","S"], extraLeft:["a","A"], extraRight:["d","D"]},
  zqsd:{label:"ZQSD (AZERTY)", extraUp:["z","Z"], extraDown:["s","S"], extraLeft:["q","Q"], extraRight:["d","D"]},
};

function getKeybindScheme(){
  const v=Storage_.getItem(KEYBIND_STORAGE_KEY);
  if(v==="custom") return "custom";
  return KEYBIND_SCHEMES[v]?v:"arrows";
}
function setKeybindScheme(v){
  if(v!=="custom" && !KEYBIND_SCHEMES[v]) return;
  Storage_.setItem(KEYBIND_STORAGE_KEY,v);
}

const KEYBIND_CUSTOM_STORAGE_KEY="wandrian_keybind_custom";
function getCustomKeybinds(){
  let parsed=null;
  try{ parsed=JSON.parse(Storage_.getItem(KEYBIND_CUSTOM_STORAGE_KEY)||"null"); }catch(e){ parsed=null; }
  return Object.assign({up:"",down:"",left:"",right:""}, parsed||{});
}
function setCustomKeybinds(v){
  Storage_.setItem(KEYBIND_CUSTOM_STORAGE_KEY, JSON.stringify(v));
}

function customKeybindWarning(c){
  const dirs=["up","down","left","right"];
  const vals=dirs.map(d=>c[d]).filter(v=>v);
  const dupes=vals.filter((v,i)=>vals.indexOf(v)!==i);
  if(dupes.length) return `"${dupes[0].toUpperCase()}" is assigned to more than one direction.`;
  if(vals.some(v=>v==="arrowup"||v==="arrowdown"||v==="arrowleft"||v==="arrowright")) return "That key collides with an Arrow Key.";
  return null;
}

function getActiveKeybindExtras(){
  const schemeId=getKeybindScheme();
  if(schemeId==="custom"){
    const c=getCustomKeybinds();
    const pair=(v)=>v?[v.toLowerCase(),v.toUpperCase()]:[];
    return { extraUp:pair(c.up), extraDown:pair(c.down), extraLeft:pair(c.left), extraRight:pair(c.right) };
  }
  return KEYBIND_SCHEMES[schemeId]||KEYBIND_SCHEMES.arrows;
}

const KEYBOARD_SHORTCUT_STORAGE_KEY="wandrian_keyboard_shortcuts";

const KEYBOARD_SHORTCUT_DEFAULTS={characterSheet:"c", venture:"v", healthPotion:"h", staminaPotion:"j", antidote:"k", manaPotion:"l", spellSlot1:"q", spellSlot2:"e", spellSlot3:"r"};

const SPELL_SLOT_SHORTCUT_KEYS=["spellSlot1","spellSlot2","spellSlot3"];
function getKeyboardShortcuts(){
  let parsed=null;
  try{ parsed=JSON.parse(Storage_.getItem(KEYBOARD_SHORTCUT_STORAGE_KEY)||"null"); }catch(e){ parsed=null; }
  return Object.assign({}, KEYBOARD_SHORTCUT_DEFAULTS, parsed||{});
}
function setKeyboardShortcut(name,key){
  if(!KEYBOARD_SHORTCUT_DEFAULTS.hasOwnProperty(name)) return;
  const clean=(key||"").trim().toLowerCase().slice(0,1);
  if(!clean) return;
  const current=getKeyboardShortcuts();
  current[name]=clean;
  Storage_.setItem(KEYBOARD_SHORTCUT_STORAGE_KEY, JSON.stringify(current));
}

function keybindSchemeButton(key){
  const selected=getKeybindScheme()===key;
  return h("button",{
    style:{background:selected?"var(--accent,#3a6a2a)":undefined,borderColor:selected?"#7ac67a":undefined},
    onClick:()=>{
      setKeybindScheme(key);

      const preset=KEYBIND_SCHEMES[key];
      setCustomKeybinds({
        up:(preset.extraUp[0]||"").toLowerCase(),
        down:(preset.extraDown[0]||"").toLowerCase(),
        left:(preset.extraLeft[0]||"").toLowerCase(),
        right:(preset.extraRight[0]||"").toLowerCase(),
      });
      render();
    },
  },[KEYBIND_SCHEMES[key].label]);
