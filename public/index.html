window.addEventListener("keydown",(e)=>{

  const activeTag=document.activeElement && document.activeElement.tagName;
  if(activeTag==="INPUT" || activeTag==="TEXTAREA") return;

  const shortcuts=getKeyboardShortcuts();
  const keyLower=e.key.length===1?e.key.toLowerCase():e.key;
  if(keyLower===shortcuts.characterSheet){
    e.preventDefault();
    characterSheetShortcutAction();
    return;
  }
  if(keyLower===shortcuts.venture){

    e.preventDefault();
    ventureShortcutAction();
    return;
  }

  if(GF.screen==="combat"){
    if(!GF._combatUI) return;
    if(e.key==="1"){ e.preventDefault(); GF._combatUI.useHealth(); return; }
    if(e.key==="2"){ e.preventDefault(); GF._combatUI.useStamina(); return; }
    if(keyLower==="f"){ e.preventDefault(); GF._combatUI.attemptFlee(); return; }

    if(keyLower===shortcuts.healthPotion){ e.preventDefault(); GF._combatUI.useHealth(); return; }
    if(keyLower===shortcuts.staminaPotion){ e.preventDefault(); GF._combatUI.useStamina(); return; }
    if(keyLower===shortcuts.antidote){ e.preventDefault(); GF._combatUI.useAntidote(); return; }

    if(keyLower===shortcuts.manaPotion){ e.preventDefault(); GF._combatUI.useMana(); return; }

    if(keyLower===shortcuts.spellSlot1){ e.preventDefault(); GF._combatUI.castSpell1(); return; }
    if(keyLower===shortcuts.spellSlot2){ e.preventDefault(); GF._combatUI.castSpell2(); return; }

    if(keyLower===shortcuts.spellSlot3){ e.preventDefault(); GF._combatUI.castSpell3(); return; }
    return;
  }

  if(GF.screen!=="maze") return;

  if(GF.mazeOverlay) return;

  if(keyLower===shortcuts.healthPotion){
    e.preventDefault();

    const id=PS.bestAvailableConsumable("health");
    if(PS.canUseConsumable(id)){ PS.useConsumable(id); autosave(); render(); }
    return;
  }
  if(keyLower===shortcuts.staminaPotion){
    e.preventDefault();
    const id=PS.bestAvailableConsumable("stamina");
    if(PS.canUseConsumable(id)){ PS.useConsumable(id); autosave(); render(); }
    return;
  }
  if(keyLower===shortcuts.antidote){
    e.preventDefault();
    if(PS.canUseConsumable("antidote")){ PS.useConsumable("antidote"); autosave(); render(); }
    return;
  }
  if(keyLower===shortcuts.manaPotion){
    e.preventDefault();
    const id=PS.bestAvailableConsumable("mana");
    if(PS.canUseConsumable(id)){ PS.useConsumable(id); autosave(); render(); }
    return;
  }

  const arrowMap={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  let d=arrowMap[e.key];
  if(!d){

    const extras=getActiveKeybindExtras();
    if(extras.extraUp.includes(e.key)) d=[0,-1];
    else if(extras.extraDown.includes(e.key)) d=[0,1];
    else if(extras.extraLeft.includes(e.key)) d=[-1,0];
    else if(extras.extraRight.includes(e.key)) d=[1,0];
  }
  if(!d) return;
  e.preventDefault();

  const nowTs=Date.now();
  if(e.repeat){
    if(nowTs-lastMazeMoveCommitAt<MAZE_MOVE_REPEAT_THROTTLE_MS) return;
  }
  lastMazeMoveCommitAt=nowTs;
  attemptMazeMove(d[0],d[1]);
});

function closestWithClass(el,className){
  while(el && el.nodeType===1){
    if(el.classList && el.classList.contains(className)) return el;
    el=el.parentElement;
  }
  return null;
}
document.addEventListener("click",(e)=>{
  const tipEl=closestWithClass(e.target,"tooltip");
  const wrapEl=closestWithClass(e.target,"gear-compare-wrap");
  document.querySelectorAll(".tooltip-open").forEach(el=>{ if(el!==tipEl) el.classList.remove("tooltip-open"); });
  document.querySelectorAll(".compare-open").forEach(el=>{ if(el!==wrapEl) el.classList.remove("compare-open"); });
  if(tipEl) tipEl.classList.toggle("tooltip-open");
  if(wrapEl) wrapEl.classList.toggle("compare-open");
});

function ensureCombat(){
  const guardianCellIdx=GF.pending_guardian_cell_idx!=null?GF.pending_guardian_cell_idx:null;

  const roamerId=GF.pending_roamer_id!=null?GF.pending_roamer_id:null;
  if(GF.combat && GF.combat.monster_id===GF.pending_monster_id && GF.combat.guardianCellIdx===guardianCellIdx && GF.combat.roamerId===roamerId){
    return GF.combat;
  }

  if(!GF.combatStarting){
    GF.combatStarting=true;
    startCombatSession(GF.pending_monster_id, guardianCellIdx, roamerId);
  }
  return null;
}

async function startCombatSession(monsterId, guardianCellIdx, roamerId){
  try{
    const result=await Net.startCombat(PS.current_slot, monsterId, GF.maze_depth, guardianCellIdx!=null, roamerId!=null, GF.overworld_snapshot && GF.overworld_snapshot.isNight);
    PS._saveSeqFloor=Math.max(PS._saveSeqFloor||0, result._save_seq);
    PS.current_hp=result.player.current_hp;
    syncCombatRoundBuffs(result.player);
    const base=DL.getMonster(monsterId);
    GF.combat={
      session_id:result.session_id, monster_id:monsterId, guardianCellIdx, roamerId,
      name:result.monster.name, hp:result.monster.hp, maxHp:result.monster.max_hp,
      loot_table:base.loot_table, isGuardian:guardianCellIdx!=null, isRoamer:roamerId!=null,

      area_level:GF.maze_depth,
      log:[...(result.log||[])], defeated:false, lootEntries:[],
    };
    autosave();
  }catch(e){
    setToast("Could not start that fight: "+e.message);
    GF.combatStarting=false;
    GF.goto("maze",{maze_depth:GF.maze_depth});
    return;
  }
  GF.combatStarting=false;
  render();
}

function mazeToast(text,kind,lifeMs){
  if(!text) return;
  GF.mazeToasts=(GF.mazeToasts||[]).filter(t=>Date.now()-t.at<t.life);
  GF.mazeToasts.push({id:++_mazeToastSeq, text, kind:kind||"", at:Date.now(), life:lifeMs||3200});

  if(GF.mazeToasts.length>6) GF.mazeToasts.shift();
  const layer=document.getElementById("maze-toast-layer");
  if(layer) layer.appendChild(mazeToastNode(GF.mazeToasts[GF.mazeToasts.length-1]));
}

function mazeToastNode(t){

}
function mazeToastLayer(){

  const loot=DL.rollLoot(lootTable, PS.getMagicFind());

    const inst=IF.generate(tier);

      spawnFloatItem("player",inst);
      return {text: willAutoEquip?`Found and equipped ${IF.displayName(inst)}!`:`Found ${IF.displayName(inst)}!`, entry:{kind:"gear", inst, autoEquipped:willAutoEquip}};
    }
    return {text:`Found gear but your bags are full, it was left behind.`, entry:{kind:"gear", inst, leftBehind:true}};

function aggregateLootPush(entries,entry){
  if(entry.kind==="consumable"||entry.kind==="herb"){
    const idKey=entry.kind==="consumable"?entry.itemId:entry.herbId;
    const existing=entries.find(e=>e.kind===entry.kind && (entry.kind==="consumable"?e.itemId:e.herbId)===idKey);
    if(existing){ existing.qty=(existing.qty||1)+(entry.qty||1); return; }
    entries.push({...entry, qty:entry.qty||1});
    return;
  }
  entries.push(entry);
}

function applyDeathAndRedirect(cause, defeatedLine){
  const cd=PS.getClassData();
  const announcePayload={character_name:PS.character_name, level:PS.level, class_name:cd.display_name||PS.class_id, cause:`been ${cause.charAt(0).toLowerCase()}${cause.slice(1)}`};
  const result=PS.handleDeath(cause);
  if(result.dead){

    setToast("Your journey ends here. A new entry has been added to the Graveyard.");

  else {

    const p=result.penalty;

function applyCombatLoot(cb,loot,entries){
  if(!loot) return;
  if(loot.type==="gear"){
    const inst=loot.item;
    if(!loot.fit){ entries.push({kind:"gear", inst, leftBehind:true}); return; }
    cb.pendingGearLoot=cb.pendingGearLoot||[];
    cb.pendingGearLoot.push(inst);
    spawnFloatItem("monster",inst);
    return;
  }
  if(loot.type==="consumable"){ PS.addConsumable(loot.item_id,1); aggregateLootPush(entries,{kind:"consumable", itemId:loot.item_id, qty:1}); return; }
  if(loot.type==="herb"){ PS.addHerb(loot.herb_id,1); aggregateLootPush(entries,{kind:"herb", herbId:loot.herb_id, qty:1}); return; }
}

function applyCombatKill(cb,k,preKillXpFraction){
  cb.hp=0;
  spawnFloat("xpbar",`+${Math.round(k.xp_gained)} XP`,"float-text-xp");
  spawnFloat("monster",`+${k.gold}g`,"float-text-gold");
  const leveled=PS.addXpRaw(k.xp_gained);
  Net.accountGold=(Net.accountGold||0)+k.gold_credited;
  PS.kill_streak=k.kill_streak; PS.max_kill_streak=k.max_kill_streak; PS.total_kills=k.total_kills;

  if(k.quests) PS.quests=k.quests;
  if(k.quest_attr_bonus) PS.quest_attr_bonus=k.quest_attr_bonus;
  if(typeof k.quest_bonus_hp==="number") PS.quest_bonus_hp=k.quest_bonus_hp;
  if(typeof k.unspent_quest_stat_points==="number") PS.unspent_quest_stat_points=k.unspent_quest_stat_points;
  cb.lootEntries=[];
  applyCombatLoot(cb,k.loot,cb.lootEntries);
  (k.bonus_loot||[]).forEach(l=>applyCombatLoot(cb,l,cb.lootEntries));
  cb.defeated=true;
  if(k.is_guardian){
    const maze=GF.overworld_snapshot;
    if(maze){
      const cell=maze.cells[cb.guardianCellIdx];
      if(cell){ cell.cleared=true; }
      if(maze.stronghold && cell && cell.guardianSlot!=null) maze.stronghold.guardianDefeated[cell.guardianSlot]=true;
    }
    if(k.key_drop && k.key_drop.item_id){
      PS.addConsumable(k.key_drop.item_id,1);
      aggregateLootPush(cb.lootEntries,{kind:"consumable", itemId:k.key_drop.item_id, qty:1});
    }
  }
  if(k.is_roamer){
    const maze=GF.overworld_snapshot;
    if(maze && maze.roamers){
      const r=maze.roamers.find(rr=>rr.roamerId===cb.roamerId);
      if(r) r.defeated=true;
    }
  }
  autosave();
  render();
  if(!leveled && preKillXpFraction!=null) animateXpBarGrowth(preKillXpFraction);
}

function applyCombatTickPush(sessionId,payload){
  if(!GF.combat || GF.combat.session_id!==sessionId) return;
  const cb=GF.combat;
  PS._saveSeqFloor=Math.max(PS._saveSeqFloor||0, payload._save_seq||0);
  const ticks=payload.monster_ticks||[];
  for(const mt of ticks){
    if(mt.invulnerable){
      combatLog(cb,`The ${cb.name}'s attack passes through you harmlessly, you are untouchable!`);
      spawnFloat("player","Immune!","float-text-block");
    } else if(mt.blocked){
      combatLog(cb,`You block the ${cb.name}'s attack entirely!`);
      spawnFloat("player","Blocked","float-text-block");
    } else if(mt.damage!=null){
      combatLog(cb,`The ${cb.name} hits you for ${mt.damage} damage${mt.crit?` (Critical! x${mt.crit_mult.toFixed(2)})`:""}.`);

      const fontSizeEm=mt.crit?critFloatFontSizeEm(mt.crit_mult,Balance.monsterCritCeiling(cb.area_level),Balance.monsterCritFloor(cb.area_level)):undefined;
      spawnFloat("player",`-${mt.damage} HP${mt.crit?" CRIT!":""}`,mt.crit?"float-text-crit":"float-text-dmg",fontSizeEm);

      if(mt.thorns_damage>0){

        const thornsDmg=Math.round(mt.thorns_damage);
        combatLog(cb,`Your Thorns reflect ${thornsDmg} damage back at the ${cb.name}!`);
        spawnFloat("monster",`-${thornsDmg} HP`,"float-text-dmg");
      }
    }
  }

  const dotTicks=payload.spell_dot_ticks||[];
  for(const t of dotTicks){
    cb.hp=Math.max(0,(cb.hp||0)-t.damage);

    const dotSpell=Balance.SPELLS[t.spell_id];

    const verb=t.spell_id==="verdant_siphon"?"drains":(t.spell_id==="entangle"?"crushes":"burns");

    const dotDmg=Math.round(t.damage), dotHeal=t.heal?Math.round(t.heal):0;
    combatLog(cb,`${dotSpell?dotSpell.name:"Spell"} ${verb} the ${cb.name} for ${dotDmg} damage${dotHeal?`, healing you for ${dotHeal} HP`:""}.`);
    spawnFloat("monster",`-${dotDmg} HP`,"float-text-dmg");
    if(dotHeal) spawnFloat("player",`+${dotHeal} HP`,"float-text-heal");
  }
  if(payload.monster && payload.monster.hp!=null) cb.hp=payload.monster.hp;

  if(payload.player){
    PS.current_hp=payload.player.current_hp;
    if(payload.player.current_mana!=null) PS.current_mana=payload.player.current_mana;
    if(payload.player.current_stamina!=null) PS.current_stamina=payload.player.current_stamina;
  }

  if(payload.kill){
    applyCombatKill(cb,payload.kill,null);
    return;
  }
  if(ticks.length===0 && dotTicks.length===0 && !payload.fatal) return;
  if(payload.player){
    PS.current_hp=payload.player.current_hp;

    if(payload.player.current_mana!=null) PS.current_mana=payload.player.current_mana;
  }
  if(payload.fatal){ endCombatDeath(); return; }
  autosave();
  render();
}

function handleTrapDeath(areaLevel){

  applyDeathAndRedirect(`Slain by a Trap (Area Level ${areaLevel})`, "The trap proves fatal");
}

function syncCombatRoundBuffs(playerPayload){
  if(!playerPayload) return;
  if(playerPayload.invuln_rounds_left!=null) PS.invuln_rounds_left=playerPayload.invuln_rounds_left;
  if(playerPayload.quad_dmg_rounds_left!=null) PS.quad_dmg_rounds_left=playerPayload.quad_dmg_rounds_left;
  if(playerPayload.magic_find_rounds_left!=null) PS.magic_find_rounds_left=playerPayload.magic_find_rounds_left;

  if(playerPayload.current_stamina!=null) PS.current_stamina=playerPayload.current_stamina;

  if(playerPayload.current_mana!=null) PS.current_mana=playerPayload.current_mana;
}

function triggerMazeEncounter(payload){
  if(GF.encounterGateBusy) return;
  GF.encounterGateBusy=true;
  const monsterDef=MONSTERS.find(mm=>mm.id===payload.pending_monster_id);
  const promptEligible=monsterDef && ["Rare","Epic","Legendary"].includes(monsterDef.tier);
  GF.pendingEncounterMobType=payload.pending_guardian_cell_idx!=null?"Guardian":(payload.pending_roamer_id!=null?"Roaming":null);
  GF.goto(promptEligible?"preCombatEncounter":"combat", payload);
  setTimeout(()=>{ GF.encounterGateBusy=false; }, 0);
}

function screenPreCombatEncounter(){
  const monsterId=GF.pending_monster_id;
  const monsterDef=MONSTERS.find(mm=>mm.id===monsterId);
  const bandInfo=monsterDef?MONSTER_BAND_INFO[monsterDef.tier]:null;
  const borderColor=monsterDef?RARITY_BORDER_COLORS[monsterDef.tier]:null;
  const busy=!!GF.preCombatBusy;

  async function attemptPreCombatFlee(){
    if(GF.preCombatBusy) return;
    GF.preCombatBusy=true; render();
    try{
      const result=await Net.preFlee(PS.current_slot);
      GF.preCombatBusy=false;
      if(result.fled){
        const maze_depth=GF.maze_depth;

        mazeLog(`You slip away before the ${monsterDef?monsterDef.name:"monster"} notices you.`);
        GF.pending_monster_id=""; GF.pending_roamer_id=null; GF.pending_guardian_cell_idx=null;
        GF.goto("maze",{maze_depth});
      } else {
        setToast("You fail to get away!");

        GF.goto("combat",{maze_depth:GF.maze_depth, pending_monster_id:GF.pending_monster_id, pending_roamer_id:GF.pending_roamer_id, pending_guardian_cell_idx:GF.pending_guardian_cell_idx});
      }
    }catch(e){
      GF.preCombatBusy=false;
      setToast("Could not attempt to flee: "+e.message);
      render();
    }
  }

  const root=h("div",{});
  root.appendChild(statHeader());
  root.appendChild(h("h2",{},["A wild monster blocks the path!"]));
  const portraitWrap=h("div",{style:{width:"140px",height:"140px",margin:"0 auto 8px"}});

  portraitWrap.classList.add("mob-fade-in");
  portraitWrap.innerHTML=monsterPortrait(monsterId);
  const panel=h("div",{
    class:"panel",
    style:{maxWidth:"320px",margin:"0 auto",position:"relative",border:borderColor?`2px solid ${borderColor}`:undefined},
  },[
    bandInfo?h("div",{style:{position:"absolute",top:"8px",right:"10px",textAlign:"right"}},[
      h("div",{style:{color:borderColor,fontWeight:"bold",fontSize:".85em"}},[bandInfo.label]),
      h("div",{style:{color:borderColor,fontSize:".8em"}},[monsterStarString(monsterDef.star,bandInfo.size)]),
    ]):null,
    portraitWrap,
    h("div",{style:{fontWeight:"bold",textAlign:"center"}},[monsterDef?monsterDef.name:"???"]),

    h("div",{class:"muted",style:{textAlign:"center"}},[`Area Lv ${GF.maze_depth}`, GF.pendingEncounterMobType?` • ${GF.pendingEncounterMobType}`:""]),
  ]);
  root.appendChild(panel);
  root.appendChild(h("div",{class:"row",style:{marginTop:"12px",justifyContent:"center"}},[
    h("button",{class:"play",disabled:busy,onClick:()=>{
      if(busy) return;

      GF.goto("combat",{maze_depth:GF.maze_depth, pending_monster_id:GF.pending_monster_id, pending_roamer_id:GF.pending_roamer_id, pending_guardian_cell_idx:GF.pending_guardian_cell_idx});
    }},["Fight"]),
    h("button",{class:"danger",disabled:busy,onClick:attemptPreCombatFlee},["Flee"]),
  ]));
  return root;
}

function screenCombat(){
  const cb=ensureCombat();
  const root=h("div",{});
  if(!cb){

    root.appendChild(statHeader());
    root.appendChild(h("h2",{},["A wild monster blocks the path!"]));
    root.appendChild(h("div",{class:"panel muted"},["Sizing up the fight..."]));
    return root;
  }

  root.appendChild(statHeader());

  const portraitWrap=h("div",{style:{width:"140px",height:"140px"}});

  if(!cb.defeated && !cb.faded){ portraitWrap.classList.add("mob-fade-in"); cb.faded=true; }
  portraitWrap.innerHTML=monsterPortrait(cb.monster_id,{slain:cb.defeated});

  const portraitOuterWrap=h("div",{style:{position:"relative",width:"140px",height:"140px",margin:"0 auto 8px"}},[portraitWrap,fireflyBurstLayer(),entangleRootsLayer()]);
  const busy=!!GF.combatResolving;

  if(!cb._idleTickStarted){
    cb._idleTickStarted=true;

    setInterval(async ()=>{
      if(GF.combat!==cb || cb.defeated || GF.combatResolving) return;
      try{
        const result=await Net.tickCombat(cb.session_id);
        applyCombatTickPush(cb.session_id,result);
      }catch(e){ console.warn("combat idle-tick poll failed:",e); }
    },2000);
  }

  const continueWandering=()=>{

    if(cb.pendingGearLoot && cb.pendingGearLoot.length>0){
      setToast("Decide what to do with your loot before continuing.");
      render();
      return;
    }
    const maze_depth=GF.maze_depth;
    GF.combat=null; GF.goto("maze",{maze_depth});
  };

  function tryFireAttack(){
    if(!cb || cb.defeated || GF.combatResolving) return;
    const intervalMs=1000/Math.max(0.01,PS.getAttackSpeed());
    const now=Date.now();
    if(cb._lastAttackFiredAt && now-cb._lastAttackFiredAt<intervalMs) return;
    cb._lastAttackFiredAt=now;
    return playerTurn();
  }

  function stopAutoAttack(){
    if(cb._autoAttackTimer){ clearInterval(cb._autoAttackTimer); cb._autoAttackTimer=null; }
  }

  function startAutoAttack(){
    stopAutoAttack();
    const firstAttack=tryFireAttack();
    cb._autoAttackTimer=setInterval(tryFireAttack,50);

    document.addEventListener("mouseup",stopAutoAttack,{once:true});
    return firstAttack;
  }
  const onMobMouseDown=()=>{
    if(cb.defeated) return continueWandering();
    return startAutoAttack();
  };

  const mobMonsterDef=MONSTERS.find(mm=>mm.id===cb.monster_id);
  const mobBandInfo=mobMonsterDef?MONSTER_BAND_INFO[mobMonsterDef.tier]:null;
  const mobBorderColor=mobMonsterDef?RARITY_BORDER_COLORS[mobMonsterDef.tier]:null;
  const mobPanel=h("div",{
    class:"panel",
    style:{
      flex:"0 0 50%",maxWidth:"50%",cursor:busy?"default":"pointer",position:"relative",
      border:mobBorderColor?`2px solid ${mobBorderColor}`:undefined,
    },
    onMouseDown:busy?undefined:onMobMouseDown,
    onMouseLeave:busy?undefined:stopAutoAttack,
  },[
    mobBandInfo?h("div",{style:{position:"absolute",top:"8px",right:"10px",textAlign:"right"}},[
      h("div",{style:{color:mobBorderColor,fontWeight:"bold",fontSize:".85em"}},[mobBandInfo.label]),
      h("div",{style:{color:mobBorderColor,fontSize:".8em"}},[monsterStarString(mobMonsterDef.star,mobBandInfo.size)]),
    ]):null,

    (cb.isRoamer||cb.isGuardian)?h("div",{style:{
      position:"absolute",top:"8px",left:"10px",fontSize:".72em",fontWeight:"bold",
      padding:"2px 7px",borderRadius:"4px",textTransform:"uppercase",letterSpacing:".03em",
      color:"#1a1a12",background:cb.isGuardian?"#e6923a":"#e6d23a",
    }},[cb.isGuardian?"Guardian":"Roaming"]):null,
    portraitOuterWrap,
    h("div",{style:{fontWeight:"bold",textAlign:"center"}},[cb.name]),
    h("div",{style:{textAlign:"center"}},[`HP ${Math.round(Math.max(0,cb.hp))}/${Math.round(cb.maxHp)}`]),

    h("div",{style:{position:"relative"}},[bar(Math.max(0,cb.hp)/cb.maxHp*100,"bar-hp"), floatLayer("monster")]),

    h("div",{style:{fontWeight:"bold",textAlign:"center",marginTop:"6px"}},[cb.defeated?`The ${cb.name} lies defeated.`:`A wild ${cb.name} blocks the path!`]),

    h("div",{class:"muted",style:{textAlign:"center",marginTop:"8px",fontSize:".9em",minHeight:"1.3em"}},[
      cb.defeated?"click to continue wandering":(busy?" ":"click or hold to attack"),
    ]),
  ]);

  const logDiv=h("div",{class:"muted panel",style:{flex:"1",minWidth:"0",minHeight:"0",overflowY:"auto"}},cb.log.map(l=>h("div",{},[l])));
  root.appendChild(h("div",{class:"row",style:{alignItems:"stretch",gap:"14px"}},[mobPanel,logDiv]));

  if(cb.defeated){

    const lootEntries=cb.lootEntries||[];
    if(lootEntries.length>0){
      root.appendChild(h("div",{class:"panel",style:{margin:"12px 0"}},
        lootEntries.map(entry=>h("div",{style:{padding:"8px 0",borderBottom:"1px solid var(--border)"}},[chestLootEntryNode(entry)]))
      ));
    }

    (cb.pendingGearLoot||[]).forEach(inst=>{ root.appendChild(combatPendingLootNode(inst,cb)); });
    return root;
  }

  function renderMonsterHit(mt){

    if(mt.invulnerable){
      combatLog(cb,`The ${cb.name}'s attack passes through you harmlessly, you are untouchable!`);
      spawnFloat("player","Immune!","float-text-block");
    } else if(mt.blocked){
      combatLog(cb,`You block the ${cb.name}'s attack entirely!`);
      spawnFloat("player","Blocked","float-text-block");
    } else if(mt.damage!=null){

      combatLog(cb,`The ${cb.name} hits you for ${mt.damage} damage${mt.crit?` (Critical! x${mt.crit_mult.toFixed(2)})`:""}.`);

      const fontSizeEm=mt.crit?critFloatFontSizeEm(mt.crit_mult,Balance.monsterCritCeiling(cb.area_level),Balance.monsterCritFloor(cb.area_level)):undefined;
      spawnFloat("player",`-${mt.damage} HP${mt.crit?" CRIT!":""}`,mt.crit?"float-text-crit":"float-text-dmg",fontSizeEm);

      if(mt.thorns_damage>0){

        const thornsDmg=Math.round(mt.thorns_damage);
        combatLog(cb,`Your Thorns reflect ${thornsDmg} damage back at the ${cb.name}!`);
        spawnFloat("monster",`-${thornsDmg} HP`,"float-text-dmg");
      }
    }
  }

  function applyAttackResult(result){

    (result.monster_ticks||[]).forEach(renderMonsterHit);
    if(result.mob_blocked){
      combatLog(cb,`The ${cb.name} blocks your attack!`);
      spawnFloat("monster","Blocked","float-text-block");
    } else if(result.player_hit){
      const {damage,crit,quad_damage,crit_mult}=result.player_hit;

      combatLog(cb,`You hit the ${cb.name} for ${damage} damage${crit?` (Critical! x${crit_mult.toFixed(2)})`:""}${quad_damage?" (Quad Damage!)":""}.`);
      const fontSizeEm=crit?critFloatFontSizeEm(crit_mult,PS.getCritMultiplierMax()):undefined;
      spawnFloat("monster",`-${damage} HP${crit?" CRIT!":""}`,crit?"float-text-crit":"float-text-dmg",fontSizeEm);

      if(result.weapon_skill){
        const skillResult=PS.registerWeaponHit(result.weapon_skill.weapon_type);
        if(skillResult.leveledUp) combatLog(cb,`Your ${IF.WEAPON_TYPE_LABELS[result.weapon_skill.weapon_type]} proficiency reaches level ${skillResult.newLevel}!`);
      }
    }
    cb.hp=result.monster.hp;
    PS.current_hp=result.player.current_hp;
    syncCombatRoundBuffs(result.player);

    if(result.kill){

      const preKillXpFraction=PS.xp_to_next>0?(PS.xp/PS.xp_to_next):0;
      applyCombatKill(cb,result.kill,preKillXpFraction);
      return;
    }

    if(result.monster_turn) renderMonsterHit(result.monster_turn);

    if(result.fatal){ endCombatDeath(); return; }
    autosave();
    render();
  }

  async function playerTurn(){
    if(GF.combatResolving) return;
    GF.combatResolving=true; render();
    try{
      const result=await Net.attackCombat(cb.session_id);
      PS._saveSeqFloor=Math.max(PS._saveSeqFloor||0, result._save_seq);
      GF.combatResolving=false;
      applyAttackResult(result);
    }catch(e){
      GF.combatResolving=false;
      setToast("That attack failed to register: "+e.message);
      render();
    }
  }

  async function attemptFlee(){
    if(GF.combatResolving) return;
    if(GF.fleeCooldownUntil && Date.now()<GF.fleeCooldownUntil) return;
    GF.fleeCooldownUntil=Date.now()+Balance.FLEE_BUTTON_COOLDOWN_MS;

    setTimeout(()=>{ if(GF.screen==="combat") render(); }, Balance.FLEE_BUTTON_COOLDOWN_MS+50);
    GF.combatResolving=true; render();
    try{
      const result=await Net.fleeCombat(cb.session_id);
      PS._saveSeqFloor=Math.max(PS._saveSeqFloor||0, result._save_seq);
      GF.combatResolving=false;

      (result.monster_ticks||[]).forEach(renderMonsterHit);
      PS.current_hp=result.player.current_hp;
      syncCombatRoundBuffs(result.player);
      if(result.fatal){ endCombatDeath(); return; }
      if(result.failed){
        combatLog(cb,"You fail to flee!");
        if(result.monster_turn) renderMonsterHit(result.monster_turn);
        autosave();
        render();
        return;
      }

      GF.combat=null; resetMazePositionToStart(); PS.resetKillStreak(); PS.saveGame(); setToast("You flee back to camp, but remember your way through these woods."); GF.goto("town");
    }catch(e){
      GF.combatResolving=false;
      setToast("Could not flee: "+e.message);
      render();
    }
  }

  async function useItemInCombat(itemId){
    if(GF.combatResolving || !itemId) return;
    GF.combatResolving=true; render();
    try{
      const item=DL.getItem(itemId);
      const result=await Net.useItemCombat(cb.session_id, itemId);
      PS._saveSeqFloor=Math.max(PS._saveSeqFloor||0, result._save_seq);

      (result.monster_ticks||[]).forEach(renderMonsterHit);
      PS.current_hp=result.player.current_hp;
      syncCombatRoundBuffs(result.player);
      if(result.fatal){ GF.combatResolving=false; endCombatDeath(); return; }

      const totalTicks=Balance.POTION_HEAL_DURATION_MS/Balance.POTION_HEAL_TICK_MS;
      if((item.heal_amount||0)>0 && PS.current_hp<PS.getMaxHp()){
        PS._queueGradualHeal(PS.active_heals,item.heal_amount,PS.getMaxHp()-PS.current_hp,totalTicks);
      }
      if((item.stamina_amount||0)>0 && PS.current_stamina<PS.getMaxStamina()){
        PS._queueGradualHeal(PS.active_stamina_heals,item.stamina_amount,PS.getMaxStamina()-PS.current_stamina,totalTicks);
      }

      if((item.mana_amount||0)>0 && PS.current_mana<PS.getMaxMana()){
        PS._queueGradualHeal(PS.active_mana_heals,item.mana_amount,PS.getMaxMana()-PS.current_mana,totalTicks);
      }
      PS.current_stamina=result.player.current_stamina;

      PS._removeConsumableOne(itemId);
    }catch(e){
      setToast("Could not use that item: "+e.message);
    }
    GF.combatResolving=false;
    autosave();
    render();
  }

  async function castSpellInCombat(spellId){
    if(GF.combatResolving) return;

    const spell=Balance.spellAtTier(spellId, PS.getSpellTier(spellId));
    if(!spell){ setToast("You don't have a spell in that slot."); render(); return; }
    GF.combatResolving=true; render();
    try{
      const result=await Net.castSpellCombat(cb.session_id,spellId);
      PS._saveSeqFloor=Math.max(PS._saveSeqFloor||0, result._save_seq||0);
      (result.monster_ticks||[]).forEach(renderMonsterHit);

      (result.spell_dot_ticks||[]).forEach(t=>{
        cb.hp=Math.max(0,(cb.hp||0)-t.damage);
        const dotSpell=Balance.SPELLS[t.spell_id];

        const verb=t.spell_id==="verdant_siphon"?"drains":(t.spell_id==="entangle"?"crushes":"burns");

        const dotDmg=Math.round(t.damage), dotHeal=t.heal?Math.round(t.heal):0;
        combatLog(cb,`${dotSpell?dotSpell.name:"Spell"} ${verb} the ${cb.name} for ${dotDmg} damage${dotHeal?`, healing you for ${dotHeal} HP`:""}.`);
        spawnFloat("monster",`-${dotDmg} HP`,"float-text-dmg");
        if(dotHeal) spawnFloat("player",`+${dotHeal} HP`,"float-text-heal");
      });
      if(result.monster && result.monster.hp!=null) cb.hp=result.monster.hp;
      syncCombatRoundBuffs(result.player);
      PS.current_hp=result.player.current_hp;
      if(result.fatal){ GF.combatResolving=false; endCombatDeath(); return; }
      if(result.cast){

        PS.registerSpellcastHit();

        GF.spellCooldownUntil[spellId]=Date.now()+spell.cooldown_ms;
        setTimeout(()=>{ if(GF.screen==="combat") render(); }, spell.cooldown_ms+50);
        const c=result.cast;
        if(c.heal_amount!=null){
          combatLog(cb,`You cast Heal, restoring ${c.heal_amount} HP.`);
          spawnFloat("player",`+${c.heal_amount} HP`,"float-text-heal");
        } else if(c.queued_hits!=null){

          combatLog(cb,`You cast ${spell.name} at the ${cb.name}.`);

          if(spellId==="fireflies") spawnFireflyBurst();
        } else if(c.rooted_until!=null){

          combatLog(cb,`You cast Entangle, rooting the ${cb.name} in crushing vines! It can't act, and you can flee freely.`);
          spawnFloat("monster","Rooted!","float-text-block");

          spawnEntangleRoots(c.rooted_until-Date.now());
        }
      }
      if(result.spell_skill && result.spell_skill.leveled_up) combatLog(cb,`Your Spellcasting proficiency reaches level ${result.spell_skill.new_level}!`);

      if(result.consumed_attack_beat) cb._lastAttackFiredAt=Date.now();
    }catch(e){
      setToast("Could not cast that spell: "+e.message);
    }
    GF.combatResolving=false;
    autosave();
    render();
  }
  function castSlotted(slotIndex){
    const spellId=PS.getSpellSlots()[slotIndex];
    if(!spellId){ setToast(`Spell Slot ${slotIndex+1} is empty.`); render(); return; }
    return castSpellInCombat(spellId);
  }

  const busyDisabled=!!GF.combatResolving;

  const fleeCooldownActive=!!(GF.fleeCooldownUntil && Date.now()<GF.fleeCooldownUntil);
  const fleeElapsedMs=fleeCooldownActive?(Balance.FLEE_BUTTON_COOLDOWN_MS-(GF.fleeCooldownUntil-Date.now())):0;

  const fleeCooldownRing=fleeCooldownActive?h("svg",{class:"flee-cooldown-ring",width:"20",height:"20",viewBox:"0 0 20 20"},[
    h("circle",{class:"flee-cooldown-track",cx:"10",cy:"10",r:"8"},[]),
    h("circle",{class:"flee-cooldown-fill",cx:"10",cy:"10",r:"8",style:{strokeDasharray:"50.27",animationDuration:Balance.FLEE_BUTTON_COOLDOWN_MS+"ms",animationDelay:(-fleeElapsedMs)+"ms"}},[]),
  ]):null;

  root.appendChild(h("div",{class:"row",style:{marginTop:"10px"}},[
    h("button",{disabled:busyDisabled||!PS.canUseConsumable(PS.bestAvailableConsumable("health")),onClick:()=>useItemInCombat(PS.bestAvailableConsumable("health"))},["Use Health Potion"]),
    h("button",{disabled:busyDisabled||!PS.canUseConsumable(PS.bestAvailableConsumable("stamina")),onClick:()=>useItemInCombat(PS.bestAvailableConsumable("stamina"))},["Use Stamina Potion"]),
    h("button",{disabled:busyDisabled||!PS.canUseConsumable("antidote"),onClick:()=>useItemInCombat("antidote")},["Use Antidote"]),

    h("button",{disabled:busyDisabled||!PS.canUseConsumable(PS.bestAvailableConsumable("mana")),onClick:()=>useItemInCombat(PS.bestAvailableConsumable("mana"))},["Use Mana Potion"]),

    h("div",{class:"flee-cooldown-wrap"},[
      h("button",{class:"danger",disabled:busyDisabled||fleeCooldownActive,onClick:attemptFlee},["Flee"]),
      fleeCooldownRing,
    ]),
  ]));

  function combatSpellSlot(slotIndex,spellId){
    const spell=spellId?Balance.SPELLS[spellId]:null;
    const size=64;
    const badge=spellIcon(spellId,size);
    badge.classList.add("tooltip");

    const keyLabel=getKeyboardShortcuts()[SPELL_SLOT_SHORTCUT_KEYS[slotIndex]||"spellSlot1"].toUpperCase();
    badge.setAttribute("data-tip", spell?`${spell.name} (${keyLabel} to cast)\n${spellShopSubtext(spellId, PS.getSpellTier(spellId))}`:`Spell Slot ${slotIndex+1}: empty. Visit Thistlewick, the Hollow Magus to learn and slot a spell.`);

    const cdUntil=spell&&GF.spellCooldownUntil[spellId];
    const cdActive=!!(cdUntil && Date.now()<cdUntil);

    const spellTier=spell?PS.getSpellTier(spellId):0;
    const tierData=spell?Balance.spellAtTier(spellId,spellTier):null;
    const levelReq=tierData?(tierData.level_req||1):1;
    const levelLocked=!!spell && PS.level<levelReq;
    const clickable=!!spell && !busyDisabled && !cdActive && !levelLocked;
    const wrap=h("div",{
      class:"spell-slot-large-wrap"+(clickable?" clickable":""),
      onClick:clickable?()=>castSlotted(slotIndex):null,
    },[badge]);
    if(levelLocked){
      badge.setAttribute("data-tip",`${spell.name} (Tier ${tierRomanNumeral(spellTier)}) requires Level ${levelReq}. You are Level ${PS.level}.`);
      const mask=h("div",{class:"spell-slot-locked-mask"},[h("span",{},["\uD83D\uDD12"])]);
      wrap.appendChild(mask);
      wrap.appendChild(h("div",{class:"spell-slot-locked-req"},[`Lv ${levelReq}`]));
    }
    if(cdActive && !levelLocked){
      const elapsedMs=spell.cooldown_ms-(cdUntil-Date.now());
      wrap.appendChild(h("svg",{class:"spell-slot-cooldown-mask",width:size,height:size,viewBox:`0 0 ${size} ${size}`},[
        h("circle",{class:"spell-slot-cooldown-fill",cx:size/2,cy:size/2,r:size/4,style:{
          strokeWidth:size/2,strokeDasharray:"100.53",
          animationDuration:spell.cooldown_ms+"ms",
          animationDelay:(-elapsedMs)+"ms",
        }},[]),
      ]));
    }
    return wrap;
  }
  root.appendChild(h("div",{class:"row",style:{justifyContent:"center",gap:"20px",margin:"10px 0 4px"}},
    PS.getSpellSlots().map((spellId,i)=>combatSpellSlot(i,spellId))
  ));

  GF._combatUI={
    useHealth:()=>useItemInCombat(PS.lowestAvailableConsumable("health")),
    useStamina:()=>useItemInCombat(PS.lowestAvailableConsumable("stamina")),

    useAntidote:()=>{ if(PS.canUseConsumable("antidote")) useItemInCombat("antidote"); },

    useMana:()=>useItemInCombat(PS.lowestAvailableConsumable("mana")),

    castSpell1:()=>castSlotted(0),
    castSpell2:()=>castSlotted(1),

    castSpell3:()=>castSlotted(2),
    attemptFlee:attemptFlee,

function screenStrongholdChest(){

  if(keyCount<=0){
    root.appendChild(h("div",{class:"panel"},[`This chest is sealed tight, you'll need a Tier ${tierRomanNumeral(requiredTier)} Stronghold Key to open it (this area is Tier ${tierRomanNumeral(requiredTier)}), a key of any other tier won't fit. Guardians have a small chance to drop one matching their own area's tier when defeated.`]));

    ]));

  }

  root.appendChild(h("div",{class:"row",style:{marginTop:"10px"}},[
    h("button",{class:"play",onClick:()=>{
      PS._removeConsumableOne(requiredKeyId);
      const tier=Balance.rollItemTier(GF.maze_depth);

      for(let i=0;i<gearCount;i++){

        const inst=IF.generate(tier,"",Balance.rollStrongholdChestGearRarity());

          entries.push({kind:"gear", inst, autoEquipped:willAutoEquip});
        } else {
          entries.push({kind:"gear", inst, leftBehind:true});
        }
      }

      const goldFound=randIntRange(Balance.STRONGHOLD_CHEST_GOLD_MIN,Balance.STRONGHOLD_CHEST_GOLD_MAX);
      PS.addGold(goldFound); entries.push({kind:"gold", amount:goldFound});

      const herbTotal=randIntRange(Balance.STRONGHOLD_CHEST_HERBS_MIN,Balance.STRONGHOLD_CHEST_HERBS_MAX);
      const herbCounts={};
      for(let i=0;i<herbTotal;i++){
        const herbId=DL.pickHerbForNode(GF.maze_depth);
        PS.addHerb(herbId,1);
        herbCounts[herbId]=(herbCounts[herbId]||0)+1;
      }
      for(const herbId of Object.keys(herbCounts)) entries.push({kind:"herb", herbId, qty:herbCounts[herbId]});

      const potionTotal=randIntRange(Balance.STRONGHOLD_CHEST_POTIONS_MIN,Balance.STRONGHOLD_CHEST_POTIONS_MAX);
      const potionCounts={};
      for(let i=0;i<potionTotal;i++){
        const healthTier=pick(["greater_health_potion","supreme_health_potion"]);
        const staminaTier=pick(["greater_stamina_potion","supreme_stamina_potion"]);
        const chosenId=Math.random()<0.5?healthTier:staminaTier;
        PS.addConsumable(chosenId,1);
        potionCounts[chosenId]=(potionCounts[chosenId]||0)+1;
      }
      for(const itemId of Object.keys(potionCounts)) entries.push({kind:"consumable", itemId, qty:potionCounts[itemId]});

      const elixirTotal=randIntRange(Balance.STRONGHOLD_CHEST_ELIXIRS_MIN,Balance.STRONGHOLD_CHEST_ELIXIRS_MAX);
      const elixirCounts={};
      for(let i=0;i<elixirTotal;i++){
        const elixirId=pick(["elixir_of_clarity","elixir_of_eyesight"]);
        PS.addConsumable(elixirId,1);
        elixirCounts[elixirId]=(elixirCounts[elixirId]||0)+1;
      }
      for(const itemId of Object.keys(elixirCounts)) entries.push({kind:"consumable", itemId, qty:elixirCounts[itemId]});

      if(Math.random()<Balance.STRONGHOLD_CHEST_SCROLL_CHANCE){
        const scroll=pick(["scroll_of_challenge_1","scroll_of_challenge_2","scroll_of_challenge_3"]);
        PS.addConsumable(scroll,1); entries.push({kind:"consumable", itemId:scroll, qty:1});
      }
      if(Math.random()<Balance.STRONGHOLD_CHEST_EYESIGHT_CHANCE){
        PS.addConsumable("elixir_of_eyesight",1); entries.push({kind:"consumable", itemId:"elixir_of_eyesight", qty:1});
      }
      if(Math.random()<Balance.STRONGHOLD_CHEST_BAG_CHANCE){
        const bagIds=Object.keys(ITEMS).filter(id=>ITEMS[id].type==="bag");
        const bagId=pick(bagIds);

        entries.push({kind:"consumable", itemId:bagId, qty:1, note:result.success?null:"Couldn't fit, backpack full"});

        const cell=maze.cells[cellIdx];
        if(cell) cell.cleared=true;
        if(maze.stronghold) maze.stronghold.opened=true;
      }

      reportQuestStrongholdChest(GF.maze_depth);
      const returnDepth=GF.maze_depth;
      PS.saveGame();
      GF.chestReveal={title:"The Stronghold chest creaks open!", entries, returnDepth};
      GF.goto("chestReveal");
    }},["Unlock with Key"]),
    h("button",{onClick:()=>{ GF.goto("maze",{maze_depth:GF.maze_depth}); }},["Leave it"]),
  ]));
  return root;
}

const HERB_HARVEST_BASE_MS=4000, HERB_HARVEST_MS_PER_LEVEL=500, HERB_HARVEST_FLOOR_MS=500;
function herbHarvestDurationMs(){
  return Math.max(HERB_HARVEST_FLOOR_MS, HERB_HARVEST_BASE_MS-HERB_HARVEST_MS_PER_LEVEL*PS.getHerbalismLevel());
}

const HERB_HARVEST_STRIKE_WEIGHT=3;

function completeHerbHarvest(node){
  const herb=DL.getHerb(node.herb_id);
  const skillResult=PS.registerHerbalismStrike(HERB_HARVEST_STRIKE_WEIGHT);

  const qty=randIntRange(1,12);
  PS.addHerb(node.herb_id,qty);
  if(GF.overworld_snapshot) GF.overworld_snapshot.cells[node.cell_idx].cleared=true;

  reportQuestHerbHarvest();
  const returnDepth=GF.maze_depth;
  GF.herbNode=null; autosave();

  GF.chestReveal={
    title:skillResult.leveledUp?`You gather ${herb.name}! (Herbalism reaches level ${skillResult.newLevel})`:`You gather ${herb.name}!`,
    entries:[{kind:"herb", herbId:node.herb_id, qty}],
    returnDepth,
  };
  GF.goto("chestReveal");
}

function refreshHerbHarvestBarInPlace(){
  const node=GF.herbNode;
  if(!node || !node.harvestStartedAt) return false;
  const fill=document.getElementById("herb-harvest-bar-fill");
  if(!fill || !fill.parentNode) return false;
  const elapsed=Date.now()-node.harvestStartedAt;
  fill.style.width=clampf(elapsed/node.durationMs*100,0,100)+"%";
  return true;
}

function screenHerbEncounter(){
  const node=ensureHerbNode();
  const herb=DL.getHerb(node.herb_id);
  const root=h("div",{});

  root.appendChild(statHeader());
  root.appendChild(h("h2",{},[herb.rare?`A rare bloom, ${herb.name}`:`Gathering ${herb.name}`]));
  root.appendChild(h("div",{class:"lore"},["Careful hands find more than hasty ones. No danger here, just patience."]));

  const harvesting=!!node.harvestStartedAt;
  const pct=harvesting?clampf((Date.now()-node.harvestStartedAt)/node.durationMs*100,0,100):0;

  if(harvesting && !node.timerStarted){

      if(GF.herbNode!==node || !node.harvestStartedAt){
        clearInterval(GF.herbHarvestInterval); GF.herbHarvestInterval=null; return;

      if(Date.now()-node.harvestStartedAt>=node.durationMs){
        clearInterval(GF.herbHarvestInterval); GF.herbHarvestInterval=null;
        completeHerbHarvest(node);
      } else if(!refreshHerbHarvestBarInPlace()){
        render();

  badge.style.boxShadow=herb.rare?"0 0 16px 3px rgba(224,178,61,.6)":"0 0 12px 2px rgba(143,206,106,.45)";

    h("div",{class:"row gap",style:{alignItems:"center"}},[
      badge,
      h("div",{style:{flex:"1",minWidth:"0"}},[
        h("div",{style:{fontWeight:"bold"}},[herb.name]),
        herb.rare?h("div",{style:{color:"var(--gold)",fontSize:".78em",fontWeight:"bold"}},["Rare Bloom"]):null,
      ]),
    ]),
    h("div",{class:"muted",style:{fontSize:".85em"}},[herb.found_in||""]),
    h("div",{style:{marginTop:"4px"}},[
      bar(pct,"bar-xp",false,"herb-harvest-bar-fill"),
      h("div",{class:"muted",style:{fontSize:".8em",marginTop:"4px"}},[harvesting?"Gathering...":"Ready to gather."]),
    ]),
  ]));

  root.appendChild(h("div",{class:"row",style:{marginTop:"10px"}},[
    h("button",{disabled:harvesting,onClick:()=>{
      if(node.harvestStartedAt) return;

  ]));

function gearAffixMap(inst){
  const m={};
  for(const a of (inst.affixes||[])) m[a.stat]=(m[a.stat]||0)+a.value;
  return m;
}

function affixDeltaSpan(stat,delta){
  if(!delta) return null;
  const isPercent=IF.affixIsPercent(stat);
  const sign=delta>0?"+":"-";
  const mag=Math.abs(delta);

  const text=(stat==="crit_multiplier") ? (mag/100).toFixed(2) : trimDecimal(mag)+(isPercent?"%":"");
  return h("span",{class:delta>0?"stat-delta-good":"stat-delta-bad"},[` (${sign}${text})`]);
}

function gearComparisonContent(inst){
  const slotsToCompare=inst.slot==="ring"?["ring1","ring2"]:[inst.slot];
  const nodes=[h("div",{class:"compare-title"},["Currently Equipped"])];
  for(const slotKey of slotsToCompare){
    const equipped=PS.equipped[slotKey];
    const label=IF.slotLabel(slotKey);
    if(!equipped){
      nodes.push(h("div",{class:"muted",style:{marginBottom:"4px"}},[`${label}: (nothing equipped)`]));
      continue;
    }
    nodes.push(h("div",{style:{marginBottom:"4px"}},[

      h("div",{class:"rarity-"+equipped.rarity,style:{fontWeight:"bold"}},[`${label}: ${IF.displayName(equipped)} (${tierRomanNumeral(equipped.tier)})`]),
      ...equipped.affixes.map(a=>h("div",{},[IF.formatAffix(a,equipped)])),
    ]));
  }
  return nodes;
}

function equippedRefForCompare(inst){
  if(inst.slot==="ring") return PS.equipped.ring1||PS.equipped.ring2||null;
  return PS.equipped[inst.slot]||null;
}

function gearHoveredItemContent(inst,opts){
  const nodes=[h("div",{class:"compare-title rarity-"+inst.rarity},[`${IF.displayName(inst)} (${tierRomanNumeral(inst.tier)})`])];

  const compareOn=!(opts&&opts.compare===false);
  const levelFailed=compareOn && PS.level<Balance.tierLevelRequirement(inst.tier);
  nodes.push(h("div",{style:{marginBottom:"2px",color:levelFailed?"#e07a7a":undefined}},[`Requires Level ${Balance.tierLevelRequirement(inst.tier)}`]));
  const weaponType=IF.weaponTypeForInstance(inst);
  const offhandType=IF.offhandTypeForInstance(inst);

  const restrictedTo=weaponType?IF.WEAPON_TYPE_CLASS_RESTRICTIONS[weaponType]:(offhandType?IF.OFFHAND_TYPE_CLASS_RESTRICTIONS[offhandType]:null);
  if(restrictedTo){
    const classFailed=compareOn && !IF.classCanEquipItem(PS.class_id,inst);
    nodes.push(h("div",{style:{marginBottom:"2px",color:classFailed?"#e07a7a":undefined}},[`Class: ${restrictedTo.map(id=>DL.getClass(id).display_name||id).join(", ")}`]));
  }

  const equippedRef=compareOn?equippedRefForCompare(inst):null;
  const equippedMap=equippedRef?gearAffixMap(equippedRef):{};
  const hoveredMap=gearAffixMap(inst);
  for(const a of (inst.affixes||[])){
    const delta=a.value-(equippedMap[a.stat]||0);
    const deltaNode=equippedRef?affixDeltaSpan(a.stat,delta):null;
    nodes.push(h("div",{},deltaNode?[IF.formatAffix(a,inst),deltaNode]:[IF.formatAffix(a,inst)]));
  }

  if(equippedRef){
    let firstMissing=true;
    for(const stat in equippedMap){
      if(!(stat in hoveredMap)){
        nodes.push(h("div",{style:firstMissing?{marginTop:"6px"}:{}},[`(no ${IF.affixLabel(stat)})`, affixDeltaSpan(stat,-equippedMap[stat])]));
        firstMissing=false;
      }
    }
  }
  return nodes;
}

function attributeSummaryLines(chain,classData){

  const blockPct=Balance.BLOCK_CHANCE_PER_DEX*100;

  const vitHp=Math.round(Balance.vitHpBonus(classData||{},1));
  const vitStam=Math.round(Balance.vitStaminaBonus(classData||{},1));
  const vitLine=`Vitality: +${vitHp} HP and +${vitStam} Stamina per point, applied immediately.`;

  const strArmorPerPoint=Balance.STR_TO_ARMOR_RATIO;
  const strArmorLine=`+${strArmorPerPoint} Armor per point (reduces incoming direct-hit damage).`;
  if(chain==="thornguard"){
    return [
      `Strength: +1 damage per point, and ${strArmorLine}`,
      `Dexterity: +${blockPct}% Block Chance per point, a chance to take 0 damage from a hit.`,
      vitLine,
      "Intelligence: no effect for this path.",
    ];
  }
  if(chain==="windrider"){
    return [
      `Strength: ${strArmorLine}`,
      `Dexterity: +1 damage per point, and +${blockPct}% Block Chance per point, a chance to take 0 damage from a hit.`,
      vitLine,
      "Intelligence: no effect for this path.",
    ];
  }
  if(chain==="wizard"){
    return [
      `Strength: ${strArmorLine}`,
      `Dexterity: +${blockPct}% Block Chance per point, a chance to take 0 damage from a hit.`,
      vitLine,

      `Intelligence: +${Balance.WIZARD_INT_DAMAGE_PER_POINT} damage per point.`,
    ];
  }
  return [];
}

const RARITY_BORDER_COLORS={Common:"#9a9686",Uncommon:"#e8e4d8",Rare:"#5a9ae0",Epic:"#e0c94a",Legendary:"#d9902f",Set:"#3fbf5f"};

const UNEQUIPPABLE_TINT="rgba(200,40,40,0.28)";

function backpackSwapSlots(idxA,idxB){
  if(idxA===idxB) return;
  const arr=PS.gear_instances;
  const a=arr[idxA];
  if(!a) return;
  if(idxB>=arr.length){
    arr.splice(idxA,1);
    arr.push(a);
  } else {
    const b=arr[idxB];
    arr[idxA]=b; arr[idxB]=a;
  }
  PS.saveGame(); render();
}

function backpackGearGrid(){
  const litterEnabled=GF.screen==="inventory" && GF.inventory_return_to==="maze";
  const capacity=PS.getInventoryCapacity();
  const grid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(8,1fr)",gap:"4px",marginBottom:"10px",maxWidth:"360px"}});

  const bagList=PS.bags||[];
  for(let i=0;i<capacity;i++){
    const inst=PS.gear_instances[i];
    const isReorderSrc=GF._bagReorderMode&&GF._bagReorderSrcIdx===i;
    if(!inst){
      const bagIdx=i-PS.gear_instances.length;
      if(bagIdx>=0 && bagIdx<bagList.length){
        const bagItemId=bagList[bagIdx];
        const bagItem=DL.getItem(bagItemId);
        const bagSlotsFull=PS.equipped_bags.length>=Balance.MAX_BAG_SLOTS;
        grid.appendChild(h("div",{
          class:"tile tooltip",
          "data-tip":`${bagItem.name}\n+${bagItem.capacity} capacity while equipped\n${bagSlotsFull?`Bag slots full (${PS.equipped_bags.length}/${Balance.MAX_BAG_SLOTS}).`:"Click to equip."}`,
          style:{width:"38px",height:"38px",padding:"0",display:"flex",alignItems:"center",justifyContent:"center",cursor:bagSlotsFull?"default":"pointer",opacity:bagSlotsFull?"0.6":"1"},
          onClick:bagSlotsFull?null:()=>{
            const result=PS.equipBag(bagItemId);
            if(!result.success){ setToast(result.reason); render(); return; }
            PS.saveGame(); render();
          },
        },[itemIcon(bagItemId,26)]));
        continue;
      }
      grid.appendChild(h("div",{
        class:"tile",
        style:{width:"38px",height:"38px",padding:"0",cursor:GF._bagReorderMode?"pointer":"default"},
        onClick:GF._bagReorderMode?()=>{

          if(GF._bagReorderSrcIdx!=null){
            const src=GF._bagReorderSrcIdx; GF._bagReorderSrcIdx=null;
            backpackSwapSlots(src,i);
            setToast("Backpack slots auto-compact: the item moved to the end of your items, not literally onto the empty tile you clicked.");
            render();
          }
        }:null,
      }));
      continue;
    }
    const canEquip=PS.canEquipGear(inst);
    const borderColor=isReorderSrc?"#4ac6ff":(RARITY_BORDER_COLORS[inst.rarity]||"var(--border)");
    const tile=h("div",{
      class:"tile tooltip",
      style:{width:"38px",height:"38px",padding:"0",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",border:`2px solid ${borderColor}`,background:canEquip?undefined:UNEQUIPPABLE_TINT},
      "data-tip":`${IF.tooltipText(inst)}\n${IF.categoryLabel(inst)}`+(canEquip?"":`\n${PS.gearInvalidReason(inst)}`),
      onClick:GF._bagReorderMode?()=>{

        if(GF._bagReorderSrcIdx==null){ GF._bagReorderSrcIdx=i; render(); }
        else if(GF._bagReorderSrcIdx===i){ GF._bagReorderSrcIdx=null; render(); }
        else { const src=GF._bagReorderSrcIdx; GF._bagReorderSrcIdx=null; backpackSwapSlots(src,i); }
      }:()=>{
        if(!canEquip){ setToast(PS.gearInvalidReason(inst)); render(); return; }
        const label=PS.wouldSwap(inst)?"Swap":"Equip";

        if(inst.slot==="ring" && label==="Swap"){
          const ring1Name=IF.displayName(PS.equipped.ring1), ring2Name=IF.displayName(PS.equipped.ring2);
          askConfirm(`Swap ${IF.displayName(inst)} in for which ring?\nRing 1: ${ring1Name}\nRing 2: ${ring2Name}`,null,{
            buttons:[
              {label:"Swap Ring 1",onClick:()=>{ PS.equipGear(inst.instance_id,"ring1"); autosave(); render(); }},
              {label:"Swap Ring 2",onClick:()=>{ PS.equipGear(inst.instance_id,"ring2"); autosave(); render(); }},
            ],
          });
          return;
        }
        askConfirm(`${label} ${IF.displayName(inst)}?`,()=>{ PS.equipGear(inst.instance_id); autosave(); render(); },{confirmLabel:label,danger:false});
      },
    },[gearIcon(inst,26)]);

    let cell=gearCompareWrap(tile, inst);

    if(litterEnabled){
      cell=h("div",{style:{position:"relative"}},[
        cell,
        h("button",{
          class:"danger",
          title:"Litter this item (-1 Forest Reputation)",
          style:{position:"absolute",top:"-6px",right:"-6px",width:"16px",height:"16px",padding:"0",fontSize:"9px",lineHeight:"14px",borderRadius:"50%"},
          onClick:(e)=>{
            if(e&&e.stopPropagation) e.stopPropagation();
            askConfirm(`Litter ${IF.displayName(inst)}? (-1 Forest Reputation)`,()=>{
              const idx=PS.gear_instances.indexOf(inst);
              if(idx!==-1) PS.gear_instances.splice(idx,1);
              PS.adjustForestReputation(-1);
              PS.saveGame();
              setToast(`You discard the ${IF.displayName(inst)}. (-1 Forest Reputation)`);
              render();
            },{confirmLabel:"Litter",danger:true});
          },
        },["🗑"]),
      ]);
    }
    grid.appendChild(cell);
  }
  return grid;
}

function bagManagementRow(){
  const wrap=h("div",{});
  const equipped=PS.equipped_bags;
  if(equipped.length===0) return wrap;
  wrap.appendChild(h("div",{class:"muted",style:{fontSize:".8em",margin:"2px 0 4px"}},[`Bags (${equipped.length}/${Balance.MAX_BAG_SLOTS} equipped), click to unequip.`]));
  const chips=[];
  for(const bagId of equipped){
    const item=DL.getItem(bagId);
    const wouldOverflow=PS.wouldOverflowWithoutBag(bagId);
    const full=!PS.hasInventorySpace();
    const disabled=wouldOverflow||full;
    const reason=wouldOverflow?"Unequipping this would leave you carrying more gear than your remaining capacity allows.":(full?"Your backpack is full, make room first.":"Click to unequip.");
    chips.push(h("div",{
      class:"tile row gap tooltip",
      "data-tip":`${item.name}\n+${item.capacity} capacity (equipped)\n${reason}`,
      style:{alignItems:"center",gap:"6px",padding:"4px 8px",cursor:disabled?"default":"pointer",opacity:disabled?"0.6":"1",border:"2px solid #4ac67a"},
      onClick:disabled?null:()=>{
        if(!PS.unequipBag(bagId)){ setToast("Can't unequip that bag right now."); render(); return; }
        PS.saveGame(); render();
      },
    },[itemIcon(bagId,22), h("span",{},[item.name])]));
  }
  wrap.appendChild(h("div",{class:"row gap",style:{flexWrap:"wrap",marginBottom:"10px"}},chips));
  return wrap;
}

function consumablesListPanel(){
  const wrap=h("div",{});

  wrap.appendChild(h("h3",{style:{marginTop:"0"}},["Consumables", h("span",{class:"muted",style:{fontWeight:"normal",fontSize:".8em"}},[" (click to use)"])]));
  const consEntries=Object.keys(PS.consumables).filter(k=>PS.consumables[k]>0);
  if(consEntries.length===0){ wrap.appendChild(h("div",{class:"muted"},["None."])); return wrap; }
  const chips=consEntries.map(itemId=>{
    const item=DL.getItem(itemId);
    const isPotion=item.type==="consumable";

    const scrollTier=item.scroll_tier||0;
    const scrollLevelReq=scrollTier?Balance.tierLevelRequirement(scrollTier):0;
    const scrollLocked=scrollTier>0 && PS.level<scrollLevelReq;
    const disabled=scrollTier>0 ? scrollLocked : (isPotion && !PS.canUseConsumable(itemId));
    const onUse=()=>{
      if(scrollTier>0){
        if(scrollLocked){ setToast(`This scroll's words are beyond you until Level ${scrollLevelReq}.`); render(); return; }
        if(GF.scrollReading) return;
        GF.scrollReading=itemId; render();
        Net.readScroll(PS.current_slot,itemId).then(result=>{
          PS._saveSeqFloor=Math.max(PS._saveSeqFloor||0, result._save_seq||0);
          PS.consumables=result.consumables||PS.consumables;
          PS.level=result.level; PS.xp=result.xp; PS.xp_to_next=result.xp_to_next;
          if(result.quests) PS.quests=result.quests;
          spawnFloat("xpbar",`+${Math.round(result.xp_gained)} XP`,"float-text-xp");
          setToast(result.leveled?`The scroll's wisdom carries you to Level ${result.level}!`:`You read the ${item.name} and gain ${Math.round(result.xp_gained)} experience.`);
        }).catch(e=>{
          setToast(e.message||"Could not read that scroll.");
        }).then(()=>{ GF.scrollReading=null; render(); });
        return;
      }
      if(isPotion){

        const wasEyesight=(item.eyesight_steps||0)>0;
        const ok=PS.useConsumable(itemId);
        autosave();
        if(ok && wasEyesight) setToast("Your sight sharpens, the woods reveal more around you.");
      } else {
        PS.useScroll(itemId);
        autosave();
        setToast(`${item.name} will boost your next descent by ${item.level_bonus} levels.`);
      }
      render();
    };
    return h("div",{
      class:"tile row gap tooltip",
      "data-tip":DL.itemEffectDescription(itemId),
      style:{alignItems:"center",gap:"6px",padding:"4px 8px",cursor:disabled?"default":"pointer",opacity:disabled?"0.5":"1"},
      onClick:disabled?null:onUse,
    },[itemIcon(itemId,22), h("span",{},[`${item.name} x${PS.consumables[itemId]}`])]);
  });
  wrap.appendChild(h("div",{class:"row gap",style:{flexWrap:"wrap"}},chips));
  return wrap;
}

        eqWrap.appendChild(h("div",{class:"row",style:{alignItems:"baseline",gap:"0"}},[

            autosave(); render();
          }},["Unequip all invalid items"]):null,
        ]));
        const eqDoll=h("div",{class:"equip-doll"});
        for(const rowSlots of EQUIP_DOLL_ROWS){
          eqDoll.appendChild(h("div",{class:"equip-doll-row"},rowSlots.map(slot=>equipSlotTile(slot))));
        }
        eqWrap.appendChild(eqDoll);

        const bpWrap=h("div",{});
        bpWrap.appendChild(h("h3",{style:{marginTop:"0"}},[`Backpack (${PS.getInventoryUsed()}/${PS.getInventoryCapacity()})`]));
        bpWrap.appendChild(h("div",{class:"muted",style:{marginBottom:"6px"}},["Click a slot to equip or swap. Visit the Blacksmith to salvage gear, or the Merchant to sell it."]));

          h("button",{onClick:()=>{ GF._bagReorderMode=!GF._bagReorderMode; GF._bagReorderSrcIdx=null; render(); }},[GF._bagReorderMode?"Done Reordering":"Reorder Items"]),

          h("button",{title:"Arrange your backpack by Tier, click again to reverse the order.",onClick:backpackSortByTier},[GF._bagSortTierDesc?"Sort by Tier (T5 → T1)":"Sort by Tier (T1 → T5)"]),
        ]));
        if(GF._bagReorderMode) bpWrap.appendChild(h("div",{class:"muted",style:{marginBottom:"6px"}},[GF._bagReorderSrcIdx!=null?"Now click the slot you want to move it to (or click it again to cancel)." : "Click an item to pick it up, then click a slot to place it there."]));
        bpWrap.appendChild(backpackGearGrid());

        bpWrap.appendChild(bagManagementRow());
        return bpWrap;
      })()]),
    ]));
    root.appendChild(h("div",{class:"row",style:{alignItems:"flex-start",gap:"14px",marginTop:"14px"}},[
      h("div",{style:{flex:"0 0 50%",maxWidth:"50%",minWidth:"0"}},[consumablesListPanel()]),
      h("div",{style:{flex:"1",minWidth:"0"}},[herbsListPanel()]),
    ]));
  }

  return root;
}

function salvageAllGearOfRarity(rarityName, busy){
  if(busy) return;
  const displayName=Balance.rarityDisplayName(rarityName);
  const matches=PS.gear_instances.filter((inst)=>inst.rarity===rarityName);
  if(matches.length===0){ setToast(`No ${displayName} items in your backpack to salvage.`); render(); return; }

  const label=`Salvage all ${matches.length} ${displayName} item${matches.length===1?"":"s"}`;
  askConfirm(
    `Salvage all ${matches.length} ${displayName} item${matches.length===1?"":"s"} in your backpack? This cannot be undone.`,
    ()=>{
      const ids=matches.map((inst)=>inst.instance_id);
      for(const id of ids){
        const idx=PS.findGearIndex(id); if(idx===-1) continue;

      },550);
    },
    {confirmLabel:"Salvage All",danger:true}

}

function maxAffordableRecipeQty(recipe){
  let max=99;
  for(const h2 in recipe.herbs){ const have=PS.herbs[h2]||0; max=Math.min(max, Math.floor(have/recipe.herbs[h2])); }
  if(recipe.gold_cost>0) max=Math.min(max, Math.floor(PS.gold/recipe.gold_cost));
  return Math.max(1,max);
}

function vaultFindEmptySlot(){
  const items=Net.vaultCache||[];
  const capacity=Net.vaultCapacity||200;
  const used=new Set(items.map(i=>i.slot));
  for(let i=0;i<capacity;i++) if(!used.has(i)) return i;
  return -1;
}

function vaultSync(restoreFn){
  Net.saveVault(Net.vaultCache||[]).catch(e=>{
    if(e && e.conflict){
      Net.vaultCache=e.items; Net.vaultCapacity=e.capacity; Net.vaultVersion=e.version;
      if(restoreFn) restoreFn();
      setToast("The vault changed elsewhere (maybe another of your characters) since you last looked here, refreshed to its current contents. Please try again.");
    } else {
      setToast("Could not sync the vault with the server: "+e.message);
    }
    PS.saveGame(); render();
  });
}
function vaultDepositGear(instanceId){
  const slot=vaultFindEmptySlot();
  if(slot===-1){ setToast("The vault is full."); return; }
  const idx=PS.findGearIndex(instanceId);
  if(idx===-1) return;
  const inst=PS.gear_instances[idx];
  PS.gear_instances.splice(idx,1);
  Net.vaultCache.push({slot,kind:"gear",inst});
  PS.saveGame(); vaultSync(()=>{ PS.addGear(inst); }); render();
}
function vaultDepositConsumable(itemId){
  const qty=PS.consumables[itemId]||0; if(qty<=0) return;
  const existing=(Net.vaultCache||[]).find(e=>e.kind==="consumable"&&e.item_id===itemId);
  if(existing){ existing.qty+=qty; }
  else {
    const slot=vaultFindEmptySlot();
    if(slot===-1){ setToast("The vault is full."); return; }
    Net.vaultCache.push({slot,kind:"consumable",item_id:itemId,qty});
  }
  delete PS.consumables[itemId];
  PS.saveGame(); vaultSync(()=>{ PS.addConsumable(itemId,qty); }); render();
}
function vaultDepositHerb(herbId){
  const qty=PS.herbs[herbId]||0; if(qty<=0) return;
  const existing=(Net.vaultCache||[]).find(e=>e.kind==="herb"&&e.herb_id===herbId);
  if(existing){ existing.qty+=qty; }
  else {
    const slot=vaultFindEmptySlot();
    if(slot===-1){ setToast("The vault is full."); return; }
    Net.vaultCache.push({slot,kind:"herb",herb_id:herbId,qty});
  }
  delete PS.herbs[herbId];
  PS.saveGame(); vaultSync(()=>{ PS.addHerb(herbId,qty); }); render();
}
function vaultWithdraw(slotIndex){
  const idx=(Net.vaultCache||[]).findIndex(e=>e.slot===slotIndex);
  if(idx===-1) return;
  const entry=Net.vaultCache[idx];
  let restoreFn=null;
  if(entry.kind==="gear"){
    if(!PS.addGear(entry.inst)){ setToast("Your backpack is full."); return; }

    restoreFn=()=>{ const i=PS.findGearIndex(entry.inst.instance_id); if(i!==-1) PS.gear_instances.splice(i,1); };
  } else if(entry.kind==="consumable"){
    PS.addConsumable(entry.item_id,entry.qty);
    restoreFn=()=>{ PS.consumables[entry.item_id]=Math.max(0,(PS.consumables[entry.item_id]||0)-entry.qty); if(PS.consumables[entry.item_id]<=0) delete PS.consumables[entry.item_id]; };
  } else if(entry.kind==="herb"){
    PS.addHerb(entry.herb_id,entry.qty);
    restoreFn=()=>{ PS.herbs[entry.herb_id]=Math.max(0,(PS.herbs[entry.herb_id]||0)-entry.qty); if(PS.herbs[entry.herb_id]<=0) delete PS.herbs[entry.herb_id]; };
  }
  Net.vaultCache.splice(idx,1);
  PS.saveGame(); vaultSync(restoreFn); render();
}

function vaultWithdrawPartial(slotIndex,qty){
  const idx=(Net.vaultCache||[]).findIndex(e=>e.slot===slotIndex);
  if(idx===-1) return;
  const entry=Net.vaultCache[idx];
  if(entry.kind!=="consumable"&&entry.kind!=="herb") return;
  qty=Math.floor(qty);
  if(!qty||qty<=0||qty>=entry.qty) return;
  entry.qty-=qty;
  let restoreFn=null;
  if(entry.kind==="consumable"){
    PS.addConsumable(entry.item_id,qty);
    restoreFn=()=>{ entry.qty+=qty; PS.consumables[entry.item_id]=Math.max(0,(PS.consumables[entry.item_id]||0)-qty); if(PS.consumables[entry.item_id]<=0) delete PS.consumables[entry.item_id]; };
  } else {
    PS.addHerb(entry.herb_id,qty);
    restoreFn=()=>{ entry.qty+=qty; PS.herbs[entry.herb_id]=Math.max(0,(PS.herbs[entry.herb_id]||0)-qty); if(PS.herbs[entry.herb_id]<=0) delete PS.herbs[entry.herb_id]; };
  }
  PS.saveGame(); vaultSync(restoreFn); render();
}

function vaultSwapSlots(slotA,slotB){
  if(slotA===slotB) return;
  const items=Net.vaultCache||[];
  const entryA=items.find(e=>e.slot===slotA), entryB=items.find(e=>e.slot===slotB);
  if(!entryA && !entryB) return;
  if(entryA) entryA.slot=slotB;
  if(entryB) entryB.slot=slotA;
  vaultSync(()=>{ if(entryA) entryA.slot=slotA; if(entryB) entryB.slot=slotB; });
  render();
}

function vaultSortByTier(){
  const items=Net.vaultCache||[];
  const gear=items.filter(e=>e.kind==="gear").slice().sort((a,b)=>a.inst.tier-b.inst.tier);
  const nonGear=items.filter(e=>e.kind!=="gear").slice().sort((a,b)=>a.slot-b.slot);
  if(GF._vaultSortTierDesc) gear.reverse();
  let nextSlot=0;
  for(const e of gear) e.slot=nextSlot++;
  for(const e of nonGear) e.slot=nextSlot++;
  GF._vaultSortTierDesc=!GF._vaultSortTierDesc;
  PS.saveGame(); vaultSync(); render();
}

function backpackSortByTier(){
  PS.gear_instances.sort((a,b)=>a.tier-b.tier);
  if(GF._bagSortTierDesc) PS.gear_instances.reverse();
  GF._bagSortTierDesc=!GF._bagSortTierDesc;
  PS.saveGame(); render();
}

const GEAR_FILTER_SLOT_LABELS={weapon:"Weapon",head:"Head",shoulders:"Shoulders",armor:"Armor",pants:"Pants",gloves:"Gloves",boots:"Boots",ring:"Ring",amulet:"Amulet",belt:"Belt"};

function gearMatchesFilter(inst, filter){
  if(!inst) return false;
  if(filter.tier && inst.tier!==filter.tier) return false;
  if(filter.slot && inst.slot!==filter.slot) return false;
  if(filter.stats && filter.stats.length){
    const instStats=new Set((inst.affixes||[]).map(a=>a.stat));
    for(const s of filter.stats) if(!instStats.has(s)) return false;
  }
  return true;
}
function gearFilterActive(filter){ return !!(filter.tier || filter.slot || (filter.stats&&filter.stats.length>0)); }

function gearFilterOpacity(inst, filter){

  if(!gearFilterActive(filter)) return 1;
  return gearMatchesFilter(inst,filter) ? 1 : 0.25;
}

function screenVault(){

  root.appendChild(h("button",{style:{marginBottom:"8px"},onClick:()=>GF.goto("town")},["← Back to Town"]));
  const t=toastBox(); if(t) root.appendChild(t);
  root.appendChild(statHeader());

  if(Net.vaultCache===null||Net.vaultCache===undefined){
    root.appendChild(h("div",{class:"muted"},["Loading..."]));

    return root;
  }

  const capacity=Net.vaultCapacity||200;
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px"}},[`${Net.vaultCache.length}/${capacity} slots used, 20x10, shared across every character on this account.`]));

  root.appendChild(h("div",{class:"row gap",style:{marginBottom:"8px",alignItems:"center"}},[
    h("button",{onClick:()=>{ GF._vaultReorderMode=!GF._vaultReorderMode; GF._vaultReorderSrc=null; GF._vaultSplitSlot=null; render(); }},[GF._vaultReorderMode?"Done Reordering":"Reorder Items"]),

    h("button",{title:"Arrange every gear item by Tier, click again to reverse the order.",onClick:vaultSortByTier},[GF._vaultSortTierDesc?"Sort by Tier (T5 → T1)":"Sort by Tier (T1 → T5)"]),
    GF._vaultReorderMode?h("div",{class:"muted"},[GF._vaultReorderSrc!=null?"Now click the slot you want to move it to (or click it again to cancel)." : "Click an item to pick it up, then click an empty or occupied slot to place it there."]):null,
  ]));

  const grid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(20,32px)",gap:"2px",
    marginBottom:"14px",justifyContent:"start"}});
  for(let i=0;i<capacity;i++){
    const entry=Net.vaultCache.find(e=>e.slot===i);
    let label=null, icon=null, tip=null;
    if(entry){

      if(entry.kind==="gear"){ label=IF.displayName(entry.inst)+` (${tierRomanNumeral(entry.inst.tier)})`; icon=gearIcon(entry.inst,30); tip=`${IF.tooltipText(entry.inst)}\n${IF.categoryLabel(entry.inst)}`+(PS.canEquipGear(entry.inst)?"":`\n${PS.gearInvalidReason(entry.inst)}`); }
      else if(entry.kind==="consumable"){ label=`${DL.getItem(entry.item_id).name} x${entry.qty}`; icon=itemIcon(entry.item_id,24); tip=`${label}\n${DL.itemCategoryLabel(entry.item_id)}\n${DL.itemEffectDescription(entry.item_id)}`; }
      else if(entry.kind==="herb"){ label=`${DL.getHerb(entry.herb_id).name} x${entry.qty}`; icon=herbIcon(entry.herb_id,24); tip=`${label}\n${DL.getHerb(entry.herb_id).found_in||""}`; }
    }

    const isSplittable=entry&&(entry.kind==="consumable"||entry.kind==="herb")&&entry.qty>1;
    const isReorderSrc=GF._vaultReorderMode&&GF._vaultReorderSrc===i;
    let onClickFn=null;
    if(GF._vaultReorderMode){

      onClickFn=()=>{
        if(GF._vaultReorderSrc==null){
          if(entry) { GF._vaultReorderSrc=i; render(); }
        } else if(GF._vaultReorderSrc===i){
          GF._vaultReorderSrc=null; render();
        } else {
          const src=GF._vaultReorderSrc; GF._vaultReorderSrc=null;
          vaultSwapSlots(src,i);
        }
      };
    } else if(entry){
      onClickFn=()=>{
        if(isSplittable){ GF._vaultSplitSlot=i; render(); }
        else { askConfirm(`Withdraw ${label} back to your backpack?`,()=>vaultWithdraw(i),{confirmLabel:"Withdraw",danger:false}); }
      };
    }

    const filterOpacity=gearFilterOpacity(entry&&entry.kind==="gear"?entry.inst:null, GF._vaultFilter);

    const vaultUnequippable=entry&&entry.kind==="gear"&&!PS.canEquipGear(entry.inst);
    const vaultTile=h("div",{
      class:"tile"+(entry?" tooltip":"")+(entry&&entry.kind==="gear"?" rarity-"+entry.inst.rarity:""),
      style:{width:"32px",height:"32px",padding:"0",display:"flex",alignItems:"center",justifyContent:"center",cursor:(entry||GF._vaultReorderMode)?"pointer":"default",
        border:isReorderSrc?"2px solid #4ac6ff":undefined, boxSizing:"border-box", opacity:String(filterOpacity), background:vaultUnequippable?UNEQUIPPABLE_TINT:undefined},
      "data-tip":tip||undefined,
      onClick:onClickFn,
    },[icon]);

    grid.appendChild(entry&&entry.kind==="gear"?gearCompareWrap(vaultTile,entry.inst):vaultTile);
  }

  const vaultLeft=h("div",{class:"vault-left"});
  const vaultDeposit=h("div",{class:"vault-deposit"});
  vaultLeft.appendChild(grid);

  if(GF._vaultSplitSlot!=null){
    const entry=(Net.vaultCache||[]).find(e=>e.slot===GF._vaultSplitSlot);
    if(!entry || (entry.kind!=="consumable"&&entry.kind!=="herb")){ GF._vaultSplitSlot=null; }
    else {
      const name=entry.kind==="consumable"?DL.getItem(entry.item_id).name:DL.getHerb(entry.herb_id).name;
      const qtyInput=h("input",{type:"number",min:"1",max:String(entry.qty-1),value:String(Math.min(entry.qty-1,10)),style:{width:"70px"}});
      vaultLeft.appendChild(h("div",{class:"panel",style:{marginBottom:"14px"}},[
        h("div",{style:{marginBottom:"6px"}},[`Withdraw how many of ${name} (have ${entry.qty} stashed)? You can also just withdraw the whole stack from the grid above.`]),
        h("div",{class:"row gap",style:{alignItems:"center"}},[
          qtyInput,
          h("button",{onClick:()=>{
            const qty=parseInt(qtyInput.value,10);
            if(!qty||qty<=0||qty>=entry.qty){ setToast(`Enter a quantity between 1 and ${entry.qty-1} (use the grid above to withdraw the entire stack).`); render(); return; }
            GF._vaultSplitSlot=null;
            vaultWithdrawPartial(entry.slot,qty);
          }},["Withdraw"]),
          h("button",{onClick:()=>{ GF._vaultSplitSlot=null; render(); }},["Cancel"]),
          h("button",{onClick:()=>{ GF._vaultSplitSlot=null; askConfirm(`Withdraw all ${entry.qty} ${name} back to your backpack?`,()=>vaultWithdraw(entry.slot),{confirmLabel:"Withdraw All",danger:false}); }},["Withdraw All"]),
        ]),
      ]));
    }
  }

  vaultDeposit.appendChild(h("h3",{},["Deposit from Backpack"]));
  if(PS.gear_instances.length===0) vaultDeposit.appendChild(h("div",{class:"muted"},["Nothing in your backpack to store."]));
  for(const inst of [...PS.gear_instances]){
    vaultDeposit.appendChild(gearRow(inst,[h("button",{onClick:()=>vaultDepositGear(inst.instance_id)},["Store"])]));
  }

  vaultDeposit.appendChild(h("h3",{},["Deposit Consumables"]));
  const consEntries=Object.keys(PS.consumables).filter(k=>PS.consumables[k]>0);
  if(consEntries.length===0) vaultDeposit.appendChild(h("div",{class:"muted"},["None."]));
  for(const itemId of consEntries){

    vaultDeposit.appendChild(h("div",{class:"row gap",style:{marginBottom:"4px",alignItems:"center",justifyContent:"space-between"}},[
      h("div",{class:"row gap",style:{alignItems:"center"}},[itemIcon(itemId,22), h("span",{class:"tooltip","data-tip":DL.itemEffectDescription(itemId)},[`${DL.getItem(itemId).name} x${PS.consumables[itemId]}`])]),
      h("button",{onClick:()=>vaultDepositConsumable(itemId)},["Store"]),
    ]));
  }

  vaultDeposit.appendChild(h("h3",{},["Deposit Herbs"]));
  const herbEntries=Object.keys(PS.herbs).filter(k=>PS.herbs[k]>0);
  if(herbEntries.length===0) vaultDeposit.appendChild(h("div",{class:"muted"},["None."]));
  for(const herbId of herbEntries){

    vaultDeposit.appendChild(h("div",{class:"row gap",style:{marginBottom:"4px",alignItems:"center",justifyContent:"space-between"}},[
      h("div",{class:"row gap",style:{alignItems:"center"}},[herbIcon(herbId,22), h("span",{class:"tooltip","data-tip":DL.getHerb(herbId).found_in||""},[`${DL.getHerb(herbId).name} x${PS.herbs[herbId]}`])]),
      h("button",{onClick:()=>vaultDepositHerb(herbId)},["Store"]),
    ]));
  }

  root.appendChild(h("div",{class:"vault-row"},[vaultLeft, vaultDeposit]));
  return root;
}

function generateMerchantStock(){
  const stock=[];
  for(let i=0;i<Balance.MERCHANT_STOCK_SIZE;i++){
    stock.push(IF.generate(randIntRange(1,Balance.ITEM_TIER_MAX)));
  }
  return stock;
}

function ensureMerchantStock(){
  if(!GF.merchantStock || GF._merchantStockSlot!==PS.current_slot || GF._merchantStockAttempts!==PS.trial_attempts_count){
    GF.merchantStock=generateMerchantStock();
    GF._merchantStockSlot=PS.current_slot;
    GF._merchantStockAttempts=PS.trial_attempts_count;
  }
  return GF.merchantStock;
}

const MERCHANT_QUICK_SELL_RARITIES=["Common","Uncommon","Rare"];
function sellAllGearOfRarity(rarityName){
  const displayName=Balance.rarityDisplayName(rarityName);
  const matches=PS.gear_instances.filter((inst)=>inst.rarity===rarityName);
  if(matches.length===0){ setToast(`No ${displayName} items in your backpack to sell.`); render(); return; }
  const total=matches.reduce((sum,inst)=>sum+Balance.sellValue(inst.tier,IF.slotCount(inst)),0);
  askConfirm(
    `Sell all ${matches.length} ${displayName} item${matches.length===1?"":"s"} in your backpack for ${total}g? This cannot be undone.`,
    ()=>{
      beginBulkNotify();
      let sold=0, earned=0;

      for(const id of matches.map((inst)=>inst.instance_id)){
        const inst=PS.gear_instances.find((g)=>g.instance_id===id);
        if(!inst) continue;
        const value=Balance.sellValue(inst.tier,IF.slotCount(inst));
        if(PS.sellGear(id)!==false){ sold++; earned+=value; }
      }
      endBulkNotify();
      PS.saveGame();
      setToast(`Sold ${sold} ${displayName} item${sold===1?"":"s"} for ${earned}g.`);
      render();
    }
  );
}
function merchantQuickSellRow(){
  const buttons=[];
  for(const rarityName of MERCHANT_QUICK_SELL_RARITIES){
    const count=PS.gear_instances.filter((inst)=>inst.rarity===rarityName).length;
    if(count===0) continue;
    const displayName=Balance.rarityDisplayName(rarityName);
    buttons.push(h("button",{onClick:()=>sellAllGearOfRarity(rarityName)},[`Sell ${count} ${displayName} item${count===1?"":"s"}`]));
  }
  if(buttons.length===0) return null;
  return h("div",{class:"row gap",style:{flexWrap:"wrap",marginBottom:"10px"}},buttons);
}
function merchantSellTab(){
  const root=h("div",{});
  const quickSell=merchantQuickSellRow();
  if(quickSell) root.appendChild(quickSell);
  if(PS.gear_instances.length===0 && (PS.bags||[]).length===0) root.appendChild(h("div",{class:"muted"},["Nothing to sell."]));
  for(const inst of PS.gear_instances){
    root.appendChild(gearRow(inst,[h("button",{onClick:()=>{PS.sellGear(inst.instance_id);PS.saveGame();render();}},[`Sell (+${Balance.sellValue(inst.tier,IF.slotCount(inst))}g)`])]));
  }
  for(let i=0;i<(PS.bags||[]).length;i++){
    const bagItemId=PS.bags[i];
    const item=DL.getItem(bagItemId);
    root.appendChild(h("div",{class:"tile row gap tooltip",style:{alignItems:"center",justifyContent:"space-between",marginBottom:"6px"},"data-tip":`+${item.capacity} inventory capacity while equipped.`},[
      h("div",{class:"row gap",style:{alignItems:"center"}},[itemIcon(bagItemId,26), h("span",{},[item.name])]),

        PS.gold+=(item.sell_value||0); PS.saveGame(); render();

  return root;

async function magicianBuySpell(spellId,tier){
  if(GF.magicianBusy) return;
  GF.magicianBusy=true; render();
  try{
    const result=await Net.buySpell(PS.current_slot, spellId, tier);
    PS._saveSeqFloor=Math.max(PS._saveSeqFloor||0, result._save_seq||0);
    PS.owned_spell_tiers=result.owned_spell_tiers;
    if(typeof result.account_gold==="number") Net.setAuthoritativeGold(result.account_gold);
    autosave();
    setToast(`Learned ${Balance.SPELLS[spellId].name} (Tier ${tierRomanNumeral(tier)})!`);
  }catch(e){
    setToast("Could not learn that spell: "+e.message);
  }
  GF.magicianBusy=false; render();
}
async function magicianSlotSpell(slotIndex,spellId){
  if(GF.magicianBusy) return;
  GF.magicianBusy=true; render();
  try{
    const result=await Net.slotSpell(PS.current_slot, slotIndex, spellId);
    PS._saveSeqFloor=Math.max(PS._saveSeqFloor||0, result._save_seq||0);
    PS.spell_slots=result.spell_slots;
    autosave();
  }catch(e){
    setToast("Could not update that spell slot: "+e.message);
  }
  GF.magicianBusy=false; render();
}

function magicianSpellCard(spellId){
  const spellDef=Balance.SPELLS[spellId];

  const ownedTier=PS.getOwnedSpellTier(spellId);
  const owned=ownedTier>0;
  const maxed=ownedTier>=5;
  const nextTier=ownedTier+1;
  const nextTierData=maxed?null:Balance.spellAtTier(spellId,nextTier);
  const meetsLevel=nextTierData?PS.level>=nextTierData.level_req:true;
  const affordable=nextTierData?PS.gold>=nextTierData.price:true;
  const slots=PS.getSpellSlots();
  const slottedAt=slots.indexOf(spellId);
  const busy=!!GF.magicianBusy;
  const buyable=!maxed && meetsLevel && affordable;
  const disabledReason=(!maxed && !buyable)?(!meetsLevel?`Requires Level ${nextTierData.level_req}`:"Not enough gold"):null;

  const currentTierData=owned?Balance.spellAtTier(spellId,ownedTier):null;
  const statRow=h("div",{class:"muted row gap",style:{fontSize:".78em",flexWrap:"wrap"}},
    currentTierData
      ?[h("span",{},[`Tier ${tierRomanNumeral(ownedTier)}`]), h("span",{},[`${currentTierData.mana_cost} mana`]), h("span",{},[`${currentTierData.cooldown_ms/1000}s cooldown`])]
      :[h("span",{},[`Lv ${nextTierData.level_req}`]), h("span",{},[`${nextTierData.mana_cost} mana`]), h("span",{},[`${nextTierData.cooldown_ms/1000}s cooldown`])]
  );

  let stateArea;
  if(owned){
    const actions=[];
    if(slottedAt!==-1){
      actions.push(h("span",{class:"muted"},[`Slotted in ${slottedAt+1}`]));
      actions.push(h("button",{disabled:busy,onClick:(e)=>{ e.stopPropagation(); magicianSlotSpell(slottedAt,null); }},["Unslot"]));
    } else {

      for(let i=0;i<PS.getEffectiveSpellSlotCount();i++){
        actions.push(h("button",{disabled:busy,onClick:(e)=>{ e.stopPropagation(); magicianSlotSpell(i,spellId); }},[`Slot in ${i+1}`]));
      }
    }
    stateArea=h("div",{class:"col gap",style:{marginTop:"2px"}},[
      h("div",{style:{color:"#8fce6a",fontWeight:"bold",fontSize:".85em"}},[`✓ Owned (Tier ${tierRomanNumeral(ownedTier)})`]),
      h("div",{class:"row gap",style:{flexWrap:"wrap"}},actions),
    ]);
  } else {
    stateArea=h("div",{class:"muted",style:{fontSize:".85em",marginTop:"2px"}},["Click to learn this spell (Tier I)."]);
  }

  let upgradeArea=null;
  if(maxed){
    upgradeArea=h("div",{style:{fontSize:".85em",color:"#8fce6a",fontWeight:"bold",marginTop:"6px"}},["Max tier reached."]);
  } else if(owned){
    upgradeArea=h("div",{style:{marginTop:"6px"}},[
      buyable
        ?h("button",{disabled:busy,onClick:(e)=>{ e.stopPropagation(); magicianBuySpell(spellId,nextTier); }},[`Upgrade to Tier ${tierRomanNumeral(nextTier)} (${nextTierData.price}g)`])
        :h("div",{style:{fontSize:".85em",color:"#e07a7a",fontWeight:"bold"}},[disabledReason]),
    ]);
  } else if(disabledReason){
    upgradeArea=h("div",{style:{fontSize:".85em",color:"#e07a7a",fontWeight:"bold",marginTop:"2px"}},[disabledReason]);
  }

  return h("div",{
    class:"tile spell-card"+(buyable&&!owned?" spell-card-buyable":"")+(!buyable&&!owned&&!maxed?" spell-card-disabled":"")+(owned?" spell-card-owned":""),
    onClick:(!owned&&buyable)?()=>magicianBuySpell(spellId,1):null,
  },[
    h("div",{class:"row gap",style:{alignItems:"center"}},[
      spellIcon(spellId,44),
      h("div",{style:{flex:"1",minWidth:"0"}},[
        h("div",{style:{fontWeight:"bold"}},[spellDef.name]),
        statRow,
      ]),
      !maxed?h("div",{class:"gold-text",style:{fontWeight:"bold",flex:"none"}},[`${nextTierData.price}g`]):null,
    ]),
    h("div",{class:"muted",style:{fontSize:".85em"}},[spellShopSubtext(spellId, owned?ownedTier:1)]),
    stateArea,
    upgradeArea,
  ]);
}

function spellShopSubtext(spellId,tier){
  const s=Balance.spellAtTier(spellId, tier||1);
  if(!s) return "";
  if(spellId==="heal_1") return `Restores ${s.heal_amount} HP. ${s.mana_cost} mana, ${s.cooldown_ms/1000}s cooldown.`;
  if(spellId==="fireflies") return `${s.hit_count} stinging motes strike for ${s.hit_min}-${s.hit_max} damage each over ${s.duration_ms/1000} seconds. ${s.mana_cost} mana, ${s.cooldown_ms/1000}s cooldown.`;

  if(spellId==="entangle") return `Roots the monster in place for ${s.duration_ms/1000} seconds and guarantees your next flee attempt succeeds, while ${s.dot_hit_count} crushing pulses of ${s.dot_min}-${s.dot_max} damage strike over ${s.dot_duration_ms/1000} seconds. ${s.mana_cost} mana, ${s.cooldown_ms/1000}s cooldown.`;
  if(spellId==="verdant_siphon") return `Channels ${s.hit_count} draining pulses of ${s.hit_min}-${s.hit_max} nature damage each over ${s.duration_ms/1000} seconds, healing you for half the damage dealt on each pulse. ${s.mana_cost} mana, ${s.cooldown_ms/1000}s cooldown.`;
  return "";
}

function auctionPurchaseBlockedReason(listing){
  if(!listing || listing.type!=="gear") return null;
  if(PS.hasInventorySpace()) return null;

  try{ if(listing.item && PS.canAutoEquip(listing.item)) return null; }catch(e){ return null; }
  return "Your backpack is full. Make room before buying this.";
}
