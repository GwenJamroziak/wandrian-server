      spawnFloat("player",`-${mt.damage} HP${mt.crit?" CRIT!":""}`,mt.crit?"float-text-crit":"float-text-dmg",fontSizeEm);
    }
  }

  
  
  
  
  function applyAttackResult(result){
    
    
    
    
    (result.monster_ticks||[]).forEach(renderMonsterHit);
    if(result.mob_blocked){
      combatLog(cb,`The ${cb.name} blocks your attack!`);
      spawnFloat("monster","Blocked","float-text-block");
    } else if(result.player_hit){
      const {damage,crit,quad_damage,crit_mult}=result.player_hit;
      
      
      
      
      combatLog(cb,`You hit the ${cb.name} for ${damage} damage${crit?` (Critical! x${crit_mult.toFixed(2)})`:""}${quad_damage?" (Quad Damage!)":""}.`);
      const fontSizeEm=crit?critFloatFontSizeEm(crit_mult,PS.getCritMultiplierMax()):undefined;
      spawnFloat("monster",`-${damage} HP${crit?" CRIT!":""}`,crit?"float-text-crit":"float-text-dmg",fontSizeEm);
      
      
      
      
      if(result.weapon_skill){
        const skillResult=PS.registerWeaponHit(result.weapon_skill.weapon_type);
        if(skillResult.leveledUp) combatLog(cb,`Your ${IF.WEAPON_TYPE_LABELS[result.weapon_skill.weapon_type]} proficiency reaches level ${skillResult.newLevel}!`);
      }
    }
    cb.hp=result.monster.hp;
    PS.current_hp=result.player.current_hp;
    syncCombatRoundBuffs(result.player);

    if(result.kill){
      const k=result.kill;
      cb.hp=0;
      
      
      const preKillXpFraction=PS.xp_to_next>0?(PS.xp/PS.xp_to_next):0;
      
      
      
      spawnFloat("xpbar",`+${Math.round(k.xp_gained)} XP`,"float-text-xp");
      spawnFloat("monster",`+${k.gold}g`,"float-text-gold");
      
      
      
      
      
      
      
      const leveled=PS.addXpRaw(k.xp_gained);
      
      
      
      Net.accountGold=(Net.accountGold||0)+k.gold_credited;
      PS.kill_streak=k.kill_streak; PS.max_kill_streak=k.max_kill_streak; PS.total_kills=k.total_kills;
      const lootMsg=applyCombatLoot(k.loot);
      
      
      
      
      
      const bonusLootMsgs=(k.bonus_loot||[]).map(applyCombatLoot).filter(m=>m);
      cb.defeated=true;
      cb.result_text=`${cb.name} defeated! +${Math.round(k.xp_gained)} XP, +${Math.round(k.gold_credited)} gold. ${lootMsg}`;
      if(bonusLootMsgs.length>0) cb.result_text+=` Bonus loot! ${bonusLootMsgs.join(" ")}`;
      if(k.is_guardian){
        
        
        
        
        const maze=GF.overworld_snapshot;
        if(maze){
          const cell=maze.cells[cb.guardianCellIdx];
          if(cell){ cell.cleared=true; }
          if(maze.stronghold && cell && cell.guardianSlot!=null) maze.stronghold.guardianDefeated[cell.guardianSlot]=true;
        }
        if(k.key_drop && k.key_drop.item_id){
          PS.addConsumable(k.key_drop.item_id,1);

          cb.pendingKeyReveal={

        }

    if(result.monster_turn) renderMonsterHit(result.monster_turn);
    
    
    
    if(result.fatal){ endCombatDeath(); return; }
    autosave();
    render();
  }

  async function playerTurn(){
    if(GF.combatResolving) return;
    GF.combatResolving=true; render();
    try{
      const result=await Net.attackCombat(cb.session_id);
      PS._saveSeqFloor=Math.max(PS._saveSeqFloor||0, result._save_seq);
      GF.combatResolving=false;
      applyAttackResult(result);
    }catch(e){
      GF.combatResolving=false;
      setToast("That attack failed to register: "+e.message);
      render();
    }
  }

  
  
  
  
  async function attemptFlee(){
    if(GF.combatResolving) return;
    if(GF.fleeCooldownUntil && Date.now()<GF.fleeCooldownUntil) return;
    GF.fleeCooldownUntil=Date.now()+Balance.FLEE_BUTTON_COOLDOWN_MS;
    setTimeout(()=>{ if(GF.screen==="combat") render(); }, Balance.FLEE_BUTTON_COOLDOWN_MS+50);
    GF.combatResolving=true; render();
    try{
      const result=await Net.fleeCombat(cb.session_id);
      PS._saveSeqFloor=Math.max(PS._saveSeqFloor||0, result._save_seq);
      GF.combatResolving=false;
      
      
      (result.monster_ticks||[]).forEach(renderMonsterHit);
      PS.current_hp=result.player.current_hp;
      syncCombatRoundBuffs(result.player);
      if(result.fatal){ endCombatDeath(); return; }
      if(result.failed){
        combatLog(cb,"You fail to flee!");
        if(result.monster_turn) renderMonsterHit(result.monster_turn);
        autosave();
        render();
        return;
      }
      
      
      
      
      GF.combat=null; resetMazePositionToStart(); PS.resetKillStreak(); PS.saveGame(); setToast("You flee back to camp, but remember your way through these woods."); GF.goto("town");
    }catch(e){
      GF.combatResolving=false;
      setToast("Could not flee: "+e.message);
      render();
    }
  }

  
  
  
  async function useItemInCombat(itemId){
    if(GF.combatResolving || !itemId) return;
    GF.combatResolving=true; render();
    try{
      const item=DL.getItem(itemId);
      const result=await Net.useItemCombat(cb.session_id, itemId);
      PS._saveSeqFloor=Math.max(PS._saveSeqFloor||0, result._save_seq);
      
      
      
      
      (result.monster_ticks||[]).forEach(renderMonsterHit);
      PS.current_hp=result.player.current_hp;
      syncCombatRoundBuffs(result.player);
      if(result.fatal){ GF.combatResolving=false; endCombatDeath(); return; }
      
      
      
      
      
      
      
      
      
      
      
      
      
      const totalTicks=Balance.POTION_HEAL_DURATION_MS/Balance.POTION_HEAL_TICK_MS;
      if((item.heal_amount||0)>0 && PS.current_hp<PS.getMaxHp()){
        PS._queueGradualHeal(PS.active_heals,item.heal_amount,PS.getMaxHp()-PS.current_hp,totalTicks);
      }
      if((item.stamina_amount||0)>0 && PS.current_stamina<PS.getMaxStamina()){
        PS._queueGradualHeal(PS.active_stamina_heals,item.stamina_amount,PS.getMaxStamina()-PS.current_stamina,totalTicks);
      }
      PS.current_stamina=result.player.current_stamina;
      if(item.cures_poison) PS.curePoison();
      PS._removeConsumableOne(itemId);
    }catch(e){
      setToast("Could not use that item: "+e.message);
    }
    GF.combatResolving=false;
    autosave();
    render();

function gearAffixMap(inst){
  const m={};
  for(const a of (inst.affixes||[])) m[a.stat]=(m[a.stat]||0)+a.value;
  return m;
}


function affixDeltaSpan(stat,delta){
  if(!delta) return null;
  const isPercent=IF.affixIsPercent(stat);
  const sign=delta>0?"+":"-";
  const mag=Math.abs(delta);
  const text=(stat==="crit_multiplier") ? (mag/100).toFixed(2) : trimDecimal(mag)+(isPercent?"%":"");
  return h("span",{class:delta>0?"stat-delta-good":"stat-delta-bad"},[` (${sign}${text})`]);
}








function gearComparisonContent(inst){
  const slotsToCompare=inst.slot==="ring"?["ring1","ring2"]:[inst.slot];
  const hoveredMap=gearAffixMap(inst);
  const nodes=[h("div",{class:"compare-title"},["Currently Equipped"])];
  for(const slotKey of slotsToCompare){
    const equipped=PS.equipped[slotKey];
    const label=IF.slotLabel(slotKey);
    if(!equipped){
      nodes.push(h("div",{class:"muted",style:{marginBottom:"4px"}},[`${label}: (nothing equipped)`]));
      continue;
    }
    const equippedMap=gearAffixMap(equipped);
    const statLines=[];
    for(const a of equipped.affixes){
      const delta=(hoveredMap[a.stat]||0)-a.value;
      const deltaNode=affixDeltaSpan(a.stat,delta);
      statLines.push(h("div",{},deltaNode?[IF.formatAffix(a,equipped),deltaNode]:[IF.formatAffix(a,equipped)]));
    }
    
    
    for(const stat in hoveredMap){
      if(!(stat in equippedMap)){
        const deltaNode=affixDeltaSpan(stat,hoveredMap[stat]);
        statLines.push(h("div",{},[`(no ${IF.affixLabel(stat)})`,deltaNode]));
      }
    }
    nodes.push(h("div",{style:{marginBottom:"4px"}},[
      h("div",{style:{fontWeight:"bold"}},[`${label}: ${IF.displayName(equipped)} (${tierRomanNumeral(equipped.tier)})`]),
      ...statLines,
    ]));
  }
  return nodes;
}

function attributeSummaryLines(chain,classData){
  
  
  
  const blockPct=Balance.BLOCK_CHANCE_PER_DEX*100;
  
  
  
  
  const vitHp=Math.round(Balance.vitHpBonus(classData||{},1));
  const vitStam=Math.round(Balance.vitStaminaBonus(classData||{},1));
  const vitLine=`Vitality: +${vitHp} HP and +${vitStam} Stamina per point, applied immediately.`;
  
  
  
  
  
  
  const strArmorPerPoint=Balance.STR_TO_ARMOR_RATIO;
  const strArmorLine=`+${strArmorPerPoint} Armor per point (reduces incoming direct-hit damage).`;
  if(chain==="thornguard"){
    return [
      `Strength: +1 damage per point, and ${strArmorLine}`,
      `Dexterity: +${blockPct}% Block Chance per point, a chance to take 0 damage from a hit.`,
      vitLine,
      "Intelligence: no effect for this path.",
    ];
  }
  if(chain==="windrider"){
    return [
      `Strength: ${strArmorLine}`,
      `Dexterity: +1 damage per point, and +${blockPct}% Block Chance per point, a chance to take 0 damage from a hit.`,
      vitLine,
      "Intelligence: no effect for this path.",
    ];
  }
  if(chain==="wizard"){
    return [
      `Strength: ${strArmorLine}`,
      `Dexterity: +${blockPct}% Block Chance per point, a chance to take 0 damage from a hit.`,
      vitLine,
      `Intelligence: +${Balance.WIZARD_INT_DAMAGE_PER_POINT} damage per point.`,
    ];
  }
  return [];
}

function backpackSwapSlots(idxA,idxB){
  if(idxA===idxB) return;
  const arr=PS.gear_instances;
  const a=arr[idxA];
  if(!a) return;
  if(idxB>=arr.length){
    arr.splice(idxA,1);
    arr.push(a);
  } else {
    const b=arr[idxB];
    arr[idxA]=b; arr[idxB]=a;
  }
  PS.saveGame(); render();
}

function backpackGearGrid(){
  const capacity=PS.getInventoryCapacity();
  const grid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(8,1fr)",gap:"4px",marginBottom:"10px",maxWidth:"360px"}});
  for(let i=0;i<capacity;i++){
    const inst=PS.gear_instances[i];
    const isReorderSrc=GF._bagReorderMode&&GF._bagReorderSrcIdx===i;
    if(!inst){
      grid.appendChild(h("div",{
        class:"tile",
        style:{width:"38px",height:"38px",padding:"0",cursor:GF._bagReorderMode?"pointer":"default"},
        onClick:GF._bagReorderMode?()=>{
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          if(GF._bagReorderSrcIdx!=null){
            const src=GF._bagReorderSrcIdx; GF._bagReorderSrcIdx=null;
            backpackSwapSlots(src,i);
            setToast("Backpack slots auto-compact -- the item moved to the end of your items, not literally onto the empty tile you clicked.");
            render();
          }
        }:null,
      }));
      continue;
    }
    const canEquip=PS.canEquipGear(inst);
    const borderColor=isReorderSrc?"#4ac6ff":(RARITY_BORDER_COLORS[inst.rarity]||"var(--border)");
    const tile=h("div",{
      class:"tile tooltip",
      style:{width:"38px",height:"38px",padding:"0",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",border:`2px solid ${borderColor}`,background:canEquip?undefined:UNEQUIPPABLE_TINT},
      "data-tip":`${IF.tooltipText(inst)}\n${IF.categoryLabel(inst)}`+(canEquip?"":`\n${PS.gearInvalidReason(inst)}`),
      onClick:GF._bagReorderMode?()=>{
        
        
        
        if(GF._bagReorderSrcIdx==null){ GF._bagReorderSrcIdx=i; render(); }
        else if(GF._bagReorderSrcIdx===i){ GF._bagReorderSrcIdx=null; render(); }
        else { const src=GF._bagReorderSrcIdx; GF._bagReorderSrcIdx=null; backpackSwapSlots(src,i); }
      }:()=>{
        if(!canEquip){ setToast(PS.gearInvalidReason(inst)); render(); return; }
        const label=PS.wouldSwap(inst)?"Swap":"Equip";
        
        
        
        
        if(inst.slot==="ring" && label==="Swap"){
          const ring1Name=IF.displayName(PS.equipped.ring1), ring2Name=IF.displayName(PS.equipped.ring2);
          askConfirm(`Swap ${IF.displayName(inst)} in for which ring?\nRing 1: ${ring1Name}\nRing 2: ${ring2Name}`,null,{
            buttons:[
              {label:"Swap Ring 1",onClick:()=>{ PS.equipGear(inst.instance_id,"ring1"); autosave(); render(); }},
              {label:"Swap Ring 2",onClick:()=>{ PS.equipGear(inst.instance_id,"ring2"); autosave(); render(); }},
            ],
          });
          return;
        }
        askConfirm(`${label} ${IF.displayName(inst)}?`,()=>{ PS.equipGear(inst.instance_id); autosave(); render(); },{confirmLabel:label,danger:false});
      },
    },[gearIcon(inst,26)]);
    
    
    grid.appendChild(gearCompareWrap(tile, inst));
  }
  return grid;
}

async function rerollBlacksmithItem(instanceId){
  if(GF.rerolling||GF.reforging||GF.refining) return;

    const idx=PS.findGearIndex(instanceId);
    if(idx!==-1) PS.gear_instances[idx]=result.item;

    setToast("Could not reroll: "+e.message);

  GF.rerolling=null; render();
}

function salvageAllGearOfRarity(rarityName, busy){
  if(busy) return;
  const displayName=Balance.rarityDisplayName(rarityName);
  const matches=PS.gear_instances.filter((inst)=>inst.rarity===rarityName);
  if(matches.length===0){ setToast(`No ${displayName} items in your backpack to salvage.`); render(); return; }
  
  
  const label=`Salvage all ${matches.length} ${displayName} item${matches.length===1?"":"s"}`;
  askConfirm(
    `Salvage all ${matches.length} ${displayName} item${matches.length===1?"":"s"} in your backpack? This cannot be undone.`,
    ()=>{
      const ids=matches.map((inst)=>inst.instance_id);
      let totalMat=0;
      for(const id of ids){
        const idx=PS.findGearIndex(id); if(idx===-1) continue;
        const inst=PS.gear_instances[idx];
        totalMat+=Balance.salvageValue(inst.tier, IF.slotCount(inst));
        PS.salvageGear(id);
      }
      autosave();
      setToast(`Salvaged ${ids.length} ${displayName} item${ids.length===1?"":"s"} for +${totalMat} materials.`);
      
      
      
      
      
      
      GF._salvageFadeRarity=rarityName;
      GF._salvageFadeLabel=label;
      render();
      setTimeout(()=>{
        if(GF._salvageFadeRarity===rarityName){ GF._salvageFadeRarity=null; GF._salvageFadeLabel=null; render(); }
      },550);
    },
    {confirmLabel:"Salvage All",danger:true}
  );
}

function maxAffordableRecipeQty(recipe){
  let max=99;
  for(const h2 in recipe.herbs){ const have=PS.herbs[h2]||0; max=Math.min(max, Math.floor(have/recipe.herbs[h2])); }
  if(recipe.gold_cost>0) max=Math.min(max, Math.floor(PS.gold/recipe.gold_cost));
  return Math.max(1,max);
}

function vaultFindEmptySlot(){
  const items=Net.vaultCache||[];
  const capacity=Net.vaultCapacity||200;
  const used=new Set(items.map(i=>i.slot));
  for(let i=0;i<capacity;i++) if(!used.has(i)) return i;
  return -1;
}











function vaultSync(restoreFn){
  Net.saveVault(Net.vaultCache||[]).catch(e=>{
    if(e && e.conflict){
      Net.vaultCache=e.items; Net.vaultCapacity=e.capacity; Net.vaultVersion=e.version;
      if(restoreFn) restoreFn();
      setToast("The vault changed elsewhere (maybe another of your characters) since you last looked here -- refreshed to its current contents. Please try again.");
    } else {
      setToast("Could not sync the vault with the server: "+e.message);
    }
    PS.saveGame(); render();
  });
}
function vaultDepositGear(instanceId){
  const slot=vaultFindEmptySlot();
  if(slot===-1){ setToast("The vault is full."); return; }
  const idx=PS.findGearIndex(instanceId);
  if(idx===-1) return;
  const inst=PS.gear_instances[idx];
  PS.gear_instances.splice(idx,1);
  Net.vaultCache.push({slot,kind:"gear",inst});
  PS.saveGame(); vaultSync(()=>{ PS.addGear(inst); }); render();
}
function vaultDepositConsumable(itemId){
  const qty=PS.consumables[itemId]||0; if(qty<=0) return;
  const existing=(Net.vaultCache||[]).find(e=>e.kind==="consumable"&&e.item_id===itemId);
  if(existing){ existing.qty+=qty; }
  else {
    const slot=vaultFindEmptySlot();
    if(slot===-1){ setToast("The vault is full."); return; }
    Net.vaultCache.push({slot,kind:"consumable",item_id:itemId,qty});
  }
  delete PS.consumables[itemId];
  PS.saveGame(); vaultSync(()=>{ PS.addConsumable(itemId,qty); }); render();
}
function vaultDepositHerb(herbId){
  const qty=PS.herbs[herbId]||0; if(qty<=0) return;
  const existing=(Net.vaultCache||[]).find(e=>e.kind==="herb"&&e.herb_id===herbId);
  if(existing){ existing.qty+=qty; }
  else {
    const slot=vaultFindEmptySlot();
    if(slot===-1){ setToast("The vault is full."); return; }
    Net.vaultCache.push({slot,kind:"herb",herb_id:herbId,qty});
  }
  delete PS.herbs[herbId];
  PS.saveGame(); vaultSync(()=>{ PS.addHerb(herbId,qty); }); render();
}
function vaultWithdraw(slotIndex){
  const idx=(Net.vaultCache||[]).findIndex(e=>e.slot===slotIndex);
  if(idx===-1) return;
  const entry=Net.vaultCache[idx];
  let restoreFn=null;
  if(entry.kind==="gear"){
    if(!PS.addGear(entry.inst)){ setToast("Your backpack is full."); return; }
    
    
    restoreFn=()=>{ const i=PS.findGearIndex(entry.inst.instance_id); if(i!==-1) PS.gear_instances.splice(i,1); };
  } else if(entry.kind==="consumable"){
    PS.addConsumable(entry.item_id,entry.qty);
    restoreFn=()=>{ PS.consumables[entry.item_id]=Math.max(0,(PS.consumables[entry.item_id]||0)-entry.qty); if(PS.consumables[entry.item_id]<=0) delete PS.consumables[entry.item_id]; };
  } else if(entry.kind==="herb"){
    PS.addHerb(entry.herb_id,entry.qty);
    restoreFn=()=>{ PS.herbs[entry.herb_id]=Math.max(0,(PS.herbs[entry.herb_id]||0)-entry.qty); if(PS.herbs[entry.herb_id]<=0) delete PS.herbs[entry.herb_id]; };
  }
  Net.vaultCache.splice(idx,1);
  PS.saveGame(); vaultSync(restoreFn); render();
}






function vaultWithdrawPartial(slotIndex,qty){
  const idx=(Net.vaultCache||[]).findIndex(e=>e.slot===slotIndex);
  if(idx===-1) return;
  const entry=Net.vaultCache[idx];
  if(entry.kind!=="consumable"&&entry.kind!=="herb") return;
  qty=Math.floor(qty);
  if(!qty||qty<=0||qty>=entry.qty) return;
  entry.qty-=qty;
  let restoreFn=null;
  if(entry.kind==="consumable"){
    PS.addConsumable(entry.item_id,qty);
    restoreFn=()=>{ entry.qty+=qty; PS.consumables[entry.item_id]=Math.max(0,(PS.consumables[entry.item_id]||0)-qty); if(PS.consumables[entry.item_id]<=0) delete PS.consumables[entry.item_id]; };
  } else {
    PS.addHerb(entry.herb_id,qty);
    restoreFn=()=>{ entry.qty+=qty; PS.herbs[entry.herb_id]=Math.max(0,(PS.herbs[entry.herb_id]||0)-qty); if(PS.herbs[entry.herb_id]<=0) delete PS.herbs[entry.herb_id]; };
  }
  PS.saveGame(); vaultSync(restoreFn); render();
}





function vaultSwapSlots(slotA,slotB){
  if(slotA===slotB) return;
  const items=Net.vaultCache||[];
  const entryA=items.find(e=>e.slot===slotA), entryB=items.find(e=>e.slot===slotB);
  if(!entryA && !entryB) return;
  if(entryA) entryA.slot=slotB;
  if(entryB) entryB.slot=slotA;
  vaultSync(()=>{ if(entryA) entryA.slot=slotA; if(entryB) entryB.slot=slotB; });
  render();
}







function vaultSortByTier(){
  const items=Net.vaultCache||[];
  const gear=items.filter(e=>e.kind==="gear").slice().sort((a,b)=>a.inst.tier-b.inst.tier);
  const nonGear=items.filter(e=>e.kind!=="gear").slice().sort((a,b)=>a.slot-b.slot);
  if(GF._vaultSortTierDesc) gear.reverse();
  let nextSlot=0;
  for(const e of gear) e.slot=nextSlot++;
  for(const e of nonGear) e.slot=nextSlot++;
  GF._vaultSortTierDesc=!GF._vaultSortTierDesc;
  PS.saveGame(); vaultSync(); render();
}



function backpackSortByTier(){
  PS.gear_instances.sort((a,b)=>a.tier-b.tier);
  if(GF._bagSortTierDesc) PS.gear_instances.reverse();
  GF._bagSortTierDesc=!GF._bagSortTierDesc;
  PS.saveGame(); render();
}












const GEAR_FILTER_SLOT_LABELS={weapon:"Weapon",head:"Head",shoulders:"Shoulders",armor:"Armor",pants:"Pants",gloves:"Gloves",boots:"Boots",ring:"Ring",amulet:"Amulet",belt:"Belt"};

function gearMatchesFilter(inst, filter){
  if(!inst) return false; 
  if(filter.tier && inst.tier!==filter.tier) return false;
  if(filter.slot && inst.slot!==filter.slot) return false;
  if(filter.stats && filter.stats.length){
    const instStats=new Set((inst.affixes||[]).map(a=>a.stat));
    for(const s of filter.stats) if(!instStats.has(s)) return false;
  }
  return true;
}
function gearFilterActive(filter){ return !!(filter.tier || filter.slot || (filter.stats&&filter.stats.length>0)); }



function gearFilterOpacity(inst, filter){
  
  
  
  
  
  if(!gearFilterActive(filter)) return 1;
  return gearMatchesFilter(inst,filter) ? 1 : 0.25;
}

        if(isSplittable){ GF._vaultSplitSlot=i; render(); }
        else { askConfirm(`Withdraw ${label} back to your backpack?`,()=>vaultWithdraw(i),{confirmLabel:"Withdraw",danger:false}); }
      };
    }
    
    
    const filterOpacity=gearFilterOpacity(entry&&entry.kind==="gear"?entry.inst:null, GF._vaultFilter);
    
    
    const vaultUnequippable=entry&&entry.kind==="gear"&&!PS.canEquipGear(entry.inst);
    const vaultTile=h("div",{
      class:"tile"+(entry?" tooltip":"")+(entry&&entry.kind==="gear"?" rarity-"+entry.inst.rarity:""),
      style:{width:"32px",height:"32px",padding:"0",display:"flex",alignItems:"center",justifyContent:"center",cursor:(entry||GF._vaultReorderMode)?"pointer":"default",
        border:isReorderSrc?"2px solid #4ac6ff":undefined, boxSizing:"border-box", opacity:String(filterOpacity), background:vaultUnequippable?UNEQUIPPABLE_TINT:undefined},
      "data-tip":tip||undefined,
      onClick:onClickFn,
    },[icon]);
    
    
    grid.appendChild(entry&&entry.kind==="gear"?gearCompareWrap(vaultTile,entry.inst):vaultTile);
  }
  root.appendChild(grid);

  
  
  if(GF._vaultSplitSlot!=null){
    const entry=(Net.vaultCache||[]).find(e=>e.slot===GF._vaultSplitSlot);
    if(!entry || (entry.kind!=="consumable"&&entry.kind!=="herb")){ GF._vaultSplitSlot=null; }
    else {
      const name=entry.kind==="consumable"?DL.getItem(entry.item_id).name:DL.getHerb(entry.herb_id).name;
      const qtyInput=h("input",{type:"number",min:"1",max:String(entry.qty-1),value:String(Math.min(entry.qty-1,10)),style:{width:"70px"}});
      root.appendChild(h("div",{class:"panel",style:{marginBottom:"14px"}},[
        h("div",{style:{marginBottom:"6px"}},[`Withdraw how many of ${name} (have ${entry.qty} stashed)? You can also just withdraw the whole stack from the grid above.`]),
        h("div",{class:"row gap",style:{alignItems:"center"}},[
          qtyInput,
          h("button",{onClick:()=>{
            const qty=parseInt(qtyInput.value,10);
            if(!qty||qty<=0||qty>=entry.qty){ setToast(`Enter a quantity between 1 and ${entry.qty-1} (use the grid above to withdraw the entire stack).`); render(); return; }
            GF._vaultSplitSlot=null;
            vaultWithdrawPartial(entry.slot,qty);
          }},["Withdraw"]),
          h("button",{onClick:()=>{ GF._vaultSplitSlot=null; render(); }},["Cancel"]),
          h("button",{onClick:()=>{ GF._vaultSplitSlot=null; askConfirm(`Withdraw all ${entry.qty} ${name} back to your backpack?`,()=>vaultWithdraw(entry.slot),{confirmLabel:"Withdraw All",danger:false}); }},["Withdraw All"]),
        ]),
      ]));
    }
  }

  root.appendChild(h("h3",{},["Deposit from Backpack"]));
  if(PS.gear_instances.length===0) root.appendChild(h("div",{class:"muted"},["Nothing in your backpack to store."]));
  for(const inst of [...PS.gear_instances]){
    root.appendChild(gearRow(inst,[h("button",{onClick:()=>vaultDepositGear(inst.instance_id)},["Store"])]));
  }

  root.appendChild(h("h3",{},["Deposit Consumables"]));
  const consEntries=Object.keys(PS.consumables).filter(k=>PS.consumables[k]>0);
  if(consEntries.length===0) root.appendChild(h("div",{class:"muted"},["None."]));
  for(const itemId of consEntries){
    
    
    root.appendChild(h("div",{class:"row gap",style:{marginBottom:"4px",alignItems:"center",justifyContent:"space-between"}},[
      h("div",{class:"row gap",style:{alignItems:"center"}},[itemIcon(itemId,22), h("span",{class:"tooltip","data-tip":DL.itemEffectDescription(itemId)},[`${DL.getItem(itemId).name} x${PS.consumables[itemId]}`])]),
      h("button",{onClick:()=>vaultDepositConsumable(itemId)},["Store"]),
    ]));
  }

  root.appendChild(h("h3",{},["Deposit Herbs"]));
  const herbEntries=Object.keys(PS.herbs).filter(k=>PS.herbs[k]>0);
  if(herbEntries.length===0) root.appendChild(h("div",{class:"muted"},["None."]));
  for(const herbId of herbEntries){
    
    root.appendChild(h("div",{class:"row gap",style:{marginBottom:"4px",alignItems:"center",justifyContent:"space-between"}},[
      h("div",{class:"row gap",style:{alignItems:"center"}},[herbIcon(herbId,22), h("span",{class:"tooltip","data-tip":DL.getHerb(herbId).found_in||""},[`${DL.getHerb(herbId).name} x${PS.herbs[herbId]}`])]),
      h("button",{onClick:()=>vaultDepositHerb(herbId)},["Store"]),
    ]));
  }

  return root;
}






function generateMerchantStock(){
  const stock=[];
  for(let i=0;i<Balance.MERCHANT_STOCK_SIZE;i++){
    stock.push(IF.generate(randIntRange(1,Balance.ITEM_TIER_MAX)));
  }
  return stock;
}







function ensureMerchantStock(){
  if(!GF.merchantStock || GF._merchantStockSlot!==PS.current_slot || GF._merchantStockAttempts!==PS.trial_attempts_count){
    GF.merchantStock=generateMerchantStock();
    GF._merchantStockSlot=PS.current_slot;
    GF._merchantStockAttempts=PS.trial_attempts_count;
  }
  return GF.merchantStock;
}



function merchantTabButton(key,label){

function merchantAmountPicker(itemId,maxQty){
  if(!GF.merchantBuyQty) GF.merchantBuyQty={};
  const qty=clampi(GF.merchantBuyQty[itemId]||1,1,Math.max(1,maxQty));
  GF.merchantBuyQty[itemId]=qty;
  return h("div",{class:"row",style:{alignItems:"center",gap:"6px"}},[
    h("button",{style:{padding:"2px 9px"},disabled:qty<=1,onClick:(e)=>{ e.stopPropagation(); GF.merchantBuyQty[itemId]=Math.max(1,qty-1); render(); }},["-"]),
    h("span",{style:{fontWeight:"bold",minWidth:"18px",textAlign:"center"}},[String(qty)]),
    h("button",{style:{padding:"2px 9px"},disabled:qty>=maxQty,onClick:(e)=>{ e.stopPropagation(); GF.merchantBuyQty[itemId]=Math.min(maxQty,qty+1); render(); }},["+"]),
  ]);
}





function merchantConsumablesTab(){
  const root=h("div",{});
  for(const itemId in ITEMS){
    const item=ITEMS[itemId];
    if(item.type==="bag" || Balance.MERCHANT_EXCLUDED_ITEMS.includes(itemId)) continue;
    const unitPrice=Balance.itemBuyPrice(item);
    
    
    
    
    
    
    const maxAffordable=unitPrice>0?Math.max(1,Math.floor(PS.gold/unitPrice)):99;
    const qty=Math.min(GF.merchantBuyQty&&GF.merchantBuyQty[itemId]||1,Math.max(1,maxAffordable));
    const totalPrice=unitPrice*qty;
    root.appendChild(h("div",{class:"tile gear-row",style:{marginBottom:"6px"}},[
      itemIcon(itemId),
      h("div",{class:"col",style:{flex:"1",minWidth:"0",gap:"2px"}},[
        h("div",{style:{fontWeight:"bold"}},[item.name]),
        h("div",{class:"muted",style:{fontSize:".85em"}},[DL.itemShopSubtext(itemId)]),
      ]),
      merchantAmountPicker(itemId,Math.max(1,maxAffordable)),
      
      h("div",{class:"gold-text",style:{fontWeight:"bold",minWidth:"64px",textAlign:"right"}},[`${totalPrice}g`]),
      
      
      
      
      
      
      
      h("button",{disabled:PS.gold<totalPrice,onClick:()=>{
        if(PS.buyConsumable(itemId,qty)){ autosave(); }
        render();
      }},["Buy"]),
    ]));
  }
  return root;
}





function merchantGearTab(){
  const root=h("div",{});
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px",fontSize:".9em"}},["Six items, freshly rolled. This stock won't change until you've attempted a Broken Bridge Trial (win or lose)."]));
  const stock=ensureMerchantStock();
  if(stock.length===0){
    root.appendChild(h("div",{class:"muted",style:{marginBottom:"12px"}},["Sold out for now -- come back after your next Broken Bridge Trial attempt."]));
    return root;
  }
  for(const inst of stock){
    const price=Balance.merchantGearPrice(inst);
    root.appendChild(gearRow(inst,[h("button",{disabled:PS.gold<price,onClick:()=>{
      PS.gold-=price;
      const willAutoEquip=PS.canAutoEquip(inst);
      const fit=PS.addGearAutoEquip(inst);
      if(!fit){ PS.gold+=price; setToast("Your bags are full -- make room and try again."); render(); return; }
      const idx=GF.merchantStock.indexOf(inst); if(idx!==-1) GF.merchantStock.splice(idx,1);
      autosave();
      setToast(willAutoEquip?`Bought and equipped ${IF.displayName(inst)}!`:`Bought ${IF.displayName(inst)}.`);
      render();
    }},[`Buy (${price}g)`])]));
  }
  return root;
}

function screenAuctionHouse(){
  const root=h("div",{});
  root.appendChild(h("h2",{},["Auction House"]));
  root.appendChild(h("div",{class:"lore"},["A dusty ledger and an idle gavel. List your own finds, or see what other travelers are selling."]));
  
  root.appendChild(h("button",{style:{marginBottom:"8px"},onClick:()=>GF.goto("town")},["← Back to Town"]));
  const t=toastBox(); if(t) root.appendChild(t);
  root.appendChild(statHeader());

  if(!Net.online){
    root.appendChild(h("div",{class:"muted"},["Log in online to buy and sell with other travelers."]));
    return root;
  }

  root.appendChild(h("h3",{},["List an Item"]));
  
  
  
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px",fontSize:".9em"}},["Listing fee: 1% of your asking price (minimum 1g) -- charged upfront when you list."]));
  const gearOptions=[h("option",{value:""},["-- choose gear to sell --"])].concat(
    PS.gear_instances.map(inst=>h("option",{value:inst.instance_id,selected:GF._auctionSellPreviewId===inst.instance_id},[`${IF.displayName(inst)} (${tierRomanNumeral(inst.tier)})`]))
  );
  
  
  
  
  
  const gearSelect=h("select",{onChange:(e)=>{ GF._auctionSellPreviewId=e.target?e.target.value:gearSelect.value; render(); }},gearOptions);
  const gearPriceInput=h("input",{type:"number",min:"1",value:"10",style:{width:"90px"}});
  root.appendChild(h("div",{class:"row gap",style:{marginBottom:"10px"}},[
    gearSelect, h("span",{},["Price:"]), gearPriceInput,
    h("button",{onClick:async ()=>{
      const instId=gearSelect.value;
      if(!instId){ setToast("Choose a gear item first."); render(); return; }
      const price=parseInt(gearPriceInput.value,10);
      if(!price||price<1){ setToast("Enter a valid price."); render(); return; }
      const fee=Balance.auctionListingFee(price);
      
      
      
      if(PS.gold<fee){ askConfirm(`Not enough gold for the ${fee}g listing fee.`,null,{cancelLabel:"OK",buttons:[]}); return; }
      const idx=PS.findGearIndex(instId); if(idx===-1) return;
      const inst=PS.gear_instances[idx];
      try{
        const result=await Net.createAuctionListing({type:"gear", price, character_name:PS.character_name, seller_slot:PS.current_slot, item:inst, display_name:IF.displayName(inst)});
        PS.gear_instances.splice(idx,1);
        
        
        
        
        
        if(typeof result.account_gold==="number") Net.setAuthoritativeGold(result.account_gold); else PS.gold-=(result.fee||fee);
        PS.saveGame();
        Net.auctionCache=null; setToast(`Listed ${IF.displayName(inst)} for ${price} gold (${result.fee||fee}g listing fee charged).`);
      }catch(e){ setToast(e.message); }
      render();
    }},["List Gear"]),
  ]));
  
  
  if(GF._auctionSellPreviewId){
    const previewInst=PS.gear_instances.find(g=>g.instance_id===GF._auctionSellPreviewId);
    if(previewInst) root.appendChild(gearRow(previewInst,[]));
  }

  const stackables=[];
  for(const id of Object.keys(PS.consumables)) if(PS.consumables[id]>0) stackables.push({kind:"consumable", id, name:DL.getItem(id).name, have:PS.consumables[id]});
  for(const id of Object.keys(PS.herbs)) if(PS.herbs[id]>0) stackables.push({kind:"herb", id, name:DL.getHerb(id).name, have:PS.herbs[id]});
  const stackOptions=[h("option",{value:""},["-- choose consumable/herb to sell --"])].concat(
    stackables.map(s=>h("option",{value:s.kind+":"+s.id},[`${s.name} (have ${s.have})`]))
  );
  const stackSelect=h("select",{},stackOptions);
  const stackQtyInput=h("input",{type:"number",min:"1",value:"1",style:{width:"70px"}});
  const stackPriceInput=h("input",{type:"number",min:"1",value:"5",style:{width:"90px"}});
  root.appendChild(h("div",{class:"row gap",style:{marginBottom:"14px"}},[
    stackSelect, h("span",{},["Qty:"]), stackQtyInput, h("span",{},["Price (total):"]), stackPriceInput,
    h("button",{onClick:async ()=>{
      const val=stackSelect.value; if(!val){ setToast("Choose an item first."); render(); return; }
      const [kind,id]=val.split(":");
      const qty=parseInt(stackQtyInput.value,10), price=parseInt(stackPriceInput.value,10);
      const have=(kind==="consumable"?PS.consumables[id]:PS.herbs[id])||0;
      if(!qty||qty<1||qty>have){ setToast("Enter a valid quantity you actually have."); render(); return; }
      if(!price||price<1){ setToast("Enter a valid price."); render(); return; }
      const fee=Balance.auctionListingFee(price);
      
      if(PS.gold<fee){ askConfirm(`Not enough gold for the ${fee}g listing fee.`,null,{cancelLabel:"OK",buttons:[]}); return; }
      const displayName=kind==="consumable"?DL.getItem(id).name:DL.getHerb(id).name;
      try{
        const result=await Net.createAuctionListing({type:kind, item_key:id, quantity:qty, price, character_name:PS.character_name, seller_slot:PS.current_slot, display_name:displayName});
        if(kind==="consumable") PS.consumables[id]-=qty; else PS.herbs[id]-=qty;
        
        if(typeof result.account_gold==="number") Net.setAuthoritativeGold(result.account_gold); else PS.gold-=(result.fee||fee);
        PS.saveGame(); Net.auctionCache=null;
        setToast(`Listed ${displayName} x${qty} for ${price} gold (${result.fee||fee}g listing fee charged).`);
      }catch(e){ setToast(e.message); }
      render();
    }},["List"]),
  ]));

  root.appendChild(h("h3",{},["Current Listings"]));
  
  
  if(!GF._ahFilter) GF._ahFilter={tier:"",slot:"",stats:[]};
  root.appendChild(gearFilterPanel(GF._ahFilter, render));
  
  
  
  if(!GF._ahSort) GF._ahSort="newest";
  root.appendChild(h("div",{class:"row gap",style:{alignItems:"center",marginBottom:"10px"}},[
    h("span",{class:"muted"},["Sort by:"]),
    h("select",{value:GF._ahSort,onChange:(e)=>{ GF._ahSort=(e.target?e.target.value:e.currentTarget.value); render(); }},[
      h("option",{value:"newest",selected:GF._ahSort==="newest"},["Newest first"]),
      h("option",{value:"price_asc",selected:GF._ahSort==="price_asc"},["Price: Low to High"]),
      h("option",{value:"price_desc",selected:GF._ahSort==="price_desc"},["Price: High to Low"]),
    ]),
  ]));
  if(Net.auctionCache===null||Net.auctionCache===undefined){
    root.appendChild(h("div",{class:"muted"},["Loading..."]));
    Net.fetchAuction().then(render).catch(()=>{ setToast("Could not load the auction house."); render(); });
  } else if(Net.auctionCache.length===0){
    root.appendChild(h("div",{class:"muted"},["The block is empty right now, be the first to list something."]));
  } else {
    
    
    
    
    
    
    
    const visibleListings=Net.auctionCache.filter(listing=>{
      const isGear=listing.type==="gear" && listing.item;
      return !gearFilterActive(GF._ahFilter) || gearMatchesFilter(isGear?listing.item:null, GF._ahFilter);
    });
    
    
    
    if(GF._ahSort==="price_asc") visibleListings.sort((a,b)=>a.price-b.price);
    else if(GF._ahSort==="price_desc") visibleListings.sort((a,b)=>b.price-a.price);
    if(visibleListings.length===0){
      root.appendChild(h("div",{class:"muted"},["No listings match your filters."]));
    }
    for(const listing of visibleListings){
      const isMine=listing.seller_username===Net.username;
      const label=listing.quantity>1?`${listing.display_name} x${listing.quantity}`:listing.display_name;
      
      
      const isGear=listing.type==="gear" && listing.item;
      
      
      const labelEl=isGear
        ? gearCompareWrap(h("span",{class:"tooltip rarity-"+listing.item.rarity,style:{fontWeight:"bold"},"data-tip":IF.tooltipText(listing.item)},[label]), listing.item)
        : h("span",{style:{fontWeight:"bold"}},[label]);
      
      
      
      const categoryLabel=isGear?IF.categoryLabel(listing.item):(listing.type==="herb"?"Herb":DL.itemCategoryLabel(listing.item_key));
      
      
      
      
      const listingIcon=isGear?gearIcon(listing.item,26):(listing.type==="herb"?herbIcon(listing.item_key,24):itemIcon(listing.item_key,24));
      root.appendChild(h("div",{class:"tile row",style:{marginBottom:"6px",justifyContent:"space-between",alignItems:"center"}},[
        h("div",{class:"row gap",style:{alignItems:"center"}},[listingIcon, h("div",{},[labelEl, categoryLabel?h("span",{class:"muted",style:{fontSize:".85em"}},[` (${categoryLabel})`]):null, h("span",{class:"muted"},[`, listed by ${listing.seller_character_name} (${listing.seller_username})`])])]),
        h("div",{class:"row gap"},[
          h("span",{class:"gold-text"},[`${listing.price}g`]),
          isMine?h("button",{class:"danger",onClick:async ()=>{
            try{
              const r=await Net.cancelAuctionListing(listing.id,{character_name:PS.character_name});
              if(r.refund){
                if(r.refund.type==="gear" && r.refund.item) PS.addGear(r.refund.item);
                else if(r.refund.type==="consumable") PS.addConsumable(r.refund.item_key,r.refund.quantity);
                else if(r.refund.type==="herb") PS.addHerb(r.refund.item_key,r.refund.quantity);
                PS.saveGame();
              }
              setToast("Listing cancelled, item returned to your bags.");
            }
            catch(e){ setToast(e.message+" (refreshing listings...)"); }
            Net.auctionCache=null;
            await Net.fetchAuction();
            render();
          }},["Cancel"]):h("button",{disabled:PS.gold<listing.price,onClick:async ()=>{
            try{
              const buyResult=await Net.buyAuctionListing(listing.id,{character_name:PS.character_name, buyer_slot:PS.current_slot});
              
              if(typeof buyResult.account_gold==="number") Net.setAuthoritativeGold(buyResult.account_gold); else PS.gold-=listing.price;
              
              if(listing.type==="gear") PS.addGearAutoEquip(listing.item);
              else if(listing.type==="consumable") PS.addConsumable(listing.item_key,listing.quantity);
              else if(listing.type==="herb") PS.addHerb(listing.item_key,listing.quantity);
              PS.saveGame();
              setToast(`Bought ${label} for ${listing.price} gold.`);
            }catch(e){ setToast(e.message+" (refreshing listings...)"); }
            Net.auctionCache=null;
            await Net.fetchAuction();
            render();
          }},["Buy"]),
        ]),
      ]));
    }
  }

  return root;
}

        h("div",{style:{marginBottom:"8px"}},["The goblin rummages through his sack..."]),

      ]));
      
      
      
      
      
      
      
      
      
      if(!GF.gambleReveal.timerStarted){
        GF.gambleReveal.timerStarted=true;
        GF.gambleInterval=setInterval(()=>{
          if(!GF.gambleReveal){ clearInterval(GF.gambleInterval); GF.gambleInterval=null; return; }
          if(Date.now()-GF.gambleReveal.startedAt>=Balance.GAMBLE_REVEAL_MS){
            clearInterval(GF.gambleInterval); GF.gambleInterval=null;
            render();
          } else if(!refreshGambleBarInPlace()){
            render(); 
          }
        },100);
      }
    } else {
      if(!GF.gambleReveal.granted){
        GF.gambleReveal.granted=true;
        if(!PS.addGearAutoEquip(GF.gambleReveal.item)) setToast("Your backpack is full, the item slips from your hands and is lost!");
        autosave();
      }
      const inst=GF.gambleReveal.item;
      root.appendChild(h("div",{class:"panel"},[
        gearIcon(inst,40),
        h("div",{class:"tooltip rarity-"+inst.rarity,style:{fontWeight:"bold",marginTop:"6px"}},[IF.displayName(inst)+` (${tierRomanNumeral(inst.tier)})`]),
        h("div",{class:"muted",style:{fontSize:".85em"}},[IF.categoryLabel(inst)]),
        h("div",{class:"muted"},[IF.affixSummary(inst)]),
      ]));
      root.appendChild(h("div",{class:"row",style:{marginTop:"10px"}},[
        h("button",{disabled:PS.gold<Balance.GAMBLE_ITEM_COST||!PS.hasInventorySpace(),onClick:()=>{ GF.gambleReveal=null; startGambleRoll(); }},[`Gamble Again (${Balance.GAMBLE_ITEM_COST}g)`]),
      ]));
    }
  } else {
    
    
    
    
    
    const noRoom=!PS.hasInventorySpace();
    root.appendChild(h("div",{class:"row gap",style:{alignItems:"center",marginBottom:"10px"}},[
      h("button",{disabled:PS.gold<Balance.GAMBLE_ITEM_COST||noRoom,title:noRoom?"Your backpack is full -- make room before gambling for a new item.":undefined,onClick:startGambleRoll},[`Pay ${Balance.GAMBLE_ITEM_COST} Gold`]),
      h("span",{class:"muted"},[`You have ${PS.gold} gold.`]),
    ]));
    if(noRoom) root.appendChild(h("div",{class:"muted",style:{marginTop:"4px"}},["Your backpack is full -- make room before gambling for a new item."]));
  }

  return root;
}

function startGambleRoll(){
  if(PS.gold<Balance.GAMBLE_ITEM_COST) return;
  
  
  
  if(!PS.hasInventorySpace()){ setToast("Your backpack is full -- make room before gambling for a new item."); render(); return; }
  PS.gold-=Balance.GAMBLE_ITEM_COST;
  const tier=Balance.rollItemTier(PS.level);
  const item=IF.generate(tier);
  GF.gambleReveal={startedAt:Date.now(), item, timerStarted:false, granted:false};
  autosave();
  render();
}




function getTrialProgress(){
  if(!PS.trial_progress) PS.trial_progress={};
  if(!PS.trial_progress[PS.class_id]) PS.trial_progress[PS.class_id]={stage:0,discoveredSides:[],stepFailedPlanks:{}};
  const p=PS.trial_progress[PS.class_id];
  if(!p.discoveredSides) p.discoveredSides=[];
  
  
  
  
  
  
  if(!p.stepFailedPlanks) p.stepFailedPlanks={};
  return p;
}

function screenMasterTrial(){
  const root=h("div",{});
  const c=PS.getClassData();
  const nextId=DL.getNextClassId(PS.class_id);
  const currentTier=c.tier||1;
  root.appendChild(h("h2",{},["Broken Bridge Trial"]));
  if(!nextId){
    root.appendChild(h("div",{class:"lore"},[`${c.display_name} is the final form of your path. The elders have no further plank bridge to offer, whatever comes next for a champion of the season is still being prepared. Not yet implemented, check back in a future update.`]));
    root.appendChild(h("button",{onClick:()=>GF.goto("town")},["← Back to Town"]));
    return root;
  }
  const levelReq=Balance.trialLevelRequirement(currentTier);
  
  
  
  if(!PS.canAttemptTrial() && !GF.trialJustFailed){
    root.appendChild(h("div",{class:"lore"},[`You must reach Level ${levelReq} as a ${c.display_name} before the elders will test you.`]));
    root.appendChild(h("button",{onClick:()=>GF.goto("town")},["← Back to Town"]));
    return root;
  }
  const t=toastBox(); if(t) root.appendChild(t);
  const plankCount=Balance.bridgePlankCount(currentTier);
  root.appendChild(h("div",{class:"lore"},[`Cross the ancient plank bridge to prove yourself worthy of becoming a ${DL.getClass(nextId).display_name}. Each step hides ${plankCount} planks, only one holds. Fall, and the attempt ends there, but the bridge remembers every safe step you've already found.`]));

  const rows=Balance.BRIDGE_ROWS;
  const stepChance=Balance.bridgeStepPassChance(currentTier);
  const progress=getTrialProgress();
  const failed=!!GF.trialJustFailed;

  root.appendChild(h("div",{class:"panel",style:{marginBottom:"10px"}},[
    h("div",{class:"flavor",style:{margin:"0"}},["Tread carefully, a wrong step is a costly investment."]),
  ]));

  
  
  
  
  
  
  
  root.appendChild(h("div",{class:"panel",style:{marginBottom:"10px",borderColor:PS.hardcore?"#5ac67a":"var(--border)"}},[
    h("div",{style:{color:"#5ac67a",fontWeight:"bold",marginBottom:PS.hardcore?"4px":"0"}},["✔ This trial cannot kill your character."]),
    PS.hardcore?h("div",{class:"muted",style:{fontSize:".9em"}},["Even in Hardcore mode, falling from the bridge only resets you to Level 1 at this tier -- it does not send you to the Graveyard."]):null,
  ]));

  
  
  
  
  const failStreak=PS.bridge_fail_streak||0;
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"10px"}},[
    `A new attempt at this tier starts with ${Balance.STARTING_STAT_POINTS} unspent stat points. Every failed attempt permanently adds +1 more (currently +${failStreak}, for ${Balance.STARTING_STAT_POINTS+failStreak} total) until you successfully cross.`,
  ]));

  
  
  
  
  
  
  
  
  
  async function attemptStep(plankIndex){
    if(failed || GF.trialResolving) return;
    const stepIdx=progress.discoveredSides.length;
    const failedHere=progress.stepFailedPlanks[stepIdx]||[];
    if(failedHere.includes(plankIndex)) return; 
    GF.trialResolving=true; render();
    let result;
    try{
      result=await Net.attemptTrialStep(PS.current_slot, plankIndex);
    }catch(e){
      GF.trialResolving=false;
      setToast(e.message||"The trial attempt could not be resolved. Please try again.");
      render();
      return;
    }
    GF.trialResolving=false;

    
    
    
    
    
    
    if(result._save_seq) PS._saveSeqFloor=Math.max(PS._saveSeqFloor||0, result._save_seq);

    if(result.outcome==="passed_step"){
      progress.discoveredSides=result.discovered_sides;
      progress.stepFailedPlanks=result.step_failed_planks;
      render();
      return;
    }

    if(result.outcome==="failed"){
      progress.stepFailedPlanks=result.step_failed_planks;
      GF.trialJustFailed=true; GF.trialFailedPlankIndex=plankIndex; GF.trialFailedStepIndex=result.failed_step_index;
      PS.last_bridge_steps=result.last_bridge_steps;
      PS.bridge_fail_streak=result.bridge_fail_streak;
      PS.level=result.level; PS.xp=result.xp; PS.xp_to_next=result.xp_to_next;
      PS.attributes=result.attributes; PS.unspent_stat_points=result.unspent_stat_points;
      PS.bonus_hp_from_attributes=0; PS.bonus_stamina_from_attributes=0;
      PS.current_hp=result.current_hp; PS.current_stamina=result.current_stamina;
      PS.max_maze_depth_reached=result.max_maze_depth_reached;
      
      
      render();
      showTrialFailureConsolation(result.bridge_fail_streak);
      return;
    }

    if(result.outcome==="promoted"){
      PS.highest_tier_reached=Math.max(PS.highest_tier_reached||1, currentTier+1);
      PS.class_id=result.new_class_id;
      PS.last_bridge_steps=result.last_bridge_steps;
      PS.bridge_fail_streak=result.bridge_fail_streak;
      PS.trial_progress[PS.class_id]={stage:0,discoveredSides:[],stepFailedPlanks:{}};
      PS.level=result.level; PS.xp=result.xp; PS.xp_to_next=result.xp_to_next;
      PS.attributes=result.attributes; PS.unspent_stat_points=result.unspent_stat_points;
      PS.bonus_hp_from_attributes=0; PS.bonus_stamina_from_attributes=0;
      PS.current_hp=result.current_hp; PS.current_stamina=result.current_stamina;
      PS.max_maze_depth_reached=result.max_maze_depth_reached;
      
      
      GF.ventureLockDepth=null; GF.trapdoorStreak=0;
      GF.ventureDepth=1;
      
      
      
      
      triggerClassPromotionCelebration(c, result.new_class_id, result.final_tier);
    }
  }

  
  
  const plankCols=h("div",{class:"row gap",style:{overflowX:"auto",paddingBottom:"6px"}});
  for(let i=0;i<rows;i++){
    const discoveredPlank=progress.discoveredSides[i];
    const isCurrent=i===progress.discoveredSides.length && !failed;
    
    
    
    const knownFailedHere=progress.stepFailedPlanks[i]||[];
    const col=h("div",{class:"col gap",style:{alignItems:"center"}});
    for(let p=0;p<plankCount;p++){
      const isSafe=discoveredPlank===p;
      const isUnsafe=knownFailedHere.includes(p);
      
      
      
      col.appendChild(h("button",{class:"plank-btn"+(isSafe?" safe":(isUnsafe?" unsafe":"")),
        disabled:!isCurrent || isUnsafe || !!GF.trialResolving,
        title:isUnsafe?"You already know this plank breaks.":(GF.trialResolving?"Waiting for the trial's outcome...":""),
        onClick:()=>attemptStep(p)},[inlineIcon(FOOTSTEP_SVG,16)]));
    }
    plankCols.appendChild(col);
  }
  root.appendChild(plankCols);

  root.appendChild(h("div",{class:"row",style:{marginTop:"10px"}},[
    h("button",{onClick:()=>{ GF.trialJustFailed=false; GF.trialFailedPlankIndex=null; if(failed){ GF.ventureDepth=1; GF.ventureLockDepth=null; GF.trapdoorStreak=0; } GF.goto("town"); }},[failed?"Return to Town":"← Retreat to Town"]),
  ]));
  return root;
}

function legacyGearAffixLine(item){
  return item.affixes.map(a=>`${IF.affixLabel(a.stat)} ${a.value}${IF.affixIsPercent(a.stat)?"%":""}`).join(", ");
}
function legacyGearSection(){
  const root=h("div",{});
  root.appendChild(h("h3",{style:{marginTop:"18px"}},["Legacy Gear"]));
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px"}},[
    "Items whose stats no longer match today's live balance -- rolled under an older, more generous formula, but still \"valid\" so they were never touched automatically. Review each one and rescale it individually if you want to bring it in line; nothing here happens automatically or in bulk.",
  ]));
  root.appendChild(h("div",{class:"row gap",style:{marginBottom:"8px"}},[
    h("button",{disabled:GF.admin_legacy_gear_bulk_busy,onClick:async ()=>{
      GF.admin_legacy_gear_error="";
      GF.admin_legacy_gear_row_status={};
      try{
        GF.admin_legacy_gear_cache=await Net.fetchLegacyGear(GF.admin_token||"");
      }catch(e){
        GF.admin_legacy_gear_error=e.message||"Could not load the legacy gear list.";
        GF.admin_legacy_gear_cache=null;
      }
      render();
    }},["Scan For Legacy Gear"]),
    
    
    
    
    (GF.admin_legacy_gear_cache && GF.admin_legacy_gear_cache.length>0) ? h("button",{disabled:GF.admin_legacy_gear_bulk_busy,onClick:async ()=>{
      GF.admin_legacy_gear_bulk_busy=true; GF.admin_legacy_gear_error=""; render();
      try{
        const result=await Net.rescaleAllLegacyGear(GF.admin_token||"");
        setToast(`Recalibrated ${result.rescaled_count} out-of-date item${result.rescaled_count===1?"":"s"}.`);
        GF.admin_legacy_gear_cache=await Net.fetchLegacyGear(GF.admin_token||"");
        GF.admin_legacy_gear_row_status={};
      }catch(e){
        GF.admin_legacy_gear_error=e.message||"Could not update all legacy gear items.";
      }
      GF.admin_legacy_gear_bulk_busy=false;
      render();
    }},[GF.admin_legacy_gear_bulk_busy?"Updating All…":"Update All"]) : null,
  ]));
  if(GF.admin_legacy_gear_error) root.appendChild(h("div",{class:"muted",style:{color:"#e07a7a",marginBottom:"8px"}},[GF.admin_legacy_gear_error]));
  if(GF.admin_legacy_gear_cache){
    if(GF.admin_legacy_gear_cache.length===0){
      root.appendChild(h("div",{class:"muted"},["No legacy gear found -- everything currently in the game matches today's balance."]));
    } else {
      for(const entry of GF.admin_legacy_gear_cache){
        const key=entry.location.instance_id;
        const status=GF.admin_legacy_gear_row_status[key];
        const rowChildren=[
          h("div",{},[
            h("div",{},[
              h("span",{class:"rarity-"+entry.item.rarity,style:{fontWeight:"bold"}},[IF.displayName(entry.item)]),
              h("span",{class:"muted"},[` (Tier ${tierRomanNumeral(entry.item.tier)})`]),
            ]),
            h("div",{class:"muted"},[`Owner: ${entry.username}${entry.character_name?` (${entry.character_name})`:""} -- ${entry.where}`]),
            h("div",{class:"muted",style:{marginTop:"4px"}},["Before: ",legacyGearAffixLine(entry.item)]),
            h("div",{class:"muted"},["After: ",legacyGearAffixLine(entry.rescaled)]),
          ]),
        ];
        if(status==="done"){
          rowChildren.push(h("div",{style:{color:"#8fd18f",fontWeight:"bold"}},["Rescaled ✓"]));
        } else {
          rowChildren.push(h("button",{disabled:status==="busy",onClick:async ()=>{
            GF.admin_legacy_gear_row_status[key]="busy"; render();
            try{
              await Net.rescaleLegacyGear(entry.location,GF.admin_token||"");
              GF.admin_legacy_gear_row_status[key]="done";
            }catch(e){
              GF.admin_legacy_gear_row_status[key]=null;
              GF.admin_legacy_gear_error=e.message||"Could not rescale that item.";
            }
            render();
          }},[status==="busy"?"Updating…":"Update"]));
        }
        root.appendChild(h("div",{class:"tile row",style:{justifyContent:"space-between",alignItems:"center",marginBottom:"6px",gap:"10px"}},rowChildren));
      }
    }
  }
  return root;
}

  { version:"v0.19", notes:[
    "Security hardening, part 3 -- the big one: every attack round in combat (monster block chance, your damage/crit roll, the monster's counter-attack, fleeing, and a kill's XP/gold/loot/leveling) is now resolved by the server instead of your browser. This was the last major piece of the security pass that followed the Trial, Blacksmith reroll, and Auction House/Storage Vault hardening -- combat is the single most-played loop in the game, so it mattered most to get right. Combat should feel exactly the same to play; only the numbers now come from the server, closing the door on a modified client faking damage, dodging a kill it shouldn't have gotten, or handing itself free XP/gold/loot.",
    "Server-authoritative maze generation and chest/herb/critter encounters remain on the backlog for a future pass.",
  ]},
  { version:"v0.18.4", notes:[
    "Security hardening, part 2 (see v0.18.3 for part 1, the Broken Bridge Trial): the Blacksmith's Reroll button now has its outcome decided by the server, not the browser -- closing the specific worry that a modified client could report back a fake \"perfect roll\" for free. The reroll still costs the same materials, still keeps the same affix stats, and still feels instant -- only the numbers now come from the server.",
    "The Auction House and Storage Vault now reject any gear item whose stats couldn't actually come from real loot generation or a real reroll (impossible tier, wrong number of bonuses for its rarity, a bonus rolled higher than that tier could ever produce). This closes the door on listing or stashing a fabricated, hand-edited item. Items you already owned before this update are untouched.",
    "This closes out the security pass covering the Trial, Blacksmith, Auction House, and Storage Vault. Full server-side combat resolution and maze generation remain on the roadmap for later.",
  ]},
  { version:"v0.18.3", notes:[

function screenItemization(){
  const root=h("div",{});
  root.appendChild(h("h2",{},["Itemization Guide"]));

  root.appendChild(h("button",{style:{marginBottom:"10px"},onClick:()=>{ GF.goto(GF._preItemizationScreen||"town"); }},["← Back"]));

  root.appendChild(h("h3",{},["Item Tiers"]));
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px"}},["Tier (T1-T5) is separate from Rarity. A tier's level requirement is the LOWEST character level that can equip it -- you can always still wear a lower tier than your level allows. An area's level mostly drops its own \"natural\" tier, but occasionally hands out a lower tier too (never a higher one), so low-tier legendaries stay worth finding and trading even for high-level characters."]));
  const tierPanel=h("div",{class:"panel",style:{marginBottom:"16px"}});
  tierPanel.appendChild(gridRow(["Tier","Equip Requirement","Most Common Drop Area"],{cols:"1fr 1fr 1fr",header:true}));

    const areaRange=t<Balance.ITEM_TIER_MAX?`Area level ${lo}-${lo+Balance.ITEM_TIER_BRACKET_WIDTH-1}`:`Area level ${lo}+`;
    tierPanel.appendChild(gridRow([`T${t} (${Balance.itemTierAdjective(t)})`,`Character Level ${lo}+`,areaRange],{cols:"1fr 1fr 1fr",noBorder:t===Balance.ITEM_TIER_MAX}));
  }
  root.appendChild(tierPanel);

  root.appendChild(h("h3",{},["Rarity"]));
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px"}},["Rarity decides how many affixes (rolled bonus stats) an item can carry, independent of its Tier."]));
  const rarityPanel=h("div",{class:"panel",style:{marginBottom:"16px"}});
  rarityPanel.appendChild(gridRow(["Rarity","Affixes"],{cols:"1fr 1fr",header:true}));
  Balance.RARITY_TABLE.forEach((r,i)=>{
    rarityPanel.appendChild(h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px",padding:"5px 0",borderBottom:i===Balance.RARITY_TABLE.length-1?"none":"1px solid var(--border)"}},[

  root.appendChild(rarityPanel);

  
  
  
  
  root.appendChild(h("h3",{},["Weapon Class Requirements"]));
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px"}},["Each weapon type can only be equipped by certain classes. Trying to equip a weapon your class can't use shows an explanation instead, and an equipped weapon that becomes class-invalid (e.g. after a Broken Bridge Trial promotion) is flagged just like an under-level item -- its bonuses stop applying until you unequip or swap it."]));
  const weaponClassPanel=h("div",{class:"panel",style:{marginBottom:"16px"}});
  weaponClassPanel.appendChild(gridRow(["Weapon Type","Allowed Classes"],{cols:"1fr 2fr",header:true}));
  IF.WEAPON_TYPE_LIST.forEach((wt,i)=>{
    const allowedIds=IF.WEAPON_TYPE_CLASS_RESTRICTIONS[wt];
    const allowedText=allowedIds?allowedIds.map(id=>DL.getClass(id).display_name||id).join(", "):"Every class";

  root.appendChild(weaponClassPanel);

  root.appendChild(h("h3",{},["Max Affix Rolls Per Tier"]));
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px"}},["Every affix rolls on 20 discrete steps between the max shown below and 1/20th of it, for its own stat and tier -- each stat's max always scales up linearly with tier (Tier N's max = N x that stat's Tier 1 max), and hitting the exact max (a 1-in-20 chance) is a perfected roll. Weapons roll a further +40% on any Damage affix they get. Mana and Spell Power affixes are planned for a future update."]));
  const affixPanel=h("div",{class:"panel",style:{marginBottom:"16px",overflowX:"auto"}});
  const cols=`1.3fr repeat(${Balance.ITEM_TIER_MAX},1fr)`;
  affixPanel.appendChild(gridRow(["Stat",...Array.from({length:Balance.ITEM_TIER_MAX},(_,i)=>`T${i+1}`)],{cols,header:true}));

    h("div",{style:{marginBottom:"8px"}},[`Failing an attempt isn't pure loss: every failure permanently adds +1 to the starting stat points your next Level 1 begins with (base ${Balance.STARTING_STAT_POINTS}, see the Broken Bridge Trial screen for your current running total), so repeated attempts at a tough tier make each retry a little stronger. That bonus resets back down to the base ${Balance.STARTING_STAT_POINTS} the moment you finally cross.`]),
    
    
    
    
    h("div",{style:{color:"#5ac67a"}},[`A failed attempt CANNOT kill your character, even in Hardcore mode -- falling only resets you to Level 1 at your current tier, it never sends you to the Graveyard.`]),
  ]));

  root.appendChild(h("div",{class:"panel",style:{marginBottom:"16px"}},[
    h("div",{style:{marginBottom:"8px"}},[`Every monster you defeat without returning to Town extends your Kill Streak by 1, shown right on your Character Sheet stat panel. Its only effect is +${Balance.KILL_STREAK_MAGIC_FIND_PCT_PER_KILL}% Magic Find per kill in the streak -- better odds at higher-rarity gear drops, AND (as of v0.18.2) better odds of getting a drop at all on a kill that would otherwise have come up empty. It does NOT make monsters tougher or change how much gold or XP you get per kill. You'll see the current bonus tick up next to the streak count after every kill, for as long as you keep venturing without heading back to Town.`]),
  ]));

  root.appendChild(h("h3",{},["Community XP Bonus"]));
  root.appendChild(h("div",{class:"panel",style:{marginBottom:"16px"}},[
    h("div",{style:{marginBottom:"8px"}},[`Right under the top bar on every screen, a banner tracks how many Wandrian accounts have been active in the last few minutes -- the same headcount the "Currently playing" line uses. That count is also a shared XP bonus for everyone currently playing: alone, there's no bonus at all, but as soon as at least one other player is online too, the FULL headcount times ${Balance.COMMUNITY_XP_PCT_PER_EXTRA_PLAYER}% applies to everyone's kill XP (2 players active = +${2*Balance.COMMUNITY_XP_PCT_PER_EXTRA_PLAYER}%, 3 = +${3*Balance.COMMUNITY_XP_PCT_PER_EXTRA_PLAYER}%, and so on), stacking additively with every other XP bonus below rather than multiplying them. There's no way to lose this bonus other than everyone else logging off -- it only ever helps, never hurts, and it applies automatically to every kill without anything you need to do.`]),
  ]));

  root.appendChild(h("h3",{},["Critters & Forest Reputation"]));
  root.appendChild(h("div",{class:"panel",style:{marginBottom:"16px"}},[
    h("div",{style:{marginBottom:"8px"}},[`Occasionally you'll come across a small, harmless critter in the maze -- it won't fight back. You choose: squash it, or spare its life. Each choice moves your Forest Reputation for your CURRENT class tier by 1 (squashing: -1, sparing: +1) -- it starts at 0 and can go negative, and it's tracked separately per tier, since your class tier determines which forest (and town) you're exploring. Your current tier's reputation is always shown on your Character Sheet.`]),
    h("div",{style:{marginBottom:"8px"}},[`A POSITIVE reputation grants a persistent +${Balance.FOREST_REPUTATION_XP_PCT_PER_POINT}% bonus to all experience gained per point, for as long as you're exploring that tier's forest -- it stacks ADDITIVELY (summed as a percentage, applied once) with every other XP bonus (Community XP, shrines, gear) rather than multiplying them together, and applies to every kill automatically, no need to re-earn it each fight. A NEGATIVE reputation doesn't touch your XP at all, but adds 1 extra roaming mob to that forest's mazes per point below zero. Play it however you like: rack up roaming mobs to farm kills, or stay peaceful and let the bonus XP add up -- the choice, and its consequences, are entirely yours.`]),

function mazeTileReferenceTable(){

  const cols="34px 1.3fr 4fr";
  panel.appendChild(gridRow(["","Tile","What it means"],{cols,header:true}));
  const rows=[
    [mazeTileSwatch(TILE_COLOR.grass,""),"Grass","Where monster encounters happen as you walk. Trampling the same tile 3+ times fades it toward bare dirt -- still walkable, just no more fights on it."],
    [mazeTileSwatch(TILE_COLOR.dirt,""),"Dirt","Trampled-out grass, or plain open ground. Walkable, no encounters."],
    [mazeTileSwatch(TILE_COLOR.boulder,TILE_GLYPH.boulder),"Boulder","Impassable -- blocks both you and roaming mobs, forcing a path around it."],
    [mazeTileSwatch(TILE_COLOR.start,TILE_GLYPH.start),"Start","Your entry point into this maze. Always visible, exempt from the fog of war."],
    [mazeTileSwatch(TILE_COLOR.exit,TILE_GLYPH.exit),"Exit","Hidden by fog of war until you stumble onto it. Stepping on it advances you to a tougher, freshly generated maze at the next area level -- the only way to gain area levels."],
    [mazeTileSwatch(TILE_COLOR.chest,TILE_GLYPH.chest),"Chest","Interacting with it opens a ceremonial reveal of its full loot at once."],
    [mazeTileSwatch(TILE_COLOR.shrine,TILE_GLYPH.shrine),"Shrine","Grants a temporary buff on touch -- bonus XP, bonus Stamina, Invulnerability, Quad Damage, or Magic Find."],
    [mazeTileSwatch(TILE_COLOR.herb,TILE_GLYPH.herb),"Herb node","An interactive gathering encounter (not a fight) that yields herbs used in Alchemy."],
    [mazeTileSwatch(TILE_COLOR.critter,TILE_GLYPH.critter),"Critter","A harmless creature you can squash or spare -- shifts your current class tier's Forest Reputation (see above), which grants a permanent XP bonus while positive."],
    [mazeTileSwatch(TILE_COLOR.trap,TILE_GLYPH.trap),"Trap","Announced by its own icon, but its exact effect is a surprise -- an equal chance of an ankle bite (instant damage), a poison bite (area level 6+ only), or a trapdoor fall that drops your area level (never on area level 1). Only one of the three ever happens per trigger."],
    [mazeTileSwatch(TILE_COLOR.stronghold_guardian,TILE_GLYPH.stronghold_guardian),"Stronghold Guardian","A tough, fixed-position monster guarding one side of a Stronghold's locked chest -- hits harder than an ordinary monster at the same area level."],
    [mazeTileSwatch(TILE_COLOR.stronghold_chest,TILE_GLYPH.stronghold_chest),"Stronghold Chest","Locked -- needs a Stronghold Key of the matching tier, dropped by that Stronghold's guardians, to open."],
    [mazeTileSwatch(TILE_COLOR.stronghold_fence,TILE_GLYPH.stronghold_fence),"Stronghold Fence","Purely decorative corner marker of a Stronghold's 3x3 layout. Walkable, no effect."],
    [mazeTileSwatch(ROAMING_MOB_COLOR_BY_BEHAVIOR.regular,ROAMING_MOB_GLYPH),"Roaming Mob (Regular)","Not a fixed tile -- wanders the whole maze on its own clock (roughly 1 step/sec) even while you stand still, taking a uniformly random valid step each tick. Hits harder than a Stronghold guardian."],
    [mazeTileSwatch(ROAMING_MOB_COLOR_BY_BEHAVIOR.charging,ROAMING_MOB_GLYPH),"Roaming Mob (Charging)","A hunter -- every tick it greedily closes the distance to you once it's within sight, rather than wandering at random."],
    [mazeTileSwatch(ROAMING_MOB_COLOR_BY_BEHAVIOR.hoarding,ROAMING_MOB_GLYPH),"Roaming Mob (Hoarding)","A homebody -- often stays put, and even when it moves it's biased toward staying near its own spawn tile rather than roaming far."],
  ];
  rows.forEach((r,i)=>panel.appendChild(gridRow(r,{cols,noBorder:i===rows.length-1})));
  return panel;
}














function experienceGuideTable(){
  const root=h("div",{class:"panel",style:{maxHeight:"420px",overflowY:"auto"}});
  root.appendChild(gridRow(["Level","Levelup Target (XP)","Monster Reward (XP)","Monster Difficulty"],{cols:"0.6fr 1.2fr 1.2fr 1.2fr",header:true}));
  const baseHpAtOne=Balance.monsterHp(1,1);
  for(let lvl=1;lvl<=Balance.LEVEL_CAP;lvl++){
    const target=Balance.xpRequiredForLevel(lvl);
    const reward=Math.round(Balance.monsterXpReward(Balance.MONSTER_BASE_XP,lvl));
    const difficultyPct=Math.round((Balance.monsterHp(1,lvl)/baseHpAtOne-1)*100);
    root.appendChild(gridRow([`${lvl}`,`${target}`,`${reward}`,`+${difficultyPct}% HP/Dmg`],{cols:"0.6fr 1.2fr 1.2fr 1.2fr",noBorder:lvl===Balance.LEVEL_CAP}));
  }
  return root;
}

setInterval(()=>{
  if(PS.current_slot<0) return;
  if(!isRegenActiveNow()) return;
  
  
  
  
  
  
  // v0.22.1 (Part B3): the free town baseline (CAMPFIRE_*_PER_SECOND + bonfire bonus) must
  // NOT leak into the maze -- it's a town-only amenity. Earned regen (class+gear regen stat,
  // via PS.getRegen()/getStaminaRegen(), plus any active Potion of Renewal buff) still applies
  // in the maze on top of that, unchanged. This interval is never active during combat
  // (isRegenActiveNow()/REGEN_ACTIVE_SCREENS above already exclude it) -- earned regen ticks
  // there instead via the server's own combatTickCombatRoundBuffs() (server.js), which mirrors
  // PS.getRegen()/getStaminaRegen() exactly, so HP/Stamina never desync from server-authoritative
  // combat state.
  const inFreeTownZone=GF.screen!=="maze";
  const freeBonus=inFreeTownZone?PS.getActiveBonfireBonus():0;
  const freeBaselineHp=inFreeTownZone?Balance.CAMPFIRE_REGEN_PER_SECOND:0;
  const freeBaselineStamina=inFreeTownZone?Balance.CAMPFIRE_STAMINA_REGEN_PER_SECOND:0;
  const hpBonus=freeBonus+PS.getActiveTempBuff("regen")+PS.getRegen();
  const staminaBonus=freeBonus+PS.getStaminaRegen();
  let changed=false;
  if(PS.current_hp<PS.getMaxHp()){ PS.current_hp=Math.min(PS.getMaxHp(),PS.current_hp+freeBaselineHp+hpBonus); changed=true; }
  if(PS.current_stamina<PS.getMaxStamina()){ PS.current_stamina=Math.min(PS.getMaxStamina(),PS.current_stamina+freeBaselineStamina+staminaBonus); changed=true; }
  if(changed) PS.saveGame();

  
  
  
  
  
  const bonfireJustExpired = GF.screen==="town" && PS.getActiveBonfireBonus()<=0 && !!document.getElementById("bonfire-countdown-text");
  if(bonfireJustExpired){
    render();
    return;
  }

  if(changed){
    
    
    
    
    
    
    
    if(!refreshStatHeaderInPlace(true)){ render(); return; }
  }
  if(GF.screen==="town") refreshBonfireCountdownInPlace();
},1000);























let poisonWasActive=false;
let poisonSaveCounter=0;
setInterval(()=>{
  if(PS.current_slot<0) return;
  const poisoned=PS.isPoisoned();
  const applied=PS.tickPoisonDrain();
  if(applied){
    poisonSaveCounter++;
    if(poisonSaveCounter%5===0) PS.saveGame();
  }
  const justExpired=poisonWasActive && !poisoned;
  poisonWasActive=poisoned;
  if(poisoned || justExpired){
    if(!refreshStatHeaderInPlace()) render();
  }
},Balance.POISON_TICK_MS);

function idleRoamerTick(){
  if(PS.current_slot<0) return;
  if(GF.screen!=="maze") return;
  if(GF.mazeOverlay) return; 
  const maze=GF.overworld_snapshot;
  if(!maze || !maze.roamers || !maze.roamers.length) return;
  const prevRoamerPositions={};
  for(const r of maze.roamers) prevRoamerPositions[r.roamerId]=r.idx;
  tickRoamingMobs(maze);
  
  
  const wanderedIn=maze.roamers.find(r=>!r.defeated && r.idx===maze.playerIdx);
  if(wanderedIn){
    PS.tickXpBuff();
    GF.goto("combat",{maze_depth:maze.depth, pending_monster_id:wanderedIn.monsterId, pending_roamer_id:wanderedIn.roamerId, pending_guardian_cell_idx:null});
    return;
  }
  
  
  
  render();
  animateMazeMovers(null,prevRoamerPositions);
}
setInterval(idleRoamerTick,1000);
