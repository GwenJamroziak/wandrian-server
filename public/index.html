// v0.18 (#14): "Currently playing: Name1, Name2, Name3" line under Global Chat -- server
// already filters to the last 5 minutes of activity (see /api/active-players' comment) and
// sorts most-recent-first; this just handles the client-side "5 most recent, then an
// 'and N others' tail" truncation Gwen's spec calls for.
function activePlayersLine(){
  const entries=Net.activePlayersCache;
  if(entries===null||entries===undefined) return h("div",{class:"muted",style:{fontSize:".85em",marginBottom:"6px"}},["Currently playing: loading..."]);
  if(entries.length===0) return h("div",{class:"muted",style:{fontSize:".85em",marginBottom:"6px"}},["Currently playing: no one else right now."]);
  const shown=entries.slice(0,5).map(e=>e.character_name);
  const others=entries.length-shown.length;
  const text="Currently playing: "+shown.join(", ")+(others>0?`, and ${others} other${others===1?"":"s"}`:"");
  return h("div",{class:"muted",style:{fontSize:".85em",marginBottom:"6px"}},[text]);
}

// v0.18.2 (#7): the same server-verified "active in the last 5 minutes" account count
// activePlayersLine() already fetches (Net.activePlayersCache, see fetchActivePlayers())
// doubles as a community XP buff -- Gwen's spec: 1 player (just yourself) = no bonus, 2 =
// double XP for everyone, 3 = triple, 4 = 4x, and so on (count itself IS the multiplier).
// Deliberately keyed off the raw entry count, not "entries minus yourself", since the server
// route makes no attempt to exclude the caller's own account and Gwen's examples ("when you
// are the only player online") clearly mean the total headcount including yourself.
// Returns 1 (no bonus, never a penalty) while the very first fetch hasn't resolved yet
// (cache still null) rather than guessing at a count nobody has confirmed.
function getGlobalXpMultiplier(){
  const entries=Net.activePlayersCache;
  if(!entries) return 1;
  return Math.max(1, entries.length);
}

// v0.18.2 (#7): the always-visible banner announcing the current community XP multiplier
// (or its absence). Rendered once at the very top of the page, right above
// activePlayersLine(), on every screen that shows the top bar -- see render() -- so it's
// "permanently visible" exactly as Gwen's spec asks, not a toast that fades away. Renders an
// empty (but still real, appendChild-safe) div until the first /api/active-players fetch
// resolves, matching activePlayersLine()'s own loading behavior, rather than flashing a
// possibly-wrong "alone" message before the real count is known.
function globalXpMultiplierLine(){
  const entries=Net.activePlayersCache;
  if(!entries) return h("div",{});
  const n=Math.max(1, entries.length);
  let text;
  if(n<=1) text="You are all alone in the dark forest.";
  else if(n===2) text="Two players are currently in the Wandrian realm -- experience gained is doubled for everyone!";
  else if(n===3) text="Three players are currently in the Wandrian realm -- experience gained is tripled for everyone!";
  else text=`${n} players are currently in the Wandrian realm -- experience gained is ${n}x for everyone!`;
  // v0.18.2 (#7): reuse the same purple already used for XP floating text (.float-text-xp)
  // to tie this banner visually to "more XP", rather than introducing a brand new color.
  const style=n>=2?{fontSize:".9em",marginBottom:"6px",fontWeight:"bold",color:"#b46cff"}:{fontSize:".9em",marginBottom:"6px"};
  return h("div",{class:n>=2?"":"muted",style},[text]);
}

function chatLogEntries(){

  for(const m of Net.chatMessages) entries.push({t:new Date(m.created_at).getTime(), node:h("div",{},[h("span",{class:"muted"},[`[${new Date(m.created_at).toLocaleTimeString()}] `]), m.username!=="System"?h("span",{style:{fontWeight:"bold"}},[m.username+": "]):null, m.message])});

  entries.sort((a,b)=>a.t-b.t);
  return entries.map(e=>e.node);
}

function chatBody(closeBtn){

  const input=h("input",{type:"text",placeholder:"Say something...",style:{flex:"1"}});
  const send=()=>{ const msg=input.value.trim(); if(!msg) return; Net.sendChat(msg); input.value=""; };
  input.addEventListener("keydown",(e)=>{ if(e.key==="Enter") send(); });
  const root=h("div",{style:{display:"flex",flexDirection:"column",height:"100%"}},[
    h("div",{class:"row",style:{justifyContent:"space-between",marginBottom:"8px"}},[h("h2",{style:{margin:0}},["Global Chat"]), closeBtn?h("span",{class:"linklike",onClick:closeBtn},["Close ✕"]):null]),
    // v0.18.1 (#29): activePlayersLine() moved OUT of here -- it's now rendered once at the
    // top of the page, right under the top bar (see render()), so it's visible at all times
    // instead of only while this collapsible chat panel happens to be open.
    log,
    h("div",{class:"row"},[input, h("button",{onClick:send},["Send"])]),
  ]);
  // Using requestAnimationFrame (not setTimeout) here matters: rAF runs before the
  // browser's next paint, so the scroll position is corrected before anything is drawn.
  // A setTimeout(fn,0) instead lets one frame paint at scrollTop=0 first (top of the
  // log) and then jump to the bottom on the next tick, that's the flicker players
  // saw on every maze step while chat was open (any full re-render rebuilds this div).
  requestAnimationFrame(()=>{ log.scrollTop=log.scrollHeight; });
  return root;
}

function chatPanel(){
  if(!GF.chatOpen || !Net.online) return null;
  return h("div",{class:"chat-panel"},[chatBody(()=>{ GF.chatOpen=false; render(); })]);
}

// v0.15: swaps ONLY the #stat-header-panel node (see statHeader()) in place, without
// touching anything else on the page. Used by the once-a-second regen tick so that a
// player mid-click/mid-scroll on some OTHER button (like the Character Sheet's "<- Back")
// never has that button yanked out from under them by a periodic full re-render. Returns
// false if the panel isn't found (e.g. current screen doesn't render one), so the caller
// can fall back to a full render() instead of silently doing nothing.
// v0.18 (#6): optional `smooth` flag -- see the .bar-fill-slow-tick CSS class above. Only
// the once-a-second town regen tick passes true; the poison-drain and heal-over-time ticks
// (which already look right at the fast default fill speed) call this with no argument.
function refreshStatHeaderInPlace(smooth){
  const el=document.getElementById("stat-header-panel");
  if(!el || !el.parentNode) return false;
  // v0.16 BUG FIX: this used to call el.parentNode.replaceChild(statHeader(), el) -- rebuild
  // the whole panel and swap the node. That's a smaller blast radius than a full render(),
  // but tester report showed even THIS was enough to auto-close an open native <select>
  // dropdown elsewhere on the page (reported: Auction House filter/sort dropdown closing
  // in sync with the once-a-second regen tick) -- browsers can treat any nearby DOM
  // mutation/reflow as reason enough to dismiss an open <select> popup. So instead of
  // replacing any node at all, just mutate the handful of leaf text/width values that
  // can actually change on a regen tick (HP/Stamina numbers + bar fill %), in place.
  const hpText=document.getElementById("stat-hp-text");
  const hpFill=document.getElementById("stat-hp-bar-fill");
  const stText=document.getElementById("stat-stamina-text");
  const stFill=document.getElementById("stat-stamina-bar-fill");
  if(!hpText||!hpFill||!stText||!stFill) return false;
  hpText.textContent=`HP ${Math.round(PS.current_hp)}/${Math.round(PS.getMaxHp())}`;
  hpFill.style.width=clampf(PS.current_hp/PS.getMaxHp()*100,0,100)+"%";
  stText.textContent=`Stamina ${Math.round(PS.current_stamina)}/${Math.round(PS.getMaxStamina())}`;
  stFill.style.width=clampf(PS.current_stamina/PS.getMaxStamina()*100,0,100)+"%";
  // v0.18 (#8): the heal-preview overlay always exists (see hpBar()'s own comment on why
  // it's never conditionally added/removed), so every refresh -- including the poison and
  // regen ticks, not just the heal-over-time sub-tick -- can just patch its width the same
  // plain way as the two bars above. This is also exactly why a hit that lowers current_hp
  // mid-heal shrinks the preview on the very next tick of ANY of these three intervals.
  const healPreviewFill=document.getElementById("stat-hp-heal-preview");
  if(healPreviewFill) healPreviewFill.style.width=clampf((PS.current_hp+PS.getPendingHealAmount())/PS.getMaxHp()*100,0,100)+"%";
  // v0.18.1 (#20): same preview-overlay patching as the HP bar above, now for Stamina too.
  const staminaHealPreviewFill=document.getElementById("stat-stamina-heal-preview");
  if(staminaHealPreviewFill) staminaHealPreviewFill.style.width=clampf((PS.current_stamina+PS.getPendingStaminaHealAmount())/PS.getMaxStamina()*100,0,100)+"%";
  // v0.17 (#3/#8): keep the Poisoned-vs-normal HP text/bar color and the status icon's
  // visibility in sync on every targeted (non-full) refresh too, not just on a full
  // render() -- see statHeader() for the matching source-of-truth markup and the poison
  // drain tick below for why this needed to run even on the tick poison expires.
  const poisoned=PS.isPoisoned();
  hpText.className=poisoned?"hp-text hp-text-poisoned":"hp-text";
  hpFill.className="bar-fill "+(poisoned?"bar-hp-poisoned":"bar-hp")+(smooth?" bar-fill-slow-tick":"");
  stFill.className="bar-fill bar-stamina"+(smooth?" bar-fill-slow-tick":"");
  const poisonIcon=document.getElementById("stat-poison-icon");
  if(poisonIcon){
    poisonIcon.style.opacity=poisoned?"1":"0";
    if(poisoned) poisonIcon.setAttribute("title",`Poisoned: draining ${PS.getPoisonHpPerSec().toFixed(1)} HP/sec for ${formatMsAsMinSec(PS.getPoisonMsLeft())} more (won't drop you below 1 HP on its own).`);
  }
  // v0.17.3 (#8): keep the "(healing +X.X/sec)" indicator in sync on every fast heal
  // sub-tick too -- see the dedicated heal-over-time setInterval below, which calls this
  // function (not a full render()) on every 200ms sub-tick for exactly this reason.
  const healingText=document.getElementById("stat-healing-text");
  if(healingText){
    const healPerSec=PS.getHealPerSecond();
    healingText.style.display=healPerSec>0?"inline":"none";
    healingText.textContent=`(healing +${healPerSec.toFixed(1)}/sec)`;
  }
  // v0.18.1 (#20): same "(recovering +X.X/sec)" sync for the Stamina row now that stamina
  // potions heal gradually too.
  const staminaHealingText=document.getElementById("stat-stamina-healing-text");
  if(staminaHealingText){
    const staminaHealPerSec=PS.getStaminaHealPerSecond();
    staminaHealingText.style.display=staminaHealPerSec>0?"inline":"none";
    staminaHealingText.textContent=`(recovering +${staminaHealPerSec.toFixed(1)}/sec)`;
  }
  return true;
}

// v0.18 (#7): grows the XP bar from its PRE-kill width up to the width render() already
// wrote into the DOM, over the 1s ease-out transition declared on .bar-fill-xp-grow. render()
// tears down and rebuilds #app from scratch every call (see render() above), so a freshly
// created bar node has no "old" width to animate from -- painting it, unanimated, straight at
// its final value. The standard trick: immediately after render(), force the node back to the
// OLD width with transitions disabled, then (after a short setTimeout so the browser actually
// paints that frame) restore the transition and set it to the real target width -- the CSS
// transition then animates the visible change same as if it had happened gradually to begin
// with. Call this AFTER render(), passing the pre-kill xp/xp_to_next fraction (0..1).
// Deliberately skipped by its only caller when the kill also leveled the character up: the
// bar's denominator (PS.xp_to_next) changes on a level-up, so the old fraction and the new
// fraction aren't on the same visual scale -- the level-up gets its own clear combat-log
// announcement already, so just showing the new bar at its correct post-level-up width (no
// animation) reads fine there.
function animateXpBarGrowth(oldFraction){
  const el=document.getElementById("stat-xp-bar-fill");
  if(!el) return;
  const targetWidth=el.style.width;
  el.style.transition="none";
  el.style.width=clampf(oldFraction*100,0,100)+"%";
  setTimeout(()=>{
    el.style.transition="";
    el.style.width=targetWidth;
  },20);
}

// v0.16 (#331): same reasoning/pattern as refreshStatHeaderInPlace() above -- Gwen asked
// for the Kindled Bonfire's "remaining" subtext to actually tick down second-by-second in
// MM:SS, but wondered "will that eat up too much page rerendering?" if done the naive way
// (a full render() every second just to update one line of text). It doesn't need to: only
// the #bonfire-countdown-text leaf (see kindleBonfirePanel()) ever needs to change on a
// plain countdown tick, so this patches just that node's textContent in place, no
// teardown/rebuild of the page at all. Returns false (a no-op) if the bonfire isn't
// currently kindled or the node isn't on screen, so the caller knows nothing was patched.
function refreshBonfireCountdownInPlace(){
  const el=document.getElementById("bonfire-countdown-text");
  if(!el || !el.parentNode) return false;
  const activeBonus=PS.getActiveBonfireBonus();
  if(activeBonus<=0) return false;
  const msLeft=Math.max(0,(PS.bonfire_bonus_expires_at||0)-Date.now());
  el.textContent=`${formatMsAsMinSec(msLeft)} remaining (+${Math.round(activeBonus)} HP/sec and +${Math.round(activeBonus)} Stamina/sec regen).`;
  return true;
}

function render(){
  app.innerHTML="";
  // v0.17 (#6) BUG FIX: this banner's wording dated from before Wandrian went online-only
  // (v0.10) and still talked about "local saves"/"progress"/"persistent saves" -- all
  // character progress has lived on the server for a long time now, Storage_ is only used
  // pre-login for the session token (see Net.persistSession()), so the real (much smaller)
  // consequence of a browser blocking it is just having to log in again each visit, not
  // any actual data loss. Updated the copy to say that instead of the old, now-inaccurate
  // "progress won't be remembered" claim.
  if(!Net.online && !Storage_.available){
    app.appendChild(h("div",{class:"panel",style:{background:"#4a2a20",borderColor:"#8a4a3a",marginBottom:"14px"}},[
      "Your browser is blocking local storage for this page (this can happen when opening the file directly instead of through a web server or a hosted link). You'll be able to log in and play normally, you'll just need to log in again each time you come back instead of staying signed in. Your character progress itself always lives on the server either way."
    ]));
  }
  // v0.18.1 (#29): "Currently playing" now lives at the top of the page, directly under the
  // top bar, on every screen that shows one -- previously it only rendered inside chatBody(),
  // which meant it was invisible unless the Global Chat side panel happened to be open,
  // defeating the point of an at-a-glance "who else is online" line.
  // v0.18.2 (#7): the community XP-multiplier banner renders right above the "Currently
  // playing" line -- both always-visible (not just while Global Chat is open), both driven
  // by the same Net.activePlayersCache fetch, so they naturally stay in sync with each other.
  if(!NO_TOPBAR_SCREENS.includes(GF.screen)){ app.appendChild(topBar()); app.appendChild(globalXpMultiplierLine()); app.appendChild(activePlayersLine()); }
  const fn=SCREENS[GF.screen]||SCREENS.mainMenuSlots;
  app.appendChild(fn());
  const cp=chatPanel(); if(cp) app.appendChild(cp);
}

/* ---------- shared in-app confirm popup, replaces window.confirm()/window.prompt() ----------
   Deliberately rendered into its own #modalRoot node OUTSIDE #app, instead of going through
   the normal render()/GF.goto() full-teardown cycle. A lot of the callers (e.g. the hardcore
   checkbox mid-form on the character creation screen) need to show this without wiping out
   whatever the player has already typed into the current screen, which a full render() would
   do since every screen function builds fresh DOM nodes from scratch. Call askConfirm(message,
   onConfirm, opts) to open it; closeConfirmModal() (called automatically on either button, or
   on backdrop click) tears down just the modal layer. */
function closeConfirmModal(){ modalRoot.innerHTML=""; }
function askConfirm(message,onConfirm,opts={}){
  const confirmLabel=opts.confirmLabel||"Confirm", cancelLabel=opts.cancelLabel||"Cancel";
  const danger=opts.danger!==false, onCancel=opts.onCancel||null;
  modalRoot.innerHTML="";
  modalRoot.appendChild(h("div",{class:"modal-backdrop",onClick:(e)=>{ if(e.target===e.currentTarget) closeConfirmModal(); }},[
    h("div",{class:"modal-box"},[
      h("div",{style:{lineHeight:"1.5"}},[message]),
      h("div",{class:"row"},[
        h("button",{onClick:()=>{ closeConfirmModal(); if(onCancel) onCancel(); }},[cancelLabel]),
        h("button",{class:danger?"danger":"",onClick:()=>{ closeConfirmModal(); onConfirm(); }},[confirmLabel]),
      ]),
    ]),
  ]));
}


/* ---------- shared toast ---------- */
// v0.17 (#14): toasts were always a single plain-text string (GF.toast). GF.toastNodes is
// an optional array of mixed strings/DOM nodes that takes priority when present, so a
// caller that needs part of its message styled (currently just the softcore death-loss
// message's colored item-rarity names, see applyDeathAndRedirect()/setToastNodes() below)
// doesn't have to touch the many dozens of existing plain setToast(string) call sites.
function toastBox(){
  if(GF.toastNodes){
    const nodes=GF.toastNodes; GF.toastNodes=null; GF.toast="";
    return h("div",{class:"panel",style:{background:"#2a3a20",borderColor:"#5a7a3a",marginBottom:"12px"}},nodes);
  }
  if(!GF.toast) return null;
  const msg=GF.toast; GF.toast="";
  return h("div",{class:"panel",style:{background:"#2a3a20",borderColor:"#5a7a3a",marginBottom:"12px"}},[msg]);
}
function setToast(msg){ GF.toast=msg; GF.toastNodes=null; }
function setToastNodes(nodes){ GF.toastNodes=nodes; GF.toast=""; }

/* Some feedback (like settling in at the bonfire) doesn't deserve a toast: a toast panel
   pushes the whole Town layout down for a second and back up once it's cleared, which
   reads as a flicker/bug on a screen that otherwise never changes size. Routing it into
   the chat log (as a local "System:" line, the same private-message style already used
   for server notifications) gives the same feedback without touching page layout at all. */
// v0.17 (#6): dropped the dead offline fallback (a toast) -- every screen this can be
// called from is already reached only after login, so Net.online is always true here.
function pushSystemChatMessage(message){
  Net.privateMessages.push({created_at:new Date().toISOString(), message});
}

/* ---------- Autosave: there is no manual save button. Progress is persisted after every
   meaningful action (combat rounds, maze steps/events, vendor transactions, campfire regen
   ticks) instead of on a fixed timer, so idle sessions don't spam the server with no-op saves. ---------- */
function autosave(){ if(PS.current_slot>=0) PS.saveGame(); }
// v0.15.1 SEVERE BUG FIX: players reported real progression/loot/trial setbacks after
// simply closing the browser (or the tab getting backgrounded/killed on mobile) and
// coming back later -- not a Back/Forward navigation, an actual close. `beforeunload` is
// the traditional hook for "save before leaving", but it's unreliable in exactly this
// scenario: it doesn't fire consistently on mobile Safari, doesn't fire at all when a
// backgrounded tab is later killed by the OS rather than explicitly closed, and even when
// it DOES fire, the fetch it kicks off can still be aborted mid-flight the instant the
// page is actually torn down (see the `keepalive` flag added in Net._sendCharacterSave,
// which specifically asks the browser to let this one survive that). So this now saves
// on every signal the platform offers for "the page might be going away", not just one:
//  - beforeunload: still fires reliably on desktop browser tab/window close.
//  - pagehide: the modern, more reliable replacement/companion for beforeunload, and (unlike
//    beforeunload) doesn't risk making the page ineligible for the bfcache we already rely
//    on for the pageshow/persisted reload fix below.
//  - visibilitychange (hidden): the one that actually matters most on mobile -- a
//    backgrounded tab can be suspended or killed without pagehide/beforeunload ever firing
//    in time, but visibilitychange->hidden fires the moment the tab stops being the active
//    one, giving the save a head start before the OS has a chance to kill the page.
function saveOnExit(){ if(PS.current_slot>=0) PS.saveGame(); }
window.addEventListener("beforeunload",saveOnExit);
window.addEventListener("pagehide",saveOnExit);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") saveOnExit(); });

// v0.15 SEVERE BUG FIX: a player hit an unrecoverable progression setback after using the
// BROWSER's own Back button, and re-logging in didn't fix it. Root cause: this whole app
// is one script execution that never touches browser history (GF.goto() only ever
// mutates in-memory state and re-renders, it never calls history.pushState), so hitting
// Back/Forward doesn't navigate within the game at all -- it makes the BROWSER restore an
// entirely different, EARLIER page instance from its bfcache (back/forward cache): a
// frozen snapshot of this exact script's memory (PS, GF, and any still-running
// setInterval timers included) from some earlier point in the session, exactly as it
// looked back then. Timers frozen mid-flight (like the once-a-second regen tick above)
// resume ticking the moment that stale snapshot comes back, and its very next
// `if(changed){ PS.saveGame(); ... }` silently overwrites the server's current, further-
// progressed save with that OLD, frozen character state -- a real, silent rollback that
// looks exactly like "progress just vanished" and explains why logging back in didn't
// help (the corrupted save had already been written to the server by that point).
// The fix: force a full, fresh reload any time the browser hands back a bfcache-restored
// page (the standard `pageshow` + `event.persisted` signal for this), so the game only
// ever runs from a script execution that just freshly fetched the account's latest save,
// never a stale frozen one left over from before a Back/Forward navigation.
window.addEventListener("pageshow",(e)=>{ if(e.persisted) location.reload(); });

const BREW_CRAFT_MS=2000;
// v0.18.1 (#8): the Alchemist's new amount-picker lets a player queue several brews of the
// same recipe in one click -- brewing 5 potions must NOT take 5x as long (5x2s=10s would
// feel awful), so the total animated brew time is capped at this ceiling no matter how many
// are queued. A qty of 1-2 still plays out at the normal per-brew pace (2s/4s); qty>=3 is
// where the cap actually kicks in and the whole batch just finishes faster than "qty x 2s".
const MULTI_BREW_CAP_MS=5000;
function startBrew(recipe,qty=1){
  if(GF.brewing || !PS.canAffordRecipe(recipe,qty)) return;
  const durationMs=Math.min(BREW_CRAFT_MS*qty, MULTI_BREW_CAP_MS);
  GF.brewing={recipeId:recipe.result_item, startedAt:Date.now(), recipe, qty, durationMs};
  render();
  GF.brewInterval=setInterval(()=>{
    if(!GF.brewing){ clearInterval(GF.brewInterval); GF.brewInterval=null; return; }
    if(Date.now()-GF.brewing.startedAt>=GF.brewing.durationMs){
      clearInterval(GF.brewInterval); GF.brewInterval=null;
      const rec=GF.brewing.recipe; const q=GF.brewing.qty||1; GF.brewing=null;
      const result=DL.getItem(rec.result_item);
      if(PS.brewRecipe(rec,q)){ autosave(); setToast(q>1?`Brewed ${q}x ${result.name}!`:`Brewed ${result.name}!`); }
      render();
    } else render();
  },100);
}
function startCraftBag(itemId){
  const item=DL.getItem(itemId);
  const cost=Balance.bagCraftCost(item.capacity||0);
  if(GF.crafting || PS.materials<cost || PS.equipped_bags.length>=Balance.MAX_BAG_SLOTS) return;
  GF.crafting={itemId, startedAt:Date.now()};
  render();
  GF.craftInterval=setInterval(()=>{
    if(!GF.crafting){ clearInterval(GF.craftInterval); GF.craftInterval=null; return; }
    if(Date.now()-GF.crafting.startedAt>=BREW_CRAFT_MS){
      clearInterval(GF.craftInterval); GF.craftInterval=null;
      const id=GF.crafting.itemId; GF.crafting=null;
      const r=PS.craftBag(id);
      if(r.success){ autosave(); setToast(`Crafted ${DL.getItem(id).name}!`); } else setToast(r.reason);
      render();
    } else render();
  },100);
}

// Aggregates every consumable into "N health potions"/"N stamina potions" (collapsing
// the small/greater tiers together, since at a glance players care about the running
// total more than the split) plus any other consumables (elixirs, scrolls) by name.
// Used only in the compact character-detail preview -- the full Inventory screen still
// lists each stack individually since its Use buttons need the specific item id.
function aggregatedConsumableParts(){
  let healthTotal=0, staminaTotal=0; const otherParts=[];
  for(const itemId of Object.keys(PS.consumables)){
    const qty=PS.consumables[itemId]; if(qty<=0) continue;
    const item=DL.getItem(itemId);
    if(item.heal_amount) healthTotal+=qty;
    else if(item.stamina_amount) staminaTotal+=qty;
    else otherParts.push(`${qty}x ${item.name}`);
  }
  const parts=[];
  if(healthTotal>0) parts.push(`${healthTotal} health potion${healthTotal===1?"":"s"}`);
  if(staminaTotal>0) parts.push(`${staminaTotal} stamina potion${staminaTotal===1?"":"s"}`);
  parts.push(...otherParts);
  return parts;
}

// Reuses the same herb SVG icons as the Character Sheet's Herbs list, instead of the
// plain "12x Sunpetal Bloom, 5x Ember Root" text this compact preview used to show --
// the icons are already there and recognizable, the herb name only needs to show up
// as a hover tooltip, not spelled out inline every time.
function herbPreviewRow(){
  const herbEntries=Object.keys(PS.herbs).filter(k=>PS.herbs[k]>0);
  if(herbEntries.length===0) return h("div",{class:"muted"},["Herbs: none"]);
  return h("div",{class:"row gap",style:{alignItems:"center",flexWrap:"wrap"}},[
    h("span",{class:"muted"},["Herbs:"]),
    ...herbEntries.map(k=>h("span",{class:"row",title:DL.getHerb(k).name,style:{alignItems:"center",gap:"2px",cursor:"help"}},[
      herbIcon(k,18),
      h("span",{class:"muted"},[`${PS.herbs[k]}x`]),
    ])),
  ]);
}

function inventoryPreview(){
  const equippedCount=IF.EQUIPPED_SLOT_KEYS.filter(s=>PS.equipped[s]).length;
  const consumableParts=aggregatedConsumableParts();
  return h("div",{class:"col gap",style:{flex:"1",minWidth:"0"}},[
    h("div",{class:"muted"},[`Equipped: ${equippedCount}/${IF.EQUIPPED_SLOT_KEYS.length}`]),
    h("div",{class:"muted"},[`Backpack: ${PS.getInventoryUsed()}/${PS.getInventoryCapacity()}`]),
    h("div",{class:"muted"},[`Bags: ${PS.equipped_bags.length}/${Balance.MAX_BAG_SLOTS}`]),
    h("div",{class:"muted",style:{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},[consumableParts.length?`Consumables: ${consumableParts.join(", ")}`:"Consumables: none"]),
    herbPreviewRow(),
  ]);
}

// v0.12: shown wherever statHeader() is (town/combat/inventory), so it's always visible
// how much of current damage comes from level+stats vs. from equipped gear -- otherwise
// there's no way to tell whether e.g. a +5 damage affix is actually worth chasing.
function damageLine(){
  const d=PS.getDamageBreakdown();
  // v0.18.1 (#14): the "Base" figure is a single flat number (average of the class's
  // base_damage_min/max range plus level/attribute/weapon-skill bonuses), not a range --
  // per Gwen's spec, a range here read as if the *base* itself rolled randomly each hit,
  // when in fact only the final "Damage: X-Y" total (below) reflects the actual combat roll.
  const baseFlat=Math.round((d.baseMin+d.baseMax)/2);
  const gearPart=d.gearBonus>0?`, +${Math.round(d.gearBonus)} from gear`:"";
  // v0.17 (#17c): a 3rd tooltip line, "From skill bonuses", shown only when weaponSkillBonus
  // is actually nonzero -- d.baseMin/baseMax (see getDamageBreakdown()) already folds the
  // weapon-skill bonus into the "Base" line's total, this just breaks that number back out
  // so the player can see how much of it specifically came from weapon proficiency.
  const skillTip=d.weaponSkillBonus>0?`\nFrom skill bonuses: +${Math.round(d.weaponSkillBonus)}`:"";
  return h("div",{class:"muted tooltip",style:{fontSize:".85em"},"data-tip":`Base (level + attributes): ${baseFlat}\nFrom equipped gear: +${Math.round(d.gearBonus)}${skillTip}`},[
    `Damage: ${Math.round(d.totalMin)}-${Math.round(d.totalMax)} (${baseFlat} base${gearPart})`
  ]);
}

// v0.14: mm:ss countdown text for a temporary buff's hover tooltip (Potion of X, the
// Bonfire, etc.) -- ceil()'d so the tooltip never shows "0:00" while the buff is still
// technically active for a fraction of a second.
function formatMsAsMinSec(ms){
  const totalSec=Math.max(0,Math.ceil(ms/1000));
  const m=Math.floor(totalSec/60), s=totalSec%60;
  return `${m}:${s<10?"0":""}${s}`;
}
// v0.14: the 5 new Alchemist stat-buff potions, each shown as a small icon in the player
// status area (statHeader) while active -- hovering shows exactly what's buffed, by how
// much, and the time remaining, per Gwen's explicit request ("mouse over the effect's
// icon should indicate the time remaining").
const POTION_BUFF_DEFS=[
  {type:"strength",emoji:"💪",label:"Potion of Might",suffix:" Strength"},
  {type:"dexterity",emoji:"🏹",label:"Potion of Swiftness",suffix:" Dexterity"},
  {type:"intelligence",emoji:"🧠",label:"Potion of Intellect",suffix:" Intelligence"},
  {type:"block_chance",emoji:"🛡️",label:"Potion of Wardveil",suffix:"% Block Chance"},
  {type:"regen",emoji:"♻️",label:"Potion of Renewal",suffix:" HP/sec and Stamina/sec regen"},
];
function activePotionBuffIcons(){
  const icons=[];
  for(const def of POTION_BUFF_DEFS){
    const amt=PS.getActiveTempBuff(def.type);
    if(amt<=0) continue;
    const msLeft=PS.getTempBuffMsLeft(def.type);
    icons.push(h("span",{title:`${def.label} active: +${amt}${def.suffix}. ${formatMsAsMinSec(msLeft)} remaining.`,style:{marginLeft:"4px",cursor:"help"}},[def.emoji]));
  }
  return icons;
}

function statHeader(opts={}){
  const compact=!!opts.compact;
  const c=PS.getClassData();
  const buffIcons=activePotionBuffIcons();
  // v0.15 BUG FIX: this panel gets a stable id so the once-a-second regen tick (see the
  // setInterval near the bottom of the file) can swap JUST this node in place instead of
  // calling the full render() (app.innerHTML="" + rebuild of the ENTIRE screen). That full
  // teardown-and-rebuild, happening every second on any screen where HP/Stamina wasn't
  // full, was silently swallowing clicks anywhere on the page -- most noticeably the
  // Character Sheet's "<- Back" button at the bottom, which took a beat to reach by
  // scrolling, tester report: "the back button... is not responding". See
  // refreshStatHeaderInPlace() below.
  return h("div",{id:"stat-header-panel",class:"panel",style:{marginBottom:compact?"0":"14px"}},[
    h("div",{class:"row",style:{justifyContent:"space-between",alignItems:"flex-start"}},[
      h("div",{},[
        h("div",{style:{fontWeight:"bold"}},[PS.character_name, PS.hardcore?h("span",{style:{color:"#e07a7a"}},[" [Hardcore]"]):null]),
        h("div",{class:"muted"},[`Lv ${PS.level} ${c.display_name||""}`]),
        damageLine(),
        // v0.17.3 (#16): shows the streak's one remaining effect right alongside the
        // count, since "Kill streak: 7" on its own didn't tell a player what it was
        // actually doing for them anymore -- see Balance.KILL_STREAK_MAGIC_FIND_PCT_PER_KILL.
        PS.kill_streak>0?h("div",{class:"muted"},[`Kill streak: ${PS.kill_streak} (+${PS.kill_streak*Balance.KILL_STREAK_MAGIC_FIND_PCT_PER_KILL}% Magic Find)`]):null,
        // v0.18.2 (#6): always visible (unlike Kill Streak's ">0" gate above) -- 0 is itself
        // a meaningful, common state for this stat, not something worth hiding. Always shows
        // the CURRENT tier's own reputation, matching whichever forest/town this character is
        // presently exploring (see PS.getCurrentForestReputation()'s comment).
        h("div",{class:"muted"},[`Forest Reputation (Tier ${tierRomanNumeral(PS.highest_tier_reached||1)}): ${PS.getCurrentForestReputation()}`]),
        buffIcons.length?h("div",{style:{marginTop:"2px"}},buffIcons):null,
      ]),
      h("div",{class:"row gap",style:{alignItems:"center"}},[
        h("div",{style:{fontWeight:"bold"}},["Character Sheet"]),
        GF.screen==="inventory"?h("span",{class:"muted"},["(open)"]):h("span",{class:"linklike",style:{marginLeft:"2px"},onClick:()=>GF.goto("inventory",{inventory_return_to:GF.screen})},["Open →"]),
        // v0.17 BUG FIX (#13, reported by Ydwros): this "+" shortcut used to render (and stay
        // clickable) even while ALREADY on the Character Sheet -- its onClick unconditionally
        // set inventory_return_to:GF.screen, so clicking it a 2nd time while already on
        // "inventory" set inventory_return_to to "inventory" itself (self-referential). The
        // Back button (screenInventory()'s "<- Back", a few hundred lines down) just does
        // GF.goto(GF.inventory_return_to||"town"), so from that point on Back sent you right
        // back to the Character Sheet you were already trying to leave, permanently trapping
        // navigation until a manual page refresh -- exactly Gwen's own diagnosis of the bug.
        // Fixed the same way "Open ->" just above already handles this (see its GF.screen==
        // "inventory" ? ... ternary): hide the shortcut entirely once you're already here,
        // since the real +/point-spending buttons are right there in attributesPanel() below.
        (PS.unspent_stat_points>0 && GF.screen!=="inventory")?h("span",{class:"stat-point-cta",title:`${PS.unspent_stat_points} unspent stat point${PS.unspent_stat_points===1?"":"s"} -- click to assign them`,onClick:()=>GF.goto("inventory",{inventory_return_to:GF.screen})},["+"]):null,
      ]),
      h("div",{class:"col",style:{alignItems:"flex-end"}},[
        h("div",{class:"gold-text"},[`${PS.gold} gold`]),
        h("div",{class:"muted"},[`${PS.materials} materials`]),
      ]),
    ]),
    h("div",{class:"row",style:{marginTop:"8px",alignItems:"flex-start",gap:"14px"}},[
      h("div",{class:"col",style:{gap:compact?"3px":"8px",flex:"0 0 33%",maxWidth:"33%",minWidth:"0"}},[
        // v0.18.1 (#18): shrine buff icons now use the game's normal styled .tooltip
        // component (data-tip, shown via CSS ::after, tap-to-open on mobile thanks to the
        // shared closestWithClass() click handler) instead of the plain browser `title`
        // attribute they used before -- title tooltips don't show at all on a touch device,
        // so mobile players had no way to see the effect/remaining-duration text.
        h("div",{},[h("span",{class:"xp-text"},[`XP ${PS.xp}/${PS.xp_to_next}`]), PS.xp_buff_encounters_left>0?h("span",{class:"tooltip","data-tip":`Experience shrine active: bonus XP for ${PS.xp_buff_encounters_left} more battle${PS.xp_buff_encounters_left===1?"":"s"}.`,style:{marginLeft:"4px"}},["✨"]):null]),
        // v0.18 (#7): fillId + the bar-fill-xp-grow modifier class let animateXpBarGrowth()
        // (called right after a kill's render()) find this exact node and ease it up to its
        // new width over ~1s instead of the width just snapping to place. See that function's
        // own comment for how it triggers a CSS transition on a node render() just rebuilt.
        bar(PS.xp/PS.xp_to_next*100,"bar-xp bar-fill-xp-grow",compact,"stat-xp-bar-fill"),
        // v0.17 (#3): the HP text + bar render in a distinct poison-green (not the usual
        // HP-red) for the duration of the Poison effect, reverting the instant it ends --
        // see the .hp-text-poisoned/.bar-hp-poisoned CSS rules. v0.17 (#8): the status icon
        // itself is a green nausea/illness glyph now (was a skull, which read more like a
        // death warning than an ongoing status effect) and fades out via the .poison-icon
        // CSS transition once poison ends, instead of staying stuck on screen -- see
        // refreshStatHeaderInPlace()/the poison drain tick for how the opacity actually
        // gets toggled on the tick poison expires.
        h("div",{},[h("span",{id:"stat-hp-text",class:PS.isPoisoned()?"hp-text hp-text-poisoned":"hp-text"},[`HP ${Math.round(PS.current_hp)}/${Math.round(PS.getMaxHp())}`]), PS.isPoisoned()?h("span",{id:"stat-poison-icon",class:"poison-icon",title:`Poisoned: draining ${PS.getPoisonHpPerSec().toFixed(1)} HP/sec for ${formatMsAsMinSec(PS.getPoisonMsLeft())} more (won't drop you below 1 HP on its own).`,style:{marginLeft:"4px",opacity:"1"}},["🤢"]):null,
        // v0.17.1 (#12): Touch of Unicorn (Invulnerability shrine) indicator right at the HP
        // status, per Gwen's exact spec -- a unicorn icon with the remaining round count.
        // v0.18.1 (#26): wording no longer says "combat round(s)" only -- the same charge
        // pool now also blocks a maze trap's damage/poison (see onStepMaze()'s "trap" cell
        // handling), so a round can be spent outside of combat too.
        PS.isInvulnerable()?h("span",{class:"tooltip","data-tip":`Touch of Unicorn: immune to damage/poison for ${PS.invuln_rounds_left} more round(s) (combat or traps).`,style:{marginLeft:"4px"}},["🦄"]):null,
        // v0.17.3 (#7) BUG FIX: the Quad Damage shrine buff never actually had an icon
        // anywhere in the UI (only the combat log's "(Quad Damage!)" line hinted at it,
        // and only during an active fight) -- once you left combat (e.g. reaching the
        // exit and descending to the next maze level), there was NO visible indicator the
        // buff was still ticking down at all, even though PS.quad_dmg_rounds_left was
        // correctly carried over and still applied in the next fight. Reported as "the
        // icon disappeared" -- it never existed to begin with. Mirrors the Unicorn icon
        // above exactly (same HP-row placement, same round-count tooltip).
        PS.hasQuadDamage()?h("span",{class:"tooltip","data-tip":`Quad Damage: 4x damage output for ${PS.quad_dmg_rounds_left} more combat round(s).`,style:{marginLeft:"4px"}},["⚡"]):null,
        // v0.17.3 (#8): visible feedback that a potion's heal-over-time is actually in
        // progress (otherwise the HP bar just creeps up with no explanation) -- kept in
        // sync on every fast heal sub-tick by refreshStatHeaderInPlace() below, same
        // pattern as the poison/regen indicators above.
        h("span",{id:"stat-healing-text",class:"muted",style:{marginLeft:"4px",display:PS.getHealPerSecond()>0?"inline":"none"}},[`(healing +${PS.getHealPerSecond().toFixed(1)}/sec)`])]),
        hpBar(compact),
        h("div",{},[h("span",{id:"stat-stamina-text",class:"stamina-text"},[`Stamina ${Math.round(PS.current_stamina)}/${Math.round(PS.getMaxStamina())}`]), PS.stamina_shrine_buff>0?h("span",{class:"tooltip","data-tip":`Stamina shrine active: ${Math.round(PS.stamina_shrine_buff)} bonus stamina in reserve.`,style:{marginLeft:"4px"}},["✨"]):null,
        // v0.18.1 (#20): stamina potions now heal gradually too -- same "(recovering +X.X/sec)"
        // indicator as the HP row above, kept in sync by refreshStatHeaderInPlace().
        h("span",{id:"stat-stamina-healing-text",class:"muted",style:{marginLeft:"4px",display:PS.getStaminaHealPerSecond()>0?"inline":"none"}},[`(recovering +${PS.getStaminaHealPerSecond().toFixed(1)}/sec)`])]),
        staminaBar(compact),
      ]),
      inventoryPreview(),
    ]),
  ]);
}

// v0.16.1 (#345): restyled to match redirect.html -- login/register logic itself
// (Net.login/Net.register/Net.afterAuth, the try/catch error surface) is UNCHANGED, only
// the DOM/classes changed, see authHeader()/authSocialRow()/the .auth-* CSS rules above.
function authForm(mode){
  const isLogin=mode==="login";
  const root=h("div",{class:"auth-page"});
  const card=h("div",{class:"auth-card"});
  card.appendChild(authHeader());
  const t=toastBox(); if(t) card.appendChild(t);
  const userInput=h("input",{class:"auth-input",type:"text",placeholder:"Username"});
  const passInput=h("input",{class:"auth-input",type:"password",placeholder:"Password"});
  const emailInput=isLogin?null:h("input",{class:"auth-input",type:"email",placeholder:"Email (optional)"});
  const statusDiv=h("div",{class:"auth-status"},[""]);
  const submit=async ()=>{
    const username=userInput.value.trim(), passcode=passInput.value;
    const email=emailInput?emailInput.value.trim():"";
    statusDiv.textContent="Working...";
    try{
      const json = isLogin ? await Net.login(username,passcode) : await Net.register(username,passcode,email);
      await Net.afterAuth(json.username, json.token);
      setToast(`Welcome, ${json.username}!`);
      GF.goto("mainMenuSlots");
    }catch(e){
      statusDiv.textContent = e.message || "Something went wrong. Is the game server reachable?";
    }
  };
  card.appendChild(h("div",{class:"auth-panel col gap"},[
    h("h2",{},[isLogin?"Welcome Back":"Create Your Account"]),
    authSocialRow(),
    userInput, passInput, emailInput,
    isLogin?null:h("div",{class:"muted",style:{marginTop:"-6px"}},["Email is optional, just a nice-to-have. Jump in with only a username and password if you'd rather not share one yet."]),
    h("button",{class:"auth-cta",style:{marginTop:"4px"},onClick:submit},[isLogin?"Log In":"Create Account"]),
    statusDiv,
  ]));
  card.appendChild(h("div",{class:"auth-footer"},[h("span",{class:"auth-back",onClick:()=>GF.goto("authGate")},["← Back"])]));
  root.appendChild(card);
  return root;
}
function screenLogin(){ return authForm("login"); }
function screenRegister(){ return authForm("register"); }

        GF.goto("town");
      }},["Begin as "+c.display_name]),
    ]));
  }
  root.appendChild(grid);
  return root;
}

// v0.16 (#334): the flower/herb tribute strip shown at the bottom of each grave tile in
// screenGraveyard(). Only meaningful against the real server (needs a stable grave `id`
// and a place to store who's left a tribute -- see GET/POST /api/graveyard[/:id/tribute]),
// so it renders nothing at all for an entry that doesn't carry an `id` (e.g. a graveyard
// entry synthesized purely client-side by Net.deleteCharacter()'s optimistic unshift,
// before the real server row and its id have actually round-tripped back down yet).
function graveTributeSection(entry){
  if(!Net.online || entry.id==null) return null;
  const tributes=entry.tributes||[];
  const alreadyTributed=tributes.includes(Net.username);
  return h("div",{style:{marginTop:"8px",paddingTop:"6px",borderTop:"1px solid #333"}},[
    h("div",{class:"muted",style:{fontSize:".78em",minHeight:"1.4em"}},[
      tributes.length>0 ? `🌸 Tribute${tributes.length===1?"":"s"} from: ${tributes.join(", ")}` : "No tributes left yet.",
    ]),
    h("button",{
      style:{fontSize:".8em",marginTop:"4px",padding:"3px 10px"},
      title:"Leave a flower (or a mocking bouquet) at this grave, purely for show, everyone visiting the Graveyard will see your name here.",
      disabled:alreadyTributed,
      onClick:()=>{
        Net.leaveTribute(entry.id)
          .then(()=>{ setToast("You leave a small tribute at the grave."); render(); })
          .catch(err=>{ setToast(err.message); render(); });
      },
    },[alreadyTributed?"🌸 Tribute left":"🌸 Leave a Tribute"]),
  ]);
}

function classChainEntries(chainId){
  return Object.entries(CLASSES).filter(([id,c])=>c.chain===chainId).sort((a,b)=>a[1].tier-b[1].tier);

// Small square badge shown left of each path's title, marking that chain's primary
// damage/attribute stat at a glance: a textured square (soft fill, darker border, a
// corner dot in each corner) with a colored nature-themed glyph inside -- a rock for
// Thornguard's Strength, and a leaf (in each chain's own hue) for the two Dexterity/
// Intelligence-driven paths.
function primaryAttrBadgeSvg(chainId){
  const palette={
    wizard:{bg:"#2a2450",border:"#6a53c9",fg:"#9d86f5"},      // blue/purple -- Intelligence
    thornguard:{bg:"#3a2420",border:"#9c453a",fg:"#d1594a"},  // red -- Strength
    windrider:{bg:"#1f3520",border:"#4a8a45",fg:"#6cc466"},   // green -- Dexterity
  }[chainId]||{bg:"#2c2c2c",border:"#666",fg:"#999"};
  const glyph=chainId==="thornguard"
    ? `<path d="M20,8 L30,15 L27,30 L13,30 L10,15 Z" fill="${palette.fg}" stroke="${palette.border}" stroke-width="1.4" stroke-linejoin="round"/>
       <path d="M20,8 L20,17 L27,30 M20,17 L13,30" fill="none" stroke="${palette.border}" stroke-width="1" opacity="0.55"/>`
    : `<path d="M20,9 C29,10 31,20 25,27 C21,32 15,31 13,26 C8,18 11,10 20,9 Z" fill="${palette.fg}" stroke="${palette.border}" stroke-width="1.3" stroke-linejoin="round"/>
       <path d="M20,10 C19,17 19,24 15,29" fill="none" stroke="${palette.border}" stroke-width="1" opacity="0.6"/>`;
  return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <rect x="2" y="2" width="36" height="36" rx="7" fill="${palette.bg}" stroke="${palette.border}" stroke-width="2"/>
    <circle cx="7.5" cy="7.5" r="1.5" fill="${palette.border}"/>
    <circle cx="32.5" cy="7.5" r="1.5" fill="${palette.border}"/>
    <circle cx="7.5" cy="32.5" r="1.5" fill="${palette.border}"/>
    <circle cx="32.5" cy="32.5" r="1.5" fill="${palette.border}"/>
    ${glyph}
  </svg>`;
}

// v0.18 (#17): renders leaderboard_bests.updated_at (exposed by the server as
// last_active_at -- see server.js's /api/leaderboard handler) as a human-readable "Last
// seen" string. Mirrors the 5-minute "currently playing" window from #14/#427's
// /api/active-players so a character within that window reads "Online now" instead of
// "0m ago", but this is purely a display nicety -- no shared state with that feature.
function formatLastSeen(iso){
  if(!iso) return "Unknown";
  const then=new Date(iso).getTime();
  if(isNaN(then)) return "Unknown";
  const diffMs=Date.now()-then;
  if(diffMs<0) return "Online now";
  const mins=Math.floor(diffMs/60000);
  if(mins<5) return "Online now";
  if(mins<60) return `${mins}m ago`;
  const hours=Math.floor(mins/60);
  if(hours<24) return `${hours}h ago`;
  const days=Math.floor(hours/24);
  if(days<30) return `${days}d ago`;
  return new Date(iso).toLocaleDateString();
}

function leaderboardLadderTab(){

    root.appendChild(h("div",{class:"muted"},["Loading..."]));

    return root;
  }
  const entries=Net.leaderboardCache;
  if(entries.length===0) root.appendChild(h("div",{class:"muted"},["No one has made a mark yet, be the first!"]));

  const totalPages=Math.max(1,Math.ceil(entries.length/LEADERBOARD_PAGE_SIZE));
  if(GF.leaderboardPage==null) GF.leaderboardPage=0;
  if(GF.leaderboardPage>=totalPages) GF.leaderboardPage=totalPages-1;
  if(GF.leaderboardPage<0) GF.leaderboardPage=0;
  const pageStart=GF.leaderboardPage*LEADERBOARD_PAGE_SIZE;
  const pageEntries=entries.slice(pageStart,pageStart+LEADERBOARD_PAGE_SIZE);

  if(entries.length>0) root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px"}},[`${entries.length} player${entries.length===1?"":"s"} on the board.`]));

  pageEntries.forEach((e,i)=>{

    const style={marginBottom:"6px",justifyContent:"space-between"};
    if(isMine){ style.background="#20304a"; }

    // v0.17.1 (#5): the gold border is back, but only as a prestige indicator on the #1
    // overall record (idx is the absolute rank across all pages, 0-indexed) -- not on every
    // hardcore row like the pre-v0.15 version, which read as noise once most of the board
    // was hardcore players.
    if(idx===0){ style.border="2px solid #d4af37"; }
    const nameStyle={fontWeight:"bold"};
    // v0.18.1 (#15): the footstep icon read as visual noise and made this line hard to
    // parse at a glance -- replaced with plain "Step X/N" text, still inside the "(Tier N
    // ...)" parenthetical established in v0.17.1 (#4).
    // v0.18.1 (#30): Roman numeral for the tier number everywhere, matching the gear-tile
    // tier badge -- and per Gwen's exact spec, a bare "(Tier 2)" tag with nothing else in it
    // collapses all the way to "(II)" (word dropped too), while the tag WITH the Step count
    // alongside it keeps the "Tier" label since "(II, Step 3/8)" alone would read as unclear.
    const tierNode=(e.last_bridge_steps>0)
      ? h("span",{},[`(Tier ${tierRomanNumeral(e.highest_tier_reached)}, Step ${e.last_bridge_steps}/${Balance.BRIDGE_ROWS})`])
      : h("span",{},[`(${tierRomanNumeral(e.highest_tier_reached)})`]);
    root.appendChild(h("div",{class:"tile row",style},[
      h("div",{},[
        h("span",{class:"muted"},[`#${idx+1} `]),
        isDead?h("span",{style:{marginRight:"4px"},title:"Fallen"},["🪦"]):null,
        h("span",{style:nameStyle},[`${e.character_name}`]),
        h("span",{class:"muted"},[` (${e.player})`]),
        // v0.16: [Hardcore]/[Dead] now use the same red (#e07a7a) as the "[Hardcore]" tag
        // on the player's own stat header (statHeader()), instead of the gold used since
        // v0.15 -- Gwen's ask was for the leaderboard tags to match that existing color.
        e.hardcore?h("span",{style:{color:"#e07a7a",fontWeight:"bold"}},[" [Hardcore]"]):null,
        isDead?h("span",{style:{color:"#e07a7a",fontWeight:"bold"}},[" [Dead]"]):null,
        inspectPlayerButton(e.account_id,e.character_name),
      ]),
      // v0.18.1 (#34): grouped into one right-hand column (instead of 2 separate flex
      // children of the outer space-between row) so this text always hugs the right edge
      // regardless of how long the name/account block on the left happens to be -- before,
      // 3 siblings sharing space-between let this stats line drift to wherever the leftover
      // space put it, scattering the Lv/Tier/Exp values inconsistently row to row.
      h("div",{style:{textAlign:"right"}},[
        // v0.17.3 (#14): Gold dropped from this row -- see the new Gold tab
        // (leaderboardGoldTab()) for the account-bound gold total instead.
        // v0.18.1 (#16): shows e.xp (this character's progress toward ITS current level)
        // instead of e.lifetime_xp (a monotonic lifetime total that never resets) -- a
        // character rerolled to Level 1 by a failed Broken Bridge Trial was still showing
        // its old lifetime total here, which read as a bug ("Lv1 ... 4127 Experience").
        h("div",{class:"muted row",style:{alignItems:"center",gap:"4px",flexWrap:"wrap",justifyContent:"flex-end"},title:e.last_bridge_steps>0?"Bridge steps completed before their most recent Broken Bridge Trial failure":undefined},[
          h("span",{},[`Lv ${e.level} ${e.class_name} `]), tierNode, h("span",{},[`, ${e.xp||0} Experience`]),

        // exposed by the server as `last_active_at`.
        h("div",{class:"muted",style:{fontSize:".85em",marginTop:"2px"}},[`Last seen: ${formatLastSeen(e.last_active_at)}`]),
      ]),
    ]));
  });

  if(totalPages>1){
    root.appendChild(h("div",{class:"row gap",style:{alignItems:"center",justifyContent:"center",marginTop:"10px"}},[

    ]));

// v0.17.3 (#13): computes, for each of the 6 weapon types + Herbalism, the top 5 characters
// ranked by (skill level DESC, points-into-current-level DESC) -- matching Gwen's example
// format literally ("Wand Skill" 1. Fien Lv1 (123/200) ...). Levels/progress are derived
// from the raw hit/point counters using the EXACT same Balance formulas the character
// sheet's own skillsBonusPanel() uses (Balance.weaponSkillLevelForHits/
// weaponSkillCumulativeHitsForLevel, Balance.herbalismLevelForPoints/
// herbalismCumulativePointsForLevel) -- there's exactly one place this math lives.
function computeSkillRankings(){
  const entries=Net.leaderboardSkillsCache||[];
  const result={};
  for(const t of IF.WEAPON_TYPE_LIST){
    const rows=entries.map(e=>{
      const hits=(e.weapon_skills && e.weapon_skills[t] && e.weapon_skills[t].hits)||0;
      const level=Balance.weaponSkillLevelForHits(hits);
      const atStart=Balance.weaponSkillCumulativeHitsForLevel(level);
      const forNext=Balance.weaponSkillCumulativeHitsForLevel(level+1)-atStart;
      const into=hits-atStart;
      return {account_id:e.account_id, character_name:e.character_name, player:e.player, is_dead:e.is_dead, level, into, forNext};
    }).filter(r=>r.level>0||r.into>0);
    rows.sort((a,b)=> b.level-a.level || b.into-a.into);
    result[t]=rows.slice(0,5);
  }
  const herbRows=entries.map(e=>{
    const points=e.herbalism_points||0;
    const level=Balance.herbalismLevelForPoints(points);
    const atStart=Balance.herbalismCumulativePointsForLevel(level);
    const forNext=Balance.herbalismCumulativePointsForLevel(level+1)-atStart;
    const into=points-atStart;
    return {account_id:e.account_id, character_name:e.character_name, player:e.player, is_dead:e.is_dead, level, into, forNext};
  }).filter(r=>r.level>0||r.into>0);
  herbRows.sort((a,b)=> b.level-a.level || b.into-a.into);
  result.herbalism=herbRows.slice(0,5);
  return result;
}

function leaderboardSkillsTab(){
  const root=h("div",{});

  const names=Balance.TOWN_NAMES;

function getVentureDepth(){
  const max=PS.max_maze_depth_reached||1;
  if(GF.ventureDepth==null || GF.ventureDepth<1){
    GF.ventureDepth=max;
  } else if(max>(GF.lastKnownMaxDepth||1)){
    // A new max depth was just unlocked (reached a fresh exit since we last checked) --
    // default the venture depth up to it immediately, same as a brand new character
    // would start at their max. Without this, the selector stayed frozen at whatever
    // depth was picked before, even though + could still manually reach the new max.
    GF.ventureDepth=max;
  } else if(GF.ventureDepth>max){
    GF.ventureDepth=max; // safety clamp, e.g. a stale/loaded value above the real max
  }
  GF.lastKnownMaxDepth=max;
  return GF.ventureDepth;
}

// v0.13: "Kindle the Bonfire" replaces the old click-to-toggle "Rest at the Bonfire"
// button. Regen itself is now always-on in town (see REGEN_ACTIVE_SCREENS/the regen tick),
// this panel is purely about spending Dry Logs for a temporary +7/log bonus to both HP and
// Stamina regen.
// v0.16 rework: dropped the "pick a quantity with chevrons, then confirm" 2-step flow --
// each click of the right-hand button instantly feeds ONE Dry Log (if you have any), so
// feeding 2 logs is just 2 clicks, no staging step. While the bonfire is actively surging,
// the left card itself becomes disabled and relabeled "Kindled Bonfire" with a live
// remaining-time subtext; the button on the right stays live the whole time so you can
// keep throwing more logs on to stack the bonus higher (see PS.kindleBonfire()).
function kindleBonfirePanel(){
  const have=PS.consumables["dry_branch"]||0;
  const activeBonus=PS.getActiveBonfireBonus();
  const isKindled=activeBonus>0;
  const msLeft=isKindled?Math.max(0,(PS.bonfire_bonus_expires_at||0)-Date.now()):0;

  const subtext = isKindled
    ? `${formatMsAsMinSec(msLeft)} remaining (+${Math.round(activeBonus)} HP/sec and +${Math.round(activeBonus)} Stamina/sec regen).`
    : "The bonfire grants everyone in town +1 regeneration rate. But, if you throw Dry Logs into the fire, it surges temporarily, granting +7 increased regeneration rate per second, for 10 minutes.";

  return h("div",{class:"row venture-row"},[
    h("div",{class:"panel venture-card venture-fill"+(isKindled?"":" venture-clickable"),style:isKindled?{opacity:"0.75",cursor:"default"}:{},onClick:isKindled?null:()=>{
      setToast("Use the log button to feed the fire.");
      render();
    }},[
      h("div",{class:"venture-title"},[inlineIcon(BONFIRE_SVG,18)," ", isKindled?"Kindled Bonfire":"Kindle the Bonfire"]),
      // v0.16 (#331): stable id only while kindled -- lets refreshBonfireCountdownInPlace()
      // (see the regen tick) patch just this text node's seconds every tick instead of
      // doing a full render(), same reasoning as refreshStatHeaderInPlace()/#328.
      h("div",{id:isKindled?"bonfire-countdown-text":undefined,class:"muted",style:{fontSize:".8em",marginTop:"2px"}},[subtext]),
    ]),
    h("div",{class:"panel venture-chevrons"},[
      h("div",{class:"muted",style:{fontSize:".72em"}},[`Logs (${have})`]),
      h("button",{disabled:have<=0,onClick:(e)=>{
        e.stopPropagation();
        const ok=PS.kindleBonfire(1);
        if(ok){
          autosave();
          pushSystemChatMessage("You feed 1 Dry Log into the bonfire. Regen surges for 10 minutes.");
        }
        render();
      }},["+1"]),
    ]),
  ]);
}
