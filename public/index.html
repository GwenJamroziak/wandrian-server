  active_heals:[],
  // v0.18.1 (#20): Stamina Potions now heal gradually too, exactly mirroring active_heals
  // above (same _queueGradualHeal() helper, same single-entry invariant, same tick cadence).
  active_stamina_heals:[],
  // v0.14: temporary stat-buff potions (Intellect/Might/Swiftness/Wardveil/Renewal), each a
  // wall-clock timed buff keyed by type ("intelligence"/"strength"/"dexterity"/
  // "block_chance"/"regen") -> {amount, expires_at}. Same Date.now()-expiry pattern as the
  // Bonfire's kindled bonus (see getActiveBonfireBonus), so it keeps ticking down even if
  // you leave town, and re-using a potion before the old buff expires simply replaces it
  // (not additive/stacking) rather than refusing the drink.
  temp_buffs:{},

  // Stat Points / Attributes (v0.10). `attributes` is base class value + spent points
  // only, it deliberately excludes gear, see getTotalAttr(). `bonus_hp_from_attributes`/
  // `bonus_stamina_from_attributes` are cumulative totals built up one level-up at a time
  // (see addXp()): each level-up adds that moment's Vitality (and, for the paths where
  // Strength grants HP instead of damage, that moment's Strength too) to these pools, and
  // the pools only ever grow, previously granted HP/Stamina isn't lost by reallocating
  // points later, matching a real Diablo-style build where early investment compounds.
  attributes:{str:0,dex:0,vit:0,int:0}, unspent_stat_points:0,
  bonus_hp_from_attributes:0, bonus_stamina_from_attributes:0,

  // Weapon skill / proficiency (v0.12). Purely additive hit counters per weapon type,
  // never reset by anything (not promotion, not a season reset) -- see IF.WEAPON_TYPE_LIST
  // and Balance.weaponSkillLevelForHits(). Lazily backfilled by ensureWeaponSkills() so
  // pre-v0.12 saves and brand new characters both start every type at 0/0.
  weapon_skills:{},

  // Herbalism proficiency (v0.17.1 #7). A single permanent point counter, unlike weapon
  // skills there's only one herbalism track (not per-herb-type) -- see
  // Balance.herbalismLevelForPoints/herbalismCumulativePointsForLevel and
  // registerHerbalismStrike() (called once per Gather-button click in screenHerbEncounter).
  herbalism_points:0,

  getClassData(){return DL.getClass(this.class_id);},
  ensureWeaponSkills(){
    for(const t of IF.WEAPON_TYPE_LIST) if(!this.weapon_skills[t]) this.weapon_skills[t]={hits:0};
  },
  getEquippedWeaponType(){ return IF.weaponTypeForInstance(this.equipped.weapon); },
  getWeaponSkillHits(weaponType){ this.ensureWeaponSkills(); return (this.weapon_skills[weaponType]||{hits:0}).hits; },
  getWeaponSkillLevel(weaponType){ return Balance.weaponSkillLevelForHits(this.getWeaponSkillHits(weaponType)); },
  // Progress toward the NEXT level, for progress-bar display (e.g. "37/100").
  getWeaponSkillProgress(weaponType){
    const hits=this.getWeaponSkillHits(weaponType);
    const level=Balance.weaponSkillLevelForHits(hits);
    const hitsAtLevelStart=Balance.weaponSkillCumulativeHitsForLevel(level);
    const hitsForNextLevel=Balance.weaponSkillCumulativeHitsForLevel(level+1)-hitsAtLevelStart;
    const hitsIntoLevel=hits-hitsAtLevelStart;
    return {level, hits, hitsIntoLevel, hitsForNextLevel};
  },
  // Called once per player attack (see screenCombat's playerTurn) when a weapon of a
  // known type is equipped. Returns whether this hit pushed the type to a new level, so
  // the caller can surface a small "your Sword skill increased!" toast.
  registerWeaponHit(weaponType){
    this.ensureWeaponSkills();
    const before=Balance.weaponSkillLevelForHits(this.weapon_skills[weaponType].hits);
    this.weapon_skills[weaponType].hits++;
    const after=Balance.weaponSkillLevelForHits(this.weapon_skills[weaponType].hits);
    return {leveledUp:after>before, newLevel:after};
  },
  getHerbalismPoints(){ return this.herbalism_points||0; },
  getHerbalismLevel(){ return Balance.herbalismLevelForPoints(this.getHerbalismPoints()); },
  // Progress toward the NEXT level, for progress-bar display -- same shape/naming
  // convention as getWeaponSkillProgress() above, just "points" instead of "hits".
  getHerbalismProgress(){
    const points=this.getHerbalismPoints();
    const level=Balance.herbalismLevelForPoints(points);
    const pointsAtLevelStart=Balance.herbalismCumulativePointsForLevel(level);
    const pointsForNextLevel=Balance.herbalismCumulativePointsForLevel(level+1)-pointsAtLevelStart;
    const pointsIntoLevel=points-pointsAtLevelStart;
    return {level, points, pointsIntoLevel, pointsForNextLevel};
  },
  // v0.17.1 (#7) / v0.18.1 (#25): originally called once per Gather-button click (1 point
  // per "strike", awarded immediately) -- but that let a player farm free herbalism points
  // by clicking Gather exactly once on a node, then "Leave it" before it finished, walking
  // back onto a fresh node, and repeating forever with zero risk and no herb ever actually
  // collected. Fixed by only ever calling this ONCE, from screenHerbEncounter, at the exact
  // moment a node is FULLY harvested -- passing the node's total required strikes as
  // `count` so a herb requiring 4 strikes still nets exactly 4 points overall, just all at
  // once on completion instead of trickling in per click. Returns whether this pushed
  // herbalism to a new level, same {leveledUp, newLevel} shape as registerWeaponHit().
  registerHerbalismStrike(count=1){
    const before=this.getHerbalismLevel();
    this.herbalism_points=(this.herbalism_points||0)+count;
    const after=this.getHerbalismLevel();
    return {leveledUp:after>before, newLevel:after};
  },
  getTotalAttr(key){
    const gearStat={str:"strength",dex:"dexterity",vit:"vitality",int:"intelligence"}[key];
    // v0.14: Potion of Might/Swiftness/Intellect apply a temporary buff under the same
    // name as the gear stat (strength/dexterity/intelligence), so it folds in here
    // automatically -- damage scaling, block chance, etc. all read through getTotalAttr().
    return (this.attributes[key]||0)+this.gearBonus(gearStat)+this.getActiveTempBuff(gearStat);
  },
  spendStatPoint(key){
    if(this.unspent_stat_points<=0 || !this.attributes.hasOwnProperty(key)) return false;
    this.attributes[key]++; this.unspent_stat_points--; return true;
  },
  getBlockChance(){
    // v0.12: Dexterity grants Block Chance on all 3 chains now, including Windrider,
    // where it doubles up as both the damage stat AND the block stat for that path.
    // v0.14: Potion of Wardveil adds a flat temporary block_chance buff (stored as
    // percentage points, e.g. 15 -> +15%) on top of the Dexterity-derived amount.
    return clampf(this.getTotalAttr("dex")*Balance.BLOCK_CHANCE_PER_DEX+this.getActiveTempBuff("block_chance")/100.0,0,Balance.BLOCK_CHANCE_MAX);
  },
  // v0.17.3 (#2/#3): `startingPoints` lets callers grant more than the default -- a failed
  // Broken Bridge Trial attempt bumps this above Balance.STARTING_STAT_POINTS (see
  // resolveMasterTrial()). Defaults to the base amount for brand new characters and any
  // other caller that doesn't care about the bridge-failure bonus.
  _resetAttributesToClassBase(startingPoints){
    const c=this.getClassData();
    this.attributes={str:c.base_str||5, dex:c.base_dex||5, vit:c.base_vit||5, int:c.base_int||5};
    this.unspent_stat_points=startingPoints!=null?startingPoints:Balance.STARTING_STAT_POINTS;
    this.bonus_hp_from_attributes=0; this.bonus_stamina_from_attributes=0;
  },
  gearBonus(stat){
    let total=0;
    for(const slot of IF.EQUIPPED_SLOT_KEYS){
      const inst=this.equipped[slot];
      // v0.17 (#25): an item whose level requirement is no longer met (e.g. a Tier 2 item
      // left equipped through a Broken Bridge Trial demotion back to level 1) is excluded
      // from every stat calculation here -- this is the ONE function every gear-derived
      // getter (getTotalAttr/getMaxHp/getDamageBreakdown/getArmor/getGearBonusLines/etc.)
      // routes through, so filtering here is enough to make an invalid item behave exactly
      // as if the slot were empty everywhere, without needing to touch every caller. See
      // isEquippedSlotInvalid() for the UI-facing red-flag check, and equipSlotTile() for
      // where it's shown. The item is deliberately NOT auto-unequipped -- Gwen's spec: the
      // player must manually unequip or swap it themselves.
      if(inst && this.canEquipGear(inst)) total+=IF.affixTotal(inst,stat);
    }
    return total;
  },
  // v0.17 (#25): true if the item currently in this equip slot no longer meets its own
  // level requirement (see gearBonus() above for why this can happen and how it's excluded
  // from combat/stat math). Used purely for the equipped-slot UI's red "invalid" flag.
  isEquippedSlotInvalid(slot){
    const inst=this.equipped[slot];
    return !!(inst && !this.canEquipGear(inst));
  },
  getMaxHp(){const c=this.getClassData(); return (c.base_hp||50)+(c.hp_per_level||5)*(this.level-1)+this.gearBonus("hp")+this.bonus_hp_from_attributes;},
  // v0.12: split out so the UI can show "base damage (from level+stats)" separately from
  // "bonus damage (from currently equipped gear)" -- previously these were only visible
  // combined, so a player had no way to tell whether e.g. +5 damage on a ring was actually
  // meaningful next to their level/attribute damage without doing the subtraction by hand.
  getDamageBreakdown(){
    const c=this.getClassData(); const perLevel=(c.damage_per_level||1.0)*(this.level-1);
    const gearBonus=this.gearBonus("damage");
    // Each chain has one attribute that scales its damage directly (base+points+gear,
    // recalculated live, unlike the HP/Stamina attribute bonuses below, this is not a
    // cumulative per-level-up pool, just "however much of that stat you currently have").
    let statBonus=0;
    if(c.chain==="thornguard") statBonus=this.getTotalAttr("str");
    else if(c.chain==="windrider") statBonus=this.getTotalAttr("dex");
    else if(c.chain==="wizard") statBonus=this.getTotalAttr("int");
    // v0.12: permanent weapon-type proficiency (see registerWeaponHit) grants a flat
    // +1 damage per level while a weapon of that type is currently equipped -- this is
    // deliberately kept separate from gearBonus, it comes from the character, not the item.
    const weaponType=this.getEquippedWeaponType();
    const weaponSkillBonus=weaponType ? this.getWeaponSkillLevel(weaponType)*Balance.WEAPON_SKILL_DAMAGE_PER_LEVEL : 0;
    const baseMin=(c.base_damage_min||1)+perLevel+statBonus+weaponSkillBonus, baseMax=(c.base_damage_max||2)+perLevel+statBonus+weaponSkillBonus;
    return {baseMin, baseMax, gearBonus, weaponSkillBonus, totalMin:baseMin+gearBonus, totalMax:baseMax+gearBonus};
  },
  getDamageRange(){
    const d=this.getDamageBreakdown();
    return [d.totalMin, d.totalMax];
  },
  getCritChance(){const c=this.getClassData(); return clampf((c.base_crit||0.05)+this.gearBonus("crit")/100.0,0,0.95);},
  getArmor(){const c=this.getClassData(); return clampf((c.armor||0.0)+this.gearBonus("armor")/100.0,0,0.75);},
  // v0.16: defensive stat, 0-100%, reduces the Poison effect's HP/sec drain proportionally
  // (100% = fully immune). Purely gear-driven for now (see AFFIX_POOL/AFFIX_TIER1_MAX's
  // poison_resist entry) -- no class innately has any.
  getPoisonResistance(){return clampf(this.gearBonus("poison_resist"),0,100);},
  // v0.17.1 (#12): Magic Find -- gear affix total (see AFFIX_POOL's magic_find entry) plus
  // the temporary Magic Find shrine buff (see applyMagicFindShrineBuff()/getActiveTempBuff),
  // combined additively. Feeds Balance.rollRarity()'s mfPct param via IF.generate().
  // v0.17.3 (#16): Kill Streak's ONLY effect is folded in here too -- +1% per kill in the
  // current streak (Balance.KILL_STREAK_MAGIC_FIND_PCT_PER_KILL), reset the moment the
  // streak resets (see PS.resetKillStreak(), called on returning to town/dying). See that
  // constant's comment for why the streak no longer touches monster stats or gold/XP/loot
  // quantity the way it used to.
  getMagicFind(){return clampf(this.gearBonus("magic_find")+this.getActiveTempBuff("magic_find")+(this.kill_streak||0)*Balance.KILL_STREAK_MAGIC_FIND_PCT_PER_KILL,0,500);},
  // v0.17.1 (#12): Magic Find shrine -- reuses the existing wall-clock temp-buff system
  // (see applyTempBuff/getActiveTempBuff, the same mechanism the Alchemist's stat potions
  // use), since Magic Find affects loot rolls (chests, kills) rather than anything
  // combat-round-scoped.
  applyMagicFindShrineBuff(){ this.applyTempBuff("magic_find", Balance.SHRINE_MAGIC_FIND_PCT, Balance.SHRINE_MAGIC_FIND_DURATION_MS); },
  // v0.17.1 (#12): Invulnerability ("Touch of Unicorn") and Quad Damage shrines are both
  // scoped to COMBAT ROUNDS, not wall-clock time, per Gwen's exact spec -- see
  // tickCombatRoundBuffs(), called once per round in screenCombat()'s playerTurn(). Stacks
  // additively if re-triggered while already active (same precedent as the Bonfire's
  // per-log regen bonus), rather than just refreshing to a flat 15.
  applyInvulnShrineBuff(){ this.invuln_rounds_left=(this.invuln_rounds_left||0)+Balance.SHRINE_INVULN_ROUNDS; },
  isInvulnerable(){ return (this.invuln_rounds_left||0)>0; },
  applyQuadDamageShrineBuff(){ this.quad_dmg_rounds_left=(this.quad_dmg_rounds_left||0)+Balance.SHRINE_QUAD_DAMAGE_ROUNDS; },
  hasQuadDamage(){ return (this.quad_dmg_rounds_left||0)>0; },
  getQuadDamageMult(){ return this.hasQuadDamage()?4:1; },
  // Ticks both round-based shrine buffs down by one combat round. Deliberately does NOT
  // touch anything if a buff isn't active (no negative counters).
  tickCombatRoundBuffs(){
    if(this.invuln_rounds_left>0) this.invuln_rounds_left--;
    if(this.quad_dmg_rounds_left>0) this.quad_dmg_rounds_left--;
  },
  getRegen(){const c=this.getClassData(); return (c.regen||0.0)+this.gearBonus("regen");},
  getMaxStamina(){return Balance.STAMINA_MAX_BASE+this.gearBonus("stamina_max")+this.bonus_stamina_from_attributes;},
  getGoldFindMult(){return 1.0+this.gearBonus("gold_find")/100.0;},
  getXpFindMult(){return 1.0+this.gearBonus("xp_find")/100.0;},

  // Returns one line per active bonus (rather than one joined sentence) so the
  // Inventory screen can list each on its own row -- see gearBonusPanel().
  getGearBonusLines(){
    const parts=[];
    const dmg=this.gearBonus("damage"); if(dmg) parts.push(`+${Math.round(dmg)} Damage`);
    const hp=this.gearBonus("hp"); if(hp) parts.push(`+${Math.round(hp)} Hit Points`);
    const crit=this.gearBonus("crit"); if(crit) parts.push(`+${Math.round(crit)}% Critical Strike`);
    const armor=this.gearBonus("armor"); if(armor) parts.push(`+${Math.round(armor)}% Armor`);
    const regen=this.gearBonus("regen"); if(regen) parts.push(`+${regen.toFixed(1)} Regeneration`);
    const gf=this.gearBonus("gold_find"); if(gf) parts.push(`+${Math.round(gf)}% Gold Found`);
    const xf=this.gearBonus("xp_find"); if(xf) parts.push(`+${Math.round(xf)}% Experience Gained`);
    const sm=this.gearBonus("stamina_max"); if(sm) parts.push(`+${Math.round(sm)} Stamina`);
    const str=this.gearBonus("strength"); if(str) parts.push(`+${Math.round(str)} Strength`);
    const dex=this.gearBonus("dexterity"); if(dex) parts.push(`+${Math.round(dex)} Dexterity`);
    const vit=this.gearBonus("vitality"); if(vit) parts.push(`+${Math.round(vit)} Vitality`);
    const intl=this.gearBonus("intelligence"); if(intl) parts.push(`+${Math.round(intl)} Intelligence`);
    // v0.16: Poison Resistance is the new defensive stat on the player -- shown here the
    // same way every other gear-only bonus is, via this per-line summary.
    const pr=this.gearBonus("poison_resist"); if(pr) parts.push(`+${Math.round(pr)}% Poison Resistance`);
    return parts;
  },

  addXp(amount){
    let buffed=amount*this.getXpFindMult();
    if(this.xp_buff_encounters_left>0) buffed*=this.xp_buff_multiplier;
    this.xp+=Math.round(buffed);
    this.lifetime_xp+=Math.round(buffed);
    let leveled=false;
    while(this.xp>=this.xp_to_next && this.level<Balance.LEVEL_CAP){
      this.xp-=this.xp_to_next; this.level++; this.xp_to_next=Balance.xpRequiredForLevel(this.level);
      this.unspent_stat_points+=Balance.STAT_POINTS_PER_LEVEL;
      // Vitality always adds to both pools (base+points only, never gear, see the
      // attributes/bonus_* fields' comment for why). Strength has no effect at all for
      // Wizard or Windrider (only Thornguard uses Strength, for damage, see
      // getDamageRange()) -- as of v0.11 it no longer grants HP for those two paths
      // either, so there's a real choice per point instead of Vitality always winning.
      this.bonus_hp_from_attributes+=(this.attributes.vit||0);
      this.bonus_stamina_from_attributes+=(this.attributes.vit||0);
      this.current_hp=this.getMaxHp(); leveled=true;
    }
    if(this.level>=Balance.LEVEL_CAP) this.xp=0;
    return leveled;
  },
  canAttemptTrial(){return this.level>=Balance.trialLevelRequirement(this.getClassData().tier||1);},
  gamblingUnlocked(){return this.highest_tier_reached>=2 || this.season_won;},
  getEyesightRadius(){
    let r=1;
    const gearBonus=this.gearBonus("eyesight");
    if(gearBonus>0) r=Math.max(r,gearBonus);
    if(this.eyesight_potion_steps_left>0) r=Math.max(r,2);
    return r;
  },
  resolveMasterTrial(success){
    const currentTier=this.getClassData().tier||1;
    const nextId=DL.getNextClassId(this.class_id);
    const result={success, final_tier:nextId===""};
    // v0.17 (#28): this runs exactly once per RESOLVED trial attempt, pass or fail (a
    // failure calls this from attemptStep()'s fail branch, a full crossing calls it from
    // the pass branch) -- see the field's declaration above for what consumes it.
    this.trial_attempts_count=(this.trial_attempts_count||0)+1;
    if(success){
      this.highest_tier_reached=Math.max(this.highest_tier_reached,currentTier+1);
      if(nextId!=="") this.class_id=nextId; else this.season_won=true;
      // v0.17.1 BUG FIX: last_bridge_steps ("how far you got on your last Broken Bridge
      // Trial attempt") used to only get overwritten by a FUTURE failed attempt (see
      // attemptStep()'s fail branch) -- a freshly promoted character kept showing the
      // step count from the tier they just cleared until their next trial attempt in the
      // new tier corrected it. A successful crossing means you made it all the way across,
      // so it resets to 0 here immediately, same as everything else about the character
      // sheet that a promotion resets.
      this.last_bridge_steps=0;
      // v0.17.3 (#3): a successful promotion clears this tier's failure streak (and its
      // starting-stat-point bonus) -- see the field's declaration above.
      this.bridge_fail_streak=0;
    } else {
      // v0.17.3 (#3): "when you fail a broken bridge attempt, you get +1 starting stat
      // point for that failed attempt" -- accumulates across repeated failures at the
      // same tier until a promotion (the branch above) resets it back to 0.
      this.bridge_fail_streak=(this.bridge_fail_streak||0)+1;
    }
    // failure: class_id unchanged, no demotion, per v0.7 fix
    this.level=1; this.xp=0; this.xp_to_next=Balance.xpRequiredForLevel(this.level);
    // A promotion (or even a failed attempt, since level always resets to 1 here) is a
    // fresh character sheet for whatever class_id ends up active: attributes reset to
    // that class's own level-1 base values, and the level-up HP/Stamina pools start over.
    // v0.17.3 (#2/#3): starting stat points are Balance.STARTING_STAT_POINTS (3) plus
    // whatever the failed-attempt streak has accumulated (0 right after a promotion,
    // since that streak was just reset above).
    this._resetAttributesToClassBase(Balance.STARTING_STAT_POINTS+this.bridge_fail_streak);
    this.current_hp=this.getMaxHp(); this.current_stamina=this.getMaxStamina();
    // v0.17 BUG FIX (#21): this used to leave max_maze_depth_reached (the Venture area-level
    // selector's upper bound) untouched, so a level-1 character fresh off a trial could
    // still pick whatever high area level they'd unlocked before -- wildly overleveled for
    // their new level-1 stats, and (per Gwen's report) that same stale high depth was also
    // what let a low-level character satisfy Balance.strongholdKeyEligible()'s depth>=level
    // check and farm guardian keys they shouldn't have been able to reach yet. Resetting
    // this to 1 here mirrors exactly what a brand new character starts with (see
    // PS.createCharacter() a few hundred lines down).
    this.max_maze_depth_reached=1;
    return result;
  },
  getEffectiveAreaLevel(bonus=0){return clampi(this.level+bonus, Balance.AREA_LEVEL_MIN, Balance.AREA_LEVEL_MAX);},
  consumePendingScrollBonus(){const b=this.pending_scroll_bonus; this.pending_scroll_bonus=0; return b;},
  useScroll(itemId){
    const item=DL.getItem(itemId);
    if(item.type!=="scroll") return false;
    if((this.consumables[itemId]||0)<=0) return false;
    this._removeConsumableOne(itemId);
    this.pending_scroll_bonus=item.level_bonus||0;
    return true;
  },
  applyXpShrineBuff(){ this.xp_buff_multiplier=Balance.SHRINE_XP_BUFF_MULT; this.xp_buff_encounters_left+=Balance.SHRINE_XP_BUFF_ENCOUNTERS; },
  tickXpBuff(){ if(this.xp_buff_encounters_left>0){ this.xp_buff_encounters_left--; if(this.xp_buff_encounters_left===0) this.xp_buff_multiplier=1.0; } },
  spendStamina(amount){
    if(this.stamina_shrine_buff>0){ const fromBuff=Math.min(this.stamina_shrine_buff,amount); this.stamina_shrine_buff-=fromBuff; amount-=fromBuff; }
    this.current_stamina=Math.max(0,this.current_stamina-amount);
  },
  restoreStamina(amount){ this.current_stamina=Math.min(this.getMaxStamina(),this.current_stamina+amount); },
  addStaminaShrineBuff(bonus){ this.current_stamina=this.getMaxStamina(); this.stamina_shrine_buff+=bonus; },
  addGold(amount){ this.gold=Math.max(0,Math.round(this.gold+amount*this.getGoldFindMult())); },
  // v0.13: "Kindle the Bonfire" -- burn `count` Dry Logs for a flat +7/log bonus to
  // BOTH HP and Stamina regen per second, for a fixed 10-minute window (real time, tracked
  // as a wall-clock expiry so it keeps ticking down even if you leave town and come back).
  // v0.16: re-kindling while the previous bonus is STILL ACTIVE now ADDS to it (7 -> 14 ->
  // 21...) and refreshes the 10-minute window from now, instead of discarding whatever
  // bonus was already active. Reported bug: feeding a 2nd log while still surging from a
  // 1st reset the timer back to 10:00 but left the bonus at the old +7 -- see
  // getActiveBonfireBonus() for how the regen tick reads this back out.
  kindleBonfire(count){
    const have=this.consumables["dry_branch"]||0;
    if(!count || count<=0 || count>have) return false;
    const rem=have-count;
    if(rem>0) this.consumables["dry_branch"]=rem; else delete this.consumables["dry_branch"];
    const currentBonus=this.getActiveBonfireBonus();
    this.bonfire_bonus_regen=currentBonus+count*Balance.DRY_LOG_REGEN_PER_UNIT;
    this.bonfire_bonus_expires_at=Date.now()+Balance.BONFIRE_KINDLE_DURATION_MS;
    return true;
  },
  getActiveBonfireBonus(){
    if(this.bonfire_bonus_expires_at && Date.now()<this.bonfire_bonus_expires_at) return this.bonfire_bonus_regen||0;
    return 0;
  },
  // v0.16: Poison effect -- inflicted by the ankle-bite trap (see onStepMaze()'s "trap"
  // case). Wall-clock expiry, same pattern as the Bonfire bonus above, so it keeps
  // draining even if you change screens or close the tab and come back. Re-triggering
  // (biting another trap while already poisoned) just refreshes the window back to the
  // full duration rather than stacking multiple simultaneous poison timers -- there's only
  // ever one active rate at a time, so there's nothing meaningful to add together the way
  // the Bonfire's per-log bonus stacks.
  // v0.17.1 (#10): `areaLevel` is the area level of the trap that inflicted this poison --
  // its mob-tier-scaled %-of-max-HP/sec drain rate (see Balance.poisonPctPerSecForAreaLevel)
  // is snapshotted into poison_pct_per_sec right now, same reasoning as the Bonfire's fixed
  // regen bonus: wandering to a different area level afterward doesn't retroactively change
  // an already-active poison's severity, and re-triggering just refreshes the timer/rate to
  // whatever the new trap's tier calls for.
  applyPoison(areaLevel){
    this.poison_expires_at=Date.now()+Balance.POISON_DURATION_MS;
    this.poison_pct_per_sec=Balance.poisonPctPerSecForAreaLevel(areaLevel||1);
  },
  isPoisoned(){
    return !!(this.poison_expires_at && Date.now()<this.poison_expires_at);
  },
  // Cures the Poison effect outright (see the Antidote potion / useConsumable()).
  curePoison(){
    this.poison_expires_at=0; this.poison_pct_per_sec=0;
  },
  getPoisonMsLeft(){
    return this.isPoisoned() ? Math.max(0,this.poison_expires_at-Date.now()) : 0;
  },
  // v0.17.1 (#10): the actual effective HP/sec this character's active Poison drains right
  // now, after Poison Resistance -- the single source of truth every UI tooltip and the
  // drain tick itself should read, so they can never drift out of sync with each other.
  getPoisonHpPerSec(){
    if(!this.isPoisoned()) return 0;
    const pct=this.poison_pct_per_sec||Balance.POISON_PCT_PER_SEC_PER_TIER;
    return this.getMaxHp()*pct*(1-this.getPoisonResistance()/100);
  },
  // v0.18.1 (#28): applies exactly ONE sub-tick's worth of Poison drain (a fraction of
  // getPoisonHpPerSec()'s per-SECOND rate, sized to Balance.POISON_TICK_MS) and returns
  // whether it actually drained anything -- pulled out of the setInterval loop below into
  // its own testable method, same spirit as tickActiveHeals()/tickActiveStaminaHeals().
  // Never drops HP below 1 by itself, matching the old once-a-second behavior. Running this
  // at a finer cadence (5x/sec instead of 1x/sec) is the whole fix: the same total HP drains
  // over the same real time, just spread across small smooth steps instead of one lump per
  // second, so the HP bar creeps down instead of visibly snapping.
  tickPoisonDrain(){
    if(!this.isPoisoned() || this.current_hp<=1) return false;
    const dpsPerSecond=this.getPoisonHpPerSec();
    if(dpsPerSecond<=0) return false;
    const perTick=dpsPerSecond/(1000/Balance.POISON_TICK_MS);
    this.current_hp=Math.max(1,this.current_hp-perTick);
    return true;
  },
  // v0.14: apply/read a temporary stat-buff potion's effect. `type` is one of
  // "intelligence"/"strength"/"dexterity"/"block_chance"/"regen" (see ITEMS' buff_type
  // fields on the 5 new potions). Drinking a potion while its buff is already active just
  // resets the timer to a fresh full duration at that potion's amount, it doesn't stack.
  applyTempBuff(type,amount,durationMs){ this.temp_buffs[type]={amount, expires_at:Date.now()+durationMs}; },
  getActiveTempBuff(type){
    const b=this.temp_buffs && this.temp_buffs[type];
    if(b && Date.now()<b.expires_at) return b.amount;
    return 0;
  },
  getTempBuffMsLeft(type){
    const b=this.temp_buffs && this.temp_buffs[type];
    if(b && Date.now()<b.expires_at) return b.expires_at-Date.now();
    return 0;
  },
  // v0.12: softcore ("non-hardcore") death penalty. Returns {goldLost, itemsLost, xpLost}
  // so the caller can tell the player exactly what happened, this is deliberately NOT a
  // silent penalty (players losing progress they didn't see an explanation for would look
  // like a bug). v0.13 added the xp penalty and dropped the old full-HP-restore -- waking
  // up back at camp now leaves you at Balance.DEATH_WAKE_HP, not fully healed.
  applyDeathPenalty(){
    const pct=Balance.DEATH_GOLD_LOSS_MIN_PCT+Math.random()*(Balance.DEATH_GOLD_LOSS_MAX_PCT-Balance.DEATH_GOLD_LOSS_MIN_PCT);
    const goldLost=Math.round(this.gold*pct);
    this.gold=Math.max(0,this.gold-goldLost);
    // 10% of the xp needed for your NEXT level, capped by however much progress you
    // actually have this level (can't go below 0/xp_to_next, and never touches an
    // already-earned level -- dying at 0 xp progress costs nothing further).
    const targetXpLoss=Math.round((this.xp_to_next||0)*Balance.DEATH_XP_LOSS_PCT);
    const xpLost=Math.min(this.xp,targetXpLoss);
    this.xp=Math.max(0,this.xp-targetXpLoss);
    const itemsLost=this._rollDeathItemLosses();
    this.current_hp=Balance.DEATH_WAKE_HP;
    this.resetKillStreak();
    return {goldLost,itemsLost,xpLost};
  },
  // Whether anything is lost at all is a single Balance.DEATH_ITEM_LOSS_CHANCE (50%) roll.
  // If so, how MANY items is a geometric countdown -- keep flipping a 50/50 coin and adding
  // one more item for as long as it comes up heads -- which naturally produces exactly the
  // falloff asked for: 50% of "something lost" cases lose just 1 item, 25% lose 2, 12.5%
  // lose 3, 6.25% lose 4, and so on, capped so a truly disastrous run can't wipe everything.
  _rollDeathItemLosses(){
    const lost=[];
    if(Math.random()>=Balance.DEATH_ITEM_LOSS_CHANCE) return lost;
    let count=1;
    while(Math.random()<0.5 && count<Balance.DEATH_ITEM_LOSS_MAX_COUNT) count++;
    for(let i=0;i<count;i++){
      const desc=this._loseOneRandomItem();
      if(!desc) break; // nothing left to lose
      lost.push(desc);
    }
    return lost;
  },
  // Each individual item lost is drawn from a weighted pool of "an equipped slot" (weight
  // 20) vs "a backpack gear item or consumable stack" (weight 30), mirroring the 20%/30%
  // split the odds were designed around, then a specific item is picked at random from
  // whichever pool won and removed.
  _loseOneRandomItem(){
    const equippedSlots=IF.EQUIPPED_SLOT_KEYS.filter(s=>this.equipped[s]);
    const consumableIds=Object.keys(this.consumables).filter(k=>this.consumables[k]>0);
    const nonEquippedCount=this.gear_instances.length+consumableIds.length;
    const pools=[];
    if(equippedSlots.length) pools.push({weight:Balance.DEATH_EQUIPPED_LOSS_WEIGHT,kind:"equipped"});
    if(nonEquippedCount) pools.push({weight:Balance.DEATH_BACKPACK_LOSS_WEIGHT,kind:"backpack"});
    if(pools.length===0) return null;
    const totalWeight=pools.reduce((s,p)=>s+p.weight,0);
    let r=Math.random()*totalWeight, chosen=pools[pools.length-1].kind;
    for(const p of pools){ if(r<p.weight){ chosen=p.kind; break; } r-=p.weight; }
    // v0.17 (#14): each lost-item description is now {text, rarity} instead of a plain
    // string -- rarity is only ever set for gear (consumables have no rarity concept), and
    // is what lets applyDeathAndRedirect() color the item's name in the death toast to
    // match its normal rarity color (see RARITY_TEXT_COLORS/the .rarity-* CSS classes it
    // reuses), same as everywhere else in the game an item name is shown.
    if(chosen==="equipped"){
      const slot=equippedSlots[randi(equippedSlots.length)];
      const inst=this.equipped[slot];
      this.equipped[slot]=null;
      return {text:`${IF.displayName(inst)} (equipped)`, rarity:inst.rarity};
    }
    // backpack: gear and consumable stacks share one flat pool so a character with 1 gear
    // item and 1 potion stack has even odds between them, not skewed by stack count.
    const backpackChoices=this.gear_instances.map((inst,idx)=>({type:"gear",idx})).concat(consumableIds.map(id=>({type:"consumable",id})));
    if(backpackChoices.length===0) return null;
    const choice=backpackChoices[randi(backpackChoices.length)];
    if(choice.type==="gear"){
      const inst=this.gear_instances[choice.idx];
      this.gear_instances.splice(choice.idx,1);
      return {text:IF.displayName(inst), rarity:inst.rarity};
    }
    const qtyLost=this.consumables[choice.id];
    delete this.consumables[choice.id];
    return {text:`${DL.getItem(choice.id).name} x${qtyLost}`, rarity:null};
  },
  incrementKillStreak(){
    this.kill_streak++;
    // v0.18.2 (#8): track the lifetime record alongside the resettable current streak --
    // see max_kill_streak's declaration for why this one never resets on its own.
    if(this.kill_streak>this.max_kill_streak) this.max_kill_streak=this.kill_streak;
  },
  resetKillStreak(){ this.kill_streak=0; },
  // v0.18.2 (#6): Forest Reputation helpers -- all of them key off `this.highest_tier_reached`
  // (the SAME value getTownName() uses to pick which town/forest is currently active), never
  // off GF.maze_depth (the area level within a tier's range), per Gwen's explicit "the class
  // tier you are currently in defines the forest you are exploring" spec.
  getForestReputation(tier){ return (this.forest_reputation && this.forest_reputation[tier]) || 0; },
  getCurrentForestReputation(){ return this.getForestReputation(this.highest_tier_reached||1); },
  adjustForestReputation(delta){
    const tier=this.highest_tier_reached||1;
    if(!this.forest_reputation) this.forest_reputation={};
    this.forest_reputation[tier]=(this.forest_reputation[tier]||0)+delta;
  },
  // v0.18.2.1: a persistent XP MULTIPLIER, not a flat bonus -- +10% experience gained per
  // point of POSITIVE reputation, applying to every kill for as long as you're exploring
  // this tier's forest (see Balance.FOREST_REPUTATION_XP_PCT_PER_POINT's comment). Returns
  // exactly 1.0 (no change) at zero or negative reputation -- never a penalty.
  getForestReputationXpMult(){ return 1+Math.max(0,this.getCurrentForestReputation())*Balance.FOREST_REPUTATION_XP_PCT_PER_POINT/100; },
  // v0.18.2 (#6): "+1 extra roaming mob per point" of NEGATIVE reputation -- never fewer than
  // the base count when positive/zero.
  getForestReputationExtraRoamers(){ return Math.max(0,-this.getCurrentForestReputation()); },
  handleDeath(cause){
    if(this.hardcore){
      const cd=this.getClassData();
      const entry={name:this.character_name, class_name:cd.display_name||this.class_id, level:this.level, cause, date:new Date().toISOString()};
      appendGraveyard(entry);
      if(this.current_slot>=0) deleteSave(this.current_slot, entry);
      this.current_slot=-1;
      return {dead:true,penalty:null};
    }
    const penalty=this.applyDeathPenalty();
    return {dead:false,penalty};
  },
  addConsumable(itemId,count=1){ this.consumables[itemId]=(this.consumables[itemId]||0)+count; },
  _removeConsumableOne(itemId){ const rem=(this.consumables[itemId]||0)-1; if(rem>0) this.consumables[itemId]=rem; else delete this.consumables[itemId]; },
  // v0.18.1 (#27): merge-or-create helper shared by both health and stamina gradual
  // healing. Guarantees `arr` (PS.active_heals or PS.active_stamina_heals) holds AT MOST
  // ONE {perTick, ticksLeft} entry at any time -- if one's already running, a fresh potion
  // extends its remaining pending amount (capped at `headroom`) instead of pushing a second,
  // independent stream alongside it. This is the entire fix for "drinking a 2nd/3rd potion
  // speeds up the fill instead of just extending it": before, every consumer of these arrays
  // (getHealPerSecond/tickActiveHeals and their stamina equivalents) summed every entry's
  // contribution each tick, so N simultaneous potions delivered N times the rate.
  _queueGradualHeal(arr,amount,headroom,totalTicks){
    if(headroom<=0) return;
    if(arr.length>0){
      const existing=arr[0];
      const currentPending=existing.perTick*existing.ticksLeft;
      const newPending=Math.min(headroom,currentPending+amount);
      existing.ticksLeft=existing.perTick>0?newPending/existing.perTick:0;
    } else {
      const rate=amount/totalTicks;
      const pending=Math.min(headroom,amount);
      arr.push({perTick:rate, ticksLeft: rate>0?pending/rate:0});
    }
  },
  useConsumable(itemId){
    if(!this.canUseConsumable(itemId)) return false;
    const item=DL.getItem(itemId); let used=false;
    const totalTicks=Balance.POTION_HEAL_DURATION_MS/Balance.POTION_HEAL_TICK_MS;
    // v0.17.3 (#8): Health Potions no longer land instantly on click -- the potion is still
    // consumed right away (see _removeConsumableOne() below), but its heal_amount is queued
    // up as a heal-over-time effect and delivered smoothly across Balance.POTION_HEAL_
    // DURATION_MS by the dedicated setInterval near the bottom of this file (see
    // PS.active_heals/PS.tickActiveHeals()). v0.18.1 (#27): the gating condition below checks
    // the PENDING target, not raw current_hp, so the button correctly disables once the
    // in-flight heal(s) already fully cover the gap to max HP -- exactly like the old
    // instant-heal-to-max behavior used to.
    if((item.heal_amount||0)>0 && (this.current_hp+this.getPendingHealAmount())<this.getMaxHp()){
      this._queueGradualHeal(this.active_heals,item.heal_amount,this.getMaxHp()-this.current_hp,totalTicks);
      used=true;
    }
    // v0.18.1 (#20): Stamina Potions now heal gradually too, mirroring Health Potions exactly
    // (same duration/tick cadence, same active_stamina_heals array, same merge-not-stack fix).
    if((item.stamina_amount||0)>0 && (this.current_stamina+this.getPendingStaminaHealAmount())<this.getMaxStamina()){
      this._queueGradualHeal(this.active_stamina_heals,item.stamina_amount,this.getMaxStamina()-this.current_stamina,totalTicks);
      used=true;
    }
    if((item.eyesight_steps||0)>0){ this.eyesight_potion_steps_left=item.eyesight_steps; used=true; }
    // v0.14: the 5 new stat-buff potions (buff_type/buff_amount/buff_duration_ms on ITEMS)
    // -- always usable (unlike heal/stamina potions there's no "already full" cap), and
    // drinking one refreshes the timer rather than stacking.
    if(item.buff_type){ this.applyTempBuff(item.buff_type,item.buff_amount,item.buff_duration_ms||Balance.POTION_BUFF_DURATION_MS); used=true; }
    // v0.16: the Antidote (see ITEMS.antidote/canUseConsumable() above).
    if(item.cures_poison && this.isPoisoned()){ this.curePoison(); used=true; }
    if(used) this._removeConsumableOne(itemId);
    return used;
  },
  canUseConsumable(itemId){
    if((this.consumables[itemId]||0)<=0) return false;
    const item=DL.getItem(itemId);
    if((item.heal_amount||0)>0 && (this.current_hp+this.getPendingHealAmount())<this.getMaxHp()) return true;
    if((item.stamina_amount||0)>0 && (this.current_stamina+this.getPendingStaminaHealAmount())<this.getMaxStamina()) return true;
    if((item.eyesight_steps||0)>0) return true;
    if(item.buff_type) return true;
    // v0.16: the Antidote is only "usable" (button enabled) while actually poisoned --
    // same "don't let it fire as a no-op" pattern as health/stamina potions being gated
    // on not-already-full.
    if(item.cures_poison && this.isPoisoned()) return true;
    return false;
  },
  // v0.17.3 (#8): drains PS.active_heals, one dedicated sub-tick (Balance.POTION_HEAL_
  // TICK_MS) at a time -- called by the heal-over-time setInterval near the bottom of this
  // file. Returns true if current_hp actually changed, so the caller knows whether it's
  // worth refreshing the HP bar/text at all.
  tickActiveHeals(){
    if(!this.active_heals || !this.active_heals.length) return false;
    let changed=false;
    const maxHp=this.getMaxHp();
    for(const heal of this.active_heals){
      if(this.current_hp<maxHp){ this.current_hp=Math.min(maxHp,this.current_hp+heal.perTick); changed=true; }
      heal.ticksLeft--;
    }
    this.active_heals=this.active_heals.filter(heal=>heal.ticksLeft>0);
    return changed;
  },
  // Sum of every in-flight heal's per-second rate, purely for the "+X.X HP/sec" indicator
  // next to the HP bar (see statHeader()) -- doesn't consume or mutate anything.
  getHealPerSecond(){
    if(!this.active_heals || !this.active_heals.length) return 0;
    const ticksPerSecond=1000/Balance.POTION_HEAL_TICK_MS;
    return this.active_heals.reduce((sum,heal)=>sum+heal.perTick*ticksPerSecond,0);
  },
  // v0.18 (#8): total HP the currently in-flight heal(s) still have left to deliver, clamped
  // to however much headroom is actually left below max HP. This is the ENTIRE mechanism
  // behind the heal-preview overlay's "shrinks if the player takes damage mid-heal" behavior
  // (see hpBar()) -- it's computed fresh from PS.current_hp every time it's called, so a hit
  // that lowers current_hp automatically narrows the preview on the very next render/refresh,
  // with no separate bookkeeping needed to track "damage taken during a heal".
  getPendingHealAmount(){
    if(!this.active_heals || !this.active_heals.length) return 0;
    const total=this.active_heals.reduce((sum,heal)=>sum+heal.perTick*heal.ticksLeft,0);
    return Math.min(total, Math.max(0,this.getMaxHp()-this.current_hp));
  },
  // v0.18.1 (#20): Stamina Potion equivalents of the 3 Health Potion functions directly
  // above -- same math, same reasoning, just against active_stamina_heals/current_stamina/
  // getMaxStamina() instead.
  tickActiveStaminaHeals(){
    if(!this.active_stamina_heals || !this.active_stamina_heals.length) return false;
    let changed=false;
    const maxStamina=this.getMaxStamina();
    for(const heal of this.active_stamina_heals){
      if(this.current_stamina<maxStamina){ this.current_stamina=Math.min(maxStamina,this.current_stamina+heal.perTick); changed=true; }
      heal.ticksLeft--;
    }
    this.active_stamina_heals=this.active_stamina_heals.filter(heal=>heal.ticksLeft>0);
    return changed;
  },
  getStaminaHealPerSecond(){
    if(!this.active_stamina_heals || !this.active_stamina_heals.length) return 0;
    const ticksPerSecond=1000/Balance.POTION_HEAL_TICK_MS;
    return this.active_stamina_heals.reduce((sum,heal)=>sum+heal.perTick*ticksPerSecond,0);
  },
  getPendingStaminaHealAmount(){
    if(!this.active_stamina_heals || !this.active_stamina_heals.length) return 0;
    const total=this.active_stamina_heals.reduce((sum,heal)=>sum+heal.perTick*heal.ticksLeft,0);
    return Math.min(total, Math.max(0,this.getMaxStamina()-this.current_stamina));
  },
  bestAvailableConsumable(kind){
    const field=kind==="health"?"heal_amount":"stamina_amount";
    let bestId="", bestAmt=-1;
    for(const itemId in this.consumables){
      if((this.consumables[itemId]||0)<=0) continue;
      const item=DL.getItem(itemId);
      if(item.type!=="consumable") continue;
      const amt=item[field]||0;
      if(amt<=0) continue;
      if(amt>bestAmt){ bestAmt=amt; bestId=itemId; }
    }
    return bestId;
  },
  // v0.18.1 (#7): optional `qty` param -- the Merchant's new amount-picker lets a player
  // buy several potions in one click instead of clicking Buy N times. Atomic: either the
  // full qty is affordable and gets bought as one transaction, or nothing happens at all
  // (no partial-buy where you can afford 3 of the 5 you asked for).
  buyConsumable(itemId,qty=1){
    const item=DL.getItem(itemId); if(!item.name) return false;
    // v0.12.1: Stronghold Keys are an achievement drop, not a shop item -- guarded here
    // too (not just hidden from the Merchant's Buy grid) so there's no back door to
    // buying one directly. They still trade freely on the Auction House.
    if(Balance.MERCHANT_EXCLUDED_ITEMS.includes(itemId)) return false;
    if(qty<=0) return false;
    const price=Balance.itemBuyPrice(item)*qty;
    if(this.gold<price) return false;
    this.gold-=price; this.addConsumable(itemId,qty); return true;
  },
  getInventoryCapacity(){
    let cap=Balance.BASE_INVENTORY_SLOTS;
    for(const bagId of this.equipped_bags) cap+=DL.getItem(bagId).capacity||0;
    return cap;
  },
  getInventoryUsed(){return this.gear_instances.length;},
  hasInventorySpace(){return this.getInventoryUsed()<this.getInventoryCapacity();},
  equipBag(itemId){
    if(this.equipped_bags.length>=Balance.MAX_BAG_SLOTS) return {success:false,reason:`Your bag rack is full (${this.equipped_bags.length}/${Balance.MAX_BAG_SLOTS}), unequip a bag first.`};
    this.equipped_bags.push(itemId); return {success:true};
  },
  // v0.15: unequipping a bag can no longer silently overflow the backpack -- if removing
  // it would drop capacity below how many gear items are currently carried, the bag stays
  // on (returns false) so the UI can explain why instead of quietly discarding items or
  // leaving gear_instances over-capacity in save data.
  wouldOverflowWithoutBag(itemId){
    if(!this.equipped_bags.includes(itemId)) return false;
    const capacityWithout=this.getInventoryCapacity()-(DL.getItem(itemId).capacity||0);
    return this.getInventoryUsed()>capacityWithout;
  },
  // v0.17.1 (#8) BUG FIX: this used to just splice the bag out of equipped_bags and stop --
  // the bag itself was never actually given anywhere to go, so it was silently destroyed
  // the instant you unequipped it. It now lands in this.bags (see that field's declaration
  // above), same stackable-dict pattern as consumables/herbs, so it's still yours and can be
  // re-equipped later (see the "Bags" section of the Character Sheet). The existing gear-
  // capacity check (wouldOverflowWithoutBag) is untouched and still blocks the unequip
  // outright -- with a feedback message, not silent failure -- if your currently-carried
  // GEAR alone wouldn't fit in the reduced capacity; the bag itself never competes for gear
  // capacity (bags grant capacity, they don't consume it), so no separate check is needed
  // for the returning bag.
  unequipBag(itemId){
    if(this.wouldOverflowWithoutBag(itemId)) return false;
    const idx=this.equipped_bags.indexOf(itemId); if(idx!==-1) this.equipped_bags.splice(idx,1); else return false;
    this.bags[itemId]=(this.bags[itemId]||0)+1;
    return true;
  },
  buyBag(itemId){
    const item=DL.getItem(itemId); if(!item.name||item.type!=="bag") return {success:false,reason:"Unknown bag."};
    const price=Balance.bagBuyPrice(item.capacity||0);
    if(this.gold<price) return {success:false,reason:"Not enough gold."};
    const result=this.equipBag(itemId); if(!result.success) return result;
    this.gold-=price; return {success:true};
  },
  craftBag(itemId){
    const item=DL.getItem(itemId); if(!item.name||item.type!=="bag") return {success:false,reason:"Unknown bag."};
    const cost=Balance.bagCraftCost(item.capacity||0);
    if(this.materials<cost) return {success:false,reason:"Not enough materials."};
    const result=this.equipBag(itemId); if(!result.success) return result;
    this.materials-=cost; return {success:true};
  },
  addGear(inst){ if(!this.hasInventorySpace()) return false; this.gear_instances.push(inst); return true; },
  findGearIndex(instanceId){ return this.gear_instances.findIndex(g=>g.instance_id===instanceId); },
  // v0.14: a gear item's Tier now doubles as a character-level requirement to equip it
  // (see Balance.tierLevelRequirement) -- you can always still wear a tier below what
  // your level allows, you just can't equip AHEAD of your level anymore.
  // v0.18.1 (#3): also gated by class -- e.g. a Wand requires wizard/sorcerer. Both checks
  // flow through this single function, which is itself the one choke point gearBonus()/
  // isEquippedSlotInvalid() use, so an already-equipped item that becomes class-invalid
  // (e.g. after a Broken Bridge Trial class change) is excluded from stats and flagged
  // exactly like an under-level item, with no extra plumbing needed elsewhere.
  canEquipGear(inst){ return this.level>=Balance.tierLevelRequirement(inst.tier) && IF.classCanEquipItem(this.class_id, inst); },
  // v0.18.1 (#3): specifically whether the CLASS requirement (not level) is the reason an
  // item can't be equipped -- used to show a distinct, class-specific explanatory message
  // rather than the generic "requires Level N" one.
  classInvalidGear(inst){ return !IF.classCanEquipItem(this.class_id, inst); },
  // v0.18.1 (#3): a single human-readable sentence explaining why this item either can't be
  // equipped right now, or -- if it's already sitting in an equip slot -- is currently
  // flagged invalid. Level is checked first since it's the more fundamental gate; only one
  // reason is ever surfaced even if both would independently fail, to keep the message short.
  // Shared by the equip-attempt toast (backpackGearGrid) and the equipped-slot tooltip
  // (equipSlotTile) so the two never drift out of sync with each other.
  gearInvalidReason(inst){
    const needLevel=Balance.tierLevelRequirement(inst.tier);
    if(this.level<needLevel) return `Requires Level ${needLevel}, you are Lv ${this.level}.`;
    if(!IF.classCanEquipItem(this.class_id, inst)){
      const weaponType=IF.weaponTypeForInstance(inst);
      const label=IF.WEAPON_TYPE_LABELS[weaponType]||"weapon";
      return `${this.getClassData().display_name||this.class_id} cannot equip a ${label}.`;
    }
    return "";
  },
  // v0.15: which equip slot key a not-yet-owned gear instance WOULD go into if auto-
  // equipped right now, or null if there's nowhere open for it (matches the ring1/ring2
  // fallback logic equipGear() uses for an item already in the backpack). Kept separate
  // from equipGear() since this has to work on an item that isn't in gear_instances yet.
  _autoEquipTargetSlot(inst){
    const genSlot=inst.slot;
    if(genSlot==="ring") return !this.equipped["ring1"] ? "ring1" : (!this.equipped["ring2"] ? "ring2" : null);
    if(!IF.EQUIPPED_SLOT_KEYS.includes(genSlot)) return null;
    return this.equipped[genSlot] ? null : genSlot;
  },
  canAutoEquip(inst){ return this.canEquipGear(inst) && !!this._autoEquipTargetSlot(inst); },
  // v0.15: used by loot drops and purchases (Auction House buys, the Gambling Goblin) --
  // if the matching equip slot is empty (and the character's level allows this tier), the
  // item goes straight onto the character instead of taking up a backpack slot. Falls back
  // to the normal addGear() bag-add otherwise (slot occupied, tier too high, or backpack
  // full). Same true/false "did it fit somewhere" return as addGear().
  addGearAutoEquip(inst){
    if(this.canAutoEquip(inst)){
      this.equipped[this._autoEquipTargetSlot(inst)]=inst;
      this.current_hp=Math.min(this.current_hp,this.getMaxHp());
      return true;
    }
    return this.addGear(inst);
  },
  equipGear(instanceId){
    const idx=this.findGearIndex(instanceId); if(idx===-1) return;
    const inst=this.gear_instances[idx];
    if(!this.canEquipGear(inst)) return;
    const genSlot=inst.slot; let target=genSlot;
    if(genSlot==="ring"){
      if(!this.equipped["ring1"]) target="ring1"; else if(!this.equipped["ring2"]) target="ring2"; else target="ring1";
    } else if(!IF.EQUIPPED_SLOT_KEYS.includes(genSlot)) return;
    this.gear_instances.splice(idx,1);
    if(this.equipped[target]) this.gear_instances.push(this.equipped[target]);
    this.equipped[target]=inst;
    this.current_hp=Math.min(this.current_hp,this.getMaxHp());
  },
  unequipSlot(slot){ if(!this.equipped[slot]) return; this.gear_instances.push(this.equipped[slot]); this.equipped[slot]=null; },
  wouldSwap(inst){
    if(inst.slot==="ring") return !!(this.equipped["ring1"] && this.equipped["ring2"]);
    return !!this.equipped[inst.slot];
  },
  salvageGear(instanceId){
    const idx=this.findGearIndex(instanceId); if(idx===-1) return;
    const inst=this.gear_instances[idx];
    this.materials+=Balance.salvageValue(inst.tier, IF.slotCount(inst));
    this.gear_instances.splice(idx,1);
  },
  sellGear(instanceId){
    const idx=this.findGearIndex(instanceId); if(idx===-1) return;
    const inst=this.gear_instances[idx];
    this.addGold(Balance.sellValue(inst.tier, IF.slotCount(inst)));
    this.gear_instances.splice(idx,1);
  },
  rerollGear(instanceId){
    const idx=this.findGearIndex(instanceId); if(idx===-1) return null;
    const inst=this.gear_instances[idx];
    const cost=Balance.rerollCost(inst.tier, IF.slotCount(inst));
    if(this.materials<cost) return null;
    this.materials-=cost; const rerolled=IF.reroll(inst); this.gear_instances[idx]=rerolled; return rerolled;
  },
  addHerb(herbId,count=1){ this.herbs[herbId]=(this.herbs[herbId]||0)+count; },
  // v0.14: recipes can now also carry a gold_cost (the 5 new stat-buff potions charge
  // 130g/190g on top of their herbs -- see RECIPES), older recipes simply have no
  // gold_cost field and this is a no-op for them.
  // v0.18.1 (#8): optional `qty` -- the Alchemist's new amount-picker lets a player queue
  // several brews of the same recipe in one click. Both functions default qty to 1 so every
  // existing single-arg caller (and test) keeps working unchanged.
  canAffordRecipe(recipe,qty=1){
    for(const h in recipe.herbs) if((this.herbs[h]||0)<recipe.herbs[h]*qty) return false;
    if((recipe.gold_cost||0)*qty>this.gold) return false;
    return true;
  },
  brewRecipe(recipe,qty=1){
    if(!this.canAffordRecipe(recipe,qty)) return false;
    for(const h in recipe.herbs) this.herbs[h]-=recipe.herbs[h]*qty;
    if(recipe.gold_cost) this.gold-=recipe.gold_cost*qty;
    this.addConsumable(recipe.result_item,qty); return true;
  },

  startNewCharacter(classId,name,slot,isHardcore){
    this.current_slot=slot; this.class_id=classId;
    this.character_name=(name||"Hero").slice(0,Balance.CHARACTER_NAME_MAX_LEN);
    this.hardcore=isHardcore; this.level=1; this.xp=0; this.materials=0;
    // v0.17 (#29): gold is now ACCOUNT-BOUND (see PS's `get gold()`/`set gold()` above) --
    // a brand new character must NOT reset it, that would wipe out every other character's
    // shared gold on this same account the moment you roll a new one. This supersedes the
    // v0.16 "new characters start with 0 gold" behavior: a fresh account (with no prior
    // gold) still effectively starts at 0 since that's what Net.accountGold defaults to,
    // but an account that already has gold correctly keeps it for the new character too.
    this.herbs={}; this.consumables={}; this.gear_instances=[]; this.equipped={};
    // v0.17.1 (#8): same reused-singleton leak class as herbs/consumables above -- a fresh
    // character must not inherit the previous character's stored-but-unequipped bags.
    this.bags={};
    for(const s of IF.EQUIPPED_SLOT_KEYS) this.equipped[s]=null;
    this.equipped_bags=[]; this.pending_scroll_bonus=0; this.xp_buff_multiplier=1.0;
    this.xp_buff_encounters_left=0; this.stamina_shrine_buff=0.0; this.highest_tier_reached=1;
    this.season_won=false; this.kill_streak=0; this.max_kill_streak=0; this.forest_reputation={}; this.xp_to_next=Balance.xpRequiredForLevel(this.level);
    this.lifetime_xp=0; this.isRestingAtCampfire=false; this.eyesight_potion_steps_left=0;
    this.max_maze_depth_reached=1;
    // v0.17 (#1): same reused-singleton leak class as weapon_skills/trial_progress below --
    // a fresh character must not inherit the previous character's bridge-step history.
    this.last_bridge_steps=0;
    // v0.17.3 (#3): same reused-singleton leak class -- a brand new character must not
    // inherit the previous character's failed-attempt streak (and thus its starting stat
    // point bonus). _resetAttributesToClassBase() below reads this indirectly via its
    // default (Balance.STARTING_STAT_POINTS) since no override is passed here.
    this.bridge_fail_streak=0;
    // v0.17 (#28): same reused-singleton leak class -- a fresh character starts with zero
    // resolved trial attempts, not whatever the previously-played character had.
    this.trial_attempts_count=0;
    // v0.17.3 (#8): same reused-singleton leak class -- a fresh character must not inherit
    // an in-flight heal-over-time from whatever potion the previously-played character
    // drank right before this one was rolled.
    this.active_heals=[];
    // v0.18.1 (#20): stamina potions now heal gradually too, same reused-singleton leak
    // class as active_heals immediately above -- must reset for a fresh character.
    this.active_stamina_heals=[];
    // Fresh character: brand new weapon-skill progression, NOT the reused-singleton's
    // previous character's progress (same bug class as the HP/Stamina fix just below --
    // PS is one shared object across character creations in a session, so anything not
    // explicitly reset here would otherwise leak from whatever was played last).
    this.weapon_skills={}; this.ensureWeaponSkills();
    // v0.17.1 (#7): same reused-singleton leak class -- a fresh character starts herbalism
    // proficiency at 0, not wherever the previously-played character left off.
    this.herbalism_points=0;
    // v0.13: same reused-singleton leak class as weapon_skills above -- a fresh character
    // must not inherit the previous character's Broken Bridge memory or bonfire kindling.
    this.trial_progress={}; this.bonfire_bonus_regen=0; this.bonfire_bonus_expires_at=0;
    // v0.14: same reused-singleton leak class as above -- a fresh character must not
    // inherit the previous character's active potion buffs.
    this.temp_buffs={};
    // v0.16: same reused-singleton leak class -- a fresh character must not inherit the
    // previous character's active Poison effect.
    this.poison_expires_at=0; this.poison_pct_per_sec=0;
    // v0.17.1 (#12): same reused-singleton leak class -- a fresh character must not
    // inherit the previous character's active shrine buffs.
    this.invuln_rounds_left=0; this.quad_dmg_rounds_left=0;
    // Bug fix (v0.12): this MUST run before getMaxHp()/getMaxStamina() below. PS is a
    // reused singleton across character creations in the same session, so bonus_hp_from_
    // attributes/bonus_stamina_from_attributes/attributes still held whatever the last-
    // played character (e.g. a high-Vitality one) left behind until this reset runs. Any
    // brand new character created without a full page reload was inheriting that stale
    // Vitality bonus into its starting HP/Stamina (this is what produced Gwen's ~430 HP /
    // ~418 Stamina level-1 Thornguard report).
    this._resetAttributesToClassBase();
    this.current_hp=this.getMaxHp(); this.current_stamina=this.getMaxStamina();
    // v0.17.1 BUG FIX: GF.overworld_snapshot (the live maze -- fog-of-war, cleared chests/
    // shrines/guardians, player position) is a GF-singleton keyed only by area depth, not by
    // character. Without this reset, a brand new Lv1 character venturing into area level 1
    // would land in whatever area-level-1 maze the PREVIOUSLY PLAYED character had already
    // explored, discovered tiles and all -- maze state was never meant to carry over between
    // characters at all (it isn't even saved to the server). Force a fresh maze on the next
    // Venture for every new character.
    GF.overworld_snapshot=null;
  },
  saveGame(){
    if(this.current_slot<0) return;
    const data={class_id:this.class_id,class_display_name:this.getClassData().display_name||this.class_id,
      character_name:this.character_name,hardcore:this.hardcore,level:this.level,
      xp:this.xp,xp_to_next:this.xp_to_next,gold:this.gold,materials:this.materials,herbs:this.herbs,
      // v0.17.1 (#8): unequipped-but-owned bags, see this.unequipBag()/the field's declaration.
      bags:this.bags||{},
      current_hp:this.current_hp,current_stamina:this.current_stamina,consumables:this.consumables,
      gear_instances:this.gear_instances,equipped:this.equipped,equipped_bags:this.equipped_bags,
      highest_tier_reached:this.highest_tier_reached,season_won:this.season_won,lifetime_xp:this.lifetime_xp,
      eyesight_potion_steps_left:this.eyesight_potion_steps_left,
      max_maze_depth_reached:this.max_maze_depth_reached,
      // v0.17 (#1): "steps completed before your most recent Broken Bridge Trial failure",
      // needed server-side for the leaderboard's new sort order (see attemptStep()).
      last_bridge_steps:this.last_bridge_steps||0,

      // player who fails, then closes the tab, would lose their earned stat-point bonus.
      bridge_fail_streak:this.bridge_fail_streak||0,
      // v0.17.3 (#8): an in-progress potion heal-over-time must survive a save/reload too,
      // same reasoning as everything else here -- otherwise closing the tab mid-heal would
      // just silently discard whatever HP hadn't been delivered yet.
      active_heals:this.active_heals||[],
      // v0.18.1 (#20): stamina potions' in-progress heal-over-time, same reasoning as
      // active_heals immediately above.
      active_stamina_heals:this.active_stamina_heals||[],
      // v0.17 (#28): drives the Merchant's gear-stock reroll cadence, see resolveMasterTrial().
      trial_attempts_count:this.trial_attempts_count||0,
      attributes:this.attributes,unspent_stat_points:this.unspent_stat_points,
      bonus_hp_from_attributes:this.bonus_hp_from_attributes,bonus_stamina_from_attributes:this.bonus_stamina_from_attributes,
      weapon_skills:this.weapon_skills,

      max_kill_streak:this.max_kill_streak||0,
      // v0.18.2 (#6): per-tier Forest Reputation, must survive a save/reload -- see its
      // declaration/_applyLoadedData() above.
      forest_reputation:this.forest_reputation||{},
      // v0.13: Broken Bridge Trial progress (which planks are already known-safe per
      // step, and which have already been tried-and-failed at the current step) must
      // survive a save/reload, otherwise the "remembers the faulty plank" guarantee only
      // held within a single browser session -- see getTrialProgress()/screenMasterTrial().
      trial_progress:this.trial_progress||{},
      bonfire_bonus_regen:this.bonfire_bonus_regen||0, bonfire_bonus_expires_at:this.bonfire_bonus_expires_at||0,
      // v0.14: active stat-buff potion timers must survive a save/reload too, same
      // wall-clock-expiry reasoning as the Bonfire bonus above.
      temp_buffs:this.temp_buffs||{},
      // v0.16: the Poison effect (see PS.applyPoison()) is real-time and must keep
      // draining even across a save/reload, same wall-clock-expiry pattern as above.
      poison_expires_at:this.poison_expires_at||0,
      // v0.17.1 (#10): the mob-tier-scaled %/sec rate snapshotted when poison was inflicted.
      poison_pct_per_sec:this.poison_pct_per_sec||0,
      // v0.17.1 (#12): round-based shrine buffs (Invulnerability/Quad Damage) survive a
      // save/reload mid-fight, same as everything else here.
      invuln_rounds_left:this.invuln_rounds_left||0, quad_dmg_rounds_left:this.quad_dmg_rounds_left||0,
      // v0.15.1: see _nextSaveSeq() above -- lets the server (and Net.saveCharacter's own
      // client-side coalescing) tell an old save from a new one regardless of arrival order.
      _save_seq:this._nextSaveSeq()};
    // v0.17 (#6): the local-storage "offline" fallback here was dead code -- see the Save
    // slots/Graveyard section's comment above for why.
    Net.saveCharacter(this.current_slot, data);
  },
  _applyLoadedData(slot,parsed){
    this.current_slot=slot; this.class_id=parsed.class_id||""; this.character_name=parsed.character_name||"Hero";
    this.hardcore=!!parsed.hardcore; this.kill_streak=0;
    // v0.18.2 (#8): unlike kill_streak (deliberately reset to 0 on every load, right above),
    // max_kill_streak is the lifetime record and must survive a save/reload intact.
    this.max_kill_streak=parsed.max_kill_streak||0;
    // v0.18.2 (#6): Forest Reputation is per-tier persisted state, same "must survive a
    // save/reload" reasoning as max_kill_streak just above.
    this.forest_reputation=parsed.forest_reputation||{};
    this.level=parsed.level||1; this.xp=parsed.xp||0;
    this.xp_to_next=parsed.xp_to_next||Balance.xpRequiredForLevel(this.level); this.gold=parsed.gold||0;
    this.materials=parsed.materials||0; this.herbs=parsed.herbs||{}; this.consumables=parsed.consumables||{};
    // v0.17.1 (#8): a save from before this fix shipped just won't have any stored bags yet.
    this.bags=parsed.bags||{};
    this.gear_instances=(parsed.gear_instances||[]).filter(g=>g&&g.instance_id);
    const loadedEquipped=parsed.equipped||{}; this.equipped={};
    for(const s of IF.EQUIPPED_SLOT_KEYS) this.equipped[s]=loadedEquipped[s]||null;
    this.equipped_bags=(parsed.equipped_bags||[]).slice(0,Balance.MAX_BAG_SLOTS);
    this.highest_tier_reached=parsed.highest_tier_reached||1; this.season_won=!!parsed.season_won;
    this.pending_scroll_bonus=0; this.xp_buff_multiplier=1.0; this.xp_buff_encounters_left=0; this.stamina_shrine_buff=0.0;
    this.lifetime_xp=parsed.lifetime_xp||0; this.isRestingAtCampfire=false;
    this.eyesight_potion_steps_left=parsed.eyesight_potion_steps_left||0;
    this.max_maze_depth_reached=parsed.max_maze_depth_reached||1;
    // v0.17 (#1): see saveGame() -- must survive a save/reload just like the other lifetime
    // progress stats above.
    this.last_bridge_steps=parsed.last_bridge_steps||0;
    // v0.17.3 (#3): a save from before this shipped just won't have a streak yet.
    this.bridge_fail_streak=parsed.bridge_fail_streak||0;
    // v0.17.3 (#8): a save from before this shipped just won't have any heals-in-progress.
    this.active_heals=parsed.active_heals||[];
    // v0.18.1 (#20): a save from before this shipped just won't have any stamina heals-in-progress.
    this.active_stamina_heals=parsed.active_stamina_heals||[];
    // v0.17 (#28): see saveGame().
    this.trial_attempts_count=parsed.trial_attempts_count||0;
    if(parsed.attributes){ this.attributes={str:parsed.attributes.str||0,dex:parsed.attributes.dex||0,vit:parsed.attributes.vit||0,int:parsed.attributes.int||0}; }
    else this._resetAttributesToClassBase(); // pre-v0.10 save with no attributes recorded yet
    this.unspent_stat_points=parsed.unspent_stat_points||0;
    this.bonus_hp_from_attributes=parsed.bonus_hp_from_attributes||0;
    this.bonus_stamina_from_attributes=parsed.bonus_stamina_from_attributes||0;
    this.current_hp=parsed.current_hp!=null?parsed.current_hp:this.getMaxHp();
    this.current_stamina=parsed.current_stamina!=null?parsed.current_stamina:this.getMaxStamina();
    // v0.12: weapon skill progression is permanent and per-character, never reset by
    // anything -- a save with no weapon_skills yet (pre-v0.12) just starts everyone at 0.
    this.weapon_skills=parsed.weapon_skills||{};
    this.ensureWeaponSkills();
    // v0.17.1 (#7): herbalism proficiency is permanent and per-character, never reset by
    // anything -- a save with no herbalism_points yet (pre-v0.17.1) just starts at 0.
    this.herbalism_points=parsed.herbalism_points||0;
    // v0.13: Broken Bridge Trial memory and bonfire kindling state, both must survive
    // a save/reload -- see getTrialProgress()/screenMasterTrial() and the Kindle the
    // Bonfire button in screenTown().
    this.trial_progress=parsed.trial_progress||{};
    this.bonfire_bonus_regen=parsed.bonfire_bonus_regen||0;
    this.bonfire_bonus_expires_at=parsed.bonfire_bonus_expires_at||0;
    // v0.14: active stat-buff potion timers (see saveGame()).
    this.temp_buffs=parsed.temp_buffs||{};
    // v0.16: Poison effect timer (see saveGame()/applyPoison()).
    this.poison_expires_at=parsed.poison_expires_at||0;
    // v0.17.1 (#10): a save from before this fix won't have this yet -- getPoisonHpPerSec()
    // falls back to the T1 rate in that case, which is fine (harmless if not even poisoned).
    this.poison_pct_per_sec=parsed.poison_pct_per_sec||0;
    // v0.17.1 (#12): round-based shrine buffs (see saveGame()).
    this.invuln_rounds_left=parsed.invuln_rounds_left||0; this.quad_dmg_rounds_left=parsed.quad_dmg_rounds_left||0;
    // v0.15.1: guard against a skewed local clock producing a lower _nextSaveSeq() than
    // what's already stored server-side for this character (see saveGame()/_nextSaveSeq())
    // -- if that ever happened, every future save from this device would be silently
    // rejected by the server's stale-write guard as "older" forever. Flooring the counter
    // at the loaded save's own sequence number keeps this session's saves strictly above
    // it regardless of local clock drift.
    if(parsed._save_seq) this._saveSeqFloor=Math.max(this._saveSeqFloor, parsed._save_seq);
    // v0.17.1 BUG FIX: same reused-GF-singleton leak as startNewCharacter() -- switching INTO
    // this character (a fresh login, or picking a different slot) must not keep showing
    // whichever maze the previously active character last had loaded. The maze itself was
    // never persisted server-side to begin with, so there's nothing lost by resetting it
    // here; the next Venture simply generates this character's own fresh maze at their depth.
    GF.overworld_snapshot=null;
    return true;
  },
  // v0.17 (#6): the local-storage "offline" fallback here was dead code -- see the Save
  // slots/Graveyard section's comment above for why.
  loadGame(slot){
    const entry=(Net.cache||[]).find(e=>e.slot===slot);
    if(!entry || entry.empty) return false;
    return this._applyLoadedData(slot, entry.data);
  },
};

// active whenever you're on one of these town-adjacent screens (see the regen tick near

const REGEN_ACTIVE_SCREENS=["town","inventory","merchant","alchemist","blacksmith","auctionHouse","vault","gamblingGoblin","masterTrial"];
// v0.17 (#20) BUG FIX: "inventory" (Character Sheet) is reachable from a statHeader() "Open
// ->" link available on nearly every screen, including from deep in the wilderness -- but
// REGEN_ACTIVE_SCREENS above always treated it as town-side, so opening it mid-maze granted
// the same free HP/Stamina regen as actually being back at the bonfire, even though the
// player never left the maze (confirmed: returning from Character Sheet drops you right
// back into the unmoved maze, you never actually left it). See isRegenActiveNow() below,
// used by the regen tick in place of a plain REGEN_ACTIVE_SCREENS.includes(GF.screen) check.
const WILDERNESS_SCREENS=["maze","combat","chestEncounter","herbEncounter","strongholdChest"];
function isRegenActiveNow(){
  if(GF.screen==="inventory") return !WILDERNESS_SCREENS.includes(GF.inventory_return_to);

  floatingTexts:[],

/* ---------- Tiny DOM helper ---------- */

function h(tag, attrs={}, children=[]){
  const e=document.createElement(tag);
  for(const k in attrs){
    const v=attrs[k];
    if(k==="style") Object.assign(e.style, v);
    else if(k==="html") e.innerHTML=v;
    else if(k==="class") e.className=v;
    else if(k.startsWith("on") && typeof v==="function") e.addEventListener(k.slice(2).toLowerCase(), v);
    else if(v!==false && v!=null) e.setAttribute(k, v===true?"":v);
  }
  const kids=Array.isArray(children)?children:[children];
  for(const c of kids){
    if(c==null) continue;
    e.appendChild((typeof c==="string"||typeof c==="number")?document.createTextNode(String(c)):c);
  }
  return e;
}
// v0.16: optional `fillId` lets a caller (statHeader(), see refreshStatHeaderInPlace())
// grab just the inner fill div later for an in-place width update, without touching
// anything else in the DOM -- see the regen tick's dropdown-closing bug fix below.
function bar(pct, cls, compact, fillId){ return h("div",{class:"bar-bg"+(compact?" compact":"")},[h("div",{id:fillId||undefined,class:"bar-fill "+cls, style:{width:clampf(pct,0,100)+"%"}})]); }
// v0.18 (#8): the player's own HP bar specifically -- everywhere else still just calls
// bar() directly. Renders an extra .bar-hp-heal-preview sibling UNDER the real HP fill
// (source order: preview first, real fill last -- see the .bar-fill-slow-tick/.bar-bg CSS
// comments for why absolute positioning makes that stack correctly instead of the second
// child just being pushed to the right of the first). The preview's right edge sits at
// PS.current_hp+PS.getPendingHealAmount(), so it visibly shows "how much MORE this heal
// will add" the INSTANT a potion is drunk (that pending amount is added synchronously,
// before the first heal sub-tick even runs), and shrinks on its own the moment current_hp
// drops (see getPendingHealAmount()'s own comment for why no extra plumbing is needed for
// that "shrinks if you take damage mid-heal" behavior).
function hpBar(compact){
  const maxHp=PS.getMaxHp();
  const curPct=clampf(PS.current_hp/maxHp*100,0,100);
  const pendingHeal=PS.getPendingHealAmount();
  const previewPct=clampf((PS.current_hp+pendingHeal)/maxHp*100,0,100);
  const poisoned=PS.isPoisoned();
  // The preview div is ALWAYS rendered (even at pendingHeal===0, where its width just equals
  // curPct and it's fully covered by the real fill on top, i.e. invisible) rather than being
  // conditionally added/removed -- that lets refreshStatHeaderInPlace() below patch its width
  // on every tick with a plain style mutation, with no DOM node creation/removal required for
  // an id-based incremental refresh to keep working.
  // v0.18.1 (#22) BUG FIX: floatLayer("player") used to be a CHILD of the .bar-bg div below
  // it -- but .bar-bg has overflow:hidden (needed so the two absolutely-positioned fill bars
  // never visually poke out past its rounded corners), which was silently clipping the "-X
  // HP"/CRIT!/Blocked floating text the instant it tried to rise above the bar's own box
  // (.float-text-layer positions itself at top:-6px specifically so it hovers just above
  // whatever it's anchored to). Moving it out to be a sibling of .bar-bg, inside a plain
  // position:relative wrapper that does NOT clip overflow, is the same pattern
  // screenCombat() already uses correctly for floatLayer("monster") next to the monster's
  // own HP bar -- see that call site's comment.
  return h("div",{style:{position:"relative"}},[
    h("div",{class:"bar-bg"+(compact?" compact":"")},[
      h("div",{id:"stat-hp-heal-preview",class:"bar-fill bar-hp-heal-preview",style:{width:previewPct+"%"}}),
      h("div",{id:"stat-hp-bar-fill",class:"bar-fill "+(poisoned?"bar-hp-poisoned":"bar-hp"),style:{width:curPct+"%"}}),
    ]),
    floatLayer("player"),
  ]);
}
// v0.18.1 (#20): stamina potions now heal gradually too (same mechanic as hpBar() above,
// see PS._queueGradualHeal()) -- this is the exact same pattern, just for Stamina, with no
// floatLayer() (that's HP-only combat-text real estate, not duplicated here).
function staminaBar(compact){
  const maxStamina=PS.getMaxStamina();
  const curPct=clampf(PS.current_stamina/maxStamina*100,0,100);
  const pendingHeal=PS.getPendingStaminaHealAmount();
  const previewPct=clampf((PS.current_stamina+pendingHeal)/maxStamina*100,0,100);
  return h("div",{class:"bar-bg"+(compact?" compact":"")},[
    h("div",{id:"stat-stamina-heal-preview",class:"bar-fill bar-stamina-heal-preview",style:{width:previewPct+"%"}}),
    h("div",{id:"stat-stamina-bar-fill",class:"bar-fill bar-stamina",style:{width:curPct+"%"}}),
  ]);
}
function iconBadge(svg, size){ const d=h("div",{class:"icon-badge",style:size?{width:size+"px",height:size+"px"}:{}}); d.innerHTML=svg; return d; }

// v0.18 (#9): floating combat text -- push a briefly-shown, colored, fading number/word onto
// GF.floatingTexts. `anchor` is just a grouping key ("player" or "monster"); floatLayer(anchor)
// below is what actually renders entries back out near the matching HP bar. Not persisted,
// not gated to any particular screen -- entries simply age out (see floatLayer()'s pruning)
// if nothing ever renders their anchor again.
let _floatSeq=0;
function spawnFloat(anchor,text,cls){
  GF.floatingTexts.push({id:++_floatSeq,anchor,kind:"text",text,cls,t:Date.now()});
}
// Same idea, but for a gear drop: shows the item's own SVG icon (gearIcon()) next to its name,
// colored by the same .rarity-* class used everywhere else gear names are shown.
function spawnFloatItem(anchor,inst){
  GF.floatingTexts.push({id:++_floatSeq,anchor,kind:"item",inst,t:Date.now()});
}
// Renders every still-live entry queued for `anchor` as an absolutely-positioned, upward-
// fading span/row. Called from inside an already position:relative container (hpBar()'s
// bar-bg for "player"; the monster HP bar's wrapper for "monster") so entries visually hover
// right at that bar. Each entry's animation-delay is set to NEGATIVE its own elapsed age --
// a standard CSS trick that makes a brand-new DOM node (render() rebuilds everything from
// scratch every call, so there's never an "old" node to keep animating) immediately resume
// the 2s floatUpFade keyframe at the correct in-progress frame instead of restarting it, so
// the fade reads as continuous across however many unrelated re-renders happen while it's up.
// Also does the ONLY pruning GF.floatingTexts ever gets: entries older than the animation's
// own duration are dropped from the array right here, so the queue can't grow unbounded over
// a long session even though there's no separate cleanup interval anywhere.
function floatLayer(anchor){
  const now=Date.now();
  GF.floatingTexts=GF.floatingTexts.filter(e=>now-e.t<2200);
  const mine=GF.floatingTexts.filter(e=>e.anchor===anchor);
  return h("div",{class:"float-text-layer"},mine.map((e,i)=>{
    const style={animationDelay:(-(now-e.t))+"ms",top:(-(i*20))+"px"};
    if(e.kind==="item"){
      return h("div",{class:"float-text-item",style},[gearIcon(e.inst,18),h("span",{class:"rarity-"+e.inst.rarity},[IF.displayName(e.inst)])]);
    }
    return h("div",{class:"float-text "+e.cls,style},[e.text]);
  }));
}
