<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wandrian</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{

  --hp:#d94a4a; --stamina:#eae6d9; --xp:#9e59d9; --gold:#e0b23d; --mana:#4a90d9;
  --bg:#12140f; --panel:#1c2018; --panel2:#242a1e; --border:#3a4230;
  --text:#e8e4d8; --muted:#9a9686; --accent:#4a7a3a;

  --good:#6fcf6f; --bad:#e0685f;

  --poison:#6fbf5a;

  --mz-grass1:#3f6a2c; --mz-grass2:#2b4d1c;
  --mz-dirt1:#6a5030; --mz-dirt2:#4a3620;
  --mz-stone1:#5b5f57; --mz-stone2:#3c4038;
  --mz-scorch1:#3a2420; --mz-scorch2:#1c110d;
  --mz-fog:#070a06;
  --mz-ambient:rgba(10,20,8,.35);
  --mz-torch:rgba(255,190,110,.5);
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:Georgia,'Times New Roman',serif; background:radial-gradient(ellipse at 50% 20%,#2a3322,#0c0e09 75%);
  color:var(--text); min-height:100vh;
}

#app{display:grid;grid-template-columns:288px 1fr;grid-template-rows:1fr auto;
  height:100vh;height:100dvh;width:100%;max-width:none;margin:0;padding:0;transition:opacity .18s ease;}
#hud-rail{grid-column:1;grid-row:1;overflow-y:auto;overflow-x:hidden;padding:14px 12px 18px;
  border-right:1px solid var(--border);background:linear-gradient(180deg,#161911,#12140f);
  display:flex;flex-direction:column;gap:10px;}

#hud-main{grid-column:2;grid-row:1;overflow-y:auto;overflow-x:hidden;padding:24px 22px 26px;}
#hud-footer{grid-column:1 / -1;grid-row:2;border-top:1px solid var(--border);
  background:linear-gradient(180deg,#161911,#0d0f0b);display:flex;align-items:center;gap:22px;padding:10px 26px;}
#hud-footer .hud-bars{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0;}
.hud-rail-title{font-family:Cinzel,Georgia,serif;font-size:12px;letter-spacing:.6px;color:var(--muted);
  text-transform:uppercase;margin-bottom:4px;}

#hud-rail .player-stats-grid{display:block !important;}
#hud-rail .player-stats-grid > *{width:100% !important;max-width:100% !important;min-width:0 !important;
  margin-bottom:10px;}
#hud-rail .player-stats-grid .stat-cat-body{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;}
#hud-rail .player-stats-grid .stat-cat-body > *{min-width:0;}
#hud-rail .player-stats-grid .row{flex-wrap:wrap;}
#hud-rail *{min-width:0;overflow-wrap:anywhere;}

.rail-menu-btn{padding:4px 12px;font-size:13px;line-height:1.2;}

.rail-version-link{font-size:12.5px;color:rgba(180,210,150,.75);cursor:pointer;letter-spacing:.3px;
  white-space:nowrap;}
.rail-version-link:hover{color:#cbd9a0;text-decoration:underline;}
.hud-idname{font-family:Cinzel,Georgia,serif;font-size:18px;line-height:1.2;}
.hud-idsub{font-size:12px;color:var(--muted);margin-top:2px;}

.hud-globe{position:relative;border-radius:50%;overflow:hidden;flex:0 0 auto;
  box-shadow:0 0 0 3px #241a10, 0 0 0 6px #5c462c, 0 8px 26px rgba(0,0,0,.75), inset 0 0 26px rgba(0,0,0,.75);
  background:radial-gradient(circle at 34% 28%, #2a2e24, #10120d 70%);cursor:help;}

.hud-globe .gfill{position:absolute;left:0;right:0;bottom:0;transition:height .35s ease;z-index:2;}
.hud-globe .gghost{position:absolute;left:0;right:0;bottom:0;transition:height .35s ease;z-index:1;}
.hud-globe.hp .gghost{background:linear-gradient(180deg,rgba(227,91,91,.42),rgba(142,32,32,.42));}
.hud-globe.mana .gghost{background:linear-gradient(180deg,rgba(91,162,234,.42),rgba(29,74,134,.42));}
.hud-bar .hb-ghost{position:absolute;left:0;top:0;bottom:0;transition:width .35s ease;z-index:1;}
.hud-bar .hb-fill{position:relative;z-index:2;}
.hud-bar.stam .hb-ghost{background:linear-gradient(90deg,rgba(207,202,187,.40),rgba(234,230,217,.40));}
.hud-globe .gfill::after{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:rgba(255,255,255,.28);}

.hud-globe .ggloss{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:3;
  background:radial-gradient(circle at 33% 24%, rgba(255,255,255,.30), rgba(255,255,255,0) 46%),
             radial-gradient(circle at 50% 108%, rgba(0,0,0,.55), rgba(0,0,0,0) 55%);}
.hud-globe .glbl{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:Cinzel,Georgia,serif;text-shadow:0 2px 5px rgba(0,0,0,.95);pointer-events:none;}

.hud-globe .glbl .gn{font-size:21px;line-height:1;}
.hud-globe .glbl .gt{font-size:11px;letter-spacing:1.5px;color:rgba(255,255,255,.72);margin-top:3px;}
.hud-globe.hp .gfill{background:linear-gradient(180deg,#e35b5b,#8e2020);}
.hud-globe.hp.poisoned .gfill{background:linear-gradient(180deg,#8fd06a,#3f7a2a);}
.hud-globe.mana .gfill{background:linear-gradient(180deg,#5ba2ea,#1d4a86);}

.hud-bar{position:relative;border:1px solid var(--border);border-radius:5px;background:#0d0f0b;overflow:hidden;}
.hud-bar .hb-fill{height:100%;transition:width .35s ease;}
.hud-bar.stam .hb-fill{background:linear-gradient(90deg,#cfcabb,#eae6d9);}
.hud-bar.xp .hb-fill{background:linear-gradient(90deg,#7b3fc0,#b06ff0);}

.hud-bar .hb-ticks{position:absolute;inset:0;pointer-events:none;display:flex;z-index:3;}
.hud-bar .hb-ticks i{flex:1;border-right:1px solid rgba(0,0,0,.55);box-shadow:1px 0 0 rgba(255,255,255,.09);}
.hud-bar .hb-ticks i:last-child{border-right:none;box-shadow:none;}
.hud-bar .hb-cap{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;
  font-size:11px;letter-spacing:.4px;text-shadow:0 1px 3px rgba(0,0,0,.95);pointer-events:none;white-space:nowrap;}
.hud-bar.stam .hb-cap{color:#20221a;}

@media (max-width:1000px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;height:auto;min-height:100vh;}
  #hud-rail{grid-column:1;grid-row:1;border-right:none;border-bottom:1px solid var(--border);overflow:visible;}
  #hud-main{grid-column:1;grid-row:2;padding:12px 14px 20px;}
  #hud-footer{grid-column:1;grid-row:3;gap:12px;padding:10px 12px;position:sticky;bottom:0;z-index:40;}
}
h1,h2,h3{margin:0 0 6px;}
h1{font-size:2.4em;color:#fff;text-shadow:0 0 12px rgba(255,180,80,.35);}

h2{padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:12px;}
.subtitle{color:#f0d9a0;font-size:1.05em;margin-bottom:10px;}
.lore{color:#d8d4c8;max-width:600px;line-height:1.5em;margin-bottom:14px;}
.muted{color:var(--muted);font-size:.85em;}
.flavor{color:#c0b8a0;font-style:italic;margin:6px 0 14px;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.col{display:flex;flex-direction:column;}
.gap{gap:8px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:16px 0;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 16px;}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
button{
  font-family:inherit;background:#2a3020;color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:10px 14px;cursor:pointer;font-size:.95em;transition:.12s;
}
button:hover:not(:disabled){background:#3a4a2a;border-color:#5a7a3a;}
button:disabled{opacity:.45;cursor:not-allowed;}
button.play:hover:not(:disabled){background:#3a4a2a;border-color:#5a7a3a;}
button.danger:hover:not(:disabled){background:#5a2a24;border-color:#8a4a3a;}
button.wide{width:100%;}
input[type=text],input[type=password],input[type=email],input[type=number],select{
  font-family:inherit;background:#1a1c14;border:1px solid var(--border);color:var(--text);
  border-radius:5px;padding:8px 10px;font-size:.95em;
}
input[type=text]:focus,input[type=password]:focus,input[type=email]:focus,input[type=number]:focus,select:focus{
  outline:none;border-color:#5a7a3a;box-shadow:0 0 0 2px rgba(90,122,58,.3);
}
select{cursor:pointer;}

input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{
  -webkit-text-fill-color:var(--text)!important;
  -webkit-box-shadow:0 0 0px 1000px #1a1c14 inset!important;
  box-shadow:0 0 0px 1000px #1a1c14 inset!important;
  transition:background-color 9999s ease-in-out 0s;
  caret-color:var(--text);
}
input[type=checkbox]{
  appearance:none;-webkit-appearance:none;width:19px;height:19px;border:1px solid var(--border);
  border-radius:4px;background:#1a1c14;cursor:pointer;position:relative;vertical-align:middle;flex:none;
}
input[type=checkbox]:hover{border-color:#5a7a3a;}
input[type=checkbox]:checked{background:var(--accent);border-color:#5a7a3a;}
input[type=checkbox]:checked::after{content:"✓";position:absolute;top:-3px;left:2.5px;color:#eef7e4;font-size:14px;font-weight:bold;}
.modal-backdrop{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px 22px;max-width:420px;box-shadow:0 8px 30px rgba(0,0,0,.6);}

.whats-new-box{width:min(80vw,900px);max-width:min(80vw,900px);max-height:80vh;display:flex;flex-direction:column;}
.whats-new-box ul{overflow-y:auto;flex:1;min-height:0;}
.modal-box .row{justify-content:flex-end;margin-top:16px;}
.social-login-btn{display:flex;align-items:center;justify-content:center;gap:8px;}

.bar-bg{background:#000;border-radius:4px;overflow:hidden;height:16px;border:1px solid rgba(255,255,255,.08);position:relative;}

.bar-fill{position:absolute;top:0;left:0;height:100%;transition:width .25s linear;}

.bar-hp-heal-preview{background:#a85a5a;}

.bar-stamina-heal-preview{background:#4a7a8a;}

.bar-fill-slow-tick{transition:width 1s linear;}

.bar-fill-xp-grow{transition:width 1s ease-out;}
.bar-hp{background:var(--hp);} .bar-stamina{background:var(--stamina);} .bar-xp{background:var(--xp);} .bar-gold{background:var(--gold);} .bar-brew{background:#c9a04a;} .bar-mana{background:var(--mana);}

.bar-mana-heal-preview{background:#3a6a9a;}
.mana-text{color:var(--mana);}

.float-text-layer{position:absolute;top:-6px;left:0;width:100%;height:0;overflow:visible;pointer-events:none;z-index:5;}
.float-text{position:absolute;left:50%;transform:translateX(-50%);font-weight:bold;font-size:1.05em;white-space:nowrap;animation:floatUpFade 2s ease-out forwards;text-shadow:0 1px 3px rgba(0,0,0,.85);}
.float-text-item{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;font-weight:bold;white-space:nowrap;animation:floatUpFade 2s ease-out forwards;text-shadow:0 1px 3px rgba(0,0,0,.85);}
@keyframes floatUpFade{0%{transform:translate(-50%,0);opacity:1;}100%{transform:translate(-50%,-30px);opacity:0;}}

.flee-cooldown-wrap{position:relative;display:inline-flex;}
.flee-cooldown-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-90deg);pointer-events:none;}
.flee-cooldown-ring circle{fill:none;stroke-width:2.5;}
.flee-cooldown-ring .flee-cooldown-track{stroke:rgba(255,255,255,.25);}
.flee-cooldown-ring .flee-cooldown-fill{stroke:#fff;animation:fleeCooldownFill linear forwards;}
@keyframes fleeCooldownFill{from{stroke-dashoffset:50.27;}to{stroke-dashoffset:0;}}

.spell-slot-large-wrap{position:relative;display:inline-flex;border-radius:50%;}
.spell-slot-large-wrap.clickable{cursor:pointer;}
.spell-slot-large-wrap.clickable:hover .icon-badge{filter:brightness(1.18);}
.spell-slot-cooldown-mask{position:absolute;top:0;left:0;pointer-events:none;transform:rotate(-90deg);}
.spell-slot-cooldown-mask circle{fill:none;}

.spell-slot-cooldown-fill{stroke:rgba(0,0,0,.55);animation:spellCooldownWipe linear forwards;}

.spell-slot-locked-mask{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:9;
  background:rgba(150,20,20,.55);box-shadow:inset 0 0 0 2px rgba(255,90,90,.85);
  display:flex;align-items:center;justify-content:center;}
.spell-slot-locked-mask span{font-size:1.3em;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.9));}
.spell-slot-locked-req{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:.72em;font-weight:bold;color:#ff8f8f;pointer-events:none;}

@keyframes mobFadeIn{from{opacity:0;transform:scale(.88);}to{opacity:1;transform:scale(1);}}
.mob-fade-in{animation:mobFadeIn .55s ease-out both;}

.chat-death-msg{color:#9c9c9c;}
.chat-birth-msg{color:#6fcf6f;}
.chat-admin-msg{color:#7fb6ff;font-weight:bold;}

.known-issues-banner{white-space:pre-line;margin-bottom:8px;padding:8px 12px;border-radius:8px;font-size:.9em;font-weight:bold;
  color:#ffd489;background:rgba(214,150,40,.14);border:1px solid rgba(214,150,40,.55);
  display:flex;align-items:flex-start;gap:8px;}
.known-issues-banner .kib-icon{flex:0 0 auto;}

.vault-row{display:flex;gap:18px;align-items:flex-start;}
.vault-left{flex:0 0 auto;min-width:0;}
.vault-deposit{flex:1 1 auto;min-width:0;max-height:calc(100vh - 300px);overflow-y:auto;padding-right:8px;}
.vault-deposit h3:first-child{margin-top:0;}
@media (max-width:1250px){
  .vault-row{flex-direction:column;}
  .vault-deposit{flex:1 1 auto;width:100%;max-height:none;}
}

.bonfire-alert{border-color:#e0b23d !important;animation:bonfirePulse 1.9s ease-in-out infinite;}
@keyframes bonfirePulse{
  0%,100%{box-shadow:0 0 0 1px rgba(224,178,61,.40),0 0 12px rgba(224,178,61,.22);}
  50%{box-shadow:0 0 0 1px rgba(224,178,61,.75),0 0 26px rgba(224,178,61,.50);}}
.bonfire-alert-note{color:#e0b23d;font-weight:bold;font-size:11.5px;margin-top:3px;}
@keyframes spellCooldownWipe{from{stroke-dashoffset:0;}to{stroke-dashoffset:100.53;}}

.firefly-burst-layer{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:6;}
.firefly-mote{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle,#fff6d0,#ffe27a 55%,rgba(180,255,140,0) 75%);
  box-shadow:0 0 7px 2px rgba(255,226,122,.9),0 0 12px 4px rgba(140,255,120,.4);
  animation:fireflyTravel 700ms ease-in forwards;}
@keyframes fireflyTravel{
  0%{transform:translate(var(--fmx,-50px),var(--fmy,50px)) scale(.5);opacity:0;}
  18%{opacity:1;}
  78%{opacity:1;}
  100%{transform:translate(0,0) scale(1.6);opacity:0;}
}

.entangle-roots-layer{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:6;}
.entangle-roots-overlay{position:absolute;inset:0;animation-name:entangleRootsFade;animation-timing-function:ease-in-out;animation-fill-mode:forwards;
  filter:drop-shadow(0 0 4px rgba(120,220,100,.6));}
.entangle-roots-overlay svg{width:100%;height:100%;}
@keyframes entangleRootsFade{
  0%{opacity:0;transform:scale(.92);}
  12%{opacity:1;transform:scale(1);}
  85%{opacity:1;transform:scale(1);}
  100%{opacity:0;transform:scale(1.03);}
}
.float-text-dmg{color:#ff5c5c;} .float-text-heal{color:#6cff6c;} .float-text-xp{color:#b46cff;}
.float-text-gold{color:var(--gold);} .float-text-crit{color:#ffb400;font-size:1.2em;} .float-text-block{color:#9fb0c3;}
.hp-text{color:var(--hp);} .stamina-text{color:var(--stamina);} .xp-text{color:var(--xp);} .gold-text{color:var(--gold);}

.bar-hp-poisoned{background:var(--poison);}
.hp-text-poisoned{color:var(--poison);}
.poison-icon{transition:opacity 1.1s ease; display:inline-block;}

.quad-damage-text{color:#7fd8e6;font-weight:bold;}
a.back-link,.linklike{color:#cbd9a0;cursor:pointer;text-decoration:underline;}

.char-sheet-entry-icon{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#cbd9a0;border-radius:50%;padding:3px;}
.char-sheet-entry-icon:hover{color:#e8e4c8;background:rgba(203,217,160,.15);}
.char-sheet-entry-icon.active{color:#9fd0ff;background:rgba(122,176,224,.18);cursor:default;}
.icon-badge{width:56px;height:56px;border-radius:50%;overflow:hidden;flex:none;background:#000;display:flex;align-items:center;justify-content:center;}
.icon-badge svg{width:100%;height:100%;}

.gear-tier-badge{position:absolute;top:-3px;left:-3px;min-width:13px;padding:0 2px;font-size:9px;line-height:13px;text-align:center;font-weight:bold;color:#fff;background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.35);border-radius:3px;pointer-events:none;z-index:2;}
.services{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0;}
.maze-wrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}

.maze-grid{display:grid;gap:0;background:transparent;position:relative;border-radius:4px;overflow:hidden;width:100%;}
.maze-tile{position:relative;overflow:hidden;transition:opacity .5s ease;aspect-ratio:1/1;}

@keyframes mzTileReveal{from{opacity:0}to{opacity:1}}
.mz-revealing{animation:mzTileReveal .5s ease both;}
.maze-tile::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 9px rgba(0,0,0,.32);pointer-events:none;}
.mz-ground{position:absolute;inset:0;}
.mz-ground.mz-grass{background:radial-gradient(circle at 30% 25%,var(--mz-grass1),var(--mz-grass2) 70%);}
.mz-ground.mz-dirt{background:radial-gradient(circle at 40% 35%,var(--mz-dirt1),var(--mz-dirt2) 75%);}
.mz-ground.mz-stone{background:radial-gradient(circle at 40% 30%,var(--mz-stone1),var(--mz-stone2) 78%);}
.mz-ground.mz-scorch{background:radial-gradient(circle at 50% 45%,var(--mz-scorch1),var(--mz-scorch2) 80%);}
.mz-cleared{opacity:.4;}
.mz-tuft{position:absolute;width:5px;height:7px;background:linear-gradient(180deg,var(--mz-grass1),var(--mz-grass2));
  border-radius:50% 50% 40% 40%/70% 70% 30% 30%;transform-origin:bottom center;opacity:.75;
  animation:mzsway 4s ease-in-out infinite;}
@keyframes mzsway{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}
.mz-fog{position:absolute;inset:0;background:var(--mz-fog);overflow:hidden;}
.mz-fog::before{content:"";position:absolute;inset:-25%;background:
  radial-gradient(circle at 30% 40%,rgba(60,80,60,.10),transparent 55%),
  radial-gradient(circle at 70% 65%,rgba(40,60,50,.12),transparent 55%);
  animation:mzfogdrift 9s ease-in-out infinite;}
@keyframes mzfogdrift{0%,100%{transform:translate(0,0);}50%{transform:translate(4px,-3px);}}
.mz-prop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.mz-prop svg{width:82%;height:82%;overflow:visible;}
.mz-pulse{animation:mzpulse 2.6s ease-in-out infinite;}
@keyframes mzpulse{0%,100%{filter:drop-shadow(0 0 3px rgba(140,220,255,.5));}50%{filter:drop-shadow(0 0 11px rgba(140,220,255,.9));}}
.mz-flicker{animation:mzflicker 1.1s ease-in-out infinite;transform-origin:bottom center;}
@keyframes mzflicker{0%,100%{transform:scaleY(1) scaleX(1);opacity:1;}45%{transform:scaleY(1.12) scaleX(.94);opacity:.88;}70%{transform:scaleY(.95) scaleX(1.05);opacity:1;}}
.mz-shimmer{animation:mzshimmer 3.4s ease-in-out infinite;}
@keyframes mzshimmer{0%,100%{filter:drop-shadow(0 0 2px rgba(240,217,160,.4));}50%{filter:drop-shadow(0 0 9px rgba(240,217,160,.9));}}
.mz-glint{animation:mzglint 2.2s ease-in-out infinite;}
@keyframes mzglint{0%,60%,100%{opacity:.22;}75%{opacity:.85;}}
.mz-sway-slow{animation:mzsway 5.5s ease-in-out infinite;transform-origin:bottom center;}
.mz-bob{animation:mzbob 2.4s ease-in-out infinite;}
@keyframes mzbob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
.mz-breathe{animation:mzbreathe 2.2s ease-in-out infinite;}
@keyframes mzbreathe{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}

.maze-lighting,.maze-torchcast{position:absolute;inset:0;pointer-events:none;z-index:6;}

.mzw-scale{position:absolute;left:50%;bottom:0;transform:translateX(-50%) scale(.42);transform-origin:50% 100%;}

.mzw-shadow{position:absolute;bottom:18px;left:50%;width:36px;height:8px;border-radius:50%;background:#0006;transform:translateX(-50%);animation:mzwshad var(--mzwgait) ease-in-out infinite;}

@keyframes mzwstep{0%{transform:rotate(calc(1deg*var(--mzwstride)));}50%{transform:rotate(calc(-1deg*var(--mzwstride)));}100%{transform:rotate(calc(1deg*var(--mzwstride)));}}

.mzw-arm{width:7px;height:22px;border-radius:5px;left:31px;top:34px;background:linear-gradient(180deg,var(--mzwb1),var(--mzwb2));z-index:3;}

.mzw-float .mzw-arm{animation:mzwarmfloat var(--mzwgait) ease-in-out infinite!important;}
@keyframes mzwswingF{0%{transform:rotate(calc(-1deg*var(--mzwswing)));}50%{transform:rotate(calc(1deg*var(--mzwswing)));}100%{transform:rotate(calc(-1deg*var(--mzwswing)));}}
@keyframes mzwswingB{0%{transform:rotate(calc(1deg*var(--mzwswing)));}50%{transform:rotate(calc(-1deg*var(--mzwswing)));}100%{transform:rotate(calc(1deg*var(--mzwswing)));}}
@keyframes mzwarmfloat{0%,100%{transform:rotate(18deg);}50%{transform:rotate(26deg);}}
.mzw-torso{position:absolute;left:23px;top:30px;width:24px;height:30px;border-radius:12px 12px 8px 8px;background:linear-gradient(180deg,var(--mzwb1),var(--mzwb2));z-index:2;box-shadow:inset 0 -4px 6px #0003;}

function hashHue(str){ let hh=0; for(let i=0;i<str.length;i++) hh=(hh*31+str.charCodeAt(i))>>>0; return hh%360; }
function monsterPortrait(monsterId, opts={}){
  const slain=!!opts.slain;

  if(slain && MONSTER_PORTRAITS_SLAIN[monsterId]) return MONSTER_PORTRAITS_SLAIN[monsterId];
  if(!slain && MONSTER_PORTRAITS[monsterId]) return MONSTER_PORTRAITS[monsterId];
  const hue=hashHue(monsterId||"?");
  const bodyColor=`hsl(${hue},45%,38%)`;
  const bellyColor=`hsl(${hue},35%,58%)`;
  const eyes = slain
    ? `<path d="M55,75 L70,90 M70,75 L55,90" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/><path d="M90,75 L105,90 M105,75 L90,90" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>`
    : `<circle cx="62" cy="80" r="7" fill="#1a1a1a"/><circle cx="98" cy="80" r="7" fill="#1a1a1a"/><circle cx="64" cy="78" r="2" fill="#fff"/><circle cx="100" cy="78" r="2" fill="#fff"/>`;
  const mouth = slain
    ? `<path d="M65,103 Q80,98 95,103" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="80" cy="112" rx="6" ry="9" fill="#c96a6a"/>`
    : `<path d="M65,105 Q80,116 95,105" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const dizzy = slain
    ? `<path d="M58,48 Q68,38 78,48 Q88,58 98,48" stroke="#e0c94a" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85"/><circle cx="58" cy="46" r="2.2" fill="#e0c94a"/><circle cx="98" cy="46" r="2.2" fill="#e0c94a"/>`
    : "";
  return `<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg"><ellipse cx="80" cy="95" rx="55" ry="48" fill="${bodyColor}"${slain?' opacity="0.7"':''}/><ellipse cx="80" cy="107" rx="34" ry="26" fill="${bellyColor}" opacity="0.6"/>${dizzy}${eyes}${mouth}</svg>`;
}

function itemIconSvg(itemId){

  const item=DL.getItem(itemId);
  const hue=hashHue(itemId);

  if(itemId==="dry_branch"){
    return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="16" width="28" height="10" rx="5" fill="#8a5a35" stroke="#5a3a1f" stroke-width="1.5" transform="rotate(-8 20 20)"/><ellipse cx="8" cy="19" rx="3.2" ry="4.6" fill="#c99a6a" stroke="#5a3a1f" stroke-width="1.2" transform="rotate(-8 20 20)"/><ellipse cx="8" cy="19" rx="1.4" ry="2.2" fill="#8a5a35" transform="rotate(-8 20 20)"/><path d="M14,17 Q20,19 26,15" stroke="#5a3a1f" stroke-width="1" fill="none" opacity="0.6" transform="rotate(-8 20 20)"/><path d="M13,23 Q20,25 27,22" stroke="#5a3a1f" stroke-width="1" fill="none" opacity="0.6" transform="rotate(-8 20 20)"/></svg>`;
  }

  if(itemId.indexOf("stronghold_key")===0){
    const teeth=`hsl(${hue},55%,50%)`;
    return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><circle cx="14" cy="14" r="7" fill="none" stroke="${teeth}" stroke-width="3.5"/><rect x="18" y="18" width="4" height="16" fill="${teeth}" transform="rotate(45 20 26)"/><rect x="24" y="24" width="6" height="3.4" fill="${teeth}" transform="rotate(45 27 25.7)"/><rect x="28" y="28" width="6" height="3.4" fill="${teeth}" transform="rotate(45 31 29.7)"/></svg>`;
  }
  if(item.type==="consumable"){

    const isHealthPotion=!!item.heal_amount;
    const liquid=isHealthPotion ? `hsl(355,72%,${58-clampf((item.heal_amount-20)/(180-20),0,1)*22}%)` : `hsl(${hue},70%,52%)`;
    const glassSliver=isHealthPotion ? `<path d="M13,12 Q12,15 13,19" stroke="#ffffff" stroke-width="1.6" fill="none" opacity="0.7" stroke-linecap="round"/>` : "";

  }
  if(item.type==="scroll"){
    const ribbon=`hsl(${hue},60%,45%)`;
    return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="14" width="28" height="12" rx="6" fill="#e8d9b0" stroke="#a8946a" stroke-width="1.5"/><rect x="4" y="14" width="6" height="12" rx="3" fill="#d8c090"/><rect x="30" y="14" width="6" height="12" rx="3" fill="#d8c090"/><rect x="10" y="18" width="20" height="2" fill="${ribbon}"/></svg>`;
  }
  if(item.type==="bag"){
    const cloth=`hsl(${hue},35%,42%)`;
    return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M12,16 Q20,10 28,16 L30,34 Q20,38 10,34 Z" fill="${cloth}" stroke="#2a2a2a" stroke-width="1.2"/><rect x="17" y="9" width="6" height="6" rx="2" fill="none" stroke="#c9a04a" stroke-width="1.5"/></svg>`;

  return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="14" fill="#666"/></svg>`;
}

function questCurrentTown(){ return (PS.getClassData().tier)||1; }
function questTownIdx(town){ return clampi((town||1)-1,0,4); }

function questTargetFor(qid){
  const T=Balance.QUEST_DEFS.TARGETS;
  if(qid==="gatherer") return T.gatherer_herbs;
  if(qid==="wanderers") return T.wanderers_roamers;
  if(qid==="streak") return T.streak_kills;
  if(qid==="cauldron") return Balance.QUEST_DEFS.CAULDRON_DISTINCT_TARGET;

  if(qid==="palisade") return T.palisade_chests;
  return 1;
}

function questIsGated(qid){ return (Balance.QUEST_DEFS.LEVEL_REQ[qid]||1)>1; }
function questInitialStatus(qid){ return questIsGated(qid)?"locked":"active"; }

function questBuildEntry(qid){
  let entry;
  if(qid==="elder"){
    entry={step:1, progress:0, target:Balance.QUEST_DEFS.ASCENDANT_HUNT_STEPS[0].count, status:questInitialStatus(qid)};
  } else if(qid==="wardens"){
    entry={step:1, progress:0, target:Balance.QUEST_DEFS.WARDEN_TRIAL_STEPS[0].count, status:questInitialStatus(qid)};
  } else if(qid==="trader"){
    entry={step:1, progress:0, target:Balance.QUEST_DEFS.TRADER_STEPS[0].count, status:questInitialStatus(qid)};
  } else if(qid==="cleanse"){
    entry={step:1, progress:0, target:Balance.QUEST_DEFS.CLEANSE_STEPS[0].count, status:questInitialStatus(qid)};
  } else {
    entry={progress:0, target:questTargetFor(qid), status:questInitialStatus(qid)};
  }
  if(qid==="cauldron"){ entry.attr_potion_brewed=false; entry.distinct_brewed=[]; }
  return entry;
}
function questBuildEntriesForTown(town){
  const entries={};
  for(const qid of Balance.QUEST_DEFS.IDS) entries[qid]=questBuildEntry(qid);
  return entries;
}

function questEnsureLocalState(){
  const town=questCurrentTown();
  if(!PS.quests || typeof PS.quests!=="object" || !PS.quests.entries || PS.quests.town!==town){
    PS.quests={town, entries:questBuildEntriesForTown(town)};

    PS.quests_seen_at_level=0;
  }
  if(!PS.quest_attr_bonus || typeof PS.quest_attr_bonus!=="object") PS.quest_attr_bonus={str:0,dex:0,vit:0,int:0};
  if(typeof PS.quest_bonus_hp!=="number") PS.quest_bonus_hp=0;
  if(typeof PS.unspent_quest_stat_points!=="number") PS.unspent_quest_stat_points=0;
  if(typeof PS.quests_seen_at_level!=="number") PS.quests_seen_at_level=0;
  for(const qid of Balance.QUEST_DEFS.IDS){

    if(!PS.quests.entries[qid]) PS.quests.entries[qid]=questBuildEntry(qid);
    const entry=PS.quests.entries[qid];
    if(entry.status==="locked" && PS.level>=Balance.QUEST_DEFS.LEVEL_REQ[qid]) entry.status="active";
  }

  const elderEntry=PS.quests.entries.elder;
  if(elderEntry && typeof elderEntry.step!=="number"){
    elderEntry.step=1; elderEntry.progress=0; elderEntry.target=Balance.QUEST_DEFS.ASCENDANT_HUNT_STEPS[0].count;
    if(elderEntry.status==="ready"||elderEntry.status==="claimed") elderEntry.status="active";
  }

  const wardensEntry=PS.quests.entries.wardens;
  if(wardensEntry && typeof wardensEntry.step!=="number"){
    wardensEntry.step=1; wardensEntry.progress=0; wardensEntry.target=Balance.QUEST_DEFS.WARDEN_TRIAL_STEPS[0].count;
    if(wardensEntry.status==="ready"||wardensEntry.status==="claimed") wardensEntry.status="active";
  }

  for(const qid of ["gatherer","wanderers","streak","palisade"]){
    const e=PS.quests.entries[qid];
    if(!e) continue;
    const fresh=questTargetFor(qid);
    if(e.target!==fresh){
      e.target=fresh;
      e.progress=Math.min(e.progress||0, e.target);
      if(e.status==="active" && e.progress>=e.target) e.status="ready";
    }
  }
  const cauldronEntry=PS.quests.entries.cauldron;
  if(cauldronEntry && !Array.isArray(cauldronEntry.distinct_brewed)){
    cauldronEntry.distinct_brewed=[]; cauldronEntry.progress=0; cauldronEntry.target=Balance.QUEST_DEFS.CAULDRON_DISTINCT_TARGET;
    if(cauldronEntry.status==="ready"||cauldronEntry.status==="claimed") cauldronEntry.status="active";
  }
  return PS.quests;
}

function questsHaveNewUnlock(){
  questEnsureLocalState();
  return Balance.QUEST_DEFS.IDS.some(qid=>{
    const req=Balance.QUEST_DEFS.LEVEL_REQ[qid];
    return req>PS.quests_seen_at_level && PS.level>=req;
  });
}
function questsHaveReady(){
  questEnsureLocalState();
  return Balance.QUEST_DEFS.IDS.some(qid=>PS.quests.entries[qid] && PS.quests.entries[qid].status==="ready");
}
function questsClaimedOrReadyCount(){
  questEnsureLocalState();
  return Balance.QUEST_DEFS.IDS.filter(qid=>{
    const s=PS.quests.entries[qid] && PS.quests.entries[qid].status;
    return s==="ready"||s==="claimed";
  }).length;
}

function questsMarkSeen(){
  questEnsureLocalState();
  PS.quests_seen_at_level=Math.max(PS.quests_seen_at_level||0, PS.level);
}

function questsButton(){
  questEnsureLocalState();
  const ready=questsHaveReady();
  const isNew=!ready && questsHaveNewUnlock();
  const cls="qbtn"+(ready?" ready":isNew?" new":"");
  const title=ready?"A quest reward is ready to claim!":isNew?"A new quest just unlocked.":"View your quests";
  return h("button",{class:cls,title,onClick:()=>{ questsMarkSeen(); GF.goto("quests",{quests_return_to:GF.screen}); }},[

    `Quests ${questsClaimedOrReadyCount()}/9`,
    ready?h("span",{class:"qbtn-dot"}):null,
    isNew?h("span",{class:"qbtn-arrow"},["▲"]):null,
  ]);
}

const ASCENDANT_HUNT_BAND_DISPLAY={Common:"Newborn", Uncommon:"Young", Rare:"Mature", Epic:"Elder", Legendary:"Ancient"};

function questObjectiveText(qid,entry){
  const T=Balance.QUEST_DEFS.TARGETS;
  const stepOf=(num,total)=>`Step ${num}/${total}: `;

  if(qid==="explore") return `In one delve, wear every grass tile down to bare dirt (three steps each) and clear every roamer, guardian, chest, herb node and shrine in the maze.`;
  if(qid==="wardens"){
    const steps=Balance.QUEST_DEFS.WARDEN_TRIAL_STEPS;
    const stepNum=(entry&&entry.step)||1;
    const step=steps[stepNum-1]||steps[0];
    return `${stepOf(stepNum,steps.length)}fell ${step.count} stronghold guardians in a single delve, at any area level. Returning to town or dying starts the count over.`;
  }
  if(qid==="gatherer") return `Harvest ${T.gatherer_herbs} herb nodes across the mazes.`;
  if(qid==="wanderers") return `Slay ${T.wanderers_roamers} roaming monsters as they wander the maze.`;
  if(qid==="streak") return `Reach a kill streak of ${T.streak_kills} without returning to town.`;
  if(qid==="cauldron"){
    const sub=Balance.QUEST_DEFS.CAULDRON_ATTR_POTION_REQUIRED;
    return `Brew ${Balance.QUEST_DEFS.CAULDRON_DISTINCT_TARGET} different types of potions at the Alchemist${sub?", including at least one Potion of Might, Swiftness, or Intellect":""}.`;
  }
  if(qid==="elder"){
    const steps=Balance.QUEST_DEFS.ASCENDANT_HUNT_STEPS;
    const stepNum=(entry&&entry.step)||1;
    const step=steps[stepNum-1]||steps[0];
    const band=ASCENDANT_HUNT_BAND_DISPLAY[step.band]||step.band;
    return `${stepOf(stepNum,steps.length)}defeat ${step.count>1?step.count+" "+band+"-band monsters":"a "+band+"-band monster"}.`;
  }
  if(qid==="trader"){
    const steps=Balance.QUEST_DEFS.TRADER_STEPS;
    const stepNum=(entry&&entry.step)||1;
    const step=steps[stepNum-1]||steps[0];
    return `${stepOf(stepNum,steps.length)}sell ${step.count===1?"an item":step.count+" items"} on the Auction House. Sales count for the character who listed them, and progress carries across towns.`;
  }
  if(qid==="cleanse"){
    const steps=Balance.QUEST_DEFS.CLEANSE_STEPS;
    const stepNum=(entry&&entry.step)||1;
    const step=steps[stepNum-1]||steps[0];
    return `${stepOf(stepNum,steps.length)}slay ${step.count.toLocaleString()} monsters. Counts every monster this character has ever killed, and survives promotions.`;
  }
  if(qid==="palisade") return `Open ${T.palisade_chests>1?T.palisade_chests+" stronghold chests":"a stronghold chest"} (progress carries across the whole town, not just one delve).`;

  if(qid==="pacifist") return `Slay a monster in combat without ever landing a blow of your own.`;
  return "";
}
const QUEST_CHIP_ICONS={
  hp:`<svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z" fill="#e07a7a"/></svg>`,
  gold:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#e0b23d" stroke="#b98f30" stroke-width="1.5"/></svg>`,
  statpt:`<svg viewBox="0 0 24 24"><path d="M12 3 l2.5 6 6 .4 -4.6 3.9 1.5 5.9 -5.4-3.3 -5.4 3.3 1.5-5.9 -4.6-3.9 6-.4z" fill="#8fd07a"/></svg>`,
  xp:`<svg viewBox="0 0 24 24"><path d="M12 3l7 4v10l-7 4-7-4V7z" fill="none" stroke="#9e59d9" stroke-width="1.8"/></svg>`,

function questChip(text,iconKey){
  const icon=iconKey?h("span",{},[]):null;
  if(icon) icon.innerHTML=QUEST_CHIP_ICONS[iconKey]||"";
  return h("span",{class:"quest-chip"},[icon,text]);
}

function questRewardChips(qid,entry){
  const R=Balance.QUEST_DEFS.REWARDS;
  const chips=[];
  if(qid==="explore"){
    chips.push(questChip(`+${R.explore.hp} Max HP`,"hp"));
    chips.push(questChip(`${R.explore.gold} g`,"gold"));
  } else if(qid==="wardens"){

    const steps=Balance.QUEST_DEFS.WARDEN_TRIAL_STEPS;
    const step=steps[((entry&&entry.step)||1)-1]||steps[0];
    chips.push(questChip(`+${step.stat_points} stat pt${step.stat_points===1?"":"s"}`,"statpt"));
    chips.push(questChip(`${step.gold} g`,"gold"));
    chips.push(questChip(`${step.xp} XP`,"xp"));
  } else if(qid==="gatherer"){
    for(const itemId of R.gatherer.elixirs) chips.push(questChip(DL.getItem(itemId).name||itemId));
    chips.push(questChip("Bonus XP shrine"));
  } else if(qid==="wanderers"){
    chips.push(questChip(`+${R.wanderers.hp} Max HP`,"hp"));
    chips.push(questChip(`${R.wanderers.gold} g`,"gold"));
    chips.push(questChip(`${R.wanderers.xp} XP`,"xp"));
  } else if(qid==="streak"){
    chips.push(questChip(`${R.streak.gold} g`,"gold"));
    chips.push(questChip(`${R.streak.xp} XP`,"xp"));
  } else if(qid==="cauldron"){
    for(const itemId of R.cauldron.elixirs) chips.push(questChip(DL.getItem(itemId).name||itemId));
    chips.push(questChip(`+${R.cauldron.stat_points} stat pt${R.cauldron.stat_points===1?"":"s"}`,"statpt"));
  } else if(qid==="elder"){
    const step=Balance.QUEST_DEFS.ASCENDANT_HUNT_STEPS[((entry&&entry.step)||1)-1];
    chips.push(questChip(`+${step.stat_points} stat pt${step.stat_points===1?"":"s"}`,"statpt"));
    chips.push(questChip(`${step.xp} XP`,"xp"));
  } else if(qid==="trader"||qid==="cleanse"){
    const steps=qid==="trader"?Balance.QUEST_DEFS.TRADER_STEPS:Balance.QUEST_DEFS.CLEANSE_STEPS;
    const step=steps[((entry&&entry.step)||1)-1]||steps[0];
    chips.push(questChip(`+${step.stat_points} stat pt${step.stat_points===1?"":"s"}`,"statpt"));
    if(step.gold) chips.push(questChip(`${step.gold.toLocaleString()} g`,"gold"));
    if(step.xp) chips.push(questChip(`${step.xp.toLocaleString()} XP`,"xp"));
  } else if(qid==="palisade"){
    chips.push(questChip(`${R.palisade.gold} g`,"gold"));

    const keyTier=clampi(((PS.quests&&PS.quests.town)||1)+1,1,Balance.ITEM_TIER_MAX);
    chips.push(questChip(DL.getItem(Balance.strongholdKeyItemIdForTier(keyTier)).name||"Stronghold Key"));
  } else if(qid==="pacifist"){
    const pr=Balance.QUEST_DEFS.PACIFIST_REWARD;
    chips.push(questChip(`+${pr.stat_points} stat pts`,"statpt"));
    chips.push(questChip(`${pr.xp} XP`,"xp"));
    for(const [itemId,qty] of Object.entries(pr.potions)) chips.push(questChip(`${qty}x ${DL.getItem(itemId).name||itemId}`));
  }
  return chips;
}

async function claimQuestReward(questId){
  if(GF.questClaiming) return;
  GF.questClaiming=questId; render();
  try{
    const result=await Net.claimQuest(PS.current_slot, questId);
    PS._saveSeqFloor=Math.max(PS._saveSeqFloor||0, result._save_seq);
    PS.quests=result.quests;
    PS.quest_attr_bonus=result.quest_attr_bonus;
    PS.quest_bonus_hp=result.quest_bonus_hp;
    PS.unspent_quest_stat_points=result.unspent_quest_stat_points;
    PS.current_hp=result.current_hp;
    if(typeof result.account_gold==="number") Net.setAuthoritativeGold(result.account_gold);
    const reward=result.reward||{};
    if(reward.quest_bonus_hp) spawnFloat("player",`+${reward.quest_bonus_hp} Max HP`,"float-text-heal");
    if(reward.gold) PS.gold+=reward.gold;
    if(reward.xp) PS.addXpRaw(reward.xp);
    if(reward.stat_points) setToast(`+${reward.stat_points} quest stat point${reward.stat_points===1?"":"s"} to spend in your Character Sheet.`);
    if(Array.isArray(reward.elixirs)) for(const itemId of reward.elixirs) PS.addConsumable(itemId,1);
    if(reward.key_item_id) PS.addConsumable(reward.key_item_id,1);
    if(reward.gear) PS.addGearAutoEquip(reward.gear);

    if(reward.potions && typeof reward.potions==="object"){
      for(const [itemId,qty] of Object.entries(reward.potions)) PS.addConsumable(itemId,qty);
      const names=Object.entries(reward.potions).map(([itemId,qty])=>`${qty}x ${DL.getItem(itemId).name||itemId}`).join(", ");
      setToast(`The Pacifist complete! Received ${names}.`);
    }

    if(questId==="elder" && typeof reward.step==="number"){
      setToast(reward.done ? "The Ascendant Hunt complete! Every band has fallen to you." : `Step ${reward.step}/${reward.step_count} of The Ascendant Hunt complete, the next band awaits.`);
    }

    if((questId==="trader"||questId==="cleanse") && typeof reward.step==="number"){
      const name=Balance.QUEST_DEFS.NAMES[questId];
      setToast(reward.done ? `${name} complete!` : `Step ${reward.step}/${reward.step_count} of ${name} complete.`);
    }
    if(questId==="wardens" && typeof reward.step==="number"){
      const wardenName=Balance.QUEST_DEFS.NAMES.wardens;
      setToast(reward.done ? `${wardenName} complete! No stronghold in these woods still stands against you.` : `Step ${reward.step}/${reward.step_count} of ${wardenName} complete, a longer delve awaits.`);
    }
    autosave();
  }catch(e){
    setToast("Could not claim that quest: "+e.message);
  }
  GF.questClaiming=null; render();
}
async function spendQuestStatPointClick(stat){
  if(GF.questSpendingStat) return;
  GF.questSpendingStat=true; render();
  try{
    const result=await Net.spendQuestStatPoint(PS.current_slot, stat);
    PS._saveSeqFloor=Math.max(PS._saveSeqFloor||0, result._save_seq);
    PS.unspent_quest_stat_points=result.unspent_quest_stat_points;
    PS.quest_attr_bonus=result.quest_attr_bonus;
    autosave();
  }catch(e){
    setToast("Could not spend that point: "+e.message);
  }
  GF.questSpendingStat=false; render();
}

function applyQuestReportResult(result){
  if(result && result.quests) PS.quests=result.quests;
  if(result && result._save_seq) PS._saveSeqFloor=Math.max(PS._saveSeqFloor||0, result._save_seq);
}

function reportQuestExploreIfEligible(maze){
  if(!maze || maze._questExploreReported) return;
  questEnsureLocalState();
  const entry=PS.quests.entries.explore;
  if(!entry || entry.status!=="active") return;

  if(!mazeIsFullyExplored(maze)) return;
  maze._questExploreReported=true;

  Net.reportQuestExplore(PS.current_slot, maze.depth).then(applyQuestReportResult).catch(()=>{});
}

function mazeIsFullyExplored(maze){
  for(const cell of maze.cells){
    if(cell.type==="grass" && (cell.trampleCount||0)<3) return false;
    if((cell.type==="herb"||cell.type==="chest"||cell.type==="shrine"||cell.type==="stronghold_chest"||cell.type==="stronghold_guardian") && !cell.cleared) return false;
  }
  if(maze.roamers) for(const r of maze.roamers) if(!r.defeated) return false;
  return true;
}

function reportQuestHerbHarvest(){
  questEnsureLocalState();
  const entry=PS.quests.entries.gatherer;
  if(!entry || entry.status!=="active") return;
  Net.reportQuestHerbHarvest(PS.current_slot, 1).then(applyQuestReportResult).catch(()=>{});
}

function reportQuestBrew(itemId){
  questEnsureLocalState();
  const entry=PS.quests.entries.cauldron;
  if(!entry || entry.status!=="active") return;
  if(!Balance.QUEST_DEFS.BREWABLE_ITEM_IDS.includes(itemId)) return;
  Net.reportQuestBrew(PS.current_slot, itemId).then(applyQuestReportResult).catch(()=>{});
}

function reportQuestStrongholdChest(areaLevel){
  questEnsureLocalState();
  const entry=PS.quests.entries.palisade;
  if(!entry || entry.status!=="active") return;
  Net.reportQuestStrongholdChest(PS.current_slot, areaLevel).then(applyQuestReportResult).catch(()=>{});
}

function questCard(qid){

  const entry=PS.quests.entries[qid]||questBuildEntry(qid);
  const status=entry.status;
  const name=Balance.QUEST_DEFS.NAMES[qid]||qid;
  const iconWrap=h("span",{},[]);
  iconWrap.innerHTML=questIconSvg(qid);
  const body=[
    h("div",{class:"quest-chead"},[
      h("div",{class:"quest-badge"},[iconWrap]),
      h("div",{style:{flex:"1",minWidth:"0"}},[
        h("div",{class:"quest-name"},[name]),

        status==="locked" && questIsGated(qid)
          ? h("div",{class:"quest-lock-line"},[`Unlocks at Level ${Balance.QUEST_DEFS.LEVEL_REQ[qid]}`])

          : h("div",{class:"quest-obj"},[questObjectiveText(qid,entry)]),
      ]),
    ]),
  ];
  if(!(status==="locked" && questIsGated(qid))){
    const pct=entry.target>0?(entry.progress/entry.target*100):0;
    body.push(bar(pct,"bar-gold",false));
    body.push(h("div",{class:"quest-pnum"},[`${Math.min(entry.progress,entry.target)}/${entry.target}`]));
    body.push(h("div",{class:"quest-reward"},questRewardChips(qid,entry)));
    if(status==="ready"){
      const claiming=GF.questClaiming===qid;
      body.push(h("button",{class:"quest-claim",disabled:claiming,onClick:()=>claimQuestReward(qid)},[claiming?"Claiming...":"Claim Reward"]));
    } else if(status==="claimed"){
      body.push(h("div",{class:"quest-done"},["✓ Claimed"]));
    } else {
      body.push(h("div",{class:"quest-inprog"},["In progress"]));
    }
  }
  return h("div",{class:"tile quest-card"+(status==="locked"?" locked":status==="ready"?" ready":status==="claimed"?" claimed":"")},body);
}

function screenQuests(){
  questEnsureLocalState();
  questsMarkSeen();
  const root=h("div",{});
  root.appendChild(h("button",{style:{marginBottom:"8px"},onClick:()=>GF.goto(GF.quests_return_to||"town")},["← Back"]));
  root.appendChild(statHeader());
  root.appendChild(h("h2",{style:{margin:"14px 0 2px"}},["Quests"]));
  root.appendChild(h("div",{class:"muted"},["Complete objectives around this town to earn bonus HP, attribute points, gold, gear, and more. Every quest asks for the same thing in every town, so nothing here changes as you climb. New quests unlock as you level, and the whole board resets whenever you attempt a Broken Bridge Trial, whether you pass or fall."]));
  const grid=h("div",{class:"quest-card-grid"});
  for(const qid of Balance.QUEST_DEFS.IDS) grid.appendChild(questCard(qid));
  root.appendChild(grid);
  return root;
}

function gearIconSvg(inst){
  const color=RARITY_ICON_COLORS[inst.rarity]||"#9a9686";
  const shapes={
    weapon:`<path d="M20,6 L24,10 L15,32 L11,28 Z" fill="${color}" stroke="#222" stroke-width="1.2"/><rect x="9" y="27" width="8" height="4" rx="1" fill="#5a4028" transform="rotate(-40 13 29)"/>`,
    head:`<path d="M8,22 Q8,8 20,8 Q32,8 32,22 L32,24 L8,24 Z" fill="${color}" stroke="#222" stroke-width="1.2"/><rect x="8" y="22" width="24" height="4" fill="#222" opacity="0.3"/>`,
    shoulders:`<circle cx="13" cy="16" r="8" fill="${color}" stroke="#222" stroke-width="1.2"/><circle cx="27" cy="16" r="8" fill="${color}" stroke="#222" stroke-width="1.2"/>`,
    armor:`<path d="M12,10 L28,10 L31,18 L26,34 L14,34 L9,18 Z" fill="${color}" stroke="#222" stroke-width="1.2"/>`,
    pants:`<path d="M14,8 L26,8 L27,32 L21,32 L20,18 L19,32 L13,32 Z" fill="${color}" stroke="#222" stroke-width="1.2"/>`,
    gloves:`<path d="M12,18 L12,10 L16,10 L16,16 L18,16 L18,8 L22,8 L22,16 L24,16 L24,10 L28,10 L28,20 Q28,30 20,32 Q12,30 12,18 Z" fill="${color}" stroke="#222" stroke-width="1.2"/>`,
    boots:`<path d="M15,6 L25,6 L25,22 L31,26 L31,32 L11,32 L11,20 L15,20 Z" fill="${color}" stroke="#222" stroke-width="1.2"/>`,
    ring:`<circle cx="20" cy="20" r="11" fill="none" stroke="${color}" stroke-width="4.5"/><circle cx="20" cy="10" r="3" fill="${color}"/>`,
    amulet:`<path d="M20,6 L20,14" stroke="${color}" stroke-width="2.5"/><circle cx="20" cy="22" r="9" fill="${color}" stroke="#222" stroke-width="1.2"/><circle cx="20" cy="22" r="3.5" fill="#222" opacity="0.35"/>`,
    belt:`<rect x="6" y="16" width="28" height="8" rx="2" fill="${color}" stroke="#222" stroke-width="1.2"/><rect x="17" y="15" width="6" height="10" fill="#222" opacity="0.4"/>`,

    offhand:IF.offhandTypeForInstance(inst)==="orb"
      ? `<circle cx="20" cy="20" r="12" fill="${color}" stroke="#222" stroke-width="1.2"/><circle cx="16" cy="16" r="3.5" fill="#fff" opacity="0.5"/>`
      : `<path d="M20,6 L32,10 L32,19 Q32,29 20,34 Q8,29 8,19 L8,10 Z" fill="${color}" stroke="#222" stroke-width="1.2"/><path d="M20,10 L20,30" stroke="#222" stroke-width="1" opacity="0.35"/>`,
  };
  const body=shapes[inst.slot]||`<circle cx="20" cy="20" r="14" fill="${color}"/>`;
  return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
}

    if(Math.random()<Math.min(0.9,mfPct/100)){
      const second=rollOnce();
      const firstIdx=this.RARITY_TABLE.indexOf(first), secondIdx=this.RARITY_TABLE.indexOf(second);
      return secondIdx>firstIdx?second:first;
    }
    return first;
  },
  bridgePlankCount(tier){return clampi((tier||1)+1,this.BRIDGE_MIN_PLANKS,this.BRIDGE_MAX_PLANKS);},
  bridgeStepPassChance(tier){return 1.0/this.bridgePlankCount(tier);},
  trialLevelRequirement(tier){return clampi(tier||1,1,4)*this.TRIAL_LEVEL_REQUIREMENT_PER_TIER;},

  auctionListingFee(price){return Math.max(1, Math.ceil((price||0)*0.01));},

  weaponSkillCumulativeHitsForLevel(level){ return this.WEAPON_SKILL_HIT_STEP*level*(level+1)/2; },
  weaponSkillLevelForHits(hits){
    let level=0;
    while(this.weaponSkillCumulativeHitsForLevel(level+1)<=hits) level++;
    return level;
  },

  strongholdKeyEligible(mazeDepth, playerLevel){ return (mazeDepth||1)>=(playerLevel||1)-1; },

  salvageValue(tier,slots){return Math.round(Math.pow(tier,1.5)*slots*this.SALVAGE_MATERIALS_PER_SLOT);},
  rerollCost(tier,slots){return this.salvageValue(tier,slots)*this.REROLL_MATERIAL_COST_MULT;},

  sellValue(tier,slots){return Math.round(Math.pow(tier,1.5)*slots*this.SELL_GOLD_PER_SLOT);},

  rerollGoldCost(tier,slots){return this.sellValue(tier,slots)*this.REROLL_GOLD_COST_MULT;},
  reforgeCost(tier,slots){return this.rerollCost(tier,slots)*this.REFORGE_MATERIAL_COST_MULT;},
  reforgeGoldCost(tier,slots){return this.sellValue(tier,slots)*this.REFORGE_GOLD_COST_MULT;},

  refineCost(tier,slots){return Math.round(this.reforgeCost(tier,slots)*this.REFINE_MATERIAL_COST_MULT);},
  refineGoldCost(tier,slots){return this.reforgeGoldCost(tier,slots)*this.REFINE_GOLD_COST_MULT;},

  bagBuyPrice(cap,itemId){
    if(itemId && this.BAG_BUY_PRICES[itemId]!=null) return this.BAG_BUY_PRICES[itemId];
    return cap*this.BAG_BUY_GOLD_PER_CAPACITY;
  },

  itemBuyPrice(item){ return item.buy_price!=null ? item.buy_price : Math.round((item.sell_value||1)*this.VENDOR_MARKUP); },
  bagCraftCost(cap){return cap*this.BAG_CRAFT_MATERIALS_PER_CAPACITY;},

  MERCHANT_STOCK_SIZE:6,
  MERCHANT_PRICE_BANDS:{
    Legendary:[8000,15000],
    Epic:[5000,9000],
    Rare:[2000,5000],
    Uncommon:[500,2000],
    Common:[500,2000],
  },

  MERCHANT_RARITY_PRICE_MULTIPLIER:{Legendary:1.0, Epic:0.75, Rare:0.5, Uncommon:0.25, Common:0.25},
  merchantGearPrice(inst){
    const band=this.MERCHANT_PRICE_BANDS[inst.rarity]||this.MERCHANT_PRICE_BANDS.Common;
    const [lo,hi]=band;
    const quality=IF.gearRollQuality(inst);
    const raw=lo+quality*(hi-lo);
    const mult=this.MERCHANT_RARITY_PRICE_MULTIPLIER[inst.rarity]!=null?this.MERCHANT_RARITY_PRICE_MULTIPLIER[inst.rarity]:1;
    return Math.max(1,Math.round(raw*mult));
  },
};

function clampi(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function clampf(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function randi(n){return Math.floor(Math.random()*n);}
function randRange(a,b){return a+Math.random()*(b-a);}
function randIntRange(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(arr){return arr[randi(arr.length)];}

function round2(v){return Math.round(v*100)/100;}

function trimDecimal(v){let s=round2(v).toFixed(2); if(s.indexOf(".")!==-1){ s=s.replace(/0+$/,""); s=s.replace(/\.$/,""); } return s;}

const DL = {
  getClass(id){return CLASSES[id]||{};},
  starterClassIds(){return Object.keys(CLASSES).filter(id=>CLASSES[id].tier===1);},
  getNextClassId(id){const c=this.getClass(id); return c.next_class||"";},

  itemCategoryLabel(id){

    if(item.type==="bag") return "Bag";
    if(item.type==="scroll") return "Scroll";

    if(id.indexOf("stronghold_key")===0) return "Key";

    if(item.heal_amount!=null || item.stamina_amount!=null || item.mana_amount!=null || item.eyesight_steps!=null || item.buff_type || item.cures_poison || item.reveals_maze) return "Potion";

  itemShopSubtext(id){

    if(item.stamina_amount!=null) return `Gradually recovers ${item.stamina_amount} stamina.`;

  getMonster(id){return MONSTERS.find(m=>m.id===id)||{};},
  getHerb(id){return HERBS[id]||{};},

  commonHerbIds(){return Object.keys(HERBS).filter(id=>!HERBS[id].rare);},

  rareHerbIds(){return Object.keys(HERBS).filter(id=>HERBS[id].rare);},

  rareHerbIdsForAreaLevel(areaLevel){
    return DL.rareHerbIds().filter(id=>(HERBS[id].min_area_level||1)<=(areaLevel||1));
  },
  pickHerbForNode(areaLevel=1){
    if(Math.random()<Balance.RARE_HERB_CHANCE){
      const pool=DL.rareHerbIdsForAreaLevel(areaLevel);
      if(pool.length>0) return pick(pool);
    }
    return pick(DL.commonHerbIds());
  },
  allRecipes(){return RECIPES;},
  pickRandomMonsterForArea(areaLevel){

    let pool=MONSTERS.filter(m=>areaLevel>=(MONSTER_BAND_INFO[m.tier]||{minAreaLevel:1}).minAreaLevel);
    if(pool.length===0) pool=MONSTERS;
    return pick(pool);
  },

  rollLoot(tableId, mfPct=0){
    const table=LOOT_TABLES[tableId]||[];
    const rollOnce=()=>{
      if(table.length===0) return {type:"nothing"};
      let total=0; for(const e of table) total+=e.weight;
      if(total<=0) return {type:"nothing"};
      let roll=randi(total), cum=0;
      for(const e of table){cum+=e.weight; if(roll<cum) return e;}
      return {type:"nothing"};
    };
    const first=rollOnce();
    if(first.type!=="nothing" || !mfPct) return first;
    if(Math.random()<Math.min(0.9,mfPct/100)){
      const second=rollOnce();
      if(second.type!=="nothing") return second;
    }
    return first;
  },
};

  setDefForBaseName(baseName){

      const def=this.ITEM_SETS[setId];
      for(const slotKey in def.pieces){ if(def.pieces[slotKey]===baseName) return {set_id:setId, set_slot:slotKey, def}; }

  setPieceCandidatesForSlot(slot){
    const out=[];
    for(const setId in this.ITEM_SETS){ const bn=this.ITEM_SETS[setId].pieces[slot]; if(bn) out.push({set_id:setId, base_name:bn}); }

  equippedSetCounts(){
    const counts={};
    for(const slot of this.EQUIPPED_SLOT_KEYS){
      const inst=PS.equipped[slot];
      if(!inst || !inst.set_id) continue;
      if(!PS.canEquipGear(inst)) continue;
      counts[inst.set_id]=(counts[inst.set_id]||0)+1;
    }
    return counts;
  },
  setBonusesFor(setId){

    if(!def) return {count:0, active:[], def:null};
    const count=this.equippedSetCounts()[setId]||0;
    return {count, active:def.bonuses.filter(b=>b.count<=count), def};
  },

  classCanUseWeaponType(classId, weaponType){
    if(!weaponType) return true;
    const list=this.WEAPON_TYPE_CLASS_RESTRICTIONS[weaponType];
    return !list || list.includes(classId);
  },

  classCanUseOffhandType(classId, offhandType){

    if(!inst) return true;
    if(inst.slot==="weapon") return this.classCanUseWeaponType(classId, this.weaponTypeForInstance(inst));
    if(inst.slot==="offhand") return this.classCanUseOffhandType(classId, this.offhandTypeForInstance(inst));

    const requiredChain=this.CHAIN_EXCLUSIVE_BASE_NAMES[inst.base_name];
    if(requiredChain) return !!(CLASSES[classId] && CLASSES[classId].chain===requiredChain);
    return true;

  slotLabel(slot){return this.SLOT_LABELS[slot]||slot;},

  GEAR_CATEGORY_LABELS:{weapon:"Weapon",head:"Head",shoulders:"Shoulders",armor:"Armor",pants:"Pants",gloves:"Gloves",boots:"Boots",ring1:"Ring",ring2:"Ring",amulet:"Amulet",belt:"Belt",offhand:"Off-hand"},

  categoryLabel(inst){
    if(!inst||!inst.slot) return "";
    const base=this.GEAR_CATEGORY_LABELS[inst.slot]||this.slotLabel(inst.slot);
    if(inst.slot==="weapon"){
      const wt=this.weaponTypeForInstance(inst);
      if(wt) return `${base}, ${this.WEAPON_TYPE_LABELS[wt]}`;
    }

    if(inst.slot==="offhand"){
      const ot=this.offhandTypeForInstance(inst);
      if(ot) return `${base}, ${this.OFFHAND_TYPE_LABELS[ot]}`;
    }
    return base;
  },

  generate(tier, slot="", forcedRarityName=""){
    let chosenSlot=slot;
    if(!chosenSlot||!this.BASE_NAMES[chosenSlot]) chosenSlot=pick(this.GENERATION_SLOTS);

    let rarity=forcedRarityName ? (Balance.RARITY_TABLE.find(r=>r.name===forcedRarityName)||Balance.rollRarity()) : Balance.rollRarity(PS.getMagicFind());

    let baseName=null, setTag=null;
    if(rarity.name==="Set"){
      const candidates=this.setPieceCandidatesForSlot(chosenSlot);
      if(candidates.length>0){
        const chosen=pick(candidates);
        baseName=chosen.base_name;
        setTag={set_id:chosen.set_id, set_slot:chosenSlot};
      } else {

        rarity=Balance.RARITY_TABLE.find(r=>r.name==="Legendary")||rarity;
      }
    }
    if(!baseName) baseName=pick(this.BASE_NAMES[chosenSlot]||["Item"]);
    const slotCount=rarity.slots;

    let pool=chosenSlot==="offhand"
      ? [...(Balance.OFFHAND_SLOT_AFFIXES[this.OFFHAND_TYPE_BY_BASE_NAME[baseName]]||Balance.AFFIX_POOL)]
      : [...(Balance.SLOT_AFFIXES[chosenSlot]||Balance.AFFIX_POOL)];
    shuffle(pool);

    if(chosenSlot==="weapon" && Math.random()<Balance.WEAPON_DAMAGE_GUARANTEE_CHANCE && pool.includes("damage")){
      pool=pool.filter(s=>s!=="damage");
      pool.unshift("damage");
    }
    let element="";
    if(Math.random()<Balance.ELEMENT_ITEM_CHANCE){
      element=pick(Balance.ELEMENT_IDS);
      const biasStat=Balance.ELEMENT_AFFIX_BIAS[element]||"";
      if(biasStat && pool.includes(biasStat)){
        pool=pool.filter(s=>s!==biasStat);
        pool.unshift(biasStat);
      }
    }
    const affixCount=Math.min(slotCount,pool.length);
    const affixes=[];

    for(let i=0;i<affixCount;i++){
      const stat=pool[i];
      let value=Balance.rollAffixValue(stat,tier);
      if(chosenSlot==="weapon" && stat==="damage") value=round2(value*Balance.WEAPON_DAMAGE_AFFIX_MULT);
      affixes.push({stat, value});
    }

    if((chosenSlot==="head"||chosenSlot==="amulet") && Math.random()<Balance.EYESIGHT_AFFIX_CHANCE){
      affixes.push({stat:"eyesight", value:2});
    }
    return {instance_id:`${Date.now()}_${randi(999999)}`, slot:chosenSlot, base_name:baseName, tier, rarity:rarity.name, affixes, element, ...(setTag?{set_id:setTag.set_id, set_slot:setTag.set_slot}:{})};
  },
  displayName(inst){
    const rarityLabel=Balance.rarityDisplayName(inst.rarity);
    let name=`${rarityLabel?rarityLabel+" ":""}${Balance.itemTierAdjective(inst.tier)} ${inst.base_name}`;
    if(inst.element) name+=` of ${Balance.ELEMENT_DISPLAY_NAMES[inst.element]||inst.element}`;

    if(this.affixTotal(inst,"eyesight")>0) name+=" of Vision";
    return name;
  },
  affixTotal(inst,stat){
    if(!inst||!inst.affixes) return 0;
    let total=0; for(const a of inst.affixes) if(a.stat===stat) total+=a.value;
    return total;
  },
  slotCount(inst){return (inst.affixes||[]).length;},

  gearRollQuality(inst){
    const statAffixes=(inst.affixes||[]).filter(a=>Balance.AFFIX_POOL.includes(a.stat));
    if(statAffixes.length===0) return 0;
    let total=0;
    for(const a of statAffixes){
      const max=Balance.affixMaxForTier(a.stat,inst.tier);
      total+=max>0?Math.min(1,a.value/max):0;
    }
    return total/statAffixes.length;
  },

  isAffixMaxRoll(a, inst){
    if(!inst || a.stat==="eyesight") return false;
    const baseMax=Balance.affixMaxForTier(a.stat, inst.tier);
    if(baseMax<=0) return false;

    const effectiveMax=(inst.slot==="weapon" && a.stat==="damage") ? round2(baseMax*Balance.WEAPON_DAMAGE_AFFIX_MULT) : baseMax;
    return a.value>=effectiveMax;
  },

  affixIsPercent(stat){return ["crit","gold_find","xp_find","poison_resist","magic_find","block_chance","flee_chance","attack_speed","max_health_pct","trap_ward","spell_cdr","spell_power"].includes(stat);},
  affixLabel(stat){
    switch(stat){
      case "damage": return "Damage"; case "hp": return "Hit Points";

      case "crit": return "Critical Strike Chance";

      case "armor": return "Armor"; case "regen": return "Health Regeneration"; case "stamina_regen": return "Stamina Regeneration"; case "gold_find": return "Gold Found";
      case "xp_find": return "Experience Gained"; case "stamina_max": return "Stamina"; case "eyesight": return "Eyesight";
      case "strength": return "Strength"; case "dexterity": return "Dexterity"; case "vitality": return "Vitality"; case "intelligence": return "Intelligence";
      case "poison_resist": return "Poison Resistance";
      case "magic_find": return "Magic Find";

      case "block_chance": return "Block Chance";

      case "flee_chance": return "Increased chance to flee";

      case "crit_multiplier": return "Critical Strike Multiplier";

      case "attack_speed": return "Increased Attack Speed";
      case "life_on_hit": return "Life on Hit"; case "thorns": return "Thorns";
      case "max_health_pct": return "Max Health %"; case "trap_ward": return "Trap Ward";
      case "spell_cdr": return "Spell Cooldown Reduction"; case "mana": return "Mana";

      case "mana_regen": return "Mana Regeneration"; case "attack_rating": return "Accuracy";

      case "spell_power": return "Spell Power";
      default: return stat;
    }
  },

  formatAffix(a, inst){
    const label=this.affixLabel(a.stat);
    const diamond=this.isAffixMaxRoll(a,inst)?" \u{1F48E}":"";

    if(a.stat==="crit_multiplier") return `+${(a.value/100).toFixed(2)} ${label}${diamond}`;

    if(this.affixIsPercent(a.stat)) return `+${trimDecimal(a.value)}% ${label}${diamond}`;
    return `+${trimDecimal(a.value)} ${label}${diamond}`;
  },
  tooltipText(inst){

    const lines=[`${this.displayName(inst)} (${tierRomanNumeral(inst.tier)})`];

    lines.push(`Requires Level ${Balance.tierLevelRequirement(inst.tier)}`);

    const weaponType=this.weaponTypeForInstance(inst);
    const offhandType=this.offhandTypeForInstance(inst);

    const chainRestriction=this.CHAIN_EXCLUSIVE_BASE_NAMES[inst.base_name];

    const restrictedTo=weaponType?this.WEAPON_TYPE_CLASS_RESTRICTIONS[weaponType]:(offhandType?this.OFFHAND_TYPE_CLASS_RESTRICTIONS[offhandType]:(chainRestriction?this.classesForChain(chainRestriction):null));
    if(restrictedTo) lines.push(`Class: ${restrictedTo.map(id=>DL.getClass(id).display_name||id).join(", ")}`);

    const inherent=this.inherentScalingFor(inst);
    if(inherent){
      const attrLabels={str:"Strength",dex:"Dexterity",vit:"Vitality",int:"Intelligence"};
      const attrVal=PS.getTotalAttr(inherent.attr);
      const bonusVal=(attrVal/50)*inherent.per50;
      const bonusStr=this.affixIsPercent(inherent.stat)?`+${trimDecimal(bonusVal)}% ${this.affixLabel(inherent.stat)}`:`+${trimDecimal(bonusVal)} ${this.affixLabel(inherent.stat)}`;
      lines.push(`${bonusStr} (from ${Math.round(attrVal)} ${attrLabels[inherent.attr]})`);
    }

    if(inst.affixes && inst.affixes.length>0) lines.push("───────────────");
    for(const a of inst.affixes) lines.push(this.formatAffix(a,inst));

    if(inst.set_id && this.ITEM_SETS[inst.set_id]){
      const def=this.ITEM_SETS[inst.set_id];
      const count=this.equippedSetCounts()[inst.set_id]||0;
      lines.push("───────────────");
      lines.push(`Set: ${def.display_name} (${count}/${Object.keys(def.pieces).length})`);
      for(const b of def.bonuses) lines.push(`${b.count<=count?"✓":"○"} (${b.count}) ${b.desc}`);
    }
    return lines.join("\n");
  },
  affixSummary(inst){
    if(!inst.affixes||inst.affixes.length===0) return "(no bonuses)";
    return inst.affixes.map(a=>this.formatAffix(a,inst)).join(", ");
  },

  reroll(inst){
    const newAffixes=inst.affixes.map(a=>{
      let value=Balance.rollAffixValue(a.stat,inst.tier);
      if(inst.slot==="weapon" && a.stat==="damage") value=round2(value*Balance.WEAPON_DAMAGE_AFFIX_MULT);
      return {stat:a.stat, value};
    });
    return {...inst, affixes:newAffixes};
  },
};

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=randi(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];}}

  available:true, _mem:{},
  init(){ try{ window.localStorage.setItem("__wandrian_test__","1"); window.localStorage.removeItem("__wandrian_test__"); this.available=true; }catch(e){ this.available=false; } },
  getItem(k){ return this.available ? window.localStorage.getItem(k) : (Object.prototype.hasOwnProperty.call(this._mem,k)?this._mem[k]:null); },
  setItem(k,v){ if(this.available) window.localStorage.setItem(k,v); else this._mem[k]=v; },
  removeItem(k){ if(this.available) window.localStorage.removeItem(k); else delete this._mem[k]; },
};

  saveCharacter(slot,data){
    if(this.cache) this.cache[slot]={slot,data,updated_at:new Date().toISOString(),empty:false};
    let state=this._saveInFlight[slot];
    if(state && state.busy){ state.latest=data; return; }
    state={busy:true,latest:null}; this._saveInFlight[slot]=state;
    this._sendCharacterSave(slot,data,state);
  },
  _sendCharacterSave(slot,data,state){

    const body=JSON.stringify(Object.assign({},data,{gold_delta:Math.round((PS.gold||0)-(this.goldSyncBaseline||0))}));

    const attempt=(useKeepalive)=>fetch(this.apiBase()+"/api/characters/"+slot,{method:"PUT",keepalive:useKeepalive,headers:this.authHeaders({"Content-Type":"application/json"}),body})
      .then(res=>{

        try{ if(res && typeof res.json==="function") res.json().then(json=>{ if(json && typeof json.account_gold==="number") this.setAuthoritativeGold(json.account_gold); }).catch(()=>{}); }catch(e){}
        return res;
      })
      .catch(e=>{
        if(useKeepalive){

          return attempt(false);
        }
        console.warn("save to server failed",e);
      });
    attempt(true).finally(()=>{
      const next=state.latest;
      state.busy=false; state.latest=null;
      if(next){ state.busy=true; this._sendCharacterSave(slot,next,state); }
    });
  },

  ensureChat(){
    if(this.chatSocket || !this.online) return;
    const wsProto = location.protocol==="https:" ? "wss://" : "ws://";
    const base = this.apiBase();
    const wsUrl = base ? base.replace(/^http/,"ws")+"/ws/chat?token="+this.token : wsProto+location.host+"/ws/chat?token="+this.token;
    try{
      const ws=new WebSocket(wsUrl);
      ws.onmessage=(ev)=>{
        try{
          const msg=JSON.parse(ev.data);
          if(msg.type==="history") this.chatMessages=msg.messages||[];
          else if(msg.type==="chat"){ this.chatMessages.push(msg); if(this.chatMessages.length>200) this.chatMessages.shift(); }

          else if(msg.type==="announcement"){ this.announcement=msg.message||""; render(); }
          else if(msg.type==="private_history"){ this.privateMessages=this.privateMessages.concat(msg.messages||[]); }
          else if(msg.type==="private"){
            this.privateMessages.push(msg);

            if(typeof msg.gold==="number") this.accountGold=msg.gold;
          }

          else if(msg.type==="combat_tick"){ applyCombatTickPush(msg.session_id,msg); return; }

          else if(msg.type==="force_reload"){
            Net.refreshCharacters().then(()=>{
              if(PS.current_slot===msg.slot){
                PS.loadGame(msg.slot);
                setToast("An admin updated your character. Your data has been refreshed.");
              }
              render();
            }).catch(()=>{});
            return;
          }
          if(GF.screen==="chat" || GF.chatOpen) render();
        }catch(e){}
      };
      ws.onclose=()=>{ if(this.chatSocket===ws) this.chatSocket=null; };
      this.chatSocket=ws;
    }catch(e){ console.warn("chat connect failed",e); }
  },
  sendChat(message){
    if(this.chatSocket && this.chatSocket.readyState===WebSocket.OPEN) this.chatSocket.send(JSON.stringify({type:"chat",message}));
  },
};

        total+=IF.affixTotal(inst,stat);

  getDamageBreakdown(){

    const weaponType=this.getEquippedWeaponType();
    const skillLevel=weaponType?this.getWeaponSkillLevel(weaponType):0;
    const weaponSkillPct=skillLevel*Balance.WEAPON_SKILL_DAMAGE_PCT_PER_LEVEL;
    const baseMin=(c.base_damage_min||1)+perLevel+statBonus, baseMax=(c.base_damage_max||2)+perLevel+statBonus;
