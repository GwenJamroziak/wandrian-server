    // PS.getMagicFind()) biases toward better rarity by rerolling and keeping whichever
    // result is rarer, with a chance scaling directly with the MF% -- e.g. 20% MF gives a
    // 20% chance to get a second roll and take the better of the two. Capped at 90% so it's
    // never a guaranteed reroll even at very high MF. mfPct defaults to 0 (no behavior
    // change for the many existing call sites that don't pass it).
    if(Math.random()<Math.min(0.9,mfPct/100)){
      const second=rollOnce();
      const firstIdx=this.RARITY_TABLE.indexOf(first), secondIdx=this.RARITY_TABLE.indexOf(second);
      return secondIdx>firstIdx?second:first;
    }
    return first;
  },
  bridgePlankCount(tier){return clampi((tier||1)+1,this.BRIDGE_MIN_PLANKS,this.BRIDGE_MAX_PLANKS);},
  bridgeStepPassChance(tier){return 1.0/this.bridgePlankCount(tier);},
  trialLevelRequirement(tier){return clampi(tier||1,1,4)*this.TRIAL_LEVEL_REQUIREMENT_PER_TIER;},
  // v0.16: Auction House listing fee -- 1g for a 1-99g asking price, 2g for 100-199,
  // 3g for 200-299, and so on (+1g of fee per 100g bracket). Mirrored server-side in
  // evergrind-server/server.js's own auctionListingFee() -- the SERVER charges this, this
  // client-side copy is only used to preview/pre-validate before the request is sent.
  auctionListingFee(price){return Math.floor((price||0)/100)+1;},
  // v0.12: weapon skill hit-count math. Level L is reached once cumulative hits pass
  // WEAPON_SKILL_HIT_STEP * L*(L+1)/2 (a triangular number: 100, 300, 600, 1000, ...),
  // i.e. level L costs L*100 more hits than level L-1 -- matches Gwen's "100 strikes for
  // level 1, 200 more for level 2, 300 more for level 3" spec, extended indefinitely.
  weaponSkillCumulativeHitsForLevel(level){ return this.WEAPON_SKILL_HIT_STEP*level*(level+1)/2; },
  weaponSkillLevelForHits(hits){
    let level=0;
    while(this.weaponSkillCumulativeHitsForLevel(level+1)<=hits) level++;
    return level;
  },
  // Bug fix (v0.12): Stronghold Keys must only be obtainable while fighting in an area
  // at or above the character's own level, otherwise a high-level character could revisit
  // a trivial low-level maze and farm guaranteed-easy guardian kills for keys, undermining
  // the whole "worth the effort" point of the mechanic. The guardian fight itself, and the
  // chest's other loot, are unaffected -- only the key drop roll is gated.
  // v0.17.1 (#15) BUG FIX: this used to require mazeDepth>=playerLevel exactly -- so a
  // player who was on-level (e.g. player Lv7 in an area-level-7 Stronghold) but leveled up
  // mid-run from killing an earlier guardian (now Lv8) instantly lost ALL key-drop chance
  // for the remaining guardians in that same Stronghold, even though they'd started the run
  // perfectly eligible. Now tolerates the player being up to 1 level above the area level --
  // only 2+ levels above (a real mismatch, not a mid-run level-up) triggers the existing
  // "tame" 0%-chance message.
  strongholdKeyEligible(mazeDepth, playerLevel){ return (mazeDepth||1)>=(playerLevel||1)-1; },
  // v0.18.2 (#5): salvage already scaled BY tier (linearly), but that meant a Tier 5 item
  // was only worth 5x a Tier 1 item of the same affix count -- not a strong enough pull to
  // make hauling higher-tier junk back to town feel meaningfully better than low-tier junk.
  // Switched the tier term to tier^1.5 so the gap widens the higher you go (Tier 1: 1x,
  // Tier 2: ~2.8x, Tier 3: ~5.2x, Tier 4: 8x, Tier 5: ~11.2x a same-affix-count Tier 1 item)
  // without the runaway blowout a flat tier^2 would cause. rerollCost derives from this
  // same value (see below), so higher-tier rerolls get proportionally pricier too, which
  // tracks with them being worth more to salvage instead.
  salvageValue(tier,slots){return Math.round(Math.pow(tier,1.5)*slots*this.SALVAGE_MATERIALS_PER_SLOT);},
  rerollCost(tier,slots){return this.salvageValue(tier,slots)*this.REROLL_MATERIAL_COST_MULT;},
  sellValue(tier,slots){return tier*this.SELL_GOLD_PER_TIER+slots*this.SELL_GOLD_PER_SLOT;},
  bagBuyPrice(cap){return cap*this.BAG_BUY_GOLD_PER_CAPACITY;},
  // v0.12: Merchant buy price for any consumable/scroll -- item.buy_price overrides the
  // default sell_value*VENDOR_MARKUP formula when an item needs an exact price point
  // (see elixir_of_eyesight). Shared by screenMerchant's display price and PS.buyConsumable
  // so the two can never drift out of sync.
  itemBuyPrice(item){ return item.buy_price!=null ? item.buy_price : Math.round((item.sell_value||1)*this.VENDOR_MARKUP); },
  bagCraftCost(cap){return cap*this.BAG_CRAFT_MATERIALS_PER_CAPACITY;},

  // v0.17 (#28): Merchant gear stock -- 6 randomly-rolled items, T1-5, using the SAME
  // rarity roll (Balance.rollRarity(), via IF.generate() with no forcedRarityName) that
  // maze drops use, so Legendary gear isn't artificially more common here than it is out
  // in the world. Price is banded by rarity, then nudged within that band by how good the
  // actual roll is (see IF.gearRollQuality()) -- a barely-rolled Rare and a near-max Rare
  // shouldn't cost the same. Internal "Uncommon" (no special display adjective, see
  // RARITY_DISPLAY_NAMES) is folded into the same band as "Common" (displayed "Crude")
  // since Gwen's spec only called out 4 bands (Legendary/Rare/Magical/Common) and neither
  // of those two rarities carries a distinct enough identity to deserve its own band.
  MERCHANT_STOCK_SIZE:6,
  MERCHANT_PRICE_BANDS:{
    Legendary:[8000,15000],
    Epic:[5000,9000],      // displayed to players as "Rare"
    Rare:[2000,5000],      // displayed to players as "Magical"
    Uncommon:[500,2000],
    Common:[500,2000],
  },
  // v0.18.1 (#11): Gwen's feedback was that even the bottom of each price band above still
  // felt too expensive for the lower rarities -- rather than re-tune the bands themselves
  // (which would also shift the Auction House's sense of "what's a fair price"), a flat
  // rarity-keyed discount is applied on top of the existing banded roll. Keyed by internal
  // rarity name, but described in the spec by DISPLAY name (see RARITY_DISPLAY_NAMES):
  // "crude" (Common) and "common" (Uncommon, no distinct display adjective) both get -75%,
  // "magical" (internal Rare) gets -50%, "rare" (internal Epic) gets -25%, Legendary is
  // unchanged.
  MERCHANT_RARITY_PRICE_MULTIPLIER:{Legendary:1.0, Epic:0.75, Rare:0.5, Uncommon:0.25, Common:0.25},
  merchantGearPrice(inst){
    const band=this.MERCHANT_PRICE_BANDS[inst.rarity]||this.MERCHANT_PRICE_BANDS.Common;
    const [lo,hi]=band;
    const quality=IF.gearRollQuality(inst);
    const raw=lo+quality*(hi-lo);
    const mult=this.MERCHANT_RARITY_PRICE_MULTIPLIER[inst.rarity]!=null?this.MERCHANT_RARITY_PRICE_MULTIPLIER[inst.rarity]:1;
    return Math.max(1,Math.round(raw*mult));
  },
};

function clampi(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function clampf(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function randi(n){return Math.floor(Math.random()*n);}
function randRange(a,b){return a+Math.random()*(b-a);}
function randIntRange(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(arr){return arr[randi(arr.length)];}

/* ---------- DataLoader-equivalent lookups ---------- */

const DL = {
  getClass(id){return CLASSES[id]||{};},
  starterClassIds(){return Object.keys(CLASSES).filter(id=>CLASSES[id].tier===1);},
  getNextClassId(id){const c=this.getClass(id); return c.next_class||"";},
  getItem(id){return ITEMS[id]||{};},
  // v0.14: a short, plain-language category subtext shown under any consumable/scroll/
  // bag name across Character Sheet, Merchant, Alchemist, Blacksmith and the Auction House
  // (e.g. "Potion", "Scroll", "Key") so new players don't have to guess what an item does
  // just from its flavorful name. Gear uses IF.categoryLabel() instead (Ring/Head/etc.),
  // and herbs are always just labeled "Herb" at their render site.
  itemCategoryLabel(id){
    const item=this.getItem(id); if(!item||!item.name) return "";
    if(item.type==="bag") return "Bag";
    if(item.type==="scroll") return "Scroll";
    // v0.18 (#5): recognize all 5 tiered Stronghold Key ids ("stronghold_key" itself is
    // Tier 1, "stronghold_key_t2".."_t5" the rest), not just the original untiered id.
    if(id.indexOf("stronghold_key")===0) return "Key";
    if(id==="dry_branch") return "Kindling";
    // v0.17 (#24) BUG FIX: this used to give the Antidote its own one-off "Antidote"
    // category label, which showed up in the Auction House (and anywhere else this
    // function feeds into) as the confusing "Antidote (Antidote)" -- it's fundamentally a
    // potion type like any other consumable here, so it now falls through to the same
    // "Potion" label the heal/stamina/buff potions already get, just below.
    if(item.heal_amount!=null || item.stamina_amount!=null || item.eyesight_steps!=null || item.buff_type || item.cures_poison) return "Potion";
    return "Item";
  },
  // v0.14 tooltip overhaul: an exact-numbers, plain-English "what does this actually do"
  // line for any consumable/scroll, generated straight from its ITEMS fields so it can
  // never drift out of sync with the real mechanic. Used as hover text on the Alchemist's
  // recipe tiles (the accessibility finding was specifically that mechanics like this took
  // testers real time to learn instead of being instant via the UI).
  itemEffectDescription(id){
    const item=this.getItem(id); if(!item||!item.name) return "";
    // v0.17.3 (#8): Health Potions no longer land instantly -- see PS.useConsumable()/
    // PS.active_heals for the heal-over-time mechanic this now describes.
    if(item.heal_amount!=null) return `Restores ${item.heal_amount} HP gradually over ${(Balance.POTION_HEAL_DURATION_MS/1000)} seconds.`;
    // v0.18.1 (#20): Stamina Potions now heal gradually too, same mechanic (and same
    // wording pattern) as Health Potions above -- see PS.active_stamina_heals.
    if(item.stamina_amount!=null) return `Restores ${item.stamina_amount} Stamina gradually over ${(Balance.POTION_HEAL_DURATION_MS/1000)} seconds.`;
    if(item.eyesight_steps!=null) return `Doubles your maze reveal radius (3x3 -> 5x5 tiles around you) for your next ${item.eyesight_steps} steps.`;
    if(item.buff_type){
      const suffixByType={strength:" Strength",dexterity:" Dexterity",intelligence:" Intelligence",block_chance:"% Block Chance",regen:" HP/sec and Stamina/sec regen"};
      const minutes=Math.round((item.buff_duration_ms||0)/60000);
      return `Temporarily grants +${item.buff_amount}${suffixByType[item.buff_type]||""} for ${minutes} minutes.`;
    }
    if(item.cures_poison) return "Instantly cures the Poison effect, if you're currently poisoned.";
    if(item.level_bonus!=null) return `Your next venture starts ${item.level_bonus} area level${item.level_bonus===1?"":"s"} higher than your current one.`;
    if(item.type==="bag") return `+${item.capacity} inventory capacity while equipped.`;
    return "";
  },
  // v0.18.1 (#7/#8): a shorter, list-row-sized subtext for the Merchant's Consumables tab
  // and the Alchemist's recipe list -- potions get an exact "Gradually recovers XX hit/
  // stamina points" line per Gwen's spec (distinct from itemEffectDescription()'s longer,
  // duration-inclusive tooltip wording above), everything else just falls back to the
  // existing category label (Herb/Ring/Head/Potion/etc.) since there's nothing more useful
  // to say about a scroll or a bag in one short line.
  itemShopSubtext(id){
    const item=this.getItem(id); if(!item||!item.name) return "";
    if(item.heal_amount!=null) return `Gradually recovers ${item.heal_amount} hit points.`;
    if(item.stamina_amount!=null) return `Gradually recovers ${item.stamina_amount} stamina.`;
    return this.itemCategoryLabel(id);
  },
  getMonster(id){return MONSTERS.find(m=>m.id===id)||{};},
  getHerb(id){return HERBS[id]||{};},
  allHerbIds(){return Object.keys(HERBS);},
  commonHerbIds(){return Object.keys(HERBS).filter(id=>!HERBS[id].rare);},
  // v0.14: now that there are 6 rare herbs (Starveil Petal + the 5 new stat-buff
  // ingredients), a successful RARE_HERB_CHANCE roll picks among all of them at random
  // rather than always handing out Starveil -- each individual rare herb is correspondingly
  // scarcer than before, matching Gwen's "a bit less common" request for the new ones.
  rareHerbIds(){return Object.keys(HERBS).filter(id=>HERBS[id].rare);},
  // v0.17.1 (#7): the 5 newest rare herbs (min_area_level:5) are excluded from the rare
  // pool below that area level, so Starveil Petal is the only rare herb low-level mazes
  // can produce -- matches the same area-level gate the guide/tooltips now advertise.
  rareHerbIdsForAreaLevel(areaLevel){
    return DL.rareHerbIds().filter(id=>(HERBS[id].min_area_level||1)<=(areaLevel||1));
  },
  pickHerbForNode(areaLevel=1){
    if(Math.random()<Balance.RARE_HERB_CHANCE){
      const pool=DL.rareHerbIdsForAreaLevel(areaLevel);
      if(pool.length>0) return pick(pool);
    }
    return pick(DL.commonHerbIds());
  },
  allRecipes(){return RECIPES;},
  pickRandomMonsterForArea(areaLevel){
    let pool=MONSTERS.filter(m=>{
      if(m.tier==="common") return true;
      if(m.tier==="uncommon") return areaLevel>=8;
      if(m.tier==="rare") return areaLevel>=20;
      if(m.tier==="epic") return areaLevel>=35;
      return false;
    });
    if(pool.length===0) pool=MONSTERS;
    return pick(pool);
  },
  // v0.18.2 (#9) AUDIT FIX: Magic Find previously affected ONLY item rarity (via
  // Balance.rollRarity()'s reroll-and-keep-rarer), never how MUCH loot you actually got --
  // a deliberate v0.17.3 (#16) design decision at the time (see the combat resolver's own
  // comment on this), but Gwen's later report was that MF felt like it wasn't doing
  // anything for "amount," which is a fair read once quantity was intentionally excluded.
  // Now mirrors the exact same reroll-and-keep-the-better-outcome pattern rollRarity()
  // already uses: a "nothing" result gets one reroll chance (probability scaling with MF%,
  // capped at 90%, same cap/shape as the rarity reroll) to instead land on a real drop.
  // This can only ever turn a would-be-empty kill into a drop -- it never removes/downgrades
  // an already-successful roll, so MF still strictly never hurts you.
  rollLoot(tableId, mfPct=0){
    const table=LOOT_TABLES[tableId]||[];
    const rollOnce=()=>{
      if(table.length===0) return {type:"nothing"};
      let total=0; for(const e of table) total+=e.weight;
      if(total<=0) return {type:"nothing"};
      let roll=randi(total), cum=0;
      for(const e of table){cum+=e.weight; if(roll<cum) return e;}
      return {type:"nothing"};
    };
    const first=rollOnce();
    if(first.type!=="nothing" || !mfPct) return first;
    if(Math.random()<Math.min(0.9,mfPct/100)){
      const second=rollOnce();
      if(second.type!=="nothing") return second;
    }
    return first;
  },
};

/* ---------- ItemFactory-equivalent ---------- */

const IF = {
  BASE_NAMES:{
    // v0.13: added the Dagger weapon type, including "Goedendag" as a plain dagger base
    // name (no special in-game description -- just another weapon in the pool).
    weapon:["Twig Wand","Bramblestaff","Rootcarver","Thornbow","Charwood Axe","Emberbrand","Thornfang","Bramblespike","Quickthorn","Goedendag"],
    head:["Bramble Circlet","Mosscap","Antlercrown","Leafwood Hood"],
    shoulders:["Bark Mantle","Rootguard Pauldrons","Thistle Shoulderguard"],
    armor:["Big Leaf Wrap","Bark Plate","Mosscloak","Reedmail","Ashen Hide"],
    pants:["Root-woven Leggings","Bark Greaves","Vine Trousers"],
    gloves:["Thornweave Gloves","Barkgrip Gauntlets","Mossback Handwraps"],
    boots:["Rootstep Boots","Mossy Treads","Bramblehide Boots"],
    ring:["Acorn Ring","Petal Ring","Vinewrought Ring"],
    amulet:["Emberstone Pendant","Driftwood Amulet","Heartwood Talisman"],
    belt:["Vine Cinch","Barkweave Belt","Root Sash"],
  },
  GENERATION_SLOTS:["weapon","head","shoulders","armor","pants","gloves","boots","ring","amulet","belt"],
  EQUIPPED_SLOT_KEYS:["weapon","head","shoulders","armor","pants","gloves","boots","ring1","ring2","amulet","belt"],
  SLOT_LABELS:{weapon:"Weapon",head:"Head",shoulders:"Shoulders",armor:"Armor",pants:"Pants",gloves:"Gloves",boots:"Boots",ring1:"Ring 1",ring2:"Ring 2",amulet:"Amulet",belt:"Belt"},

  // v0.12: Weapon skill/proficiency system. Every generated weapon's base_name maps to
  // one of a handful of weapon types, and each character tracks permanent, per-type
  // progression (see PS.weapon_skills) built up purely by landing hits with that type
  // equipped -- see registerWeaponHit() in the combat screen's playerTurn().
  WEAPON_TYPE_BY_BASE_NAME:{"Twig Wand":"wand","Bramblestaff":"staff","Rootcarver":"sword","Thornbow":"bow","Charwood Axe":"axe","Emberbrand":"sword","Thornfang":"dagger","Bramblespike":"dagger","Quickthorn":"dagger","Goedendag":"dagger"},
  WEAPON_TYPE_LIST:["wand","staff","sword","axe","bow","dagger"],
  WEAPON_TYPE_LABELS:{wand:"Wand",staff:"Staff",sword:"Sword",axe:"Axe",bow:"Bow",dagger:"Dagger"},
  weaponTypeForInstance(inst){ return (inst&&inst.base_name) ? (this.WEAPON_TYPE_BY_BASE_NAME[inst.base_name]||null) : null; },

  // v0.18.1 (#3): class-based weapon-type restrictions. Keyed by weapon type; the listed
  // class_ids are the ONLY classes allowed to equip that type. A weapon type with no entry
  // here (currently just "dagger") is unrestricted -- every class can use it. This is
  // deliberately separate from WEAPON_TYPE_BY_BASE_NAME/LIST above: those describe what a
  // weapon IS, this describes who's allowed to wield it. Existing equipped/owned items are
  // never retroactively stripped -- see PS.canEquipGear(), which is the single choke point
  // both level AND class validity flow through, so a class change (Broken Bridge Trial pass)
  // can retroactively invalidate an already-equipped weapon exactly like an under-level item.
  WEAPON_TYPE_CLASS_RESTRICTIONS:{
    wand:["wizard","sorcerer"],
    staff:["warlock","rootbinder","druid"],
    sword:["thornguard","stonewarden","treesinger","galestrider"],
    axe:["thornguard","stonewarden","rootbinder","windrider","galestrider","galeshaper"],
    bow:["windrider","galestrider","treesinger"],
    // dagger intentionally omitted: available to every class
  },
  // True if classId is allowed to equip the given weapon type (unrestricted types, and the
  // "not a weapon at all" case via weaponType===null, both return true).
  classCanUseWeaponType(classId, weaponType){
    if(!weaponType) return true;
    const list=this.WEAPON_TYPE_CLASS_RESTRICTIONS[weaponType];
    return !list || list.includes(classId);
  },
  // True if classId can equip this specific item instance at all, considering ONLY the
  // class/weapon-type restriction (level is handled separately by Balance.tierLevelRequirement).
  // Non-weapon gear (armor, rings, etc.) is always class-unrestricted.
  classCanEquipItem(classId, inst){
    if(!inst || inst.slot!=="weapon") return true;
    return this.classCanUseWeaponType(classId, this.weaponTypeForInstance(inst));
  },

  slotLabel(slot){return this.SLOT_LABELS[slot]||slot;},
  // v0.14: a collapsed version of SLOT_LABELS for the item-category subtext shown under
  // gear names everywhere (Character Sheet, Blacksmith, Auction House, etc.) -- unlike
  // slotLabel() (used to label an EMPTY equip-doll slot, where "Ring 1" vs "Ring 2"
  // matters), an actual Ring item's category subtext should just read "Ring".
  GEAR_CATEGORY_LABELS:{weapon:"Weapon",head:"Head",shoulders:"Shoulders",armor:"Armor",pants:"Pants",gloves:"Gloves",boots:"Boots",ring1:"Ring",ring2:"Ring",amulet:"Amulet",belt:"Belt"},
  categoryLabel(inst){ return (inst&&inst.slot) ? (this.GEAR_CATEGORY_LABELS[inst.slot]||this.slotLabel(inst.slot)) : ""; },

  // forcedRarityName (v0.12, used by the Stronghold chest): when given, skips the normal
  // rarity roll and guarantees that exact rarity, e.g. so Stronghold loot can promise
  // "rare/epic items" instead of rolling the same 60%-common odds as everyday loot.
  generate(tier, slot="", forcedRarityName=""){
    let chosenSlot=slot;
    if(!chosenSlot||!this.BASE_NAMES[chosenSlot]) chosenSlot=pick(this.GENERATION_SLOTS);
    const baseName=pick(this.BASE_NAMES[chosenSlot]||["Item"]);
    // v0.17.1 (#12): Magic Find biases the rarity roll (see Balance.rollRarity()'s mfPct
    // param) -- a forced rarity (Stronghold chests) is untouched, MF only affects the
    // ordinary random roll.
    const rarity=forcedRarityName ? (Balance.RARITY_TABLE.find(r=>r.name===forcedRarityName)||Balance.rollRarity()) : Balance.rollRarity(PS.getMagicFind());
    const slotCount=rarity.slots;
    let pool=[...Balance.AFFIX_POOL];
    shuffle(pool);
    // v0.12: weapons lean hard into damage now, instead of rolling it as just one of 12
    // equally-likely affixes. Below Balance.WEAPON_DAMAGE_GUARANTEE_CHANCE, "damage" is
    // pinned to the front of the pool (so any weapon with at least 1 affix slot gets it),
    // and whenever a weapon does roll damage, the value itself rolls noticeably higher
    // too (Balance.WEAPON_DAMAGE_AFFIX_MULT) -- both the odds AND the payoff go up.
    if(chosenSlot==="weapon" && Math.random()<Balance.WEAPON_DAMAGE_GUARANTEE_CHANCE && pool.includes("damage")){
      pool=pool.filter(s=>s!=="damage");
      pool.unshift("damage");
    }
    let element="";
    if(Math.random()<Balance.ELEMENT_ITEM_CHANCE){
      element=pick(Balance.ELEMENT_IDS);
      const biasStat=Balance.ELEMENT_AFFIX_BIAS[element]||"";
      if(biasStat && pool.includes(biasStat)){
        pool=pool.filter(s=>s!==biasStat);
        pool.unshift(biasStat);
      }
    }
    const affixCount=Math.min(slotCount,pool.length);
    const affixes=[];
    for(let i=0;i<affixCount;i++){
      const stat=pool[i];
      const [lo,hi]=Balance.affixRangeForTier(stat,tier);
      let value=randIntRange(lo,hi);
      if(chosenSlot==="weapon" && stat==="damage") value=Math.round(value*Balance.WEAPON_DAMAGE_AFFIX_MULT);
      affixes.push({stat, value});
    }
    if(Math.random()<Balance.EYESIGHT_AFFIX_CHANCE){
      affixes.push({stat:"eyesight", value:2});
    }
    return {instance_id:`${Date.now()}_${randi(999999)}`, slot:chosenSlot, base_name:baseName, tier, rarity:rarity.name, affixes, element};
  },
  displayName(inst){
    const rarityLabel=Balance.rarityDisplayName(inst.rarity);
    let name=`${rarityLabel?rarityLabel+" ":""}${Balance.itemTierAdjective(inst.tier)} ${inst.base_name}`;
    if(inst.element) name+=` of ${Balance.ELEMENT_DISPLAY_NAMES[inst.element]||inst.element}`;
    // v0.17 (#23): any item that rolled the rare Eyesight affix (see generate()'s
    // EYESIGHT_AFFIX_CHANCE roll) now always gets an "of Vision" suffix on its name, the
    // same way an elemental roll gets an "of Fire"/"of Wind"/etc. suffix just above --
    // previously the bonus only showed up buried in the stat tooltip, with no naming cue.
    if(this.affixTotal(inst,"eyesight")>0) name+=" of Vision";
    return name;
  },
  affixTotal(inst,stat){
    if(!inst||!inst.affixes) return 0;
    let total=0; for(const a of inst.affixes) if(a.stat===stat) total+=a.value;
    return total;
  },
  slotCount(inst){return (inst.affixes||[]).length;},
  // v0.17 (#28): 0..1 "how good is this specific roll" score, averaged across every
  // NORMAL affix (i.e. anything in Balance.AFFIX_POOL -- excludes the rare fixed-value
  // "eyesight" affix, which has no scaling max and would just drag every score toward 0).
  // Used only by the Merchant's price-within-band nudge (Balance.merchantGearPrice) so far,
  // but written as a general-purpose "roll quality" number in case it's useful elsewhere.
  gearRollQuality(inst){
    const statAffixes=(inst.affixes||[]).filter(a=>Balance.AFFIX_POOL.includes(a.stat));
    if(statAffixes.length===0) return 0;
    let total=0;
    for(const a of statAffixes){
      const max=Balance.affixMaxForTier(a.stat,inst.tier);
      total+=max>0?Math.min(1,a.value/max):0;
    }
    return total/statAffixes.length;
  },
  affixIsPercent(stat){return ["crit","armor","gold_find","xp_find","poison_resist","magic_find"].includes(stat);},
  affixLabel(stat){
    switch(stat){
      case "damage": return "Damage"; case "hp": return "Hit Points"; case "crit": return "Critical Strike";
      case "armor": return "Armor"; case "regen": return "Regeneration"; case "gold_find": return "Gold Found";
      case "xp_find": return "Experience Gained"; case "stamina_max": return "Stamina"; case "eyesight": return "Eyesight";
      case "strength": return "Strength"; case "dexterity": return "Dexterity"; case "vitality": return "Vitality"; case "intelligence": return "Intelligence";
      case "poison_resist": return "Poison Resistance";
      case "magic_find": return "Magic Find";
      default: return stat;
    }
  },
  formatAffix(a){
    const label=this.affixLabel(a.stat);
    if(this.affixIsPercent(a.stat)) return `+${Math.round(a.value)}% ${label}`;
    if(a.stat==="regen") return `+${a.value.toFixed(1)} ${label}`;
    return `+${Math.round(a.value)} ${label}`;
  },
  tooltipText(inst){
    // v0.18.1 (#30): Roman numeral, matching the gear-tile tier badge and every other
    // tier tag sitewide -- see tierRomanNumeral().
    const lines=[`${this.displayName(inst)} (${tierRomanNumeral(inst.tier)})`];
    // v0.14: spell out the level requirement to equip this tier right in the hover
    // tooltip, so players understand why an Equip button might be greyed out.
    lines.push(`Requires Level ${Balance.tierLevelRequirement(inst.tier)}`);
    // v0.18.1 (#3): spell out which classes can wield this weapon type, same reasoning as
    // the level-requirement line above -- only shown for weapon types that are actually
    // restricted (see WEAPON_TYPE_CLASS_RESTRICTIONS; Dagger etc. have no entry and no line).
    const weaponType=this.weaponTypeForInstance(inst);
    const restrictedTo=weaponType?this.WEAPON_TYPE_CLASS_RESTRICTIONS[weaponType]:null;
    if(restrictedTo) lines.push(`Class: ${restrictedTo.map(id=>DL.getClass(id).display_name||id).join(", ")}`);
    // v0.18.1 (#31): a plain dashed divider between the item's header info (name/tier, level
    // requirement, class restriction) and its actual stat bonuses below. The tooltip itself
    // is a single CSS `content:attr(data-tip)` pseudo-element (see the .tooltip::after rule
    // above), which can only ever render plain text -- no nested/colored child DOM nodes --
    // so a plain-text rule is the "color/line" option that's actually achievable here without
    // rearchitecting every .tooltip in the game (the richer structured-and-colored treatment
    // is reserved for the "Currently Equipped" compare-box next to it, see
    // gearComparisonContent()/.compare-box, which already renders real DOM). Only added when
    // there's at least one stat line following it, so there's never a dangling trailing rule.
    if(inst.affixes && inst.affixes.length>0) lines.push("───────────────");
    for(const a of inst.affixes) lines.push(this.formatAffix(a));
    return lines.join("\n");
  },
  affixSummary(inst){
    if(!inst.affixes||inst.affixes.length===0) return "(no bonuses)";
    return inst.affixes.map(a=>this.formatAffix(a)).join(", ");
  },
  reroll(inst){
    const newAffixes=inst.affixes.map(a=>{
      const [lo,hi]=Balance.affixRangeForTier(a.stat,inst.tier);
      return {stat:a.stat, value:randIntRange(lo,hi)};
    });
    return {...inst, affixes:newAffixes};
  },
};

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=randi(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];}}

/* ---------- Safe storage wrapper (falls back to in-memory if localStorage is blocked,
   e.g. when a file is opened directly via file:// in some browsers) ---------- */
const Storage_ = {
  available:true, _mem:{},
  init(){ try{ window.localStorage.setItem("__wandrian_test__","1"); window.localStorage.removeItem("__wandrian_test__"); this.available=true; }catch(e){ this.available=false; } },
  getItem(k){ return this.available ? window.localStorage.getItem(k) : (Object.prototype.hasOwnProperty.call(this._mem,k)?this._mem[k]:null); },
  setItem(k,v){ if(this.available) window.localStorage.setItem(k,v); else this._mem[k]=v; },
  removeItem(k){ if(this.available) window.localStorage.removeItem(k); else delete this._mem[k]; },
};
Storage_.init();

/* ---------- Networking: Wandrian is online-only (v0.10) ----------
   Log In / Register puts saves, the graveyard and the leaderboard on a real server
   (see the server folder), so friends can share a hosted link and see each other in
   chat and on the leaderboard. A `?api=https://example.com` query param can point the
   client at a server hosted on a different origin than the page itself. The old
   Play Offline / Storage_-only mode has been removed from the UI; Storage_ itself is
   kept only as the localStorage wrapper for session-token persistence. ---------- */

const NET_TOKEN_KEY="wandrian_web_token";
const NET_USERNAME_KEY="wandrian_web_username";

const Net = {
  online:false, token:null, username:null,
  cache:null,            // array of 6 slot entries from GET /api/characters
  // v0.17 (#29): gold is now ACCOUNT-BOUND (see the accounts.gold column server-side) --
  // this is the single shared value every character's PS.gold getter/setter proxies onto
  // (see PS's `get gold()`/`set gold()` above). Populated from the server's `account_gold`
  // field on every /api/characters fetch (refreshCharacters(), called at login/resume and
  // whenever the character list is reloaded), which is the authoritative source of truth --
  // this is also how a player catches up on gold credited by an Auction House sale that
  // completed while they were offline or playing a different character (see ensureChat()'s
  // "gold_sync" WS message below for the same catch-up in real time while connected).
  accountGold:0,
  graveyardCache:null,
  leaderboardCache:null, leaderboardCacheHardcore:null,
  // v0.17.3 (#13/#14/#15): separate caches for the Leaderboard's Skill Progression / Gold
  // tabs, plus a single-entry cache for whichever character the Inspect Player view is
  // currently showing. Cleared on logout just like the other caches below.
  leaderboardSkillsCache:null, leaderboardGoldCache:null, inspectPlayerCache:null,
  // v0.18.2 (#8): "Max Killstreak" leaderboard tab -- same caching pattern as the two above.
  leaderboardKillstreakCache:null,
  // v0.18 (#14): "Currently playing" list under Global Chat -- see fetchActivePlayers().
  activePlayersCache:null,
  auctionCache:null,
  vaultCache:null, vaultCapacity:200, vaultVersion:0,
  chatMessages:[], privateMessages:[], chatSocket:null,
  apiBase(){
    const params=new URLSearchParams(location.search);
    return params.get("api") || "";
  },
  persistSession(){ Storage_.setItem(NET_TOKEN_KEY,this.token||""); Storage_.setItem(NET_USERNAME_KEY,this.username||""); },
  clearPersistedSession(){ Storage_.removeItem(NET_TOKEN_KEY); Storage_.removeItem(NET_USERNAME_KEY); },
  async tryResumeSession(){
    const token=Storage_.getItem(NET_TOKEN_KEY);
    const username=Storage_.getItem(NET_USERNAME_KEY);
    if(!token) return false;
    this.token=token; this.username=username; this.online=true;
    try{
      await this.refreshCharacters();
      // v0.18.1 (#29): same reasoning as afterAuth() -- a resumed session (page reload with
      // an existing token) is just as much a "session start" as a fresh login, so it needs
      // its own kick-off fetch for the now-always-visible "Currently playing" line too.
      this.fetchActivePlayers().then(render).catch(()=>{});
      return true;
    }catch(e){
      this.online=false; this.token=null; this.username=null; this.clearPersistedSession();
      return false;
    }
  },
  authHeaders(extra={}){ return Object.assign({"Authorization":"Bearer "+this.token}, extra); },
  async register(username,passcode,email){
    const res=await fetch(this.apiBase()+"/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,passcode,email:email||undefined})});
    const json=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(json.error||"Registration failed.");
    return json;
  },
  async login(username,passcode){
    const res=await fetch(this.apiBase()+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,passcode})});
    const json=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(json.error||"Login failed.");
    return json;
  },
  async afterAuth(username,token){
    this.username=username; this.token=token; this.online=true;
    this.persistSession();
    await this.refreshCharacters();
    // v0.18.1 (#29): "Currently playing" is now always visible at the top of the page (see
    // activePlayersLine()/render()), not just while the Global Chat panel happens to be
    // open -- so it needs its own fetch kicked off the moment a session actually starts,
    // not only from toggleChat(). Fire-and-forget: a failure here just leaves the line on
    // its "loading..." state until the next successful poll.
    this.fetchActivePlayers().then(render).catch(()=>{});
  },
  async refreshCharacters(){
    const res=await fetch(this.apiBase()+"/api/characters",{headers:this.authHeaders()});
    if(!res.ok) throw new Error("Could not load your characters from the server.");
    const json=await res.json();
    this.cache=json.slots;
    // v0.17 (#29): the account's shared gold total, always fresh from the server -- this is
    // what catches a player up on gold credited by an Auction House sale (or anything else)
    // that happened while they weren't actively connected. See the `accountGold` field's
    // declaration above for the full picture.
    this.accountGold=json.account_gold||0;
  },
  logout(){
    this.online=false; this.token=null; this.username=null; this.cache=null;
    this.graveyardCache=null; this.leaderboardCache=null; this.leaderboardCacheHardcore=null;
    this.leaderboardSkillsCache=null; this.leaderboardGoldCache=null; this.inspectPlayerCache=null;
    this.leaderboardKillstreakCache=null;
    this.activePlayersCache=null;
    this.auctionCache=null; this.vaultCache=null; this.vaultVersion=0; this.chatMessages=[]; this.privateMessages=[];
    this._saveInFlight={};
    if(this.chatSocket){ try{this.chatSocket.close();}catch(e){} this.chatSocket=null; }
    this.clearPersistedSession();
  },
  // v0.15.1: autosave fires very often (every action, plus once a second while regen is
  // active), and every call used to fire its own independent, un-awaited fetch. With no
  // ordering guarantee on the network, two of those requests could arrive at the server
  // out of order, letting an OLDER snapshot silently overwrite a NEWER one that had
  // already landed -- a real, hard-to-reproduce cause of "my progress randomly rolled
  // back" reports that has nothing to do with the browser Back button. Two fixes:
  //   1) Coalesce here: never have more than one save in flight per character slot. If a
  //      save is already in flight when another comes in, just remember the latest data
  //      and send THAT (not the older one that triggered this call) the moment the current
  //      request finishes -- this alone eliminates almost all the out-of-order risk since
  //      there's rarely more than one request on the wire at once.
  //   2) A per-save sequence number (data._save_seq, see PS._nextSaveSeq()) travels with
  //      every request as a backstop: the server (see PUT /api/characters/:slot) refuses
  //      to let a save with an older sequence number overwrite a newer one that's already
  //      stored, even if it somehow still arrives late.
  _saveInFlight:{},
  saveCharacter(slot,data){
    if(this.cache) this.cache[slot]={slot,data,updated_at:new Date().toISOString(),empty:false};
    let state=this._saveInFlight[slot];
    if(state && state.busy){ state.latest=data; return; }
    state={busy:true,latest:null}; this._saveInFlight[slot]=state;
    this._sendCharacterSave(slot,data,state);
  },
  _sendCharacterSave(slot,data,state){
    const body=JSON.stringify(data);
    // keepalive lets this request survive the page actually being torn down (tab close,
    // navigating away) instead of being aborted mid-flight -- this matters most for the
    // very last save of a session. It has a small body-size ceiling in some browsers, so
    // a huge payload (a maxed-out endgame backpack) falls back to a plain request rather
    // than failing to send at all.
    const attempt=(useKeepalive)=>fetch(this.apiBase()+"/api/characters/"+slot,{method:"PUT",keepalive:useKeepalive,headers:this.authHeaders({"Content-Type":"application/json"}),body})
      .then(res=>{
        // v0.17 (#29): adopt the server's authoritative account gold right after every save
        // completes, best-effort -- self-corrects instantly for the normal case, and also
        // catches up a concurrent credit (e.g. an Auction House sale of a DIFFERENT
        // character on this same account) that landed in between. Guarded defensively (a
        // test-harness or malformed response might not even have a real .json()) so this
        // bonus sync can never itself masquerade as a save failure and trigger a retry.
        try{ if(res && typeof res.json==="function") res.json().then(json=>{ if(json && typeof json.account_gold==="number") this.accountGold=json.account_gold; }).catch(()=>{}); }catch(e){}
        return res;
      })
      .catch(e=>{
        if(useKeepalive){
          // Some browsers throw synchronously/reject a keepalive request that's too large
          // instead of silently ignoring the flag -- retry once without it.
          return attempt(false);
        }
        console.warn("save to server failed",e);
      });
    attempt(true).finally(()=>{
      const next=state.latest;
      state.busy=false; state.latest=null;
      if(next){ state.busy=true; this._sendCharacterSave(slot,next,state); }
    });
  },
  deleteCharacter(slot,hardcoreDeath){
    if(this.cache) this.cache[slot]={slot,empty:true};
    if(this.graveyardCache && hardcoreDeath) this.graveyardCache.unshift({name:hardcoreDeath.name,class_name:hardcoreDeath.class_name,level:hardcoreDeath.level,cause:hardcoreDeath.cause,died_at:new Date().toISOString()});
    fetch(this.apiBase()+"/api/characters/"+slot,{method:"DELETE",headers:this.authHeaders({"Content-Type":"application/json"}),body:JSON.stringify({hardcore_death:hardcoreDeath||null})})
      .catch(e=>console.warn("delete on server failed",e));
  },
  async fetchGraveyard(){
    const res=await fetch(this.apiBase()+"/api/graveyard",{headers:this.authHeaders()});
    const json=await res.json().catch(()=>({entries:[]}));
    this.graveyardCache=json.entries||[];
  },
  // v0.16 (#334): leave a flower/herb tribute on a fallen hero's grave. Purely cosmetic
  // (no gold/item cost) and server-attributed to the CALLER'S OWN logged-in username --
  // see POST /api/graveyard/:id/tribute's comment for why that can't be spoofed, and why
  // one account can only ever leave one tribute per grave. On success, patches the
  // matching entry in graveyardCache in place with the server's fresh tribute list, so the
  // caller can just render() instead of doing a whole fetchGraveyard() round-trip.
  async leaveTribute(graveId){
    const res=await fetch(this.apiBase()+"/api/graveyard/"+graveId+"/tribute",{method:"POST",headers:this.authHeaders({"Content-Type":"application/json"})});
    const json=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(json.error||"Could not leave a tribute.");
    if(this.graveyardCache){
      const entry=this.graveyardCache.find(e=>e.id===graveId);
      if(entry) entry.tributes=json.tributes||entry.tributes;
    }
    return json;
  },
  async fetchLeaderboard(){
    const res=await fetch(this.apiBase()+"/api/leaderboard");
    const json=await res.json().catch(()=>({entries:[]}));
    this.leaderboardCache=json.entries||[];
  },
  // v0.17.3 (#13): raw weapon-skill hit counters + herbalism points for every character on
  // the board -- the Skill Progression tab computes actual levels/progress from these
  // client-side (see skillProgressionRows() below), same as the character sheet's own
  // skillsBonusPanel() does for the logged-in player.
  async fetchLeaderboardSkills(){
    const res=await fetch(this.apiBase()+"/api/leaderboard/skills");
    const json=await res.json().catch(()=>({entries:[]}));
    this.leaderboardSkillsCache=json.entries||[];
  },
  // v0.17.3 (#14): account name + gold for every account, sorted server-side.
  async fetchLeaderboardGold(){
    const res=await fetch(this.apiBase()+"/api/leaderboard/gold");
    const json=await res.json().catch(()=>({entries:[]}));
    this.leaderboardGoldCache=json.entries||[];
  },
  // v0.18.2 (#8): "Max Killstreak" leaderboard tab -- per-CHARACTER (not per-account, see
  // max_kill_streak's declaration), already sorted+capped server-side, top 50.
  async fetchLeaderboardKillstreak(){
    const res=await fetch(this.apiBase()+"/api/leaderboard/killstreak");
    const json=await res.json().catch(()=>({entries:[]}));
    this.leaderboardKillstreakCache=json.entries||[];
  },
  // v0.18 (#14/#17): character name + last-active timestamp for every account whose most
  // recently-updated character saved within the last 5 minutes (server-computed off the
  // same `characters.updated_at` column autosave already stamps -- see /api/active-players'
  // comment). Public, no auth needed, same sensitivity level as the public leaderboard.
  async fetchActivePlayers(){
    const res=await fetch(this.apiBase()+"/api/active-players");
    const json=await res.json().catch(()=>({entries:[]}));
    this.activePlayersCache=json.entries||[];
  },
  // v0.17.3 (#15): read-only snapshot of another player's equipped gear/attributes/skills
  // for the "Inspect Player" view -- see the server route's comment for the security
  // reasoning (GET-only, whitelisted fields, no mutation surface reachable from here).
  async fetchInspectPlayer(accountId,characterName){
    const url=this.apiBase()+`/api/leaderboard/inspect/${accountId}/${encodeURIComponent(characterName)}`;
    const res=await fetch(url,{headers:this.authHeaders()});
    const json=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(json.error||"Could not load that player's details.");
    this.inspectPlayerCache=json;
    return json;
  },
  // Admin token (Dev Tools gate + leaderboard moderation): server-verified only, never
  // embedded in the client. Not persisted anywhere -- typed in fresh each session, sent
  // only in the X-Admin-Token header of these calls.
  async verifyAdminToken(adminToken){

  },
  async fetchAdminLeaderboard(adminToken){
    const res=await fetch(this.apiBase()+"/api/admin/leaderboard",{headers:this.authHeaders({"X-Admin-Token":adminToken})});

  },
  async adminDeleteLeaderboardEntry(accountId,characterName,adminToken){

    const res=await fetch(url,{method:"DELETE",headers:this.authHeaders({"X-Admin-Token":adminToken})});
    const json=await res.json().catch(()=>({}));

  },
  // v0.18.1 (#2): read-only account list (createdOn/email/lastActiveAt) for the admin panel.
  async fetchAdminAccounts(adminToken){
    const res=await fetch(this.apiBase()+"/api/admin/accounts",{headers:this.authHeaders({"X-Admin-Token":adminToken})});
    const json=await res.json().catch(()=>({}));

  },
  async announceTrialResult(payload){
    if(!this.online) return;
    try{ await fetch(this.apiBase()+"/api/announce/trial",{method:"POST",headers:this.authHeaders({"Content-Type":"application/json"}),body:JSON.stringify(payload)}); }catch(e){}
  },
  async announceDeath(payload){
    if(!this.online) return;
    try{ await fetch(this.apiBase()+"/api/announce/death",{method:"POST",headers:this.authHeaders({"Content-Type":"application/json"}),body:JSON.stringify(payload)}); }catch(e){}
  },
  async announceCreated(payload){
    if(!this.online) return;
    try{ await fetch(this.apiBase()+"/api/announce/created",{method:"POST",headers:this.authHeaders({"Content-Type":"application/json"}),body:JSON.stringify(payload)}); }catch(e){}
  },
  // Storage Vault (v0.11): one shared 200-slot chest per account, so every character
  // slot on the account can deposit into and withdraw from the same stash server-side.
  // v0.15 BUG FIX: saveVault() now sends the `version` this client last saw, and the
  // server rejects the write with a 409 if some OTHER session (another of your own
  // characters, another tab/device) already changed the vault since then -- see the
  // server's /api/vault comment for the full dupe exploit this closes.
  async fetchVault(){
    const res=await fetch(this.apiBase()+"/api/vault",{headers:this.authHeaders()});
    const json=await res.json().catch(()=>({items:[],capacity:200,version:0}));
    this.vaultCache=json.items||[];
    this.vaultCapacity=json.capacity||200;
    this.vaultVersion=json.version||0;
  },
  async saveVault(items){
    const res=await fetch(this.apiBase()+"/api/vault",{method:"PUT",headers:this.authHeaders({"Content-Type":"application/json"}),body:JSON.stringify({items, version:this.vaultVersion})});
    const json=await res.json().catch(()=>({}));
    if(res.status===409){
      // Someone else's vault change landed first -- the server hands back its real
      // current items/capacity/version here so the caller can resync instead of retrying
      // blind (which would just race again).
      const err=new Error(json.error||"The vault changed elsewhere, refresh and try again.");
      err.conflict=true; err.items=json.items||[]; err.capacity=json.capacity||this.vaultCapacity; err.version=json.version!=null?json.version:this.vaultVersion;
      throw err;
    }
    if(!res.ok) throw new Error(json.error||"Could not save the vault.");
    if(json.version!=null) this.vaultVersion=json.version;
    return json;
  },
  async fetchAuction(){
    const res=await fetch(this.apiBase()+"/api/auction",{headers:this.authHeaders()});
    const json=await res.json().catch(()=>({listings:[]}));
    this.auctionCache=json.listings||[];
  },
  async createAuctionListing(payload){
    const res=await fetch(this.apiBase()+"/api/auction",{method:"POST",headers:this.authHeaders({"Content-Type":"application/json"}),body:JSON.stringify(payload)});
    const json=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(json.error||"Could not create listing.");
    return json;
  },
  async buyAuctionListing(id,payload){
    const res=await fetch(this.apiBase()+"/api/auction/"+id+"/buy",{method:"POST",headers:this.authHeaders({"Content-Type":"application/json"}),body:JSON.stringify(payload)});
    const json=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(json.error||"Could not complete purchase.");
    return json;
  },
  async cancelAuctionListing(id,payload){
    const res=await fetch(this.apiBase()+"/api/auction/"+id,{method:"DELETE",headers:this.authHeaders({"Content-Type":"application/json"}),body:JSON.stringify(payload)});
    const json=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(json.error||"Could not cancel listing.");
    return json;
  },
  ensureChat(){
    if(this.chatSocket || !this.online) return;
    const wsProto = location.protocol==="https:" ? "wss://" : "ws://";
    const base = this.apiBase();
    const wsUrl = base ? base.replace(/^http/,"ws")+"/ws/chat?token="+this.token : wsProto+location.host+"/ws/chat?token="+this.token;
    try{
      const ws=new WebSocket(wsUrl);
      ws.onmessage=(ev)=>{
        try{
          const msg=JSON.parse(ev.data);
          if(msg.type==="history") this.chatMessages=msg.messages||[];
          else if(msg.type==="chat"){ this.chatMessages.push(msg); if(this.chatMessages.length>200) this.chatMessages.shift(); }
          else if(msg.type==="private_history"){ this.privateMessages=this.privateMessages.concat(msg.messages||[]); }
          else if(msg.type==="private"){
            this.privateMessages.push(msg);
            // v0.17 (#29): an Auction House sale notification (see server.js's
            // sendPrivateMessage call in POST /api/auction/:id/buy) now rides along with a
            // live gold correction when the seller happens to have chat connected at the
            // moment of the sale -- adopt it immediately instead of waiting for the next
            // full character-list refresh. This is a best-effort real-time nicety on top
            // of, not a replacement for, the GET /api/characters catch-up (see
            // Net.refreshCharacters()), which is what guarantees correctness for a seller
            // who wasn't connected (the common case this whole feature was fixing: a
            // hardcore character's completed sale used to silently lose the gold entirely).
            if(typeof msg.gold==="number") this.accountGold=msg.gold;
          }
          if(GF.screen==="chat" || GF.chatOpen) render();
        }catch(e){}
      };
      ws.onclose=()=>{ if(this.chatSocket===ws) this.chatSocket=null; };
      this.chatSocket=ws;
    }catch(e){ console.warn("chat connect failed",e); }
  },
  sendChat(message){
    if(this.chatSocket && this.chatSocket.readyState===WebSocket.OPEN) this.chatSocket.send(JSON.stringify({type:"chat",message}));
  },
};

/* ---------- Save slots / Graveyard ----------
   v0.17 (#6): removed the last of the vestigial local-storage-only "offline mode" save
   path here (SAVE_KEY/hasSave/loadSaveRaw/GRAVEYARD_KEY and every function's dead
   `else` branch below) -- Wandrian has been online-only since v0.10 (see screenAuthGate(),
   which blocks every gameplay screen until a successful login sets Net.online=true), so
   these branches were provably unreachable in normal play, just leftover dead code from
   before the server-backed save system existed. Confirmed via full-file audit (#6) that no
   other offline/local-only code paths remain anywhere in index.html or server.js. */

function deleteSave(slot,hardcoreDeath){ Net.deleteCharacter(slot,hardcoreDeath); }
function listCharacterSummaries(){
  const out=[];
  for(const entry of (Net.cache||[])){
    if(entry.empty){ out.push({slot:entry.slot, empty:true}); continue; }
    const raw=entry.data; const c=DL.getClass(raw.class_id);
    out.push({slot:entry.slot, empty:false, class_id:raw.class_id, display_name:c.display_name||raw.class_id, character_name:raw.character_name||"Hero", level:raw.level||1, tier:c.tier||1, hardcore:!!raw.hardcore});
  }
  return out;
}
function readGraveyard(){ return Net.graveyardCache||[]; }
function appendGraveyard(entry){ /* server records this when deleteSave() sends hardcore_death */ }

/* ---------- PlayerState-equivalent ---------- */

const PS = {
  // v0.15.1: every save gets a strictly-increasing sequence number (see saveGame() and
  // Net.saveCharacter()) so the server can tell which of two saves is actually newer, even
  // if their network requests arrive out of order. _applyLoadedData() below floors this
  // against whatever sequence was already stored for the loaded character (see the
  // Math.max() there), so a skewed local clock -- or simply picking up a character that's
  // already been saved further ahead by another session -- can never produce a number
  // lower than what the server already has (which would otherwise get every future save
  // from that device rejected as "stale" forever).
  //
  // v0.18 BUG FIX (#1): this used to be `Math.max(Date.now(), this._saveSeqFloor+1)` --
  // letting the wall clock dominate every single call, not just the initial seed. That's
  // exactly what let a player's Broken Bridge Trial failure get silently rolled back:
  // reported as "failed the Tier 2 trial, got reset to level 16 instead of level 1".
  // Sequence: open the game in one tab, grind for a while (an autosave lands with, say,
  // seq=Date.now()~=1000000). Leave that tab open (or idle in the background, e.g. a
  // laptop lid closed mid-session) without reloading it, and open the game again in a
  // second tab/device to keep playing the SAME character -- that second tab correctly
  // syncs its floor to >=1000000 on load, keeps playing, fails the trial, and saves the
  // correct level=1 with seq=1000050. Minutes later the FIRST, stale tab -- still sitting
  // on its old level-16 in-memory state from before the trial even started -- fires an
  // unrelated periodic autosave (e.g. a town HP/stamina regen tick). Because real wall-
  // clock time has advanced, `Date.now()` alone is now comfortably above 1000050 even
  // though that tab's floor was never bumped past ~1000000 -- so its save's seq (still
  // Date.now()-dominated) beats the fresher tab's 1000050, passes the server's "strictly
  // greater" guard, and silently overwrites the correct level-1 reset with the stale
  // level-16 snapshot. No error on either end, exactly matching the report.
  //
  // The fix: once a floor is established (either a fresh Date.now() seed for a session
  // that has never saved before, or synced from the server's own last-known value on
  // load), every SUBSEQUENT sequence number is a pure +1 increment of that floor -- never
  // re-anchored to the wall clock. This makes the counter a purely LOGICAL "how many saves
  // has this session seen" token instead of a wall-clock timestamp, so a stale tab that
  // hasn't reloaded can never leapfrog a fresher tab just because real time has passed --
  // it can only ever count up from the point it personally last saw, which a fresher tab
  // (having synced past that point on its own load) is always guaranteed to already be
  // ahead of. See bridge_trial_test.js for a regression test simulating exactly this
  // stale-tab-vs-fresh-tab race.
  _saveSeqFloor:0,
  _nextSaveSeq(){ this._saveSeqFloor=this._saveSeqFloor?this._saveSeqFloor+1:Date.now(); return this._saveSeqFloor; },
  class_id:"", character_name:"Hero", level:1, xp:0, xp_to_next:0,
  // v0.17 (#29): gold is now ACCOUNT-BOUND, not per-character -- every character on the
  // same account shares one pool. Rather than duplicate that pool as a separate field on
  // PS (which would need to be kept in lockstep by hand at every read/write site below,
  // exactly the kind of dual-state drift the data-safety directive warns against), `gold`
  // is a thin getter/setter proxy onto Net.accountGold, the single shared value synced
  // from the server (see Net.fetchCharacters()/topBar()). Every existing `this.gold`/
  // `PS.gold` read or write anywhere in this file (buyConsumable, sellGear, addGold, the
  // death penalty, Auction House, etc.) keeps working completely unchanged -- it's just
  // reading/writing the account's shared number under the hood instead of a per-character one.
  get gold(){ return Net.accountGold||0; },
  set gold(v){ Net.accountGold=v; },
  current_hp:0, current_stamina:0, gear_instances:[], equipped:{}, equipped_bags:[],
  // v0.17.1 (#8) BUG FIX: unequipping a bag used to just splice it out of equipped_bags
  // with nowhere for it to actually go -- the bag was simply deleted. `bags` is a stackable
  // dict (same {itemId: count} shape as consumables/herbs, unlimited, no capacity slots of
  // its own -- bags GRANT capacity, they don't consume it) that an unequipped bag now lands
  // in, so it's still owned and re-equippable, never lost.
  bags:{},
  consumables:{}, materials:0, herbs:{}, pending_scroll_bonus:0,
  xp_buff_multiplier:1.0, xp_buff_encounters_left:0, stamina_shrine_buff:0.0,
  highest_tier_reached:1, season_won:false, kill_streak:0,
  // v0.18.2 (#8): unlike kill_streak (reset to 0 on every return to Town/reload, see
  // resetKillStreak()/_applyLoadedData() below), max_kill_streak is a LIFETIME record for
  // this character -- it only ever goes up (see incrementKillStreak()), survives save/reload,
  // and rides along on the same character-save upsert as everything else so the new
  // "Max Killstreak" leaderboard tab can rank characters by it server-side.
  max_kill_streak:0,
  // v0.18.2 (#6): Forest Reputation, kept SEPARATELY per class tier (Gwen's spec: "saved
  // specifically to each forest tier" -- the class tier you're currently in determines which

  // has no stated cap in either direction.
  forest_reputation:{},
  hardcore:false, current_slot:-1,
  lifetime_xp:0, isRestingAtCampfire:false, eyesight_potion_steps_left:0, max_maze_depth_reached:1,
  // v0.17 (#1): "how far across the Broken Bridge Trial did you get last time" -- only ever
  // updated at the moment of a FAILED step (see attemptStep() in screenMasterTrial()), to
  // Balance.BRIDGE_ROWS on a fully successful crossing isn't tracked here on purpose -- the
  // stat is specifically meant to complement level/tier on the leaderboard for players who
  // haven't yet crossed, not to duplicate tier progress for players who have.
  last_bridge_steps:0,
  // v0.17.3 (#3): cumulative COUNT of failed Broken Bridge Trial attempts since the last
  // successful promotion at this tier -- drives the "+1 starting stat point per failed
  // attempt" bonus (see Balance.STARTING_STAT_POINTS and resolveMasterTrial()). Reset to 0
  // the moment a promotion succeeds, since the bonus is meant to soften the grind of
  // repeated failures at the SAME tier, not carry across into the next one.
  bridge_fail_streak:0,
  // v0.17 (#28): incremented once per RESOLVED Broken Bridge Trial attempt (pass or fail --
  // see resolveMasterTrial() below, which runs for both outcomes). Drives the Merchant's
  // gear-stock reroll cadence (see ensureMerchantStock()); not otherwise displayed anywhere.
  trial_attempts_count:0,
  // v0.17.3 (#8): Health Potions heal gradually over Balance.POTION_HEAL_DURATION_MS instead
  // of instantly. Holds at most ONE {perTick, ticksLeft} entry at a time -- see
  // PS._queueGradualHeal()'s comment for why (v0.18.1 #27 bug fix: multiple potions used to
  // each push their own independent entry, which stacked their delivery RATE instead of just
  // extending how long the healing ran for). Drained by the dedicated heal-over-time
  // setInterval near the bottom of this file; deliberately survives a save/reload (see
  // saveGame()/_applyLoadedData()) so closing the tab mid-heal doesn't just discard the rest
