// v0.17.3 (#10): shared "Comparison" popup shown alongside a gear item's normal tooltip
// wherever the player is looking at gear they DON'T currently have on (Inventory backpack,
// Storage Vault, Auction House, and -- as a bonus, same helper -- the Merchant's stock and
// Blacksmith's sell list), so they can tell at a glance whether it beats what's equipped
// without leaving the screen to check. A ring compares against BOTH ring slots (there's no
// single "the" equipped ring), everything else maps 1:1 onto its own equip slot.
// v0.18.1 (#13): sums an item's affixes into a {stat: totalValue} map (an item could in
// principle roll two affixes of the same stat, so this sums rather than assumes uniqueness)
// -- used to compute per-stat deltas between the hovered item and whatever's equipped.
function gearAffixMap(inst){
  const m={};
  for(const a of (inst.affixes||[])) m[a.stat]=(m[a.stat]||0)+a.value;
  return m;
}
// Renders the "(+N)"/"(-N)" delta span for one stat, colored green/red -- returns null for
// a zero delta (nothing to show, the two items tie on that stat).
function affixDeltaSpan(stat,delta){
  if(!delta) return null;
  const isPercent=IF.affixIsPercent(stat);
  const sign=delta>0?"+":"-";
  const mag=Math.abs(delta);
  const text=stat==="regen" ? mag.toFixed(1) : Math.round(mag)+(isPercent?"%":"");
  return h("span",{class:delta>0?"stat-delta-good":"stat-delta-bad"},[` (${sign}${text})`]);
}
// v0.18.1 (#12/#13): shared "Currently Equipped" popup shown alongside a gear item's normal
// tooltip wherever the player is looking at gear they DON'T currently have on (Inventory
// backpack, Storage Vault, Auction House, Merchant stock, Blacksmith sell list). Renamed
// from "Comparison" (v0.17.3 #10) since it always shows what's currently equipped, and now
// shows a Diablo-3-style colored (+N)/(-N) delta next to each of the equipped item's stats,
// reflecting how the hovered item (`inst`) compares on that same stat -- green if `inst` is
// ahead, red if it's behind. A ring compares against BOTH ring slots; everything else maps
// 1:1 onto its own equip slot.
function gearComparisonContent(inst){
  const slotsToCompare=inst.slot==="ring"?["ring1","ring2"]:[inst.slot];
  const hoveredMap=gearAffixMap(inst);
  const nodes=[h("div",{class:"compare-title"},["Currently Equipped"])];
  for(const slotKey of slotsToCompare){
    const equipped=PS.equipped[slotKey];
    const label=IF.slotLabel(slotKey);
    if(!equipped){
      nodes.push(h("div",{class:"muted",style:{marginBottom:"4px"}},[`${label}: (nothing equipped)`]));
      continue;
    }
    const equippedMap=gearAffixMap(equipped);
    const statLines=[];
    for(const a of equipped.affixes){
      const delta=(hoveredMap[a.stat]||0)-a.value;
      const deltaNode=affixDeltaSpan(a.stat,delta);
      statLines.push(h("div",{},deltaNode?[IF.formatAffix(a),deltaNode]:[IF.formatAffix(a)]));
    }
    // Stats the hovered item rolls that the equipped item doesn't have at all -- a pure
    // gain, so always shown green regardless of magnitude.
    for(const stat in hoveredMap){
      if(!(stat in equippedMap)){
        const deltaNode=affixDeltaSpan(stat,hoveredMap[stat]);
        statLines.push(h("div",{},[`(no ${IF.affixLabel(stat)})`,deltaNode]));
      }
    }
    nodes.push(h("div",{style:{marginBottom:"4px"}},[
      h("div",{style:{fontWeight:"bold"}},[`${label}: ${IF.displayName(equipped)} (${tierRomanNumeral(equipped.tier)})`]),
      ...statLines,
    ]));
  }
  return nodes;
}
// Wraps an already-built tooltip-trigger element (e.g. the bold item-name div that already
// carries the normal .tooltip/data-tip pair) so hovering it also reveals the Comparison box
// beside it -- see the .gear-compare-wrap/.compare-box CSS rules for the positioning (pure
// CSS :hover toggle, no JS mouse listeners needed, consistent with how every other tooltip
// in this file already works).
function gearCompareWrap(triggerEl, inst){
  return h("div",{class:"gear-compare-wrap"},[
    triggerEl,
    h("div",{class:"compare-box"},gearComparisonContent(inst)),
  ]);
}

// v0.15: rarity-to-border-color lookup for the backpack's grid tiles below -- reuses the
// exact hex values the rarity-* CSS classes already use for text color (see the
// .rarity-Common/.rarity-Uncommon/etc rules), just applied as a border instead so a
// glance at the grid tells you an item's rarity the way Vault's plain grid never could.
const RARITY_BORDER_COLORS={Common:"#9a9686",Uncommon:"#e8e4d8",Rare:"#5a9ae0",Epic:"#e0c94a",Legendary:"#d9902f"};

// v0.15: the Character Sheet's backpack, redesigned into the same numbered-slot grid
// style as the Storage Vault (see screenVault()) instead of a scrolling row-per-item
// list. Capacity varies with equipped bags (PS.getInventoryCapacity()), so the grid
// simply grows/shrinks slot count to match -- gaining a bag adds empty slots at the end,
// unequipping one removes them (see PS.unequipBag's new capacity guard below).
// v0.17.1 (#13, credit: Marudok): swaps two backpack slots' array positions, or moves a
// single item to an empty tile. Unlike the Vault (a true fixed 0..199 slot grid, so an
// empty vault slot has its own persistent identity), the backpack's gear_instances array
// is compact -- getInventoryUsed()/hasInventorySpace()/every render loop that iterates it
// assume no holes. So an empty tile has no identity of its own beyond "past the packed
// length" -- every empty tile is interchangeable, and "drop here" just means "move to the
// end of the packed list." Swapping two OCCUPIED tiles, by contrast, never changes the
// array's length or introduces holes, so that case is a plain in-place element swap.
function backpackSwapSlots(idxA,idxB){
  if(idxA===idxB) return;
  const arr=PS.gear_instances;
  const a=arr[idxA];
  if(!a) return;
  if(idxB>=arr.length){
    arr.splice(idxA,1);
    arr.push(a);
  } else {
    const b=arr[idxB];
    arr[idxA]=b; arr[idxB]=a;
  }
  PS.saveGame(); render();
}

function backpackGearGrid(){
  const capacity=PS.getInventoryCapacity();
  const grid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(8,1fr)",gap:"4px",marginBottom:"10px",maxWidth:"360px"}});
  for(let i=0;i<capacity;i++){
    const inst=PS.gear_instances[i];
    const isReorderSrc=GF._bagReorderMode&&GF._bagReorderSrcIdx===i;
    if(!inst){
      grid.appendChild(h("div",{
        class:"tile",
        style:{width:"38px",height:"38px",padding:"0",cursor:GF._bagReorderMode?"pointer":"default"},
        onClick:GF._bagReorderMode?()=>{
          if(GF._bagReorderSrcIdx!=null){ const src=GF._bagReorderSrcIdx; GF._bagReorderSrcIdx=null; backpackSwapSlots(src,i); }
        }:null,
      }));
      continue;
    }
    const canEquip=PS.canEquipGear(inst);
    const borderColor=isReorderSrc?"#4ac6ff":(RARITY_BORDER_COLORS[inst.rarity]||"var(--border)");
    const tile=h("div",{
      class:"tile tooltip",
      style:{width:"38px",height:"38px",padding:"0",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",border:`2px solid ${borderColor}`},
      "data-tip":`${IF.tooltipText(inst)}\n${IF.categoryLabel(inst)}`,
      onClick:GF._bagReorderMode?()=>{
        // v0.17.1 (#13): in reorder mode, clicking gear picks it up (or cancels if it's
        // already selected) instead of equipping it -- equip-on-click only applies outside
        // reorder mode, matching the Vault's same mode split.
        if(GF._bagReorderSrcIdx==null){ GF._bagReorderSrcIdx=i; render(); }
        else if(GF._bagReorderSrcIdx===i){ GF._bagReorderSrcIdx=null; render(); }
        else { const src=GF._bagReorderSrcIdx; GF._bagReorderSrcIdx=null; backpackSwapSlots(src,i); }
      }:()=>{
        if(!canEquip){ setToast(PS.gearInvalidReason(inst)); render(); return; }
        const label=PS.wouldSwap(inst)?"Swap":"Equip";
        askConfirm(`${label} ${IF.displayName(inst)}?`,()=>{ PS.equipGear(inst.instance_id); autosave(); render(); },{confirmLabel:label,danger:false});
      },
    },[gearIcon(inst,26)]);
    // v0.17.3 (#10): see gearCompareWrap()'s comment -- lets a player check a backpack
    // item against whatever's currently equipped in that slot without leaving this screen.
    grid.appendChild(gearCompareWrap(tile, inst));
  }
  return grid;
}

// v0.18.1 (#8): how many of a given recipe the player can currently afford to queue at
// once (limited by both herb stock and gold), used to clamp the Alchemist's amount-picker
// the same way the Merchant's Consumables tab clamps to what's affordable.
function maxAffordableRecipeQty(recipe){
  let max=99;
  for(const h2 in recipe.herbs){ const have=PS.herbs[h2]||0; max=Math.min(max, Math.floor(have/recipe.herbs[h2])); }
  if(recipe.gold_cost>0) max=Math.min(max, Math.floor(PS.gold/recipe.gold_cost));
  return Math.max(1,max);
}
// v0.18.1 (#8): same -/N/+ pattern as merchantAmountPicker(), own independent state bag
// (GF.alchemistBrewQty) so the two screens' picked amounts never collide.
function alchemistAmountPicker(recipeId,maxQty){
  if(!GF.alchemistBrewQty) GF.alchemistBrewQty={};
  const qty=clampi(GF.alchemistBrewQty[recipeId]||1,1,Math.max(1,maxQty));
  GF.alchemistBrewQty[recipeId]=qty;
  return h("div",{class:"row",style:{alignItems:"center",gap:"6px"}},[
    h("button",{style:{padding:"2px 9px"},disabled:qty<=1,onClick:(e)=>{ e.stopPropagation(); GF.alchemistBrewQty[recipeId]=Math.max(1,qty-1); render(); }},["-"]),
    h("span",{style:{fontWeight:"bold",minWidth:"18px",textAlign:"center"}},[String(qty)]),
    h("button",{style:{padding:"2px 9px"},disabled:qty>=maxQty,onClick:(e)=>{ e.stopPropagation(); GF.alchemistBrewQty[recipeId]=Math.min(maxQty,qty+1); render(); }},["+"]),
  ]);
}

/* ================= STORAGE VAULT ================= */
// A 20x10 (200-slot) chest shared across every character on the account, not just the
// one currently loaded -- backed by the server's /api/vault endpoints (see server.js),
// scoped to the logged-in account so nobody else's stash is ever reachable. Each slot
// holds either one gear instance, or one stack of a single consumable/herb type.

function vaultFindEmptySlot(){
  const items=Net.vaultCache||[];
  const capacity=Net.vaultCapacity||200;
  const used=new Set(items.map(i=>i.slot));
  for(let i=0;i<capacity;i++) if(!used.has(i)) return i;
  return -1;
}
// v0.15 BUG FIX (item duplication): every vault mutation here still updates Net.vaultCache
// and the player's own PS inventory OPTIMISTICALLY (immediately, before the server
// confirms), same as before -- that part of the UX is unchanged. What's new is `restoreFn`:
// if the server's version check rejects this write (another of your characters/sessions
// changed the vault first), Net.vaultCache/vaultCapacity/vaultVersion get resynced to the
// server's real current state, AND restoreFn undoes whatever this action optimistically
// took out of (or added to) the player's own gear/consumables/herbs, since it never
// actually landed. Without this, the old code would just silently keep the optimistic
// local mutation forever even after the server rejected it -- that mismatch between "what
// the client thinks happened" and "what the server actually has" is exactly how the
// reported dupe (and its mirror-image, item loss) happened.
function vaultSync(restoreFn){
  Net.saveVault(Net.vaultCache||[]).catch(e=>{
    if(e && e.conflict){
      Net.vaultCache=e.items; Net.vaultCapacity=e.capacity; Net.vaultVersion=e.version;
      if(restoreFn) restoreFn();
      setToast("The vault changed elsewhere (maybe another of your characters) since you last looked here -- refreshed to its current contents. Please try again.");
    } else {
      setToast("Could not sync the vault with the server: "+e.message);
    }
    PS.saveGame(); render();
  });
}
function vaultDepositGear(instanceId){
  const slot=vaultFindEmptySlot();
  if(slot===-1){ setToast("The vault is full."); return; }
  const idx=PS.findGearIndex(instanceId);
  if(idx===-1) return;
  const inst=PS.gear_instances[idx];
  PS.gear_instances.splice(idx,1);
  Net.vaultCache.push({slot,kind:"gear",inst});
  PS.saveGame(); vaultSync(()=>{ PS.addGear(inst); }); render();
}
function vaultDepositConsumable(itemId){
  const qty=PS.consumables[itemId]||0; if(qty<=0) return;
  const existing=(Net.vaultCache||[]).find(e=>e.kind==="consumable"&&e.item_id===itemId);
  if(existing){ existing.qty+=qty; }
  else {
    const slot=vaultFindEmptySlot();
    if(slot===-1){ setToast("The vault is full."); return; }
    Net.vaultCache.push({slot,kind:"consumable",item_id:itemId,qty});
  }
  delete PS.consumables[itemId];
  PS.saveGame(); vaultSync(()=>{ PS.addConsumable(itemId,qty); }); render();
}
function vaultDepositHerb(herbId){
  const qty=PS.herbs[herbId]||0; if(qty<=0) return;
  const existing=(Net.vaultCache||[]).find(e=>e.kind==="herb"&&e.herb_id===herbId);
  if(existing){ existing.qty+=qty; }
  else {
    const slot=vaultFindEmptySlot();
    if(slot===-1){ setToast("The vault is full."); return; }
    Net.vaultCache.push({slot,kind:"herb",herb_id:herbId,qty});
  }
  delete PS.herbs[herbId];
  PS.saveGame(); vaultSync(()=>{ PS.addHerb(herbId,qty); }); render();
}
function vaultWithdraw(slotIndex){
  const idx=(Net.vaultCache||[]).findIndex(e=>e.slot===slotIndex);
  if(idx===-1) return;
  const entry=Net.vaultCache[idx];
  let restoreFn=null;
  if(entry.kind==="gear"){
    if(!PS.addGear(entry.inst)){ setToast("Your backpack is full."); return; }
    // Undo just this one instance if the withdraw turns out not to have landed --
    // NOT a blind pop(), in case something else got added to the backpack in between.
    restoreFn=()=>{ const i=PS.findGearIndex(entry.inst.instance_id); if(i!==-1) PS.gear_instances.splice(i,1); };
  } else if(entry.kind==="consumable"){
    PS.addConsumable(entry.item_id,entry.qty);
    restoreFn=()=>{ PS.consumables[entry.item_id]=Math.max(0,(PS.consumables[entry.item_id]||0)-entry.qty); if(PS.consumables[entry.item_id]<=0) delete PS.consumables[entry.item_id]; };
  } else if(entry.kind==="herb"){
    PS.addHerb(entry.herb_id,entry.qty);
    restoreFn=()=>{ PS.herbs[entry.herb_id]=Math.max(0,(PS.herbs[entry.herb_id]||0)-entry.qty); if(PS.herbs[entry.herb_id]<=0) delete PS.herbs[entry.herb_id]; };
  }
  Net.vaultCache.splice(idx,1);
  PS.saveGame(); vaultSync(restoreFn); render();
}
// v0.17.1 (#14): withdraw only PART of a stackable vault entry (consumable/herb), leaving
// the remainder behind in the same vault slot -- e.g. stash 40 potions, but only withdraw
// 10 for this trip. Gear entries aren't stackable (always qty-of-1 conceptually) so this
// only ever applies to consumable/herb kinds; qty must be a whole number strictly between
// 0 and the entry's current stack (a qty equal to the whole stack should just use the
// existing full-withdraw flow instead).
function vaultWithdrawPartial(slotIndex,qty){
  const idx=(Net.vaultCache||[]).findIndex(e=>e.slot===slotIndex);
  if(idx===-1) return;
  const entry=Net.vaultCache[idx];
  if(entry.kind!=="consumable"&&entry.kind!=="herb") return;
  qty=Math.floor(qty);
  if(!qty||qty<=0||qty>=entry.qty) return;
  entry.qty-=qty;
  let restoreFn=null;
  if(entry.kind==="consumable"){
    PS.addConsumable(entry.item_id,qty);
    restoreFn=()=>{ entry.qty+=qty; PS.consumables[entry.item_id]=Math.max(0,(PS.consumables[entry.item_id]||0)-qty); if(PS.consumables[entry.item_id]<=0) delete PS.consumables[entry.item_id]; };
  } else {
    PS.addHerb(entry.herb_id,qty);
    restoreFn=()=>{ entry.qty+=qty; PS.herbs[entry.herb_id]=Math.max(0,(PS.herbs[entry.herb_id]||0)-qty); if(PS.herbs[entry.herb_id]<=0) delete PS.herbs[entry.herb_id]; };
  }
  PS.saveGame(); vaultSync(restoreFn); render();
}
// v0.17.1 (#13, credit: Marudok): lets a player manually reposition a vault item into a
// different (empty or occupied) slot, so they can custom-sort their stash into groups
// instead of always living wherever they happened to land. Swaps two occupied slots'
// positions, or just moves a single item into an empty one -- either way it's a pure
// position change, nothing is added, removed, or altered about the items themselves.
function vaultSwapSlots(slotA,slotB){
  if(slotA===slotB) return;
  const items=Net.vaultCache||[];
  const entryA=items.find(e=>e.slot===slotA), entryB=items.find(e=>e.slot===slotB);
  if(!entryA && !entryB) return;
  if(entryA) entryA.slot=slotB;
  if(entryB) entryB.slot=slotA;
  vaultSync(()=>{ if(entryA) entryA.slot=slotA; if(entryB) entryB.slot=slotB; });
  render();
}

// v0.18 (#4): re-lays out every GEAR entry in the vault by Tier -- T1 first (top-left,
// filling left-to-right then wrapping rows) through T5 last, or reversed on a second
// click. Non-gear entries (consumables/herbs) have no tier to sort by, so per Gwen's
// spec ("sort all gear by Tier") they're left out of the ordering entirely and simply
// packed into whatever slots remain after all the now-sorted gear, in their original
// relative order -- nothing about them is lost or reshuffled amongst themselves.
function vaultSortByTier(){
  const items=Net.vaultCache||[];
  const gear=items.filter(e=>e.kind==="gear").slice().sort((a,b)=>a.inst.tier-b.inst.tier);
  const nonGear=items.filter(e=>e.kind!=="gear").slice().sort((a,b)=>a.slot-b.slot);
  if(GF._vaultSortTierDesc) gear.reverse();
  let nextSlot=0;
  for(const e of gear) e.slot=nextSlot++;
  for(const e of nonGear) e.slot=nextSlot++;
  GF._vaultSortTierDesc=!GF._vaultSortTierDesc;
  PS.saveGame(); vaultSync(); render();
}

// v0.18 (#4): same idea for the backpack -- unlike the vault, gear_instances is a single
// compact array with no non-gear entries to work around, so this is a plain in-place sort.
function backpackSortByTier(){
  PS.gear_instances.sort((a,b)=>a.tier-b.tier);
  if(GF._bagSortTierDesc) PS.gear_instances.reverse();
  GF._bagSortTierDesc=!GF._bagSortTierDesc;
  PS.saveGame(); render();
}

/* ================= GEAR FILTERS (v0.17.3 #6/#11) ================= */
/* Shared by the Storage Vault and the Auction House -- a Tier dropdown, an Item Type
   dropdown, and a multiselect stat toggle row, all combined with AND logic (an item must
   satisfy every active condition to "match"). Non-gear entries (consumables, herbs) never
   match a gear filter, since Tier/Type/Stats are gear-only concepts. Per Gwen's spec, a
   match doesn't hide non-matching entries -- it visually mutes everything that DOESN'T
   match (see gearFilterOpacity() below), so the contrast highlights what does. */

// Nicer display labels than IF.GEAR_CATEGORY_LABELS provides for a plain "ring" slot (that
// map only has "ring1"/"ring2" for the two EQUIPPED DOLL positions -- an actual generated
// ring item's own .slot is just "ring", see IF.GENERATION_SLOTS/IF.generate()).
const GEAR_FILTER_SLOT_LABELS={weapon:"Weapon",head:"Head",shoulders:"Shoulders",armor:"Armor",pants:"Pants",gloves:"Gloves",boots:"Boots",ring:"Ring",amulet:"Amulet",belt:"Belt"};

function gearMatchesFilter(inst, filter){
  if(!inst) return false; // consumables/herbs: never match a gear-only filter
  if(filter.tier && inst.tier!==filter.tier) return false;
  if(filter.slot && inst.slot!==filter.slot) return false;
  if(filter.stats && filter.stats.length){
    const instStats=new Set((inst.affixes||[]).map(a=>a.stat));
    for(const s of filter.stats) if(!instStats.has(s)) return false;
  }
  return true;
}
function gearFilterActive(filter){ return !!(filter.tier || filter.slot || (filter.stats&&filter.stats.length>0)); }
// A single reusable "is this entry visually muted right now" check -- entry may be a gear
// instance directly, or null/undefined (a non-gear entry, or an empty slot -- never muted,
// there's nothing there to contrast against).
function gearFilterOpacity(inst, filter){
  // Order matters: check whether a filter is active FIRST. gearMatchesFilter() already
  // returns false for a missing/non-gear `inst` -- with no filter active, that would
  // wrongly mute every consumable/herb/empty slot even with nothing selected. With a
  // filter active, that same false is exactly right: non-gear entries can't satisfy a
  // gear-only filter, so they get muted along with any non-matching gear.
  if(!gearFilterActive(filter)) return 1;
  return gearMatchesFilter(inst,filter) ? 1 : 0.25;
}

// Builds the filter row itself: Tier select, Type select, and a row of stat toggle chips.
// `filter` is mutated in place (it's a plain object stashed on GF, e.g. GF._vaultFilter),
// `onChange` is called (expected to re-render) after every control changes.
function gearFilterPanel(filter, onChange){
  const tierSelect=h("select",{});
  tierSelect.appendChild(h("option",{value:""},["All Tiers"]));
  for(let t=1;t<=Balance.ITEM_TIER_MAX;t++) tierSelect.appendChild(h("option",{value:String(t)},[`T${t}`]));
  tierSelect.value=filter.tier?String(filter.tier):"";
  tierSelect.addEventListener("change",()=>{ filter.tier=tierSelect.value?parseInt(tierSelect.value,10):""; onChange(); });

  const slotSelect=h("select",{});
  slotSelect.appendChild(h("option",{value:""},["All Item Types"]));
  for(const slot of IF.GENERATION_SLOTS) slotSelect.appendChild(h("option",{value:slot},[GEAR_FILTER_SLOT_LABELS[slot]||slot]));
  slotSelect.value=filter.slot||"";
  slotSelect.addEventListener("change",()=>{ filter.slot=slotSelect.value||""; onChange(); });

  const statsRow=h("div",{class:"row gap",style:{flexWrap:"wrap",marginTop:"6px"}});
  for(const stat of Balance.AFFIX_POOL){
    const selected=filter.stats.includes(stat);
    statsRow.appendChild(h("button",{
      style:{padding:"3px 9px",fontSize:".85em",background:selected?"var(--accent,#3a6a2a)":undefined,borderColor:selected?"#7ac67a":undefined},
      title:selected?`Click to remove ${IF.affixLabel(stat)} from the filter`:`Click to require ${IF.affixLabel(stat)}`,
      onClick:()=>{
        if(selected) filter.stats=filter.stats.filter(s=>s!==stat);
        else filter.stats=[...filter.stats,stat];
        onChange();
      },
    },[IF.affixLabel(stat)]));
  }

  const clearBtn=h("button",{
    disabled:!gearFilterActive(filter),
    onClick:()=>{ filter.tier=""; filter.slot=""; filter.stats=[]; onChange(); },
  },["Clear Filters"]);

  return h("div",{class:"panel",style:{marginBottom:"10px"}},[
    h("div",{class:"row gap",style:{alignItems:"center",flexWrap:"wrap"}},[
      h("span",{class:"muted"},["Filter:"]),
      tierSelect,
      slotSelect,
      clearBtn,
    ]),
    statsRow,
  ]);
}

function screenVault(){
  const root=h("div",{});
  root.appendChild(h("div",{class:"row gap"},[iconBadge(`<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="14" width="28" height="20" rx="3" fill="#5a4028" stroke="#2a2a2a" stroke-width="1.5"/><rect x="6" y="14" width="28" height="6" fill="#7a5a38"/><circle cx="20" cy="26" r="4" fill="#2a2a2a"/><rect x="18.5" y="26" width="3" height="6" fill="#2a2a2a"/></svg>`,52),h("div",{},[h("h2",{},["Storage Vault"]),h("div",{class:"flavor"},["\"Whatever you leave here waits for any hero of yours who comes looking, it's shared across every character on your account.\""])])]));
  // v0.16: Back moved up here instead of below the 200-slot grid and all 3 deposit lists.
  root.appendChild(h("button",{style:{marginBottom:"8px"},onClick:()=>GF.goto("town")},["← Back to Town"]));
  const t=toastBox(); if(t) root.appendChild(t);
  root.appendChild(statHeader());

  if(Net.vaultCache===null||Net.vaultCache===undefined){
    root.appendChild(h("div",{class:"muted"},["Loading..."]));
    Net.fetchVault().then(render).catch(()=>{ setToast("Could not load the vault."); render(); });
    return root;
  }

  const capacity=Net.vaultCapacity||200;
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px"}},[`${Net.vaultCache.length}/${capacity} slots used, 20x10, shared across every character on this account.`]));

  // v0.17.3 (#6): Tier/Item Type/Stat filters -- see gearFilterPanel()'s comment block for
  // the shared implementation (also used by the Auction House). GF._vaultFilter persists
  // for the session (not saved to the server) the same way GF._vaultReorderMode does.
  if(!GF._vaultFilter) GF._vaultFilter={tier:"",slot:"",stats:[]};
  root.appendChild(gearFilterPanel(GF._vaultFilter, render));

  // v0.17.1 (#13, credit: Marudok for suggesting manual item repositioning): a toggle that
  // switches the grid's click behavior from "click = withdraw" to "click = pick up / drop
  // here", letting players custom-sort their vault into their own groupings. Turning it on
  // clears any stray split-panel selection so the two modes never fight over what a click
  // on the grid means.
  root.appendChild(h("div",{class:"row gap",style:{marginBottom:"8px",alignItems:"center"}},[
    h("button",{onClick:()=>{ GF._vaultReorderMode=!GF._vaultReorderMode; GF._vaultReorderSrc=null; GF._vaultSplitSlot=null; render(); }},[GF._vaultReorderMode?"Done Reordering":"Reorder Items"]),
    // v0.18 (#4): one-click bulk sort, independent of (and usable alongside) manual
    // Reorder Items drag-and-drop -- toggles ascending/descending each click, see
    // vaultSortByTier()'s comment.
    h("button",{title:"Arrange every gear item by Tier -- click again to reverse the order.",onClick:vaultSortByTier},[GF._vaultSortTierDesc?"Sort by Tier (T5 → T1)":"Sort by Tier (T1 → T5)"]),
    GF._vaultReorderMode?h("div",{class:"muted"},[GF._vaultReorderSrc!=null?"Now click the slot you want to move it to (or click it again to cancel)." : "Click an item to pick it up, then click an empty or occupied slot to place it there."]):null,
  ]));

  const grid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(20,1fr)",gap:"3px",marginBottom:"14px",maxWidth:"760px"}});
  for(let i=0;i<capacity;i++){
    const entry=Net.vaultCache.find(e=>e.slot===i);
    let label=null, icon=null, tip=null;
    if(entry){
      // v0.17 (#9): gear stored in the Vault now gets the exact same full stat/property
      // tooltip (IF.tooltipText + category label) as the backpack grid already shows --
      // previously this only ever showed the item's plain name, forcing a withdraw just to
      // see what an item actually rolled. Consumables/herbs keep their simple name+qty tip,
      // matching what the backpack itself shows for those (no per-stat breakdown exists for
      // non-gear items anywhere in the game yet).
      if(entry.kind==="gear"){ label=IF.displayName(entry.inst)+` (${tierRomanNumeral(entry.inst.tier)})`; icon=gearIcon(entry.inst,24); tip=`${IF.tooltipText(entry.inst)}\n${IF.categoryLabel(entry.inst)}`; }
      else if(entry.kind==="consumable"){ label=`${DL.getItem(entry.item_id).name} x${entry.qty}`; icon=itemIcon(entry.item_id,24); tip=`${label}\n${DL.itemCategoryLabel(entry.item_id)}`; }
      else if(entry.kind==="herb"){ label=`${DL.getHerb(entry.herb_id).name} x${entry.qty}`; icon=herbIcon(entry.herb_id,24); tip=label; }
    }
    // v0.17.1 (#14): a stackable entry (qty > 1) opens the split-quantity panel below the
    // grid instead of immediately confirming a withdraw-everything -- see that panel's
    // render block just after the grid for the actual quantity input. A single-item stack
    // (qty===1) or a gear entry has nothing to split, so it keeps the old one-click-confirm
    // withdraw-the-whole-thing behavior.
    const isSplittable=entry&&(entry.kind==="consumable"||entry.kind==="herb")&&entry.qty>1;
    const isReorderSrc=GF._vaultReorderMode&&GF._vaultReorderSrc===i;
    let onClickFn=null;
    if(GF._vaultReorderMode){
      // v0.17.1 (#13): reorder mode ignores withdraw/split entirely -- first click on an
      // occupied slot picks it up (or cancels if it's already the selected source), second
      // click on ANY slot (empty or occupied, and yes even the same slot as a no-op) drops
      // it there via vaultSwapSlots, which swaps positions if the target is occupied too.
      onClickFn=()=>{
        if(GF._vaultReorderSrc==null){
          if(entry) { GF._vaultReorderSrc=i; render(); }
        } else if(GF._vaultReorderSrc===i){
          GF._vaultReorderSrc=null; render();
        } else {
          const src=GF._vaultReorderSrc; GF._vaultReorderSrc=null;
          vaultSwapSlots(src,i);
        }
      };
    } else if(entry){
      onClickFn=()=>{
        if(isSplittable){ GF._vaultSplitSlot=i; render(); }
        else { askConfirm(`Withdraw ${label} back to your backpack?`,()=>vaultWithdraw(i),{confirmLabel:"Withdraw",danger:false}); }
      };
    }
    // v0.17.3 (#6): mute (don't hide) any slot that doesn't match the active filter, so
    // the ones that DO match stand out by contrast -- see gearFilterOpacity()'s comment.
    const filterOpacity=gearFilterOpacity(entry&&entry.kind==="gear"?entry.inst:null, GF._vaultFilter);
    const vaultTile=h("div",{
      class:"tile"+(entry?" tooltip":"")+(entry&&entry.kind==="gear"?" rarity-"+entry.inst.rarity:""),
      style:{width:"32px",height:"32px",padding:"0",display:"flex",alignItems:"center",justifyContent:"center",cursor:(entry||GF._vaultReorderMode)?"pointer":"default",
        border:isReorderSrc?"2px solid #4ac6ff":undefined, boxSizing:"border-box", opacity:String(filterOpacity)},
      "data-tip":tip||undefined,
      onClick:onClickFn,
    },[icon]);
    // v0.17.3 (#10): only gear entries get a meaningful Comparison box (consumables/herbs
    // have no equip slot to compare against) -- see gearCompareWrap()'s comment.
    grid.appendChild(entry&&entry.kind==="gear"?gearCompareWrap(vaultTile,entry.inst):vaultTile);
  }
  root.appendChild(grid);

  // v0.17.1 (#14): the split-withdraw panel -- appears once a stackable vault slot is
  // clicked, lets the player type exactly how many to pull out, leaving the rest stashed.
  if(GF._vaultSplitSlot!=null){
    const entry=(Net.vaultCache||[]).find(e=>e.slot===GF._vaultSplitSlot);
    if(!entry || (entry.kind!=="consumable"&&entry.kind!=="herb")){ GF._vaultSplitSlot=null; }
    else {
      const name=entry.kind==="consumable"?DL.getItem(entry.item_id).name:DL.getHerb(entry.herb_id).name;
      const qtyInput=h("input",{type:"number",min:"1",max:String(entry.qty-1),value:String(Math.min(entry.qty-1,10)),style:{width:"70px"}});
      root.appendChild(h("div",{class:"panel",style:{marginBottom:"14px"}},[
        h("div",{style:{marginBottom:"6px"}},[`Withdraw how many of ${name} (have ${entry.qty} stashed)? You can also just withdraw the whole stack from the grid above.`]),
        h("div",{class:"row gap",style:{alignItems:"center"}},[
          qtyInput,
          h("button",{onClick:()=>{
            const qty=parseInt(qtyInput.value,10);
            if(!qty||qty<=0||qty>=entry.qty){ setToast(`Enter a quantity between 1 and ${entry.qty-1} (use the grid above to withdraw the entire stack).`); render(); return; }
            GF._vaultSplitSlot=null;
            vaultWithdrawPartial(entry.slot,qty);
          }},["Withdraw"]),
          h("button",{onClick:()=>{ GF._vaultSplitSlot=null; render(); }},["Cancel"]),
          h("button",{onClick:()=>{ GF._vaultSplitSlot=null; askConfirm(`Withdraw all ${entry.qty} ${name} back to your backpack?`,()=>vaultWithdraw(entry.slot),{confirmLabel:"Withdraw All",danger:false}); }},["Withdraw All"]),
        ]),
      ]));
    }
  }

  root.appendChild(h("h3",{},["Deposit from Backpack"]));
  if(PS.gear_instances.length===0) root.appendChild(h("div",{class:"muted"},["Nothing in your backpack to store."]));
  for(const inst of [...PS.gear_instances]){
    root.appendChild(gearRow(inst,[h("button",{onClick:()=>vaultDepositGear(inst.instance_id)},["Store"])]));
  }

  root.appendChild(h("h3",{},["Deposit Consumables"]));
  const consEntries=Object.keys(PS.consumables).filter(k=>PS.consumables[k]>0);
  if(consEntries.length===0) root.appendChild(h("div",{class:"muted"},["None."]));
  for(const itemId of consEntries){
    root.appendChild(h("div",{class:"row gap",style:{marginBottom:"4px",alignItems:"center",justifyContent:"space-between"}},[
      h("div",{class:"row gap",style:{alignItems:"center"}},[itemIcon(itemId,22), `${DL.getItem(itemId).name} x${PS.consumables[itemId]}`]),
      h("button",{onClick:()=>vaultDepositConsumable(itemId)},["Store"]),
    ]));
  }

  root.appendChild(h("h3",{},["Deposit Herbs"]));
  const herbEntries=Object.keys(PS.herbs).filter(k=>PS.herbs[k]>0);
  if(herbEntries.length===0) root.appendChild(h("div",{class:"muted"},["None."]));
  for(const herbId of herbEntries){
    root.appendChild(h("div",{class:"row gap",style:{marginBottom:"4px",alignItems:"center",justifyContent:"space-between"}},[
      h("div",{class:"row gap",style:{alignItems:"center"}},[herbIcon(herbId,22), `${DL.getHerb(herbId).name} x${PS.herbs[herbId]}`]),
      h("button",{onClick:()=>vaultDepositHerb(herbId)},["Store"]),
    ]));
  }

  return root;
}

/* ================= MERCHANT ================= */

// v0.17 (#28): 6 randomly-rolled gear items, tier 1-5 (uniform) and rarity via the SAME
// Balance.rollRarity() odds every maze drop uses (IF.generate() with no forcedRarityName
// argument) -- see Balance.MERCHANT_PRICE_BANDS's comment for why that matters.
function generateMerchantStock(){
  const stock=[];
  for(let i=0;i<Balance.MERCHANT_STOCK_SIZE;i++){
    stock.push(IF.generate(randIntRange(1,Balance.ITEM_TIER_MAX)));
  }
  return stock;
}

// Regenerates the stock when: this is the first time it's been requested this session,
// the active character has changed (GF is a shared singleton across character switches,
// same reused-singleton concern as PS elsewhere in this file), or the character has
// resolved a Broken Bridge Trial attempt since the stock was last rolled (tracked via
// PS.trial_attempts_count, see resolveMasterTrial()) -- exactly "stays fixed until the
// player has attempted at least one trial, pass or fail" per Gwen's spec.
function ensureMerchantStock(){
  if(!GF.merchantStock || GF._merchantStockSlot!==PS.current_slot || GF._merchantStockAttempts!==PS.trial_attempts_count){
    GF.merchantStock=generateMerchantStock();
    GF._merchantStockSlot=PS.current_slot;
    GF._merchantStockAttempts=PS.trial_attempts_count;
  }
  return GF.merchantStock;
}

// v0.18.1 (#9): shared tab-button helper, mirrors leaderboardTabButton()/GF.leaderboardTab
// exactly (same selected-state styling, same click-to-select-and-render pattern).
function merchantTabButton(key,label){
  const selected=GF.merchantTab===key;
  return h("button",{
    style:{background:selected?"var(--accent,#3a6a2a)":undefined,borderColor:selected?"#7ac67a":undefined},
    onClick:()=>{ GF.merchantTab=key; render(); },
  },[label]);
}
// v0.18.1 (#7): a horizontal "- N +" amount-picker for buying several potions/consumables
// in one click, mirroring the vertical Area-Lv chevron stepper on the Town's Venture card
// (same -1/+1-per-click, clamped-range pattern, just laid out as a row instead of a column
// since there's no "current value" label needed here beyond the number itself). State lives
// in GF.merchantBuyQty, keyed by itemId, so each row remembers its own picked amount
// independently and it survives re-renders within the session (not persisted -- there's no
// reason a chosen-but-not-yet-bought quantity needs to survive a reload).
function merchantAmountPicker(itemId,maxQty){
  if(!GF.merchantBuyQty) GF.merchantBuyQty={};
  const qty=clampi(GF.merchantBuyQty[itemId]||1,1,Math.max(1,maxQty));
  GF.merchantBuyQty[itemId]=qty;
  return h("div",{class:"row",style:{alignItems:"center",gap:"6px"}},[
    h("button",{style:{padding:"2px 9px"},disabled:qty<=1,onClick:(e)=>{ e.stopPropagation(); GF.merchantBuyQty[itemId]=Math.max(1,qty-1); render(); }},["-"]),
    h("span",{style:{fontWeight:"bold",minWidth:"18px",textAlign:"center"}},[String(qty)]),
    h("button",{style:{padding:"2px 9px"},disabled:qty>=maxQty,onClick:(e)=>{ e.stopPropagation(); GF.merchantBuyQty[itemId]=Math.min(maxQty,qty+1); render(); }},["+"]),
  ]);
}

// v0.18.1 (#7): the Merchant's "Consumables" tab (was the old ungrouped "Buy" grid) --
// switched from a 3-col icon grid to a single-column list (mirrors gearRow()'s layout) so
// there's room for a subtext line, a right-aligned gold-colored price, and the new amount
// picker all on one row.
function merchantConsumablesTab(){
  const root=h("div",{});
  for(const itemId in ITEMS){
    const item=ITEMS[itemId];
    if(item.type==="bag" || Balance.MERCHANT_EXCLUDED_ITEMS.includes(itemId)) continue;
    const unitPrice=Balance.itemBuyPrice(item);
    const maxAffordable=unitPrice>0?Math.max(1,Math.floor(PS.gold/unitPrice)):99;
    const qty=Math.min(GF.merchantBuyQty&&GF.merchantBuyQty[itemId]||1,Math.max(1,maxAffordable));
    const totalPrice=unitPrice*qty;
    root.appendChild(h("div",{class:"tile gear-row",style:{marginBottom:"6px"}},[
      itemIcon(itemId),
      h("div",{class:"col",style:{flex:"1",minWidth:"0",gap:"2px"}},[
        h("div",{style:{fontWeight:"bold"}},[item.name]),
        h("div",{class:"muted",style:{fontSize:".85em"}},[DL.itemShopSubtext(itemId)]),
      ]),
      merchantAmountPicker(itemId,99),
      // v0.18.1 (#10): gold-colored, right-aligned, sits right next to the Buy button.
      h("div",{class:"gold-text",style:{fontWeight:"bold",minWidth:"64px",textAlign:"right"}},[`${totalPrice}g`]),
      // v0.18 (#12): the old "Bought X." toast banner popped in above the whole screen and
      // shifted the list on every purchase -- replaced with a brief gold-colored "-Ng"
      // floating overlay near the HP bar (same spawnFloat() infra as combat's gold pickups),
      // so nothing on this screen ever moves just from buying potions.
      h("button",{disabled:PS.gold<totalPrice,onClick:()=>{
        if(PS.buyConsumable(itemId,qty)){ autosave(); spawnFloat("player",`-${totalPrice}g`,"float-text-gold"); }
        render();
      }},["Buy"]),
    ]));
  }
  return root;
}

// v0.18.1 (#9): the Merchant's "Equippable gear" tab (was "Gear for Sale") -- unchanged
// gearRow()-based layout, just moved under its own tab and reordered per Gwen's spec.
// Pricing now also folds in the v0.18.1 (#11) rarity-based discount, see
// Balance.merchantGearPrice()'s own comment.
function merchantGearTab(){
  const root=h("div",{});
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px",fontSize:".9em"}},["Six items, freshly rolled. This stock won't change until you've attempted a Broken Bridge Trial (win or lose)."]));
  const stock=ensureMerchantStock();
  if(stock.length===0){
    root.appendChild(h("div",{class:"muted",style:{marginBottom:"12px"}},["Sold out for now -- come back after your next Broken Bridge Trial attempt."]));
    return root;
  }
  for(const inst of stock){
    const price=Balance.merchantGearPrice(inst);
    root.appendChild(gearRow(inst,[h("button",{disabled:PS.gold<price,onClick:()=>{
      PS.gold-=price;
      const willAutoEquip=PS.canAutoEquip(inst);
      const fit=PS.addGearAutoEquip(inst);
      if(!fit){ PS.gold+=price; setToast("Your bags are full -- make room and try again."); render(); return; }
      const idx=GF.merchantStock.indexOf(inst); if(idx!==-1) GF.merchantStock.splice(idx,1);
      autosave();
      setToast(willAutoEquip?`Bought and equipped ${IF.displayName(inst)}!`:`Bought ${IF.displayName(inst)}.`);
      render();
    }},[`Buy (${price}g)`])]));
  }
  return root;
}

// v0.18.1 (#9): the Merchant's "Containers" tab (was "Buy Bags") -- same list-view/gold-
// price treatment as Consumables, minus the amount picker (bags are equip-slot-limited, so
// buying several in one click isn't a meaningful use case the way potion stacks are).
function merchantContainersTab(){
  const root=h("div",{});
  for(const itemId in ITEMS){
    const item=ITEMS[itemId]; if(item.type!=="bag") continue;

function screenAuctionHouse(){
  const root=h("div",{});
  root.appendChild(h("h2",{},["Auction House"]));
  root.appendChild(h("div",{class:"lore"},["A dusty ledger and an idle gavel. List your own finds, or see what other travelers are selling."]));
  // v0.16: Back moved up here instead of below the whole listings feed.
  root.appendChild(h("button",{style:{marginBottom:"8px"},onClick:()=>GF.goto("town")},["← Back to Town"]));
  const t=toastBox(); if(t) root.appendChild(t);
  root.appendChild(statHeader());

  if(!Net.online){
    root.appendChild(h("div",{class:"muted"},["Log in online to buy and sell with other travelers."]));
    return root;
  }

  root.appendChild(h("h3",{},["List an Item"]));
  // v0.16: an upfront listing fee (server-charged, see auctionListingFee() in
  // evergrind-server/server.js) discourages spamming the block with junk listings --
  // 1g per 100g bracket of the asking price.
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px",fontSize:".9em"}},["Listing fee: 1g for a 1-99g price, 2g for 100-199g, 3g for 200-299g, and so on -- charged upfront when you list."]));
  const gearOptions=[h("option",{value:""},["-- choose gear to sell --"])].concat(
    PS.gear_instances.map(inst=>h("option",{value:inst.instance_id,selected:GF._auctionSellPreviewId===inst.instance_id},[`${IF.displayName(inst)} (${tierRomanNumeral(inst.tier)})`]))
  );
  // v0.17.1 (#9): a native <select> can only ever show plain text per option, so it used
  // to be impossible to see an item's actual rolled stats before choosing a price for it --
  // you had to already know (or go check Character Sheet) what you were selling. Selecting
  // an option now also renders a full gearRow() preview below (same icon/tooltip/affix
  // summary as the Vault and Character Sheet use), so the real stats are right there.
  const gearSelect=h("select",{onChange:(e)=>{ GF._auctionSellPreviewId=e.target?e.target.value:gearSelect.value; render(); }},gearOptions);
  const gearPriceInput=h("input",{type:"number",min:"1",value:"10",style:{width:"90px"}});
  root.appendChild(h("div",{class:"row gap",style:{marginBottom:"10px"}},[
    gearSelect, h("span",{},["Price:"]), gearPriceInput,
    h("button",{onClick:async ()=>{
      const instId=gearSelect.value;
      if(!instId){ setToast("Choose a gear item first."); render(); return; }
      const price=parseInt(gearPriceInput.value,10);
      if(!price||price<1){ setToast("Enter a valid price."); render(); return; }
      const fee=Balance.auctionListingFee(price);
      if(PS.gold<fee){ setToast(`Not enough gold for the ${fee}g listing fee.`); render(); return; }
      const idx=PS.findGearIndex(instId); if(idx===-1) return;
      const inst=PS.gear_instances[idx];
      try{
        const result=await Net.createAuctionListing({type:"gear", price, character_name:PS.character_name, seller_slot:PS.current_slot, item:inst, display_name:IF.displayName(inst)});
        PS.gear_instances.splice(idx,1);
        // v0.16: the server is the actual authority on the fee (see server.js) and already
        // deducted it -- mirror that locally so the very next autosave doesn't stomp the
        // server's write with a stale higher gold figure. v0.17 (#29): gold is account-bound
        // now, so prefer the server's own authoritative post-fee total (result.account_gold)
        // over a locally-computed subtraction when it's available -- it can't drift.
        if(typeof result.account_gold==="number") PS.gold=result.account_gold; else PS.gold-=(result.fee||fee);
        PS.saveGame();
        Net.auctionCache=null; setToast(`Listed ${IF.displayName(inst)} for ${price} gold (${result.fee||fee}g listing fee charged).`);
      }catch(e){ setToast(e.message); }
      render();
    }},["List Gear"]),
  ]));
  // v0.17.1 (#9): live preview of whichever gear item is currently picked in the dropdown
  // above -- full icon/rarity/category/affix breakdown, exactly like Vault/Character Sheet.
  if(GF._auctionSellPreviewId){
    const previewInst=PS.gear_instances.find(g=>g.instance_id===GF._auctionSellPreviewId);
    if(previewInst) root.appendChild(gearRow(previewInst,[]));
  }

  const stackables=[];
  for(const id of Object.keys(PS.consumables)) if(PS.consumables[id]>0) stackables.push({kind:"consumable", id, name:DL.getItem(id).name, have:PS.consumables[id]});
  for(const id of Object.keys(PS.herbs)) if(PS.herbs[id]>0) stackables.push({kind:"herb", id, name:DL.getHerb(id).name, have:PS.herbs[id]});
  const stackOptions=[h("option",{value:""},["-- choose consumable/herb to sell --"])].concat(
    stackables.map(s=>h("option",{value:s.kind+":"+s.id},[`${s.name} (have ${s.have})`]))
  );
  const stackSelect=h("select",{},stackOptions);
  const stackQtyInput=h("input",{type:"number",min:"1",value:"1",style:{width:"70px"}});
  const stackPriceInput=h("input",{type:"number",min:"1",value:"5",style:{width:"90px"}});
  root.appendChild(h("div",{class:"row gap",style:{marginBottom:"14px"}},[
    stackSelect, h("span",{},["Qty:"]), stackQtyInput, h("span",{},["Price (total):"]), stackPriceInput,
    h("button",{onClick:async ()=>{
      const val=stackSelect.value; if(!val){ setToast("Choose an item first."); render(); return; }
      const [kind,id]=val.split(":");
      const qty=parseInt(stackQtyInput.value,10), price=parseInt(stackPriceInput.value,10);
      const have=(kind==="consumable"?PS.consumables[id]:PS.herbs[id])||0;
      if(!qty||qty<1||qty>have){ setToast("Enter a valid quantity you actually have."); render(); return; }
      if(!price||price<1){ setToast("Enter a valid price."); render(); return; }
      const fee=Balance.auctionListingFee(price);
      if(PS.gold<fee){ setToast(`Not enough gold for the ${fee}g listing fee.`); render(); return; }
      const displayName=kind==="consumable"?DL.getItem(id).name:DL.getHerb(id).name;
      try{
        const result=await Net.createAuctionListing({type:kind, item_key:id, quantity:qty, price, character_name:PS.character_name, seller_slot:PS.current_slot, display_name:displayName});
        if(kind==="consumable") PS.consumables[id]-=qty; else PS.herbs[id]-=qty;
        // v0.17 (#29): prefer the server's authoritative post-fee account gold when present.
        if(typeof result.account_gold==="number") PS.gold=result.account_gold; else PS.gold-=(result.fee||fee);
        PS.saveGame(); Net.auctionCache=null;
        setToast(`Listed ${displayName} x${qty} for ${price} gold (${result.fee||fee}g listing fee charged).`);
      }catch(e){ setToast(e.message); }
      render();
    }},["List"]),
  ]));

  root.appendChild(h("h3",{},["Current Listings"]));
  // v0.17.3 (#11): same Tier/Item Type/Stat filter as the Storage Vault -- see
  // gearFilterPanel()'s comment block. GF._ahFilter persists for the session.
  if(!GF._ahFilter) GF._ahFilter={tier:"",slot:"",stats:[]};
  root.appendChild(gearFilterPanel(GF._ahFilter, render));
  if(Net.auctionCache===null||Net.auctionCache===undefined){
    root.appendChild(h("div",{class:"muted"},["Loading..."]));
    Net.fetchAuction().then(render).catch(()=>{ setToast("Could not load the auction house."); render(); });
  } else if(Net.auctionCache.length===0){
    root.appendChild(h("div",{class:"muted"},["The block is empty right now, be the first to list something."]));
  } else {
    // v0.18.1 (#32): unlike the Storage Vault's filter (which only visually MUTES
    // non-matching gear, see gearFilterOpacity()'s comment), Gwen asked for the Auction
    // House's filter to actually HIDE anything that doesn't match, with an explicit
    // empty-result message when the active filter leaves nothing to show -- a shared
    // marketplace listing feed benefits from cutting the noise outright, where the
    // Vault's own inventory benefits more from a "still there, just muted" contrast (you
    // might still want to see/reach an item you own even if it doesn't match).
    const visibleListings=Net.auctionCache.filter(listing=>{
      const isGear=listing.type==="gear" && listing.item;
      return !gearFilterActive(GF._ahFilter) || gearMatchesFilter(isGear?listing.item:null, GF._ahFilter);
    });
    if(visibleListings.length===0){
      root.appendChild(h("div",{class:"muted"},["No listings match your filters."]));
    }
    for(const listing of visibleListings){
      const isMine=listing.seller_username===Net.username;
      const label=listing.quantity>1?`${listing.display_name} x${listing.quantity}`:listing.display_name;
      // v0.13: gear listings get the same hover tooltip (full stat breakdown) the
      // Character Sheet already shows, so buyers can inspect an item before spending gold.
      const isGear=listing.type==="gear" && listing.item;
      // v0.17.3 (#10): gear listings also get the Comparison box against whatever the buyer
      // has equipped in that slot -- see gearCompareWrap()'s comment.
      const labelEl=isGear
        ? gearCompareWrap(h("span",{class:"tooltip rarity-"+listing.item.rarity,style:{fontWeight:"bold"},"data-tip":IF.tooltipText(listing.item)},[label]), listing.item)
        : h("span",{style:{fontWeight:"bold"}},[label]);
      // v0.14: a plain-language category subtext (Herb/Ring/Potion/etc.) on every listing,
      // same reasoning as the gear/consumable rows elsewhere -- buyers browsing the block
      // shouldn't have to guess what a flavorful item name actually is.
      const categoryLabel=isGear?IF.categoryLabel(listing.item):(listing.type==="herb"?"Herb":DL.itemCategoryLabel(listing.item_key));
      root.appendChild(h("div",{class:"tile row",style:{marginBottom:"6px",justifyContent:"space-between"}},[
        h("div",{},[labelEl, categoryLabel?h("span",{class:"muted",style:{fontSize:".85em"}},[` (${categoryLabel})`]):null, h("span",{class:"muted"},[`, listed by ${listing.seller_character_name} (${listing.seller_username})`])]),
        h("div",{class:"row gap"},[
          h("span",{class:"gold-text"},[`${listing.price}g`]),
          isMine?h("button",{class:"danger",onClick:async ()=>{
            try{
              const r=await Net.cancelAuctionListing(listing.id,{character_name:PS.character_name});
              if(r.refund){
                if(r.refund.type==="gear" && r.refund.item) PS.addGear(r.refund.item);
                else if(r.refund.type==="consumable") PS.addConsumable(r.refund.item_key,r.refund.quantity);
                else if(r.refund.type==="herb") PS.addHerb(r.refund.item_key,r.refund.quantity);
                PS.saveGame();
              }
              setToast("Listing cancelled, item returned to your bags.");
            }
            catch(e){ setToast(e.message+" (refreshing listings...)"); }
            Net.auctionCache=null;
            await Net.fetchAuction();
            render();
          }},["Cancel"]):h("button",{disabled:PS.gold<listing.price,onClick:async ()=>{
            try{
              const buyResult=await Net.buyAuctionListing(listing.id,{character_name:PS.character_name, buyer_slot:PS.current_slot});
              // v0.17 (#29): prefer the server's authoritative post-purchase account gold when present.
              if(typeof buyResult.account_gold==="number") PS.gold=buyResult.account_gold; else PS.gold-=listing.price;
              // v0.15: auto-equip an Auction House purchase if the matching slot is empty.
              if(listing.type==="gear") PS.addGearAutoEquip(listing.item);
              else if(listing.type==="consumable") PS.addConsumable(listing.item_key,listing.quantity);
              else if(listing.type==="herb") PS.addHerb(listing.item_key,listing.quantity);
              PS.saveGame();
              setToast(`Bought ${label} for ${listing.price} gold.`);
            }catch(e){ setToast(e.message+" (refreshing listings...)"); }
            Net.auctionCache=null;
            await Net.fetchAuction();
            render();
          }},["Buy"]),
        ]),
      ]));
    }
  }

  return root;
}

/* ================= MASTER TRIAL ================= */

function getTrialProgress(){
  if(!PS.trial_progress) PS.trial_progress={};
  if(!PS.trial_progress[PS.class_id]) PS.trial_progress[PS.class_id]={stage:0,discoveredSides:[],stepFailedPlanks:{}};
  const p=PS.trial_progress[PS.class_id];
  if(!p.discoveredSides) p.discoveredSides=[];
  // v0.13: per-step memory of which planks have already been tried and failed AT THE
  // CURRENT (not-yet-solved) step, keyed by step index. Never reset by a failed attempt --
  // that's the whole point, "the bridge remembers every faulty plank you've already
  // found" now applies mid-step too, not just to fully-solved steps. See attemptStep()
  // in screenMasterTrial() for how this guarantees a step is solved within plankCount
  // attempts (the last untried plank is always the safe one).
  if(!p.stepFailedPlanks) p.stepFailedPlanks={};
  return p;
}

function screenMasterTrial(){
  const root=h("div",{});
  const c=PS.getClassData();
  const nextId=DL.getNextClassId(PS.class_id);
  const currentTier=c.tier||1;
  root.appendChild(h("h2",{},["Broken Bridge Trial"]));
  if(!nextId){
    root.appendChild(h("div",{class:"lore"},[`${c.display_name} is the final form of your path. The elders have no further plank bridge to offer, whatever comes next for a champion of the season is still being prepared. Not yet implemented, check back in a future update.`]));
    root.appendChild(h("button",{onClick:()=>GF.goto("town")},["← Back to Town"]));
    return root;
  }
  const levelReq=Balance.trialLevelRequirement(currentTier);
  // A failed attempt resets the player to level 1, which would normally fall back below
  // the level gate below, but the failed board must stay visible until the player
  // acknowledges it and leaves, so the gate is skipped for that one render.
  if(!PS.canAttemptTrial() && !GF.trialJustFailed){
    root.appendChild(h("div",{class:"lore"},[`You must reach Level ${levelReq} as a ${c.display_name} before the elders will test you.`]));
    root.appendChild(h("button",{onClick:()=>GF.goto("town")},["← Back to Town"]));
    return root;
  }
  const t=toastBox(); if(t) root.appendChild(t);
  const plankCount=Balance.bridgePlankCount(currentTier);
  root.appendChild(h("div",{class:"lore"},[`Cross the ancient plank bridge to prove yourself worthy of becoming a ${DL.getClass(nextId).display_name}. Each step hides ${plankCount} planks, only one holds. Fall, and the attempt ends there, but the bridge remembers every safe step you've already found.`]));

  const rows=Balance.BRIDGE_ROWS;
  const stepChance=Balance.bridgeStepPassChance(currentTier);
  const progress=getTrialProgress();
  const failed=!!GF.trialJustFailed;

  root.appendChild(h("div",{class:"panel",style:{marginBottom:"10px"}},[
    h("div",{class:"flavor",style:{margin:"0"}},["Tread carefully, a wrong step is a costly investment."]),
  ]));

  // v0.18.1 (#4): players (especially Hardcore ones, understandably) keep asking whether a
  // failed Broken Bridge Trial attempt can kill their character -- it can't, by design: a
  // fall only demotes you to Level 1 at this tier (see the reroll logic in resolveMasterTrial
  // below), it never touches PS.current_hp or routes through the death/Graveyard flow the way
  // a maze/combat death does. Surface that explicitly right where the decision to attempt (or
  // retreat from) the trial gets made, called out most prominently for Hardcore characters
  // since that's who actually worries about it, but the same fact holds for everyone.
  root.appendChild(h("div",{class:"panel",style:{marginBottom:"10px",borderColor:PS.hardcore?"#5ac67a":"var(--border)"}},[
    h("div",{style:{color:"#5ac67a",fontWeight:"bold",marginBottom:PS.hardcore?"4px":"0"}},["✔ This trial cannot kill your character."]),
    PS.hardcore?h("div",{class:"muted",style:{fontSize:".9em"}},["Even in Hardcore mode, falling from the bridge only resets you to Level 1 at this tier -- it does not send you to the Graveyard."]):null,
  ]));

  // v0.17.3 (#3): tell the player up front that failing isn't pure loss -- every fall
  // permanently banks +1 starting stat point for their next Level 1 at this tier (reset
  // once they finally cross), so the info is visible right where the decision to keep
  // trying (or retreat) actually gets made.
  const failStreak=PS.bridge_fail_streak||0;
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"10px"}},[
    `A new attempt at this tier starts with ${Balance.STARTING_STAT_POINTS} unspent stat points. Every failed attempt permanently adds +1 more (currently +${failStreak}, for ${Balance.STARTING_STAT_POINTS+failStreak} total) until you successfully cross.`,
  ]));

  function attemptStep(plankIndex){
    if(failed) return;
    const stepIdx=progress.discoveredSides.length;
    const failedHere=progress.stepFailedPlanks[stepIdx]||[];
    if(failedHere.includes(plankIndex)) return; // already known-bad, shouldn't be clickable anyway
    // v0.13: once every OTHER plank at this step has already failed, the last remaining
    // one is guaranteed safe -- "the bridge remembers the faulty plank", so this can never
    // regress into an unwinnable step. Otherwise it's a plain 1-in-remaining roll.
    const remaining=plankCount-failedHere.length;
    const passed=remaining<=1 ? true : Math.random()<(1/remaining);
    if(passed){
      progress.discoveredSides.push(plankIndex);
      // v0.15 BUG FIX: this used to `delete progress.stepFailedPlanks[stepIdx]` right here,
      // wiping out the record of every plank that broke at this step the moment you passed
      // it -- so the bridge view only ever showed the single green (safe) plank for a
      // completed step, never the red ones you'd already learned were bad. Gwen's report:
      // "would it be possible to also keep the red plank in view". Keeping this entry
      // around (instead of deleting it) means the render loop below, which reads
      // progress.stepFailedPlanks[i] for every step including completed ones, keeps
      // showing the full red-and-green history of that step permanently -- exactly the
      // "overview of where and how many times they failed" Gwen asked for.
      // v0.17.3 (#12) HOTFIX: the crossing-complete branch below calls resolveMasterTrial()
      // right after this, which resets last_bridge_steps to 0 -- saving HERE too (before
      // that reset) used to fire two autosave() calls back to back on the exact step that
      // completes a crossing, one still carrying the stale pre-reset last_bridge_steps.
      // Two saves racing on the network could land out of order and let the stale one win,
      // which is exactly the "shows old tier's step count right after promoting" bug Gwen
      // reported. Skip this intermediate save on the crossing-completing step -- the single
      // save inside the block below (with the reset already applied) covers it.
      if(progress.discoveredSides.length<rows) autosave();
      if(progress.discoveredSides.length>=rows){
        const nameBefore=c.display_name, levelBefore=PS.level;
        const result=PS.resolveMasterTrial(true);
        PS.trial_progress[PS.class_id]={stage:0,discoveredSides:[],stepFailedPlanks:{}};
        autosave();
        Net.announceTrialResult({character_name:PS.character_name, level:levelBefore, class_name:nameBefore, result:"passed", new_class_name:DL.getClass(PS.class_id).display_name});
        setToast(result.final_tier?`You have mastered the ${c.chain} path completely!`:`You are promoted to ${DL.getClass(PS.class_id).display_name}!`);
        GF.ventureDepth=1; GF.goto("town"); return;
      }
      render();
    } else {
      failedHere.push(plankIndex);
      progress.stepFailedPlanks[stepIdx]=failedHere;
      GF.trialJustFailed=true; GF.trialFailedPlankIndex=plankIndex; GF.trialFailedStepIndex=stepIdx;
      // v0.17 (#1): stepIdx is exactly "how many steps you'd already gotten past when this
      // one broke", i.e. the leaderboard's "Successful bridge step count" -- e.g. failing on
      // step 4 (0-indexed stepIdx=3) means 3 completed steps. Only updated here (on failure),
      // see the field's declaration above for why.
      PS.last_bridge_steps=stepIdx;
      setToast("The plank gives way beneath you! The attempt ends here, but you'll remember this plank next time.");
      Net.announceTrialResult({character_name:PS.character_name, level:PS.level, class_name:c.display_name, result:"failed", failed_step:stepIdx+1});
      PS.resolveMasterTrial(false);
      autosave();
      render();
    }
  }

  // Horizontal layout: the bridge crosses left-to-right, one column per step, each
  // column stacking that step's planks vertically (2 to 5 of them depending on tier).
  const plankCols=h("div",{class:"row gap",style:{overflowX:"auto",paddingBottom:"6px"}});
  for(let i=0;i<rows;i++){
    const discoveredPlank=progress.discoveredSides[i];
    const isCurrent=i===progress.discoveredSides.length && !failed;
    // v0.13: show EVERY plank already tried-and-failed at the current step as red/known-
    // bad, not just the most recent one -- this is the persistent memory the player is
    // relying on to narrow down (and eventually guarantee) the safe plank.
    const knownFailedHere=progress.stepFailedPlanks[i]||[];
    const col=h("div",{class:"col gap",style:{alignItems:"center"}});
    for(let p=0;p<plankCount;p++){
      const isSafe=discoveredPlank===p;
      const isUnsafe=knownFailedHere.includes(p);
      col.appendChild(h("button",{class:"plank-btn"+(isSafe?" safe":(isUnsafe?" unsafe":"")),
        disabled:!isCurrent || isUnsafe,
        title:isUnsafe?"You already know this plank breaks.":"",
        onClick:()=>attemptStep(p)},[inlineIcon(FOOTSTEP_SVG,16)]));
    }
    plankCols.appendChild(col);
  }
  root.appendChild(plankCols);

  root.appendChild(h("div",{class:"row",style:{marginTop:"10px"}},[
    h("button",{onClick:()=>{ GF.trialJustFailed=false; GF.trialFailedPlankIndex=null; if(failed) GF.ventureDepth=1; GF.goto("town"); }},[failed?"Return to Town":"← Retreat to Town"]),
  ]));
  return root;
}

/* ================= ADMIN PANEL ================= */

function screenAdminPanel(){
  const root=h("div",{});
  root.appendChild(h("h2",{},["Dev Tools"]));
  if(!GF.admin_unlocked){
    root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px"}},[
      "Dev Tools is gated by the server's real admin token (the ADMIN_TOKEN environment variable set on the server), there's no password stored in this page.",
    ]));
    const tokenInput=h("input",{type:"password",placeholder:"Admin token"});
    root.appendChild(h("div",{class:"row gap"},[tokenInput,
      h("button",{onClick:async ()=>{
        const value=tokenInput.value||"";
        let ok=false;
        try{ ok=await Net.verifyAdminToken(value); }catch(e){ ok=false; }
        if(ok){ GF.admin_unlocked=true; GF.admin_token=value; } else setToast("Invalid admin token.");
        render();
      }},["Unlock"]),
    ]));
    const t=toastBox(); if(t) root.appendChild(t);
    root.appendChild(h("button",{style:{marginTop:"12px"},onClick:()=>GF.goto("town")},["← Back to Town"]));
    return root;
  }
  root.appendChild(h("div",{class:"muted"},["For local testing only, affects the currently loaded character."]));
  root.appendChild(h("div",{class:"row",style:{marginTop:"10px",flexWrap:"wrap"}},[
    h("button",{onClick:()=>{PS.gold+=500;PS.saveGame();render();}},["+500 gold"]),
    h("button",{onClick:()=>{PS.materials+=200;PS.saveGame();render();}},["+200 materials"]),
    h("button",{onClick:()=>{for(let i=0;i<10;i++)PS.addXp(PS.xp_to_next);PS.saveGame();render();}},["+10 levels"]),
    h("button",{onClick:()=>{PS.level=Balance.LEVEL_CAP;PS.xp=0;PS.xp_to_next=Balance.xpRequiredForLevel(PS.level);PS.current_hp=PS.getMaxHp();PS.saveGame();render();}},["Set level to cap"]),
    h("button",{onClick:()=>{PS.addGear(IF.generate(Balance.itemTierForAreaLevel(PS.level)));PS.saveGame();render();}},["Spawn random gear"]),
    h("button",{class:"danger",onClick:()=>{ askConfirm("Wipe this save?",()=>{ if(PS.current_slot>=0) deleteSave(PS.current_slot); GF.goto("mainMenuSlots"); },{confirmLabel:"Wipe it"}); }},["Wipe this save"]),
  ]));

  root.appendChild(h("h3",{style:{marginTop:"18px"}},["Leaderboard Moderation"]));
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px"}},[
    "Remove buggy or clearly-cheated entries from the shared leaderboard, using the same admin token you unlocked Dev Tools with.",
  ]));
  root.appendChild(h("div",{class:"row gap",style:{marginBottom:"8px"}},[
    h("button",{onClick:async ()=>{
      GF.admin_leaderboard_error="";
      try{
        GF.admin_leaderboard_cache=await Net.fetchAdminLeaderboard(GF.admin_token||"");
      }catch(e){
        GF.admin_leaderboard_error=e.message||"Could not load the leaderboard.";
        GF.admin_leaderboard_cache=null;
      }
      render();
    }},["Load Full Leaderboard"]),
  ]));
  if(GF.admin_leaderboard_error) root.appendChild(h("div",{class:"muted",style:{color:"#e07a7a",marginBottom:"8px"}},[GF.admin_leaderboard_error]));
  if(GF.admin_leaderboard_cache){
    if(GF.admin_leaderboard_cache.length===0){
      root.appendChild(h("div",{class:"muted"},["No leaderboard entries."]));
    } else {
      for(const entry of GF.admin_leaderboard_cache){
        root.appendChild(h("div",{class:"tile row",style:{justifyContent:"space-between",alignItems:"center",marginBottom:"6px",gap:"10px"}},[
          h("div",{},[
            h("div",{},[
              h("span",{style:{fontWeight:"bold"}},[entry.character_name]),
              h("span",{class:"muted"},[` (${entry.player}, acct #${entry.account_id})`]),
              entry.hardcore?h("span",{style:{color:"#e0b23d",fontWeight:"bold"}},[" [Hardcore]"]):null,
              entry.is_dead?h("span",{style:{color:"#e0b23d",fontWeight:"bold"}},[" [Dead]"]):null,
            ]),
            h("div",{class:"muted"},[`Lv ${entry.level} ${entry.class_name} (${tierRomanNumeral(entry.highest_tier_reached)}), ${entry.lifetime_xp} Experience, ${entry.gold} Gold, updated ${new Date(entry.updated_at).toLocaleString()}`]),
          ]),
          h("button",{class:"danger",onClick:()=>{
            askConfirm(`Remove "${entry.character_name}" (${entry.player}) from the leaderboard? This cannot be undone.`,async ()=>{
              try{
                await Net.adminDeleteLeaderboardEntry(entry.account_id,entry.character_name,GF.admin_token||"");
                GF.admin_leaderboard_cache=GF.admin_leaderboard_cache.filter(x=>!(x.account_id===entry.account_id && x.character_name===entry.character_name));
              }catch(err){
                GF.admin_leaderboard_error=err.message||"Could not delete that entry.";
              }
              render();
            },{confirmLabel:"Delete"});
          }},["Delete"]),
        ]));
      }
    }
  }

  root.appendChild(h("h3",{style:{marginTop:"18px"}},["Account List"]));
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px"}},[
    "Every registered account, read-only -- when it was created, its optional email, and when it was last active (the most recent autosave across any of its character slots).",
  ]));
  root.appendChild(h("div",{class:"row gap",style:{marginBottom:"8px"}},[
    h("button",{onClick:async ()=>{
      GF.admin_accounts_error="";
      try{
        GF.admin_accounts_cache=await Net.fetchAdminAccounts(GF.admin_token||"");
      }catch(e){
        GF.admin_accounts_error=e.message||"Could not load the account list.";
        GF.admin_accounts_cache=null;
      }
      render();
    }},["Load Accounts"]),
  ]));
  if(GF.admin_accounts_error) root.appendChild(h("div",{class:"muted",style:{color:"#e07a7a",marginBottom:"8px"}},[GF.admin_accounts_error]));
  if(GF.admin_accounts_cache){
    if(GF.admin_accounts_cache.length===0){
      root.appendChild(h("div",{class:"muted"},["No accounts."]));
    } else {
      for(const acc of GF.admin_accounts_cache){
        root.appendChild(h("div",{class:"tile row",style:{justifyContent:"space-between",alignItems:"center",marginBottom:"6px",gap:"10px"}},[
          h("div",{},[
            h("div",{},[
              h("span",{style:{fontWeight:"bold"}},[acc.username]),
              h("span",{class:"muted"},[` (acct #${acc.account_id})`]),
            ]),
            h("div",{class:"muted"},[acc.email?acc.email:"No email on file"]),
          ]),
          h("div",{style:{textAlign:"right"}},[
            h("div",{class:"muted"},[`Created ${new Date(acc.created_at).toLocaleDateString()}`]),
            h("div",{class:"muted",style:{fontSize:".85em",marginTop:"2px"}},[`Last active: ${formatLastSeen(acc.last_active_at)}`]),
          ]),
        ]));
      }
    }
  }

  root.appendChild(h("button",{style:{marginTop:"12px"},onClick:()=>GF.goto("town")},["← Back to Town"]));
  return root;
}

/* ================= ITEMIZATION GUIDE (v0.14) =================
   Player-facing reference page for the Tier/Rarity/affix-roll system -- built in
   response to tester feedback that "lots of tooltip is missing" for theorycrafting-
   minded players. Reachable from the Character Sheet's "Itemization Guide" link. */

// A lightweight CSS-grid row helper, matching this file's existing div/row/panel
// idiom instead of introducing real <table> markup.
function gridRow(cells, opts={}){
  return h("div",{style:{display:"grid",gridTemplateColumns:opts.cols||"1fr",gap:"6px",padding:"5px 0",borderBottom:opts.noBorder?"none":"1px solid var(--border)",fontWeight:opts.header?"bold":"normal"}},
    cells.map(c=>h("div",{class:opts.header?"":"muted",style:{fontSize:opts.header?"1em":".9em"}},[c])));
}

function screenItemization(){
  const root=h("div",{});
  root.appendChild(h("h2",{},["Itemization Guide"]));
  root.appendChild(h("div",{class:"lore"},["Everything gear-related in one place: tiers, level requirements, rarity, and exactly how high each stat can roll."]));
  // v0.16: Back moved up here instead of below all 3 reference tables.
  root.appendChild(h("button",{style:{marginBottom:"10px"},onClick:()=>{ GF.goto(GF._preItemizationScreen||"town"); }},["← Back"]));

  root.appendChild(h("h3",{},["Item Tiers"]));
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px"}},["Tier (T1-T5) is separate from Rarity. A tier's level requirement is the LOWEST character level that can equip it -- you can always still wear a lower tier than your level allows. An area's level mostly drops its own \"natural\" tier, but occasionally hands out a lower tier too (never a higher one), so low-tier legendaries stay worth finding and trading even for high-level characters."]));
  const tierPanel=h("div",{class:"panel",style:{marginBottom:"16px"}});
  tierPanel.appendChild(gridRow(["Tier","Equip Requirement","Most Common Drop Area"],{cols:"1fr 1fr 1fr",header:true}));
  for(let t=1;t<=Balance.ITEM_TIER_MAX;t++){
    const lo=Balance.tierLevelRequirement(t);
    const areaRange=t<Balance.ITEM_TIER_MAX?`Area level ${lo}-${lo+Balance.ITEM_TIER_BRACKET_WIDTH-1}`:`Area level ${lo}+`;
    tierPanel.appendChild(gridRow([`T${t} (${Balance.itemTierAdjective(t)})`,`Character Level ${lo}+`,areaRange],{cols:"1fr 1fr 1fr",noBorder:t===Balance.ITEM_TIER_MAX}));
  }
  root.appendChild(tierPanel);

  root.appendChild(h("h3",{},["Rarity"]));
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px"}},["Rarity decides how many affixes (rolled bonus stats) an item can carry, independent of its Tier."]));
  const rarityPanel=h("div",{class:"panel",style:{marginBottom:"16px"}});
  rarityPanel.appendChild(gridRow(["Rarity","Affixes"],{cols:"1fr 1fr",header:true}));
  Balance.RARITY_TABLE.forEach((r,i)=>{
    rarityPanel.appendChild(h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px",padding:"5px 0",borderBottom:i===Balance.RARITY_TABLE.length-1?"none":"1px solid var(--border)"}},[
      h("div",{class:"rarity-"+r.name},[Balance.rarityDisplayName(r.name)||r.name]),
      h("div",{class:"muted"},[`${r.slots} affix${r.slots===1?"":"es"}`]),
    ]));
  });
  root.appendChild(rarityPanel);

  // v0.18.1 (#3): class-based weapon-type restrictions reference table -- every weapon type
  // that appears in IF.WEAPON_TYPE_CLASS_RESTRICTIONS is listed with the exact classes
  // allowed to equip it; any type NOT in that lookup (currently just Dagger) is called out
  // separately as unrestricted, rather than silently omitted.
  root.appendChild(h("h3",{},["Weapon Class Requirements"]));
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px"}},["Each weapon type can only be equipped by certain classes. Trying to equip a weapon your class can't use shows an explanation instead, and an equipped weapon that becomes class-invalid (e.g. after a Broken Bridge Trial promotion) is flagged just like an under-level item -- its bonuses stop applying until you unequip or swap it."]));
  const weaponClassPanel=h("div",{class:"panel",style:{marginBottom:"16px"}});
  weaponClassPanel.appendChild(gridRow(["Weapon Type","Allowed Classes"],{cols:"1fr 2fr",header:true}));
  IF.WEAPON_TYPE_LIST.forEach((wt,i)=>{
    const allowedIds=IF.WEAPON_TYPE_CLASS_RESTRICTIONS[wt];
    const allowedText=allowedIds?allowedIds.map(id=>DL.getClass(id).display_name||id).join(", "):"Every class";
    weaponClassPanel.appendChild(gridRow([IF.WEAPON_TYPE_LABELS[wt]||wt,allowedText],{cols:"1fr 2fr",noBorder:i===IF.WEAPON_TYPE_LIST.length-1}));
  });
  root.appendChild(weaponClassPanel);

  root.appendChild(h("h3",{},["Max Affix Rolls Per Tier"]));
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px"}},["Every affix rolls between 1 and the max shown below for its own stat and tier -- each stat's max always scales up linearly with tier (Tier N's max = N x that stat's Tier 1 max). Weapons roll a further +40% on any Damage affix they get. Mana and Spell Power affixes are planned for a future update."]));
  const affixPanel=h("div",{class:"panel",style:{marginBottom:"16px",overflowX:"auto"}});
  const cols=`1.3fr repeat(${Balance.ITEM_TIER_MAX},1fr)`;
  affixPanel.appendChild(gridRow(["Stat",...Array.from({length:Balance.ITEM_TIER_MAX},(_,i)=>`T${i+1}`)],{cols,header:true}));
  Balance.AFFIX_POOL.forEach((stat,i)=>{
    const maxCells=Array.from({length:Balance.ITEM_TIER_MAX},(_,ti)=>{
      const max=Balance.affixMaxForTier(stat,ti+1);
      return IF.affixIsPercent(stat)?`${max}%`:`+${max}`;
    });
    affixPanel.appendChild(gridRow([IF.affixLabel(stat),...maxCells],{cols,noBorder:i===Balance.AFFIX_POOL.length-1}));
  });
  root.appendChild(affixPanel);

  return root;
}

/* ================= HERBALISM & ALCHEMY GUIDE (v0.17 #12) ================= */
/* Same idea as the Itemization Guide above -- a player-facing reference page, this time
   for herbs and the potions they brew into. Reachable from both the Character Sheet and
   the Alchemist (where it's most immediately useful). */

function screenHerbalismGuide(){
  const root=h("div",{});
  root.appendChild(h("h2",{},["Herbalism & Alchemy Guide"]));
  root.appendChild(h("div",{class:"lore"},["Every herb in the woods, where it comes from, and exactly what it brews into."]));
  root.appendChild(h("button",{style:{marginBottom:"10px"},onClick:()=>{ GF.goto(GF._preHerbalismScreen||"town"); }},["← Back"]));

  root.appendChild(h("h3",{},["Herbs"]));
  // Honesty note: herb availability is NOT gated by area/depth level for the ORIGINAL herb
  // roster -- every maze, from area level 1 up, rolls gathering nodes and rare-herb odds
  // identically for those (see Balance.MAZE_HERB_CHANCE_PER_TILE/RARE_HERB_CHANCE and
  // DL.pickHerbForNode()). v0.17.1 (#7) is the one deliberate exception: the 5 newest rare
  // herbs (feeding the Might/Swiftness/Intellect/Wardveil/Renewal potions) only enter the
  // rare-herb pool once you're gathering at area level 5+ (Balance.NEW_HERB_MIN_AREA_LEVEL),
  // so below that only Starveil Petal can turn up as a rare find. The Min Area Lvl column
  // below makes that exception explicit rather than leaving it as an undocumented surprise.
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px"}},["Most herbs are NOT gated by area level -- a Common herb is exactly as likely to turn up in a level 1 maze as a level 50 one. Rare herbs are drawn from the same pool everywhere too, EXCEPT the 5 newest ones (Ironbark Sap, Swiftfern Frond, Mindroot Tuber, Stoneshell Moss, Vitalbloom Petal), which only start appearing once you're gathering at area level 5+. \"Rarity\" below refers to that drop-odds tier, not item rarity."]));
  const herbPanel=h("div",{class:"panel",style:{marginBottom:"16px",overflowX:"auto"}});
  herbPanel.appendChild(gridRow(["Herb","Rarity","Min Area Lvl","Where to Find"],{cols:"1fr .6fr .8fr 2fr",header:true}));
  const herbIds=Object.keys(HERBS);
  herbIds.forEach((id,i)=>{
    const herb=HERBS[id];
    herbPanel.appendChild(gridRow([
      herb.name,
      herb.rare?h("span",{style:{color:"var(--gold)"}},["Rare"]):"Common",
      herb.min_area_level?`${herb.min_area_level}+`:"Any",
      herb.found_in||"",
    ],{cols:"1fr .6fr .8fr 2fr",noBorder:i===herbIds.length-1}));
  });
  root.appendChild(herbPanel);

  // v0.17.1 (#7): explains the new Herbalism proficiency track right on this guide page,
  // same spot a player would already be looking to understand herb mechanics. The actual
  // progress bar lives on the Character Sheet's Skill Bonuses card (see skillsBonusPanel()).
  root.appendChild(h("h3",{},["Herbalism Proficiency"]));
  root.appendChild(h("div",{class:"panel",style:{marginBottom:"16px"}},[
    h("div",{},[`You are currently Herbalism Lv ${PS.getHerbalismLevel()}.`]),
    h("div",{class:"muted",style:{marginTop:"6px"}},[`Fully harvesting a herb node earns you permanent Herbalism points equal to the number of strikes it took -- so a herb that takes 2 strikes to gather nets 2 points, one that takes 4 strikes nets 4, awarded all at once when the node is completed. Walking away early via "Leave it" earns nothing. Herbalism starts at Lv 0 (0/${Balance.HERBALISM_POINT_STEP} points); reaching Lv 1 takes ${Balance.herbalismCumulativePointsForLevel(1)} points, Lv 2 takes ${Balance.herbalismCumulativePointsForLevel(2)} total, Lv 3 takes ${Balance.herbalismCumulativePointsForLevel(3)} total, and so on, ${Balance.HERBALISM_POINT_STEP} more per level. Progress is permanent and shown on your Character Sheet's Skill Bonuses card.`]),
  ]));

  root.appendChild(h("h3",{},["Potion Recipes"]));
  root.appendChild(h("div",{class:"muted",style:{marginBottom:"8px"}},["Every brewable potion, cross-referenced against the herb table above. Recipes needing a gold payment on top of herbs are noted."]));
  const recipePanel=h("div",{class:"panel",style:{overflowX:"auto"}});
  recipePanel.appendChild(gridRow(["Potion","Herbs Required","Gold"],{cols:"1.2fr 2fr .6fr",header:true}));
  const recipes=DL.allRecipes();
  recipes.forEach((r,i)=>{
    const resultItem=ITEMS[r.result_item];
    const herbList=Object.keys(r.herbs).map(hid=>`${r.herbs[hid]}x ${HERBS[hid]?HERBS[hid].name:hid}`).join(", ");
    recipePanel.appendChild(gridRow([
      resultItem?resultItem.name:r.result_item,
      herbList,
      r.gold_cost?`${r.gold_cost}g`:"-",
    ],{cols:"1.2fr 2fr .6fr",noBorder:i===recipes.length-1}));
  });
  root.appendChild(recipePanel);

  return root;
}
