/* ================= MAZE / OVERWORLD ================= */

const MAZE_W=20, MAZE_H=10;

function generateMaze(depth){
  const size=MAZE_W, sizeH=MAZE_H;
  const idx=(x,y)=>y*size+x;
  const dirs4=[[1,0],[-1,0],[0,1],[0,-1]];

  // Terrain, obstruction placement, and reachability are regenerated together and
  // retried if the layout doesn't leave enough open ground, boulders sit at up to
  // 25% density now, so this retry loop matters more than it used to.
  let cells, dist;
  for(let attempt=0;attempt<40;attempt++){
    cells=[];
    for(let y=0;y<sizeH;y++) for(let x=0;x<size;x++) cells.push({x,y,type:"dirt",baseTerrain:"dirt",discovered:false,cleared:false});

    // Cosmetic grass patches (tall grass = "hides mobs" flavor; dirt = plain path).
    // Both are freely walkable, monster encounters only trigger on grass tiles.
    for(let p=0;p<Balance.GRASS_PATCH_COUNT;p++){
      let cx=randi(size), cy=randi(sizeH);
      const patchSize=3+randi(4);
      for(let s=0;s<patchSize;s++){
        if(cx>=0&&cx<size&&cy>=0&&cy<sizeH){ cells[idx(cx,cy)].type="grass"; cells[idx(cx,cy)].baseTerrain="grass"; }
        const [ddx,ddy]=pick(dirs4); cx+=ddx; cy+=ddy;
      }
    }

    // Boulders: impassable whole tiles (not walls between tiles), any two
    // 4-directionally adjacent non-boulder cells are always mutually reachable.
    for(const c of cells){
      if(c.x===0&&c.y===0) continue; // never block the starting tile itself
      if(Math.random()<Balance.OBSTACLE_DENSITY) c.type="boulder";
    }

    // BFS reachability (4-directional, boulders block) from the start tile.
    dist=new Array(cells.length).fill(-1);
    dist[0]=0; const q=[0];
    while(q.length){
      const cur=q.shift();
      const cx=cur%size, cy=Math.floor(cur/size);
      for(const [dx,dy] of dirs4){
        const nx=cx+dx, ny=cy+dy;
        if(nx<0||nx>=size||ny<0||ny>=sizeH) continue;
        const ni=idx(nx,ny);
        if(cells[ni].type==="boulder") continue;
        if(dist[ni]===-1){ dist[ni]=dist[cur]+1; q.push(ni); }
      }
    }
    const reachableCount=dist.filter(d=>d>=0).length;
    if(reachableCount>=cells.length*0.45) break; // good enough, keep this layout
  }

  cells[0].type="start"; cells[0].baseTerrain="start";
  let exitIdx=0, best=-1;
  for(let i=0;i<cells.length;i++) if(dist[i]>best){ best=dist[i]; exitIdx=i; }
  cells[exitIdx].type="exit";

  // Stronghold: a 3x3 structure (see placeStronghold), placed before the ordinary per-tile
  // content rolls below so its 9 cells are already spoken for -- the chest/guardian cells
  // get non-grass/dirt types so the `candidates` filter skips them naturally, and the fence
  // corners get their own type too so they can't be re-rolled into a chest/shrine/trap on
  // top of the stronghold.
  // v0.17.2 (#2) HOTFIX: this used to be a guaranteed spawn on every single maze -- now
  // only STRONGHOLD_SPAWN_CHANCE (40%) of mazes get one at all, so finding one feels like
  // an actual event again rather than routine. A maze that doesn't roll a stronghold at
  // all skips placeStronghold() entirely, leaving `stronghold` null (same as the existing
  // "no valid anchor found in 80 tries" fallback already handled everywhere else).
  const stronghold=Math.random()<Balance.STRONGHOLD_SPAWN_CHANCE ? placeStronghold({size,sizeH,cells,depth}, dist, exitIdx) : null;

  // Content only ever lands on reachable, plain (grass/dirt) tiles. Trapdoors and traps
  // stay visually indistinguishable from ordinary terrain (see TILE_GLYPH/TILE_COLOR),
  // so their placement doesn't need to avoid "obvious" spots the way it once did.
  // Each candidate tile gets one independent roll per content type, in order (a tile
  // that hits an earlier roll is taken and skips the rest), this replaces the old
  // fixed-count-per-maze model with true per-tile probabilities, so a big 25%-boulder
  // maze with very few open tiles naturally spawns less content too.
  const candidates=cells.filter((c,i)=>dist[i]>0 && (c.type==="grass"||c.type==="dirt"));
  for(const c of candidates){
    const roll=Math.random();
    if(roll<Balance.MAZE_CHEST_CHANCE_PER_TILE){ c.type="chest"; continue; }
    if(roll<Balance.MAZE_CHEST_CHANCE_PER_TILE+Balance.MAZE_SHRINE_CHANCE_PER_TILE){ c.type="shrine"; continue; }
    if(roll<Balance.MAZE_CHEST_CHANCE_PER_TILE+Balance.MAZE_SHRINE_CHANCE_PER_TILE+Balance.MAZE_HERB_CHANCE_PER_TILE){ c.type="herb"; continue; }
    // v0.18.2 (#6): non-moving critter encounters, rolled right alongside the other
    // per-tile content types above -- see MAZE_CRITTER_CHANCE_PER_TILE's declaration.
    if(roll<Balance.MAZE_CHEST_CHANCE_PER_TILE+Balance.MAZE_SHRINE_CHANCE_PER_TILE+Balance.MAZE_HERB_CHANCE_PER_TILE+Balance.MAZE_CRITTER_CHANCE_PER_TILE){ c.type="critter"; continue; }
    if(roll<Balance.MAZE_CHEST_CHANCE_PER_TILE+Balance.MAZE_SHRINE_CHANCE_PER_TILE+Balance.MAZE_HERB_CHANCE_PER_TILE+Balance.MAZE_CRITTER_CHANCE_PER_TILE+Balance.MAZE_TRAPDOOR_CHANCE_PER_TILE){ c.type="trapdoor"; c.wasHidden=true; continue; }
    // v0.17 (#7): the damage/poison ankle-bite trap is no longer hidden once discovered --
    // it deliberately does NOT set wasHidden here (unlike trapdoor just above), so it shows
    // its own distinct icon/color once inside fog-of-war range (see HIDDEN_TILE_TYPES/
    // TILE_GLYPH.trap/TILE_COLOR.trap below), letting players actively route around it.
    // Trapdoors stay exactly as invisible/surprise as before, per Gwen's explicit spec.
    if(roll<Balance.MAZE_CHEST_CHANCE_PER_TILE+Balance.MAZE_SHRINE_CHANCE_PER_TILE+Balance.MAZE_HERB_CHANCE_PER_TILE+Balance.MAZE_CRITTER_CHANCE_PER_TILE+Balance.MAZE_TRAPDOOR_CHANCE_PER_TILE+Balance.TRAP_CHANCE_PER_TILE){ c.type="trap"; }
  }

  // v0.18 (#2): roaming mobs spawn AFTER the per-tile content rolls above, on whatever
  // grass/dirt tiles are still plain (a tile that just rolled a chest/shrine/herb/trap/
  // trapdoor is no longer type grass/dirt, so it's naturally excluded here -- no roamer
  // ever shares a tile with another piece of content). Each gets a fixed monster identity
  // for this maze's lifetime (same convention as a Stronghold guardian), but -- unlike a
  // guardian -- its tile position changes every player step (see tickRoamingMobs()), so it
  // needs its own stable `roamerId` rather than being addressed by cell index the way a
  // guardian is by its fixed cell.
  const openTiles=cells.filter((c,i)=>dist[i]>0 && (c.type==="grass"||c.type==="dirt"));
  shuffle(openTiles);
  const roamers=[];
  // v0.18.2 (#6): a NEGATIVE Forest Reputation (in the tier this maze's forest belongs to,
  // see PS.getCurrentForestReputation()) adds one extra roaming mob per point below zero --
  // "a player can choose his path, go for a large amount of roaming mobs, or be peaceful and
  // accumulate bonus experience gain" per Gwen's spec. Positive/zero reputation adds none.
  const roamerCount=Balance.ROAMING_MOB_COUNT_PER_MAZE+PS.getForestReputationExtraRoamers();
  for(let r=0;r<Math.min(roamerCount, openTiles.length);r++){
    const tile=openTiles[r];
    roamers.push({roamerId:r, idx:idx(tile.x,tile.y), monsterId:DL.pickRandomMonsterForArea(depth).id, defeated:false});
  }

  const maze={size, sizeH, cells, depth, playerIdx:0, stronghold, roamers};
  revealAround(maze,0,PS.getEyesightRadius()); // see your own starting neighborhood immediately
  return maze;
}

// v0.18 (#2): moves every still-living roaming mob exactly one tile in a random valid
// direction (4-directional, like the player). "Valid" means: in bounds, not a boulder,
// still a plain grass/dirt tile (so a roamer can never wander onto a chest/shrine/trap/
// stronghold/start/exit tile), and not already occupied by another still-living roamer --
  // deliberately does NOT exclude the player's own tile, so a roamer wandering into the
// player is just as valid a way to trigger a fight as the player walking into it (see
// onStepMaze()'s post-tick collision check). A roamer with no valid direction available
// this turn simply stays put rather than being forced to move.
function tickRoamingMobs(maze){
  if(!maze.roamers || !maze.roamers.length) return;
  const dirs4=[[1,0],[-1,0],[0,1],[0,-1]];
  const occupied=new Set(maze.roamers.filter(r=>!r.defeated).map(r=>r.idx));
  for(const r of maze.roamers){
    if(r.defeated) continue;
    occupied.delete(r.idx);
    const shuffled=dirs4.slice(); shuffle(shuffled);
    let moved=false;
    for(const [dx,dy] of shuffled){
      const x=r.idx%maze.size, y=Math.floor(r.idx/maze.size);
      const nx=x+dx, ny=y+dy;
      if(nx<0||nx>=maze.size||ny<0||ny>=maze.sizeH) continue;
      const ni=ny*maze.size+nx;
      const cell=maze.cells[ni];
      if(cell.type!=="grass" && cell.type!=="dirt") continue;
      if(occupied.has(ni)) continue;
      r.idx=ni; moved=true; break;
    }
    occupied.add(r.idx);
  }
}

// Picks a 3x3 anchor point whose all 9 cells are reachable, not the start tile, and not
// the exit tile, then carves in: center = locked chest, N/S/W/E = tough guardian monsters,
// the 4 diagonal corners = purely decorative "broken fencing" (never a real obstacle --
// per Gwen's explicit requirement, a boulder ever landing on a corner here could wall off
// the only route around the chest, which would be a soft-lock bug, not a puzzle). Returns
// null on the astronomically rare chance no valid anchor is found in 80 tries, in which
// case this one maze simply generates without a stronghold rather than risk corrupting
// the start/exit tiles.
function placeStronghold(maze, dist, exitIdx){
  const {size, sizeH, cells}=maze;
  const idx=(x,y)=>y*size+x;
  const dirs4=[[1,0],[-1,0],[0,1],[0,-1]];
  let chosen=null;
  for(let attempt=0;attempt<200;attempt++){
    const cx=1+randi(size-2), cy=1+randi(sizeH-2);
    const coords=[[cx,cy],[cx,cy-1],[cx,cy+1],[cx-1,cy],[cx+1,cy],[cx-1,cy-1],[cx+1,cy-1],[cx-1,cy+1],[cx+1,cy+1]];
    const idxs=coords.map(([x,y])=>idx(x,y));
    if(idxs.includes(0) || idxs.includes(exitIdx)) continue;
    // Virtual reachability check: treat the whole 3x3 candidate block as walkable (it
    // will be once carved -- chest/guardian/fence tiles are never boulders), and ask
    // whether the start can reach ANY of its 9 cells through the existing layout. This
    // lets the stronghold carve straight through boulders instead of requiring a lucky
    // boulder-free 3x3 patch, which was leaving a meaningful fraction of mazes with no
    // stronghold at all under the old all-9-cells-must-already-be-open approach.
    const inBlock=new Set(idxs);
    const vDist=new Array(cells.length).fill(-1);
    vDist[0]=0; const q=[0];
    while(q.length){
      const cur=q.shift();
      const curx=cur%size, cury=Math.floor(cur/size);
      for(const [dx,dy] of dirs4){
        const nx=curx+dx, ny=cury+dy;
        if(nx<0||nx>=size||ny<0||ny>=sizeH) continue;
        const ni=ny*size+nx;
        if(vDist[ni]!==-1) continue;
        if(cells[ni].type==="boulder" && !inBlock.has(ni)) continue;
        vDist[ni]=vDist[cur]+1; q.push(ni);
      }
    }
    if(idxs.some(i=>vDist[i]>=0)){ chosen={cx,cy}; break; }
  }
  if(!chosen) return null;
  const {cx,cy}=chosen;
  const chestIdx=idx(cx,cy);
  const guardianCoords=[[cx,cy-1],[cx,cy+1],[cx-1,cy],[cx+1,cy]]; // N, S, W, E
  const cornerCoords=[[cx-1,cy-1],[cx+1,cy-1],[cx-1,cy+1],[cx+1,cy+1]];

  cells[chestIdx].type="stronghold_chest"; cells[chestIdx].cleared=false;
  const guardianIdxs=[];
  guardianCoords.forEach(([gx,gy],slot)=>{
    const gi=idx(gx,gy);
    const base=DL.pickRandomMonsterForArea(maze.depth||1);
    cells[gi].type="stronghold_guardian"; cells[gi].cleared=false;
    cells[gi].guardianMonsterId=base.id; cells[gi].guardianSlot=slot;
    guardianIdxs.push(gi);
  });
  cornerCoords.forEach(([fx,fy])=>{ cells[idx(fx,fy)].type="stronghold_fence"; });

  return {chestIdx, guardianIdxs, guardianDefeated:[false,false,false,false], opened:false};
}
function strongholdChestUnlocked(maze){
  return !!(maze.stronghold && maze.stronghold.guardianDefeated.some(Boolean));
}

function ensureMaze(depth){
  if(!GF.overworld_snapshot || GF.overworld_snapshot.depth!==depth) GF.overworld_snapshot=generateMaze(depth);
  return GF.overworld_snapshot;
}

// v0.12.1: whenever the player leaves the maze back to town WITHOUT changing area level
// (fleeing a monster, a voluntary stamina retreat, or surviving a softcore death), the
// maze itself -- fog-of-war/discovered cells, cleared chests/shrines/guardians, the
// Stronghold's state -- must still be sitting there next time they Venture at the same
// area level (ensureMaze() already does this correctly, it only regenerates on a depth
// mismatch). The one thing that SHOULD reset is the player's own position: they always
// walk back in from the entrance, not from wherever they left off. Only changing area
// level (reaching the exit, a trapdoor, or a Broken Bridge outcome) should generate a
// brand new, undiscovered maze -- those paths already null GF.overworld_snapshot outright
// and are untouched by this helper.
function resetMazePositionToStart(){
  if(GF.overworld_snapshot) GF.overworld_snapshot.playerIdx=0;
}

// Trapdoor tiles are deliberately absent here, they render using the cell's baseTerrain
// instead (see screenMaze), so they're indistinguishable from ordinary ground -- that's the
// whole point, a trapdoor has to stay a surprise. The damage/poison "trap" tile is the
// opposite as of v0.17 (#7): it gets its own glyph/color below so it's visible (once inside
// fog-of-war range) and a player can choose to walk around it.
const TILE_GLYPH={start:"🏕",exit:"⬇",chest:"🎁",shrine:"✨",herb:"🌿",boulder:"🪨",grass:"",dirt:"",trap:"⚠️",
  stronghold_chest:"🔒",stronghold_guardian:"💀",stronghold_fence:"🪵",
  // v0.18.2 (#6): visible once discovered, same as chest/herb/shrine/trap -- not hidden like
  // a trapdoor. There's nothing to ambush you here, so there's no reason to hide it.
  critter:"🐛"};
const TILE_COLOR={start:"#2a4a2a",exit:"#3a3a6a",chest:"#5a4a1a",shrine:"#3a5a5a",herb:"#2a4a2a",boulder:"#3a3a34",grass:"#274a1e",dirt:"#4a3a26",trap:"#5a2a1a",
  stronghold_chest:"#5a4a1a",stronghold_guardian:"#6a1e1e",stronghold_fence:"#4a3a26",
  critter:"#3a4a2a"};
const HIDDEN_TILE_TYPES=["trapdoor"];
// v0.18 (#2): roaming mobs aren't a cell type (their tile changes every step -- see
// tickRoamingMobs()), so they're not part of TILE_GLYPH/TILE_COLOR above -- screenMaze()'s
// render loop overlays this glyph/color on top of whatever plain grass/dirt tile a live
// roamer currently occupies, same fog-of-war rules (only shown once `cell.discovered`) as
// every other piece of map content.
const ROAMING_MOB_GLYPH="👹", ROAMING_MOB_COLOR="#3a1e4a";

// v0.16 (#333): pure hex-color lerp used to fade a trampled grass tile's background
// toward the dirt color in 3 gradient steps (see screenMaze()'s tile-rendering loop and
// onStepMaze()'s cell.trampleCount, both below) -- no glyph changes needed since both
// grass and dirt use an empty TILE_GLYPH entry already.
function interpolateHexColor(hex1,hex2,t){
  const c1=parseInt(hex1.slice(1),16), c2=parseInt(hex2.slice(1),16);
  const r1=(c1>>16)&255, g1=(c1>>8)&255, b1=c1&255;
  const r2=(c2>>16)&255, g2=(c2>>8)&255, b2=c2&255;
  const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
  return "#"+[r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
}

function isAdjacent4(x1,y1,x2,y2){
  const dx=Math.abs(x1-x2), dy=Math.abs(y1-y2);
  return (dx+dy)===1;
}

function mazeOverlayScreen(overlay){
  const div=h("div",{class:"maze-overlay-grid"},[h("div",{class:"maze-overlay-text"},[overlay.text])]);
  if(!overlay.timerStarted){
    overlay.timerStarted=true;
    setTimeout(()=>{ div.classList.add("fade"); },50);
    setTimeout(()=>{
      GF.mazeOverlay=null;
      if(overlay.andThen) overlay.andThen();
      else render();
    },1650);
  }
  return div;
}

function screenMaze(){
  const depth=GF.maze_depth||PS.level;
  const maze=ensureMaze(depth);
  const root=h("div",{});
  root.appendChild(h("h2",{},[`The Woods, Area Level ${depth}`]));
  root.appendChild(h("div",{class:"lore"},["Overgrown paths wind between the trees. Move with the arrow keys or by clicking an adjacent tile."]));
  root.appendChild(statHeader());
  // v0.18 (#12): maze-event messages (exhaustion/trap/shrine) render into this fixed-height
  // log instead of the page-shifting toast banner (the old toastBox call) that used to sit
  // here -- see mazeLog()/mazeLogBox().
  root.appendChild(mazeLogBox());

  // Grid pixel size (tiles + 1px gaps + 2px border on each side), the dramatic
  // Advanced!/Trapdoor! overlay is sized to exactly cover this box, not the full
  // viewport, so it reads as "something happened on the grid" rather than a
  // jarring full-screen takeover.
  const gridWidthPx=maze.size*34+(maze.size-1)*1+4;
  const gridHeightPx=maze.sizeH*34+(maze.sizeH-1)*1+4;

  let gridArea;
  if(GF.mazeOverlay){
    gridArea=h("div",{style:{position:"relative",width:gridWidthPx+"px",height:gridHeightPx+"px",flex:"none"}},[mazeOverlayScreen(GF.mazeOverlay)]);
  } else {
    const px=maze.playerIdx%maze.size, py=Math.floor(maze.playerIdx/maze.size);
    const grid=h("div",{class:"maze-grid",style:{gridTemplateColumns:`repeat(${maze.size},34px)`}});
    for(let y=0;y<maze.sizeH;y++){
      for(let x=0;x<maze.size;x++){
        const i=y*maze.size+x; const cell=maze.cells[i];
        const isPlayer=maze.playerIdx===i;
        const chestLocked=cell.type==="stronghold_chest" && !strongholdChestUnlocked(maze);
        const isWalkable=!isPlayer && cell.type!=="boulder" && !chestLocked && isAdjacent4(x,y,px,py);
        // v0.17.2 (#6) HOTFIX (credit: Fragbunny): the exit tile used to be permanently
        // visible through the fog of war regardless of whether the player had actually
        // found it yet, which spoiled the "wander and discover" feel a maze is supposed to
        // have and made reaching it (area advancement) feel less earned. It's now hidden
        // like any other tile until fog-of-war reveal (revealAround(), see onStepMaze())
        // actually uncovers it. The start tile stays exempt -- that's the player's own
        // known starting position, already revealed at generation time regardless.
        const isKnown=cell.discovered || cell.type==="start";
        const hidden=!!cell.wasHidden || HIDDEN_TILE_TYPES.includes(cell.type);
        const displayType=HIDDEN_TILE_TYPES.includes(cell.type)?cell.baseTerrain:cell.type;
        let bg="#050505", label="", border="1px solid #222", opacity="1";
        // v0.18.1 (#21): the player's own tile (and, below, a live roamer's tile) used to be
        // painted over with a flat highlight color/glyph here, baked directly into whichever
        // cell index currently held them -- meaning on every step the "player" visually
        // teleported from one tile div to the next (a brand new DOM node each render(), so
        // there was nothing for a CSS transition to animate between). Gwen asked for actual
        // smooth movement instead, so the underlying terrain is now always shown plain (same
        // as it would be if nobody were standing on it), and a separate .maze-mover overlay
        // element (added after this loop, positioned absolutely over the grid) represents the
        // player/each roamer instead -- see animateMazeMovers() for how that overlay actually
        // glides from its old tile to its new one after a step.
        if(isKnown){
          bg=TILE_COLOR[displayType]||TILE_COLOR.dirt;
          label=TILE_GLYPH[displayType]||"";
          // v0.16 (#333): fade a trampled grass tile toward the dirt color in 3 gradient
          // steps as cell.trampleCount rises (see onStepMaze()) -- purely visual, doesn't
          // touch displayType/cell.type, so nothing else about the tile's identity changes.
          if(displayType==="grass" && cell.trampleCount){
            bg=interpolateHexColor(TILE_COLOR.grass, TILE_COLOR.dirt, Math.min(3,cell.trampleCount)/3);
          }
          if(cell.cleared && !hidden) opacity="0.4"; // hidden tiles never visually change, even once triggered
        }
        const inner=h("span",{style:{opacity}},[label]);
        const tile=h("div",{class:"maze-tile",style:{background:bg,display:"flex",alignItems:"center",justifyContent:"center",cursor:isWalkable?"pointer":"default",fontSize:"16px",border}},[inner]);
        if(isWalkable){ tile.addEventListener("click",()=>onStepMaze(maze,i)); }
        grid.appendChild(tile);
      }
    }
    // v0.18.1 (#21): the player marker + one marker per live roamer, absolutely positioned
    // on top of the plain grid built above (grid has position:relative, see .maze-grid CSS).
    // Each tile is 34px + a 1px gap, hence the *35 step. These are looked up by id and
    // animated in animateMazeMovers(), called right after render() by every onStepMaze()
    // branch that keeps the player on this same maze screen (a branch that instead navigates
    // away, e.g. into combat or a chest, has no grid left to animate, so it skips the call).
    grid.appendChild(h("div",{id:"maze-player-marker",class:"maze-mover maze-mover-player",style:{left:(px*35)+"px",top:(py*35)+"px"}}));
    if(maze.roamers){
      for(const r of maze.roamers){
        if(r.defeated) continue;
        // v0.18.1 (#21): only rendered on an already-discovered tile -- same fog-of-war
        // gating the old baked-in roamer overlay respected (it lived inside the `if(isKnown)`
        // branch above), so a roaming mob still can't be spotted through unexplored fog.
        const rCell=maze.cells[r.idx];
        if(!(rCell.discovered || rCell.type==="start")) continue;
        const rx=r.idx%maze.size, ry=Math.floor(r.idx/maze.size);
        grid.appendChild(h("div",{id:"maze-roamer-marker-"+r.roamerId,class:"maze-mover maze-mover-roamer",style:{left:(rx*35)+"px",top:(ry*35)+"px",background:ROAMING_MOB_COLOR}},[ROAMING_MOB_GLYPH]));
      }
    }
    gridArea=grid;
  }

  root.appendChild(h("div",{class:"maze-wrap"},[gridArea,
    h("div",{class:"side-panel"},[
      h("div",{class:"col",style:{gap:"2px"}},[
        h("div",{class:"muted",style:{lineHeight:"1.5em"}},["Use the arrow keys to explore the wilderness. Wild creatures lure at you from the tall grass, reach the exit (⬇) before your stamina runs out. Every area hides a Stronghold too: a locked chest (🔒) guarded on 4 sides by tough guardians (💀), beat one to reach the chest, but you'll need a Stronghold Key to actually open it. Watch for Roaming mobs (👹) too, they wander the whole area on their own and hit harder than a Stronghold guardian."]),
      ]),
      // v0.16 (#332): on-screen D-pad, CSS-hidden on desktop-width screens (see the
      // .maze-mobile-arrows rule) -- brought back specifically so touch/mobile players
      // have SOME way to move that isn't "hope your adjacent tile is easy to tap."
      h("div",{class:"maze-mobile-arrows"},[
        h("div",{}), h("button",{onClick:()=>attemptMazeMove(0,-1)},["↑"]), h("div",{}),
        h("button",{onClick:()=>attemptMazeMove(-1,0)},["←"]), h("div",{}), h("button",{onClick:()=>attemptMazeMove(1,0)},["→"]),
        h("div",{}), h("button",{onClick:()=>attemptMazeMove(0,1)},["↓"]), h("div",{}),
      ]),
      h("div",{class:"row gap"},[
        h("button",{disabled:!PS.canUseConsumable(PS.bestAvailableConsumable("health")),onClick:()=>{ PS.useConsumable(PS.bestAvailableConsumable("health")); autosave(); render(); }},["Use Health Potion"]),
        h("button",{disabled:!PS.canUseConsumable(PS.bestAvailableConsumable("stamina")),onClick:()=>{ PS.useConsumable(PS.bestAvailableConsumable("stamina")); autosave(); render(); }},["Use Stamina Potion"]),
        // v0.16: quick-use Antidote, right alongside the Health/Stamina buttons -- poison
        // drains "even outside of combat" (see the poison-drain setInterval), so a player
        // needs to be able to cure it from the maze view itself, not just in town.
        h("button",{disabled:!PS.canUseConsumable("antidote"),onClick:()=>{ PS.useConsumable("antidote"); autosave(); render(); }},["Use Antidote"]),
      ]),
      // v0.18.2 (#1) (lore phrasing credit: Marudok): regenerates a brand new layout at the
      // SAME area level -- fog of war, roamer positions, the Stronghold, everything about
      // this maze instance resets, since none of it is persisted anywhere (see
      // GF.overworld_snapshot's own comment). Added because a roaming mob (or an unlucky
      // boulder layout) can occasionally wall off the only path to the exit entirely, and
      // the only workaround used to be venturing up a level and back down just to force a
      // regeneration -- this does the same thing directly, without leaving the screen.
      h("button",{onClick:()=>{ askConfirm("Try a different route through this area? Your current position and any progress on this maze layout (fog of war, cleared chests/shrines, the Stronghold) will be lost -- your area level stays the same.",()=>{ GF.overworld_snapshot=null; GF.goto("maze",{maze_depth:depth}); },{confirmLabel:"Try a Different Route"}); }},["Try a Different Route"]),
      h("button",{onClick:()=>{ resetMazePositionToStart(); GF.goto("town"); }},["← Retreat to Town"]),
    ]),
  ]));
  return root;
}

function revealAround(maze,centerIdx,radius){
  const cx=centerIdx%maze.size, cy=Math.floor(centerIdx/maze.size);
  for(let dy=-radius;dy<=radius;dy++){
    for(let dx=-radius;dx<=radius;dx++){
      const nx=cx+dx, ny=cy+dy;
      if(nx<0||nx>=maze.size||ny<0||ny>=maze.sizeH) continue;
      maze.cells[ny*maze.size+nx].discovered=true;
    }
  }
}

function tickEyesightPotion(){
  if(PS.eyesight_potion_steps_left>0){
    PS.eyesight_potion_steps_left--;
  }
}

// v0.18.1 (#21): glides the player marker (and any live roamer markers) from their OLD grid
// position to their current one, called right after a render() that keeps the player on this
// same maze screen (see screenMaze()'s comment on the .maze-mover overlay elements this
// looks up by id). Same snap-old-position-then-restore-transition trick as
// animateXpBarGrowth() -- a freshly rendered node has no "old" position of its own to
// transition from, so this forces it there instantly (transition:none), then a moment later
// (after the browser's had a chance to paint that frame) sets it to its real, current
// position with the transition restored, so the visible change animates instead of snapping.
// `prevPlayerIdx`/`prevRoamerPositions` (a {roamerId:idx} map) must be captured BEFORE
// onStepMaze() mutates maze.playerIdx / ticks roamer movement.
function animateMazeMovers(prevPlayerIdx, prevRoamerPositions){
  const maze=GF.overworld_snapshot;
  if(!maze) return;
  const cellPx=(idx)=>({x:(idx%maze.size)*35+"px", y:Math.floor(idx/maze.size)*35+"px"});
  const playerEl=document.getElementById("maze-player-marker");
  if(playerEl && playerEl.parentNode && prevPlayerIdx!=null && prevPlayerIdx!==maze.playerIdx){
    const from=cellPx(prevPlayerIdx), to=cellPx(maze.playerIdx);
    playerEl.style.transition="none";
    playerEl.style.left=from.x; playerEl.style.top=from.y;
    setTimeout(()=>{
      playerEl.style.transition="";
      playerEl.style.left=to.x; playerEl.style.top=to.y;
    },20);
  }
  if(maze.roamers && prevRoamerPositions){
    for(const r of maze.roamers){
      if(r.defeated) continue;
      const prevIdx=prevRoamerPositions[r.roamerId];
      if(prevIdx==null || prevIdx===r.idx) continue;
      const el=document.getElementById("maze-roamer-marker-"+r.roamerId);
      if(!el || !el.parentNode) continue;
      const from=cellPx(prevIdx), to=cellPx(r.idx);
      el.style.transition="none";
      el.style.left=from.x; el.style.top=from.y;
      setTimeout(()=>{
        el.style.transition="";
        el.style.left=to.x; el.style.top=to.y;
      },20);
    }
  }
}

function onStepMaze(maze,targetIdx){
  // Exhaustion is checked BEFORE moving, and no longer force-teleports the player to
  // town: that gave no chance to react (e.g. drink a Stamina Potion via the maze's
  // quick-use buttons) and always left current_stamina at a suspicious flat 25 (a
  // hardcoded 25% of the BASE stamina pool, ignoring any +stamina_max gear). Now the
  // player simply can't take another step once truly out of stamina, and has to
  // either use a potion or walk themselves back with "Retreat to Town".
  if(PS.current_stamina<=0){
    mazeLog("You're exhausted and can't go any further. Use a Stamina Potion, or retreat to town to rest.");
    render();
    return;
  }
  // v0.18.1 (#21): captured BEFORE this step mutates maze.playerIdx or tickRoamingMobs()
  // moves any roamer -- see animateMazeMovers() above, called after every render() below
  // that keeps the player on this same maze screen.
  const prevPlayerIdx=maze.playerIdx;
  const prevRoamerPositions={};
  if(maze.roamers) for(const r of maze.roamers) prevRoamerPositions[r.roamerId]=r.idx;
  const cell=maze.cells[targetIdx];
  maze.playerIdx=targetIdx; cell.discovered=true; cell.visited=true;
  PS.spendStamina(Balance.STAMINA_COST_PER_STEP);
  // v0.15 BUG FIX: tickXpBuff() used to fire here, on every single STEP taken -- meaning
  // a 20-charge XP shrine buff got burned down by ordinary walking, often draining to 0
  // (or close to it) before the player had even fought 20 real battles, sometimes before
  // fighting anything at all. The buff is supposed to last 20 BATTLES (see the "Experience
  // shrine active: bonus XP for N more battles" tooltip and Balance.SHRINE_XP_BUFF_
  // ENCOUNTERS), so it must only tick where a fight is actually kicked off (below, and at
  // the Stronghold guardian encounter), not on every footstep.
  tickEyesightPotion();
  revealAround(maze,targetIdx,PS.getEyesightRadius());
  if(PS.current_stamina<=0){
    mazeLog("You're exhausted. Use a Stamina Potion, or retreat to town to rest, before you can move again.");
  }

  // v0.18 (#2): roaming mobs -- checked BEFORE they get their own move this turn, so a
  // player walking directly onto a roamer's tile always fights THAT roamer, with no chance
  // for it to dodge away first (see the post-tick check further below for the other
  // direction: a roamer wandering into the player).
  const roamerAlreadyHere=maze.roamers && maze.roamers.find(r=>!r.defeated && r.idx===maze.playerIdx);
  if(roamerAlreadyHere){
    PS.tickXpBuff();
    GF.goto("combat",{maze_depth:maze.depth, pending_monster_id:roamerAlreadyHere.monsterId, pending_roamer_id:roamerAlreadyHere.roamerId, pending_guardian_cell_idx:null});
    return;
  }
  // Roaming mobs take their own move every time the player takes one, exactly like the
  // request specifies ("whenever a player moves a grid, these mobs also move") -- this
  // fires unconditionally here (the player didn't just walk onto one, per the check just
  // above), before any of the per-tile-type branches below, so it always happens exactly
  // once per successful grid step regardless of what the destination tile turns out to be.
  // The post-tick check right after covers the other direction a fight can start: a
  // roamer's own random move landing it on the player's (new) tile -- takes priority over
  // the ordinary per-tile handling below (a roaming mob wandering up to you is a bigger
  // deal than whatever mundane tile you're currently standing on).
  tickRoamingMobs(maze);
  const roamerWanderedIn=maze.roamers && maze.roamers.find(r=>!r.defeated && r.idx===maze.playerIdx);
  if(roamerWanderedIn){
    PS.tickXpBuff();
    GF.goto("combat",{maze_depth:maze.depth, pending_monster_id:roamerWanderedIn.monsterId, pending_roamer_id:roamerWanderedIn.roamerId, pending_guardian_cell_idx:null});
    return;
  }

  if(cell.type==="exit" && !cell.cleared){
    cell.cleared=true;
    const nextDepth=maze.depth+Balance.EXIT_DEPTH_BONUS_PER_DESCENT;
    PS.max_maze_depth_reached=Math.max(PS.max_maze_depth_reached||1, nextDepth);
    // v0.18.2 (#3) BUG FIX: the Town Venture selector (GF.ventureDepth) used to only ever
    // get bumped by getVentureDepth()'s own "a brand NEW lifetime max was just unlocked"
    // side effect -- so a player who manually stepped the selector DOWN below their real
    // max (e.g. Lv3 -> Lv1) and then advanced naturally back up through exits they'd
    // already unlocked before (nextDepth <= PS.max_maze_depth_reached, so that side effect
    // never fires) saw the selector stay frozen at 1 even as they visibly climbed back to
    // 2, then 3. Explicitly tracking "the depth I'm actually standing in right now" here
    // (and at the trapdoor branch below) means the selector always reflects real current
    // progress the next time they're back in Town, whether or not it's a new lifetime best.
    GF.ventureDepth=nextDepth;
    autosave();
    GF.mazeOverlay={text:`Advanced to area level ${nextDepth}!`, andThen:()=>{ GF.overworld_snapshot=null; GF.goto("maze",{maze_depth:nextDepth}); }};
    render();
    return;
  }
  if(cell.type==="trapdoor" && !cell.cleared){
    cell.cleared=true; cell.type=cell.baseTerrain; // reverts to ordinary grass/dirt from here on, mechanically too
    const dmg=randRange(Balance.TRAP_DAMAGE_MIN,Balance.TRAP_DAMAGE_MAX);
    PS.current_hp=Math.max(1,PS.current_hp-dmg);
    PS.spendStamina(Balance.TRAP_STAMINA_LOSS);
    const fallDepth=Math.max(1,maze.depth-Balance.TRAPDOOR_DEPTH_PENALTY);
    // v0.18.2 (#3): same "keep the Town selector honest" fix as the exit branch above --
    // a trapdoor fall is also a real, involuntary change to the depth the player is
    // currently standing in, so the selector needs to follow it back down too.
    GF.ventureDepth=fallDepth;
    autosave();
    GF.mazeOverlay={text:"Trapdoor!", andThen:()=>{ GF.overworld_snapshot=null; GF.goto("maze",{maze_depth:fallDepth}); }};
    render();
    return;
  }
  if(cell.type==="trap" && !cell.cleared){
    cell.cleared=true; cell.type=cell.baseTerrain;
    PS.spendStamina(Balance.TRAP_STAMINA_LOSS);
    // v0.18.1 (#26): Touch of Unicorn (the Invulnerability shrine buff) used to only guard
    // against combat damage -- an ankle-bite trap's instant damage or poison bite would still
    // land in full even while "immune to damage" was visibly showing on the HP bar, which
    // read as a bug/broken promise to players. It now blocks a trap's damage/poison outright,
    // consuming one round of the buff (same cost as blocking one monster attack in combat via
    // tickCombatRoundBuffs()) so an active Touch of Unicorn is a single shared pool of
    // "protected instances" whether they come from combat rounds or maze traps.
    if(PS.isInvulnerable()){
      PS.invuln_rounds_left--;
      mazeLog(`Something bites at your ankle, but the Touch of Unicorn shields you! (${PS.invuln_rounds_left} round${PS.invuln_rounds_left===1?"":"s"} left)`);
      autosave(); render(); animateMazeMovers(prevPlayerIdx,prevRoamerPositions); return;
    }
    // v0.17.1 (#11) BUG FIX: a trap used to ALWAYS deal its instant damage AND, on top of
    // that, roll a chance (see Balance.trapShouldPoison()) to ALSO inflict Poison from the
    // very same trigger -- player reports called this an unfair double-punish. A trap is now
    // EITHER an instant-damage strike OR a (no-initial-damage) poison bite, never both.
    // trapShouldPoison() still gates whether poison is even possible at this area level
    // (impossible below area level 6) and rolls the chance; the roll now decides the trap's
    // whole TYPE rather than an extra effect layered onto a damage trap.
    if(Balance.trapShouldPoison(maze.depth)){
      PS.applyPoison(maze.depth);
      mazeLog(`Something bites at your ankle! No wound, but you feel a poison take hold.`);
      autosave(); render(); animateMazeMovers(prevPlayerIdx,prevRoamerPositions); return;
    }
    // v0.13: scales with area level now (Gwen's report: a flat 4-12 damage trap was a
    // non-event at area level 13 with 357 HP) and can be outright lethal -- it no longer
    // floors at 1 HP the way the trapdoor's fall damage still does.
    const dmg=Balance.trapDamage(maze.depth);
    if(dmg>=PS.current_hp){
      PS.current_hp=0;
      autosave();
      handleTrapDeath();
      return;
    }
    PS.current_hp-=dmg;
    mazeLog(`Something bites at your ankle! You take ${Math.round(dmg)} damage.`);
    // v0.18 (#10): also show the floating "-X HP" overlay near the player's HP bar, same as
    // any other source of damage, in addition to the existing toast/lore message above.
    spawnFloat("player",`-${Math.round(dmg)} HP`,"float-text-dmg");
    autosave(); render(); animateMazeMovers(prevPlayerIdx,prevRoamerPositions); return;
  }
  if(cell.type==="shrine" && !cell.cleared){
    cell.cleared=true;
    // v0.17.1 (#12): 5 even outcomes now instead of 2 -- Stamina, XP, and the 3 new shrines
    // (Invulnerability/"Touch of Unicorn", Quad Damage, Magic Find).
    const roll=Math.floor(Math.random()*5);
    if(roll===0){ PS.addStaminaShrineBuff(Balance.STAMINA_MAX_BASE*Balance.SHRINE_STAMINA_BUFF_PCT); mazeLog("A quiet shrine restores your stamina and grants a lasting reserve!"); }
    else if(roll===1){ PS.applyXpShrineBuff(); mazeLog("A quiet shrine blesses you, bonus experience for a while!"); }
    else if(roll===2){ PS.applyInvulnShrineBuff(); mazeLog(`A radiant shrine grants you the Touch of Unicorn -- you are immune to damage/poison from combat or traps for ${Balance.SHRINE_INVULN_ROUNDS} rounds!`); }
    else if(roll===3){ PS.applyQuadDamageShrineBuff(); mazeLog(`A furious shrine quadruples your damage output for ${Balance.SHRINE_QUAD_DAMAGE_ROUNDS} combat rounds!`); }
    else { PS.applyMagicFindShrineBuff(); mazeLog(`A glimmering shrine sharpens your eye for treasure -- +${Balance.SHRINE_MAGIC_FIND_PCT}% Magic Find for a while!`); }
    autosave(); render(); animateMazeMovers(prevPlayerIdx,prevRoamerPositions); return;
  }
  if(cell.type==="herb" && !cell.cleared){
    GF.goto("herbEncounter",{maze_depth:maze.depth, herb_cell_idx:targetIdx});
    return;
  }
  if(cell.type==="critter" && !cell.cleared){
    // v0.18.2 (#6): non-moving critter encounter -- squash it (Forest Reputation -1) or
    // spare it (+1), see screenCritterEncounter().
    GF.goto("critterEncounter",{maze_depth:maze.depth, critter_cell_idx:targetIdx});
    return;
  }
  if(cell.type==="chest" && !cell.cleared){
    GF.goto("chestEncounter",{maze_depth:maze.depth, chest_cell_idx:targetIdx});
    return;
  }
  if(cell.type==="stronghold_guardian" && !cell.cleared){
    PS.tickXpBuff();
    GF.goto("combat",{maze_depth:maze.depth, pending_monster_id:cell.guardianMonsterId, pending_guardian_cell_idx:targetIdx, pending_roamer_id:null});
    return;
  }
  if(cell.type==="stronghold_chest" && !cell.cleared){
    // Only reachable at all once isWalkable's chestLocked check has cleared (see
    // screenMaze/keydown handler), i.e. at least one guardian is already down.
    GF.goto("strongholdChest",{maze_depth:maze.depth, stronghold_chest_cell_idx:targetIdx});
    return;
  }

  // v0.16 (#333): grass tiles gradually get trampled bare after repeated steps, and stop
  // spawning encounters once fully trampled -- fixes players farming easy encounters by
  // pacing back and forth between 2 adjacent grass tiles forever. The counter lives only
  // on the in-memory cell object (see ensureMaze()/generateMaze()'s established "maze
  // state resets on reload, not persisted" convention, same as discovered/cleared/
  // wasHidden), capped at 3. Incrementing happens BEFORE the encounter-eligibility check
  // below, so the 3rd step onto a tile is the one that both reaches the cap AND is the
  // last chance for an encounter to fire on it -- from the 4th step on, that tile is safe.
  // screenMaze()'s tile-color interpolation (see interpolateHexColor() near TILE_COLOR)
  // uses this same 0-3 range to visually fade the tile from grass to dirt color.
  if(cell.type==="grass"){
    cell.trampleCount=Math.min(3,(cell.trampleCount||0)+1);
  }

  // Monsters only lurk in tall grass that hasn't been trampled bare yet -- dirt paths,
  // fully-trampled grass, and other special tiles are always safe.
  if(cell.type==="grass" && (cell.trampleCount||0)<3 && Math.random()<Balance.ENCOUNTER_CHANCE_PER_STEP){
    PS.tickXpBuff();
    const monster=DL.pickRandomMonsterForArea(maze.depth);
    // Bug fix (v0.12): pending_guardian_cell_idx MUST be explicitly cleared here. GF.goto
    // only Object.assign()s the keys it's given, so a leftover guardian-cell index from a
    // PREVIOUS Stronghold fight this session would otherwise still be sitting on GF and
    // get picked up by ensureCombat()'s isGuardian check for this completely unrelated,
    // ordinary grass encounter -- that's what was turning every regular mob into a
    // "Guardian" (with the tripled HP and Stronghold Key drop chance) once you'd fought
    // even one real guardian.
    GF.goto("combat",{maze_depth:maze.depth, pending_monster_id:monster.id, pending_guardian_cell_idx:null, pending_roamer_id:null});
    return;
  }
  autosave();
  render();
  animateMazeMovers(prevPlayerIdx,prevRoamerPositions);
}

// v0.16 (#332): shared by the keydown handler below AND the on-screen mobile D-pad (see
// screenMaze()'s .maze-mobile-arrows) -- same bounds/boulder/locked-Stronghold-chest
// validity checks either way, just extracted so the two input methods can't drift apart.
function attemptMazeMove(dx,dy){
  const maze=GF.overworld_snapshot; if(!maze) return;
  const px=maze.playerIdx%maze.size, py=Math.floor(maze.playerIdx/maze.size);
  const nx=px+dx, ny=py+dy;
  if(nx<0||nx>=maze.size||ny<0||ny>=maze.sizeH) return;
  const ni=ny*maze.size+nx;
  if(maze.cells[ni].type==="boulder") return;
  if(maze.cells[ni].type==="stronghold_chest" && !strongholdChestUnlocked(maze)) return;
  onStepMaze(maze,ni);
}

// v0.18 (#16): configurable maze movement keybinds -- Arrow Keys always work (never
// disabled, no matter what's selected below, so nobody's existing muscle memory ever
// breaks), and the player can ALSO opt into WASD or ZQSD (AZERTY) as an additional set of
// keys that do the exact same attemptMazeMove() calls. Purely a local display/input
// preference -- stored in Storage_ (localStorage, falls back to in-memory), never sent to
// the server or attached to a character, so there's zero data-loss risk here either way.
const KEYBIND_STORAGE_KEY="wandrian_keybind_scheme";
const KEYBIND_SCHEMES={
  arrows:{label:"Arrow Keys only", extraUp:[], extraDown:[], extraLeft:[], extraRight:[]},
  wasd:{label:"WASD", extraUp:["w","W"], extraDown:["s","S"], extraLeft:["a","A"], extraRight:["d","D"]},
  zqsd:{label:"ZQSD (AZERTY)", extraUp:["z","Z"], extraDown:["s","S"], extraLeft:["q","Q"], extraRight:["d","D"]},
};
function getKeybindScheme(){
  const v=Storage_.getItem(KEYBIND_STORAGE_KEY);
  return KEYBIND_SCHEMES[v]?v:"arrows";
}
function setKeybindScheme(v){
  if(!KEYBIND_SCHEMES[v]) return;
  Storage_.setItem(KEYBIND_STORAGE_KEY,v);
}

// v0.18 (#16): Settings screen -- currently just the keybind picker, reached via the
// top-bar "Settings" link. Same "remember where I came from, Back returns there" pattern
// as screenChangelog()/GF._preChangelogScreen.
function keybindSchemeButton(key){
  const selected=getKeybindScheme()===key;
  return h("button",{
    style:{background:selected?"var(--accent,#3a6a2a)":undefined,borderColor:selected?"#7ac67a":undefined},
    onClick:()=>{ setKeybindScheme(key); render(); },
  },[KEYBIND_SCHEMES[key].label]);
}
function screenSettings(){
  const root=h("div",{});
  root.appendChild(h("h2",{},["Settings"]));
  root.appendChild(h("button",{style:{marginBottom:"10px"},onClick:()=>{ GF.goto(GF._preSettingsScreen||"town"); }},["← Back"]));
  root.appendChild(h("div",{class:"panel",style:{marginBottom:"12px"}},[
    h("div",{style:{fontWeight:"bold",marginBottom:"6px"}},["Maze Movement Keys"]),
    h("div",{class:"muted",style:{marginBottom:"10px"}},["Arrow Keys always move you through the maze. Pick an additional set below if you'd rather use your left hand -- both work at the same time, so switching back is always free."]),
    h("div",{class:"row gap"},[
      keybindSchemeButton("arrows"),
      keybindSchemeButton("wasd"),
      keybindSchemeButton("zqsd"),
    ]),
  ]));
  return root;
}

window.addEventListener("keydown",(e)=>{
  if(GF.screen!=="maze") return;
  const arrowMap={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  let d=arrowMap[e.key];
  if(!d){
    const scheme=KEYBIND_SCHEMES[getKeybindScheme()];
    if(scheme.extraUp.includes(e.key)) d=[0,-1];
    else if(scheme.extraDown.includes(e.key)) d=[0,1];
    else if(scheme.extraLeft.includes(e.key)) d=[-1,0];
    else if(scheme.extraRight.includes(e.key)) d=[1,0];
  }
  if(!d) return;
  e.preventDefault();
  attemptMazeMove(d[0],d[1]);
});

// v0.18 (#15) mobile UX fix: every info tooltip in the game (weapon/herb/potion details,
// gear stats, the item "Comparison" box) is built on a shared .tooltip/.gear-compare-wrap
// CSS :hover mechanism -- which never opens at all on a touch device, since touchscreens
// have no hover state. Rather than rework each of the ~15 call sites that build one of
// these (see IF.tooltipText() callers throughout), a single delegated tap handler here
// toggles a class that the CSS above (see .tooltip.tooltip-open / .gear-compare-wrap.
// compare-open) treats identically to :hover -- fixes every tooltip in the game from one
// place, works alongside the existing desktop :hover behavior without changing it at all.
function closestWithClass(el,className){
  while(el && el.nodeType===1){
    if(el.classList && el.classList.contains(className)) return el;
    el=el.parentElement;
  }
  return null;
}
document.addEventListener("click",(e)=>{
  const tipEl=closestWithClass(e.target,"tooltip");
  const wrapEl=closestWithClass(e.target,"gear-compare-wrap");
  document.querySelectorAll(".tooltip-open").forEach(el=>{ if(el!==tipEl) el.classList.remove("tooltip-open"); });
  document.querySelectorAll(".compare-open").forEach(el=>{ if(el!==wrapEl) el.classList.remove("compare-open"); });
  if(tipEl) tipEl.classList.toggle("tooltip-open");
  if(wrapEl) wrapEl.classList.toggle("compare-open");
});

/* ================= COMBAT ================= */

function ensureCombat(){
  const guardianCellIdx=GF.pending_guardian_cell_idx!=null?GF.pending_guardian_cell_idx:null;
  // v0.18 (#2): a roaming mob is identified by its stable `roamerId`, not a cell index (its
  // tile changes every player step -- see tickRoamingMobs()) -- included in this "is this
  // still the same encounter, or a brand new one" guard exactly like guardianCellIdx is, so
  // navigating away and back mid-fight doesn't reset it, but a genuinely different roamer
  // (or guardian, or ordinary encounter) always does get a fresh GF.combat object.
  const roamerId=GF.pending_roamer_id!=null?GF.pending_roamer_id:null;
  if(!GF.combat || GF.combat.monster_id!==GF.pending_monster_id || GF.combat.guardianCellIdx!==guardianCellIdx || GF.combat.roamerId!==roamerId){
    const base=DL.getMonster(GF.pending_monster_id);
    // v0.17.3 (#16) AUDIT: Kill Streak no longer scales monster HP/damage at all -- see
    // Balance.KILL_STREAK_MAGIC_FIND_PCT_PER_KILL's comment for why that old behavior was
    // removed. Stronghold guardians (v0.12): same per-area-level damage as an ordinary
    // monster, but Balance.STRONGHOLD_GUARDIAN_HP_MULT (3x) more HP, per Gwen's spec:
    // "extra strong mobs... damage quite equal to regular mobs".
    const isGuardian=guardianCellIdx!=null;
    // v0.18 (#2): unlike a guardian, a roaming mob is tougher in BOTH stats per Gwen's
    // spec -- "more hitpoints than the guardians currently have, and they also deal more
    // damage" -- see Balance.ROAMING_MOB_HP_MULT/ROAMING_MOB_DAMAGE_MULT's declaration.
    const isRoamer=roamerId!=null;
    const hpMult=isGuardian?Balance.STRONGHOLD_GUARDIAN_HP_MULT:isRoamer?Balance.ROAMING_MOB_HP_MULT:1;
    const dmgMult=isRoamer?Balance.ROAMING_MOB_DAMAGE_MULT:1;
    const maxHp=Balance.monsterHp(base.base_hp,GF.maze_depth)*hpMult;
    // v0.17 (#18): guardians are worth extra XP (see STRONGHOLD_GUARDIAN_XP_MULT) -- they
    // already cost 3x the HP and a real fight to bring down, but used to hand out the same
    // XP as an ordinary mob of that area level. v0.17.2 (#1) HOTFIX: this was 4x, reverted
    // to 1.5x per ImpulseBE's balance check -- 4x was overtuned relative to the fight.
    const xpMult=isGuardian?Balance.STRONGHOLD_GUARDIAN_XP_MULT:isRoamer?Balance.ROAMING_MOB_XP_MULT:1;
    const name=isGuardian?`Guardian ${base.name}`:isRoamer?`Roaming ${base.name}`:base.name;
    GF.combat={monster_id:base.id, name, hp:maxHp, maxHp, dmgMin:Balance.monsterDamage(base.base_damage_min,GF.maze_depth)*dmgMult, dmgMax:Balance.monsterDamage(base.base_damage_max,GF.maze_depth)*dmgMult, xp:Balance.monsterXpReward(base.base_xp,GF.maze_depth)*xpMult, goldMin:base.gold_min, goldMax:base.gold_max, loot_table:base.loot_table, log:[], isGuardian, guardianCellIdx, isRoamer, roamerId};
    // v0.17 (#16): 50% chance the monster gets an unavoidable first strike the instant this
    // encounter is created, before the player can act at all -- see MONSTER_FIRST_STRIKE_
    // CHANCE's comment above for the full rationale and why this floors at 1 HP instead of
    // being able to kill outright.
    if(Math.random()<Balance.MONSTER_FIRST_STRIKE_CHANCE){
      let mdmg=randRange(GF.combat.dmgMin,GF.combat.dmgMax);
      mdmg*=(1.0-PS.getArmor());
      PS.current_hp=Math.max(1,PS.current_hp-mdmg);
      combatLog(GF.combat,`The ${GF.combat.name} strikes first, hitting you for ${Math.round(mdmg)} damage before you can react!`);
    }
  }
  return GF.combat;
}

// v0.17 (#10): cap raised 5 -> 10 alongside doubling the log panel's height (see
// screenCombat()'s logDiv), so the taller box actually fills with more combat history
// instead of just adding empty space below the same old 5 lines.
function combatLog(cb,msg){ cb.log.push(msg); if(cb.log.length>10) cb.log.shift(); }

// v0.18 (#12): maze-event message log -- same capped-append shape as combatLog() above,
// but backed by GF.mazeLog (a single running log for the whole maze session) rather than a
// per-combat object, since these fire outside of combat (exhaustion warnings, ankle-bite
// traps, shrines) while the player is just walking around. See mazeLogBox() for rendering.
function mazeLog(msg){ GF.mazeLog.push(msg); if(GF.mazeLog.length>10) GF.mazeLog.shift(); }
// Renders as a small fixed-height, always-present panel (never conditionally added/removed
// like the old toastBox() banner was) so new entries scroll within their own box instead of
// shifting anything else on the maze screen up or down.
function mazeLogBox(){
  return h("div",{class:"muted panel",style:{marginTop:"6px",marginBottom:"6px",height:"70px",overflowY:"auto"}},
    GF.mazeLog.length===0?[h("div",{},["Nothing has happened yet. Explore..."])]:GF.mazeLog.map(l=>h("div",{},[l])));
}

function grantLoot(lootTable, mult){
  // v0.18.2 (#9): Magic Find now also improves the odds of getting SOME loot at all (see
  // DL.rollLoot()'s reroll-on-"nothing"), not just which rarity a successful gear roll lands
  // on -- passed through here so every grantLoot() call site (monster kills, chests) benefits
  // automatically without each needing its own change.
  const loot=DL.rollLoot(lootTable, PS.getMagicFind());
  if(loot.type==="gear"){
    const tier=Balance.rollItemTier(GF.maze_depth);
    const inst=IF.generate(tier);
    // v0.15: auto-equip straight onto the character if the matching slot is empty
    // (and the level requirement allows it), instead of always taking a backpack slot.
    const willAutoEquip=PS.canAutoEquip(inst);
    if(PS.addGearAutoEquip(inst)){
      // v0.18 (#9): item drops shown briefly with their SVG icon in rarity color.
      spawnFloatItem("player",inst);
      return willAutoEquip?`Found and equipped ${IF.displayName(inst)}!`:`Found ${IF.displayName(inst)}!`;
    }
    return `Found gear but your bags are full, it was left behind.`;
  }
  if(loot.type==="consumable"){ PS.addConsumable(loot.item_id,1); return `Found a ${DL.getItem(loot.item_id).name}.`; }
  if(loot.type==="herb"){ PS.addHerb(loot.herb_id,1); return `Found ${DL.getHerb(loot.herb_id).name}.`; }
  return "";
}

// Shared by every death path (monster combat, a lethal Trap) so the graveyard entry,
// global-chat announcement, and softcore penalty toast are always consistent. `cause` is
// the graveyard/announce text ("Slain by a Wolf", "Slain by a Trap"); `defeatedLine` is
// just the opening clause of the softcore toast, e.g. "You were defeated" or "The trap
// proves fatal".
function applyDeathAndRedirect(cause, defeatedLine){
  const cd=PS.getClassData();
  const announcePayload={character_name:PS.character_name, level:PS.level, class_name:cd.display_name||PS.class_id, cause:`been ${cause.charAt(0).toLowerCase()}${cause.slice(1)}`};
  const result=PS.handleDeath(cause);
  if(result.dead){
    // v0.16 (#335): land the player straight on the Graveyard instead of the character
    // select menu -- their fallen hero's own fresh memorial (see screenGraveyard()'s
    // spotlight treatment) is right there waiting, instead of forcing an extra manual
    // click through to go look at it themselves.
    setToast("Your journey ends here. A new entry has been added to the Graveyard.");
    Net.announceDeath(announcePayload);
    GF.goto("graveyard");
  }
  else {
    // v0.12: spell out exactly what the death penalty took, so losing gear/xp on death
    // doesn't read as a bug -- see PS.applyDeathPenalty/_rollDeathItemLosses. v0.13 added
    // the experience loss to that same spelled-out message.
    const p=result.penalty;
    const intro=`${defeatedLine} and wake up back at camp with ${Balance.DEATH_WAKE_HP} HP, having lost ${p.goldLost} gold and ${p.xpLost} experience.`;
    if(p.itemsLost.length>0){
      // v0.17 (#14): each lost item's name is now colored to match its normal rarity (gold
      // Legendary, blue Magical, etc, reusing the same .rarity-* CSS classes used
      // everywhere else an item name is shown), instead of one flat plain-text line --
      // makes it visually obvious at a glance just how bad a given death actually was.
      // Consumables have no rarity (p.itemsLost[i].rarity is null for those, see
      // PS._loseOneRandomItem()) and just render as plain text like before.
      const nodes=[intro+" You also lost: "];
      p.itemsLost.forEach((item,i)=>{
        if(i>0) nodes.push(", ");
        nodes.push(item.rarity ? h("span",{class:"rarity-"+item.rarity,style:{fontWeight:"bold"}},[item.text]) : item.text);
      });
      nodes.push(".");
      setToastNodes(nodes);
    } else {
      setToast(intro);
    }
    resetMazePositionToStart();
    PS.saveGame();
    GF.goto("town");
  }
  return result;
}

function endCombatDeath(){
  const monsterName=GF.combat.name;
  GF.combat=null;
  applyDeathAndRedirect(`Slain by a ${monsterName}`, "You were defeated");
}

// v0.13: traps can now kill outright (see onStepMaze) -- a hardcore character slain this
// way gets the same graveyard/announce treatment as a monster kill, just with "a Trap" as
// the cause instead of a monster name.
function handleTrapDeath(){
  applyDeathAndRedirect("Slain by a Trap", "The trap proves fatal");
}

function screenCombat(){
  const cb=ensureCombat();
  const root=h("div",{});
  root.appendChild(h("h2",{},[cb.defeated?`The ${cb.name} lies defeated.`:`A wild ${cb.name} blocks the path!`]));
  root.appendChild(statHeader());

  const portraitWrap=h("div",{style:{width:"140px",height:"140px",margin:"0 auto 8px"}});
  portraitWrap.innerHTML=monsterPortrait(cb.monster_id,{slain:cb.defeated});
  // v0.18.1 (#23): the entire monster tile is now clickable to attack, not just the small
  // "Attack" button below it -- per Gwen's spec, players expect to be able to click directly
  // on the monster itself. Only wired up while the fight is still ongoing (cb.defeated is
  // handled by its own early-return branch further down, before the Attack button even
  // exists, so this mirrors that same gating). playerTurn() is declared further down in this
  // same function, but function declarations are hoisted, so it's already callable here.
  const mobPanel=h("div",{
    class:"panel",
    style:{flex:"0 0 50%",maxWidth:"50%",cursor:cb.defeated?"default":"pointer"},
    onClick:cb.defeated?undefined:()=>playerTurn(),
  },[
    portraitWrap,
    h("div",{style:{fontWeight:"bold",textAlign:"center"}},[cb.name]),
    h("div",{style:{textAlign:"center"}},[`HP ${Math.round(Math.max(0,cb.hp))}/${Math.round(cb.maxHp)}`]),
    // v0.18 (#9): position:relative wrapper so floatLayer("monster")'s absolutely-positioned
    // damage/CRIT/Blocked text has this exact bar to hover above, same pattern as hpBar()'s
    // own bar-bg for the player's side.
    h("div",{style:{position:"relative"}},[bar(Math.max(0,cb.hp)/cb.maxHp*100,"bar-hp"), floatLayer("monster")]),
  ]);
  // v0.17.1 BUG FIX: a fixed 140px cap on the log panel meant that once the monster panel's
  // OWN natural height (portrait + name + HP text + bar, with padding) grew past 140px, the
  // log box ended up visibly shorter than the monster panel next to it -- room to spare
  // below, forcing a scrollbar for a big fight that didn't actually need one yet. Dropping
  // the fixed height and switching the row to align-items:stretch (the flex default -- the
  // old explicit flex-start override was what broke this) makes the log panel's height
  // always match whichever sibling is taller (in practice, the monster panel), with
  // overflowY:auto still scrolling once combat history genuinely exceeds that height.
  const logDiv=h("div",{class:"muted panel",style:{flex:"1",minWidth:"0",minHeight:"0",overflowY:"auto"}},cb.log.map(l=>h("div",{},[l])));
  root.appendChild(h("div",{class:"row",style:{alignItems:"stretch",gap:"14px"}},[mobPanel,logDiv]));

  if(cb.defeated){
    root.appendChild(h("div",{class:"panel",style:{background:"#2a3a20",borderColor:"#5a7a3a",margin:"12px 0"}},[cb.result_text]));
    root.appendChild(h("div",{class:"row"},[
      h("button",{onClick:()=>{ GF.combat=null; GF.goto("maze",{maze_depth:GF.maze_depth}); }},["Continue Wandering"]),
    ]));
    return root;
  }

  function playerTurn(){
    // v0.17.1 (#12): capture whether the two combat-round-scoped shrine buffs (Invuln/Quad
    // Damage) are active BEFORE ticking them down -- so the round that brings a counter from
    // 1 to 0 still actually gets the benefit it was granted for (ticking first, then
    // checking, would silently shortchange the buff's very last round every time).
    const quadActiveThisRound=PS.hasQuadDamage();
    const invulnActiveThisRound=PS.isInvulnerable();
    PS.tickCombatRoundBuffs();
    // v0.17 (#11): monster block chance -- scales with area level, see
    // Balance.mobBlockChance(). A blocked swing deals no damage and doesn't count toward
    // weapon-skill proficiency (nothing actually landed), but the monster still gets its
    // normal turn right after, same as the player's own block chance only cancels ONE
    // side's hit for the round.
    const mobBlocked=Math.random()<Balance.mobBlockChance(GF.maze_depth);
    if(mobBlocked){
      combatLog(cb,`The ${cb.name} blocks your attack!`);
      spawnFloat("monster","Blocked","float-text-block");
    } else {
      const [lo,hi]=PS.getDamageRange();
      let dmg=randRange(lo,hi);
      const crit=Math.random()<PS.getCritChance();
      if(crit) dmg*=Balance.CRIT_MULTIPLIER;
      // v0.17.1 (#12): Quad Damage shrine -- x4 total damage output while active.
      if(quadActiveThisRound) dmg*=4;
      cb.hp-=dmg;
      combatLog(cb,`You hit the ${cb.name} for ${Math.round(dmg)} damage${crit?" (Critical!)":""}${quadActiveThisRound?" (Quad Damage!)":""}.`);
      // v0.18 (#9): "-110 HP" near the monster, "CRIT!" appended when it lands as a crit.
      spawnFloat("monster",`-${Math.round(dmg)} HP${crit?" CRIT!":""}`,crit?"float-text-crit":"float-text-dmg");
      // v0.12: every attack with a recognized weapon type equipped counts toward that
      // type's permanent proficiency (see PS.registerWeaponHit/getEquippedWeaponType).
      const weaponType=PS.getEquippedWeaponType();
      if(weaponType){
        const skillResult=PS.registerWeaponHit(weaponType);
        if(skillResult.leveledUp) combatLog(cb,`Your ${IF.WEAPON_TYPE_LABELS[weaponType]} proficiency reaches level ${skillResult.newLevel}!`);
      }
    }
    if(!mobBlocked && cb.hp<=0){
      cb.hp=0;
      // v0.17.3 (#16) AUDIT: gold/XP no longer get a Kill Streak multiplier -- see
      // Balance.KILL_STREAK_MAGIC_FIND_PCT_PER_KILL's comment. The streak's effect is
      // entirely via the Magic Find bonus rolled into PS.getMagicFind(), which grantLoot()
      // reads for BOTH halves of the loot roll: gear rarity (through IF.generate() ->
      // Balance.rollRarity(), unchanged since v0.17.1) AND, as of v0.18.2 (#9), the odds of
      // getting a drop at all (see DL.rollLoot()'s reroll-on-"nothing") -- so a longer
      // streak now means both better AND more loot on average, still with no flat XP/gold
      // multiplier.
      const gold=randIntRange(cb.goldMin,cb.goldMax);
      // v0.18.2 (#7): "Currently playing" is now also a community XP buff -- every kill's
      // XP gets multiplied by the current active-player count (1 = just yourself = no
      // bonus, 2 = double, 3 = triple, and so on -- see getGlobalXpMultiplier()'s comment).
      // Applied here, AFTER shrine/guardian/roamer xpMult already baked into cb.xp at
      // ensureCombat() time, so it stacks multiplicatively on top of those exactly like the
      // "Currently playing" spec describes ("experience gained is doubled for everyone"),
      // not folded into cb.xp itself -- cb.xp needs to stay the "base for this kill" number
      // in case anything else ever reads it before this multiplier is known.
      // v0.18.2.1 CORRECTION: Forest Reputation's positive bonus is a persistent PERCENTAGE
      // multiplier (+10% XP gained per point, for as long as you're in that tier's forest),
      // not the flat +10-XP-per-point bonus originally shipped in v0.18.2 -- it stacks
      // multiplicatively right alongside the "Currently playing" community multiplier above,
      // and is only ever a bonus, never a penalty when reputation is negative (see
      // PS.getForestReputationXpMult()).
      const xpGained=cb.xp*getGlobalXpMultiplier()*PS.getForestReputationXpMult();
      // v0.18 (#7): captured BEFORE addXp() mutates PS.xp, so animateXpBarGrowth() below
      // (called after this kill's render()) knows where the bar visually started from.
      const preKillXpFraction=PS.xp_to_next>0?(PS.xp/PS.xp_to_next):0;
      const leveled=PS.addXp(xpGained);
      PS.addGold(gold);
      // v0.18 (#9): "+8 XP" in purple, gold amount in gold color -- both anchored near the
      // player's own stat row/HP bar, same as any other player-side floating text.
      spawnFloat("player",`+${Math.round(xpGained)} XP`,"float-text-xp");
      spawnFloat("player",`+${gold}g`,"float-text-gold");
      PS.incrementKillStreak();
      const lootMsg=grantLoot(cb.loot_table);
      cb.defeated=true;
      cb.result_text=`${cb.name} defeated! +${Math.round(xpGained)} XP, +${Math.round(gold)} gold. ${lootMsg}`;
      if(cb.isGuardian){
        // v0.12: beating a Stronghold guardian opens the direct path to that Stronghold's
        // chest (any 1 of the 4 is enough), and has its own independent 5% chance to drop
        // a Stronghold Key -- the only way to actually unlock the chest once you reach it.
        const maze=GF.overworld_snapshot;
        if(maze){
          const cell=maze.cells[cb.guardianCellIdx];
          if(cell){ cell.cleared=true; }
          if(maze.stronghold && cell && cell.guardianSlot!=null) maze.stronghold.guardianDefeated[cell.guardianSlot]=true;
        }
        // v0.12 bug fix: keys only drop in an area at or above the character's own level,
        // so a high-level character can't revisit a trivial low-level maze and farm
        // guaranteed-easy guardian kills for keys (see Balance.strongholdKeyEligible).
        const keyEligible=Balance.strongholdKeyEligible(GF.maze_depth, PS.level);
        if(keyEligible && Math.random()<Balance.STRONGHOLD_KEY_DROP_CHANCE){
          // v0.18 (#5): the dropped key's tier is fixed to the area level this guardian was
          // actually fought in (never the player's own level or anything else) -- exactly
          // what stops a player from farming keys at a low, easy area level and saving
          // them up to open a high-level chest later, per Gwen's stated reason for asking.
          const keyTier=Balance.strongholdKeyTierForAreaLevel(GF.maze_depth);
          PS.addConsumable(Balance.strongholdKeyItemIdForTier(keyTier),1);
          cb.result_text+=` It drops a Stronghold Key (Tier ${tierRomanNumeral(keyTier)})!`;
        } else if(keyEligible){
          cb.result_text+=" The path to the Stronghold's chest is open, if you can find a key.";
        } else {
          cb.result_text+=" The path to the Stronghold's chest is open, though this area is too tame for its guardians to yield a Stronghold Key.";
        }
      }
      // v0.18 (#2): a defeated roaming mob is gone for good, same as a cleared guardian --
      // marking it `defeated` here (rather than removing it from the array) keeps roamerId
      // indices stable for the rest of this maze's lifetime and is what both
      // tickRoamingMobs() and screenMaze()'s render loop already check for.
      if(cb.isRoamer){
        const maze=GF.overworld_snapshot;
        if(maze && maze.roamers){
          const r=maze.roamers.find(rr=>rr.roamerId===cb.roamerId);
          if(r) r.defeated=true;
        }
      }
      autosave();
      render();
      // v0.18 (#7): skipped on a level-up kill -- see animateXpBarGrowth()'s own comment
      // for why the old/new fractions aren't comparable once xp_to_next itself changed.
      if(!leveled) animateXpBarGrowth(preKillXpFraction);
      return;
    }
    // monster turn
    // v0.17.1 (#12): Touch of Unicorn (Invulnerability shrine) -- full damage immunity,
    // checked before the block-chance roll so an invulnerable round never even risks a
    // "block" log line implying the hit could otherwise have landed.
    if(invulnActiveThisRound){
      combatLog(cb,`The ${cb.name}'s attack passes through you harmlessly -- you are untouchable!`);
      spawnFloat("player","Immune!","float-text-block");
      autosave(); render(); return;
    }
    if(Math.random()<PS.getBlockChance()){
      combatLog(cb,`You block the ${cb.name}'s attack entirely!`);
      spawnFloat("player","Blocked","float-text-block");
      autosave(); render(); return;
    }
    let mdmg=randRange(cb.dmgMin,cb.dmgMax);
    mdmg*=(1.0-PS.getArmor());
    PS.current_hp-=mdmg;
    combatLog(cb,`The ${cb.name} hits you for ${Math.round(mdmg)} damage.`);
    // v0.18 (#9): "-4 HP" in red near the player's HP bar.
    spawnFloat("player",`-${Math.round(mdmg)} HP`,"float-text-dmg");
    // Anything below 1 HP is dead, a fractional sliver (e.g. 0.4) used to display as
    // "0 HP" and read as alive, letting players survive a fight at what looked like 0 HP
    // only to be one-shot next encounter. Treat "rounds down to 0" as actually dead.
    if(PS.current_hp<1){ PS.current_hp=0; endCombatDeath(); return; }
    autosave();
    render();
  }

  // v0.14: fleeing now has a Balance.FLEE_FAIL_CHANCE (20%) chance to fail outright --
  // the monster gets one more attack (same block-chance/armor math as its normal turn)
  // and you're still in combat, free to try fleeing again (which can fail again on bad
  // luck, no cap on attempts). A death on a failed flee attempt ends combat via the
  // normal endCombatDeath() path, same as any other monster hit.
  function attemptFlee(){
    if(Math.random()<Balance.FLEE_FAIL_CHANCE){
      combatLog(cb,"You fail to flee!");
      if(Math.random()<PS.getBlockChance()){
        combatLog(cb,`You block the ${cb.name}'s attack entirely!`);
        spawnFloat("player","Blocked","float-text-block");
      } else {
        let mdmg=randRange(cb.dmgMin,cb.dmgMax);
        mdmg*=(1.0-PS.getArmor());
        PS.current_hp-=mdmg;
        combatLog(cb,`The ${cb.name} hits you for ${Math.round(mdmg)} damage.`);
        spawnFloat("player",`-${Math.round(mdmg)} HP`,"float-text-dmg");
        if(PS.current_hp<1){ PS.current_hp=0; endCombatDeath(); return; }
      }
      autosave();
      render();
      return;
    }
    GF.combat=null; resetMazePositionToStart(); PS.saveGame(); setToast("You flee back to camp, but remember your way through these woods."); GF.goto("town");
  }

  root.appendChild(h("div",{class:"row",style:{marginTop:"10px"}},[
    h("button",{class:"play",onClick:playerTurn},["Attack"]),
    h("button",{disabled:!PS.canUseConsumable(PS.bestAvailableConsumable("health")),onClick:()=>{ PS.useConsumable(PS.bestAvailableConsumable("health")); autosave(); render(); }},["Use Health Potion"]),
    h("button",{disabled:!PS.canUseConsumable(PS.bestAvailableConsumable("stamina")),onClick:()=>{ PS.useConsumable(PS.bestAvailableConsumable("stamina")); autosave(); render(); }},["Use Stamina Potion"]),
    h("button",{disabled:!PS.canUseConsumable("antidote"),onClick:()=>{ PS.useConsumable("antidote"); autosave(); render(); }},["Use Antidote"]),
    h("button",{class:"danger",onClick:attemptFlee},["Flee"]),
  ]));
  return root;
}

/* ================= CHEST ================= */

function ensureChest(){
  if(!GF.chest || GF.chest.cell_idx!==GF.chest_cell_idx){
    GF.chest={cell_idx:GF.chest_cell_idx, hits_required:randIntRange(Balance.CHEST_HITS_MIN,Balance.CHEST_HITS_MAX), hits_done:0};
  }
  return GF.chest;
}

function screenChest(){
  const chest=ensureChest();
  const root=h("div",{});
  root.appendChild(h("h2",{},["A weathered chest, bound in vines"]));
  root.appendChild(statHeader());
  root.appendChild(h("div",{class:"panel"},[
    h("div",{},[`Pry it open: ${chest.hits_done}/${chest.hits_required} hits`]),
    bar(chest.hits_done/chest.hits_required*100,"bar-gold"),
  ]));
  root.appendChild(h("div",{class:"row",style:{marginTop:"10px"}},[
    h("button",{class:"play",onClick:()=>{
      chest.hits_done++;
      if(chest.hits_done>=chest.hits_required){
        const tier=Balance.itemTierForAreaLevel(GF.maze_depth);
        const mult=Balance.CHEST_LOOT_MULTIPLIER;
        let msgs=[];
        const g1=grantLoot("epic",mult); if(g1) msgs.push(g1);
        if(Math.random()<Balance.CHEST_SCROLL_CHANCE){
          const scroll=pick(["scroll_of_challenge_1","scroll_of_challenge_2","scroll_of_challenge_3"]);
          PS.addConsumable(scroll,1); msgs.push(`Found a ${DL.getItem(scroll).name}!`);
        }
        const goldFound=Math.round(randIntRange(10,30)*mult);
        PS.addGold(goldFound); msgs.push(`+${goldFound} gold.`);
        if(GF.overworld_snapshot) GF.overworld_snapshot.cells[chest.cell_idx].cleared=true;
        GF.chest=null; PS.saveGame();
        setToast("The chest creaks open! "+msgs.join(" "));
        GF.goto("maze",{maze_depth:GF.maze_depth});
        return;
      }
      render();
    }},["Pry it open"]),
    h("button",{onClick:()=>{ GF.chest=null; GF.goto("maze",{maze_depth:GF.maze_depth}); }},["Leave it"]),
  ]));
  return root;
}

/* ================= STRONGHOLD CHEST ================= */
// The reward for clearing a Stronghold: reachable only once >=1 of the 4 guardians is
// down (see strongholdChestUnlocked/onStepMaze), and only actually openable with a
// Stronghold Key (see the guardian kill-reward roll in screenCombat's playerTurn).

function screenStrongholdChest(){
  const root=h("div",{});
  const maze=GF.overworld_snapshot;
  const cellIdx=GF.stronghold_chest_cell_idx;
  root.appendChild(h("h2",{},["A locked Stronghold chest"]));
  root.appendChild(h("div",{class:"lore"},["Iron-bound and half-buried in roots. Whatever the guardians were protecting, it's still in here."]));
  const t=toastBox(); if(t) root.appendChild(t);
  root.appendChild(statHeader());

  // v0.18 (#5): a chest only accepts a key of the SAME tier as the area it's standing
  // in -- exactly Gwen's spec ("this avoids farming Keys at low levels and then saving
  // them up and applying them later at high level area chests"). The required tier is
  // derived from the chest's own area level (GF.maze_depth), the identical mapping used
  // when a guardian's kill roll decides what tier key to drop in the first place, so a
  // key farmed in THIS area (or any other area of the same tier bracket) always works.
  const requiredTier=Balance.strongholdKeyTierForAreaLevel(GF.maze_depth);
  const requiredKeyId=Balance.strongholdKeyItemIdForTier(requiredTier);
  const keyCount=PS.consumables[requiredKeyId]||0;
  if(keyCount<=0){
    root.appendChild(h("div",{class:"panel"},[`This chest is sealed tight, you'll need a Tier ${tierRomanNumeral(requiredTier)} Stronghold Key to open it (this area is Tier ${tierRomanNumeral(requiredTier)}) -- a key of any other tier won't fit. Guardians have a small chance to drop one matching their own area's tier when defeated.`]));
    root.appendChild(h("div",{class:"row",style:{marginTop:"10px"}},[
      h("button",{onClick:()=>{ GF.goto("maze",{maze_depth:GF.maze_depth}); }},["Leave it"]),
    ]));
    return root;
  }

  root.appendChild(h("div",{class:"panel"},[`You have ${keyCount} Tier ${tierRomanNumeral(requiredTier)} Stronghold Key${keyCount===1?"":"s"}, a match for this area. Use one to open this chest?`]));
  root.appendChild(h("div",{class:"row",style:{marginTop:"10px"}},[
    h("button",{class:"play",onClick:()=>{
      PS._removeConsumableOne(requiredKeyId);
      const tier=Balance.rollItemTier(GF.maze_depth);
      const msgs=[];

      const gearCount=randIntRange(Balance.STRONGHOLD_CHEST_GEAR_COUNT_MIN,Balance.STRONGHOLD_CHEST_GEAR_COUNT_MAX);
      let gearFound=0, gearLeftBehind=0;
      for(let i=0;i<gearCount;i++){
        const inst=IF.generate(tier,"",pick(["Rare","Epic"]));
        if(PS.addGearAutoEquip(inst)) gearFound++; else gearLeftBehind++;
      }
      msgs.push(`${gearFound} rare/epic item${gearFound===1?"":"s"} of gear`+(gearLeftBehind>0?` (${gearLeftBehind} left behind, bags full)`:""));

      const goldFound=randIntRange(Balance.STRONGHOLD_CHEST_GOLD_MIN,Balance.STRONGHOLD_CHEST_GOLD_MAX);
      PS.addGold(goldFound); msgs.push(`${goldFound} gold`);

      const herbTotal=randIntRange(Balance.STRONGHOLD_CHEST_HERBS_MIN,Balance.STRONGHOLD_CHEST_HERBS_MAX);
      for(let i=0;i<herbTotal;i++) PS.addHerb(DL.pickHerbForNode(GF.maze_depth),1);
      msgs.push(`${herbTotal} herbs`);

      // v0.12.1: Stronghold loot hands out the top of the potion ladder (Greater/Supreme),
      // not the base tier -- this chest is supposed to be "pretty good loot", so its
      // potions shouldn't be the same ones a common Sprout can drop.
      const potionTotal=randIntRange(Balance.STRONGHOLD_CHEST_POTIONS_MIN,Balance.STRONGHOLD_CHEST_POTIONS_MAX);
      let healthGiven=0, staminaGiven=0;
      for(let i=0;i<potionTotal;i++){
        const healthTier=pick(["greater_health_potion","supreme_health_potion"]);
        const staminaTier=pick(["greater_stamina_potion","supreme_stamina_potion"]);
        if(Math.random()<0.5){ PS.addConsumable(healthTier,1); healthGiven++; } else { PS.addConsumable(staminaTier,1); staminaGiven++; }
      }
      msgs.push(`${healthGiven} health & ${staminaGiven} stamina potions`);

      if(Math.random()<Balance.STRONGHOLD_CHEST_SCROLL_CHANCE){
        const scroll=pick(["scroll_of_challenge_1","scroll_of_challenge_2","scroll_of_challenge_3"]);
        PS.addConsumable(scroll,1); msgs.push(DL.getItem(scroll).name);
      }
      if(Math.random()<Balance.STRONGHOLD_CHEST_EYESIGHT_CHANCE){
        PS.addConsumable("elixir_of_eyesight",1); msgs.push("an Elixir of Eyesight");
      }
      if(Math.random()<Balance.STRONGHOLD_CHEST_BAG_CHANCE){
        const bagIds=Object.keys(ITEMS).filter(id=>ITEMS[id].type==="bag");
        const bagId=pick(bagIds);
        const result=PS.equipBag(bagId);
        msgs.push(result.success?ITEMS[bagId].name:`${ITEMS[bagId].name} (couldn't fit, bag rack full)`);
      }

      if(maze){
        const cell=maze.cells[cellIdx];
        if(cell) cell.cleared=true;
        if(maze.stronghold) maze.stronghold.opened=true;
      }
      PS.saveGame();
      setToast("The chest creaks open! You find: "+msgs.join(", ")+".");
      GF.goto("maze",{maze_depth:GF.maze_depth});
    }},["Unlock with Key"]),
    h("button",{onClick:()=>{ GF.goto("maze",{maze_depth:GF.maze_depth}); }},["Leave it"]),
  ]));
  return root;
}

/* ================= HERB GATHERING ================= */

function ensureHerbNode(){
  if(!GF.herbNode || GF.herbNode.cell_idx!==GF.herb_cell_idx){
    GF.herbNode={cell_idx:GF.herb_cell_idx, herb_id:DL.pickHerbForNode(GF.maze_depth), ticks_required:randIntRange(2,4), ticks_done:0};
  }
  return GF.herbNode;
}

function screenHerbEncounter(){
  const node=ensureHerbNode();
  const herb=DL.getHerb(node.herb_id);
  const root=h("div",{});
  root.appendChild(h("h2",{},[herb.rare?`A rare bloom, ${herb.name}`:`Gathering ${herb.name}`]));
  root.appendChild(h("div",{class:"lore"},["Careful hands find more than hasty ones. No danger here, just patience."]));
  root.appendChild(statHeader());
  root.appendChild(h("div",{class:"panel"},[
    h("div",{},[`Gathering: ${node.ticks_done}/${node.ticks_required}`]),
    bar(node.ticks_done/node.ticks_required*100,"bar-xp"),
  ]));
  root.appendChild(h("div",{class:"row"},[
    h("button",{onClick:()=>{
      node.ticks_done++;
      if(node.ticks_done>=node.ticks_required){
        // v0.18.1 (#25): herbalism points are now awarded ONLY here, on full completion of
        // the node -- not per click -- to close an exploit where a player could click
        // Gather once, then "Leave it" before finishing, and repeat on a fresh node forever
        // for free points with no herb ever collected. The node's full ticks_required is
        // credited at once, so a 4-strike herb still nets exactly 4 points overall, same
        // total as before -- it just can't be farmed piecemeal anymore.
        const skillResult=PS.registerHerbalismStrike(node.ticks_required);
        // v0.12: herb nodes are rarer than they used to be and cost a few clicks to work,
        // so the payout was bumped from a flat 1 up to a healthy 1-12 per node to make the
        // detour worth it.
        const qty=randIntRange(1,12);
        PS.addHerb(node.herb_id,qty);
        if(GF.overworld_snapshot) GF.overworld_snapshot.cells[node.cell_idx].cleared=true;
        GF.herbNode=null; autosave();
        setToast(`You gather ${qty}x ${herb.name}.`+(skillResult.leveledUp?` Your Herbalism proficiency reaches level ${skillResult.newLevel}!`:""));
        GF.goto("maze",{maze_depth:GF.maze_depth});
        return;
      }
      render();
    }},["Gather"]),
    h("button",{onClick:()=>{ GF.herbNode=null; GF.goto("maze",{maze_depth:GF.maze_depth}); }},["Leave it"]),
  ]));
  return root;
}
