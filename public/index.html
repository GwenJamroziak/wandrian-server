<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wandrian</title>
<!-- v0.16.1: Cinzel/Merriweather, used ONLY by the .auth-* onboarding screens below (the
     pre-login "Play Online" gate, Log In and Create Account forms) -- see redirect.html,
     the marketing landing page Gwen pointed at as the trustworthiness/professionalism bar
     to hit for a stranger's very first click in from itch.io/Battle.net/d2jsp. The rest of
     the game keeps its existing Georgia look untouched; this link is scoped by being
     unused outside those three screens' font-family declarations. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --hp:#d94a4a; --stamina:#eae6d9; --xp:#9e59d9; --gold:#e0b23d;
  --bg:#12140f; --panel:#1c2018; --panel2:#242a1e; --border:#3a4230;
  --text:#e8e4d8; --muted:#9a9686; --accent:#4a7a3a;
  /* v0.18.1 (#13): shared green/red for gear-compare stat deltas (Diablo-3-style +N/-N). */
  --good:#6fcf6f; --bad:#e0685f;
  /* v0.17 (#3): HP text/bar turn this color while Poisoned, instead of staying HP-red, so
     the ongoing drain reads as "a different status" rather than looking like normal combat
     damage. */
  --poison:#6fbf5a;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:Georgia,'Times New Roman',serif; background:radial-gradient(ellipse at 50% 20%,#2a3322,#0c0e09 75%);
  color:var(--text); min-height:100vh;
}
/* v0.18.1 (#5): general UI transition fluency -- a lightweight opacity fade whenever the
   player navigates to a genuinely different screen via GF.goto(), so screens ease into
   view instead of snapping. Deliberately NOT tied to every render() call (there are ~150
   of those -- quantity steppers, tab switches, equip/sell buttons, the 30s active-players
   poll, etc -- which must stay instant or this would flash constantly); see GF.goto() for
   how the opacity is toggled. Same "flip a starting value, then flip to the real value on
   the next tick" trick already used by animateXpBarGrowth() and the maze overlay fade. */
#app{max-width:1100px;margin:0 auto;padding:28px 24px 60px;transition:opacity .18s ease;}
h1,h2,h3{margin:0 0 6px;}
h1{font-size:2.4em;color:#fff;text-shadow:0 0 12px rgba(255,180,80,.35);}
.subtitle{color:#f0d9a0;font-size:1.05em;margin-bottom:10px;}
.lore{color:#d8d4c8;max-width:600px;line-height:1.5em;margin-bottom:14px;}
.muted{color:var(--muted);font-size:.85em;}
.flavor{color:#c0b8a0;font-style:italic;margin:6px 0 14px;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.col{display:flex;flex-direction:column;}
.gap{gap:8px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:16px 0;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 16px;}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
button{
  font-family:inherit;background:#2a3020;color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:10px 14px;cursor:pointer;font-size:.95em;transition:.12s;
}
button:hover:not(:disabled){background:#3a4a2a;border-color:#5a7a3a;}
button:disabled{opacity:.45;cursor:not-allowed;}
button.play:hover:not(:disabled){background:#3a4a2a;border-color:#5a7a3a;}
button.danger:hover:not(:disabled){background:#5a2a24;border-color:#8a4a3a;}
button.wide{width:100%;}
input[type=text],input[type=password],input[type=email],input[type=number],select{
  font-family:inherit;background:#1a1c14;border:1px solid var(--border);color:var(--text);
  border-radius:5px;padding:8px 10px;font-size:.95em;
}
input[type=text]:focus,input[type=password]:focus,input[type=email]:focus,input[type=number]:focus,select:focus{
  outline:none;border-color:#5a7a3a;box-shadow:0 0 0 2px rgba(90,122,58,.3);
}
select{cursor:pointer;}
/* Browsers force a white/yellow background on autofilled fields regardless of author
   CSS (username/password fields on the login/register screens are exactly the ones
   that trigger this), this is the standard workaround: paint the fill color via an
   absurdly long inset box-shadow transition instead of background, which autofill
   styling doesn't override. */
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{
  -webkit-text-fill-color:var(--text)!important;
  -webkit-box-shadow:0 0 0px 1000px #1a1c14 inset!important;
  box-shadow:0 0 0px 1000px #1a1c14 inset!important;
  transition:background-color 9999s ease-in-out 0s;
  caret-color:var(--text);
}
input[type=checkbox]{
  appearance:none;-webkit-appearance:none;width:19px;height:19px;border:1px solid var(--border);
  border-radius:4px;background:#1a1c14;cursor:pointer;position:relative;vertical-align:middle;flex:none;
}
input[type=checkbox]:hover{border-color:#5a7a3a;}
input[type=checkbox]:checked{background:var(--accent);border-color:#5a7a3a;}
input[type=checkbox]:checked::after{content:"✓";position:absolute;top:-3px;left:2.5px;color:#eef7e4;font-size:14px;font-weight:bold;}
.modal-backdrop{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px 22px;max-width:420px;box-shadow:0 8px 30px rgba(0,0,0,.6);}
.modal-box .row{justify-content:flex-end;margin-top:16px;}
.social-login-btn{display:flex;align-items:center;justify-content:center;gap:8px;}
/* v0.18 (#8): position:relative so the heal-preview overlay (see hpBar()/.bar-hp-heal-preview
   below) can be absolutely positioned underneath the real HP fill, both anchored to the same
   box. Every other bar (XP/stamina/gold/brew) still only ever has a single .bar-fill child, so
   this has no visible effect on them. */
.bar-bg{background:#000;border-radius:4px;overflow:hidden;height:16px;border:1px solid rgba(255,255,255,.08);position:relative;}
/* v0.17.3 (#8): linear (not the default ease) so a bar fed by frequent small width updates
   (see the Health Potion heal-over-time sub-tick interval) reads as one continuous smooth
   climb instead of a series of tiny decelerate-then-stop motions. v0.18 (#8): absolutely
   positioned (rather than relying on normal flow) so a second, wider .bar-fill sibling (the
   heal-preview overlay) can sit underneath it in the same box instead of pushing it aside. */
.bar-fill{position:absolute;top:0;left:0;height:100%;transition:width .25s linear;}
/* v0.18 (#8): the potion heal-preview overlay -- a lighter, more washed-out red than the
   normal HP fill, always rendered as a sibling underneath the real .bar-hp/.bar-hp-poisoned
   fill (source order: this div comes FIRST in hpBar()'s markup, the real fill LAST, so the
   real fill visually covers it everywhere except the "pending heal" band beyond its edge).
   Its width comes from PS.getPendingHealAmount() -- see that function's own comment for why
   it automatically shrinks the instant the player takes damage mid-heal, with no extra
   bookkeeping needed here. */
.bar-hp-heal-preview{background:#a85a5a;}
/* v0.18.1 (#20): stamina potions gained the exact same gradual-heal preview overlay as HP
   potions above -- same reasoning, just tinted toward the stamina bar's own hue. */
.bar-stamina-heal-preview{background:#4a7a8a;}
/* v0.18 (#6): the once-a-second town HP/Stamina regen tick used to just jump the bar to its
   new width every 1000ms with the fast .25s transition above -- the bar would ease for a
   quarter-second then sit dead still for the other three-quarters, reading as a visible
   "tick" rather than a steady climb. Applied ONLY to that tick (via refreshStatHeaderInPlace's
   `smooth` param) so a transition exactly as long as the tick interval keeps the bar
   perpetually mid-motion; combat/poison/heal-over-time updates keep the snappier default. */
.bar-fill-slow-tick{transition:width 1s linear;}
/* v0.18 (#7): the XP bar always carries this slower, ease-out transition -- combined with
   animateXpBarGrowth()'s old-value/new-value two-step (see its own comment), a kill's XP
   gain now visibly climbs into place over about a second instead of snapping there the
   instant render() rebuilds the bar. */
.bar-fill-xp-grow{transition:width 1s ease-out;}
.bar-hp{background:var(--hp);} .bar-stamina{background:var(--stamina);} .bar-xp{background:var(--xp);} .bar-gold{background:var(--gold);} .bar-brew{background:#c9a04a;}
/* v0.18 (#9): floating combat text -- damage/heal/XP/gold/CRIT/blocked/loot numbers that pop
   up briefly and fade over ~2s. See spawnFloat()/spawnFloatItem()/floatLayer() for the JS side
   (a `now - spawnTime` negative animation-delay trick lets a freshly re-rendered node -- every
   render() tears down and rebuilds the whole DOM -- resume this animation exactly where an
   OLDER node would have been, instead of restarting the fade from 0 on every unrelated
   re-render). `animation-fill-mode:forwards` (implied by the shorthand's trailing `forwards`)
   holds the final (opacity:0) frame afterward, so an entry that's aged out just sits invisible
   until floatLayer()'s own per-render pruning drops it from GF.floatingTexts entirely. */
.float-text-layer{position:absolute;top:-6px;left:0;width:100%;height:0;overflow:visible;pointer-events:none;z-index:5;}
.float-text{position:absolute;left:50%;transform:translateX(-50%);font-weight:bold;font-size:1.05em;white-space:nowrap;animation:floatUpFade 2s ease-out forwards;text-shadow:0 1px 3px rgba(0,0,0,.85);}
.float-text-item{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;font-weight:bold;white-space:nowrap;animation:floatUpFade 2s ease-out forwards;text-shadow:0 1px 3px rgba(0,0,0,.85);}
@keyframes floatUpFade{0%{transform:translate(-50%,0);opacity:1;}100%{transform:translate(-50%,-30px);opacity:0;}}
.float-text-dmg{color:#ff5c5c;} .float-text-heal{color:#6cff6c;} .float-text-xp{color:#b46cff;}
.float-text-gold{color:var(--gold);} .float-text-crit{color:#ffb400;font-size:1.2em;} .float-text-block{color:#9fb0c3;}
.hp-text{color:var(--hp);} .stamina-text{color:var(--stamina);} .xp-text{color:var(--xp);} .gold-text{color:var(--gold);}
/* v0.17 (#3/#8): Poisoned HP variants + the status icon's fade-out transition. */
.bar-hp-poisoned{background:var(--poison);}
.hp-text-poisoned{color:var(--poison);}
.poison-icon{transition:opacity 1.1s ease; display:inline-block;}
a.back-link,.linklike{color:#cbd9a0;cursor:pointer;text-decoration:underline;}
.icon-badge{width:56px;height:56px;border-radius:50%;overflow:hidden;flex:none;background:#000;display:flex;align-items:center;justify-content:center;}
.icon-badge svg{width:100%;height:100%;}
/* v0.18 (#13): Roman-numeral (I-V) tier badge, upper-left corner of a gear icon -- see
   gearIcon()/tierRomanNumeral(). Deliberately tiny + high-contrast so it reads at a glance
   without competing with the item's own rarity-colored art underneath it. */
.gear-tier-badge{position:absolute;top:-3px;left:-3px;min-width:13px;padding:0 2px;font-size:9px;line-height:13px;text-align:center;font-weight:bold;color:#fff;background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.35);border-radius:3px;pointer-events:none;z-index:2;}
.services{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0;}
.maze-wrap{display:flex;gap:20px;align-items:flex-start;}
.maze-grid{display:grid;gap:1px;background:#000;border:2px solid #333;position:relative;}
.maze-tile{width:34px;height:34px;}
/* v0.18.1 (#21): the player/roaming-mob overlay markers -- see screenMaze()'s comment on
   why these are now separate absolutely-positioned elements instead of being baked into
   whichever grid-cell div currently holds them. transition on left/top is what makes
   animateMazeMovers()'s snap-old-position-then-set-new-position trick actually glide. */
.maze-mover{position:absolute;width:34px;height:34px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:16px;pointer-events:none;transition:left .18s linear,top .18s linear;z-index:5;}
.maze-mover-player{background:#e0c96a;}
/* .maze-mover-roamer's background comes from ROAMING_MOB_COLOR inline in screenMaze(), not
   here, so the two never drift out of sync with each other. */
.side-panel{min-width:260px;display:flex;flex-direction:column;gap:8px;}
/* v0.16 (#332): on-screen D-pad for maze navigation, brought back specifically for
   touch/mobile -- keyboard arrow keys (see the maze's keydown handler) already cover
   desktop, and clicking an adjacent tile always works everywhere, so these buttons would
   just be visual clutter on a desktop screen that already has a keyboard. Hidden by
   default; only revealed under the same narrow/touch-oriented media query used nowhere
   else in this file yet, so it never appears at typical desktop browser widths. */
.maze-mobile-arrows{display:none;}
@media (max-width:820px){
  .maze-mobile-arrows{
    display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px;margin-top:6px;
  }
  .maze-mobile-arrows button{width:44px;height:44px;font-size:1.2em;padding:0;}
  /* v0.18 (#15): sitewide minimum comfortable tap-target size on narrow/touch screens --
     the desktop button padding (10px 14px, ~38px tall with this font) is a bit tight for a
     fingertip. min-height only (not a fixed height) so multi-line/wide buttons still grow
     normally; box-sizing:border-box so the min-height includes the existing padding instead
     of adding on top of it. Doesn't touch anything at desktop widths. */
  button{min-height:44px;box-sizing:border-box;}
  .linklike,.chat-toggle{display:inline-block;padding:8px 4px;min-height:44px;box-sizing:border-box;}
  input[type=checkbox]{width:24px;height:24px;}
}
hr{border:none;border-top:1px solid var(--border);margin:14px 0;}
.tooltip{position:relative;cursor:help;border-bottom:1px dotted var(--muted);}
/* v0.18 (#15): mobile UX -- touch devices have no :hover state at all, so a tooltip that
   only ever opened via :hover was completely unreachable on phones/tablets. The .tooltip-open
   class (toggled by a single delegated tap handler near the bottom of the script, see
   closestWithClass()/the document "click" listener) makes tap-to-open work identically to
   hover, on every .tooltip in the game, from this one shared rule. */
.tooltip:hover::after,.tooltip.tooltip-open::after{
  content:attr(data-tip);position:absolute;bottom:120%;left:0;background:#000;color:#fff;
  padding:6px 8px;border-radius:4px;font-size:.8em;white-space:pre-line;width:220px;z-index:10;
  box-shadow:0 2px 8px rgba(0,0,0,.6);
}
/* v0.17.3 (#10): the "Comparison" box shown next to a gear item's normal tooltip (see
   gearCompareWrap()) -- unlike .tooltip above (a single ::after driven by one data-tip
   attribute), this needs real child DOM nodes (a title plus one or two structured stat
   blocks), so it's a plain hidden sibling toggled by :hover on the shared wrapper instead
   of a pseudo-element. Positioned to the right of where the primary tooltip box renders
   (that one is width:220px at left:0 of its OWN element) so the two don't overlap. */
.gear-compare-wrap{position:relative;display:inline-block;}
.gear-compare-wrap .compare-box{
  display:none;position:absolute;bottom:120%;left:225px;background:#000;color:#fff;
  padding:6px 8px;border-radius:4px;font-size:.8em;width:220px;z-index:11;
  box-shadow:0 2px 8px rgba(0,0,0,.6);border:1px solid var(--accent);
}
/* v0.18 (#15): same tap-to-open mobile fix as .tooltip above, same shared handler. */
.gear-compare-wrap:hover .compare-box,.gear-compare-wrap.compare-open .compare-box{display:block;}
/* v0.18.1 (#12): distinctive title for the "Currently Equipped" compare box (was a plain
   bold "Comparison" label) -- uppercase/letter-spaced/accent-colored with its own underline
   so it reads as a clearly different kind of box than the plain black .tooltip beside it. */
.compare-box .compare-title{
  font-weight:bold;color:var(--accent);text-transform:uppercase;font-size:.82em;
  letter-spacing:.04em;margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid var(--border);
}
/* v0.18.1 (#13): Diablo-3-style per-stat delta coloring inside the compare box -- green for
   a stat the hovered item improves on, red for one it falls behind on. */
.compare-box .stat-delta-good{color:var(--good);font-weight:bold;}
.compare-box .stat-delta-bad{color:var(--bad);font-weight:bold;}
.plank-row{display:flex;gap:8px;margin:6px 0;}
.plank-row button.locked-safe{background:#254a25;color:#9fe89f;border-color:#3a7a3a;}
.plank-row button.locked-fail{background:#4a2020;color:#e89f9f;border-color:#7a3a3a;}
.dim-note{color:#8a8676;font-size:.82em;}
.version-tag{position:fixed;bottom:24px;right:12px;color:rgba(230,225,210,.6);font-size:.8em;}
.changelog-link{position:fixed;bottom:8px;right:12px;color:rgba(180,210,150,.75);font-size:.75em;cursor:pointer;text-decoration:none;}
.changelog-link:hover{color:#cbd9a0;text-decoration:underline;}
::-webkit-scrollbar{width:10px;} ::-webkit-scrollbar-thumb{background:#3a4230;border-radius:5px;}
.top-bar{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap;}
.chat-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;color:#cbd9a0;}
.chat-toggle:hover{color:#e8e4d8;}
/* v0.17 (#4): doubled from 25%/280-420px to 50%/560-840px per Gwen's request -- it's an
   optional slide-in overlay the player opens/closes on demand, so covering more of the
   game underneath while it's open is an acceptable tradeoff for a much more readable log. */
.chat-panel{position:fixed;top:0;right:0;height:100vh;width:50%;min-width:560px;max-width:840px;background:var(--panel);border-left:1px solid var(--border);box-shadow:-6px 0 20px rgba(0,0,0,.55);z-index:80;display:flex;flex-direction:column;padding:14px;}
.chat-private-msg{background:#2a3a20;border:1px solid #4a6a3a;border-radius:6px;padding:4px 8px;margin:2px 0;}
.trash-btn{flex:0 0 auto;padding:8px 10px;}
.blocked-icon{opacity:.85;}
.dim-icon{opacity:.4;}
.bar-bg.compact{height:8px;}
.town-quadrants{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;}
.town-quadrants .panel{margin-bottom:0;height:100%;min-width:0;}
.town-quadrants > *{min-width:0;}
.gear-row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.gear-row-actions{display:flex;gap:6px;flex:0 0 auto;}
.rarity-Common{color:#9a9686;} .rarity-Uncommon{color:#e8e4d8;} .rarity-Rare{color:#5a9ae0;} .rarity-Epic{color:#e0c94a;} .rarity-Legendary{color:#d9902f;}
.plank-btn{min-width:52px;}
.plank-btn.safe{background:#254a25;color:#9fe89f;border-color:#3a7a3a;}
.plank-btn.unsafe{background:#4a2020;color:#e89f9f;border-color:#7a3a3a;}
.maze-overlay-grid{position:absolute;top:0;left:0;width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;z-index:20;opacity:1;transition:opacity 1.3s ease;text-align:center;}
.maze-overlay-grid.fade{opacity:0;}
.maze-overlay-text{color:#e8d24a;font-size:1.8em;font-weight:bold;letter-spacing:1.5px;text-shadow:0 0 18px rgba(232,210,74,.6);padding:0 10px;}
/* v0.18.1 (#33): the Venture and Kindle-the-Bonfire cards are meant to line up as a matched
   pair (same width, same rough height) since they sit stacked in the same town quadrant --
   but flex:1 used to live bundled inside .venture-clickable, which the Bonfire card only
   carries while UNkindled (see kindleBonfirePanel()). Once the bonfire was actively kindled
   it lost .venture-clickable (it's no longer clickable -- there's nothing to click), and
   with it lost flex:1, so the card shrank to fit its text instead of matching the Venture
   card's width above it. flex:1 is now its own class (.venture-fill) applied to BOTH cards
   unconditionally, independent of whether a card happens to be clickable right now.
   .venture-card also gets a min-height so the "Logs (N)"/"Area Lv" chevron sidebars (which
   stretch to match their row via .venture-row's align-items:stretch) don't end up two very
   different heights depending on whether the bonfire's longer unkindled description text is
   showing or not. */
.venture-card{padding:18px;display:flex;flex-direction:column;gap:12px;min-height:64px;box-sizing:border-box;}
.venture-title{font-size:1.25em;font-weight:bold;}
.venture-row{align-items:stretch;}
.venture-fill{flex:1;}
.venture-clickable{cursor:pointer;transition:.12s;}
.venture-clickable:hover{background:#28331e;}
.venture-chevrons{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 10px;box-sizing:border-box;}
.venture-chevrons button{padding:2px 10px;font-size:1em;line-height:1;}
.class-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px;position:relative;}
.class-grid>*{min-width:0;}
.class-path-bg{background:var(--panel2);border:1px solid var(--border);border-radius:10px;}
.plank-btn{min-width:52px;border-radius:4px;}
.equip-doll{display:flex;flex-direction:column;gap:6px;}
.equip-doll-row{display:flex;gap:6px;justify-content:center;}
.equip-doll-row>.tile{flex:1;min-width:0;}
.attr-collapse-btn{background:none;border:none;color:var(--text);cursor:pointer;font-size:1.1em;padding:2px 6px;}
.attr-collapse-btn:hover{color:#cbd9a0;}
.stat-point-cta{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:var(--gold);color:#2a2210;font-weight:bold;border-radius:5px;cursor:pointer;font-size:1.1em;line-height:1;}
.stat-point-cta:hover{background:#f0c85a;}

/* v0.16.1: onboarding restyle (#345) -- scoped entirely to the pre-login "Play Online"
   gate + Log In/Create Account forms (screenAuthGate()/authForm(), see authHeader() etc.
   below), matching the calmer, more polished palette+type from redirect.html (the
   marketing landing page) instead of the main game's busier in-session look. This is a
   deliberate first-impression choice for strangers clicking in fresh off itch.io/Battle.
   net/d2jsp -- nothing here touches the shared button/input/.panel rules the rest of the
   game still relies on. */
.auth-page{
  position:fixed; inset:0; z-index:1; overflow-y:auto;
  background:#212c1b; color:#e8dfc8;
  font-family:'Merriweather',Georgia,serif;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
}
.auth-card{width:760px; max-width:100%;}
.auth-header{display:flex; align-items:center; margin-bottom:24px;}
.auth-logo{
  width:72px; height:72px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; margin-right:18px; flex:none; overflow:hidden;
}
.auth-logo svg{width:100%;height:100%;}
.auth-title{font-family:'Cinzel',serif; font-size:2.6rem; color:#fff; line-height:1.1; margin:0;}
.auth-subtitle{color:#d8b566; margin-top:6px; font-family:'Merriweather',Georgia,serif; font-size:1.05em;}
.auth-panel{border:1px solid rgba(214,194,133,.22); border-radius:10px; background:rgba(0,0,0,.15); padding:28px;}
.auth-panel h2{font-family:'Cinzel',serif; margin:0 0 14px; color:#fff; font-size:1.5em;}
.auth-panel p{line-height:1.7; margin:0 0 24px; color:#cfc6af;}
.auth-cta{
  display:block; width:100%; text-align:center; padding:16px 18px; background:#2f3a24;
  border:1px solid rgba(214,194,133,.28); border-radius:8px; color:#fff; font-weight:bold;
  font-family:'Merriweather',Georgia,serif; font-size:1em; cursor:pointer; transition:.15s;
}
.auth-cta:hover:not(:disabled){background:#3a492c; border-color:#d6c285;}
.auth-cta.secondary{background:transparent; font-weight:normal;}
.auth-cta.secondary:hover:not(:disabled){background:rgba(214,194,133,.08);}
.auth-input{
  width:100%; background:#1b2417; border:1px solid rgba(214,194,133,.28); color:#e8dfc8;
  border-radius:6px; padding:13px 14px; font-family:'Merriweather',Georgia,serif; font-size:.95em;
}
.auth-input:focus{outline:none; border-color:#cda95d; box-shadow:0 0 0 2px rgba(205,169,93,.25);}
.auth-input:-webkit-autofill,.auth-input:-webkit-autofill:hover,.auth-input:-webkit-autofill:focus{
  -webkit-text-fill-color:#e8dfc8!important;
  -webkit-box-shadow:0 0 0px 1000px #1b2417 inset!important;
  box-shadow:0 0 0px 1000px #1b2417 inset!important;
  transition:background-color 9999s ease-in-out 0s;
  caret-color:#e8dfc8;
}
.auth-divider{flex:1; height:1px; background:rgba(214,194,133,.25);}
.auth-back{color:#d8b566; cursor:pointer; text-decoration:underline; font-size:.9em;}
.auth-back:hover{color:#e8dfc8;}
.auth-footer{text-align:center; color:#8f917d; margin-top:20px; font-size:.9em;}
.auth-footer .auth-back{color:#8f917d;}
.auth-footer .auth-back:hover{color:#d8b566;}
.auth-status{min-height:1.3em; color:#e0a870; font-size:.88em;}
</style>

/* Procedurally-generated monster portraits (placeholder art, swap in bespoke assets any time
   by replacing monsterPortrait() with a lookup into a real MONSTER_PORTRAITS map). Deterministic
   per monster id so the same monster always looks the same; a "slain" variant is derived from
   the same shape with X eyes, a lolling tongue, and a dizzy swirl for the post-combat view. */
function hashHue(str){ let hh=0; for(let i=0;i<str.length;i++) hh=(hh*31+str.charCodeAt(i))>>>0; return hh%360; }
function monsterPortrait(monsterId, opts={}){
  const slain=!!opts.slain;
  const hue=hashHue(monsterId||"?");
  const bodyColor=`hsl(${hue},45%,38%)`;
  const bellyColor=`hsl(${hue},35%,58%)`;
  const eyes = slain
    ? `<path d="M55,75 L70,90 M70,75 L55,90" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/><path d="M90,75 L105,90 M105,75 L90,90" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>`
    : `<circle cx="62" cy="80" r="7" fill="#1a1a1a"/><circle cx="98" cy="80" r="7" fill="#1a1a1a"/><circle cx="64" cy="78" r="2" fill="#fff"/><circle cx="100" cy="78" r="2" fill="#fff"/>`;
  const mouth = slain
    ? `<path d="M65,103 Q80,98 95,103" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="80" cy="112" rx="6" ry="9" fill="#c96a6a"/>`
    : `<path d="M65,105 Q80,116 95,105" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const dizzy = slain
    ? `<path d="M58,48 Q68,38 78,48 Q88,58 98,48" stroke="#e0c94a" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85"/><circle cx="58" cy="46" r="2.2" fill="#e0c94a"/><circle cx="98" cy="46" r="2.2" fill="#e0c94a"/>`
    : "";
  return `<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg"><ellipse cx="80" cy="95" rx="55" ry="48" fill="${bodyColor}"${slain?' opacity="0.7"':''}/><ellipse cx="80" cy="107" rx="34" ry="26" fill="${bellyColor}" opacity="0.6"/>${dizzy}${eyes}${mouth}</svg>`;
}

/* Procedural placeholder art for potions/scrolls/bags, each item id gets its own hue so
   different items (and different tiers of the same base type) read as visually distinct.
   Swap these for real art any time; nothing else needs to change. */
function itemIconSvg(itemId){
  const item=DL.getItem(itemId);
  const hue=hashHue(itemId);
  if(item.type==="consumable"){
    const liquid=`hsl(${hue},70%,52%)`;
    return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><rect x="16" y="4" width="8" height="6" rx="1" fill="#8a8a8a"/><path d="M15,10 L15,17 Q9,22 9,29 Q9,36 20,36 Q31,36 31,29 Q31,22 25,17 L25,10 Z" fill="#cfe6ee" stroke="#7a9aa8" stroke-width="1.5"/><path d="M10,25 Q9,33 20,34 Q31,33 30,25 Q31,31 20,32 Q9,31 10,25 Z" fill="${liquid}"/></svg>`;
  }
  if(item.type==="scroll"){
    const ribbon=`hsl(${hue},60%,45%)`;
    return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="14" width="28" height="12" rx="6" fill="#e8d9b0" stroke="#a8946a" stroke-width="1.5"/><rect x="4" y="14" width="6" height="12" rx="3" fill="#d8c090"/><rect x="30" y="14" width="6" height="12" rx="3" fill="#d8c090"/><rect x="10" y="18" width="20" height="2" fill="${ribbon}"/></svg>`;
  }
  if(item.type==="bag"){
    const cloth=`hsl(${hue},35%,42%)`;
    return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M12,16 Q20,10 28,16 L30,34 Q20,38 10,34 Z" fill="${cloth}" stroke="#2a2a2a" stroke-width="1.2"/><rect x="17" y="9" width="6" height="6" rx="2" fill="none" stroke="#c9a04a" stroke-width="1.5"/></svg>`;
  }
  return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="14" fill="#666"/></svg>`;
}
function itemIcon(itemId,size=26){ return iconBadge(itemIconSvg(itemId),size); }

function herbIconSvg(herbId){
  const hue=hashHue(herbId);
  const leaf=`hsl(${hue},55%,42%)`;
  return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M20,6 Q32,14 32,26 Q20,34 8,26 Q8,14 20,6 Z" fill="${leaf}" stroke="#2a2a2a" stroke-width="1.2"/><path d="M20,9 L20,31" stroke="#1a1a1a" stroke-width="1" opacity="0.45"/></svg>`;
}
function herbIcon(herbId,size=22){ return iconBadge(herbIconSvg(herbId),size); }

/* Procedural placeholder art for equippable gear, shape varies by slot type, color
   follows the Diablo-style rarity palette (grey/white/blue/yellow/gold) so different
   tiers and rarities of the same base item read as visually distinct at a glance. */
const RARITY_ICON_COLORS={Common:"#9a9686",Uncommon:"#e8e4d8",Rare:"#5a9ae0",Epic:"#e0c94a",Legendary:"#d9902f"};
function gearIconSvg(inst){
  const color=RARITY_ICON_COLORS[inst.rarity]||"#9a9686";
  const shapes={
    weapon:`<path d="M20,6 L24,10 L15,32 L11,28 Z" fill="${color}" stroke="#222" stroke-width="1.2"/><rect x="9" y="27" width="8" height="4" rx="1" fill="#5a4028" transform="rotate(-40 13 29)"/>`,
    head:`<path d="M8,22 Q8,8 20,8 Q32,8 32,22 L32,24 L8,24 Z" fill="${color}" stroke="#222" stroke-width="1.2"/><rect x="8" y="22" width="24" height="4" fill="#222" opacity="0.3"/>`,
    shoulders:`<circle cx="13" cy="16" r="8" fill="${color}" stroke="#222" stroke-width="1.2"/><circle cx="27" cy="16" r="8" fill="${color}" stroke="#222" stroke-width="1.2"/>`,
    armor:`<path d="M12,10 L28,10 L31,18 L26,34 L14,34 L9,18 Z" fill="${color}" stroke="#222" stroke-width="1.2"/>`,
    pants:`<path d="M14,8 L26,8 L27,32 L21,32 L20,18 L19,32 L13,32 Z" fill="${color}" stroke="#222" stroke-width="1.2"/>`,
    gloves:`<path d="M12,18 L12,10 L16,10 L16,16 L18,16 L18,8 L22,8 L22,16 L24,16 L24,10 L28,10 L28,20 Q28,30 20,32 Q12,30 12,18 Z" fill="${color}" stroke="#222" stroke-width="1.2"/>`,
    boots:`<path d="M15,6 L25,6 L25,22 L31,26 L31,32 L11,32 L11,20 L15,20 Z" fill="${color}" stroke="#222" stroke-width="1.2"/>`,
    ring:`<circle cx="20" cy="20" r="11" fill="none" stroke="${color}" stroke-width="4.5"/><circle cx="20" cy="10" r="3" fill="${color}"/>`,
    amulet:`<path d="M20,6 L20,14" stroke="${color}" stroke-width="2.5"/><circle cx="20" cy="22" r="9" fill="${color}" stroke="#222" stroke-width="1.2"/><circle cx="20" cy="22" r="3.5" fill="#222" opacity="0.35"/>`,
    belt:`<rect x="6" y="16" width="28" height="8" rx="2" fill="${color}" stroke="#222" stroke-width="1.2"/><rect x="17" y="15" width="6" height="10" fill="#222" opacity="0.4"/>`,
  };
  const body=shapes[inst.slot]||`<circle cx="20" cy="20" r="14" fill="${color}"/>`;
  return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
}
// v0.18 (#13): I-V Roman-numeral tier badges, tucked in the upper-left corner of every
// gear icon (and therefore every square gear tile that renders one -- Vault, Backpack,
// Equipped doll, Merchant/Blacksmith stock rows, Auction House listings, the item-drop
// floating overlay, the Gambling Goblin reveal, etc.), so a tier is readable at a glance
// without needing to hover the tooltip.
const TIER_ROMAN_NUMERALS=["","I","II","III","IV","V"];
function tierRomanNumeral(tier){ return TIER_ROMAN_NUMERALS[tier]||String(tier); }
function gearIcon(inst,size=30){
  const badge=iconBadge(gearIconSvg(inst),size);
  return h("div",{class:"gear-icon-wrap",style:{position:"relative",width:size+"px",height:size+"px",flex:"none"}},[
    badge,
    h("div",{class:"gear-tier-badge"},[tierRomanNumeral(inst.tier)]),
  ]);
}

/* ---------- BALANCE ---------- */

const Balance = {
  LEVEL_CAP:60, KILLS_PER_LEVEL_TARGET:20, MONSTER_BASE_XP:8.0, AREA_XP_GROWTH:0.062,
  // v0.13: xpRequiredForLevel used to reuse AREA_XP_GROWTH (the same curve monster XP
  // rewards scale by area level with), which meant a level-28 character farming a level-1
  // area was only ever a modest ~5x behind what level 29 demanded -- cheap enough that
  // overleveled players could sit in trivial areas indefinitely. LEVEL_XP_GROWTH is now
  // its own, steeper constant so the per-level requirement climbs much faster than any
  // fixed-area monster's reward ever will, without touching area-based combat/loot
  // balance at all (see xpRequiredForLevel/monsterXpReward below -- they're independent).
  LEVEL_XP_GROWTH:0.11,
  AREA_LEVEL_MIN:1, AREA_LEVEL_MAX:100, AREA_HP_GROWTH:0.15, AREA_DAMAGE_GROWTH:0.12, AREA_LOOT_GROWTH:0.05,
  // v0.11 difficulty pass: combat was too easy (1-3 shotting things several area levels
  // above character level with only common gear). MONSTER_HP_MULT/MONSTER_DAMAGE_MULT
  // double every monster's level-1 baseline in one place (rather than editing each row
  // in MONSTERS below), and AREA_HP_GROWTH/AREA_DAMAGE_GROWTH more than doubled on top of
  // that, so venturing several area levels above your own level gets punishing fast.
  // This is a first pass, expect further tuning as real playtesting comes in.
  MONSTER_HP_MULT:2.0, MONSTER_DAMAGE_MULT:2.0,
  // v0.17.3 (#9): Gwen's report (backed by streamer VODs) was that Tier 2 players -- area
  // level 10 and up -- with barely any gear (a rare piece or two, maybe one legendary) were
  // one/two-shotting mobs of their own level with no need to regen or drink potions. Built
  // balance_sim.js (a Node harness that plays the REAL combat formulas hundreds of times
  // against a character leveled 1-N with modest randomly-generated gear via the real game
  // code -- see that file) to check this rather than guess, and it confirmed the complaint:
  // at area level 10 pre-patch, win rates were regularly 90-100% with 20-45% of wins landing
  // in 1-2 hits and 65-90% of max HP still left standing afterward. Gwen's proposed fix was
  // "+10% extra HP/damage per level, on top of the existing curve, starting at level 10" --
  // asked for a gut check rather than blind implementation.
  // Verdict: the 10%/level figure itself is approved, but my first implementation applied
  // it as COMPOUNDING growth (1.10^levelsPastStart, matching the style of every other
  // *_GROWTH constant below) and balance_sim.js caught that overshooting badly: by area
  // level 20 an EQUAL-level character (same test Gwen asked for, own level vs same-level
  // mobs -- not overleveled content) was down to a 0-40% win rate depending on class, and it
  // only gets worse from there since players commonly keep leveling well past 10 within a
  // single class tier before attempting the next Broken Bridge Trial. That's a much bigger
  // swing than "stop Tier 2 from feeling trivial" called for. Shipped as flat/additive growth
  // instead -- see lateGameMonsterGrowthMult() below -- which still delivers a real, steadily
  // rising difficulty curve (2.1x extra by level 20, 6.1x by level 60) without the runaway
  // explosion. Re-run balance_sim.js any time this needs revisiting; it's a permanent
  // fixture now, not a one-off script.
  LATE_GAME_MONSTER_GROWTH_START_LEVEL:10, LATE_GAME_MONSTER_GROWTH_PER_LEVEL:0.10,
  CRIT_MULTIPLIER:1.75,
  // v0.14: fleeing combat isn't a guaranteed clean exit anymore -- a 20% chance the
  // monster gets one more hit in (same block-chance/armor math as a normal monster turn)
  // before you can try to flee again. Bad luck can fail several times in a row; nothing
  // caps the number of attempts.
  FLEE_FAIL_CHANCE:0.20,
  // v0.14: the 5 new Alchemist stat-buff potions (Might/Swiftness/Intellect/Wardveil/
  // Renewal) all last the same 10 minutes, real time -- same wall-clock pattern as the
  // Bonfire's kindled bonus (see PS.applyTempBuff/getActiveTempBuff).
  POTION_BUFF_DURATION_MS:10*60*1000,
  // v0.12: softcore death used to cost a flat, gentle 10% of gold and nothing else. Then
  // it became a real setback: 30-60% of gold, plus a decent chance of losing gear too (see
  // PS.applyDeathPenalty/_rollDeathItemLosses below for the exact odds).
  // v0.17 (#29): gold is now ACCOUNT-BOUND -- a single softcore death used to cost 30-60%
  // of just THAT character's own stash, but now the exact same percentage would cost 30-60%
  // of the ENTIRE account's shared wealth (every other character's gold too), which is a
  // much harsher penalty than originally intended for a single death. Per Gwen's explicit
  // decision to reduce (not remove) the penalty once gold is shared, this drops to 10-20% --
  // still a real, felt setback on every death, but proportionate to hitting the whole
  // account's pool instead of one character's private stash.
  DEATH_GOLD_LOSS_MIN_PCT:0.10, DEATH_GOLD_LOSS_MAX_PCT:0.20,
  DEATH_ITEM_LOSS_CHANCE:0.50, DEATH_EQUIPPED_LOSS_WEIGHT:0.20, DEATH_BACKPACK_LOSS_WEIGHT:0.30,
  DEATH_ITEM_LOSS_MAX_COUNT:6,
  // v0.13: a softcore death also costs some experience progress -- 10% of the xp needed
  // to reach your NEXT level (not your total lifetime xp), floored at 0/xp_to_next so it
  // can never go negative or eat into an already-earned level. Waking up at 1 HP (not a
  // full heal) is also new this version, matching Gwen's "knocked out, not rested" note.
  DEATH_XP_LOSS_PCT:0.10, DEATH_WAKE_HP:1,
  // v0.17.2 (#3) HOTFIX: more grass (more places monster encounters can actually trigger,
  // since encounters only ever fire on grass -- see onStepMaze()'s cell.type==="grass"
  // gate), plus a slightly higher per-step chance on those grass tiles. GRASS_PATCH_COUNT
  // 18->26 (each patch is still 3-6 tiles, see the patch-growing loop below) and
  // ENCOUNTER_CHANCE_PER_STEP 0.12->0.15.
  ENCOUNTER_CHANCE_PER_STEP:0.15, TRAP_CHANCE_PER_TILE:0.05,
  OBSTACLE_DENSITY:0.25, GRASS_PATCH_COUNT:26,
  // Independent per-tile roll chances (a 20x10 maze = 200 tiles), replacing the old
  // fixed-count-per-maze model: chest 0.05% (~1 chest per 10 mazes), herb 0.20%
  // (~1 per 2.5 mazes), shrine 0.10% (~1 per 5 mazes), trapdoor 0.5% (~1 per maze).
  MAZE_CHEST_CHANCE_PER_TILE:0.0005,
  // v0.17.1 (#12): shrine spawn chance roughly doubled (0.001 -> 0.002, ~1 per 2.5 mazes
  // instead of ~1 per 5) now that there are 5 possible shrine outcomes instead of 2 -- so
  // players actually run into (and learn about) the 3 new shrine types at a reasonable
  // clip, instead of them being buried under 5x rarer odds of the same total shrine rate.
  MAZE_SHRINE_CHANCE_PER_TILE:0.002,
  MAZE_HERB_CHANCE_PER_TILE:0.002, MAZE_TRAPDOOR_CHANCE_PER_TILE:0.005,
  // v0.18.2 (#6): non-moving critter encounters -- a small, harmless creature you can
  // squash (Forest Reputation -1, see PS.adjustForestReputation()) or spare (+1). Rolled in
  // the same per-tile sequence as chest/shrine/herb/trapdoor above, at roughly the same
  // rarity as a shrine.
  MAZE_CRITTER_CHANCE_PER_TILE:0.002,
  // v0.18.2 (#6): "1 strike = dead" per Gwen's spec -- kept as its own named constant (not a
  // literal 1) specifically so a future patch can make tougher critters take more hits
  // ("so we can increase the squash count later"), reusing the exact same
  // hits_done/hits_required progress-bar pattern chests already use, without touching the
  // screen's rendering code at all.
  CRITTER_HITS_REQUIRED:1,
  // v0.18.2.1 CORRECTION: Gwen's original spec described a flat "+10 XP per point" bonus,
  // but the intent was actually a PERSISTENT PERCENTAGE buff -- +10% experience gained on
  // every kill for as long as you're exploring that tier's forest, per point of POSITIVE
  // Forest Reputation, stacking multiplicatively on top of (not replacing) every other XP
  // multiplier (Community XP, shrines, gear XP Find). Negative reputation never reduces XP;
  // see PS.getForestReputationXpMult()/getForestReputationExtraRoamers() for how each
  // direction is actually spent.
  FOREST_REPUTATION_XP_PCT_PER_POINT:10,
  STAMINA_MAX_BASE:100.0, STAMINA_COST_PER_STEP:1.0,
  SHRINE_STAMINA_BUFF_PCT:1.0, SHRINE_XP_BUFF_MULT:1.5, SHRINE_XP_BUFF_ENCOUNTERS:20,
  // v0.17.1 (#12): three new shrine types, each an even 1-in-5 outcome alongside the
  // existing Stamina/XP shrines (see onStepMaze()'s "shrine" case). Invulnerability and
  // Quad Damage are both COMBAT-ROUND-scoped (not wall-clock) per Gwen's exact spec --
  // they tick down once per exchange of blows, not per second, so a long walk back to town
  // doesn't burn them and a fast, back-to-back string of fights does. Magic Find instead
  // uses the same wall-clock temp-buff pattern as the stat potions (Alchemist), since it
  // affects loot rolls (chests, kills) rather than anything round-based.
  SHRINE_INVULN_ROUNDS:15, SHRINE_QUAD_DAMAGE_ROUNDS:15,
  SHRINE_MAGIC_FIND_PCT:25, SHRINE_MAGIC_FIND_DURATION_MS:10*60*1000,
  // v0.17 (#368): replaced the old flat "(4-12) * areaLevel" trap damage formula -- which
  // scaled linearly hard enough to hit 40-120 damage at area level 10, capable of one-
  // shotting a mid-progress character out of nowhere ("snipe, out" per Gwen's report) --
  // with a gentler 20%-COMPOUNDING-per-level curve (see trapDamage() below). A level-1 trap
  // still hits for roughly the same 8-12, but growth is now ~x1.2 per level instead of
  // scaling by the raw area number, e.g. ~10/12/15/18/22/26/31 avg at levels 1-7.
  TRAP_DAMAGE_MIN:8.0, TRAP_DAMAGE_MAX:12.0, TRAP_DAMAGE_GROWTH_PER_LEVEL:0.20, TRAP_STAMINA_LOSS:20.0,
  // v0.17 (#369): the ankle-bite trap used to poison on literally every non-lethal hit,
  // regardless of area level -- player reports said this made poison (and needing to
  // stockpile Antidotes / chase Poison Resistance gear) feel oppressive even at the very
  // start of the game. Poison now simply can't happen at all below area level 6, and even
  // from level 6 on only has a per-hit chance to actually take hold (see
  // Balance.trapShouldPoison()), giving new players real time to prepare before it becomes
  // a factor.
  POISON_TRAP_MIN_AREA_LEVEL:6, POISON_TRAP_CHANCE_FROM_MIN_LEVEL:0.35,
  // v0.18.1 (#28): the poison drain tick used to apply a whole second's worth of damage in
  // one lump every 1000ms, which made the HP bar visibly SNAP downward once a second instead
  // of draining smoothly -- same jarring effect the Health/Stamina Potion heal-over-time
  // ticks deliberately avoid by sub-ticking at a much finer interval (see
  // POTION_HEAL_TICK_MS). POISON_TICK_MS mirrors that same 200ms/5x-per-second cadence so
  // PS.getPoisonHpPerSec()'s total HP-per-second gets spread across 5 small sub-ticks
  // instead of landing all at once.
  POISON_TICK_MS:200,
  // v0.17 (#11): monsters now get a flat chance to block a player's attack outright (no
  // damage dealt that swing), scaling gently with area level -- see Balance.mobBlockChance().
  // 5% at area level 1, +0.5 percentage points per level above that (6.5% at level 4, etc).
  MOB_BLOCK_CHANCE_BASE:0.05, MOB_BLOCK_CHANCE_PER_LEVEL:0.005,
  // v0.17 (#16): 50% chance, once per NEW encounter, that the monster gets an unavoidable
  // first strike before the player can act at all -- similar in spirit to a trap ambush.
  // Rationale (Gwen's): always striking first over-rewards burst/one-two-punch damage
  // builds, since a fast kill denies the monster any chance to hit back at all. Floors at
  // 1 HP (never lethal by itself, matching the trapdoor's fall-damage convention) since it
  // fires from ensureCombat(), which runs during render() before any DOM exists -- not a
  // safe place to trigger the full GF.goto-based death/redirect flow the way a button
  // click can. The player still gets a normal turn to Attack/use an item/Flee right after.
  MONSTER_FIRST_STRIKE_CHANCE:0.5,
  CHEST_LOOT_MULTIPLIER:2.5, CHEST_SCROLL_CHANCE:0.12, CHEST_HITS_MIN:3, CHEST_HITS_MAX:5,
  // v0.12: Stronghold -- one guaranteed 3x3 structure per maze (center: a locked chest,
  // guarded on all 4 orthogonal sides by a tough "guardian" monster, decorative broken-
  // fencing on the 4 diagonal corners that's fully walkable so the chest can never be
  // soft-locked). STRONGHOLD_GUARDIAN_HP_MULT applies on top of the normal per-area-level
  // monster HP curve; guardian damage is left at the normal per-area rate on purpose.
  // v0.17 (#18): guardians used to grant the same XP as an ordinary monster of that area
  // level despite being 3x the HP and meaningfully tougher to actually kill -- now worth
  // extra XP, applied directly on the combat object's `xp` field in ensureCombat().
  // v0.17.2 (#1) HOTFIX: v0.17's 4x guardian XP multiplier was overtuned -- a quick balance
  // check from ImpulseBE found it handed out way more XP than intended relative to the
  // fight's actual difficulty. Reverted down to 1.5x (still a real reward over an ordinary
  // monster of the same area level, just not the runaway 4x).
  // v0.17.2 (#2) HOTFIX: a Stronghold used to be a 100% guaranteed spawn on EVERY maze,
  // which made them feel routine rather than a special find. Reduced to a 40% chance per
  // maze -- see generateMaze()'s roll before calling placeStronghold().
  STRONGHOLD_SPAWN_CHANCE:0.40,
  // v0.18.2 (#2): tripled from 0.05 -- Strongholds themselves became 2.5x rarer to even
  // find back in v0.17.2 (100% -> 40% spawn chance per maze, see STRONGHOLD_SPAWN_CHANCE
  // above), so even with this same 5% per-guardian-kill roll, keys had effectively become
  // much scarcer overall. Bumping the roll itself compensates directly.
  STRONGHOLD_GUARDIAN_HP_MULT:3.0, STRONGHOLD_GUARDIAN_XP_MULT:1.5, STRONGHOLD_KEY_DROP_CHANCE:0.15,
  // v0.18 (#2): roaming mobs -- unlike a Stronghold guardian (fixed tile, only engages if
